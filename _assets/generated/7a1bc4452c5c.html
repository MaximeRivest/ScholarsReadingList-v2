alex.org/W1986747438 | https://openalex.org/W1988179012 | https://openalex.org/W1990482747 | https://openalex.org/W1993311906 | https://openalex.org/W1994155186 | https://openalex.org/W2064930232 | https://openalex.org/W2065086108 | https://openalex.org/W2070134231 | https://openalex.org/W2072668769 | https://openalex.org/W2073667026 | https://openalex.org/W2082302821 | https://openalex.org/W2105669749 | https://openalex.org/W2114004260 | https://openalex.org/W2119906240 | https://openalex.org/W2129688035 | https://openalex.org/W2162002392 | https://openalex.org/W2162035079 | https://openalex.org/W2163033485 | https://openalex.org/W2171613935 | https://openalex.org/W2172186242 | https://openalex.org/W2172375654 | https://openalex.org/W2302683059", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2100152071", null, "http://www.cropj.com/hu_7_9_2013_1270_1276.pdf", null, "Agronomic traits affected by dwarfing gene 'Rht-5' in common wheat ('Triticum aestivum' L.)", "article", "en", "2013-08-01", 2013, "Bachir Goudia Daoura | Liang Chen | Yin‐Gang Hu", "- | https://orcid.org/0000-0002-7507-3947 | https://orcid.org/0000-0002-1831-6375", null, null, null, "Australian Journal of Crop Science", "Southern Cross Publishing", "1835-2693", "7", "9", "1270–1276", "Investigating the genetic effects of dwarfing gene Rht-5 on plant height and other agronomic traits in common wheat is important for its proper use in wheat breeding program. In this study, the effects of dwarfing Rht5 on agronomic traits in wheat were evaluated in the F2 population and forty F2:F3 lines derived from a cross between Ningchun10 (rh5) and Marfed M (Rht5) along with the two parents (Ningchun10 and Marfed M). The genotypes of F2 individuals were identified using SSR marker BARC 102 linked with Rht5, and the dwarf and tall individuals were selected to compose the F2:3 lines. Analysis of variance in the F2 populaion and F2:3 lines indicated highly significant differences among individuals or lines for all of traits studied, except for biomass, grain yield and harvest index. In general, dwarfing gene Rht-5 was associated with a plant height reduction of 23.16%, delaying heading date and maturity, increasing the number of fertile tillers plant-1, while reducing the number of spikelets spike-1 and number of grains spike-1. Earlier heading date, longer spike, more spikelets spike-1, and more grains spike-1 could be observed in the dwarf lines when compared to the dwarf parent. Plant height showed positive and highly significant correlation with peduncle length (0.86), spike length (0.76), number of spikelets spike1 (0.56) and number of grain spike-1 (0.42), but negative and highly significant correlation with number of fertile tillers plant-1 (-0.30) and heading date (-0.71). The results obtained could be helpful for the proper use of dwarfing gene Rht-5 in breeding programs to improve lodging tolerance and yield potential in wheat.", "Dwarfing | Biology | Agronomy | Common wheat | Grain yield | Peduncle (anatomy) | Population | Horticulture | Gene | Genetics | Chromosome", "Wheat and Barley Genetics and Pathology", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 16, 22, "https://openalex.org/W1487508986 | https://openalex.org/W1489356280 | https://openalex.org/W1558897642 | https://openalex.org/W1591550457 | https://openalex.org/W1918624142 | https://openalex.org/W1974670959 | https://openalex.org/W1985675342 | https://openalex.org/W2000066966 | https://openalex.org/W2006573693 | https://openalex.org/W2014723966 | https://openalex.org/W2026530991 | https://openalex.org/W2033481996 | https://openalex.org/W2034638186 | https://openalex.org/W2063247458 | https://openalex.org/W2070409412 | https://openalex.org/W2082693010 | https://openalex.org/W2093096061 | https://openalex.org/W2093434134 | https://openalex.org/W2109228066 | https://openalex.org/W2153762692 | https://openalex.org/W2166570455 | https://openalex.org/W2259133480", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2101258662", null, "http://dergipark.gov.tr/tbtkagriculture/issue/11626/138493", null, "Apple Chlorotic Leaf Spot Virus (ACLSV) Status in Turkey and Sensitive Detection Using Advanced Techniques", "article", "en", "2005-04-01", 2005, "C. Ulubaş | Filiz Ertunç", "- | https://orcid.org/0000-0002-0557-6119", null, null, null, "DergiPark (Istanbul University)", "Istanbul University", null, "29", "4", "251–257", "The prevalence of apple chlorotic leaf spot virus (ACLSV) was investigated in all the main stone fruit growing areas of Turkey except for East Anatolia. Three hundred and sixty-nine plant samples showing virus related symptoms were collected from sweet and sour cherry, peach, nectarine, apricot and plum trees. All samples were tested using DAS-ELISA and reverse transcription-polymerase chain reaction (RT-PCR). Thirteen samples were detected as infected with ACLSV using ELISA while RT-PCR revealed 51 positive samples. The highest ACLSV incidence was in Bursa (64%), followed by Yalova (20.51%), Burdur (18.18%), Amasya (13.43%), Afyon (12.07%), Isparta (6.25%), Çanakkale (4.76%) and İzmir (2.72%). Among the collected stone fruit species, nectarine was the most infected species, followed by apricot, peach, sour cherry, plum and sweet cherry. Some ACLSV isolates were used for the adoption of an immuno capture (IC) RT-PCR system. ACLSV infected plant sap diluted up to 1:10 was detected by IC-RT-PCR. The successful application of RT-PCR and IC-RT-PCR for the accurate and sensitive detection of ACLSV was reported in stone fruit trees in Turkey.", "Biology | Horticulture | Veterinary medicine | Medicine", "Plant Virus Research Studies", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 16, 25, "https://openalex.org/W649699322 | https://openalex.org/W1241971583 | https://openalex.org/W1492865470 | https://openalex.org/W1966860170 | https://openalex.org/W1969893775 | https://openalex.org/W1993485977 | https://openalex.org/W2011736763 | https://openalex.org/W2022283453 | https://openalex.org/W2023101310 | https://openalex.org/W2047546869 | https://openalex.org/W2059713212 | https://openalex.org/W2060177882 | https://openalex.org/W2070201579 | https://openalex.org/W2089302245 | https://openalex.org/W2093970211 | https://openalex.org/W2103970885 | https://openalex.org/W2138130761 | https://openalex.org/W2219242280 | https://openalex.org/W2589623697 | https://openalex.org/W2589809576 | https://openalex.org/W2589913694 | https://openalex.org/W2590002203 | https://openalex.org/W2590703317 | https://openalex.org/W2590914620 | https://openalex.org/W2591461546", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2993189956", null, "http://ijdo.ssu.ac.ir/files/site1/user_files_b889fb/dara-A-10-3-29-5719fc9.pdf", null, "The Effect of Teucrium Polium Boiled Extract in Diabetic Rats", "article", "en", "2010-04-10", 2010, "Ali Reza Vahidi | Mohammad Hossein Dashti-Rahmatabadi | Seyyed Majid Bagheri", "- | - | https://orcid.org/0000-0003-0107-7141", null, "Shahid Sadoughi University of Medical Sciences and Health Services", "IR", "Iranian journal of diabetes and obesity", "Shahid Sadoughi University of Medical Sciences", "2008-6792", "2", "2", "27–32", "OBJECTIVE: In traditional medicaments, Teucrium Polium is used as anti-fungal, antibacterial, anti-inflammatory and antidiabetic. Modern researches have shown that use of T. polium in vitro leads to decrease in fatty acids. To confirm the anti-diabetic evidences of Teucrium polium this survey was done to evaluate the effect of boiled aqueous extract of T. polium on serum lipids, body weight and glucose, aspartate aminotransferase (AST), alanine aminotransferase (ALT), alkaline phosphatase (ALP), and Creatinine (CRT) in diabetic male rats. MATERIALS AND METHODS: 20 male rats became diabetic by intraperitoneal injection of streptozotocin (60 mg/kg). The animals were divided randomly into two groups. The aerial parts of Teucrium polium was powdered, drenched and boiled. The experimental diabetic groups received this boiled extract (2% and 4%) freely for two weeks but the control group received tap water. Liver enzymes and biochemical parameters (cholesterol, triglyceride, glucose, alanine transaminase, aspartate transaminase, alkaline phosphatase, urea and Uric Acid) were measured by kinetic (Enzymatic) and colorimetric methods. RESULTS: Our results showed that 4% dose of T. polium can decrease serum glucose and triglyceride significantly (P < 0.05), but cholesterol, urea, U Acid, ALT, AST and CRT were not significant between the test and control groups after using T. polium. 2% concentration of T. polium does not have any effect except on body weight. CONCLUSION: Although the aqueous extract of Teucrium polium has hypoglycemic properties and can improve body weight in experimental animals, it seems that it does not have any effect on other factors and is not suitable as an alternative treatment.", "Alkaline phosphatase | Triglyceride | Aspartate transaminase | Alanine transaminase | Diabetes mellitus | Creatinine | Urea | Uric acid | Medicine | Internal medicine | Streptozotocin | Traditional medicine | Cholesterol | Endocrinology | Chemistry | Enzyme | Biochemistry", "Phytochemistry and Biological Activities", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 16, 31, "https://openalex.org/W56380595 | https://openalex.org/W111937132 | https://openalex.org/W130334514 | https://openalex.org/W1013343087 | https://openalex.org/W1970279207 | https://openalex.org/W1974630185 | https://openalex.org/W1982413319 | https://openalex.org/W1982452811 | https://openalex.org/W1982909140 | https://openalex.org/W1992445603 | https://openalex.org/W2000488263 | https://openalex.org/W2011469832 | https://openalex.org/W2011847042 | https://openalex.org/W2016224409 | https://openalex.org/W2017701868 | https://openalex.org/W2030665012 | https://openalex.org/W2051563460 | https://openalex.org/W2052911866 | https://openalex.org/W2056195822 | https://openalex.org/W2084429389 | https://openalex.org/W2086276357 | https://openalex.org/W2090912233 | https://openalex.org/W2097179438 | https://openalex.org/W2120461607 | https://openalex.org/W2127479049 | https://openalex.org/W2132196235 | https://openalex.org/W2134491953 | https://openalex.org/W2168155462 | https://openalex.org/W2188792807 | https://openalex.org/W2227620030 | https://openalex.org/W2298072103", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W80004159", null, "http://journalarticle.ukm.my/7426/1/41_1_9.pdf", null, "VEGETATION PROFILE OF THE FIREFLY HABITAT ALONG THE RIPARIAN ZONES OF SUNGAI SELANGOR AT KAMPUNG KUANTAN, KUALA SELANGOR", "article", "en", "2012-06-01", 2012, "W. A. Wan Juliana | Nik Abdul Rahman | Maimon Abdullah | Norela Sulaiman", "https://orcid.org/0000-0002-6770-8682 | - | - | https://orcid.org/0000-0002-1317-9957", null, "National University of Malaysia", "MY", "The Eastbournian", null, "0012-8643", "41", "1", "55–58", null, "Riparian zone | Habitat | Geography | Firefly protocol | Vegetation (pathology) | Forestry | Agroforestry | Environmental science | Ecology | Biology", "Forest Ecology and Conservation", "Forestry", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 16, 4, "https://openalex.org/W2004905406 | https://openalex.org/W2041118889 | https://openalex.org/W2587806679 | https://openalex.org/W2622603521", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W138868363", null, "https://www.nzsap.org/proceedings/2005/impact-farm-management-decision-rules-production-and-profit-different-strains", null, "Impact of farm management decision rules on the production and profit of different strains of Holstein-Friesian dairy cows", "article", "en", "2005-01-01", 2005, "MacDonald Ka | Thorrold Bs | Glassey Cb | Holmes Cw | Pryce Je", "- | - | - | - | -", null, null, null, "Proceedings of the New Zealand Society of Animal Production", "New Zealand Society of Animal Production", null, "65", null, "40–45", "Management decision rules (‘old’ rules) have been used at the Dexcel No. 2 Dairy Farm to remove subjectivity from the management of farm systems research and have also been promoted to the dairy industry. A trial involving these rules where three strains of Holstein-Friesian (HF) cows were compared has completed its third season. The trial included two high breeding worth (BW) strains of either North American (OS90) or New Zealand (NZ90) genetics, and one low BW strain of NZ genetics (NZ70). Under the ‘old’ rules the OS90 cows had fewer days in milk than the other two strains, mainly because they were dried off earlier due to their lower body condition score (BCS). In the third lactation ‘new’ rules were applied that allowed cows at the higher feed allowances to be dried off later (but at the same BCS) than would have been allowed under the ‘old’ rules. For the herds receiving the higher feed allowances, this change resulted in increased days in milk (NZ90 + 2 days; OS90 + 17 days) more milksolids (MS) per cow (NZ90 +2 kg; OS90 +21 kg), and more feed required (NZ90 + 10 kg; OS90 + 157 kg DM/cow) with all herds reaching target BCS by their next calving. It is calculated that this reduced the difference in economic farm surplus (EFS) per ha between the NZ90 and OS90 from $488 to $219. These results indicate the need to alter management rules to get the best performance from North American HF genetics.", "Herd | Ice calving | Animal science | Dairy cattle | Milk production | Biology | Lactation | Agricultural science | Dairy industry | Profit (economics) | Biotechnology | Economics | Food science | Pregnancy", "Agricultural Economics and Policy", "General Agricultural and Biological Sciences", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 15, 6, "https://openalex.org/W1445981756 | https://openalex.org/W1584436752 | https://openalex.org/W1972225102 | https://openalex.org/W2050661916 | https://openalex.org/W2518078646 | https://openalex.org/W3039116128", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2142176098", "https://doi.org/10.5897/ajar11.608", "https://academicjournals.org/journal/AJAR/article-abstract/942CC5236019", null, "Application of gamma radiation for controlling the red flour beetle Tribolium castaneum Herbst (Coleoptera: Tenebrionidae)", "article", "en", "2011-01-10", 2011, "Abbas Hosseinzadeh | Shayesteh Nouraddin", "https://orcid.org/0000-0003-1951-0214 | -", null, null, null, "African Journal of Agricultural Research", "Academic Journals", "1991-637X", "6", "16", "3877–3882", "The effect of gamma irradiation on different developmental stages of Tribolium castaneum Herbst and the doses required to prevent each of these developmental stages was investigated. The required dose to prevent larval emergence from irradiated 1-2 days old eggs was 150 Gray (Gy) and 100 Gy was required to prevent adult emergence from 15 day-old larvae. Also the dose of radiation required preventing adult emergence from irradiated 5 day-old pupa was 700 Gy. The dose of 200 Gy caused 100% mortality irradiated adults 28 days after treatment. There was a dose-dependent increase in the developmental periods of different developmental stages exposed to gamma irradiation. The growth index of the adult was significantly decreased with increasing dose of radiation administered to the eggs, larvae and pupae. A dose of 700 Gy is recommended to control population growth of T. castaneum within stored products.\r\n\r\n\t \r\n\r\n\tKey words: Irradiation, prevent dose, developmental period, growth index, Tribolium castaneum.", "Pupa | Larva | Red flour beetle | Biology | Gamma irradiation | Irradiation | Toxicology | Radiation dose | Population | Botany | Nuclear medicine | Medicine", "Insect Pest Control Strategies", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", null, null, null, 15, 13, "https://openalex.org/W55330474 | https://openalex.org/W1974174542 | https://openalex.org/W1975846717 | https://openalex.org/W2016377043 | https://openalex.org/W2031169450 | https://openalex.org/W2075439488 | https://openalex.org/W2084464776 | https://openalex.org/W2086047102 | https://openalex.org/W2176358668 | https://openalex.org/W2192735072 | https://openalex.org/W2319110302 | https://openalex.org/W2333167539 | https://openalex.org/W2916128594", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2563548066", null, "https://www.cabdirect.org/cabdirect/abstract/20113034290", null, "Deoxynivalenol stability during wheat processing.", "article", "en", "2010-01-01", 2010, "Florentina Israel-Roming | Mihaela Avram", "- | -", null, null, null, "ROMANIAN BIOTECHNOLOGICAL LETTERS", "University of Bucharest", "1224-5984", "15", null, "47–50", null, "Biotechnology | Biology", "Mycotoxins in Agriculture and Food", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 14, 7, "https://openalex.org/W1557585942 | https://openalex.org/W1978502946 | https://openalex.org/W1985796217 | https://openalex.org/W1990952918 | https://openalex.org/W2016290119 | https://openalex.org/W2313821831 | https://openalex.org/W2472148564", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2143837114", null, "http://pakjas.com.pk/papers/1931.pdf", null, "Effect of tillage methods and fertilizer levels on maize production.", "article", "en", "2011-01-01", 2011, "S. Q. Memon | Muhammad Zakria . | Giacomo Mari | Muhammad Haq Nawaz | M. Z. Khan", "- | - | https://orcid.org/0000-0002-5076-942X | - | -", null, null, null, "The Pakistan Journal of Agricultural Sciences", "Pakistan Association of Advancement in Agricultural Sciences", "0552-9034", "48", "2", "117–120", null, "Tillage | Agronomy | Fertilizer | Production (economics) | Crop production | Crop yield | Environmental science | Mathematics | Biology | Agriculture | Economics", "Crop Yield and Soil Fertility", "Agronomy and Crop Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 14, 2, "https://openalex.org/W2064760188 | https://openalex.org/W2591969384", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W1935380193", null, "http://www.redalyc.org/pdf/2890/289029240035.pdf", null, "Effects of Heat Conditioning and Dietary Ascorbic Acid Supplementation on Heat shock Protein 70 Expression, Blood Parameters and Fear-Related Behavior in Broilers Subjected to Heat Stress", "article", "en", "2014-01-01", 2014, "H. D. O. Toplu | Recai Tunca | Serap Ünübol Aypak | Fethiye Çöven | Erkmen Tuğrul Epikmen | Solmaz Karaarslan | Orçun Yagin", "https://orcid.org/0000-0003-1741-1765 | https://orcid.org/0000-0003-0004-7485 | https://orcid.org/0000-0002-2194-8963 | https://orcid.org/0000-0003-1928-7630 | https://orcid.org/0000-0003-2641-2321 | https://orcid.org/0000-0002-6239-2439 | -", null, "Adnan Menderes University", "TR", "ACTA SCIENTIAE VETERINARIAE", "Federal University of Rio Grande do Sul", "1678-0345", "42", "1", "1–8", "Background: Heat stress is one of the most important environmental factors. Exposure of broilers to high temperature causes significant changes in physiological response. Early heat conditioning induces the heat tolerance of broiler chickens at later growth stage prior to marketing. Ascorbic acid supplementation has been reported to may alleviate the negative effects of heat stress on the performance of broilers. This study was carried out to investigate the effects of heat conditioning and dietary ascorbic acid supplementation on heat shock protein 70 expression, blood parameters and fear-related behavior in broilers subjected to heat stress. Material, Methods & Results: A total of 320 male broilers were used as the material of this study. Broilers were randomly assigned to four treatments. Each group contained four replicates with 20 chicks in each pen. Until the 21 days of age, all animals were raised at comfort temperature. The brooding temperature was maintained at approximately 32o C for the first 3 days and then decreased 3o C weekly until 21 days. Broilers in control group were kept under thermo-neutral conditions (24o C) and fed with the basal diet throughout experimental period. Other three groups were exposed to heat stress from 22 to 42 days of age. Heat stress was applied by exposing the broilers to a temperature of 35o C for 6 h/day between 10:00 h and 16:00 h. Ascorbic acid supplemented group was fed a diet supplemented with 500 mg of L-ascorbic acid/kg ration and exposed to heat stress from 22 to 42 days of age. Heat conditioned group was exposed to a temperature of 36o C for 24 h at the age of 5 days; fed with basal diet and exposed to heat stress from 22 to 42 days of age. Heat stress group was fed with the basal diet, no subjected to heat conditioning and exposed to heat stress from 22 to 42 days of age. The broilers in heat stress group had higher body temperature, H/L, TI duration, serum corticosterone, glucose, cholesterol, triglyceride concentrations and Hsp 70 expression in brain, liver and kidney tissues, but lower antibody titer against NDV than those in control group. The lower H/L, TI duration, serum corticosterone, glucose, cholesterol, triglyceride concentrations and Hsp 70 expression in brain, liver and kidney, whereas the higher antibody titer against NDV were obtained in heat conditioned and ascorbic acid supplemented diet fed groups, compared with heat stress group. Discussion: The results obtained in this study showed that heat stress caused to increase in H/L ratio, TI duration, body temperature, serum corticosterone, glucose, cholesterol, triglyceride concentrations and Hsp 70 expression in brain, liver and kidney, whereas it decreased antibody titer against to NDV. Heat conditioning and dietary ascorbic acid supplementation decreased H/L ratio, TI duration, serum corticosterone concentration and Hsp 70 expression and also increased antibody titer against to NDV, indicating the lower stress level in these groups. From these results, it can be said that heat conditioning and ascorbic acid supplementation alleviated the negative effects of heat stress in broilers. Heat conditioning was more effective than ascorbic acid supplementation in alleviating the adverse effects of heat stress on brain, liver and kidney tissues. In conclusion, heat conditioning of broilers by exposure to 36o C for 24 h at the age of 5 days and dietary ascorbic acid supplementation (500 mg/kg of diet) may offer a potential protective management practice in preventing heat stress in broilers.", "Ascorbic acid | Broiler | Heat stress | Conditioning | Animal science | Heat shock protein | Hsp70 | Biology | Chemistry | Food science | Biochemistry", "Animal Nutrition and Physiology", "Animal Science and Zoology", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", null, null, null, 14, 29, "https://openalex.org/W1576929531 | https://openalex.org/W1968944124 | https://openalex.org/W1971206845 | https://openalex.org/W1982469187 | https://openalex.org/W1983899108 | https://openalex.org/W1984230507 | https://openalex.org/W1984519886 | https://openalex.org/W2000497142 | https://openalex.org/W2007110616 | https://openalex.org/W2010094123 | https://openalex.org/W2016525655 | https://openalex.org/W2027095196 | https://openalex.org/W2032972473 | https://openalex.org/W2035472205 | https://openalex.org/W2056564646 | https://openalex.org/W2062769159 | https://openalex.org/W2084604397 | https://openalex.org/W2089140381 | https://openalex.org/W2090127768 | https://openalex.org/W2092713296 | https://openalex.org/W2096385600 | https://openalex.org/W2101983119 | https://openalex.org/W2119999468 | https://openalex.org/W2125831753 | https://openalex.org/W2143692966 | https://openalex.org/W2146006320 | https://openalex.org/W2168345733 | https://openalex.org/W2172130677 | https://openalex.org/W2410140591", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2106598163", "https://doi.org/10.5897/jmpr11.946", "https://www.academicjournals.org/journal/JMPR/article-full-text-pdf/3D726C422600", null, "In vitro antibacterial activity of ethanol extracts of nine herbal formulas and its plant components used for skin infections in Southern Thailand", "article", "en", "2012-11-17", 2012, "Sasitorn Chusri | Nattawan Chaicoch | Wanvalit Thongza-ard | Surasak Limsuwan | Supayang Piyawan Voravuthikunchai", "https://orcid.org/0000-0002-7365-6890 | - | - | https://orcid.org/0000-0002-4180-1416 | https://orcid.org/0000-0002-1682-2880", null, "Prince of Songkla University", "TH", "Journal of Medicinal Plants Research", "Academic Journals", "1996-0875", "6", "44", "5616–5623", "The antibacterial activities of different Southern Thailand medicinal plant formulas as well as their medicinal plant components were tested against skin and wound pathogens, includingStaphylococcus epidermidis, methicillin-resistant Staphylococcus aureus, Streptococcus pyogenes, multidrug-resistant (MDR) Escherichia coli, MDR Pseudomonas aeruginosa, and MDR Acinetobacter baumannii.  Nine medicinal plant formulas consisting of 41 medicinal plants were chosen on the basis of their traditional use against skin infections. The preliminary antimicrobial activity of the ethanol extracts formula was carried out by disc diffusion test. The extracts which showed inhibitory effect were further investigated for minimum inhibitory concentration (MIC) using the broth microdilution method. Eight formulas were found to inhibit the growth of at least one of the tested pathogens with inhibition zones ranging from 7.5 to 21.0 mm. THR-SK004 and THR-SK005 extracts displayed broad spectrum activity against both Gram-positive and Gram-negative. Results indicated that THR-SK004 and its medicinal components, Metroxylon sagu Rottb. andOroxylum indicum Vent.  exhibit good antibacterial activity with MIC values in the range of 30 to 1,000 µg/ml.  This antibacterial property tends to support the use of traditional medicine in the treatment of bacterial skin infections. \r\n\r\n\t \r\n\r\n\tKey words: Antibacterial activity, medicinal plant formulas, medicinal plant, traditional Thailand medicine", "Antibacterial activity | Traditional medicine | Acinetobacter baumannii | Antimicrobial | Medicinal plants | Minimum inhibitory concentration | Broth microdilution | Staphylococcus epidermidis | Staphylococcus aureus | Pseudomonas aeruginosa | Biology | Agar diffusion test | Microbiology | Chemistry | Bacteria | Medicine", "Essential Oils and Antimicrobial Activity", "Food Science", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", null, null, null, 14, 37, "https://openalex.org/W74096148 | https://openalex.org/W90017731 | https://openalex.org/W171472659 | https://openalex.org/W345393571 | https://openalex.org/W1505626160 | https://openalex.org/W1877106702 | https://openalex.org/W1980343965 | https://openalex.org/W1980693214 | https://openalex.org/W1986596167 | https://openalex.org/W1991300830 | https://openalex.org/W1997304250 | https://openalex.org/W2003672931 | https://openalex.org/W2014865572 | https://openalex.org/W2016628683 | https://openalex.org/W2033528803 | https://openalex.org/W2035194773 | https://openalex.org/W2043539859 | https://openalex.org/W2057161451 | https://openalex.org/W2061031668 | https://openalex.org/W2066812140 | https://openalex.org/W2067195058 | https://openalex.org/W2067755131 | https://openalex.org/W2070007526 | https://openalex.org/W2076690805 | https://openalex.org/W2084437748 | https://openalex.org/W2097921716 | https://openalex.org/W2103140077 | https://openalex.org/W2111792422 | https://openalex.org/W21183 900418 | https://openalex.org/W248651269 | https://openalex.org/W1482980385 | https://openalex.org/W1517081461 | https://openalex.org/W1531142961 | https://openalex.org/W1601315231 | https://openalex.org/W1775749144 | https://openalex.org/W1964606797 | https://openalex.org/W1966568888 | https://openalex.org/W1973656203 | https://openalex.org/W1977287603 | https://openalex.org/W1987430779 | https://openalex.org/W1990297117 | https://openalex.org/W1990729744 | https://openalex.org/W1993585129 | https://openalex.org/W1998303033 | https://openalex.org/W1999973378 | https://openalex.org/W2003421348 | https://openalex.org/W2029672119 | https://openalex.org/W2034777839 | https://openalex.org/W2038774179 | https://openalex.org/W2047486262 | https://openalex.org/W2050197826 | https://openalex.org/W2050354357 | https://openalex.org/W2051228629 | https://openalex.org/W2056796162 | https://openalex.org/W2059084721 | https://openalex.org/W2059118532 | https://openalex.org/W2064565747 | https://openalex.org/W2065399452 | https://openalex.org/W2070834802 | https://openalex.org/W2072953798 | https://openalex.org/W2083576548 | https://openalex.org/W2083613232 | https://openalex.org/W2094124576 | https://openalex.org/W2096651550 | https://openalex.org/W2097382368 | https://openalex.org/W2097706568 | https://openalex.org/W2098838428 | https://openalex.org/W2104071021 | https://openalex.org/W2104654234 | https://openalex.org/W2107956806 | https://openalex.org/W2116749503 | https://openalex.org/W2125121305 | https://openalex.org/W2131771498 | https://openalex.org/W2136354460 | https://openalex.org/W2140508607 | https://openalex.org/W2146413934 | https://openalex.org/W2147773960 | https://openalex.org/W2150957732 | https://openalex.org/W2158787765 | https://openalex.org/W2164174400 | https://openalex.org/W2167453593 | https://openalex.org/W2239896666 | https://openalex.org/W2501960994 | https://openalex.org/W2515727388", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W292415905", null, "https://www.frim.gov.my/v1/jtfsonline/jtfs/v24n2/173-177.pdf", null, "Antioxidant activity and phenolic content of different parts of Orthosiphon stamineus grown under different light intensities.", "article", "en", "2012-04-01", 2012, "Farhan Mohd Said | Shariza Abdul Razak | Kar Yong Pin | Luqman Chuah Abdullah", "https://orcid.org/0000-0003-0737-3486 | https://orcid.org/0000-0001-6688-2470 | https://orcid.org/0000-0002-9858-1557 | https://orcid.org/0000-0003-4785-9296", null, null, null, "JOURNAL OF TROPICAL FOREST SCIENCE", null, "0128-1283", "24", "2", "173–177", "fArhAn M, ABdul rAZAK s, pin Ky & chuAh Al. 2012. Antioxidant activity and phenolic content of different parts of Orthosiphon stamineus grown under different light intensities. Orthosiphon stamineus is an important medicinal plant in South-East Asia. Although already widely cultivated, the influence of growing conditions, especially light intensity, on the antioxidant property of O. stamineus is still unknown. Thus, the objective of this study was to determine the antioxidant activity and phenolic content of different plant parts of O. stamineus and to propose the best environment condition for its cultivation. The leaves, stems and roots of O. stamineus treated in open environment were extracted with methanol for 4 hours in a shaking water bath at 40 °C. Total phenolic content (TPC) and antioxidant activity were determined using Folin-Ciocalteu and 2,2-diphenyl-1-picrylhydrazyl (DPPH) methods respectively. In the first part of the experiment, only seedlings grown in the open environment were used. TPC was higher in leaves (230 mg gallic acid g-1 dry weight) compared with stems and roots (160 and 140 mg gallic acid g-1 dry weight respectively). However, antioxidant activity was lower in leaves (78.43%) than stems (80.66%) and roots (80.26%). By selecting leaves as the main part to study, O. stamineus grown under shaded treatment (50 and 70% shaded) as well as open environment were harvested to determine their TPC and antioxidant activities. It was observed that TPC in O. stamineus leaves grown in open environment was highest (230 mg gallic acid g-1 dry weight) compared with shade-grown seedlings. Similarly, antioxidant activity was also highest in seedlings grown in open environment (80.02%) compared with in shade (50% = 77.72%, 70% = 74.37%).", "Gallic acid | DPPH | Antioxidant | Dry weight | Chemistry | Food science | Botany | Horticulture | Traditional medicine | Biology | Organic chemistry", "Bioactive Compounds in Plants", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 13, 11, "https://openalex.org/W103650795 | https://openalex.org/W1969136629 | https://openalex.org/W1978514357 | https://openalex.org/W1978532967 | https://openalex.org/W1983595568 | https://openalex.org/W2056127869 | https://openalex.org/W2103464952 | https://openalex.org/W2106828037 | https://openalex.org/W2136658294 | https://openalex.org/W2561618954 | https://openalex.org/W2987994677", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2171504785", "https://doi.org/10.5897/ajb10.040", "https://www.academicjournals.org/article/article1380637107_Pu-te.pdf", null, "The modern water-saving agricultural technology: Progress and focus", "article", "en", "2010-09-13", 2010, "Pute Wu", "https://orcid.org/0000-0002-4682-6145", "Pute Wu", null, null, "AFRICAN JOURNAL OF BIOTECHNOLOGY", "Academic Journals", "1684-5315", "9", "37", "6017–6026", "Based on the analysis of water-saving agricultural technology development status and trends in China, and in combination with the development and the needs of modern water-saving agricultural technology, we have put forward a future research emphasis and developing direction of modern watersaving agricultural technology, which include modern biological water-saving technology, unconventional high-efficient and safe-water using technology, water-saving irrigation technology and equipment, dry high-efficient water using technology and new materials regional high-efficient watersaving agriculture comprehensive technology.", "Agriculture | Agricultural machinery | Technology development | Water saving | Technology system | Agricultural engineering | Business | Farm water | Environmental science | Irrigation | Appropriate technology | Water conservation | Agricultural economics | Natural resource economics | Water resource management | Engineering | Economics | Agronomy | Manufacturing engineering | Geography | Political science", "Rice Cultivation and Yield Improvement", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", null, null, null, 12, 22, "https://openalex.org/W71120918 | https://openalex.org/W162776000 | https://openalex.org/W1972247682 | https://openalex.org/W1976856248 | https://openalex.org/W1987058701 | https://openalex.org/W2012970956 | https://openalex.org/W2018557230 | https://openalex.org/W2024469305 | https://openalex.org/W2035333314 | https://openalex.org/W2042036590 | https://openalex.org/W2042704858 | https://openalex.org/W2049778114 | https://openalex.org/W2071066768 | https://openalex.org/W2075536095 | https://openalex.org/W2076788577 | https://openalex.org/W2085635066 | https://openalex.org/W2146139300 | https://openalex.org/W2364874247 | https://openalex.org/W2368581898 | https://openalex.org/W2391438992 | https://openalex.org/W2538444906 | https://openalex.org/W2803673266", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2170125506", "https://doi.org/10.4314/ajb.v8i17.62361", "https://avesis.yyu.edu.tr/publication/details/78f6dab0-9f0a-453f-ae83-edcdaa3fef70/oai", null, "Influence of starter culture strains, pH adjustment and incubation temperature on exopolysaccharide production and viscosity in whey", "article", "en", "2009-01-01", 2009, "Yusuf Tunçtürk", "https://orcid.org/0000-0001-5240-200X", "Yusuf Tunçtürk", null, null, "Van Yüzüncü Yıl University Academic Data Management System", null, null, "8", "17", "4222–4228", "There are many functional characteristics of exopolysaccharides (EPS) produced by lactic acid bacteria in fermented dairy products. In this study, 2 EPS-producing strains of Lactobacillus delbrueckii ssp. bulgaricus and 2 Streptococcus thermophilus strains were isolated from commercial and rural yoghurts and they were inoculated into whey and their effects on EPS production and viscosity of whey were monitored. Two pH applications (adjusted pH and free pH) and 3 incubation temperature (42, 36 and 42/36(sic)C) were performed. pH of samples was significantly affected by starter culture strains, pH adjustment and incubation temperature (P < 0.01). Generally counts of L. delbrueckii ssp. bulgaricus were found higher than of S. thermophilus (P < 0.05). Viable cell counts were significantly higher, in pH-adjusted samples and 42 C samples, than their relevants (P < 0.01). Higher concentrations of EPS were observed in pH-adjusted media than that in pH-free media (P < 0.01). Also 2-step (42/36(sic)C) and lower (36(sic)C) incubation temperature caused an increase in EPS production. Viscosity of samples greatly influenced from their EPS contents. The highest EPS concentration (676 mg/L) and viscosity (6.37 mPa. s) was determined in the sample that inoculated with S. thermophilus ST3 strain, incubated at 42/36(sic)C with pH-adjustment.", "Streptococcus thermophilus | Starter | Incubation | Lactobacillus delbrueckii subsp. bulgaricus | Food science | Chemistry | Lactobacillus | Fermentation | Lactic acid | Incubation period | Lactobacillaceae | Bacteria | Fermentation starter | Strain (injury) | Microbiology | Biology | Biochemistry", "Probiotics and Fermented Foods", "Food Science", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", null, null, null, 12, 43, "https://openalex.org/W48629525 | https://openalex.org/W627977585 | https://openalex.org/W1182944759 | https://openalex. nd Pesticide Research", "Insect Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 12, 10, "https://openalex.org/W76196111 | https://openalex.org/W248323314 | https://openalex.org/W1989362594 | https://openalex.org/W2014769584 | https://openalex.org/W2014868101 | https://openalex.org/W2058743658 | https://openalex.org/W2069940284 | https://openalex.org/W2164785005 | https://openalex.org/W2183815250 | https://openalex.org/W2523255148", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W3166151318", null, "https://jpacd.org/jpacd/article/view/136", null, "Studies on the Induction of Embryogenic Globular Structures in Opuntia ficus-indica", "article", "en", "2001-08-27", 2001, "Samantha Pinheiro Costa | Arlete Aparecida Soares | Birgit Arnholdt‐Schmitt", "- | https://orcid.org/0000-0002-0329-0619 | https://orcid.org/0000-0001-9764-8660", null, null, null, "Journal of the Professional Association for Cactus Development", null, "1938-663X", "4", null, "66–74", "In studies on the induction of somatic embryogenesis in Opuntia ficus-indica, globular structures were obtained from isolated, in vitro-germinating zygotic embryos in the presence of 0.45×10-6 mol·l-1 2,4-D and 0.91×10-6 or 9.1×10-6 mol·l-1 kinetin. The globuli displayed typical morphological characteristics of embryogenic globuli, i.e., a well-defined globular shape without vascular connection to the original tissue, demonstrating yellowish-white colour. Serial histological analysis during the first 4 weeks of culture revealed that these structures were directly induced after about 2 weeks of primary culture at the periphery, beneath the first cell layers, preferably emerging at subepidermal regions of young cotyledons. Also, a suspensor-like tissue embedding the globuli in the originating material was observed. However, in comparison to young embryonic structures from other species, the globuli from O. ficus-indica displayed atypical cytological characteristics that are related to water management in plants.", "Suspensor | Somatic embryogenesis | Ficus | Kinetin | Botany | Biology | Embryo | Tissue culture | Anatomy | Embryogenesis | In vitro | Cell biology | Genetics", "Botanical Research and Applications", "Food Science", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", null, null, null, 12, 14, "https://openalex.org/W3510243 | https://openalex.org/W57434328 | https://openalex.org/W1970928353 | https://openalex.org/W1978656479 | https://openalex.org/W2022189423 | https://openalex.org/W2024556021 | https://openalex.org/W2077545872 | https://openalex.org/W2085252569 | https://openalex.org/W2116734069 | https://openalex.org/W2126011810 | https://openalex.org/W2485364510 | https://openalex.org/W2590306283 | https://openalex.org/W3046169203 | https://openalex.org/W3114713417", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W174516837", null, "https://www.cabdirect.org/abstracts/20093184044.html", null, "Maximizing water use efficiency in wheat yields based on drip irrigation systems.", "article", "en", "2009-01-01", 2009, "Yasser E. Arafa | essam wasif | Hazem E. Mehawed", "- | - | -", null, null, null, "AUSTRALIAN JOURNAL OF BASIC AND APPLIED SCIENCES", "International Network for Scientific Information Publication", "1991-8178", "3", "2", "790–796", "2 Abstract: Maximizing irrigation water use efficiency is one of the most important policies under arid ecosystems conditions. Therefore, the aim of this study was to estimate the wheat yield response to drip irrigation systems and the attributed water use efficiency and saving water indices under sandy soil conditions of arid regions. Results revealed that about 16.33 and 26.57% of wheat grain yield reduction had been observed under the alternative irrigation systems (subsurface and surface drip) compared with the solid-set sprinkler irrigation system. On the other hand, data revealed that attributed water use efficiency and water saving had been enhancement with about 43.13 and 76%, respectively, when using drip irrigation systems. It can be concluded that the alternative irrigation system (subsurface drip irrigation) has an effective way for irrigating intensive field crops, but more studies have to be conducted under similar field conditions.", "Drip irrigation | Environmental science | Water-use efficiency | Irrigation | Arid | Agronomy | Low-flow irrigation systems | Water use | Surface irrigation | Agricultural engineering | Yield (engineering) | Materials science | Engineering | Biology | Ecology", "Irrigation Practices and Water Management", "Soil Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 11, 8, "https://openalex.org/W957984318 | https://openalex.org/W1487923163 | https://openalex.org/W1512952934 | https://openalex.org/W1952030160 | https://openalex.org/W2004496484 | https://openalex.org/W2070190106 | https://openalex.org/W2073884415 | https://openalex.org/W2245198504", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W1952947051", null, "https://journals.flvc.org/nematropica/article/download/64415/62083", null, "EFFECT OF SOLARIZATION AND COWPEA COVER CROP ON PLANT-PARASITIC NEMATODES, PEPPER YIELDS, AND WEEDS", "article", "en", "2007-06-01", 2007, "Subrata Saha | K. H. Wang | Robert McSorley | Robert J. McGovern | Nancy Kokalis-Burelle", "https://orcid.org/0000-0003-4769-7637 | - | - | https://orcid.org/0000-0001-7782-3695 | -", null, "University of Florida", "US", "Nematropica", "Organization of Nematologists of Tropical America", "0099-5444", "37", "1", "51–64", "Two field experiments with bell pepper (Capsicum annuum) Wizard X3R were established (May 2003, 2004) in Marion Co., Florida, U.S.A. The objective was to compare yields, nematode populations, and weeds as impacted by six soil management treatments: cowpea (Vigna unguiculata) summer cover crop, solarization on a raised bed, solarization on a flat surface, cowpea cover crop followed by raised bed solarization, methyl bromide fumigation, and untreated control. Soil samples were obtained after all treatments had been applied, just prior to planting, and at the end of the season to determine the effects of treatments on nematode population densities. In 2003 prior to planting, ring nematodes (Mesocriconema sp.) were most prevalent in the control treatment and lowest in the cowpea cover crop combined with raised bed solarization, and the methyl bromide fumigation treatments. At the end of both seasons the combination of cowpea cover crop with bedded solarization was as effective as methyl bromide fumigation for suppressing root-knot nematodes (Meloidogyne spp.). In 2004, raised-bed solarization was also as effective as methyl bromide for suppressing root-knot nematodes. All solarization treatments were effective in suppressing weeds compared to the untreated control, and were more effective than methyl bromide in 2003 when no glyphosate was applied during the summer. Solarization treatments were equivalent to glyphosate-treated methyl bromide and control plots in 2004. Pepper yields of U.S. Fancy grade and total fruit weight in 2003 were higher in raised-bed solarization than methyl bromide fumigated plots. Cowpea in combination with raisedbed solarization resulted in higher total fruit weight relative to methyl bromide fumigation. Two hurricanes followed by a Pythium sp. epidemic confounded yield differences in 2004. However, flat solarization resulted in greater total fruit number and weight of U.S. #1 grade peppers than methyl bromide fumigation. Solarization and solarization combined with a cowpea cover crop can be useful alternatives for nematode and weed suppression, and improved yield of pepper.", "Soil solarization | Solarisation | Fumigation | Sowing | Agronomy | Cover crop | Biology | Crop | Pepper | Horticulture | Weed | Cultural control | Weed control", "Nematode management and characterization studies", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", null, null, null, 11, 13, "https://openalex.org/W1538291015 | https://openalex.org/W1914194071 | https://openalex.org/W1942348002 | https://openalex.org/W2043721627 | https://openalex.org/W2099075499 | https://openalex.org/W2133253261 | https://openalex.org/W2169574833 | https://openalex.org/W2170402319 | https://openalex.org/W2179532190 | https://openalex.org/W2279774609 | https://openalex.org/W2288035583 | https://openalex.org/W2379628519 | https://openalex.org/W3023060882", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2341270298", null, "https://puredev.port.ac.uk/en/publications/integrity-of-an-rfid-enabled-hmsc-network", null, "Integrity of an RFID-enabled HMSC Network", "article", "en", "2015-04-01", 2015, "Ahmed Mohammed | Qian Wang | Abst Ract", "https://orcid.org/0000-0002-8474-9208 | https://orcid.org/0000-0003-1113-1252 | -", null, "University of Portsmouth", "GB", "Digital Enterprise and Information Systems", null, null, null, null, "79–86", "In recent years, application and integration of RFID-related technologies and systems have been widely expanding particularly in supply chain and logistics sectors. For instance, there has been a steady increase in applying radio frequency identification (RFID) tags into logistic warehouses in order to improve traceability of SKU (stock keeping units) and achieve a real-time visibility of inventory data and management. Thus, research and development of RFID-enabled supply chains needs to be addressed. This paper presents a framework in development of an RFID-enabled supply chain network to enhance traceability in integrity of Halal-meat products. This includes an RFID-based monitoring process for Halal meat supply chains (HMSC) which consist of farms, abattoirs, transporters, retailers and consumers. Based on this, an RFID-based HMSC monitoring system was proposed through a combination of an RIFDenabled inventory management system, a GPRS (general packet radio service) system, and a GPS (global positioning system). A multi-objective mathematical model was developed to describe the proposed HMSC. Subsequently, a Petri-net model was also developed to examine the proposed RFIDenabled HMSC network to gain some initial results in terms of network performance of a developed HMSC.", "Traceability | Radio-frequency identification | General Packet Radio Service | Supply chain | Computer science | Supply chain management | Global Positioning System | Systems engineering | Business | Telecommunications | Computer security | Wireless | Engineering", "Food Supply Chain Traceability", "Food Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 11, 20, "https://openalex.org/W62981505 | https://openalex.org/W1634742413 | https://openalex.org/W1993081031 | https://openalex.org/W1995229150 | https://openalex.org/W1998861570 | https://openalex.org/W2014633425 | https://openalex.org/W2015456407 | https://openalex.org/W2044071835 | https://openalex.org/W2054795768 | https://openalex.org/W2055781575 | https://openalex.org/W2069381991 | https://openalex.org/W2079857949 | https://openalex.org/W2112070510 | https://openalex.org/W2131649622 | https://openalex.org/W2136497835 | https://openalex.org/W2145099007 | https://openalex.org/W2165337258 | https://openalex.org/W2168933377 | https://openalex.org/W2541336016 | https://openalex.org/W2980832553", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2183516324", null, "https://www.tsijournals.com/abstract/cytotoxic-antibacterial-and-free-radical-scavenging-activity-studies-of-the-solvent-extracts-of-aerial-stems-of-equisetu-10798.html", null, "CYTOTOXIC, ANTIBACTERIAL AND FREE RADICAL SCAVENGING ACTIVITY STUDIES OF THE SOLVENT EXTRACTS OF AERIAL STEMS OF EQUISETUM DEBILE ROXB", "article", "en", "2012-01-01", 2012, "Brazendranath Sarkar | Sabbir Raihan | Nasim Su
