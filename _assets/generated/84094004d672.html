<script type="application/json">{"cols": [["id", "str", "Str"], ["title", "str", "Str"], ["year", "int64", "Int64"], ["type", "str", "Str"], ["citations", "int64", "Int64"], ["topic", "str", "Str"], ["abstract", "str", "Str"]], "rows": [["https://openalex.org/W2939012452", "Investigating the links between the use of the internet, value co-creation, and customer satisfaction in the banking sector", 2020, "article", 3, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W3203552846", "THE USE OF RESISTIVITY TESTING FOR QUALITY CONTROL OF CONCRETE MIXTURES", 2020, "article", 0, "Geophysical Methods and Applications", null], ["https://openalex.org/W3213122519", "A financial Health Analysis of Selected Companies from Nifty 50 using Altman Z-Score Model", 2021, "article", 0, "Financial Distress and Bankruptcy Prediction", "India has become the world's fastest growing major economy and is expected to be one of the world's top three economic powers for the next 10 to 15 years, backed by its strong and largest democracy. In this paper Researcher has randomly selected five companies from Nifty 50 and period of study is four financial years. Objectives of the study is to check financial status of selected companies and compare Z-Score among randomly selected Nifty 50 Companies. Altman Z Score model has been used for analysis of study. In last Researcher has found that only one Britannia Industries Ltd. has come under safe zone, two companies’ vis Mahindra and Mahindra Ltd. and Shree Cement Ltd. have in Grey Zone and remaining two vis Tata Steel Ltd. and Bharti Airtel Ltd. have in Distress Zone. So, it can said that these two companies need to check their financial position and improve their sales and working capital position to come in good Z Score position."], ["https://openalex.org/W3211531726", "EXPLORING THE CONTRIBUTION OF MEDIA IN ADVANCING SUSTAINABLE DEVELOPMENT GOALS IN INDIA", 2021, "article", 0, "Climate Change Communication and Perception", "Media is an important participant in regard to societies reaching the goals of development-both as a contributor and a beneficiary. News media can play an important role in floating awareness about the Sustainable Development Goals (SDGs). Media in all its forms has a crucial role to play in the development agenda to ensure that citizens are well informed. The media has important roles to play, to inform, to educate, and to provide a platform for public debate and discussion. It could serve as catalyst for citizens’ empowerment and help to hold government and authorities to account. Third world countries like India have been facing odd situations in terms of poverty, environment, health, politics, and education. There have been efforts by the government and non- government agencies to sensitize the citizens and to make them acknowledge the programs intended at improving their socio-economic welfare. Communication is a vital tool in mobilizing people in the direction of the participatory process which in turn makes development an achievable goal. The present paper is an attempt to provide comprehensive information and explore the significance of the role of media as a powerful tool towards achieving the Sustainable Development Goal in India. The qualitative approach is conducted to explore deeper insight of SDGs understanding from news media. This study found that not all SDGs are informed well. Only several SDGs are framed based on the concern of public policy."], ["https://openalex.org/W3093519922", "ONLINE TRAINING OF UNIVERSITY STUDENTS AS TAEKWONDO REFEREES DURING A CORONAVIRUS PANDEMIC", 2020, "article", 2, "Physical Education and Training Studies", "COVID-19 caused the suspension of most sports events and the dismissal of all athletes, coaches, sports specialists, officials (referees and judges) and other persons involved in the field In recent decades technological progress and digitalisation have undergone substantial development, thereby providing excellent opportunities for online training In times of social distancing, hardware and software solutions have gained prominence as appropriate and necessary means of remote attendance for participants in educational events Referees have become an integral part of modern sports as the officials upholding the proper application of the competition rules, fair play and the observance of the code of ethics during events Considering the pandemic situation, which renders the conducting of attended events impossible, as well as the key role of sports officials, we set out to organize the training of officials online The target group for the study consisted of students from the Taekwondo Coach specialty in the faculty of the Vassil Levski National Sports Academy, given their specific knowledge and involvement in the sport The implementation of the project showed that online training was a suitable method for the reinforcing, enriching and improving of the competencies of officials in Bulgaria during an ongoing pandemic In the field, distance training proved to be a promising practice for the conducting of all theoretical and some practical classes for the officials in the country The studies conducted allow us to conclude that during the COVID-19 pandemic it is possible to use modern technical means and methods successfully in order to involve athletes, coaches and officials with sports activities The results of this project provoke us to re-assess the policies and methods applicable to the training of officials at the national and the international level"], ["https://openalex.org/W3190843759", "Endometrite crônica e infertilidade", 2021, "article", 0, "Ovarian function and disorders", null], ["https://openalex.org/W3203460566", "Facilitating Empowerment of Women through Self Help Groups with Reference to NABARD in Punjab: An Analysis", 2020, "article", 1, "Microfinance and Financial Inclusion", "Women are an integral part of the social, economic and political system. women. The overall growth and development of a country is viable only when women are given equal opportunities in every sphere and access to various services. Microfinance is the first step towards bringing women within the purview of access to financial services for the economic empowerment of women which paved way for their sustainable livelihood. The financial services are a better way to access the banking facilities for the poor at an affordable cost. The sources of credit represent linkage between banks and Self Help Groups and provide credit funds for women to enhance livelihood opportunities. National Bank for Agriculture and Rural Development (NABARD) acts as facilitator and provider of microfinance. An attempt has been made in this paper to study the Role of NABARD as Facilitator for financial inclusion of women; to assess the impact of financial inclusion on sustainable livelihood of SHGs of women. An attempt has been made to analyze the impact of working in SHG on women economic empowerment in Hoshiarpur and Mansa districts of Punjab. It has been found that there is a positive impact on women empowerment through self-help groups, in terms of increase in participation, awareness, credit accessibility, asset creation, entrepreneurship, repayment of other debts, and gained the decision making skills. Women are now more confident in Decision making. The self-help groups have enabled marginalized women to get social status as well as now they have access to various financial products and services at very low cost."], ["https://openalex.org/W3213662909", "The Impact of Indian Independence Movement on the select Novels of Raja Rao", 2021, "article", 0, "Indian History and Philosophy", "Indian Writing in English is influenced by Gandhian ideology. Gandhi emphasized more on social, political, and religious problems of the oppressed and down trodden lower castes in Hindu society. His aim was to abolish poverty, caste system and untouchability from society. The present study reveals prominently the influence of Mahatma Gandhi on the village of Kanthapura. ‘Kanthapura’ is the microcosm of the Indian traditional society and what happened in Kanthapura was also happened in India during 1919-1930. It is not only a political novel, but also a novel which concerns with socio-religious and economic transformation during the struggle for independence. ‘Kanthapura’ follows Gandhi’s doctrine and ideology of non-violence, Satyagraha, their views on untouchability and casteism etc. The novel can be considered Gandhi-epic. Gandhi aroused national awakening in Indians with his non-violent struggle for freedom movement which was strengthened by noncooperation and civil disobedience movement in Kanthapura village. Gandhi’s influential personality and his ideology is felt everywhere in the novel. Indeed, Gandhi doesn’t appear in this novel personally, but the plot of the novel revolves around his ideology. This research article, ‘Gandhi’s Ideology: A Study of Raja Rao’s Kanthapura’ aims at how the Gandhi’s ideology influenced Raja Rao which resulted in the creation of the character of Moorthy. It also focuses on how Moorthy, under the influence of Gandhi, tries to inspire the people towards the freedom struggle."], ["https://openalex.org/W3023501577", "The use of short speculative fiction in teaching about privacy", 2020, "article", 2, "Digital Games and Media", null], ["https://openalex.org/W3183415725", "Exploring paramedic health status and simulated occupational performance.", 2020, "article", 0, "Musculoskeletal pain and rehabilitation", null], ["https://openalex.org/W3148170884", "Software Business Models", 2020, "article", 0, "Business Process Modeling and Analysis", null], ["https://openalex.org/W3187330918", "GlobePort faces a Knowledge Gap in its Business Process Outsourcing", 2021, "article", 0, "Service-Oriented Architecture and Web Services", null], ["https://openalex.org/W3170550339", "Teaching About the 2020 Presidential Election", 2020, "article", 3, "Educator Training and Historical Pedagogy", "Covid-19 has made classroom teaching this fall more challenging than normal. Masks, social distancing, and remote learning make instruction both difficult and unpredictable for all educators. Social studies teachers, though, are navigating an additional source of tension: the 2020 presidential election. The contest between President Donald Trump and former Vice President Joe Biden has been divisive, vicious, and has certainly captured the attention of students."], ["https://openalex.org/W3160199546", "Viral Scalability - Coping with Sudden Demand Swings", 2021, "article", 0, "Big Data and Business Intelligence", "The rapid emergence of the novel coronavirus and its impact on human behavior provoked dramatic increases in human usage of a variety of systems. These increases had the potential to stress the scalability of the systems, testing whether the system owners had designed and built those systems to cope with sudden changes in demand. This case invites students to study a variety of different types of systems, and to analyze the means by which they can or did achieve scalability, and efficiently serve their customers."], ["https://openalex.org/W3189325683", "Effects of Teaching and Practice of Time Management Skills on Academic Performance in Computer Information Systems Courses", 2021, "article", 3, "Online and Blended Learning", null], ["https://openalex.org/W3141857238", "Ethics and Data Manipulation", 2020, "article", 2, "Data Quality and Management", null], ["https://openalex.org/W3213511758", "Effect of Web Based Instructions on Students Attitude towards Mathematics", 2021, "article", 0, "Online and Blended Learning", "This study was purposed to investigate the effect of web-based instructions on the students’ attitude towards mathematics. This study was of pre-test and post-test experimental design. The study was conducted on 100 students studying in seventh grade at government schools of Gurdaspur district. The sample was randomly divided into two groups via 50 students in the experimental group and 50 in the control group. The two treatments were employed in this study in which the experimental group was taught with web based instructions and the control group was instructed through the traditional classroom method. The data was collected using the attitude towards mathematics scale prepared by an investigator and analysed by applying appropriate statistical techniques. The findings of the study revealed that there exists a significant difference in students’ attitude towards mathematics taught through web based instructions and traditional classroom instructions."], ["https://openalex.org/W3136228737", "Looking Back, Looking Forward: The Limitations of Past Perspectives", 2020, "article", 0, "Education Systems and Policy", "History, like writing, is a process of constant revision. Each new generation rewrites the story of the past based on new evidence, shifting perspectives, and new questions that arise based on these and other factors. As Julie Des Jardins has shown, the historical enterprise itself changes over time, with gender and race contributing to new understandings as they are centrally implicated in what she calls \"the politics of memory.\" In short, new scholars bring new questions."], ["https://openalex.org/W3133629289", "THE THEORY OF CELLS", 2021, "article", 0, "Advanced Algebra and Logic", "In this paper we introduce and develop the notion of universe, induced communities and cells with their corresponding spots. We study the concept of the density, the mass of communities, the concentration of spots in a typical cell, connectedness and the rotation of communities. In any case we establish the connection that exist among these notions. We also formulate the celebrated union-close set conjecture in the language of density of spots and the mass of a typical community."], ["https://openalex.org/W3166475081", "Dining with Democracy: Discussion as Informed Action", 2020, "article", 1, "Educational Practices and Policies", "Jeremy Thomas and Russell McBride are social studies teachers in North Carolina and, until recently, were colleagues at a charter school outside of Raleigh, serving students in grades 6–12. After learning about the Inquiry Design Model (IDM), 1 both teachers implemented it into their classrooms and immediately saw how the blueprint helped deepen students' engagement, understanding of concepts, and ability to make and support arguments. The teachers even took the model to the next level by co-teaching an elective in which students learned to design their own inquiries and took turns leading classmates through their lessons. The course was student-centered and alive with discussion. As a result of their collaboration, Jeremy and Russell made the IDM blueprint a regular feature of their school's social studies program."], ["https://openalex.org/W3128640895", "The Use of UMU Interactive Platform in Chinese Language Reading Skills of Grade 10 Thai Students", 2020, "article", 1, "Online and Blended Learning", "In recent years, with China's Belt and One Road multinational cooperation, China's development has attracted worldwide attention. With that, understanding China and learning Chinese have become essential abilities for the future. Therefore, in eastern and western countries it continues to be the rage to learn Chinese. At present, there are still many problems in teaching Chinese as a foreign language. Classroom teaching is old-fashioned and boring, students have no interest in learning, and their Chinese listening, speaking, reading, and writing abilities are uneven. Therefore, to enable students to actively participate in classroom learning is an important direction for TCSL teachers to improve their teaching ability.\n  In this study, the researchers applied the UMU (Interactive platform) to the teaching of Chinese as a foreign language (TCSL) in Grade 10 students in Thailand. This study compared the reading skills of Grade 10 students before and after using the UMU Interactive platform and explored the learning attitude of Grade 10 Thai students after using UMU (Interactive Platform) in learning the Chinese language. The mean scores of the Pre-test and Post-test were 2.83 and 10.75 respectively. The mean score of the Post-test was statistically higher than the mean score of the Pre-test 7.92. The result showed that the use of UMU (Interactive Platform) was effective to enhanced Grade 10 Thai students’ Chinese language reading, and students’ learning attitude was high towards the use of UMU (Interactive platform) in learning Chinese language reading."], ["https://openalex.org/W3128085465", "A STUDY OF ACADEMIC ANXIETY AND HOME ENVIRONMENT IN RELATION TO THE ACADEMIC PERFORMANCE", 2021, "article", 3, "Sleep and related disorders", "World has become a place of great unnatural competition and academic achievements are a bench of success in student life. To achieve greater success, students must taste the cut-throat contention, which in turn makes them anxious, worried, and sometimes poor performers too. Students with high levels of anxiety show passive attitude towards studies, lack of concentration and confidence, reduced memory span and poor reasoning abilities These psychological symptoms ultimately affect the potential to achieve good grades and significantly interferes with the daily routine of the student too. The present study deals with academic anxiety and home environment in relation to their academic achievement.\r\nBanga (2016) carried out a study to find out the levels of anxiety among 400 senior secondary boys and girls of Himachal Pradesh. Findings of the study clearly showed that significant difference existed in the levels of anxiety between boys and girls, Girls were more prone to anxiety than that of boys. Mahajan (2015) revealed in their study that no significant difference existed in the academic anxiety of male and female secondary school students moreover a significant difference is found in the academic anxiety of government and private secondary students. He also reported that academic stress was significantly and negatively correlated to parental encouragement. Shakir (2014) made a correlational study between academic anxiety and academic achievement based on gender. Findings clearly showed a negative relationship between academic anxiety and achievement. Gender also affects the anxiety; females were more anxious than male. Kumar& Kumar (2014) investigated the relationship between academic anxiety and academic achievement, in their study on senior secondary students and reported a negative and significant relationship between anxiety and academic achievement. Moreover, it was also reported that girls were more affected by anxiety than boys."], ["https://openalex.org/W3134956810", "DEVELOPMENT OF CONTEXTUAL-BASED THEMATIC TEACHING MATERIALS TO IMPROVE STUDENT LEARNING OUTCOMES GRADE V PUBLIC ELEMENTARY SCHOOL PERCONTOHAN KABANJAHE", 2021, "article", 0, "Educational Research and Methods", "The purpose of this study was to determine the development of contextual-based thematic teaching materials to improve student learning outcomes. The subjects in this study were 60 students of grade V-A and V-B Public Elementary School. The object of this research is contextual-based thematic teaching materials for fifth grade students of Public Elementary School Percontohan Kabanjahe. The teaching materials developed are student books. This research is a Research & Development (RD (2) the increase in the average result of student learning outcomes increased by 0.5 in the medium category."], ["https://openalex.org/W3137542213", "Hyperball packings related to truncated cube and octahedron tilings in hyperbolic space", 2020, "article", 1, "Supramolecular Self-Assembly in Materials", "In this paper, we study congruent and noncongruent hyperball (hypersphere) packings to the truncated regular cube and octahedron tilings. These are derived from the Coxeter truncated orthoscheme tilings $\\{4,3,p\\}$ $(6< p \\in \\mathbb{N})$ and $\\{3,4,p\\}$ $(4< p \\in \\mathbb{N})$, respectively, by their Coxeter reflection groups in hyperbolic space $\\mathbb{H}^{3}$. We determine the densest hyperball packing arrangement and its density with congruent and noncongruent hyperballs.\r\n \r\nWe prove that the locally densest (noncongruent half) hyperball configuration belongs to the truncated cube with a density of approximately $0.86145$ if we allow $6< p \\in \\mathbb{R}$ for the dihedral angle $2\\pi/p$. This local density is larger than the B\\or\\oczky--Florian density upper bound for balls and horoballs. But our locally optimal noncongruent hyperball packing configuration cannot be extended to the entire hyperbolic space $\\mathbb{H}^3$. We determine the extendable densest noncongruent hyperball packing arrangement to the truncated cube tiling $\\{4,3,p=7\\}$ with a density of approximately $0.84931$."], ["https://openalex.org/W3138691442", "On the Modified First Zagreb Connection Index of Trees of a Fixed Order and Number of Branching Vertices", 2020, "article", 3, "Graph theory and applications", "The modified first Zagreb connection index $ZC_{1}^{*}$ for a graph $G$ is defined as $ZC_{1}^{*}(G)= sum_{vin V(G)}d_{v}tau_{v},$, where $d_{v}$ is degree of the vertex $v$ and $tau _{v}$ is the connection number of $v$ (that is, the number of vertices having distance 2 from $v$). By an $n$-vertex graph, we mean a graph of order $n$. A branching vertex of a graph is a vertex with degree greater than $2$. In this paper, the graphs with maximum and minimum $ZC_{1}^{*}$ values are characterized from the class of all $n$-vertex trees with a fixed number of branching vertices."], ["https://openalex.org/W3135071303", "Creating Intentionally Inviting School Cultures during Crisis", 2021, "article", 3, "Education and Critical Thinking Development", "This qualitative study used Purkey and Novack’s (1988) Invitational Education as a conceptual framework to understand how 30 educational leaders in Ohio’s urban and suburban districts created intentionally inviting school cultures during the 2020 COVID-19 pandemic. Findings indicated that leaders altered their leadership styles to focus on people rather than programs and policies in order to be more inviting. Challenges pertained to insufficient funding to provide professional development for teachers and parents and the need for more mobile devices and connectivity. This study is significant because it expands the invitational education framework to show how leaders are being intentionally inviting in time of crisis."], ["https://openalex.org/W3131357246", "The Role of Sociology in Development Primary School Education in Indonesia", 2021, "article", 3, "Education and Character Development", "The world is thriving thanks to technological advances. However, these advances have negative consequences that humans must face. One such consequence is the decrease in social interaction between people, including the very young. This article reveals the importance of sociology in the world of primary school education. The decreasing of social interaction in young children is attributed to rapid technological advances that have reduced the social interaction of primary school students. The purpose of this study was to determine the role of sociology in the development of primary school education in Indonesia. The article uses a literature study to obtain the essence of relevant scientific concepts. Data was collected from various sources, including articles, books, and studies. The scope of the study is the nation of Indonesia. The study reveals that sociology has a significant role in the world of primary school education. Social interaction needs to be instilled in children early in their lives, especially during primary school. Thus, sociology can aid the development of the science of primary school education. Keywords: sociology, education, primary school."], ["https://openalex.org/W3003959990", "Prediction Of Cognitive Impact Of Yoga And Meditation On Psycho-Physiological Health For Students", 2020, "article", 2, "Sleep and related disorders", null], ["https://openalex.org/W3005609850", "Weighted composition operators on weighted Bergman spaces and weighted Bloch spaces", 2020, "article", 0, "Holomorphic and Operator Theory", "In this paper, we characterize the bonudedness and compactness of weighted composition operators from weighted Bergman spaces to weighted Bloch spaces. Also, we investigate weighted composition operators on weighted Bergman spaces and extend the obtained results in the unit ball of $mathbb{C}^n$."], ["https://openalex.org/W3002709266", "Economic Development and Female Labour Force Participation in Jordan: A Test of the U-Shaped Hypothesis", 2020, "article", 1, "Economic Growth and Development", "تهدف هذه الدراسة الى اختبار وتحليل العلاقة بين معدل مشاركة الإناث في سوق العمل والنمو الاقتصادي في الأردن ممثلا بحصة الفرد من الناتج المحلي الإجمالي الحقيقي خلال الفترة من 1990-2017 من حيث الاتجاه وشكل العلاقة. وتتمثل إشكالية الدراسة بأن معدل مشاركة المرأة الأردنية في النشاط الاقتصادي يعتبر من الأقل عالميا ( من أقل ثلاث دول في العالم) حسب مؤشرات البنك الدولي لعام 2017  بالرغم من الإنجازات الكبيرة التي تحققت للمرأة الأردنية خلال العقود القلية الماضية في الجوانب التعليمية والتشريعية والاقتصادية والاجتماعية التي كان يجب أن تعزز مشاركتها الاقتصادية. فالحقائق تؤكد زيادة مستويات تعليم المرأة وزيادة مشاركتها السياسية والاجتماعية، وانخفاض معدلات الخصوبة للمرأة الأردنية.  و تفترض الدراسة وجود علاقة على شكل صيغة تربيعية بين معدل مشاركة المرأة والنمو الاقتصادي في الأردن مع الأخذ بعين الاعتبار أثر بعض العوامل ذات العلاقة مثل: مستوى التعليم، معدل البطالة للإناث، ونسبة التحضر. حيث أثبتت نتائج الدراسة وجود العلاقة التربيعية وبدلالة إحصائية قوية بين المتغيرين الرئيسيين وأن معدل مشاركة المرأة الأردنية يتأثر سلبيا بالنمو الاقتصادي والذي يبدو أنه ملائم أكثر للقوى العاملة من الرجال.  كما أكدت الدراسة على التأثير الإيجابي القوي للتعليم والتحضر على معدل مشاركة المرأة الأردنية في سوق العمل. وأظهرت النتائج كذلك سيادة العامل المضاف على العامل المثبط المرتبط بمعدل البطالة والذي تبين من خلال العلاقة العكسية بين النمو الاقتصادي ومعدل المشاركة. وتؤكد الدراسة بأن النمو الاقتصادي بحد ذاته لن يعزز مشاركة المرأة الاقتصادية وتوصي بمراجعة جميع السياسات والإجراءات المتعلقة بجوانب الطلب والعرض والتي قد تعزز مشاركة المرأة الاقتصادية مثل ظروف سوق العمل ومدى موائمتها لعمل المرأة، وسياسات التعليم التقليدي والمهني لزيادة فرص المرأة في دخول سوق العمل."], ["https://openalex.org/W3009348855", "Prediction of multipurpose dam inflow using deep learning", 2020, "article", 8, "Hydrological Forecasting Using AI", null], ["https://openalex.org/W3015979349", "Multiple-character Animation Systems for Children at Different Educational Stages", 2020, "article", 3, "Human Motion and Animation", null], ["https://openalex.org/W3014742547", "Acetic Acid by Product From Various Fermentations of Fermented Biogas Excess Sludge and Acidic Sludge Substrate", 2020, "article", 0, "Wastewater Treatment and Nitrogen Removal", "The aim of this study was to investigate the optimum conditions for acetic acid production from various excess sludge as carbon sources for biological phosphorus removal processes. Two substrates used to produce acetic acid which were wastes from fermented biogas production system after 10-day fermentation (fermentation sludge, (FS)). The fermentation was carried in batch system with 3 substrate series. The substrates were combined with FS and acid fermentation (AF) in three different ratios; FS: AF (1:1), RS: AF (4: 1) and RS:AF (1: 4) in series 1, 2 and 3, respectively. Further investigation regarding the influence of temperature, pretreatment and the proportion of fermentation sludge (FS) and acid fermentation (AF) were also conducted. The results showed that the highest concentration of acetic acid was 1,406 mg COD/L in the reactor containing FS: AF 1: 1 (series 1) substrate after 96 hours with control conditions at 35 °C whereas similar combinations in reactor 2 and 3 produced lower concentration of acetic acid (1,018 and 792 mg/l, respectively). The Paired t-test of series 1-3 showed significant difference of acetic acid production (p < 0.05) for FS in series 1 and RS in series 2-3. The composition in experimental series 1 can be applied to produce acetic acid as carbon source for the biological phosphorus removal for reducing the cost of acetic acid production."], ["https://openalex.org/W3015055746", "New Administrative Reform In Tax Dispute In An Emerging Economy", 2020, "article", 0, "Taxation and Legal Issues", null], ["https://openalex.org/W3016193349", "A study on User Experience for Home Appliances Experience Service Design", 2020, "article", 2, "Consumer Perception and Purchasing Behavior", null], ["https://openalex.org/W3099692990", "Quantization of Space-Time Explains Matter and Its Aspects", 2020, "article", 0, "Computational Physics and Python Applications", "In this paper, I present a theory that by quantizing space-time in such a way that I can calculate all of the constants of physics and derive and explain every equation therein. The magnetic field appears when the electric field seems to travel faster than c. In the same way an “anti-gravity” perpendicular to the gravity field appears, totally dependent on relative velocities, since the electric and gravity fields are made of the same micro-lines and are different aspects of the same force. This gravitational perpendicular force can be repellent, when masses travel in the same direction (massive distant galaxies travelling at near light speed would repel greatly and enlarge the universe) and it can attractive if the masses are travelling in the same direction (opposite arms of a spiral galaxy) in this paper, the electric and gravitational forces are shown to be unified. The recent detection of gravity waves is evidence for this, since a perpendicular gravity field would be needed to make a wave."], ["https://openalex.org/W3088601350", "Measuring the Relative Efficiency Of Course Delivery Modes Using Data Envelopment Analysis", 2020, "article", 0, "Efficiency Analysis Using DEA", "This paper uses Data Envelopment Analysis to measure the relative efficiency of online and face-to-face delivery of the Principles of Microeconomics course at Bowie State University. The data used in estimating the relative efficiencies of the different modes of course delivery was collected from two online sections and two face-to-face sections of the course in 2019. The study considered each of the course sections as an operating decision-making unit. The variable returns to scale model oriented towards maximizing output was used to estimate the technical and scale efficiencies of the course delivery modes. The results indicate that the two online sections were identified as efficient while one section of the face-to-face was considered as efficient. The results suggest that the Data Envelopment Analysis technique used to assess relative efficiency in the delivery of the four-course sections present plausible quantitative information for comparative analysis and strategy to improve student learning outcomes."], ["https://openalex.org/W3092682928", "Synthesis of a new crosslinked poly-bisphenol a diglycidyl ether (poly-BADGE) as a carrier in phenol transport", 2020, "article", 2, "Extraction and Separation Processes", null], ["https://openalex.org/W3101420201", "Central-Regional Government Financial Balance in Implementation of Regional Autonomy in Bali Province", 2020, "article", 0, "Economic Growth and Fiscal Policies", "The Law No. 23 of 2014 on Regional Government and the distribution of regional taxes and levies by the Law No. 28 of 2009 on Regional Taxes and Regional Levies which are the right of regency/city government, the implication is that there is a big gap in the area of local revenue (PAD) which affects the imbalance of development between regions and equitable distribution of public welfare. To overcome this income inequality, the central government has an instrument through a central-regional financial balance to overcome both vertical and horizontal gaps. From the revenue structure, it turns out that the income of the financial balance of the central-regional is far greater than the local revenue. This indicates that the regional government still depends on the central government and the balance fund formula is an expectation for the regencies/city in Bali. This research uses normative legal research. The result of the research shows that the source of local revenue for regencies / cities throughout Bali, it turns out that the funds originating from the central financial balance in the regions are greater than the original regional income. This is a parameter that the regions still have a high dependence on the central government in obtaining financing for the implementation of regional autonomy.\nKeywords: Income inequality, local revenue and financial balance"], ["https://openalex.org/W3093048779", "Markovian analysis of a birth-death process", 2020, "article", 0, "Transportation Planning and Optimization", "Markovian models basically refers to models which, largely, relies on the present state to predict the future. A birth process refers to the arrival of a customer to a system and a death process explains the departure of a customer from a system. This study modelled queues at the revenue collection points using the Markovian birth-death analytical models. The traffic intensity and waiting times were estimated from the secondary data collected from the revenue collection point. The focus was on Markovian queuing systems with infinite capacity that is M/M/m models, where m≥1. The queuing model employed at Bus Park Revenue collection point was identified to be M/M/2. The traffic intensity of the service station was estimated and it was discovered that the Birth rate > death rate, that is ρ2 =1.029412, indicating that the system was unstable. This indicated that the queue could grow indefinitely. As a result it was difficult to obtain other performance parameters. As a remedy, this study resorted to addition of a server with same rate of service, 70 customers/hr, to the system. This study assumed that the service distribution was the same for all the servers. On addition of a server the estimated number of customers in the system reduced significantly. After conducting queue analysis, this study concluded that the system at Bus Park Revenue collection point was not stable. This study recommended the addition of a server to the revenue collection point. Additionally, future researchers should conduct a non Markovian analysis of a birth-death process to determine if the same results could be realized."], ["https://openalex.org/W3095846244", "A novel FPGA-Based Multi-Channel Signal Acquisition System Using Parallel Duty-Cycle Modulation and Application to Biologic Signals: Design and Simulation", 2020, "article", 4, "ECG Monitoring and Analysis", "This paper presents the design and simulation of a new FPGA-based multichannel signal acquisition system, involving parallel DCM (duty-cycle modulation) of four biologic signals, i.e., respiratory, PPG (photoplethysmography), ECG (electrocardiography) II and V. Then, the resulting modulated inputs are simultaneously oversampled and converted into digital waves, by a low-pass decimation IIR (infinite impulse response) filter per channel. The relevant novelty brought by this new multichannel signal acquisition scheme, relies on a number of merits, e.g., 01 basic DCM circuit and 01input pin (or bit) of the FPGA per analog channel, IIR filter with 30 Hz cut-off frequency per channel (then no need of 50 or 60 Hz notch filters). As   relevant merits,  the proposed multichannel architecture offers minimum interfacing hardware while requiring minimum software resources. The virtual model of that acquisition system, is designed and implemented in Matlab/Simulink framework, using: a) modulating   biologic signals imported from Physionet bank; b) Simulink blocks for DCM interface; DSP Builder blocks (for parallel IIR filters); c) 50 MHz sampling frequency, with  60 bits precision coefficients; and d) virtual oscilloscopes. The predicted results presented for 04 biologic signals, are very satisfactory. In future research works, the VHDL code will be generated and compiled in Quartus II for uploading into DE10-NANO-SoCFPGA, in order to build our new FPGA-based multichannel biomedical instrument."], ["https://openalex.org/W3093891841", "Level of calcitonin gene-related peptides in elderly and adult periodontitis patients", 2020, "article", 0, "Vagus Nerve Stimulation Research", null], ["https://openalex.org/W3138401455", "Electrodiagnostic Evaluation Of Tarsal Tunnel Neuropathy", 2021, "article", 2, "Peripheral Nerve Disorders", "Often, it is difficult to fully elucidate a neuromuscular diagnosis with history and physical examination alone. Furthermore, many neuromuscular diagnoses cannot be identified on an MRI or CT scan and thus require an alternate modality to identify—this is the role of the electrodiagnosis techniques: Electroneurography (ENG) and electromyography (EMG). Specifically, ENG and EMG are useful in identifying peripheral neuropathies caused by compression of the tibial nerve. Neuropathy of the posterior tibial nerve is a relatively rare condition that causes foot and ankle pain, paresthesia, and even weakness of the intrinsic foot muscles.When this neuropathy occurs in the tarsal tunnel, it is known as tarsal tunnel syndrome. This condition is most frequently caused by external compression by ill-fitting footwear or tight plaster casts. Other causes are posttraumatic fibrosis and acute trauma (such as those from sprains, strains, fractures) but can also result from lipomas, cysts, tumors, soft tissue infection, and inflammatory arthropathies. A true entrapment from a thickened flexor retinaculum is rare.Electromyography can be used to identify the specific muscles affected by a nerve lesion. If a nerve lesion localizes to the tarsal tunnel, the practitioner must determine the cause of the compression."], ["https://openalex.org/W3124142620", "Designing an Intelligence Model for Auditing Professional Ethics in Knowledge Contents Production", 2020, "article", 1, "Ethics in Business and Education", "One of the main concerns of scholars is the observance of intellectual property rights in the production of knowledge content. Data and knowledge derived from the results of research need to be produced based on ethical issues in order to provide context for solving problems through innovation, scientific accuracy and relevance on the basis of ethical principles. In this research, the intelligent knowledge audit model was designed for Islamic Azad University. The present research is applied and in the first stage due to the recognition of the dimensions of the model, is exploratory, in the second phase, the comparative study of the selected models, and in the third stage is analytical. The data gathering tool were a researcher-made questionnaire and interview. In the present research, a questionnaire was distributed through a sample of 205 professors and PhD candidates in the field of information technology management. The questionnaire was analyzed using structural equation modeling, and the conformity between the independent variables and the dependent variable was presented. In the following, a comparative study of the selected models was performed and after analyzing the interviews with the experts, the final model was designed. As a result, the use of structural and semantic analysis methods in sequence can lead to the prevention of repetitive content. This is heavily needed in order to achieve a systematic ethical responsibility."], ["https://openalex.org/W3127942258", "PENGARUH CORPORATE GOVERNANCE TERHADAP PENGHINDARAN PAJAK", 2020, "article", 1, "Taxation and Compliance Studies", "Menurut Surat Direktur Jendral Pajak No. S14/PJ.7/2003, pajak merupakan unsur penting dalam rangka untuk menopang anggaran penerimaan negara. Membayar pajak merupakan salah satu cara penting bagi perusahaan untuk terlibat secara positif dengan masyarakat. Dengan membayar pajak, perusahaan secara tidak langsung telah membantu negara dalam mewujudkan kesejahteraan rakyat. Akan tetapi hal ini bertentangan dengan pemilik usaha yang pada umumnya cenderung mengurangi berbagai beban atau biaya usaha termasuk beban pajak. Hal ini dikarenakan pajak perusahaan sangat berpengaruh terhadap kinerja keuangan, likuiditas, hasil operasi dan arus kas, dan posisi keuangan sebuah perusahaan. Selain itu, pembayaran pajak oleh perusahaan tidak memberikan manfaat secara langsung bagi keberlangsungan perusahaan"], ["https://openalex.org/W3134223384", "Relationship between Job Stress and Occupational Exposure to Electromagnetic Fields and Workplace Lighting in Power Distribution Staffs", 2021, "article", 0, "Noise Effects and Management", "Job stress is one of the important factors for productivity in the workplace. Stress can be defined as physical and mental changes when responding to different environmental conditions. Exposure to the physical hazards of the work environment can cause a person's behavioral change also the psychological hazards of the workplace, such as job design, management, and organization can hurt workers. This descriptive cross-sectional study was conducted in August to February 2018 in Northwest Iranian Power Distribution Company. The combination of self-reporting and observation techniques was used to collect data. The result shows that the average job stress is 171.6 ± 17.5, which represents the moderate-high level. There was a significant difference between the mean electric field, role boundary (P=0.005), physical environment (P=0.045), and magnetic field, role insufficiency (p=0.001), the results show the relationship between variables and job stress in a way that there is a direct relationship between work hours and occupational stress and increases with the increase in the hours of work, but the job stress also increases and this is accepted by other studies. In this study, we found the relationship between job stress and occupational exposure to electromagnetic fields and workplace lighting."], ["https://openalex.org/W3133854004", "Literature Review on Self-Harm and Suicidal Tendencies using Machine Learning Technology", 2020, "article", 0, "Diverse Approaches in Healthcare and Education Studies", null], ["https://openalex.org/W3129696032", "Anatomy, Head and Neck, Suboccipital Muscles", 2021, "article", 3, "Spinal Fractures and Fixation Techniques", "The suboccipital muscles are a group of four muscles that are located inferior to the occipital bone. These four muscles include the rectus capitis posterior major, rectus capitis posterior minor, obliquus capitis superior, and obliquus capitis inferior. The muscles serve as postural support and allow extension and rotation movements of the neck. The muscles are innervated by the suboccipital nerve, which is formed by the dorsal ramus of C1. Three of the four muscles form the suboccipital triangle, a common anatomic landmark that localizes the vertebral artery and suboccipital nerve. This landmark is of particular importance to surgeons who operate in the posterior cervical region to avoid life-threatening bleeding.The vertebral artery travels a torturous course behind the suboccipital muscles while giving off branches that supply the suboccipital muscles. Clinically, the suboccipital muscles have importance regarding their close relationship to the vertebral artery and surgical access to the posterior cranial fossa. Various cranial pathologies can be accessed by a suboccipital surgical approach that requires knowledge of the posterior cervical region. The group of four muscles has been implicated in the pathogenesis of cervicogenic headaches due to their connections with the dura mater."], ["https://openalex.org/W3128975527", "Different levels and methods of NPS application impact on yield and yield components of Faba bean (Vicia faba L.) in Bale highlands, South eastern Ethiopia", 2020, "article", 0, "Genetic and Environmental Crop Studies", "A field experiment was conducted at two locations in Bale, South eastern Ethiopia (Selka and Agarfa) for two consecutive years (2018-2019) to study the responses of improved Faba bean to rates and methods of NPS application and assessing the economic feasibility. The treatments were six levels of NPS (25, 50, 75, 100, and 125 kg ha-1) and two methods of application (Broadcasting and Band application) laid in randomized complete block design (RCBD) with three replications. Faba bean variety ‘Alloshe’ was used as a test crop. The analysis showed that almost all parameters studied were not significantly (P<0.05) affected by the main effect of blended NPS fertilizer and methods of application at both locations over years. This could be due to relatively medium to high accumulation of studied nutrients in the soil and conducive environmental conditions in the specific area. Therefore, based on this findings future research should focus on prior soil test based fertilizers recommendations."], ["https://openalex.org/W3133262648", "Solution Of Integral Equations Of Volterra Type Using The Adomian Decomposition Method (ADM)", 2020, "article", 3, "Fractional Differential Equations Solutions", "This paper presents an alternative semi-analytical method for the solution of the Volterra integral equations.\r\nThe solution of the Volterra integral equations has been decomposed into an infinite series of components\r\nvia the Adomian decomposition method (ADM). Furthermore, four illustrative examples were solved to\r\nmeasure the performance of ADM in terms of suitability, convergence and accuracy. Moreover, the results\r\nobtained via ADM were compared with the exact solution. Hence, ADM is found to be a good tool for the\r\nsolution of Volterra integral equations and also minimizes the volume of calculations."], ["https://openalex.org/W3169496696", "Prevalence of Vitamin D Deficiency and Insufficiency Across Trimesters of Pregnancy in Maiduguri, Nigeria: A Cross-Sectional Study", 2021, "article", 1, "Vitamin D Research Studies", "To determine the prevalence of Vitamin D deficiency and insufficiency across trimesters of pregnancy. A cross-sectional study involving 160 women (40 in each trimester of pregnancy making a total 120 and 40 non-pregnant controls) was conducted at the University of Maiduguri Teaching Hospital, Maiduguri from 1st January 2018 to 31st December 2018. The subjects of the study were randomly recruited at the booking clinic. Socio-demographic characteristics, staple food and gestational age were obtained. Blood sample was collected for 1,25(OH)2 D3, total protein and albumin. The data was analyzed using the Minitab statistical software version 12.21 (Minitab Inc, Pennsylvania, USA). The Mean±SD age of the patients studied was 28.2±4.1 year and 114 (71.3%) were city dweller. There were no statistically significant differences in the parity, BMI, total protein and albumin in both the subjects and controls. On the other hand, the Mean±SD Vitamin D level was lower (23.11±4.27Miu) among the pregnant women compared to 34.78±2.96 Miu in the non-pregnant (F=17.40, P=0.00). Vitamin D deficiency was 52.5% in the first trimester, increased to 55.0% in the second trimester and dropped to 22.5% in the third trimester. While, vitamin D insufficiency roused from 40.0% in the first trimester to 60.0% in the third trimester. There is high prevalence of Vitamin D deficiency and insufficiency among pregnant women in Maiduguri. There is need to provide vitamin D supplementation preconception or early in the antenatal period so that the women will achieve Vitamin D sufficiency in pregnancy and beyond"], ["https://openalex.org/W3167919672", "The Effect Of Corporate Governance Mechanism On Earnings Management: The Comparative Studies Between Firms Listed On Sharia Index (Jii-70) And Conventional Index (Lq-45)", 2021, "article", 2, "Corporate Governance and Financial Management", "This research aimed to examine the effect of corporate governance mechanism on earnings management. The independent variables are board of commissioner size, board of commissioner meeting, board of commissioner independence, Board of competence, managerial ownership, and institutional ownership. In contrast, the dependent variable is earnings management. The sampling method was employed by purposive sampling. The research sample consisted of 305 companies in Indonesia. It contains 110 Sharia companies listed on JII-70 and 195 conventional companies listed on LQ-45 from 2015 until 2019. This research used multiple linear regression to examine the effect of independent variables on the dependent variable. The results show that board of commissioner size negatively affects earnings management, while the other corporate governance mechanism variables, which are board of commissioner meeting, board of independent commissioner size, board of commissioner competence, managerial ownership and institutional ownership have no effect on earnings management. In addition, the classification of company which measured by dummy variable is positive and significant, it means that the effect of corporate governance mechanism between companies listed on JII-70 and LQ-45 is different, and the effect is greater in companies listed on JII-70 than companies listed on LQ-45. Keywords: Corporate Governance Mechanism, Earnings Management."], ["https://openalex.org/W3167347363", "Sports and Games Advertising Themes", 2021, "article", 0, "Marketing and Advertising Strategies", "Abstract \r\nAn activity involving physical exertion and skill in which an individual or team competes against another or others for entertainment is called sport. It is an inseparable element of our day-to-day life and thanks to its universality it allows people, social groups, nations and societies to communicate with each other, regardless of any differences between them. Not only the popularity of sport, but also its multidimensionality, a number of inherent attributes, strong feelings which surround it and the high efficiency of ads translate into increased interest in sports sponsorship. However, sports-based communication is not reserved only for sponsors. In communication, sports themes are exploited by many other companies that are not related to sponsorship. They use commonly available associations related to sport and its attributes. By using them, they not only sell products and services, but also build a spiritual bond, community of experiences and goals, while focusing on making emotional relationships with recipients at the same time. Such communication influences better understanding and perception of the brand, which leads to the purchasing decisions of consumers. Bearing in mind that sport is so important for recipients, its multidimensionality, how eagerly it is used as a communication platform, questions arise as to what companies actually communicate using sports themes. This is especially true in the area of advertising and its skyrocketing reach, the most persuasive, effective and edifying attitudes and forms of brand promotion. With a help of sports themes, advertisements not only refer to feelings close to us and enter the sphere of our interests, passions and goals, but also refer to our system of values and convey universal ideas with which selected groups of recipients can identify. This helps in positioning the advertiser's brand, creates its unique image and the opportunity to communicate with customers on a level close to them. The aim of the study is to show the most common sports themes used in advertising, both in the communication of companies directly and indirectly related to sports. It presents disciplines that were most often used in advertising spots, sports themes that were implemented and whether they served to support sales. or building a brand image and establishing relationships. The study included analysis which considered 200 advertising campaigns of 60 mainly international companies from the European and American markets."], ["https://openalex.org/W3167853209", "The annihilator graph of modules over commutative rings", 2021, "article", 1, "Rings, Modules, and Algebras", "Let $M$ be a module over a commutative ring $R$, $Z_{*}(M)$ be its set of weak zero-divisor elements, andif $min M$, then let $I_m=(Rm:_R M)={rin R : rMsubseteq Rm}$. The annihilator graph of $M$ is the (undirected) graph$AG(M)$ with vertices $tilde{Z_{*}}(M)=Z_{*}(M)setminus {0}$, and two distinct vertices $m$ and $n$ are adjacent if andonly if $(0:_R I_{m}I_{n}M)neq (0:_R m)cup (0:_R n)$. We show that $AG(M)$ is connected with diameter at most two and girth at mostfour. Also, we study some properties of the zero-divisor graph of reduced multiplication-like $R$-modules."], ["https://openalex.org/W3165908948", "NGO Involvement in Educational Policy: The Perceptions of NGO Executives.", 2020, "article", 0, "Nonprofit Sector and Volunteering", null], ["https://openalex.org/W3167106455", "Inviting Narrative Back into the Science Classroom: Telling the Stories of the Elements with Graphic Novels.", 2020, "article", 3, "Digital Storytelling and Education", "This article presents a way to integrate storytelling with the teaching of science. By making graphic novels. It describes how gifted 9- and 10-years-old students at the author’s school researched the elements found in the human body and then created illustrated poems tracing the entire “history” of individual atoms. The article explores the way in which writing stories cam support meaningful scientific communication, facilitate connection with the natural world and build sound understanding of complex topics, particularly those involving microscopic and massively macroscopic processes in secondary school curricula. The possible origins of the scientific community’s disregard for stories are also addressed."], ["https://openalex.org/W3160282168", "Investment Climate and Firm Technical Efficiency in Vietnamese Manufacturing", 2020, "article", 0, "Economic Growth and Productivity", null], ["https://openalex.org/W3164448704", "Elucidating E-satisfaction and Sustainable Intention to Reuse Mobile Food Application Service, Integrating Customer Experiences, Online Tracking, and Online Review", 2020, "article", 0, "Technology Adoption and User Behaviour", null], ["https://openalex.org/W3168084057", "Discrete Fracture Network insights by eXplainable AI", 2020, "article", 2, "Explainable Artificial Intelligence (XAI)", null], ["https://openalex.org/W3158660429", "Diversity of Ferns (Pteridophytes) from Dang Region of Gujarat", 2020, "article", 0, "Fern and Epiphyte Biology", "Ferns are the lower vascular plants diverse in number and habitat. Present article deals with the study of ferns from Dang forest of Gujarat. Three localities of Dang forest like Shabaridham, Pampa Sarovar and Subir were undertaken for survey. Four species of ferns belonging to four genera viz. Actinopteris radiata Link, Adiantum caudatum Linn, Athyrium asprum (Blume) Wilde and Cheilanthes albomarginata Clarke were recorded. Morphological details of every species is provided."], ["https://openalex.org/W3085617422", "Advances In Security And Privacy Of Data In Cloud Computing: Survey And Discussions", 2020, "article", 0, "Cryptography and Data Security", null], ["https://openalex.org/W3087771187", "Screening of elite rice genotypes for brown plant hopper (Nilaparvata lugens Stal)", 2020, "article", 0, "Agricultural pest management studies", "Ninety-four popular elite rice varieties for different ecologies of different states were evaluated for BPH in net house condition. Out of these, eleven varieties are moderately resistant to BPH having score 3. The resistant varieties are Balum-2, Megharice -3, Imp sabaramati, GR-7, Karjat-3, MTU 1061, MTU 1075, RTN-3, R-Suwasini, Pravat, Santepal. Twenty-four varieties are moderately susceptible having score 5, thirty-two varieties are susceptible having score 7 and twenty-seven varieties are highly susceptible to BPH having score 9."], ["https://openalex.org/W3083936720", "EFFICIENT ARCHITECTURE OF BCD SUBTRACTOR BY MAJORITY GATES IN VLSI", 2020, "article", 0, "Quantum-Dot Cellular Automata", null], ["https://openalex.org/W3046596014", "AN OVERVIEW OF CONFINED MASONRY STRUCTURES AS SEISMIC RESISTANT STRUCTURE", 2020, "article", 0, "Masonry and Concrete Structural Analysis", "Seismic force is a major concern for the engineers nowadays especially in countries like India where the occurrence of earthquakes are frequent nowadays. In order to make a structure seismic-resistant, engineers opt for ductile design, ductile detailing, shear wall construction, etc. which ultimately sometimes increase the cost for small and medium height structures. Confined Masonry are those structures which are mainly built with walls but are confined with beams and columns which are poured after the walls are built. For Medium and Low height structures, this Confined Masonry structures gives a good performance against seismic forces and hence can be used as a Seismic Resistant Structures economically. This paper mainly deals with the Overview of Confined Masonry Structures, their differences with RC structures and some basic guidelines for construction of Confined Masonry Structures which are collected from various research papers and books. It also highlights various analysis techniques of Confined Masonry Structure and its elements from various research wor"], ["https://openalex.org/W3048050828", "The Effect of Liquidity and Size of The Company Towards Company Tax Aggressiveness", 2020, "article", 3, "Financial Analysis and Corporate Governance", "This study aims to find empirical evidence of the effect of liquidity and firm size on the tax aggressiveness of companies listed on the Indonesia Stock Exchange for the period 2012-2017. The study was conducted on 17 food and beverage companies listed on the Indonesia Stock Exchange, using a purposive sampling method through predetermined criteria. The data obtained were 7 companies that were used as research samples with observations over the six years 2012-2017, furthermore total observations were as many as 42 samples. The data used are secondary data, namely the company's annual financial statements for the period 2012-2017. Data analysis method used in this study is normality analysis. The results showed that: liquidity has no significant effect on corporate tax aggressiveness, while company size has a significant effect on corporate tax aggressiveness as well as liquidity and company size has a significant effect on corporate tax aggressiveness."], ["https://openalex.org/W3045436183", "Mixed Control Chart Design Using the Integration of Genetic Algorithm and Monte Carlo Simulation", 2020, "article", 1, "Advanced Statistical Process Monitoring", "This research proposed a design of mixed control charts to monitoring the process quality based on attribute data together with variable data called a Mixed NE chart. The integration of Genetic Algorithm (GA) and Monte Carlo (MC) simulation are used to simultaneously assess the efficiency of a Mixed NE chart based on three different scenarios of the control limit coefficients (L np ,L EWMAX_bar-R ). In this study, MC simulation is used to evaluate the maximum average of run length in case of in-control process ARL 0 while the GA is demanded to optimize the control limit coefficients that obtain the maximum ARL 0 . In addition, the efficiency of the Mixed NE chart according to the process shifts are measured using the average of run length in case of out of control process (ARL 1 ) and the extra quadratic loss (EQL). The results indicate that the Mixed NE chart performed well for small sample size(n), low smoothing constant (Lamda W ,Lamda Z ) and the optimal design of control limit coefficient is L * np > L * EWMAX_bar-R . Moreover, the optimal design of the Mixed NE chart brings new important perspectives to achieve the most efficiency of control chart."], ["https://openalex.org/W3087629112", "Elasticity - Income from Private Sector Demand for Presential Higher Education in Brazil", 2020, "article", 0, "Education and Public Policy", "Brazilian higher education registered a remarkable growth from the 90's, explained by the changes that occurred in the Law of Directives and Bases of Education (Lei de Diretrizes e Bases da Educacao- LDB) of 1996. These changes enabled the expansion of the private sector, by more than 500%, from the 80's until the year 2018. This article analyzed the income elasticity of demand based on data from the Higher Education Census and the Average Income of the Brazilian population in the period from 1984 to 2018. The aim is to demonstrate how family income substantially influences the number of students enrolled in private higher education in the country. The calculation showed an elasticity of approximately 2.96, that is, for each unit increased in the income of the Brazilian population, the demand for higher education will be increased by approximately 2.96 units. The results obtained, based on the growth of the country's income, help in the projection of future enrollments, in the revenue forecast and in the preparation of the sector's business planning."], ["https://openalex.org/W3047099188", "Pediatric Inflammatory Bowel Disease in the Setting of Obesity: A Paradigm Shift?", 2020, "article", 0, "Adolescent and Pediatric Healthcare", "The percentage of IBD patients who are obese at diagnosis is steadily increasing. Malnutrition in IBD is associated with increased morbidity and therefore prompt nutritional management is essential to improve outcomes. Obesity, a form of malnutrition and an inflammatory state in itself, may affect diagnosis, treatment and prognosis. We present two obese pediatric IBD patients to demonstrate how obesity may negatively impact diagnosis and clinical course. In one case, the presence of obesity, despite significant weight loss, led to delayed diagnosis. In the other, obesity may have complicated the patient’s overall clinical course. Nutritional assessment based on BMI alone may be challenging and inaccurate in overweight or obese patients."], ["https://openalex.org/W3045830623", "Pleomorphic Lipoma of Foot- A Rare Case Report and its Literature Review", 2020, "article", 0, "Sarcoma Diagnosis and Treatment", "Lipomas are the most common soft tissue tumor found in adults and occur slightly more often in men than in women. Lipomas are uncommon in foot. Here we are discussing a case of 50 years old female presented with complaint of painless swelling over dorsolateral aspect of right foot for about 10 years. Fine Needle Aspiration Cytology was inconclusive. Swelling was excised under local anesthesia and histopathological examination proved it to be pleomorphic lipoma. A thorough review of literature was done emphasizing the rarity of this common tumor (lipoma) at this uncommon site (dorsum of foot)."], ["https://openalex.org/W3049536799", "Modern Principles of Management of Patients with Non-Alcoholic Fatty Liver Disease", 2020, "article", 0, "Liver Disease Diagnosis and Treatment", "Evaluation of all treatment methods and pharmacotherapy of non-alcoholic fatty liver disease (NAFLD). The development of obesity and the rapid spread of diabetes have led to the fact that NAFLD is now the most famous liver disease. The main non-pharmacological treatments for NAFLD are a low-calorie diet with a sufficient content of polyunsaturated fats and dosed physical activity in order to reduce BMI. Among the drugs, the leading positions are occupied by insulin sensitizers, antioxidants (vitamin E) and polyunsaturated fatty acid preparations (Essential Forte N). Several new drugs for the treatment of NAFLD are in the process of clinical trials. Due to the high increase in the frequency of NAFLD, new methods for diagnosing and treating this disease are being actively developed."], ["https://openalex.org/W3081901136", "REMOVAL OF HEAVY METAL FROM WASTE WATER BY ELECTRO CHEMICAL OXIDATION (COAGULATION) PROCESS", 2020, "article", 0, "Adsorption and biosorption for pollutant removal", "From last several decades Heavy metals pollution has become a more serious environmental problem as a result releasing toxic materials into the environment. There are lot of techniques physical , chemical , biological , advanced oxidation and electrochemical processes were used for the treatment of domestic, industrial and agricultural effluents. Heavy metals from the earth's crust to the environment due to rapid developments and increase in mining and industrial activities. The presence of this toxic metals in environment cause the changes of human exposure to these metals in excess of their natural levels through ingestion, inhalation or skin contact. Heavy metals are toxic for human health and all watery species depending on their concentrations and bioaccumulation conditions. Specific gravity greater than about 5 or relatively high density or high relative atomic weight is called as heavy metals (especially one i.e. poisonous) one mercury or lead. Heavy metals have density criteria range from above 3.5 g/cm3 to above 7 g/cm3. From the experimental analysis it’s clear that the % removal of metal increase with decrease in concentration and the % removal of metal increase with increase in contact time . The optimum value of concentration is 5-10 ppm in which higher % of metal removed after this % reduction of metal is decrease. The optimum value of contact time is 30-90 min . in which higher % of metal removed after this % reduction of metal is constant The % removal of metal increase with increase in pH. The optimum value of pH 5-6 in which higher % of metal removed after this % reduction of metal decrease."], ["https://openalex.org/W3210004968", "Design, Synthesis, Characterization, Molecular Docking, DFT, DNA binding, cleavage and anti-angiogenic activities of Co(II), Ni(II) Zn(II), Cd(II) and Cu(II) complexes", 2021, "article", 0, "Metal complexes synthesis and properties", "The metal complexes of Nickel(II), Cobalt(II), Copper(II), Zinc(II)and Cadmium(II) derivatives of N, N’ Bis-(3,4,5-trimethoxy benzylidene)–benzene–1,2-diamine have been synthesized from o-phenylene diamine in the alcoholic medium. Using 1H NMR, Fourier-transform infrared spectral data, mass spectral data, Thermogravimetric studies, molar conductance, magnetic susceptibility data and micro-elemental analysis, the characterization of a series of M(II) complexes have done. From the spectral study, all the complexes (M1-M5) obtained were square planar except one which was octahedral configuration. The DNA binding, cleavage and anticancer activities shown by the complexes (M1-M5) were significantly better than the ligand. In-silico docking simulations predicted the anti-angiogenesis activity of the complexes against homo sapiens of VEGFR-2 and exhibited prominent interactions at the active site pocket region. Furthermore, density functional theory (DFT) was applied to calculate HOMO-LUMO, energy gap and other chemical reactivity parameters under PBE1PBE functional with lanl2dz basis sets."], ["https://openalex.org/W3217535970", "SEMANTICS OF SOMATIZM IN BLESSINGS OF ENGLISH AND UZBEK CULTURES", 2021, "article", 0, "Education, Innovation and Language Studies", "This article is devoted to the study of the semantics of somatizms in the blessings of English and Uzbek cultures. The article examines the main explanation of the ideas of expression: the values of life and longevity, health, happiness, which are widespread and valued in every culture, regardless of ethnic origin."], ["https://openalex.org/W3202941458", "UMUTeam at MeOffendEs 2021: Ensemble Learning for Offensive Language Identification using Linguistic Features, Fine-grained Negation, and Transformers.", 2021, "article", 3, "Hate Speech and Cyberbullying Detection", null], ["https://openalex.org/W3205768010", "On Evaluating the Volatility of Nigerian Gross Domestic Product Using Smooth Transition Autoregressive-GARCH (STAR - GARCH) Models", 2021, "article", 1, "Monetary Policy and Economic Impact", "STAR-GARCH models are hybrid models that combine the functional form of smooth transition autoregressive models and Generalized autoregressive conditional heteroscedasticity models. The two classes of STAR models considered in this paper are Exponential and Logistic Smooth transition autoregressive models (ESTAR and LSTAR). The functional form of each of this was combined with that of GARCH model and the resulting models becomes ESTAR-GARCH and LSTAR-GARCH models. The derived equations were applied to Nigerian gross domestic product (Real estate) for empirical illustration. Statonarity tests (Unit root test Graphical and correlogrom methods) conducted revealed that the series was stationary at Second difference. The hybrid models equations so derived were used to determine the model that performed better using the information criteria (AIC, SIC and HQIC), variances obtained from the data, performance measure indices (RMSE, MAE, MAPE THEIL U, Bias proportion, variance Bias proportion and covariance Bias proportion) analysis and in - sample forecast accuracy for the models. From all the criteria used it was observed that the duo of LSTAR-GARCH and ESTAR-GARCH models performed far better than classical GARCH model. However, LSTAR-GARCH performs slightly better than ESTAR-GARCH. From these results it is evident that volatility in Nigerian gross domestic product (Real estate) is best captured using Logistic smooth transition GARCH (LSTAR-GARCH) models, it is therefore, recommended for would be forecasters, investors and other end users to make use of LSTAR-GARCH models."], ["https://openalex.org/W3203923506", "Exploration of Job Satisfaction Level of University Teachers: A Comparison between Public and Private Universities", 2021, "article", 1, "Healthcare Education and Workforce Issues", null], ["https://openalex.org/W3211120422", "A Study on the advantages of Akshaya e-Centres among citizens in the Thiruvananthapuram District", 2021, "article", 0, "Social and Economic Development in India", "Information and Communication Technology (ICT) plays a prominent role in the success of e\u0002Governance, infrastructure and development of the economy in India. Akshaya project is the most fruitful e-governance program hurled in Kerala. It was one of the first district-wide e\u0002literacy projects in India to improve IT literacy among citizens in Kerala. Through every Akshaya e- centres a common man can access government services under a roof. The Akshaya project acts as a major tool by digitizing common people towards an improved life quality, easy access to information and complete SMART governance which leads to mass socio\u0002economic development through computer and internet technology. This project helps in creating great economic growth and providing a lot of employment opportunities in the state. They have also focused on certain factors like e-learning, e-transaction and e-governance. Hence this project has a great impact on the socio, economic and political views of the state. Citizens and their democratic governance systems as accompanying for achieving benefit from good access to information and services. This will provide a revelatory platform for the public sphere and increases their reachability to the Government. The study aims to examine the advantages of Akshaya e- centres and to know about the problems faced by the citizens in the services provided by the Akshaya Common Service Centres in the Thiruvananthapuram district of Kerala. The hypothesis of the study states that there is no significant relationship between the advantages of Akshaya e-centres and problems faced by citizens. The study concluded that there is a significant relationship between e-services of Akshaya and impact on services in the various field through quantities analysis. Citizen’s participation is a backbone of a democratic country like India and it is mandatory to provide a better service to them. Implementation of ICT is the best way to access all services from the government at a minimum cost and which reduces the digital divide and participatory e-governance. Akshaya project provides different kinds of e-services to the citizens but still, they face some problems while accessing the services. E-governance projects like Akshaya centres must be reachable to all rural people in every panchayat."], ["https://openalex.org/W3215277829", "Clinical Results Personalization 'S Approach S to Infertility Treatment", 2021, "article", 0, "Pelvic floor disorders treatments", "The aim of thestudy was to develop personalized approaches to the treatment of infertility of inflammatory etiology to increase the effectiveness of therapy. Under our supervision there were 250 women with infertility, who were individually selected treatment programs. A echenie should consist of the following stages. Conservative treatment (one, two, etc. courses): general and local. Surgical treatment: traditional operations, as well as with the use of laparoscopy, coagulation treatment of diseases of the cervix. The use of ART. It is imperative to restore the microbiota of the vagina, intestines and urinary tract."], ["https://openalex.org/W3210937903", "THE ACTIVITIES OF NON-ISLAMIC RELIGIOUS ORGANIZATIONS ON THE EXAMPLE OF FERGANA REGION IN TODAY", 2021, "article", 0, "Linguistic, Cultural, and Literary Studies", "This article provides religious tolerance and interethnic harmony in Uzbekistan and legal guarantees of social protection of multi-ethnic citizens in the political life of the country, the penetration of Christianity in the territory of Fergana region, the construction of churches and their present-day activities are covered."], ["https://openalex.org/W3207831388", "Incoming And Outgoing Mail Filing Information System Using The View Controller Model At College Institutions", 2021, "article", 0, "Blockchain Technology in Education and Learning", "Research aims (1) to improve the filing system that is still manual and can facilitate workmanship in inputting mail data (2) as learning the creation of information systems in the form of Web Base using model view controller programming methods. This research was conducted at a college institution. The method used in this study is the collection of data by observing directly on the research object regarding the workings of college institutions in handling the filing of incoming and outgoing letters. Furthermore, the data that has been obtained will be equipped with interview data about existing archiving.From the results of research that has been carried out it can be concluded that with the information system filing incoming le tters and exit letters can help, facilitate the work in filing at college institutions."], ["https://openalex.org/W3210862990", "POWER-AWARE SLEEP-SCHEDULED TREE-BASED ROUTING PROTOCOL", 2021, "article", 2, "Energy Efficient Wireless Sensor Networks", ": In wireless sensor networks, to reduce the energy utilization of sensor nodes, this paper presents a Power-Aware Sleep-Scheduled Tree-Based Routing Protocol EEPEG-PA that modifies the chain formation in PEGASIS. Using a distance and sensing range threshold, form a set of paired and unpaired nodes in the network. The paired nodes switch between active and sleep modes to eliminate redundant data and preserve the battery power. To minimize energy utilization as nodes switching between the modes, this scheme considers transitioning to be done based on the node’s residual energy approaching near depleted. To further reduce the energy utilization during transmission, this protocol uses prim’s minimum spanning tree mechanism to transfer the data from the active nodes to the Base Station (BS). Simulation results shows that this proposed mechanism can considerably improve network lifetime in comparison to PEGASIS."], ["https://openalex.org/W3207788000", "Factors influencing the financial performance of automobile companies in India using Du Pont Model", 2020, "article", 0, "Financial Reporting and Valuation Research", "The factors affecting the performance of the company in terms of profitability, turnover and leverage is illustrated by Du Pont Model. The study focuses on the constituents of Du Pont model in the Automobile sector in India. The automobile sector which constitutes around fifty percent of the manufacturing GDP in India is going through a rough phase with differences in effectiveness across the companies in the sector. The Du Pont Analysis distributes the Return on Equity (ROE) into two components -Return on Assets (ROA) and Equity Multiplier (EM).ROA can be further decomposed into Net profit margin (NPM) and Asset Turnover (AT) which are the important financial indicators of the performance of the company. The study exhibits the indicators and calculates the ROE using Du Pont Analysis for a time horizon of 10 years (2010-2019) to determine the effects of these indicators on ROE, PAT and Total sales in the model. Top eight Automobiles companies in India on the basis of their market capitalization are considered into study. The detailed analysis indicating the causal factors influencing the ROE, PAT and the Total sales by using Pearson correlation coefficients is presented in the study."], ["https://openalex.org/W3187996982", "Factors of Social Interaction at Waterfront Open Spaces - Jeddah Waterfront as a Case", 2021, "article", 2, "Maritime Ports and Logistics", "Public Open spaces represent a significant element of the urban structure of cities. Its importance lays on its ability to provide a place that encourages social interaction in order to strengthen the social life of the city residents. Jeddah as a coastal city known as “The Mermaid of the Red Sea” has a great potential to use its waterfront as a successful public open space that motivates the residents to socially interact, engage, and communicate as well as to strengthen their bond with the sea. In spite of this strong potential, previous studies show a gap in utilizing it effectively. This paper tries to investigate the different factors could be essential on enhancing the social interaction within the public open spaces focusing on the waterfront sites through theoretical review and examination of international case-studies. Accordingly, a scaling model will be created to evaluate the importance of these factors based on the users’ perception of Jeddah’s waterfront development in terms of social interaction aiming to introduce concluding recommendations for enhancing the social interaction capacity of Jeddah’s waterfront."], ["https://openalex.org/W3185444618", "The Relationship between Age Anxiety and Successful Aging in Middle-Aged Koreans: The Triple Mediating Effect of Social Support, Self-Esteem, and Life Satisfaction", 2021, "article", 2, "Health and Wellbeing Research", "Background/Objectives: The purpose of study was to verify the triplet mediating effect of social support, self-esteem and life satisfaction in the effects of aging anxiety on successful aging.\r\nMethods/Statistical analysis: A survey was conducted among middle-aged people living in the Seoul, Gyeonggi-do, and Seosan areas in December 2019. 200 copies of the survey were collected and used for analysis. Correlation analysis was performed using SPSS21.0, and the triple mediating effects of social support, self-esteem and life satisfaction in the relationship between aging anxiety and successful aging were verified with the use of the Model 6 of SPSS PROCESS macro.\r\nFindings : Firstly,
