], ["https://openalex.org/W3046679466", "https://doi.org/10.67442/n9fy6286", "https://doi.org/10.67442/n9fy6286", null, "Ozonoterapia en el tratamiento de herida infectada en niño en un Hospital Público en São Luís - Maranhão - Brasil. Reporte de caso", "article", "es", "2020-06-01", 2020, "Wanderly Barbosa Silva", "-", "Wanderly Barbosa Silva", null, null, "Ozone Therapy Global Journal", null, "2659-8647", "10", "1", "119–127", "Ozone therapy, due to its bactericidal, fungicidal, anti-inflammatory, analgesic and tissue-regenerating properties, has been widely used as a supplement in the treatment of wounds. The objective of this case report is to demonstrate the effectiveness of ozone therapy in the treatment of a 2-year-old and 11-month-old boy admitted to a Public Hospital of Urgency and Emergency, with a large wound on his right foot, infected, with a tibia and fibula fracture, caused by a car accident, that had an adverse reaction to the antibiotic clindamycin and had ozone therapy as the main therapy. The patient was successfully treated with ozone therapy locally (ozonated saline, ozonated bag, and ozonated sunflower oil). The treatment lasted 38 days with a total of 19 ozone therapy sessions. This study adds e.vidence of the usefulness of ozone therapy as an effective and safe method of treating wounds", "Medicine | Humanities | Philosophy", "Medical and Biological Ozone Research", "Pharmacology", "Medicine", "Health Sciences", null, false, "closed", null, null, null, 0, 0, null, false, "2025-07-23 00:00:00"], ["https://openalex.org/W3184879072", "https://doi.org/10.7146/ht.v121i1.127120", "https://doi.org/10.7146/ht.v121i1.127120", null, "Atomangst og civilt beredskab. Red.: Marianne Rostgaard og Morten Pedersen. Aalborg Universitetsforlag, 2020.", "article", "da", "2021-07-06", 2021, "Aske Hennelund Nielsen", "https://orcid.org/0000-0003-4696-3665", "Aske Hennelund Nielsen", null, null, "Historisk Tidsskrift", null, "0106-4991", null, null, null, null, "Art", "Knowledge Management and Technology", "Management Science and Operations Research", "Decision Sciences", "Social Sciences", null, false, "closed", null, null, null, 0, 0, null, false, "2025-07-24 00:00:00"], ["https://openalex.org/W3201601522", "https://doi.org/10.5281/zenodo.21408320", "https://doi.org/10.5281/zenodo.21408320", null, "Biodiversidad y servicios ecosistémicos en Cartama-Antioquia", "article", "es", "2020-01-01", 2020, "Alejandro González Valencia", "-", "Alejandro González Valencia", null, null, "Zenodo (CERN European Organization for Nuclear Research)", "European Organization for Nuclear Research", null, "1", "19", "17", "Sin resumen disponible.", "Geography", "Water Resource Management and Quality", "Water Science and Technology", "Environmental Science", "Physical Sciences", null, true, "green", "cc-by", null, null, 0, 0, null, false, "2025-07-24 00:00:00"], ["https://openalex.org/W3203460566", "https://doi.org/10.5958/2321-2136.2020.00010.7", "https://doi.org/10.5958/2321-2136.2020.00010.7", null, "Facilitating Empowerment of Women through Self Help Groups with Reference to NABARD in Punjab: An Analysis", "article", "en", "2020-01-01", 2020, "Navreet | Neha Sharma", "- | https://orcid.org/0000-0002-2798-4025", null, "Panjab University", "IN", "Public Affairs And Governance", null, "2321-2128", "8", "2", "182–205", "Women are an integral part of the social, economic and political system. women. The overall growth and development of a country is viable only when women are given equal opportunities in every sphere and access to various services. Microfinance is the first step towards bringing women within the purview of access to financial services for the economic empowerment of women which paved way for their sustainable livelihood. The financial services are a better way to access the banking facilities for the poor at an affordable cost. The sources of credit represent linkage between banks and Self Help Groups and provide credit funds for women to enhance livelihood opportunities. National Bank for Agriculture and Rural Development (NABARD) acts as facilitator and provider of microfinance. An attempt has been made in this paper to study the Role of NABARD as Facilitator for financial inclusion of women; to assess the impact of financial inclusion on sustainable livelihood of SHGs of women. An attempt has been made to analyze the impact of working in SHG on women economic empowerment in Hoshiarpur and Mansa districts of Punjab. It has been found that there is a positive impact on women empowerment through self-help groups, in terms of increase in participation, awareness, credit accessibility, asset creation, entrepreneurship, repayment of other debts, and gained the decision making skills. Women are now more confident in Decision making. The self-help groups have enabled marginalized women to get social status as well as now they have access to various financial products and services at very low cost.", "Microfinance | Empowerment | Facilitator | Livelihood | Business | Economic growth | Financial services | Financial inclusion | Asset (computer security) | Agriculture | Finance | Economics | Political science", "Microfinance and Financial Inclusion", "Economics and Econometrics", "Economics, Econometrics and Finance", "Social Sciences", null, false, "closed", null, null, null, 1, 6, "https://openalex.org/W2038458296 | https://openalex.org/W2061960317 | https://openalex.org/W2067057565 | https://openalex.org/W2154775467 | https://openalex.org/W2323169823 | https://openalex.org/W3203460566", false, "2025-07-24 00:00:00"], ["https://openalex.org/W3046363719", "https://doi.org/10.67442/c3rb8n60", "https://doi.org/10.67442/c3rb8n60", null, "Tratamiento de la parálisis facial mediante ozonoterapia. Experiencia en 5 pacientes.", "article", "es", "2020-06-01", 2020, "María José Ros Nicolás | Ascensión Cobo Nájar", "- | -", null, null, null, "Ozone Therapy Global Journal", null, "2659-8647", "10", "1", "149–170", "Introduction: Facial palsy is an everyday condition. The majority of cases are included on condition of generally idiopathic etiology or Bell´s Palsy. Generally constitue a bening pathology, but with variable recovery, and the risk of effects. The treatment combines physics and pharmaceutical methods, and, sometimes, rehabilítate surgery and neuromuscular therapy. Ozone therapy is a treatment that does not cause side effects, allergies, interaction with other drugs, is easy to apply and low cost which makes it an excellent therapy. Objetive: To present 5 clinical Bell Palsy´s cases treated with ozone therapy as a complementary way with physical therapy. Material and methods: 5 patients were treated by local infiltrations with ozone in a concentration of 10 a 20 µgr/mL, once every 7 days, a mínimum 4 times and a máximum depending on the clinic improvement. Results: High improvement or total recovery were observed in a period of time of 4 to 5 weeks. Conclusion: Ozone therapy may constitute a good choice in the treatment due to the effects noticed in improving symptomatology.", "Humanities | Philosophy | Medicine", "Medical and Biological Ozone Research", "Pharmacology", "Medicine", "Health Sciences", null, false, "closed", null, null, null, 0, 0, null, false, "2025-07-24 00:00:00"], ["https://openalex.org/W3127568158", "https://doi.org/10.47310/iarjel.2020.v01i01.016", "https://doi.org/10.47310/iarjel.2020.v01i01.016", null, "Contribution of School Administrators to Instructional Supervision of Schemes of Work in the Enhancement of Students’ Academic Performance in Secondary Schools in Emuhaya and Vihiga Sub Counties in Kenya:", "article", "en", "2020-08-12", 2020, "Elizabeth Gloria Anindo Wanyama", "-", "Elizabeth Gloria Anindo Wanyama", null, null, "International Academic Journal of Education and Literature", null, "2708-5112", "01", "01", "1–12", "Studies worldwide have revealed that school administrators are key contributors to students’ academic performance by enhancing instructional supervision within schools. Notwithstanding this assertion in some countries academic performances have been found to be low despite this administrators’ contribution. For instance, in Kenya the average performance for the years 2010 to 2014, only 29% candidates scored above a mean score of 6.00 points. In Emuhaya and Vihiga Sub Counties 3535 (26%) and 2104 (15%) candidates respectively scored 6.00 and above points compared to Hamisi and Sabatia Sub-Counties’ with 3913 (28%) and 4275 (31%) candidates respectively between years 2009 and 2013. The objective of the study was to establish the contribution of school administrators to instructional supervision with regard to schemes of work in the enhancement of students’ academic performance. The study was guided by a conceptual framework in which the independent variable was the administrators’ contribution in form of checking prepared schemes of works and the dependent variable, students’ academic performance. The study established that administrators’ contribution to instructional supervision was low (Adjusted R2= 0.011). The study concluded that administrators’ contribution to instructional supervision was not significant and therefore, did not enhance students’ academic performance. The study recommended that administrators should increase their contribution to instructional supervision in order to enhance students’ academic performance. The study findings are of significance to school administrators, policy makers and other stakeholders with regard to enhancement of students’ academic performance by increasing instructional supervision.", "Work (physics) | Mathematics education | Medical education | Academic achievement | Pedagogy | Psychology | Medicine | Physics", "Educational and Psychological Assessments", "Developmental and Educational Psychology", "Psychology", "Social Sciences", null, true, "hybrid", "cc-by", null, null, 0, 0, null, false, "2025-07-24 00:00:00"], ["https://openalex.org/W4409112218", "https://doi.org/10.36266/ijvsmd/140", "https://doi.org/10.36266/ijvsmd/140", null, "Meat Adulteration, Methods of Detection and Its Public Health Importance", "article", "en", "2024-01-16", 2024, null, null, null, null, null, "International Journal of Veterinary Science and Medical Diagnosis", null, null, "5", "1", "1–5", null, "Business | Public health | Food science | Medicine | Chemistry | Pathology", "Identification and Quantification in Food", "Molecular Biology", "Biochemistry, Genetics and Molecular Biology", "Life Sciences", null, false, "closed", null, null, null, 0, 0, null, false, "2025-07-24 00:00:00"], ["https://openalex.org/W3103050107", "https://doi.org/10.67442/smfr9408", "https://doi.org/10.67442/smfr9408", null, "Ozonoterapia en Tratamiento Periodontal Clínico", "article", "es", "2020-06-01", 2020, "Sonia Hernández Castillo | Luis Angel Fernández Hernández", "- | -", null, null, null, "Ozone Therapy Global Journal", null, "2659-8647", "10", "1", "289–300", "Periodontal disease or gingival disease are bacterial infections that are treated daily in the dental office. There is evidence regarding the antimicrobial efficacy of Ozone (both in gaseous, oily, and aqueous forms) that it is a highly effective agent for the elimination of microorganisms. Ozone therapy has become an adjunctive treatment in the control and treatment of diseases both dental and dermatological, cosmetic, among others due to its antimicrobial capacity. The objective of this study is to review the medical literature on the effects of ozone in clinical periodontal treatment, presenting and discussing advantages, objectives, contraindications and its different uses in dentistry, mainly in periodontal disease", "Periodontal disease | Humanities | Medicine | Gynecology | Dentistry | Philosophy", "Medical and Biological Ozone Research", "Pharmacology", "Medicine", "Health Sciences", null, false, "closed", null, null, null, 0, 0, null, false, "2025-07-24 00:00:00"], ["https://openalex.org/W3199233470", "https://doi.org/10.55175/cdk.v47i4.365", "https://doi.org/10.55175/cdk.v47i4.365", null, "Diagnosis dan Tatalaksana Fraktur Penis", "article", "id", "2020-05-01", 2020, "Kevin Anthony Glorius Tampubolon", "https://orcid.org/0000-0002-6512-3744", "Kevin Anthony Glorius Tampubolon", "Atma Jaya Catholic University of Indonesia", "ID", "Cermin Dunia Kedokteran", null, "0125-913X", "47", "4", "267–269", "Fraktur penis merupakan kasus kegawatdaruratan urologi yang jarang, namun membutuhkan penanganan segera. Mekanisme terjadinya adalah ruptur tunika albuginea pars cavernosa akibat tekanan traumatik saat penis ereksi. Penyebab tersering adalah saat hubungan seksual. Diagnosis melalui anamnesis dan pemeriksaan fisik. Tindakan operatif dilakukan secepatnya untuk mencegah komplikasi. Penile fracture is a rare urological emergency, but always requires immediate attention. The cause is a traumatic rupture of the tunica albuginea of corpora cavernosa due to bending of the penile shaft during erection. Penile fracture commonly occurs during sexual intercourse. Diagnosis by history and physical examination. Penile fracture needs immediate operative treatment to prevent complications.", "Medicine | Penile fracture | Tunica albuginea (penis) | Penis | Anamnesis | Surgery | Physical examination | Sexual intercourse | Gynecology | Internal medicine", "Urological Disorders and Treatments", "Urology", "Medicine", "Health Sciences", null, true, "hybrid", "cc-by-nc", null, null, 1, 0, null, false, "2025-07-24 00:00:00"], ["https://openalex.org/W3198769200", "https://doi.org/10.66392/003777220828526533", "https://doi.org/10.66392/003777220828526533", null, "In Support of Students' Needs: Exploring the Benefits of the Inquiry Design Model", "article", "en", "2020-01-01", 2020, "C. T. Dague", "-", "C. T. Dague", null, null, "Social Education", null, "0037-7724", "84", "1", "66–71", "For 13 years, I was a high school history teacher in North Carolina. During that time I had the good fortune to work alongside teachers whose work I respected and admired. I respected their savvy and thoughtful instructional design, and I admired the meaningful relationships they developed with their students. Perhaps most importantly, in each of these teachers, I observed an unmistakable passion for their content and students alike.", "Mathematics education | Computer science | Knowledge management | Psychology | Pedagogy | Sociology", "Education and Critical Thinking Development", "Education", "Social Sciences", "Social Sciences", null, false, "closed", null, null, null, 0, 0, null, false, "2025-07-24 00:00:00"], ["https://openalex.org/W3191423891", "https://doi.org/10.7146/ht.v121i1.127137", "https://doi.org/10.7146/ht.v121i1.127137", null, "Thomas Viggo Pedersen: Grundtvigs Kirke og det aristokratiske primtal. En drøm fra det tyvende århundrede. Vandkunsten, København, 2020.", "article", "da", "2021-07-06", 2021, "Carsten Bach-Nielsen", "-", "Carsten Bach-Nielsen", null, null, "Historisk Tidsskrift", null, "0106-4991", null, null, null, null, "Philosophy | Humanities", "Balkan and Eastern European Studies", "Economics and Econometrics", "Economics, Econometrics and Finance", "Social Sciences", null, false, "closed", null, null, null, 0, 0, null, false, "2025-07-24 00:00:00"], ["https://openalex.org/W3141927291", "https://doi.org/10.62273/yotw7107", "https://doi.org/10.62273/yotw7107", null, "Broadband Connectivity In “Flyover Country”", "article", "en", "2020-01-01", 2020, "Randall McCoy", "-", "Randall McCoy", null, null, "Information Systems Education Journal", null, "1545-679X", "18", "2", "41–49", "Broadband commonly refers to high-speed internet access that is always on and faster than the traditional dial-up access. Most urban areas in the United States have broadband and cellular internet services abundantly provided, but adequate broadband in rural areas of the country still do not have enough internet service needed to perform and compete in modern markets. In the 21st Century, the Internet is necessary to complete necessary tasks in communications for education, businesses, health care, and farming communities. This case provides a conversation for a Computer Information Systems undergraduate course, or an introduction to Management Information Systems course, in which this topic is part of the curriculum. The case could be used in other courses to discuss the impact of legislation on business, public/private collaborations, and ethics. It has application for various economics classes or courses bearing on the Internet and connectivity. The case was written to generate discussion and to help students contend with the trade-offs of social and economic realities of business and governmental policies. The emphasis of the case is to provide an opportunity for students to learn about the topics and become knowledgeable about the problems that are presented.", "Broadband | Computer science | Geography | Telecommunications", "ICT Impact and Policies", "Media Technology", "Engineering", "Physical Sciences", null, false, "closed", null, null, null, 0, 0, null, false, "2025-07-24 00:00:00"], ["https://openalex.org/W3214030144", "https://doi.org/10.30851/651005", "https://doi.org/10.30851/651005", null, "MARINA TSVETAEVA AND VLADIMIR NABOKOV AS FRENCH TRANSLATORS OF PUSHKIN", "article", "en", "2021-01-01", 2021, "Adrian Wanner", "https://orcid.org/0009-0005-0053-0639", "Adrian Wanner", null, null, "The Slavic and East European Journal", "American Association of Teachers of Slavic and East European Languages", "0037-6752", "65", "1", "79–99", null, "Art", "Discourse Analysis and Cultural Communication", "Cultural Studies", "Social Sciences", "Social Sciences", null, false, "closed", null, null, null, 0, 0, null, false, "2025-07-24 00:00:00"], ["https://openalex.org/W3008289611", "https://doi.org/10.47119/ijrp10045112020919", "https://doi.org/10.47119/ijrp10045112020919", null, "Case Study: The Description Of Spiritual Quotient On Average Adult Womens Of Pneumonial Cancer", "article", "en", "2020-01-01", 2020, "Iffah Karimah", "-", "Iffah Karimah", null, null, "International Journal of Research Publications", null, "2708-3578", "45", "1", "6", "Pneumonial cancer places the first rank  as death cause of cancer(1,37 millions of death). Cancer has impact not only to someone’s physics but also psychology. In term of spiritualquotient playing role, in which an individual can place himself in the greater context in order to make life meaningful, by vesting positive value in himself. Thus, the individual will be able to awake his soul to act positively as well. This research is aimed at finding out the description of spiritual quotient and factors causing the spiritual quotient on average women  thepneumonial cancer sufferers. This research used qualitative method in the form of case study. The subject of this research was a married  averagewoman aged 45 years and suffering from pneumonial cancer of stadium III with 5-year suffer. The data collection on subject and significant done with  structured and non-participant observation. The result of the research shows that the description of spiritual quotient on subject such as life meaning during pneumonialcancer suffering. Subject keep doing his life well and do the positive things. The result of the research also shows that subject thanks God because the people around them also give attention and support so that the subject keeps spirit in doing her life and have spirit to recover.", "Subject (documents) | Meaning (existential) | Soul | Spirituality | Context (archaeology) | Psychology | Social psychology | Epistemology | Medicine | Psychotherapist | Philosophy | Alternative medicine | Computer science | History", "Mental Health and Well-being", "Sociology and Political Science", "Social Sciences", "Social Sciences", null, true, "diamond", null, null, null, 0, 0, null, false, "2025-07-24 00:00:00"], ["https://openalex.org/W3213662909", "https://doi.org/10.58213/x5acg443", "https://doi.org/10.58213/x5acg443", null, "The Impact of Indian Independence Movement on the select Novels of Raja Rao", "article", "en", "2021-07-11", 2021, "S Rashmi.", "-", "S Rashmi.", null, null, "Vidhyayana", null, "2454-8596", "6", "6", null, "Indian Writing in English is influenced by Gandhian ideology. Gandhi emphasized more on social, political, and religious problems of the oppressed and down trodden lower castes in Hindu society. His aim was to abolish poverty, caste system and untouchability from society. The present study reveals prominently the influence of Mahatma Gandhi on the village of Kanthapura. ‘Kanthapura’ is the microcosm of the Indian traditional society and what happened in Kanthapura was also happened in India during 1919-1930. It is not only a political novel, but also a novel which concerns with socio-religious and economic transformation during the struggle for independence. ‘Kanthapura’ follows Gandhi’s doctrine and ideology of non-violence, Satyagraha, their views on untouchability and casteism etc. The novel can be considered Gandhi-epic. Gandhi aroused national awakening in Indians with his non-violent struggle for freedom movement which was strengthened by noncooperation and civil disobedience movement in Kanthapura village. Gandhi’s influential personality and his ideology is felt everywhere in the novel. Indeed, Gandhi doesn’t appear in this novel personally, but the plot of the novel revolves around his ideology. This research article, ‘Gandhi’s Ideology: A Study of Raja Rao’s Kanthapura’ aims at how the Gandhi’s ideology influenced Raja Rao which resulted in the creation of the character of Moorthy. It also focuses on how Moorthy, under the influence of Gandhi, tries to inspire the people towards the freedom struggle.", "Ideology | Hinduism | Politics | Caste | Sociology | Gender studies | Independence (probability theory) | Raja | Civil disobedience | Religious studies | Political science | Law | Philosophy", "Indian History and Philosophy", "Philosophy", "Arts and Humanities", "Social Sciences", null, true, "diamond", "cc-by", null, null, 0, 1, "https://openalex.org/W1577393785", false, "2025-07-24 00:00:00"], ["https://openalex.org/W3112467007", "https://doi.org/10.2458/cms.6530", "https://doi.org/10.2458/cms.6530", null, "The Politics and Ideologies of Pluricentric German in L2 Teaching", "article", "en", "2020-11-17", 2020, "Julia Ruck", "https://orcid.org/0000-0001-9096-0977", "Julia Ruck", "Webster Vienna Private University", "AT", "Critical multilingualism studies", "Department of German Studies", "2325-2871", "8", "1", "17–50", "Despite a history of rigorous linguistic research on the regional variation of German as well as professional initiatives to promote German, Austrian, and Swiss Standard German as equal varieties, there is still a lack of awareness and systematic incorporation of regional varieties in L2 German teaching. This essay follows two goals: First, it reviews the development of the pluricentric approach in the discourse on L2 German teaching as well as the political and ideological preconditions that form the backdrop of this discussion. Particular emphasis will be given to institutional tri-national collaborations and the standard language ideology. Second, by drawing on sociolinguistic insights on the use and speaker attitudes of (non-)standard varieties, this contribution argues that the pluricentric focus on national standard varieties in L2 German teaching falls short in capturing the complex socioculturally situated practices of language use in both (often dialectally-oriented) everyday and (often standard-oriented) formal and official domains of language use. I argue that the pluricentric approach forms an important step in overcoming the monocentric bias of one correct Standard German; however, for an approach to L2 German teaching that aims at representing linguistic and cultural diversity, it is necessary to incorporate both standard and non-standard varieties into L2 German teaching.", "German | Ideology | Standard language | Politics | Linguistics | Situated | Sociology | Political science | Computer science | Law | Artificial intelligence | Philosophy", "Linguistic research and analysis", "Language and Linguistics", "Arts and Humanities", "Social Sciences", null, true, "diamond", "cc-by", null, null, 7, 0, null, false, "2025-07-24 00:00:00"], ["https://openalex.org/W3161115884", "https://doi.org/10.48102/ji.9.86", "https://doi.org/10.48102/ji.9.86", null, "Semblanza de Héctor Fix Fierro (1961-2020)", "article", "fr", "2020-07-01", 2020, "Juan Federico Arriola", "-", "Juan Federico Arriola", "Ibero American University", "MX", "Jurídica Ibero Revista Semestral del Departamento de Derecho de la Universidad Iberoamericana", null, "2992-7641", null, "9", "97–100", null, "Chemistry", "Latin American Literature Studies", "Cultural Studies", "Social Sciences", "Social Sciences", null, true, "diamond", "cc-by-nc-nd", null, null, 0, 0, null, false, "2025-07-24 00:00:00"], ["https://openalex.org/W3023501577", "https://doi.org/10.62273/mygp4817", "https://doi.org/10.62273/mygp4817", null, "The use of short speculative fiction in teaching about privacy", "article", "en", "2020-01-01", 2020, "Thomas Lauer", "https://orcid.org/0000-0002-7662-1132", "Thomas Lauer", null, null, "Information Systems Education Journal", null, "1545-679X", "18", "3", "38–43", null, "Computer science | Internet privacy | Data science | Mathematics education | Psychology", "Digital Games and Media", "Sociology and Political Science", "Social Sciences", "Social Sciences", null, false, "closed", null, null, null, 2, 7, "https://openalex.org/W2128026023 | https://openalex.org/W2154860432 | https://openalex.org/W2159585297 | https://openalex.org/W2207476906 | https://openalex.org/W2483358378 | https://openalex.org/W2884697104 | https://openalex.org/W2913707464", false, "2025-07-24 00:00:00"], ["https://openalex.org/W3086627075", "https://doi.org/10.67442/9x8dwb85", "https://doi.org/10.67442/9x8dwb85", null, "Efectos de la ozonoterapia en el desprendimiento de retina multitratada quirúrgicamente. Reporte de Caso.", "article", "es", "2020-06-01", 2020, "María Ana Rivera Soto | Leslie Elena Sánchez Gallardo | Germán Bazán Miranda | Nalleli Weber Chuliá", "- | - | - | -", null, null, null, "Ozone Therapy Global Journal", null, "2659-8647", "10", "1", "111–117", "Retinal detachment is the physical separation of the neurosensory retina from the retinal pigmented epithelium, developing vision loss. The surgical approach is recommended within the treatment, however, there are many adverse effects such as glaucoma, cataract formation, keratopathy, persistent tear eye, vitreous hemorrhages, among others. Therefore, the use of minimally invasive therapies with few adverse effects are of vital importance and it is known that the use of ozone therapy in ophthalmological diseases (macular degeneration, atrophy, retinal detachment), where a faster recovery of functions is observed, visual and decreased inflammatory processes. As observed in the clinical case we present, which after the diagnosis of retinal detachment and more than a year with multiple surgical treatments, it developed multiple adverse effects with considerable decrease in visual acuity and severe pain in the eye and skull. Where these persistent symptoms who lead him to a medical consultation at Wellness Weber ®, once we perform medical records, we starting treatment with systemic ozone therapy protocols and Ozonized Growth Factors (FCC O3). At the end of the ozonetherapy treatment there was an improvement in the visual capacity, as well as an important improvement of peripheral vision and visual capacity almost in its entirety, an increase in refraction to light and healthy macula in its entirety. This could be explained thanks to the effects of ozone therapy at the ocular level, such as decreased proinflammatory substances, antiseptic capacity, increased antioxidant enzymes, improving the functional activity of neurons in the macular area, partially restoring corriorretinal blood flow, decreasing hypoxia and ischemia, leading to a shorter healing time an increase in visual acuity and visual field for this reason we propose ozone therapy as adjuvant therapy in retinal detachment.", "Medicine | Retina | Humanities | Visual acuity | Ophthalmology | Philosophy | Physics | Optics", "Medical and Biological Ozone Research", "Pharmacology", "Medicine", "Health Sciences", null, false, "closed", null, null, null, 0, 0, null, false, "2025-07-24 00:00:00"], ["https://openalex.org/W3084001150", "https://doi.org/10.67442/xt1t1a79", "https://doi.org/10.67442/xt1t1a79", null, "Reporte de caso. Uso de ozonoterapia en el síndrome compartimental", "article", "es", "2020-06-01", 2020, "Ivelise Subervi Ramirez", "-", "Ivelise Subervi Ramirez", null, null, "Ozone Therapy Global Journal", null, "2659-8647", "10", "1", "139–147", "Compartment syndrome is a very common pathology, with a higher prevalence in males, associated with trauma from exposed fractures, mainly of the tibia and forearm. Currently, there are many medical reviews, however, in this case we observe and recommend that the use of ozone therapy is effective for the treatment of patients with compartment syndrome since the treated patient evolved positively with a great improvement at the end of the treatment. Its treatment is urgent surgical, by performing fasciotomies of the affected compartments. Transradial vascular procedures have a low rate of vascular complications. The possibility of serious complications, such as compartment syndrome, makes it necessary to know this condition and its management.", "Medicine | Humanities | Philosophy", "Medical and Biological Ozone Research", "Pharmacology", "Medicine", "Health Sciences", null, false, "closed", null, null, null, 0, 0, null, false, "2025-07-24 00:00:00"], ["https://openalex.org/W3130944508", "https://doi.org/10.13140/rg.2.2.35125.44002", "https://doi.org/10.13140/rg.2.2.35125.44002", null, "Three Decades of Persistent Poverty in Nigeria: A Historical-Institutional Perspective", "article", "en", "2020-01-01", 2020, "Chiamaka Uzomba", "-", "Chiamaka Uzomba", null, null, null, null, null, null, null, null, "The paper navigates a pluri-causal trajectory to explain why poverty in Nigeria persists de-spite relative economic growth and decades of implementing poverty alleviation pro-grammes. Several scholars of poverty in Nigeria enumerate corruption, political instability, unemployment, and poor educational system amongst a few others as the reasons for the persistence of poverty. The paper, however, argues that there is something deeper beyond these factors considered symptoms and hypothesise that certain institutional reasons and historical moments though compounded by these symptoms are responsible for the persis-tence of poverty in Nigeria. Utilising secondary analysis and by adopting a historical institu-tionalist perspective, this paper presents a trajectory depicting that certain historical moments portrayed through critical junctures in Nigeria’s historical timelines left legacies that did not end after the occurrence of the critical juncture but kept reproducing and influencing poverty dynamics. The mechanism of the legacy reproduction exists through institutions and actors within the political, economic and governance structures. The critical junctures discussed in this paper include the military coup in 1966 and the return to democracy in 1999. Through the analysis of economic policies and poverty alleviation/reduction programmes, also taking into consideration an institutional analysis, the paper discusses how the legacies of the critical junctures are visible in the implementation of policies and programmes.", "Poverty | Language change | Development economics | Politics | Unemployment | Corporate governance | Culture of poverty | Economic collapse | Political science | Timeline | Economic growth | Political economy | Sociology | Economics | Basic needs | Geography | Law", "Economic Theory and Policy", "General Economics, Econometrics and Finance", "Economics, Econometrics and Finance", "Social Sciences", null, true, "gold", null, null, null, 0, 0, null, false, "2025-07-24 00:00:00"], ["https://openalex.org/W3189966694", "https://doi.org/10.7146/ht.v121i1.127134", "https://doi.org/10.7146/ht.v121i1.127134", null, "Miriam Magdalena Schneider: The ‘Sailor Prince’ in the Age of Empire: Creating a Monarchical Brand in Nineteenth-Century Europe. (Palgrave Studies in Modern Monarchy). Palgrave-Macmillan, London, 2017.", "article", "en", "2021-07-06", 2021, "Mogens Pelt", "-", "Mogens Pelt", null, null, "Historisk Tidsskrift", null, "0106-4991", null, null, null, null, "Monarchy | Empire | History | Ancient history | Economic history | Political science | Law | Politics", "European Political History Analysis", "History", "Arts and Humanities", "Social Sciences", null, false, "closed", null, null, null, 0, 0, null, false, "2025-07-24 00:00:00"], ["https://openalex.org/W3189472602", "https://doi.org/10.7146/ht.v121i1.127127", "https://doi.org/10.7146/ht.v121i1.127127", null, "Fundats og Ordinans for Københavns Universitet 1539/The Foundation and Regulations of the University of Copenhagen 1539. Red.: Morten Fink-Jensen. Gads Forlag, København 2020.", "article", "da", "2021-07-06", 2021, "Mikkel Munthe Jensen", "-", "Mikkel Munthe Jensen", null, null, "Historisk Tidsskrift", null, "0106-4991", null, null, null, null, "Political science", "Balkan and Eastern European Studies", "Economics and Econometrics", "Economics, Econometrics and Finance", "Social Sciences", null, false, "closed", null, null, null, 0, 0, null, false, "2025-07-24 00:00:00"], ["https://openalex.org/W3201685089", "https://doi.org/10.5281/zenodo.21408350", "https://doi.org/10.5281/zenodo.21408350", null, "Deforestación: vía para privatizar tierras baldías de Colombia", "article", "es", "2020-01-01", 2020, "Norberto Vélez Escobar", "-", "Norberto Vélez Escobar", null, null, "Zenodo (CERN European Organization for Nuclear Research)", "European Organization for Nuclear Research", null, "1", "19", "3", "Sin resumen disponible.", "Political science | Geography", "Water Resource Management and Quality", "Water Science and Technology", "Environmental Science", "Physical Sciences", null, true, "green", "cc-by", null, null, 0, 0, null, false, "2025-07-24 00:00:00"], ["https://openalex.org/W3046537501", "https://doi.org/10.67442/dyvd0m92", "https://doi.org/10.67442/dyvd0m92", null, "Tratamiento de lipólisis de grasa submentoniana con ozonoterapia y sus efectos en el síndrome de apnea obstructiva crónica y estética.", "article", "es", "2020-06-01", 2020, "Juliana Varão", "-", "Juliana Varão", null, null, "Ozone Therapy Global Journal", null, "2659-8647", "10", "1", "207–239", "The fat accumulation in the submental region represents a significant aesthetic disadvantage, causing the double chin and also implies a serious health problem, as it is associated with sleep apnea, oxidative stress and even death from cerebral hypoxia and respiratory failure in a large part of the population worldwide. This study aimed to evaluate ozone therapy as a safe tool to treat excess of fat in the submental region, as the other procedures commonly used have questionable side effects, such as a liver overload function and changes in homeostasis. The study is a review of the literature with ozone therapy, its administration forms, concentrations, periodicity, contraindications, in the prescribed situations and comorbidities to evaluate an effective and safe therapeutic proposal in the volumetric reduction of submental fat. The data bases reviewed were MedLine databases of PubMed and Zotero ISCO3 of the articles published between 1990 to 2020, using the keywords: ozone therapy, obstructive sleep apnea, submental fat, lipolysis. The study suggests that ozone therapy is effective and has a low incidence of side effects, although requires more clinical studies with large samples to establish protocols in its application, with patient follow-up for a longer time to verify the efficacy of long-term treatment.", "Medicine | Humanities | Gynecology | Philosophy", "Medical and Biological Ozone Research", "Pharmacology", "Medicine", "Health Sciences", null, false, "closed", null, null, null, 1, 0, null, false, "2025-07-24 00:00:00"], ["https://openalex.org/W3204658641", "https://doi.org/10.13140/rg.2.2.31419.37927", "https://doi.org/10.13140/rg.2.2.31419.37927", null, "The expression of non-individual in some Old English nouns", "article", "en", "2020-01-01", 2020, "Oxana Kharlamenko", "-", "Oxana Kharlamenko", null, null, null, null, null, null, null, "25–50", null, "Linguistics | Expression (computer science) | Noun | Psychology | Computer science | Communication | Natural language processing | Philosophy", "Linguistics and language evolution", "Language and Linguistics", "Arts and Humanities", "Social Sciences", null, true, "gold", null, null, null, 0, 0, null, false, "2025-07-24 00:00:00"], ["https://openalex.org/W3086880393", "https://doi.org/10.67442/2r4y9475", "https://doi.org/10.67442/2r4y9475", null, "Efecto de la ozonoterapia y aceite ozonizado en herida traumática canina.", "article", "es", "2020-06-01", 2020, "Sonia Patricia Mateus Pinilla", "-", "Sonia Patricia Mateus Pinilla", null, null, "Ozone Therapy Global Journal", null, "2659-8647", "10", "1", "179–186", "Regardless of the cause, politraumatism in canines may result in wounds that require immediate treatment. Here we describe the clinical case of a dog with a 4.5c long polytraumatic injury of in the left hind leg, with a necrotic process that initial amputation above the tarsus was required. Localized ozone therapy was administered on the wound. The initial step was to submerge the injured leg (3c above the injury) in distilled water at a concentration of 17.5 µg (with a constant bubbling of 70 µg) for 15 minutes, followed by a bagging effort for 5 minutes at the same concentration. Excluding the bagging, the same procedure was followed for seven treatment sessions while gradually decreasing the concentration until reaching a concentration of 1.5 µg and constant bubbling of 5 µg). Every treatment session was completed with a dressing of the wound with ozonized oil of 800 IP. The wound resolved in 30 days, and there was only need to amputate 3 phalanges and not above the tarsus as initially forecast, requiring only eight treatment sessions . These findings suggest that the treatment is safe and effective. The recovery of the dog was fast, inexpensive and did not require pharmacologic treatment", "Humanities | Art", "Medical and Biological Ozone Research", "Pharmacology", "Medicine", "Health Sciences", null, false, "closed", null, null, null, 1, 0, null, false, "2025-07-25 00:00:00"], ["https://openalex.org/W3048935119", "https://doi.org/10.67442/m5y6pk62", "https://doi.org/10.67442/m5y6pk62", null, "Aspectos prácticos en ozonoterapia: Estudio de la concentración de ozono en la solución salina ozonizada", "article", "es", "2020-06-01", 2020, "Gregorio Martı́nez-Sánchez", "https://orcid.org/0000-0002-6628-7388", "Gregorio Martı́nez-Sánchez", null, null, "Ozone Therapy Global Journal", null, "2659-8647", "10", "1", "39–53", "Ozonized Saline Solution (O3SS) in one of the systemic routes of ozone administration that has been used for more than 40 years, mainly in Russia. The application protocol must be carried out under established parameters to achieve therapeutic efficacy and prevent side effects. The purpose of this paper is to study the concentrations of ozone in saline solution during the bubbling stage to establish the optimal saturation time and to study the degradation of ozone in it over time, thus defining the need for continued bubbling during reinfusion to the patient const root = document.currentScript.previousElementSibling;
const {cols, rows, total} = JSON.parse(root.querySelector('script[type="application/json"]').textContent);
const URL_RE = /(https?:\/\/[^\s<>"']+)/g, LONG = 300;
let page = 0, size = 25;
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const linkify = s => esc(s).replace(URL_RE, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
function cell(v) {
  if (v === null) return '<span class="na">null</span>';
  const nested = typeof v === 'object';
  const s = nested ? JSON.stringify(v) : String(v);
  const cls = nested ? ' class="nested"' : '';
  if (s.length <= LONG) return `<div${cls}>${linkify(s)}</div>`;
  return `<details${cls}><summary>${linkify(s.slice(0, LONG))}…</summary>${linkify(s)}</details>`;
}
function render() {
  const pages = Math.max(1, Math.ceil(rows.length / size));
  page = Math.min(page, pages - 1);
  const slice = rows.slice(page * size, page * size + size);
  root.querySelector('tbody').innerHTML = slice.map(r => '<tr>' + r.map(v => `<td>${cell(v)}</td>`).join('') + '</tr>').join('');
  const first = rows.length ? page * size + 1 : 0, last = page * size + slice.length;
  root.querySelector('.info').textContent =
    `rows ${first}–${last} of ${rows.length.toLocaleString()} loaded` + (total === null ? ' (total unknown)' : ` · ${total.toLocaleString()} in table`);
  root.querySelector('.pg').textContent = `page ${page + 1} / ${pages}`;
  root.querySelector('.prev').disabled = page === 0;
  root.querySelector('.next').disabled = page >= pages - 1;
  root.querySelector('.wrap').scrollTop = 0;
}
root.querySelector('thead tr').innerHTML = cols.map(([n, short, full]) =>
  `<th title="${esc(n + ': ' + full)}">${esc(n)}<div class="t">${esc(short)}</div></th>`).join('');
root.querySelector('.prev').onclick = () => { page--; render(); };
root.querySelector('.next').onclick = () => { page++; render(); };
root.querySelector('.size').onchange = e => { size = +e.target.value; page = 0; render(); };
render();
</script>
