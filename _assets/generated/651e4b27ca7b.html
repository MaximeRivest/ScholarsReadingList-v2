<script type="application/json">{"cols": [["id", "str", "Str"], ["title", "str", "Str"], ["year", "int64", "Int64"], ["type", "str", "Str"], ["citations", "int64", "Int64"], ["topic", "str", "Str"], ["abstract", "str", "Str"]], "rows": [["https://openalex.org/W1931253619", "PENGARUH TINGKAT INTENSIFIKASI TERHADAP PRODUKTIVITAS TEBU PETANI BINAAN PABRIK GULA (PG) GONDANG BARU KABUPATEN KLATEN PROVINSI JAWA TENGAH DALAM UPAYA PENCAPAIAN SWASEMBADA GULA", 2020, "article", 0, "Agricultural Research and Practices", "The influence of the level of intensification of productivication as a small scale farmers sugar mill cane Gondang Baru in Klaten of Central Java Province in the farmwork of the athainment of self sugar suffiency. Guided by SITI HAMIDAH and VANDRIAS DEWANTORO\r\nThe research purposes of this study was : (1) Analyze the level of tntensification to performed on each shoot. (2) Analyze the determine the level of intensification about the production of sugar cane. (3) Find out what are the obstacles and how to overcome these problems. The research carried out using a survey method. The analitical method used the method of linier regression analysis. Intake of respondents using purposive sampling with 75 people, who contribute the maximum to the sugar mill with the diffrent buds condition. The results showed level of intensification in the first shoots were in both shoots and the third and fourth in the high and low categories. The influence on the productivity level of intensification shows the first buds will productivity of 36, 615 qu/he without the influence of the intensification. The productivity of the second shoots as much as 91,324 qu/he and 11.934,684 qu/he without the influence of the intensification. The third and fourth shoots will be descreased by of variable degree\r\nKey words : The influence of the level of intensification, sugar cane production, ratoon cane, GondangBaru sugar mill."], ["https://openalex.org/W40110643", "Komunikasi Antarpribadi sebagai Strategi Sosialisasi Pelestarian Alam di Kepulauan Seribu", 2020, "article", 2, "Hermeneutics and Narrative Identity", "Abstract\r\nCommunication is the first step in human interaction. This study aims to describe the\r\ninterpersonal communication strategies employees of Kepulauan seribu National Park Authority\r\nto provide information to the public, in this case the farmers and fishermen. The approach\r\nused is subjective with qualitative data, which can produce in-depth description of the sayings,\r\nwritings, and the observable behavior of a person, group, community, and certain organizations\r\nin certain contexts that were examined from the standpoint of a complete, comprehensive , and\r\na thorough or complete (holistic). The findings of this study is the interpersonal communication\r\nstrategies in the National Park Authority employees to use an intensive interpersonal communication\r\nthat is open communication, mutual honesty, support, and continuous. Each individual is\r\ndirectly related to this program are able to understand the problems they face, or facing other\r\npeople.\r\nAbstrak\r\nKomunikasi merupakan langkah awal dalam interaksi manusia. Penelitian ini bertujuan\r\nmendeskripsikan strategi komunikasi interpersonal para karyawan Balai Taman Nasional Kepulauan\r\nSeribu yang dapat memberikan informasi kepada publik, dalam hal ini para petani dan nelayan.\r\nPendekatan yang digunakan adalah subjektif dengan data kualitatif, yang dapat menghasilkan uraian\r\nmendalam tentang ucapan-ucapan, tulisan-tulisan, dan perilaku yang dapat diamati dari seseorang,\r\nkelompok, komunitas, dan organisasi tertentu dalam konteks tertentu yang dikaji dari sudut pandang\r\nyang lengkap, komprehensif, danmenyeluruh atau utuh (holistic). Temuan penelitian iniadalah strategi\r\nkomunikasi interpersonal pada karyawan Balai Taman Nasional menggunakan komunikasi antarpribadi\r\nyang intensif yaitu keterbukaan berkomunikasi, saling jujur,mendukung, dan berkesinambungan. Setiap\r\nindividu yang terkait langsung dengan program ini dapat saling mengerti masalah-masalah yang mereka\r\nhadapi, atau yang dihadapi orang lain.\r\nKata kunci: komunikasi antarpribadi dan pelestarian alam"], ["https://openalex.org/W2474901826", "Réécrire l'origine - Duras dans le champ analytique", 2021, "article", 1, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W2498707583", "Les Lectures « sémiotiques » du texte durassien - Un barrage contre la fascination", 2021, "article", 1, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W2519600027", "Paroles d'auteur - Les enjeux du paratexte dans l’œuvre de Duras", 2021, "article", 1, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W2519133457", "Faire rêver la langue - Style, forme, écriture chez Duras", 2021, "article", 1, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W2532880662", "« La Région des voix » - Énonciation verbale et narration chez Duras", 2021, "article", 0, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W2579976490", "AKIBAT HUKUM PENGALIHAN FUNGSI TANAH PERTANIAN MENJADI KAWASAN PERUMAHAN", 2020, "article", 0, "Aviation History and Innovations", "Kebijakan dalam peraturan Perundang-undangan yang berkaitan dengan masalah pengendalian alih fungsi tanah pertanian menjadi Kawasan Perumahaan sudah banyak dibuat, namum demikian implementasi pelaksanaan peraturan tersebut kurang efektif karena tidak didukung dengan data tanah pertanian pangan berkelanjutan yang dilindungi dan sikap proaktif sehingga alih fungsi tanah pertanian terus terjadi. Pola konversi tanah pertanian yang dilakukan oleh masyarakat dapat ditinjau oleh beberapa aspek, menurut Pelaku konversi dapat dibedakan menjadi dua. Pertama, alih fungsi secara langsung oleh pemilik tanah yang bersangkutan. Motif pada umumnya adalah untuk pemenuhan tempat tinggal, meningkatkan pendapatan melalui alih usaha, atau kombinasi keduanya. Kedua fungsi yang diawali oleh pengusaan yaitu pemilik menjual kepada pihak lain. Alih fungsi tanah pertanin merupakan fenomena yang tidak dapat dihindari dari pembangunan.\r\n\t\t\r\n\tAkibat hukum alih fungsi tanah pertanian pangan berkelanjuatan berdasarkan pasal 50 ayat (30) Undang-undang Nomor 41 tahun 2009 Tentang Perlindungan Lahan Pertanian Pangan Berkelanjutan, yang menjelaskan bagi setiap orang yang memiliki Lahan Pertanian Pangan Berkelanjutan dan kemudian menjual atau mengalihkan hak miliknya, maka fungsi dari pada tanah tersebut tidak boleh diubah. Jika mengubah dan menyebabkan saluran irigasi, infrastruktur serta mengurangi kesuburan tanah maka sesuai dengan pasal 51 ayat (2), orang tersebut berkewajiban untuk merehabilitasi lahan, dengan cara mpenyempurnaan sarana dan prasarana mencakup irigasi, jalan usaha tani, ketersedian alat pengolahan tanah mekanis dan membangun irigasi kembali agar tanah pertanian produktif."], ["https://openalex.org/W2795236730", "Poliziano e la collazione degli Scriptores rei rusticae - Le note all’incunabolo parigino Rés. s. 439", 2021, "article", 0, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W2914428772", "PERANAN PUSAT PELATIHAN PERTANIAN PEDESAAN SWADAYA (P4S) DALAM PEMBERDAYAAN PETANI DI KABUPATEN LAMPUNG TENGAH", 2020, "article", 1, "Agricultural Development and Management", "Penelitian ini bertujuan untuk menganalisis peranan Pusat Pelatihan Pertanian\r\nPedesaan Swadaya (P4S) dalam memberdayakan petani di Kabupaten Lampung\r\nTengah dan mengetahui faktor-faktor yang berhubungan dengan peranan P4S\r\ndalam memberdayakan petani di Kabupaten Lampung Tengah. Penelitian ini\r\ndilakukan pada empat P4S di Kabupaten Lampung Tengah yaitu P4S Mitra Tani\r\nMandiri, P4S Sama Maju, P4S Ras Andani, dan P4S Budidaya. Responden yang\r\nditeliti berjumlah 74 orang terdiri dari 23 fasilitator dan 51 petani. Pengumpulan\r\ndata dilakukan pada bulan Februari hingga Maret 2018. Peranan P4S dalam\r\nmemberdayakan petani dianalisis secara deskriptif dan hipotesis dianalisis dengan\r\nuji korelasi Rank Spearman. Hasil penelitian ini menunjukkan bahwa peranan P4S\r\ndalam memberdayakan petani di Kabupaten Lampung Tengah termasuk dalam\r\nklasifikasi sedang. Faktor internal yang meliputi sifat kekosmopolitan fasilitator\r\ndan motivasi kerja fasilitator, serta faktor eksternal yang berupa sistem\r\npenghargaan tidak berhubungan nyata dengan peranan P4S dalam\r\nmemberdayakan petani. Ketersediaan sarana prasarana dan jumlah petani binaan\r\nberhubungan nyata dengan peranan P4S dalam memberdayakan petani di\r\nKabupaten Lampung Tengah.\r\nKata kunci : pemberdayaan petani, P4S, peranan\r\n\r\nABSTRACT\r\n\r\nThis research aimed to analyze the role of rural agriculture training centre (P4S)\r\non empowering farmers and find out the factors related to the role. This research\r\nwas conducted in four P4S in Centre Lampung Regency, those are Mitra Tani\r\nMandiri, P4S Sama Maju, P4S Ras Andani, and P4S Budidaya. Respondents of\r\nthis research were 74 people that consist of 23 facilitators and 51 farmers. The\r\ndata were collected from February to March 2018. The role of P4S analyzed\r\ndescriptively and hypothesis was analyzed using Rank Spearman correlation. The\r\nresults of this research showed that the role of P4S on empowering farmers in\r\nCentre Lampung Regency is included in moderate classification. The internal\r\nfactors such as work motivation, cosmopolitan character, and the external factor\r\nthat is reward system don’t have significant relation to the role of P4S\r\nempowering farmers. Availability of facilities-infrastructure and the number of\r\nassisted farmers have significant relationship to the role of P4S on empowering\r\nfarmers in Centre Lampung Regency.\r\nKey words : empowering farmers, P4S, role"], ["https://openalex.org/W2939012452", "Investigating the links between the use of the internet, value co-creation, and customer satisfaction in the banking sector", 2020, "article", 3, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W2982357401", "STUDI PENENTUAN NILAI UNDULASI DARI EGM 2008 DENGAN DERAJAT HARMONIK 360, 720 DAN 2190 DI PULAU JAWA", 2020, "article", 0, "Geodetic Measurements and Engineering Structures", "Negara Indonesia yang mempunyai luas daratan 1.910.931,32 Km² (kemendagri, 2010) mempunyai sebaran Jaring Kontrol Geodesi yang berjumlah 7000 titik, dengan sebaran setiap titik yaitu 5 Km dan belum tersebar merata diseluruh wilayah Indonesia. maka pengukuran referensi tinggi untuk keperluan praktis pemetaan masih memerlukan waktu yang cukup lama serta biaya besar, terutama untuk daerah yang jauh ataupun belum mempunyai sebaran Jaring Kontrol Geodesi (JKG). EGM 2008 adalah salah satu solusi dalam mendapatkan nilai tinggi orthometrik yang dikombinasikan dengan nilai tinggi yang didapat dari pengamatan GNSS. Dari hasil penelitian ini didapatkan bahwa Nilai Undulasi dari EGM 2008 dibagi menjadi derajat dan orde 360, 720 dan 2190. Mempunyai nilai Undulasi minimal dan maksimal masing -  masing yaitu 16.297 m sampai dengan 34.644m di derajat dan orde maksimal 360, 16.056m sampai dengan 34.802m di derajat dan orde maksimal 720 dan 16.057m sampai dengan 34.495m di derajat dan orde maksimal 2190. Nilai Undulasi EGM 2008 dibandingkan terhadap nilai Undulasi Geometrik dari Jaring Kontrol Geodesi (JKG) yang tersebar di Pulau Jawa yang berjumlah 99 titik dan mempunyai 3 titik yang error dan 2 titik tidak mempunyai tinggi orthometrik, sehingga 5 titik JKG tersebut tidak dimasukkan dalam proses perhitungan. Nilai Undulasi EGM2008 dengan derajat dan orde masing – masing 360,720 dan 2190 terhadap nilai Undulasi geometrik JKG mempunyai nilai penyimpangan yang dinyatakan dengan standar deviasi yaitu pada derajat dan orde 360 adalah  49,5 cm , derajat dan orde 720 adalah 38,9 cm dan derajat dan orde 2190 adalah 36,8 cm. Dapat disimpulkan bahwa nilai undulasi EGM 2008 dengan derajat harmonik 2190 yang paling baik digunakan dengan standar deviasi 36.8cm. Kata Kunci : EGM 2008, Jaring Kontrol Geodesi, Undulasi Geoid, Model Geopotensial Global"], ["https://openalex.org/W2999335251", "PENGARUH PENERAPAN GOOD CORPORATE GOVERNANCE TERHADAP FINANCIAL DISTRESS Pada Perusahaan Jasa Sektor Infrastruktur, Utilitas, dan Transportasi yang Terdaftar di Bursa Efek Indonesia Tahun 2016 – 2018", 2020, "article", 2, "Corporate Social Responsibility Disclosure", "Penelitian ini bertujuan untuk mengetahui pengaruh penerapan good corporate governance terhadap financial distress. Good corporate governance diproksikan dengan dewan direksi, komisaris independen, komite audit, dan kepemilikan institusional. Financial distress diproksikan ke dalam Z-score model milik Altman. Populasi dalam penelitian ini yaitu seluruh perusahaan jasa sektor infrastruktur, uitilitas, dan transportasi yang di Bursa Efek Indonesia (BEI) sejak tahun 2016 sampai dengan 2018. Dari 78 perusahaan yang tercatat di Bursa Efek Indonesia (BEI), yang dapat digunakan untuk sampel penelitian sebanyak 26 perusahaan dengan menggunakan metode purposive sampling, artinya sampel dalam penelitian ini dipilih berdasarkan kriteria yang telah ditentukan. Hasil dari penelitian ini menunjukkan bahwa ukuran Komisaris Independen dan Kepemilikan Institusional memiliki pengaruh yang signifikan terhadap Financial Distress. Namun, Dewan Direksi dan Komite Audit memiliki pengaruh yang tidak signifikan terhadap Financial Distress.\r\n\r\nKata Kunci : Dewan Direksi, Komisaris Independen, Komite Audit, Kepemilikan Institusional dan Financial Distress"], ["https://openalex.org/W2999626704", "IPCC《气候变化与土地特别报告》对陆气相互作用的新认知", 2020, "article", 0, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W3047110501", "A Fast Publicly Verifiable Secret Sharing Scheme using Non-homogeneous Linear Recursions", 2020, "article", 1, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W3087141137", "Role of Materials Science and Engineering in Metal Additive Manufacturing", 2021, "article", 0, "Additive Manufacturing Materials and Processes", "Additive Manufacturing or Direct Manufacturing, popularly known as 3D Printing, has become the leading-edge manufacturing technology. Today Metal Additive Manufacturing (MAM) is a reality, not only for prototype fabrication, also for functional parts in all industrial sectors. Design freedom that the AM processes offer has led to design and engineering of new, complex, light-weight structures in all applications. However, in order to realize further and widespread use of metal AM for manufacturing critical components, it is necessary to explore the inherent material freedom in AM. While new metal AM materials are being developed, the role of Materials Science and Engineering (MSE) is becoming more apparent than ever before. This presentation will highlight the increasing role of Materials Science and Engineering in metal AM technologies. This presentation will show the essence of metallurgical principles in realizing full scope of material freedom in metal additive manufacturing. This presentation will demonstrate how fundamental MSE principles can be utilized to develop new materials, optimize metal AM and post processing, and their controls that cannot be achieved by conventional manufacturing methods. The examples with new AM alloys based on Al, Ti, and Ni will be presented, leading to a path of developing advanced and higher performance products for critical applications."], ["https://openalex.org/W3097197090", "Grassroot Innovations for Institute Flexibility: Leveraging Management of Technology to Improve Learner Health through Regular Practices", 2020, "article", 0, "Hermeneutics and Narrative Identity", "Indian Institute(s) of Technology (IITs in short) are public technology-based universities in India Declared to be 'institutions of national importance', they have been at the forefront of technical education Well-known for their all-rounded human-centric approach, IITs have encouraged sports In the past, IIT Bombay-one of the oldest among them-has revelled in sporting glory However, recent trends in Inter-IIT sports meets seem to indicate stagnation Some stakeholders of the institute feel that the time is ripe to implement innovative pilots at the grassroot level to alleviate this vexing problem We take participation in biathlon as a proxy for fitness needed for sporting activities and try to analyse the problem better by undertaking an observation-aided problem structuring exercise to reach at actor-clustered root causes for the slow uptake of practices Lack of motivation fuelled by valence deficit among students and lack of awareness about the synergistic impact of regular practices on other facets of life, emerge to be high-potential root causes This exercise is followed by the exploration of alternative group-level virtual distributed-practice ideas (given the context of COVID-19) to leverage management of technology (MoT) of emerging technologies to improve practices Our work adds to the extant body of knowledge along the methodological dimension by expounding in discreet details the steps involved in problem structuring Structured and sustainable initiatives of practices piloted as a part of this study can be implemented on a larger scale and can be communicated to the higher authorities through the Institute Sports Council for immediate implementation © 2020 Towards the Digital World and Industry X 0 - Proceedings of the 29th International Conference of the International Association for Management of Technology, IAMOT 2020 All rights reserved"], ["https://openalex.org/W3112129221", "Dominant Culture Prevailing in Two Agricultural State Universities in Central Luzon", 2020, "article", 0, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W3116230246", "THE USE ONLINE METACOGNITIVE STRATEGY ON READING STUDENTS' SKILLS", 2020, "article", 0, "Hermeneutics and Narrative Identity", "Metacognitive techniques are considered to be essential for developing reading skills. This research investigates whether there are major variations in student reading comprehension scores using metacognitive approaches techniques and investigates what metacognitive strategies are applied to students reading comprehension. Many of the participants in this study were high school eleventh-grade students. Data collection is carried out in the manner of the Reading Comprehension Test and Metacognitive Strategy Questionnaire. The findings showed that metacognitive strategies have a positive impact on student reading achievement. Based on the estimation of the eta-squared effect size of the paired sample, the t-test of the experimental community was 0.141. This indicates that there was a broad impact, with major changes in student grades before and after treatment. There are nine subcategories of metacognitive methods for student understanding. For example, Advance Organizer, Self-Management, Tracking Awareness, Output Monitoring, Self-Assessment Self-Assessment, and Self-Reflection. Although the applicability is strong Metacognitive techniques for reading comprehension fall into two subcategories: Selective treatment and organizational preparation. And the most significant use of the method is Selective focus, though self-reflection is the least technique. Keywords : online metacognitive, metacognotive strategy, reading skills"], ["https://openalex.org/W3113927501", "EXPLORING ONLINE COLLABORATIVE WRITING WITH SOCIAL MEDIA", 2020, "article", 0, "Hermeneutics and Narrative Identity", "Online interactive learning is an innovative approach intended to create a commitment to creating narrative text writing, comprehension, and creative client ideas. This assessment's inspiration is to evaluate the effect of online interactive learning on student grades and narrative texts' composition. Analysis has been performed at MTs. Miftahul Huda Tuban in the 7th grade. To determine does online collaborative learning through telegram is successful, researchers use a pre-experimental method when the information is measured using a t-test statistical formula. As a result of the exploration, the mean pre-test was 51,3333, and the mean post-test was 84,000. From the pre-test post-test study results, it can be shown that there is an impact on increasing student scores by using online interactive learning methods through telegram."], ["https://openalex.org/W3117868201", "THE EFFECT OF ONLINE PROJECT-BASED LEARNING ON STUDENTS' WRITING DESCRIPTIVE TEXT IN COLLABORATIVE LEARNING AT SECOND GRADE OF SMK NU AL BAROKAH BABAT", 2020, "article", 0, "Hermeneutics and Narrative Identity", "Project-based learning is a type of learning that uses tasks as a basis for learning. It is a very innovative learning method for engaging in project work, in which students work individually on building up their learning and on real goods. The goal of this study was to determine the impact of using online project-based learning on student learning skills and writing descriptive texts. The study was conducted in class XI at SMK NU Al Barokah Babat. To determine whether or not online project based learning was successful, the researchers used a pre-experimental approach to evaluate the data using the t-test statistical formula. The findings of this analysis were the pre-test mean of 53,8333 and the post-test mean of 53,8333."], ["https://openalex.org/W3128047200", "An Empirical Research on the Employment of Chinese University and College New Graduates Under the Impact of COVID-19", 2020, "article", 0, "COVID-19 Pandemic Impacts", "Under the impact of the pandemic, the employment status of recent graduates is unprecedentedly difficult. Recently, a study published in Journal of East China Normal University (Educational Sciences) investigated the employment situation of college graduates in China under the pandemic."], ["https://openalex.org/W3130673091", "Adoptive Cell Therapy for Cancer Treatment", 2020, "article", 0, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W3184457132", "Se celebra el Cuarto Congreso Anual de Madrid sobre Economía de la Escuela Austriaca", 2020, "article", 0, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W3189017526", "150 aniversario de los Principios de Economía de Carl Menger", 2021, "article", 0, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W3087629295", "The Jerubba‘al Inscription from Khirbet al-Ra‘i: a Proto-Canaanite (Early Alphabetic) inscription", 2021, "article", 0, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W4214953223", "Effects of metformin and insulin on gestational diabetes mellitus: A dual drugs therapy approach", 2022, "article", 0, "Hermeneutics and Narrative Identity", "Abstract: This study was aimed to investigate the combined effects of metformin hydrochloride and insulin aspart on perinatal blood glucose and pregnancy outcome during gestational diabetes mellitus"], ["https://openalex.org/W4214953233", "Association of fibrinogen and plasminogen activator inhibitor-1 with diabetes mellitus", 2022, "article", 0, "Hermeneutics and Narrative Identity", "Abstract: As the state of hyperfibrinogenemia in diabetes patients occurs due to hyperglycemia"], ["https://openalex.org/W4214955215", "De novo design of novel spike glycoprotein inhibitors using e-pharmacophore modeling, molecular hybridization, ADMET, quantum mechanics and molecular dynamics studies for COVID-19", 2022, "article", 0, "Hermeneutics and Narrative Identity", "Abstract: The pandemic COVID-19, caused by SARS-COV-2, has been a global concern and burden since April 2020"], ["https://openalex.org/W4214953224", "Prevalence of antibiotic resistance pattern in shigella isolates procured from pediatric patients at Faisalabad - Pakistan", 2022, "article", 0, "Hermeneutics and Narrative Identity", "Abstract: Shigella infection (shigellosis) is an intestinal disease caused by a shigella isolates belongs to a family Enterobacteriacea"], ["https://openalex.org/W4214956275", "A comparative study of echinacoside, oleuropein content and antioxidant properties of different solvent extracts from Syringa pubescens Turcz", 2022, "article", 0, "Hermeneutics and Narrative Identity", "Abstract: Syringa pubescens Turcz is commonly used folk medicinal herb in west of Henan Province of China. In this work"], ["https://openalex.org/W4214954401", "Pharmacognostic and phytochemical study of the flowers of Cordia sebestena L.", 2022, "article", 0, "Hermeneutics and Narrative Identity", "Abstract: The present study shows the pharmacognostic and phytochemical studies on the flowers of Cordia sebestena L."], ["https://openalex.org/W4309856713", "A Lie-Theoretic Construction of Cartan-Moser Chains", 2021, "article", 0, "Holomorphic and Operator Theory", null], ["https://openalex.org/W3129207468", "Regulations on Sex Toy Industry in Europe", 2021, "article", 2, "Sex work and related issues", "The European sex toy market is witnessing a strategic sales growth. The lockdown to contain the Corona Pandemic situation is boosting the market scenario. Countries such as the UK, Germany, France, Italy, and Spain are key growing countries driving the demand for sex toys in Europe. Against this background, this article explores the sex toy industry in Europe and the few laws that govern it. It discusses that a lack of regulation of these products has allowed manufacturers to exploit the inexpensive but highly toxic materials used in the making of sex toys to the detriment of consumers, and the implications inclined towards improving the protection of consumers in Europe."], ["https://openalex.org/W3158506931", "Effects of Private and Public Health Insurance on Diagnosis of Heart Disease", 2020, "article", 0, "Healthcare Policy and Management", null], ["https://openalex.org/W3104187263", "Collaborative Practices of English Teachers for Improving Their Classroom Pedagogy", 2020, "article", 0, "EFL/ESL Teaching and Learning", "This study aims to explore secondary level English teachers’ collaborative practices and their perceptions on it. It was carried out within the theoretical framework of social constructivism. I employed phenomenological approach, and qualitative research design as a research method. Three secondary level English teachers teaching at three community schools of Butwal Sub- Metropolitan city in Rupandehi district, Nepal were purposively selected as research participants. Out of three participants, two were males and one was female who had been practicing collaborative teaching in their classrooms for more than four years. The research participants were interviewed using a semi-structured interview technique to collect relevant information for the purpose. The study reveals that English teachers have positive views towards collaborative practices and undertaking different collaborative activities such as sharing lessons, exchanging answer sheets, team teaching and so on for improving their classroom pedagogy and professional development. The findings also expose the benefits that English teachers have from collaborative practices, and the challenges they have faced while adopting these practices inside the classroom and the beyond."], ["https://openalex.org/W3203552846", "THE USE OF RESISTIVITY TESTING FOR QUALITY CONTROL OF CONCRETE MIXTURES", 2020, "article", 0, "Geophysical Methods and Applications", null], ["https://openalex.org/W3213122519", "A financial Health Analysis of Selected Companies from Nifty 50 using Altman Z-Score Model", 2021, "article", 0, "Financial Distress and Bankruptcy Prediction", "India has become the world's fastest growing major economy and is expected to be one of the world's top three economic powers for the next 10 to 15 years, backed by its strong and largest democracy. In this paper Researcher has randomly selected five companies from Nifty 50 and period of study is four financial years. Objectives of the study is to check financial status of selected companies and compare Z-Score among randomly selected Nifty 50 Companies. Altman Z Score model has been used for analysis of study. In last Researcher has found that only one Britannia Industries Ltd. has come under safe zone, two companies’ vis Mahindra and Mahindra Ltd. and Shree Cement Ltd. have in Grey Zone and remaining two vis Tata Steel Ltd. and Bharti Airtel Ltd. have in Distress Zone. So, it can said that these two companies need to check their financial position and improve their sales and working capital position to come in good Z Score position."], ["https://openalex.org/W3177285596", "Alternative approach to controlling citrus black spot disease", 2020, "article", 0, "Phytoplasmas and Hemiptera pathogens", null], ["https://openalex.org/W3215576690", "Pelatihan Tari Kreasi Banten Ing Tanah Jawara di Sanggar Seni Rajawali Pandeglang", 2022, "article", 0, "Cultural and Artistic Studies", "ABSTRACT The Banten Ing Tanah Jawara dance training is a dance training process created by Rajawali Pandeglang art studio for male dancers. The Rajawali Pandeglang art studio was one of the studios in Pandeglang Regency that is active in the dance training and has a fairly good dancing quality, especially for male dancers. This can be seen from the techniques and movements performed by male dancers. This study aims to find out the process of the Banten Ing Tanah Jawara dance training for male members, as well as what factors are supporting and inhibiting the training process. This study used a descriptive method using a qualitative approach and supported by other supporting theories by looking at the training process of the Banten Ing Tanah Jawara creation dance at Rajawali Pandeglang art studio. Data collected  by using observational studies, interviews, and documentation. Based on the results of the study, it was shown that the training process for the creation of Banten Ing Tanah Jawara dance at the Rajawali Pandeglang art studio was held four times gradually, scheduled and systematic, each meeting covering planning, implementation, observation and evaluation, and the supporting factors for the training are the dancers's basic abilities and the trainers's roles, whereas the inhibitin factors in the training process is the discipline of training time. Keywords: Creative Dance Training Process, Creative Dance, Banten Ing Tanah Jawara. ABSTRAK Proses pelatihan tari kreasi Banten Ing Tanah Jawara adalah proses pelatihan tari yang dilakukan di sanggar seni Rajawali Pandeglang dan diberikan kepada penari laki-laki. Sanggar seni Rajawali Pandeglang merupakan salahsatu sanggar yang ada di Kabupaten pandeglang yang aktif dalam proses pelatihan tari dan memiliki kualitas kepenarian yang cukup baik terutama bagi penari laki-laki. Hal ini dapat dilihat dari teknik dan pengolahan gerak yang dilakukan penari laki-laki. Penelitian ini bertujuan untuk mengetahui bagaimana proses pelatihan tari Banten Ing Tanah Jawara bagi anggota laki-laki, serta apa saja yang menjadi faktor pendukung dan penghambat dalam proses latihan tersebut. Metode dalam penelitian ini menggunakan metode deskriptif dengan menggunakan pendekatan kualitatif serta ditunjang dengan teori pendukung lainnya dengan melihat proses pelatihan tari kreasi Banten Ing Tanah Jawara di sanggar seni Rajawali Pandeglang. Teknik pengumpulan data dilakukan dengan studi observasi, wawancara, dan dokumentasi. Berdasarkan hasil penelitian menunjukan bahwa proses pelatihan tari kreasi Banten Ing Tanah Jawara di sanggar seni Rajawali Pandeglang dilakukan sebanyak empat kali pertemuan secara bertahap, terjadwal dan sistematis setiap pertemuan meliputi perencanaan,pelaksanaan, pengamatan dan evaluasi, dengan adanya faktor pendukung yakni kemampuan dasar penari dan peran pelatih, serta faktor yang menjadi penghambat dalam proses latihan adalah kedisiplinan waktu latihan. Kata Kunci : Proses Pelatihan, Tari kreasi,  Banten Ing Tanah Jawara"], ["https://openalex.org/W3186194392", "A roadmap to recovery and a life worth living", 2021, "article", 0, "Psychotherapy Techniques and Applications", "This research explores adolescents’ lived experience of 24 weeks of Dialectical Behaviour Therapy (DBT), designed to address severe mental health difficulties including suicidal and self-harming behaviour. There is a lack of published literature regarding adolescent lived experiences of 6 months comprehensive DBT. A qualitative design in the form of Interpretative Phenomenological Analysis (IPA) is an appropriate fit for research questions concerned with individual phenomenology. Six adolescent service users self-selected to take part in the research. One superordinate theme around recovery of mental health and wellbeing was characterised as ‘building a roadmap to recovery and a life worth living’. Three subordinate themes depict the steps on the road and describe how individuals travelled from ‘alienation to insight’, ‘isolation to connection’, and from ‘passive disempowered recipient of intervention to proactive engagement as empowered service users’. Novel links between DBT, identity process theory, attachment theory and critical psychology are made."], ["https://openalex.org/W3126955224", "Chimamanda Ngozi Adichie’s Purple Hibiscus as a Rewriting of Nathaniel Hawthorne's “Rappaccini's Daughter”", 2020, "article", 0, "Postcolonial and Cultural Literary Studies", "This paper focuses on the shared literary features between Nathaniel Hawthorne's “Rappaccini's Daughter” and Chimamanda Ngozi Adichie's Purple Hibiscus. It discusses Hawthorne's short story (1844) as a major work influencing Adichie's novel (2003). It investigates Adichie's approach of unraveling some of the primary issues of her time through referring to Hawthorne's views in “Rappaccini's Daughter”. The paper also examines the theme of Religion and character formation as two similar literary elements, and it examines how the symbolism of the experiment flower is used differently according to the authors' thematic views. By considering Adichie's Purple Hibiscus as a rewriting of Hawthorne's “Rappaccini's Daughter”, the researcher aims to depict the themes of religion and science, character formation, and symbolism as shared literary elements between the two works."], ["https://openalex.org/W3211531726", "EXPLORING THE CONTRIBUTION OF MEDIA IN ADVANCING SUSTAINABLE DEVELOPMENT GOALS IN INDIA", 2021, "article", 0, "Climate Change Communication and Perception", "Media is an important participant in regard to societies reaching the goals of development-both as a contributor and a beneficiary. News media can play an important role in floating awareness about the Sustainable Development Goals (SDGs). Media in all its forms has a crucial role to play in the development agenda to ensure that citizens are well informed. The media has important roles to play, to inform, to educate, and to provide a platform for public debate and discussion. It could serve as catalyst for citizens’ empowerment and help to hold government and authorities to account. Third world countries like India have been facing odd situations in terms of poverty, environment, health, politics, and education. There have been efforts by the government and non- government agencies to sensitize the citizens and to make them acknowledge the programs intended at improving their socio-economic welfare. Communication is a vital tool in mobilizing people in the direction of the participatory process which in turn makes development an achievable goal. The present paper is an attempt to provide comprehensive information and explore the significance of the role of media as a powerful tool towards achieving the Sustainable Development Goal in India. The qualitative approach is conducted to explore deeper insight of SDGs understanding from news media. This study found that not all SDGs are informed well. Only several SDGs are framed based on the concern of public policy."], ["https://openalex.org/W3181622464", "PERAN TEMAN SEBAYA DALAM PEMBENTUKAN AKHLAK ANAK: STUDI DI MTs MUHAMMADIYAH CURUP", 2020, "article", 0, "Educational Methods and Impacts", "This study sought to investigate a depiction of students’ parallel social engagement pattern in MTS Muhammadiyah of Curup, Bengkulu. In so doing, it dealt with whether their peers played a role in the formation of students’ morality. The foregoing question was answered through field research using a qualitative approach. The subjects as well as informants of this study were the principal, teachers, and students at MTs Muhammadiyah of Curup. Data collection techniques were observation and interviews, and then the data were analyzed using Miles’ et al approach, namely data reduction, data presentation, and conclusion drawing. This study concluded that the role of peers for the formation of students’ morality was seen in students’ tendency to choose their playmates at school. If they preferred good friends, then they would follow those friends’ behavior, and vice versa. Efforts made by the school to overcome students who were not morally good were in a way that teachers consolidate with counseling teachers, class teachers, and parents in order to work together to overcome this problem."], ["https://openalex.org/W3025988299", "Age and Sex Composition", 2020, "article", 2, "Demographic Trends and Gender Preferences", "Data on age and sex composition are some of the most basic statistics a nation can collect about its people. They are determined by births, deaths, and migration and, in turn, affect other demographic characteristics such as fertility rates and regional changes in population (increases or decreases). In fact, both of these are the two constants that have been questions on every single census since 1790."], ["https://openalex.org/W3197132490", "Palle Ove Christiansen: Med skibet i kroppen. Mennesker og maritimt miljø i Det sydfynske øhav 1750-1950. Marstal Søfartsmuseum, 2020.", 2021, "article", 0, "Historical and Archaeological Studies", null], ["https://openalex.org/W3216914702", "Impact of nutritional factors and lifestyle in the etiology of micronutrients deficiency causing new world syndrome", 2021, "article", 0, "Diet and metabolism studies", "The present study was to assess the prevalence of New World Syndrome in office going person and their dietary habits. New World Syndrome is a set of non-communicable diseases brought on by consumption of junk food and a sedentary lifestyle, especially common to office going person. It is characterized by obesity, heart disease, diabetes, hypertension, and shortened life span. The data concerning dietary intake of the respondents were collected using 24 hour recall method, Data concerning lifestyle and Dietary habit was obtained from the respondents by ‘questionnaire-cum interview’ and purposive random sampling method. 2.11 mg of thiamine, 1.76 mg of riboflavin and 15.39 mg of niacin, were consumed by male respondents followed by 2.31 mg thiamine, 1.64 mg riboflavin and 15.81 mg niacin were consumed by female respondents. Sedentary lifestyle consists of excessive periods of sitting or lying down while engaging in activities such as reading, watching television or using a mobile phone or computer. Sitting at a desk for long periods of time, combined with environmental factor such as artificial light, and workplace stressors such as meeting deadlines can have a series of negative effects on employee physical and mental wellbeing."], ["https://openalex.org/W3093519922", "ONLINE TRAINING OF UNIVERSITY STUDENTS AS TAEKWONDO REFEREES DURING A CORONAVIRUS PANDEMIC", 2020, "article", 2, "Physical Education and Training Studies", "COVID-19 caused the suspension of most sports events and the dismissal of all athletes, coaches, sports specialists, officials (referees and judges) and other persons involved in the field In recent decades technological progress and digitalisation have undergone substantial development, thereby providing excellent opportunities for online training In times of social distancing, hardware and software solutions have gained prominence as appropriate and necessary means of remote attendance for participants in educational events Referees have become an integral part of modern sports as the officials upholding the proper application of the competition rules, fair play and the observance of the code of ethics during events Considering the pandemic situation, which renders the conducting of attended events impossible, as well as the key role of sports officials, we set out to organize the training of officials online The target group for the study consisted of students from the Taekwondo Coach specialty in the faculty of the Vassil Levski National Sports Academy, given their specific knowledge and involvement in the sport The implementation of the project showed that online training was a suitable method for the reinforcing, enriching and improving of the competencies of officials in Bulgaria during an ongoing pandemic In the field, distance training proved to be a promising practice for the conducting of all theoretical and some practical classes for the officials in the country The studies conducted allow us to conclude that during the COVID-19 pandemic it is possible to use modern technical means and methods successfully in order to involve athletes, coaches and officials with sports activities The results of this project provoke us to re-assess the policies and methods applicable to the training of officials at the national and the international level"], ["https://openalex.org/W3190843759", "Endometrite crônica e infertilidade", 2021, "article", 0, "Ovarian function and disorders", null], ["https://openalex.org/W3108663739", "Understanding Society through Fiction: an X-ray of the Remote Uganda from the Perspective of Nakibimbiri Omunjakko", 2020, "article", 0, "African history and culture studies", "The saying that literature is a mirror of society is well demonstrated in Nakibimbiri’s The Sobbing Sounds. The novel leaves the reader with a clear picture of how life was lived in the rural part of Uganda in the immediate past. People who grew up in rural areas read and enjoy the story as it shares similar experiences with them. Those who grew up in urban areas read the novel and see the episodes in the novel as bizarre and unthinkable. Nakibimbiri has through the novel, naturally shown the society the way it was in the recent past. The researchers discover that Nakibimiri has profusely blended historical facts in the novel so naturally in such a way that the reader is not left in doubt about the credibility of any episode of the novel. They have therefore, parsed the novel with a view to unraveling some societal facts about the rural part of Uganda so that contemporary audience would have an idea of many transformations that have taken place over the time. It is observed from the novel that only little or no disparities at all existed in the way life was lived in almost every rural parts of Africa as a whole."], ["https://openalex.org/W3164836516", "The Review of Application of Drones for Smart Agriculture", 2021, "article", 0, "Smart Agriculture and AI", "In recent years, due to environmental changes, the crop yield in the agriculture is widely affected and hence needs technological intervention. The most recent advancement is the expansion in the utilization of tiny, unmanned aerial vehicles (UAVs) normally known as drones for agrobusiness. Data gathered through drone forays genuinely necessary information to enact systematic models for horticulture. In supporting accuracy in cultivating, drones can do soil health examininations, screen crop health, help with arranging water system plans, apply manures, collects gauge yield information and gives important information regarding climate change. Data gathered through drone combined with other information sources and scientific arrangements give noteworthyinformation. This paper reviews the application of drones for e-Agriculture."], ["https://openalex.org/W3120977812", "Dose dependent effects of O2/O3 therapy on PSA levels of patient with risk of prostate cancer", 2020, "article", 0, "Medical and Biological Ozone Research", "Oxygen/Ozone (O2/O3) is a complementary therapy for prostate cancer, as with other types of cancer, i.e., it is used in support of conventional treatments such as radiation therapy or surgical removal of the prostate. However, some prostate cancer patients elect to manage prostate cancer by active surveillance rather than conventional therapies in accordance with treatment guidelines, or due to the uncertain prognostic value of testing and the side-effects of the treatments. The objective of this report is to demonstrate the potentially beneficial therapeutic value of O2/O3 treatment, applied in effective doses, for a prostate cancer patient electing disease management by active surveillance. The subject was a 64-year-old male diagnosed by needle biopsy with localized prostate cancer classified as being in the unfavorable intermediate risk group. He elected active surveillance to manage his cancer instead of recommended conventional therapies and received O2/O3 therapy for about a year. The treatment was divided roughly into four quarterly phases, with a PSA test performed at the end of each of the four phases. During phases 2 and 3 of the treatment, the patient’s PSA score increased from 9.7 ng/mL to 14.7 ng/mL. However, at the end of phase 4 his PSA score decreased to 11.7. During phase 4, the O2/O3 treatment was performed more regularly than during phases 2 and 3, and at lower concentrations and overall doses. This suggests that O2/O3 treatment at the correct doses and frequency of treatment may have beneficial therapeutic value for a prostate cancer patient electing disease management through active surveillance rather than conventional treatment. .."], ["https://openalex.org/W3201003689", "Pensión Forestal Campesina", 2020, "article", 0, "Comparative International Legal Studies", "Sin resumen disponible."], ["https://openalex.org/W3083473180", "Psychology of the oppressed: Viewpoints", 2020, "article", 0, "Academic and Historical Perspectives in Psychology", null], ["https://openalex.org/W3168833187", "Measuring the Financial Impact of Family Businesses on the US Economy", 2021, "article", 8, "Family Business Performance and Succession", null], ["https://openalex.org/W3046679466", "Ozonoterapia en el tratamiento de herida infectada en niño en un Hospital Público en São Luís - Maranhão - Brasil. Reporte de caso", 2020, "article", 0, "Medical and Biological Ozone Research", "Ozone therapy, due to its bactericidal, fungicidal, anti-inflammatory, analgesic and tissue-regenerating properties, has been widely used as a supplement in the treatment of wounds. The objective of this case report is to demonstrate the effectiveness of ozone therapy in the treatment of a 2-year-old and 11-month-old boy admitted to a Public Hospital of Urgency and Emergency, with a large wound on his right foot, infected, with a tibia and fibula fracture, caused by a car accident, that had an adverse reaction to the antibiotic clindamycin and had ozone therapy as the main therapy. The patient was successfully treated with ozone therapy locally (ozonated saline, ozonated bag, and ozonated sunflower oil). The treatment lasted 38 days with a total of 19 ozone therapy sessions. This study adds e.vidence of the usefulness of ozone therapy as an effective and safe method of treating wounds"], ["https://openalex.org/W3184879072", "Atomangst og civilt beredskab. Red.: Marianne Rostgaard og Morten Pedersen. Aalborg Universitetsforlag, 2020.", 2021, "article", 0, "Knowledge Management and Technology", null], ["https://openalex.org/W3201601522", "Biodiversidad y servicios ecosistémicos en Cartama-Antioquia", 2020, "article", 0, "Water Resource Management and Quality", "Sin resumen disponible."], ["https://openalex.org/W3203460566", "Facilitating Empowerment of Women through Self Help Groups with Reference to NABARD in Punjab: An Analysis", 2020, "article", 1, "Microfinance and Financial Inclusion", "Women are an integral part of the social, economic and political system. women. The overall growth and development of a country is viable only when women are given equal opportunities in every sphere and access to various services. Microfinance is the first step towards bringing women within the purview of access to financial services for the economic empowerment of women which paved way for their sustainable livelihood. The financial services are a better way to access the banking facilities for the poor at an affordable cost. The sources of credit represent linkage between banks and Self Help Groups and provide credit funds for women to enhance livelihood opportunities. National Bank for Agriculture and Rural Development (NABARD) acts as facilitator and provider of microfinance. An attempt has been made in this paper to study the Role of NABARD as Facilitator for financial inclusion of women; to assess the impact of financial inclusion on sustainable livelihood of SHGs of women. An attempt has been made to analyze the impact of working in SHG on women economic empowerment in Hoshiarpur and Mansa districts of Punjab. It has been found that there is a positive impact on women empowerment through self-help groups, in terms of increase in participation, awareness, credit accessibility, asset creation, entrepreneurship, repayment of other debts, and gained the decision making skills. Women are now more confident in Decision making. The self-help groups have enabled marginalized women to get social status as well as now they have access to various financial products and services at very low cost."], ["https://openalex.org/W3046363719", "Tratamiento de la parálisis facial mediante ozonoterapia. Experiencia en 5 pacientes.", 2020, "article", 0, "Medical and Biological Ozone Research", "Introduction: Facial palsy is an everyday condition. The majority of cases are included on condition of generally idiopathic etiology or Bell´s Palsy. Generally constitue a bening pathology, but with variable recovery, and the risk of effects. The treatment combines physics and pharmaceutical methods, and, sometimes, rehabilítate surgery and neuromuscular therapy. Ozone therapy is a treatment that does not cause side effects, allergies, interaction with other drugs, is easy to apply and low cost which makes it an excellent therapy. Objetive: To present 5 clinical Bell Palsy´s cases treated with ozone therapy as a complementary way with physical therapy. Material and methods: 5 patients were treated by local infiltrations with ozone in a concentration of 10 a 20 µgr/mL, once every 7 days, a mínimum 4 times and a máximum depending on the clinic improvement. Results: High improvement or total recovery were observed in a period of time of 4 to 5 weeks. Conclusion: Ozone therapy may constitute a good choice in the treatment due to the effects noticed in improving symptomatology."], ["https://openalex.org/W3127568158", "Contribution of School Administrators to Instructional Supervision of Schemes of Work in the Enhancement of Students’ Academic Performance in Secondary Schools in Emuhaya and Vihiga Sub Counties in Kenya:", 2020, "article", 0, "Educational and Psychological Assessments", "Studies worldwide have revealed that school administrators are key contributors to students’ academic performance by enhancing instructional supervision within schools. Notwithstanding this assertion in some countries academic performances have been found to be low despite this administrators’ contribution. For instance, in Kenya the average performance for the years 2010 to 2014, only 29% candidates scored above a mean score of 6.00 points. In Emuhaya and Vihiga Sub Counties 3535 (26%) and 2104 (15%) candidates respectively scored 6.00 and above points compared to Hamisi and Sabatia Sub-Counties’ with 3913 (28%) and 4275 (31%) candidates respectively between years 2009 and 2013. The objective of the study was to establish the contribution of school administrators to instructional supervision with regard to schemes of work in the enhancement of students’ academic performance. The study was guided by a conceptual framework in which the independent variable was the administrators’ contribution in form of checking prepared schemes of works and the dependent variable, students’ academic performance. The study established that administrators’ contribution to instructional supervision was low (Adjusted R2= 0.011). The study concluded that administrators’ contribution to instructional supervision was not significant and therefore, did not enhance students’ academic performance. The study recommended that administrators should increase their contribution to instructional supervision in order to enhance students’ academic performance. The study findings are of significance to school administrators, policy makers and other stakeholders with regard to enhancement of students’ academic performance by increasing instructional supervision."], ["https://openalex.org/W4409112218", "Meat Adulteration, Methods of Detection and Its Public Health Importance", 2024, "article", 0, "Identification and Quantification in Food", null], ["https://openalex.org/W3103050107", "Ozonoterapia en Tratamiento Periodontal Clínico", 2020, "article", 0, "Medical and Biological Ozone Research", "Periodontal disease or gingival disease are bacterial infections that are treated daily in the dental office. There is evidence regarding the antimicrobial efficacy of Ozone (both in gaseous, oily, and aqueous forms) that it is a highly effective agent for the elimination of microorganisms. Ozone therapy has become an adjunctive treatment in the control and treatment of diseases both dental and dermatological, cosmetic, among others due to its antimicrobial capacity. The objective of this study is to review the medical literature on the effects of ozone in clinical periodontal treatment, presenting and discussing advantages, objectives, contraindications and its different uses in dentistry, mainly in periodontal disease"], ["https://openalex.org/W3199233470", "Diagnosis dan Tatalaksana Fraktur Penis", 2020, "article", 1, "Urological Disorders and Treatments", "Fraktur penis merupakan kasus kegawatdaruratan urologi yang jarang, namun membutuhkan penanganan segera. Mekanisme terjadinya adalah ruptur tunika albuginea pars cavernosa akibat tekanan traumatik saat penis ereksi. Penyebab tersering adalah saat hubungan seksual. Diagnosis melalui anamnesis dan pemeriksaan fisik. Tindakan operatif dilakukan secepatnya untuk mencegah komplikasi. Penile fracture is a rare urological emergency, but always requires immediate attention. The cause is a traumatic rupture of the tunica albuginea of corpora cavernosa due to bending of the penile shaft during erection. Penile fracture commonly occurs during sexual intercourse. Diagnosis by history and physical examination. Penile fracture needs immediate operative treatment to prevent complications."], ["https://openalex.org/W3198769200", "In Support of Students' Needs: Exploring the Benefits of the Inquiry Design Model", 2020, "article", 0, "Education and Critical Thinking Development", "For 13 years, I was a high school history teacher in North Carolina. During that time I had the good fortune to work alongside teachers whose work I respected and admired. I respected their savvy and thoughtful instructional design, and I admired the meaningful relationships they developed with their students. Perhaps most importantly, in each of these teachers, I observed an unmistakable passion for their content and students alike."], ["https://openalex.org/W3191423891", "Thomas Viggo Pedersen: Grundtvigs Kirke og det aristokratiske primtal. En drøm fra det tyvende århundrede. Vandkunsten, København, 2020.", 2021, "article", 0, "Balkan and Eastern European Studies", null], ["https://openalex.org/W3141927291", "Broadband Connectivity In “Flyover Country”", 2020, "article", 0, "ICT Impact and Policies", "Broadband commonly refers to high-speed internet access that is always on and faster than the traditional dial-up access. Most urban areas in the United States have broadband and cellular internet services abundantly provided, but adequate broadband in rural areas of the country still do not have enough internet service needed to perform and compete in modern markets. In the 21st Century, the Internet is necessary to complete necessary tasks in communications for education, businesses, health care, and farming communities. This case provides a conversation for a Computer Information Systems undergraduate course, or an introduction to Management Information Systems course, in which this topic is part of the curriculum. The case could be used in other courses to discuss the impact of legislation on business, public/private collaborations, and ethics. It has application for various economics classes or courses bearing on the Internet and connectivity. The case was written to generate discussion and to help students contend with the trade-offs of social and economic realities of business and governmental policies. The emphasis of the case is to provide an opportunity for students to learn about the topics and become knowledgeable about the problems that are presented."], ["https://openalex.org/W3214030144", "MARINA TSVETAEVA AND VLADIMIR NABOKOV AS FRENCH TRANSLATORS OF PUSHKIN", 2021, "article", 0, "Discourse Analysis and Cultural Communication", null], ["https://openalex.org/W3008289611", "Case Study: The Description Of Spiritual Quotient On Average Adult Womens Of Pneumonial Cancer", 2020, "article", 0, "Mental Health and Well-being", "Pneumonial cancer places the first rank  as death cause of cancer(1,37 millions of death). Cancer has impact not only to someone’s physics but also psychology. In term of spiritualquotient playing role, in which an individual can place himself in the greater context in order to make life meaningful, by vesting positive value in himself. Thus, the individual will be able to awake his soul to act positively as well. This research is aimed at finding out the description of spiritual quotient and factors causing the spiritual quotient on average women  thepneumonial cancer sufferers. This research used qualitative method in the form of case study. The subject of this research was a married  averagewoman aged 45 years and suffering from pneumonial cancer of stadium III with 5-year suffer. The data collection on subject and significant done with  structured and non-participant observation. The result of the research shows that the description of spiritual quotient on subject such as life meaning during pneumonialcancer suffering. Subject keep doing his life well and do the positive things. The result of the research also shows that subject thanks God because the people around them also give attention and support so that the subject keeps spirit in doing her life and have spirit to recover."], ["https://openalex.org/W3213662909", "The Impact of Indian Independence Movement on the select Novels of Raja Rao", 2021, "article", 0, "Indian History and Philosophy", "Indian Writing in English is influenced by Gandhian ideology. Gandhi emphasized more on social, political, and religious problems of the oppressed and down trodden lower castes in Hindu society. His aim was to abolish poverty, caste system and untouchability from society. The present study reveals prominently the influence of Mahatma Gandhi on the village of Kanthapura. ‘Kanthapura’ is the microcosm of the Indian traditional society and what happened in Kanthapura was also happened in India during 1919-1930. It is not only a political novel, but also a novel which concerns with socio-religious and economic transformation during the struggle for independence. ‘Kanthapura’ follows Gandhi’s doctrine and ideology of non-violence, Satyagraha, their views on untouchability and casteism etc. The novel can be considered Gandhi-epic. Gandhi aroused national awakening in Indians with his non-violent struggle for freedom movement which was strengthened by noncooperation and civil disobedience movement in Kanthapura village. Gandhi’s influential personality and his ideology is felt everywhere in the novel. Indeed, Gandhi doesn’t appear in this novel personally, but the plot of the novel revolves around his ideology. This research article, ‘Gandhi’s Ideology: A Study of Raja Rao’s Kanthapura’ aims at how the Gandhi’s ideology influenced Raja Rao which resulted in the creation of the character of Moorthy. It also focuses on how Moorthy, under the influence of Gandhi, tries to inspire the people towards the freedom struggle."], ["https://openalex.org/W3112467007", "The Politics and Ideologies of Pluricentric German in L2 Teaching", 2020, "article", 7, "Linguistic research and analysis", "Despite a history of rigorous linguistic research on the regional variation of German as well as professional initiatives to promote German, Austrian, and Swiss Standard German as equal varieties, there is still a lack of awareness and systematic incorporation of regional varieties in L2 German teaching. This essay follows two goals: First, it reviews the development of the pluricentric approach in the discourse on L2 German teaching as well as the political and ideological preconditions that form the backdrop of this discussion. Particular emphasis will be given to institutional tri-national collaborations and the standard language ideology. Second, by drawing on sociolinguistic insights on the use and speaker attitudes of (non-)standard varieties, this contribution argues that the pluricentric focus on national standard varieties in L2 German teaching falls short in capturing the complex socioculturally situated practices of language use in both (often dialectally-oriented) everyday and (often standard-oriented) formal and official domains of language use. I argue that the pluricentric approach forms an important step in overcoming the monocentric bias of one correct Standard German; however, for an approach to L2 German teaching that aims at representing linguistic and cultural diversity, it is necessary to incorporate both standard and non-standard varieties into L2 German teaching."], ["https://openalex.org/W3161115884", "Semblanza de Héctor Fix Fierro (1961-2020)", 2020, "article", 0, "Latin American Literature Studies", null], ["https://openalex.org/W3023501577", "The use of short speculative fiction in teaching about privacy", 2020, "article", 2, "Digital Games and Media", null], ["https://openalex.org/W3086627075", "Efectos de la ozonoterapia en el desprendimiento de retina multitratada quirúrgicamente. Reporte de Caso.", 2020, "article", 0, "Medical and Biological Ozone Research", "Retinal detachment is the physical separation of the neurosensory retina from the retinal pigmented epithelium, developing vision loss. The surgical approach is recommended within the treatment, however, there are many adverse effects such as glaucoma, cataract formation, keratopathy, persistent tear eye, vitreous hemorrhages, among others. Therefore, the use of minimally invasive therapies with few adverse effects are of vital importance and it is known that the use of ozone therapy in ophthalmological diseases (macular degeneration, atrophy, retinal detachment), where a faster recovery of functions is observed, visual and decreased inflammatory processes. As observed in the clinical case we present, which after the diagnosis of retinal detachment and more than a year with multiple surgical treatments, it developed multiple adverse effects with considerable decrease in visual acuity and severe pain in the eye and skull. Where these persistent symptoms who lead him to a medical consultation at Wellness one in saline solution during the bubbling stage to establish the optimal saturation time and to study the degradation of ozone in it over time, thus defining the need for continued bubbling during reinfusion to the patient. The O3SS preparation process was simulated using a certified kit, working at the concentrations of 1 and 5 µg / NmL and the variation of the ozone concentrations in solution was determined using the spectrophotometric method. The optimum bubbling time for saturation was estimated to be 15 min and at this time 10% of the initial ozone concentration is reached in the solution. It was found that due to the accelerated degradation of O3 in saline solution, it is necessary to continue bubbling the ozone until 50 mL of saline solution remain in the container. As the western generators lacked ozone emissions in fractions of µg/NmL, it was estimated that the concentrations of 1, 2 and 5 µg/NmL at the generator outlet would be optimal for applying the low, medium and high doses required by the O3SS application according to the type of indication. .."], ["https://openalex.org/W3048633380", "COVID-19 Dermatological manifestations. Presentation of two cases", 2020, "article", 2, "Medical and Biological Ozone Research", "The coronavirus (COVID-19) is an emerging disease that was first reported in the city of Wuhan, China, last December 2020, which continues to spread throughout the world and has become an international public health alarm. COVID-19 was characterized as a \"pandemic\" by the World Health Organization (WHO) which has officially recognized that \"there are currently no specific vaccines or pharmaceutical treatments available for COVID-19\".1 The authors submit two cases of COVID-19 that debuted with skin lesions and that were treated in an adjuvant way; the first with rectal insufflations and the second with ozonized saline solution (O3SS). Ozone therapy was chosen as a complementary treatment, as it has an anti-inflammatory, antithrombotic and d in MC-465 (85.50) with 14.11 kg of production per 100 kg of compost. In the growth behavior, NBS-5 gave the highest body weight followed by the other strains. Maximum average body length and stripe was found in MC-465 strain of Agaricus bisporus."], ["https://openalex.org/W3099268659", "\"Too Strong for a Woman\": Title IX and Gender Equity in U.S. Schools", 2020, "article", 0, "Gender Diversity and Inequality", "No person in the United States shall, on the basis of sex, be excluded from participation in, be denied the benefits of, or be subjected to discrimination under any education program or activity receiving Federal financial assistance."], ["https://openalex.org/W3158588564", "A Study of Stylistic Features and Metal Composition of the Buddhist Sculpture from Inner Mongolia (Dolonnor)", 2020, "article", 1, "Geological Studies and Exploration", null], ["https://openalex.org/W3208825998", "Caracterización clínica y epidemiológica de pacientes con Infarto Agudo del Miocardio con elevación del segmento ST", 2020, "article", 0, "Business, Innovation, and Economy", "Artículo original publicado en la revista \"Rev Panorama. Cuba y Salud\" en 2020. Este trabajo describe las características clínicas y epidemiológicas de pacientes con Infarto Agudo del Miocardio con elevación del segmento ST (IAMCEST). El presente depósito tiene fines de preservación y difusión académica en acceso abierto."]], "total": 92}</script></div><script>
const root = document.currentScript.previousElementSibling;
const {cols, rows, total} = JSON.parse(root.querySelector('script[type="application/json"]').textContent);
const URL_RE = /(https?:\/\/[^\s<>"']+)/g, LONG = 300;
let page = 0, size = 25;
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const linkify = s => esc(s).replace(URL_RE, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
function cell(v) {
  if (v === null) return '<span class="na">null</span>';
  const nested = typeof v === 'object';
  const s = nested ? JSON.stringify(v) : String(v);
  const cls = nested ? ' class="nested"' : '';
  if (s.length <= LONG) return `<div${cls}>${linkify(s)}</div>`;
  return `<details${cls}><summary>${linkify(s.slice(0, LONG))}…</summary>${linkify(s)}</details>`;
}
function render() {
  const pages = Math.max(1, Math.ceil(rows.length / size));
  page = Math.min(page, pages - 1);
  const slice = rows.slice(page * size, page * size + size);
  root.querySelector('tbody').innerHTML = slice.map(r => '<tr>' + r.map(v => `<td>${cell(v)}</td>`).join('') + '</tr>').join('');
  const first = rows.length ? page * size + 1 : 0, last = page * size + slice.length;
  root.querySelector('.info').textContent =
    `rows ${first}–${last} of ${rows.length.toLocaleString()} loaded` + (total === null ? ' (total unknown)' : ` · ${total.toLocaleString()} in table`);
  root.querySelector('.pg').textContent = `page ${page + 1} / ${pages}`;
  root.querySelector('.prev').disabled = page === 0;
  root.querySelector('.next').disabled = page >= pages - 1;
  root.querySelector('.wrap').scrollTop = 0;
}
root.querySelector('thead tr').innerHTML = cols.map(([n, short, full]) =>
  `<th title="${esc(n + ': ' + full)}">${esc(n)}<div class="t">${esc(short)}</div></th>`).join('');
root.querySelector('.prev').onclick = () => { page--; render(); };
root.querySelector('.next').onclick = () => { page++; render(); };
root.querySelector('.size').onchange = e => { size = +e.target.value; page = 0; render(); };
render();
</script>
