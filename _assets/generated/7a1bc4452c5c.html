logy", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 5, 18, "https://openalex.org/W1782257103 | https://openalex.org/W1983408608 | https://openalex.org/W1990934857 | https://openalex.org/W1992461870 | https://openalex.org/W2016462749 | https://openalex.org/W2019467041 | https://openalex.org/W2043460359 | https://openalex.org/W2065741736 | https://openalex.org/W2068070292 | https://openalex.org/W2071133360 | https://openalex.org/W2074715434 | https://openalex.org/W2102340750 | https://openalex.org/W2153615155 | https://openalex.org/W2283399883 | https://openalex.org/W2324665193 | https://openalex.org/W2461246982 | https://openalex.org/W2593017926 | https://openalex.org/W2619845298", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2143387507", null, "https://www.cabdirect.org/cabdirect/abstract/20123130681", null, "EVALUATION OF FALSE YAM (Icacina oliviformis) LEAVES ON THE GROWTH PERFORMANCE OF WEANER RABBITS (Oryctolagus cuniculus)", "article", "en", "2012-01-01", 2012, "T. Ansah | A. A. Emelia | G. Deku | P. K. Karikari", "https://orcid.org/0000-0002-8945-285X | - | - | -", null, null, null, "Online Journal of Animal and Feed Research", null, "2228-7701", "2", "1", "76–79", "This study was conducted to determine the effect of Icacina oliviformis leaf meal (IOLM) on the growth performance of weaner rabbits. Twenty-one (21) weaner rabbits with an average initial weight of 661g were used in a completely randomized design. The feeding trial lasted for 56 days at the livestock unit of the University for Development studies. The chemical analysis was carried out at the Spanish Laboratory of the University for Development studies. The variables measured were feed intake, apparent nutrient digestibility and body weight gain. The average daily feed intake showed a significantly (P 0.05) between T0 (17.65g) and T1 (13.33g).There was a significantly (P<0.05) higher crude protein digestibility for T0 (84.68%) compared to T1 (80.99%) and T2 (67.08%). Apparent digestibility for CP and EE decreased with increase in the level of IOL in the diet. Based on the results of this study, IOL can be used as a feed ingredient in the diet of rabbits at 5% without any detrimental effects.", "Completely randomized design | Meal | Ingredient | Animal science | Biology | Body weight | Nutrient | Soybean meal | Livestock | Feed conversion ratio | Food science | Ecology | Endocrinology", "Rabbits: Nutrition, Reproduction, Health", "Animal Science and Zoology", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 5, 6, "https://openalex.org/W1964194595 | https://openalex.org/W1976827155 | https://openalex.org/W2041971233 | https://openalex.org/W2053411711 | https://openalex.org/W2129681159 | https://openalex.org/W2183080544", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W1539845741", null, "http://cyberleninka.ru/article/n/an-analysis-of-smallholder-farmers-socio-economic-determinants-for-inputs-use-a-case-of-major-rice-producing-regions-in-tanzania", null, "An Analysis of Smallholder Farmers’ Socio-economic Determinants for Inputs Use: A Case of Major Rice Producing Regions in Tanzania", "article", "en", "2015-01-01", 2015, "Nobeji S. Boniphace | Fengying Nie | Cheng Fang", "- | - | https://orcid.org/0000-0001-9240-8756", null, "Sohu (China)", "CN", "RePEc: Research Papers in Economics", "Federal Reserve Bank of St. Louis", null, "5", "4", "11–24", "This study analyzed smallholder farmers’ socio-economic determinants for inputs use in major rice producing regions in Tanzania. A sample for the study comprised of 842 rice farming households from five major paddy (rice) producing regions of Mbeya, Morogoro, Shinyanga, Mwanza and Tabora. These sample households were drawn from FAO database extracted from the Tanzania National Panel Survey (2010-2011). Household socioeconomic and farm production information were extracted from the database. Descriptive analyses were used to summarize the collected information. Probit model was used to assess determinants of input use among the farming households. The study found that the probability of using agricultural inputs increase with education level, quantity of crops produced, livestock, farm income while it decrease with total number of livestock and nonfarm income owned by a household. The study also found difference in input use preferences among regions; in Mbeya more use in maize while in Shinyanga more input use in rice. Based on these findings, our study concluded that in order to raise the use of agricultural fertilizer among smallholder farmers, policy makers and development agencies should put more efforts on developing and implementing sustainable strategies such as improving market infrastructure that lead to improved access to input and output markets thereby improving farmers’ incomes. Price policies are also important to increase and stabilize farmers’ incomes and incentivize use of and investment in improved agricultural technologies such as improved agricultural inputs, seeds and post-harvest management techniques.", "Tanzania | Nonfarm payrolls | Agriculture | Productivity | Agricultural economics | Business | Livestock | Descriptive statistics | Agricultural science | Production (economics) | Probit model | Household income | Multistage sampling | Farm income | Sample (material) | Rice farming | Economics | Socioeconomics | Economic growth | Geography", "Agricultural Innovations and Practices", "General Agricultural and Biological Sciences", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 5, 16, "https://openalex.org/W4826593 | https://openalex.org/W1507976894 | https://openalex.org/W1555164342 | https://openalex.org/W2110686487 | https://openalex.org/W2125120589 | https://openalex.org/W2125266151 | https://openalex.org/W2127848341 | https://openalex.org/W2139493976 | https://openalex.org/W2183328869 | https://openalex.org/W2183488258 | https://openalex.org/W2230648308 | https://openalex.org/W2257232008 | https://openalex.org/W2290413338 | https://openalex.org/W2317711935 | https://openalex.org/W2917418004 | https://openalex.org/W3123066589", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2187820551", null, "https://www.sid.ir/en/VEWSSID/J_pdf/1013520132008.pdf", null, "Toxicological Investigation of Acute Cyanide Poisoning of a 29-year-old Man: A Case Report", "article", "en", "2013-04-15", 2013, "Nnoli Martin Anazodo | Legbosi Nwidu Lucky | Nwafor Paul Alozie | Chukwuonye Ijezie Innocent", "- | - | - | -", null, "University of Calabar | Niger Delta University | University of Uyo | Federal Medical Centre", "NG", "Iranian Journal of Toxicology", "Arak University of Medical Sciences", "2008-2967", "7", "20", "831–835", "Background: Cyanide poisoning is frequently lethal, Because of the early onset of severe symptoms and difficulty in the diagnosis. Case: The case was a 29-year-old boy who collapsed suddenly after taking a bottle of beer in a bar. Samples, such as peripheral blood, stomach contents, bile fluid, urine and mouth swabs, were prepared using standard autopsy procedure and were subjected to analysis for cyanide using visible spectrophotometric method. The cyanide contents in samples, included stomach content (260 ppm), bile fluid (272 ppm), blood (256 ppm), and mouth swab (265 ppm). Conclusion: The cause of death was acute myocardial infarction following acute poisoning from ingestion of cyanide salts. Its lethality was related to the rapid onset of toxicity, non-specific nature of the symptoms, and failure to consider the diagnosis. Regarding the absence of pathognomonic symptoms for its toxicity, delay in acquiring a full history and unexplained sudden collapse or acidosis which worsen the prognosis, cyanide intoxication needs to be expeditiously diagnosed and managed.", "Medicine | Cyanide | Gastric lavage | Pathognomonic ) to study the effects of irrigation intervals on the yield of garlic (Allium sativum L.). Treatments consisted of four irrigation intervals (2, 4, 6 and 8 day) laid out in a randomized complete block design (RCBD) replicated three times. The results obtained indicated that 4 – day irrigation interval had significant and positive effect on yield parameter over other treatments. Maximum yield of 4,110.2 kg/ha was recorded from the 4 day irrigation interval while, 1,835.4 kg/ha was recorded from the 8 – day irrigation interval. Keywords : Irrigation, yield, interval, garlic", "Irrigation | Allium sativum | Yield (engineering) | Randomized block design | Mathematics | Horticulture | Agronomy | Biology | Physics", "Irrigation Practices and Water Management", "Soil Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 4, 1, "https://openalex.org/W1968891281", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2383200946", null, "https://en.cnki.com.cn/Article_en/CJFDTOTAL-KCXB200701008.htm", null, "The bracing and fusing pattern of longitudinal veins at base in living mayflies (Insecta:Ephemeroptera)", "article", "en", "2007-01-01", 2007, "Zhou Chang", "-", "Zhou Chang", null, null, "Acta Entomologica Sinica", null, null, "50", null, null, "The bracing and merging pattern of basal longitudinal veins plays an important role in phylogeny reconstruction within Pterygota. Unfortunately , the basal venation pattern of living mayflies has changed from the ancestral state in most species , but in very rare cases , the origins of some longitudinal vein bases are preserved and visible. The wing base of Siphluriscus chinensis has an independent subcostal brace , partial stem of the media , visible stem of the cubitus , and indications of the origins of MA and Rs. This kind of wing base plus those of Ephemera rufomaculata and Chromarcys magnifica show the venation groundplan of modern Ephemeroptera ( stem of M parallel to or fused with R basally , MA and Rs fused together for certain distance then separate , Cu independent at base) . This pattern seems close to that of Neoptera while different from Odonata. In the latter , the M fused with Cu basally. The hypothesized function of subcostal brace in mayflies is to strengthen the connection between distantly separated longitudinal veins because of sclerite plate at radius vein base. This hypothesis also can be used to explain complicated and unique venation of dragonfly.", "Biology | Dragonfly | Odonata | Anatomy | Brace | Zoology", "Fossil Insects in Amber", "Ecology, Evolution, Behavior and Systematics", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 4, 25, "https://openalex.org/W600658241 | https://openalex.org/W1568848658 | https://openalex.org/W1589772063 | https://openalex.org/W1601124345 | https://openalex.org/W1979578128 | https://openalex.org/W1989010260 | https://openalex.org/W1996482493 | https://openalex.org/W2013412364 | https://openalex.org/W2016186775 | https://openalex.org/W2018371805 | https://openalex.org/W2117026260 | https://openalex.org/W2130417890 | https://openalex.org/W2133310399 | https://openalex.org/W2135532468 | https://openalex.org/W2148108676 | https://openalex.org/W2148185408 | https://openalex.org/W2174321470 | https://openalex.org/W2180940137 | https://openalex.org/W2232078623 | https://openalex.org/W2580228761 | https://openalex.org/W2797434816 | https://openalex.org/W2807846841 | https://openalex.org/W2952047879 | https://openalex.org/W3138770454 | https://openalex.org/W4285719527", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W3048257848", null, "https://europepmc.org/article/AGR/IND23256560", null, "Using a moving average to determine cotton futures market entry dates", "article", "en", "2001-01-01", 2001, "Bennett Bk", "-", "Bennett Bk", null, null, "The journal of cotton science/Journal of cotton science", null, "1523-6919", R. Melanin is a virulence factor. The disease index was higher by DR than HR. DR exhibited less protein content, but more diverse proteins than HR. DNA similarity between DR and HR was about 90%. Superoxide dismutase (SOD) was detected in a higher amount in DR than HR. Catalase could not be detected in either DR or HR. EDTA is promising potential drugs for combating pathogenicity.\r\n\t\r\n\tKey words: Rhizoctonia, superoxide dismutase, pathogenicity, melanin, DNA, EDTA.", "Rhizoctonia solani | Rhizoctonia | Superoxide dismutase | Catalase | Microbiology | Biology | Melanin | Fungus | Hypha | Botany | Biochemistry | Antioxidant", "Plant Disease Resistance and Genetics", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", null, null, null, 4, 29, "https://openalex.org/W331982560 | https://openalex.org/W1522543047 | https://openalex.org/W1652490970 | https://openalex.org/W1906677963 | https://openalex.org/W1922228235 | https://openalex.org/W1964493273 | https://openalex.org/W1976363596 | https://openalex.org/W1986181784 | https://openalex.org/W1995842182 | https://openalex.org/W1997192189 | https://openalex.org/W1997232317 | https://openalex.org/W2004614046 | https://openalex.org/W2007824561 | https://openalex.org/W2013124929 | https://openalex.org/W2017858226 | https://openalex.org/W2028078808 | https://openalex.org/W2040224415 | https://openalex.org/W2042260371 | https://openalex.org/W2046542041 | https://openalex.org/W2066000196 | https://openalex.org/W2078137151 | https://openalex.org/W2084851681 | https://openalex.org/W2093299036 | https://openalex.org/W2128635872 | https://openalex.org/W2134409371 | https://openalex.org/W2139275586 | https://openalex.org/W2161863335 | https://openalex.org/W2467416753 | https://openalex.org/W3010875164", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W1502829613", null, "https://www.ajol.info/index.php/njb/article/download/104500/94571", null, "Field investigation of Foot and Mouth Disease (FMD) virus infection in cattle in the northern states of Nigeria.", "article", "en", "2012-01-01", 2012, "AA Chukwuedo | Lohya Nimzing", "- | -", null, null, null, "Nigerian Journal of Biotechnology", "African Journals OnLine", "0189-1731", "24", null, null, "The prevalence of FMD virus serotypes SAT 1 and SAT 2 among Nigerian cattle was determined using Complement Fixation (CF) and Serum Neutralization (SN) Tests in 2000 cattle sera obtained from nine northern states. The disease prevalence by CF and SN were 46.79% and 53.15% respectively. These figures were lower than that obtained in 1987 (55%). Plateau and Bauchi States maintained the highest positive cases with SAT 1 virus serotype using CF test (44.8% and 43.6%) and with SN test, 51.2% and 46.8% respectively. For SAT 2 virus, Borno and Adamawa States had the highest prevalence with CF, 41.00% and 30.50% and with SN maintained the highest prevalence; 46.50% and 29.50% respectively. The two serological tests were very specific and sensitive enough to detect and quantify the antibody levels in the infected animals. These results were very significant since these animals were not vaccinated against FMD. It showed evidence of FMD virus SAT 1 and SAT 2 serological types circulation in the country and may be responsible for set backs and the low output in the livestock sector in Nigeria. Further studies on other FMD virus serotypes in other states are suggested. Other details of the findings have been discussed. Keywords: Foot and Mouth Disease, Virus, Antibodies, Prevalence Nig J. Biotech . Vol. 24 (2012) 20-26", "Serology | Serotype | Foot-and-mouth disease | Veterinary medicine | Complement fixation test | Virus | Virology | Livestock | Foot-and-mouth disease virus | Medicine | Antibody | Biology | Immunology", "Animal Disease Management and Epidemiology", "Agronomy and Crop Science", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", null, null, null, 4, 9, "https://op  | Food science | Biology | Botany | Agronomy | Chemistry | Biochemistry", "Sunflower and Safflower Cultivation", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 4, 14, "https://openalex.org/W227406644 | https://openalex.org/W245111708 | https://openalex.org/W287398583 | https://openalex.org/W316823044 | https://openalex.org/W1497078999 | https://openalex.org/W1500673266 | https://openalex.org/W1576676571 | https://openalex.org/W1591315314 | https://openalex.org/W1605350634 | https://openalex.org/W2137184816 | https://openalex.org/W2153398258 | https://openalex.org/W2552506750 | https://openalex.org/W2612331769 | https://openalex.org/W2922700496", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2120489112", null, "http://www.cropj.com/ozbek_8_2014_543_549.pdf", null, "Morphological, anatomical, pollen and seed morphological properties of 'Melilotus bicolor' Boiss. and Balansa (Fabaceae) endemic to Turkey", "article", "en", "2014-04-01", 2014, "Funda Özbek | Mehmet Ufuk Özbek | Murat Ekici", "https://orcid.org/0000-0002-0135-0155 | https://orcid.org/0000-0002-2342-4143 | https://orcid.org/0000-0002-3402-177X", null, null, null, "Australian Journal of Crop Science", "Southern Cross Publishing", "1835-2693", "8", "4", "543–549", "The genus Melilotus L. has a worldwide distribution and usually grows in the calcareous soil regions of the world. It is important for its use in folk medicine, as a forage crop and for green manure. The morphology, anatomy, pollen and seed morphology of Melilotus bicolor Boiss. and Balansa, which is an endemic species in Turkey, were studied. An expanded and amended description of the species collected from Beypazari to Kibriscik in Ankara is given. Anatomical studies were carried out on transverse sections of the roots, stems, leaves and the surface sections of the leaves. The pith of the root is completely covered by xylem cells. The stems have a chlorenchymatous cortex with many chloroplasts. The leaves are dorsiventral and amphistomatic. The layers of the mesophyll are various. Stomata are anomocytic. The pollen grains are generally trizonocolporate, radially symmetrical, isopolar and subprolate. Sculpturing is usually microreticulate or, rarely, rugulate in the meridional optical section, and microreticulate in the polar optical section. The seeds are globose to obovoid in shape, with tuberculate-rugose ornamentation.", "Biology | Botany | Raceme | Pollen | Melilotus | Xylem | Fabaceae | Plant anatomy | Achene | Plant morphology | Inflorescence", "Plant Ecology and Taxonomy Studies", "Ecology, Evolution, Behavior and Systematics", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 4, 40, "https://openalex.org/W566067921 | https://openalex.org/W640788734 | https://openalex.org/W646234549 | https://openalex.org/W1479248782 | https://openalex.org/W1529096445 | https://openalex.org/W1547167699 | https://openalex.org/W1966882685 | https://openalex.org/W1967871947 | https://openalex.org/W1969402898 | https://openalex.org/W1982764358 | https://openalex.org/W1985753190 | https://openalex.org/W1989202332 | https://openalex.org/W2005610946 | https://openalex.org/W2012682840 | https://openalex.org/W2023847064 | https://openalex.org/W2024208015 | https://openalex.org/W2052083256 | https://openalex.org/W2058021322 | https://openalex.org/W2059692475 | https://openalex.org/W2074095659 | https://openalex.org/W2087810566 | https://openalex.org/W2089106581 | https://openalex.org/W2091007336 | https://openalex.org/W2093686016 | https://openalex.org/W2106668850 | https://openalex.org/W2116634903 | https://openalex.org/W2141434345 | https://openalex.org/W2147422985 | https://openalex.org/W2153358785 | https://openalex.org/W2159496478 | https://openalex.org/W2170840671 | https://openalex.org/W2171794603 | https://openalex.org/W2287445547 | https://openalex.org/W2382776393 | https://openalex.org al growth rate K r (8m h -1 ) determined by linear regression analysis was fastest for isolate 9-91M (K r = 68.89 8m h -1 ) at 25 0 C. Lowest LC 50 (1.46 x 10 3 spores ml -1 ) for B. tabaci was for isolate 9-91M at 20 0 C while the lowest LT 50 (0.9991 days) was recorded for isolate 11-91P at 25 0 C. Isolates 11-91P and 9-91M performed the best and we conclude that these isolates have good potential for the management of B. tabaci in the field.", "Paecilomyces | Biology | Metarhizium anisopliae | Germination | Homoptera | Whitefly | Horticulture | Metarhizium | Virulence | Botany | Spore | Spore germination | Biological pest control | PEST analysis", "Entomopathogenic Microorganisms in Pest Control", "Insect Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 4, 18, "https://openalex.org/W180029320 | https://openalex.org/W1599566904 | https://openalex.org/W1629783211 | https://openalex.org/W1989944512 | https://openalex.org/W2006672991 | https://openalex.org/W2008217479 | https://openalex.org/W2019430615 | https://openalex.org/W2030001550 | https://openalex.org/W2031223402 | https://openalex.org/W2065800342 | https://openalex.org/W2094441441 | https://openalex.org/W2109329939 | https://openalex.org/W2123036062 | https://openalex.org/W2124822170 | https://openalex.org/W2153223189 | https://openalex.org/W2160426049 | https://openalex.org/W2179541228 | https://openalex.org/W2274226057", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W1819006630", null, "http://journal.unair.ac.id/filerPDF/03%20Hendrawati%20-%20GlinkaE.pdf", null, "Age at Menarche in Indonesia", "article", "en", "2003-01-01", 2003, "LD Hendrawati | Josef Glinka Svd", "- | -", null, null, null, "Folia Medica Indonesiana", "Airlangga University", "2355-8393", "39", "1", null, "Since 1937 data on age at menarche are gathered in Indonesia. An overview of the whole literature and unpublished thesis until 1996 is presented in this paper. The data originate from Java, some other also from Sulawesi, Sumatra and, recently, from Flores. The general mean values in a diachronic sequence demonstrate a trend of decrease in menarcheal age of 0.145 year per decade. This means that in general the wealth and health conditions in Indonesia improved in the last six decades. Statistically significant differences in menarcheal age between girls from different socio-economic class’ and the father s occupation, like traders (14.13), teachers (14.48) and farmers (14.63); rich (13.90), medium situated (14.60) and poor (14.88); between girls from different environmental conditions like urban (12.27), fisherman village (12.85), farmer village (13.19). The role of animal protein intake as the most influential factor where the differences in menarcheal age between girls who eat meat e.g. 13 times (11.64) and those eating only 1-4 times a week (13.46). The mother s education constitutes an indirect influencing factor because better-educated mothers have knowledge required to give their children more suitable food. The menarcheal age is 12.19 from mothers with university, 12.88 with highschool and 12.93 with low education. These data confirm the assertion that age at menarche constitutes a sensitive indicator of the wealth and health of a population (Bielicki & Welon 1982; Brasel 1978).", "Menarche | Population | Demography | Geography | Socioeconomics | Sociology", "Livestock Farming and Management", "Agronomy and Crop Science", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", null, null, null, 4, 1, "https://openalex.org/W2184890939", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W1788174395", "https://doi.org/10.5146/ijds.v68i3.44070.g21255", "http://epubs.icar.org.in/ejournal/index.php/IJDS/article/download/44070/pdf_100", null, "Barley-Pearl Millet-Milk based Mineral Fortified Complementary Food: Moisture Adsorption Isotherms", "article", "en", "2014-12-31", 2014, "C. T. Manoj Kumar | Narender Raju Panjagari | Ashish Kumar Singh", "https://orcid.org/0000-0003-1981-228X | https://orcid.org/0000-0002-9645-6920 | https://orcid.org/0000-0003-3534-9010", null, "National Dairy Research Institute", "IN", "Indian Journal of Dairy Science", "Indian Dairy Association", "0019-5146", "68", "3", null, "The equilibrium moisture contents (EMC) of barley-pearl millet-milk based complementary food were determined using the static gravimetric method at 28, 37 and 45°C in the water activity (a w ) range of 0.11-0.92. The adsorption isotherms obtained were of sigmoid shape resembles type II curve in BET classification. EMC at a given (a w ) decreased as the temperature increased and inversion point was obtained at 37°C at higher water activity. BET and GAB models described the EMC/a w relationship well by giving a closest fit to the experimental sorption data. The suitability of the models was determined by multiple statistical criterion viz. the coefficient of determination (R 2 ), mean relative per cent deviation modulus (P), Root Mean Square Deviation error (RMS %) and Chi-square (χ 2 ). The monolayer moisture content obtained by BET and GAB models are almost similar.", "Gravimetric analysis | Moisture | Coefficient of determination | Adsorption | Mathematics | Relative standard deviation | Mean squared error | Chemistry | Root mean square | Analytical Chemistry (journal) | Mineralogy | Chromatography | Detection limit | Statistics | Physics", "Food Drying and Modeling", "Food Science", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", null, null, null, 4, 14, "https://openalex.org/W1581578101 | https://openalex.org/W1969536720 | https://openalex.org/W1977416933 | https://openalex.org/W1983354274 | https://openalex.org/W1998873513 | https://openalex.org/W2032097899 | https://openalex.org/W2052961441 | https://openalex.org/W2066929456 | https://openalex.org/W2078856187 | https://openalex.org/W2155388700 | https://openalex.org/W2162265526 | https://openalex.org/W2299701668 | https://openalex.org/W2589948846 | https://openalex.org/W2624775889", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W1865420514", "https://doi.org/10.5897/ajb12.25700", "https://academicjournals.org/journal/AJB/article-full-text-pdf/F962DC551527", null, "Effects of submerged and anaerobic fermentations on cassava flour (Lafun)", "article", "en", "2015-03-18", 2015, "AM Ogunnaike | P. A. Adepoju | A. O. Longe | GN Elemo | O.L. Oke", "- | - | - | - | -", null, null, null, "AFRICAN JOURNAL OF BIOTECHNOLOGY", "Academic Journals", "1684-5315", "14", "11", "961–970", "Cassava tubers for processing into cassava flour, Lafun a Nigerian locally fermented product was subjected to two different types of fermentations: submerged and anaerobic fermentation for 72 h. Physicochemical changes that occurred during fermentation and their influence on the functional, rheological and sensory properties of the resulting flour were investigated. There was no significant difference in rate of decrease of pH and hydrocyanide under both fermentation conditions but titratable acidity differed significantly (p<0.05). Crude fibre, crude protein, ash, swelling index and final viscosity were significantly higher (p<0.05) in flour from submerged fermentation. Lafun from submerged fermentation had greater sensory quality and higher consumer preference than that of anaerobic fermentation. Key words: Cassava fermentation, physicochemical, functional, pasting properties.", "Fermentation | Food science | Titratable acid | Chemistry | Anaerobic exercise | Biology", "Cassava research and cyanide", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", null, null, null, 4, 23, "https://openalex.org/W330008111 | https://openalex.org/W1595358095 | https://openalex.org/W1697461775 | https://openalex.org/W1968387798 | https://openalex.org/W1999076022 | https://openalex.org/W2012178305 | https://openalex.org/W requencies (%) of all these weeds were calculated to quantify their importance values in descending order of their percentages as following: Poa annua L. (54.75%), Anagallis arvensis L. (49.23%), Euphorbia helioscopia L. (22.92%), Ammi visnaga (L.) Lam. (22.88%), Fumaria indica L. (12.86%), Coronopus didymus L. (11.4%), Avena fatua L. (10.11%), Rumex crispus L. (5.95%), Melilotus parviflora L. (5.50%), Cirsium arvense (L.) Scop. (2.43%), Plantago lanceolata L. (0.88%), Lathyrus aphaca L. (0.73%), Ranunculus sp. (0.73%), and Sonchus sp. (0.67%). The higher the importance value of a weed, the greater is its competitiveness.", "Biology | Cirsium arvense | Rumex | Weed | Avena fatua | Agronomy | Galium | Botany | Cynodon dactylon | Allelopathy", "Weed Control and Herbicide Applications", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 4, 4, "https://openalex.org/W2095356267 | https://openalex.org/W2142043381 | https://openalex.org/W2147891474 | https://openalex.org/W2555394493", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W1539675133", "https://doi.org/10.62550/ku3342", "https://doi.org/10.62550/ku3342", null, "Tillage and N Impact on Wheat Production and N Efficiency under Rice-Wheat Cropping System in Northwestern Pakistan", "article", "en", "2012-03-01", 2012, "Khalid Usman | S. K. Khalil | Said Ghulam", "https://orcid.org/0000-0003-1092-2001 | - | -", null, "Gomal University | The University of Agriculture, Peshawar", "PK", "The Philippine Agricultural Scientist", null, "0031-7454", "95", "1", "33–42", "We examined the effect of tillage (T) systems [zero (ZT), reduced (RT) and conventional tillage (CT)] and N rates (0, 80, 120, 160 and 200 kg ha-1) on wheat yield and N efficiency in northwestern Pakistan. Tillage systems produced similar grain yield and N efficiency indices (NEI) except nitrogen harvest index (NHI). Grain yield increased with increase in N, while grain to straw N rat edtilapia pondwith complete diet(T4)was the best treatment whichsignificantlyreduced allM. incognita criteria(no. of galls, embedded stages, egg masses, build up and e ggs/eggmass)on cowpea strains 1, 2 & 4. Biofloc tanks(T5)was significantlyefficient on cowpea strain 3", "Biology | Effluent | Tilapia | Aquaculture | Greenhouse | Infectivity | Nematode | Meloidogyne incognita | Agronomy | Sorghum | Veterinary medicine | Biotechnology | Fish <Actinopterygii> | Horticulture | Fishery | Ecology", "Aquaculture Nutrition and Growth", "Aquatic Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 3, 18, "https://openalex.org/W111158554 | https://openalex.org/W1501312820 | https://openalex.org/W1575846650 | https://openalex.org/W1706617644 | https://openalex.org/W1987032533 | https://openalex.org/W1999583688 | https://openalex.org/W2034311019 | https://openalex.org/W2040052095 | https://openalex.org/W2059543080 | https://openalex.org/W2061772251 | https://openalex.org/W2070924584 | https://openalex.org/W2109994068 | https://openalex.org/W2270475089 | https://openalex.org/W2292264492 | https://openalex.org/W2298230951 | https://openalex.org/W2315669930 | https://openalex.org/W2322797148 | https://openalex.org/W2340294496", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2153179361", "https://doi.org/10.5897/ajar12.2199", "https://www.academicjournals.org/article/article1380886359_Flora and Rani.pdf", null, "Effect of Stoechospermum marginatum (Ag). Kutz extract on controlling blast disease in rice caused by Pyricularia oryzae under natural field condition", "article", "en", "2013-07-04", 2013, "G. Jennifer Flora | S. Maria Victorial Rani", "- | -", null, null, null, "African Journal of Agricultural Research", "Academic Journals", "1991-637X", "8", "25", "3289–3293", "Foliar application of aqueous concentrate of Stoechospermum marginatum in reducing the severity of fungal blast of rice caused by Pyricularia oryzae was investigated. The results indicated that, the seaweed concentrate significantly reduced the severity of the disease. Present study also revealed that, the peroxidase activity, phenylalanine ammonia-lyase activity and catalase activity were 184, 197, and 192% higher than the control (without any application) respectively. Seaweed concentrate enhanced sugar, amino acid, ascorbic acid, protein, phenol, flavonoid, and tannin content in 60th day by 123, 150, 110, 162, 145, 120, and 178%, respectively in comparison with control where as these were decreased in 90th day of assay. All the parameters were also analysed with foliar application of Bavistin, a common fungicide considered as reference control and the results were compared and discussed.\r\n\r\n\t \r\n\r\n\tKey words: Foliar application, fungal blast of rice, bavistin.", "Pyricularia | Ascorbic acid | Fungicide | Tannin | Flavonoid | Phenylalanine ammonia-lyase | Biology | Catalase | Blast disease | Horticulture | Reducing sugar | Sugar | Peroxidase | Chemistry | Botany | Food science | Antioxidant | Enzyme | Biochemistry", "Plant Growth Enhancement Techniques", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", null, null, null, 3, 12, "https://openalex.org/W1968181888 | https://openalex.org/W2004506379 | https://openalex.org/W2044526595 | https://openalex.org/W2055180687 | https://openalex.org/W2056731583 | https://openalex.org/W2059670662 | https://openalex.org/W2116731237 | https://openalex.org/W2120815882 | https://openalex.org/W2165837812 | https://openalex.org/W2170217346 | https://openalex.org/W2255223368 | https://openalex.org/W3142735663", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2970903184", null, "https://dergipark.org.tr/en/pub/jieas/article/598049", null, "A Research On Awareness of Zoos: Landscape Architecture Students", "article", "en", "2019-06-30", 2019, "İpek Altuğ Turan | Emine Malkoç True", "https://orcid.org/0000-0003-3246-0338 | https://orcid.org/0000-0003-1235-1978", null, null, null, "DergiPark (Istanbul University)", "Istanbul University", null, "14", "2", "59–69", "Nowadays, many environmental organisations are trying to attract attention to the awareness against questioning the goals of zoos. Despite educating, the public about conservation there has been much discussion on how efficient zoos are at doing this. In this context, the main aim of this study is to measure the landscape architecture students’ knowledge about conservation and zoos; to query the main role of the zoos and to increase the awareness of the landscape architecture students on zoos who have many lectures on environmental issues during their educational period. The main the material of the research is the students who are educating at Ege University Agriculture Faculty Landscape Architecture Department. The University is located in Bornova, which is a metropolitan district of Izmir. The study was considered in four main sections, namely, conceptual framework, data collection, findings, discussion and conclusion. After an initial search of the literature, a questionnaire form was prepared. To compare the awareness level, the questionnaire was conducted to 1 st , 2 nd , 3 th  and 4 th  year students of Landscape Architecture of Ege University Agriculture Faculty where the period of undergraduate study is four years. “Simple Random Sampling Method” was used in the determination of the number of the students on which questionnaire would be conducted, 95 % confidence level and 0.10 sampling error was taken as a basis in the calculations. In the calculation, according to the total number of students which is 391 that the sum of 21 first grade, 18 the second grade, 20 third grade and 26 fourth grade students were used as “Population Size (N)” and the number of students on which the questionnaire would be conducted was determined as 85 at the end. It was aimed at learning each level of the students’ opinions and awareness of the subject using these questions. The literature studies on the subject and the information found from the questionnaires were analysed and it was evaluated whether the education of four years on environmental issues has changed the opinions/awareness and the approach of the students to zoos. The approaches of the social and landscape architecture students towards zoos were examined together and the necessity of zoos were questioned. Finally, recommendations to increase the awareness towards zoos were made.", "Metropolitan area | Context (archaeology) | Architecture | Simple random sample | Environmental education | Landscape architecture | Data collection | Psychology | Geography | Medical education | Pedagogy | Sociology | Engineering | Social science | Civil engineering | Archaeology | Population | Medicine", "Agricultural and Rural Development Research", "Forestry", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 3, 3, "https://openalex.org/W623350659 | https://openalex.org/W624963065 | https://openalex.org/W2954897517", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2402077743", null, "https://www.cabdirect.org/abstracts/20113075274.html", null, "Maize local landraces used like prebreeding material for simultaneous improvement of main agronomic traits.", "article", "en", "2010-01-01", 2010, "M. Murariu | Danela Murariu | V. Haş", "- | https://orcid.org/0000-0002-0431-1557 | -", null, null, null, "Lucrări Ştiinţifice, Universitatea de Stiinte Agricole Şi Medicină Veterinară \"Ion Ionescu de la Brad\" Iaşi, Seria Agronomie", null, null, "53", "2", "42–47", "In the maize breeding programs the local maize landraces shows a particular interest, especially as useful sources for adapting capacities, physiological, agronomic and valuable quality traits. A morpho-physiological evaluation of main germplasm genepool represented by 200 local maize landraces was achieved through a CEEX Project (2006-2008). Characterization of maize local populations was done in an appropriate experimental system based on morpho-physiological descriptors edited by the International Institute of International Plant Genetic Resources (BIOVERSITY) located in Rome (www.bioversityinternational.org). (www.bioversityinternational.org). Evaluation of maize genetic resources is found in the online database http// www. scdasuceava. ro/ biomaize which includes information concerning the value of biological material with useful genes for breeding programs. It was noticed some maize local landraces which can be used like initial genetic material for breeding of main traits (precocity, resistance to low temperatures, elements of productivity and resistance to root and stalk lodging , diseases ) such as: Rodna16, Botiza12, Ivaneasa1, Solca3, Vama7, Gersa11, Tiha Bargaului 8 Moisei 5, Valea Mare 2, Bucerdea, Putna 3 Pojorâta, Brodina 1. Of a particular interest are local populations valuable like rebreeding material for simultaneous improving of some important agronomic traits: Rodna 16 for cold resistance and disease resistance Botiza 12 for low temperatures resistance, resistance to root and stalk lodging, small percentage of sterile plants Moisei 5 and Valea Mare 2 for productivity, low temperature resistance, precocity, resistance to diseases and others locale landraces that may be selected from the mentioned database.", "Germplasm | Biology | Genetic resources | Resistance (ecology) | Agronomy | Plant breeding | Plant disease resistance | Productivity | Biotechnology | Gene", "Genetics and Plant Breeding", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 3, 1, "https://openalex.org/W1493488198", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W1860310346", null, "https://www.cabdirect.org/cabdirect/abstract/20013117184", null, "Lentil germplasm evaluation for resistance against ascochyta blight caused by Ascochyta lentis", "article", "en", "2000-01-01", 2000, "Shaukat Hussain | Muhammad Nasir | T. W. Bretag", "- | https://orcid.org/0000-0002-8379-7785 | -", null, null, null, "Pakistan Journal of Agricultural Research", "Pakistan Agricultural Research Council", "0251-0480", "16", "2", "118–121", null, "Ascochyta | Blight | Germplasm | Resistance (ecology) | Biology | Agronomy", "Agricultural pest management studies", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 3, 9, "https://openalex.org/W165100377 | https://openalex.org/W255412193 | https://openalex.org/W265644234 | https://openalex.org/W315914117 | https://openalex.org/W1476076353 | https://openalex.org/W1999372310 | https://openalex.org/W2033269435 | https://openalex.org/W2121721924 | https://openalex.org/W2124244380", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2580664793", null, "https://www.rroij.com/open-access/assam-silk-sericulture-.pdf", null, "Assam Silk: Sericulture", "article", "en", "2016-12-05", 2016, "Satarupa Gogoi", "-", "Satarupa Gogoi", null, null, "Research and reviews: journal of agriculture and allied sciences", null, "2319-9857", "5", "2", "50–54", "Sericulture, also known as silk farming where the silkworms are reared to produce silk. There are varieties of silk produced all over the world. Different types of silk such as mulberry silk, non-mulberry silk, anaphe, fagara, coan, mussel, spider etc. silks. One of the rarest silk producer is- Assam that introduces three natural wild silks- golden muga, white pat and warm eri silk. This article throws an insight into the cultivation of silkworm and creation of the beautifully refined silk. It is not only considered as a tradition but also a living culture of Assam. Many cottage and small scale textile industries engages in such farm-based, labour intensive commercial economic activity providing employment to the rural farmers and attracts profit seeking entrepreneurs as it requires low investment with relatively higher returns.", "Sericulture | SILK | Bombyx mori | Engineering | Biotechnology | Biology", "Silkworms and Sericulture Research", "Insect Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 3, 20, "https://openalex.org/W1825582647 | https://openalex.org/W1971676687 | https://openalex.org/W2124492142 | https://openalex.org/W2135579415 | https://openalex.org/W2313008460 | https://openalex.org/W2318651542 | https://openalex.org/W2322571487 | https://openalex.org/W2330955449 | https://openalex.org/W2335281859 | https://openalex.org/W2496047212 | https://openalex.org/W2510406290 | https://openalex.org/W2510761844 | https://openalex.org/W2519198145 | https://openalex.org/W2519887379 | https://openalex.org/W2523205741 | https://openalex.org/W2528135575 | https://openalex.org/W2530737576 | https://openalex.org/W2530854175 | https://openalex.org/W2536845284 | https://openalex.org/W2550371117", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W3110640857", null, "http://www.sjournals.com/index.php/aa/article/view/646", null, "Weaning age/time based model influencing performance in goats and sheep meat production", "article", "en", "2020-05-20", 2020, "Never Assan", "https://orcid.org/0000-0003-3405-8131", "Never Assan", "Zimbabwe Open University", "ZW", "Agricultural Advances", null, "2251-7820", "9", "5", "537–544", "Weaning is an essential animal husbandry intervention which has been associated with nutritional stress that interferes with both animal’s behavioral and physiological responses consequently influencing post weaning growth performance in goats and sheep production. The timing of weaning and/or weaning age of kids/lambs becomes critical in determination of flock performance with the intention of maximizing meat productivity and improving profitability. There are two possibilities that exist in deciding on weaning age of kids/lambs, thus early and late weaning, however, the decision on when to wean is dependent mainly on the production environment and purpose, as well as the dam welfare.   Age at weaning differ greatly in sheep and goats, therefrom 14 days to natural weaning, and exceeding four months of age. In sheep production effective early weaning has been practiced untimely at 14 days; in goats’ kids have been weaned early successfully at 28 days. Early weaning is considered traditionally weaning ahead of the 90 days of age; 60 days is most widely used; age thereafter qualifies for late weaning. The age at weaning greatly influences post weaning animal performance, however if not timed properly it would impact negatively also on weaner survival rates. Weaning itself is a very stressful procedure and subjecting kids/lambs to further stress which directly impinge on the kid/lamb’s immunity consequently increasing their susceptibility to diseases and reduced weight gain. There is need for age of weaning to balance the potential positive impacts on the ewes/does to rebreed, with potential negative impacts on the kid/lamb growth performance and survivability. Early weaning has become an effective husbandry practice especially in advanced goat and sheep production systems, which focuses on shortened female breeding reproductive cycle, while enhancing meat productivity through increased frequency of kidding/lambing. It is important to consider weaning age in relation to nutritional strategies which provide adequate time for diet transition which is intended not to compromise feed utilization and feed conversion efficiency in kids/lambs consequently reducing growth performance. The effectiveness of weaning age and anticipated live weight gains post-weaning is dependent on nutritional management especially concentrate supplementation which may promote performance and productivity in pastured based systems. Late weaning is probably convenient for less prolific goat and sheep breeds and genotypes not ies I and II, isolated from fenugreek and Melilotus alba respectively were used as Biofertilizers. Results showed that both treatments promote all the growth parameters as root and shoot lengths, seedling fresh weights, number of nodules and number of leaves after 21 days of growth of fenugreek plants. Application of Biofertilizers improved the growth of plants", "Trigonella | Biofertilizer | Melilotus | Shoot | Rhizobium | Biology | Seedling | Plant growth | Horticulture | Botany | Agronomy | Inoculation", "Agronomic Practices and Intercropping Systems", "Agronomy and Crop Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 3, 9, "https://openalex.org/W222775812 | https://openalex.org/W2120514656 | https://openalex.org/W2124647237 | https://openalex.org/W2173630624 | https://openalex.org/W2186193628 | https://openalex.org/W2199988559 | https://openalex.org/W2617804603 | https://openalex.org/W2618783734 | https://openalex.org/W2734753844", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2263817897", "https://doi.org/10.7075/tjfs.200909.0159", "https://www.airitilibrary.com/Publication/alDetailedMesh?DocID=10264469-200909-24-3-159-168-a", null, "Removal of Heavy Metal Ions from Aqueous Solutions by Bamboo Wastes", "article", "en", "2009-09-01", 2009, "Fu‐Lan Hsu | Yuchen Peng | Hong-Lin Lee", "https://orcid.org/0000-0002-0102-6208 | https://orcid.org/0000-0001-6480-4057 | -", null, null, null, "Táiwān línyè kēxué", null, "1026-4469", "24", "3", "159–168", "In the present study, the ability of wastes of 5 local bamboo species (Dendrocalamus latiflorus, Phyllostachys makinoi, P. pubescens, Bambusa stenostachya, and B. dolichoclada) to remove heavy metal ions of Cu (Ⅱ), Pb (Ⅱ), Cd (Ⅱ) and Ni (Ⅱ) from aqueous solutions, with different reaction times, particle sizes, and pH values were evaluated and compared with 4 known biosorbents of activated carbon, bark, exhausted coffee, and exhausted tea by induc ik Publications", "2347-5129", "1", "4", "72–78", "The present study was carried out at the Center of Excellence in Marine Biology University of Karachi over the period of 92 days to assess optimal salinity, effect of stocking density and two dietary protein level 30% (P1) and 40%(P2) crude protein on growth, survival rate feed conversion, body composition and production of Hybrid (Oreochromis mossambicus × Oreochromis niloticus). In present study, a 12 week trial conducted, 5, 10, 20, 40 (D1, D2, D3, D4/ P1 and D1, D2, D3, D4 /P2 respectively) fish/ 40L aquarium were stocked with two dietary protein level 30% (P1) and 40% (P2)CP on growth and feed utilization. The results were presented that growth of hybrid tilapia was significantly (P<0.05) condensed at P2 and high stocking densities (D3 and D4). Blood hemoglobin, RBC, WBC and %Hct were significantly different. Significantly (P<0.05) higher hematocrit concentration was observed at lower stocking densities indicating better physiological adaptation The resultant higher cortisol, blood sugar lactate and plasma protein levels at high stocking density were produced stress full condition. The physical parameters were at satisfactory level in all treatments.", "Stocking | Oreochromis | Oreochromis mossambicus | Animal science | Biology | Hematocrit | Tilapia | Feed conversion ratio | Fishery | Body weight | Endocrinology | Fish <Actinopterygii>", "Aquaculture Nutrition and Growth", "Aquatic Science", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", null, null, null, 3, 16, "https://openalex.org/W1608239693 | https://openalex.org/W1977427558 | https://openalex.org/W2004566267 | https://openalex.org/W2026060294 | https://openalex.org/W2026716028 | https://openalex.org/W2048634421 | https://openalex.org/W2052337766 | https://openalex.org/W2105119205 | https://openalex.org/W2107957489 | https://openalex.org/W2136061619 | https://openalex.org/W2136790105 | https://openalex.org/W2144186148 | https://openalex.org/W2168526937 | https://openalex.org/W2187939485 | https://openalex.org/W2272536186 | https://openalex.org/W2486242593", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W328808168", "https://doi.org/10.3965/ijabe.v3i1.48", "https://www.idc-online.com/technical_references/pdfs/civil_engineering/Ultra%20weak%20bioluminescence.pdf", null, "Ultra-weak bioluminescence and vigour of irradiated rice", "article", "en", "2010-03-31", 2010, "Yong Yu | Jun Wang", "- | https://orcid.org/0000-0001-5727-4326", null, "Zhejiang University", "CN", "International journal of agricultural and biological engineering", "Chinese Society of Agricultural Engineering", "1934-6344", "3", "1", "85–90", "Detection of the irradiation dose and the vigour of irradiated rice based on ultra-weak luminescent analysis is one of the analytical detection methods. Rough rice and head rice flour were used in this research for ultra-weak luminescent analysis. The bioluminescent intensity of rough rice was different at irradiation dose after different storage time, and the trend was consonant with the germination rates of irradiated rough rice. The bioluminescent intensity and germination rates of irradiated rough rice at irradiation dose after different storage time were due to the effect of the rice embryo that affected by irradiation, which had self-repair during storage. As a result, the ultra-weak luminescent analysis with rough rice cannot used to detect the irradiation dose of irradiated rice, but it can be used to detect the vigour of irradiation rice. Experimental results show that the irradiation dose has a highly significant effect on the bioluminescent intensities of rough rice flour when cane sugar was added. Keywords: ultra-weak luminescent, vigour, gamma irradiation, rice DOI: 10.3965/j.issn.1934-6344.2010.01.0-0 Citation: Yu Yong, Wang Jun . Ultra-weak bioluminescent and vigour of irradiated rice. Int J Agric & Biol Eng, 2010; 3(1): <span style=line-height: 140%; font-family:", "Irradiation | Germination | Horticulture | Bioluminescence | Luminescence | Chemistry | Biology | Agronomy | Materials science | Physics | Optoelectronics | Biochemistry", "GABA and Rice Research", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", "cc-by", null, null, 3, 15, "https://openalex.org/W840397817 | https://openalex.org/W1539590385 | https://openalex.org/W1837304588 | https://openalex.org/W1963713856 | https://openalex.org/W1976723010 | https://openalex.org/W2046177169 | https://openalex.org/W2064844434 | https://openalex.org/W2085047845 | https://openalex.org/W2087142184 | https://openalex.org/W2088984133 | https://openalex.org/W2098953195 | https://openalex.org/W2111124570 | https://openalex.org/W2132599249 | https://openalex.org/W2145402733 | https://openalex.org/W2193884065", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2998847986", null, "https://www.ajol.info/index.php/ari/article/download/192161/181282", null, "Melissopalynological and biochemical evaluation of the authenticity of apis Melifera adansonia honeys obtained from five states of Nigeria.", "article", "en", "2019-01-01", 2019, "Reginald Chukwuemeka Njokuocha", "https://orcid.org/0000-0002-3099-0055", "Reginald Chukwuemeka Njokuocha", null, null, "Animal Research International", "African Journals OnLine", "1597-3115", "16", "3", "3463–3477", "The study was conducted to determine the pollen composition, diversity and biochemical constituents of honey samples from five states of Nigeria. A total of 104 pollen types belonging to 57 plant families were recorded. The honey samples were classified into three botanical groups on basis of major contributing plants; Unifloral, bifloral and polyfloral honeys. Shannon-Wiener Diversity and Pielou’s Evenness Indices ranged from 1.987 – 2.676 and 0.580 – 0.705 respectively indicating high plant heterogeneity foraged by the honeybees. The common plant sources of nectar and pollen include CombretaceaeMelastomataceae, Phyllanthus muelerianus, Elaeis guineensis, Alchornea cordifolia and Syzygium guineense. The biochemical analyses conformed to the Codex and EU Council standard for all parameters tested except moisture content from Akpanya and Anyigba samples that exceeded the limit. The highest crude protein content was recorded in Calabar sample (1.71 ± 0.01 %) while ash content was highest in Anyigba (0.29 ± 0.02 %). Calabar and Akpanya samples had the highest fibre value (0.80 ± 0.01 %). The hydroxymethylfurfural value was highest in Abakaliki (4.46 ± 0.02 mg/kg). Sample from Calabar had the highest free acidity (0.12 ± 0.01 meg/kg), while electrical conductivity was highest in Akpanya (17.70 ± 0.01 µS/cm) sample. The pH and refractive index values, 4.72 ± 0.01 and 1.50 ± 0.01 respectively were highest in Abakaliki sample. The sum of fructose and glucose ranged from 68.8 ± 0.01 – 82.62 ± 0.01 % in the samples and had ratios greater than one in the samples making them subject to low crystallization. Keywords : Pollen analysis, Biochemical constituents, Honey, Pollen diversity", "Biology | Botany | Horticulture | Nectar | Pollen", "Bee Products Chemical Analysis", "Insect Science", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", null, null, null, 3, 25, "https://openalex.org/W271920484 | https://openalex.org/W1766739562 | https://openalex.org/W1821979084 | https://openalex.org/W1850712295 | https://openalex.org/W1971753670 | https://openalex.org/W2002437893 | https://openalex.org/W2019109078 | https://openalex.org/W2040991466 | https://openalex.org/W2056052743 | https://openalex.org/W2072773223 | https://openalex.org/W2074719502 | https://openalex.org/W2084717045 | https://openalex.org/W2090184876 | https://openalex.org/W2096068780 | https://openalex.org/W2096867491 | https://openalex.org/W2106667648 | https://openalex.org/W2126221284 | https://openalex.org/W2169916082 | https://openalex.org/W2217906698 | https://openalex.org/W2507509334 | https://openalex.org/W2753863896 | https://openalex.org/W2767605573 | https://openalex.org/W2782643436 | https://openalex.org/W2944605777 | https://openalex.org/W2953138835", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W1127646796", null, "http://yadda.icm.edu.pl/yadda/element/bwmeta1.element.agro-article-9c833aae-4b3a-4257-bd4a-8ee59860b5ca", null, "Flower development of greenhouse chrysanthemum", "article", "en", "2003-01-01", 2003, "E A Kuklina", "-", "E A Kuklina", "Central Siberian Botanical Garden", "RU", "Acta Biologica Cracoviensia s Botanica", "De Gruyter Open", "0001-5296", "45", "1", null, null, "Biology | Greenhouse | Botany | Cut flowers | Plant science | Floriculture | Plant development | Horticulture", "Flowering Plant Growth and Cultivation", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 3, 2, "https://openalex.org/W2013852457 | https://openalex.org/W2320655130", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2477789457", "https://doi.org/10.21199/wb45.1.4", "https://doi.org/10.21199/wb45.1.4", null, "DOCUMENTATION BY SOUND SPECTROGRAM OF A CRYPTIC TAXON, VIREO G. GILVUS, IN BOULDER COUNTY, COLORADO", "article", "en", "2014-01-01", 2014, "Ted Floyd", "-", "Ted Floyd", null, null, "Western Birds", null, "0045-3897", "45", "1", "57–70", "During June and July 2011, I audio-recorded eight Warbling Vireos (Vireo gilvus) at widely scattered sites in eastern Boulder County, Colorado, immediately east of the steep foothills of the Rocky Mountains. All eight sang songs like those of the eastern subspecies, V. g. gilvus; immediately to the west, in the steep foothills of the Rocky Mountains, Warbling Vireos sing songs like those of the western subspecies, V. g. swainsonii. The results of these observations suggest both the presence of nominate gilvus farther west in Colorado than previously documented and a sharp demarcation between the breeding ranges of swainsonii and gilvus.", "Sound (geography) | Taxon | Spectrogram | Documentation | Geography | Ecology | Biology | Geology | Computer science | Speech recognition | Oceanography", "Plant and animal studies", "Ecology, Evolution, Behavior and Systematics", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 2, 13, "https://openalex.org/W625453818 | https://openalex.org/W1569611434 | https://openalex.org/W2015979709 | https://openalex.org/W2064551241 | https://openalex.org/W2083364858 | https://openalex.org/W2086672690 | https://openalex.org/W2142316975 | https://openalex.org/W2164269725 | https://openalex.org/W2170662004 | https://openalex.org/W2331985125 | https://openalex.org/W2798044323 | https://openalex.org/W2802763263 | https://openalex.org/W3158877144", false, "2025-07-28 00:00:00"], ["https://openalex.org/W2152958996", "https://doi.org/10.5897/ajb12.1553", "https://www.academicjournals.org/article/article1380809695_Olajuyigbe and Afolayan.pdf", null, "In vitro ethnotherapeutic potential of the acetone extract of the bark of Ziziphus mucronata Willd. subsp. mucronata Willd.: Antimicrobial and toxicity evaluations", "article", "en", "2012-12-25", 2012, "Olufunmiso Olusola Olajuyigbe | Anthony Jide Afolayan", "https://orcid.org/0000-0002-7889-0416 | https://orcid.org/0000-0002-9111-6695", null, null, null, "AFRICAN JOURNAL OF BIOTECHNOLOGY", "Academic Journals", "1684-5315", "11", "103", "16783–16789", "The antimicrobial and the cytotoxicity activities of the crude acetone bark extract ofZiziphus mucronata were determined by agar diffusion, macrobroth dilution assays and brine shrimp lethality assay, respectively, to ascertain its relevance in ethnomedicine. The results show that both Gram negative and Gram positive bacteria tested were equally inhibited. At the highest concentration (10000 µg/ml) of the extract,the bacterial inhibition zones ranged between 16 and 21 ± 1.0 mm, the fungal inhibition zones ranged between 13 and 19 ± 1.0 mm while Fusarium sporotrichioides, Candida glabrata and Trichophyton mucoides were not affected. The minimum inhibitory concentrations (MICs) values of the extract were between 78.1 and 312.5 µg/ml for the bacteria while the minimum bactericidal concentrations (MBCs) were between 156.3 and 2500 µg/ml. For the fungi, the MICs were between 1250 and 10000 µg/ml, the minimum fungicidal concentrations (MFCs) were between 5000 and 20000 µg/ml and the LC50 of the brine shrimp lethality assay was 90.27 µg/ml indicating a low level of toxicity. The degree of the pharmacological activity of Z. mucronata shows the significant medicinal potential of this plant in the treatment of microbial infections and justifies its use in complementary and alternative medicines in South Africa.\r\n\r\n\t \r\n\r\n\tKey words: Ziziphus mucronata, antibacterial, cytotoxicity, fungicidal, ethanol extract, medicinal potential.", "Brine shrimp | Antimicrobial | Traditional medicine | Minimum inhibitory concentration | Combretaceae | Biology | Bark (sound) | Agar diffusion test | Minimum bactericidal concentration | Antibacterial activity | Chemistry | Microbiology | Bacteria | Botany | Medicine", "Ziziphus Jujuba Studies and Applications", "Food Science", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", null, null, null, 2, 46, "https://openalex.org/W12653918 | https://openalex.org/W163875625 | https://openalex.org/W574769293 | https://openalex.org/W791330973 | https://openalex.org/W1500094351 | https://openalex.org/W1505626160 | https://openalex.org/W1524307850 | https://openalex.org/W1540223130 | https://openalex.org/W1582578193 | https://openalex.org/W1965394815 | https://openalex.org/W1970260727 | https://openalex.org/W1974976612 | https://openalex.org/W1975261837 | https://openalex.org/W2000628507 | https://openalex.org/W2003930455 | https://openalex.org/W2041093395 | https://openalex.org/W2046097911 | https://openalex. g/W1993764166 | https://openalex.org/W2003523466 | https://openalex.org/W2016670666 | https://openalex.org/W2033734515 | https://openalex.org/W2034440057 | https://openalex.org/W2047648597 | https://openalex.org/W2051215583 | https://openalex.org/W2053416500 | https://openalex.org/W2073594078 | https://openalex.org/W2074625690 | https://openalex.org/W2098303558 | https://openalex.org/W2132135534 | https://openalex.org/W2132848582 | https://openalex.org/W2150351630 | https://openalex.org/W2479191760", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2562713839", null, "https://www.fisheriesjournal.com/vol2issue3/Pdf/28.1.pdf", null, "Evaluation of the reproductive performance of African catfish (Clarias gariepinus) brood stock fed on three locally manufactured commercial feeds", "article", "en", "2014-01-01", 2014, "Constantine Chobet Ondhoro | Mathew Tenywa | Akisoferi Owori Wadunde | Mujibu Nkambo | Cassius Aruho | Mathew Tenywa Mwanja | Akisoferi Owori", "- | - | - | - | https://orcid.org/0000-0003-0419-380X | - | -", null, null, null, "International Journal of Fisheries and Aquatic Studies", "AkiNik Publications", "2347-5129", "2", "3", "39–44", "Brood stock management experiment was conducted at Kireka fish farm Uganda, to evaluate the fecundity and economic performance of three new local commercial feeds for African catfish brood stock development and conditioning. The fish were conditioned in earthen ponds, stocked at 0.5 kg/m 3 for three months before spawning. The feeds were code named N2, B3 and N3 for Kajjansi 35%, Ugachick 35% and Tende Innovative Farm feeds respectively. Results indicated that there was no significant difference in the crude protein composition of all the test diets. Significantly lower lipid contents (2.326%) were noticed in N3. Mean number of eggs per unit brood stock weight differed significantly across all feed treatment (F = 10.179, P= 0.002), with N2 producing the highest N = 57,075± 18,922; B3= 51,477±16,266; N3= 45,375±13,399, generally improved from the baseline of 6,874±1001. Fertilization was significantly different (F=3.695E30, P=0.0001), across all diets (Mean; (N2= 78.13±8.99%; B3= 72.93±16.02%; N3= 59.95±19.96%). Hatchability differed significantly across all feed treatments (F=3.6E31, P=0.0001), compared to the baseline, Mean; (N2= 77±10.01%; B3= 67± 2.5%; N3= 58±11.15%; baseline= 45.80±5.45%). It was established that a farmer using N2 (Kajjansi) feeds would generate up to $1,114 net profit per kilogram of female brood stock spawned. While using B3 (Ugachick 35%), would generate $196 per kilogram female above total cost. N2 was the best feed overall, with the highest fecundity, percent fertilization, hatchability & net returns above total cost, followed by B3 and lastly N3. The findings of this study show that, though the profitability of a hatchery business depends on management and the germplasm, fecundity plays a crucial role in determining the net returns of the business and is greatly affected by type and quality of brood stock feeds.", "Clarias gariepinus | Animal science | Catfish | Brood | Broodstock | Biology | Fecundity | Fishery | Stocking | Human fertilization | Toxicology | Aquaculture | Fish <Actinopterygii> | Botany | Agronomy | Population | Medicine", "Aquaculture Nutrition and Growth", "Aquatic Science", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", null, null, null, 2, 20, "https://openalex.org/W247666833 | https://openalex.org/W625527359 | https://openalex.org/W1535052494 | https://openalex.org/W1602780937 | https://openalex.org/W1602965449 | https://openalex.org/W1893579453 | https://openalex.org/W1975458287 | https://openalex.org/W1989089318 | https://openalex.org/W2018005913 | https://openalex.org/W2024502932 | https://openalex.org/W2161712545 | https://openalex.org/W2183205043 | https://openalex.org/W2240548786 | https://openalex.org/W2266075734 | https://openalex.org/W2269937007 | https://openalex.org/W2334050191 | https://openalex.org/W2565689314 | https://openalex.org/W2586273574 | https://openalex.org/W2969354543 | https://openalex.org/W3196830879", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2396494896", null, "http://www.cabdirect.org/abstracts/20163023479.html", null, "STUDY ON FOOD SAFETY THROUGH RASFF NOTIFICATIONS IN CASE OF CONTAMINATION WITH MYCOTOXINS", "article", "en", "2015-01-01", 2015, "C. Pop | G. Frunză | D. S. Ștef | A. P. Mărculeţ", "- | - | - | -", null, null, null, "Lucrări Ştiinţifice - Universitatea de Ştiinţe Agricole şi Medicină Veterinară, Seria Zootehnie", null, null, "64", null, "166–172", "The study is an analysis of the incidence of biological hazards identified in food and feed based on information from the annual reports of the Rapid Alert System for Food and Feed (RASFF) for the period 2007-2014. In terms of methodology it was resorted to the analysis of data from the notifications sent by the countries in the European Economic Area (EEA) regarding mycotoxin contamination (Aflatoxins, Deoxynivalenol, Fumonsine, Ochratoxin A, Patulin, Zearalenone) using classical statistical methods. The results show a significant incidence of cases of contamination with mycotoxins (between which predominates aflatoxins) but also its reduction trend (about 50% in the period under study); this evolution can be considered to reflect the usefulness and efficiency functioning RASFF.", "Patulin | Mycotoxin | Zearalenone | Aflatoxin | Ochratoxin A | Contamination | Food safety | Food contaminant | Environmental health | Ochratoxins | Toxicology | Environmental science | Food science | Biology | Medicine | Ecology", "Mycotoxins in Agriculture and Food", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 2, 6, "https://openalex.org/W1534789482 | https://openalex.org/W1659034349 | https://openalex.org/W2024330784 | https://openalex.org/W2041173871 | https://openalex.org/W2047201008 | https://openalex.org/W2109673229", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2213704161", null, "http://epubs.icar.org.in/ejournal/index.php/AAR/article/download/37942/17034", null, "Influence of nitrogen levels and weed management practices on productivity of rice under aerobic conditions", "article", "en", "2013-01-01", 2013, "Chandra Prakash | N.R. Koli | R. K. Shivran | Jyoti Sharma", "https://orcid.org/0000-0002-6319-3546 | - | - | https://orcid.org/0000-0001-8044-6384", null, "Maharana Pratap University of Agriculture and Technology", "IN", "Annals of Agricultural Research", null, "0970-3179", "34", "2", null, "A field experiment was conducted to study the effect of nitrogen levels and weed control methods on growth, yield attributes and yield of rice. The results revealed that the rice variety 'IR-64' recorded maximum grain (3.46 t ha-1), straw (4.84 t ha-1) and biological yield (8.30 t ha-1) with the application of 125 kg N ha-1 under aerobic conditions which was statistically at par with application of 100 kg N ha-1. On the other hand, different weed control practices also gave significantly higher grain yield of aerobic rice. The application of pendimethalin @ 1.0 kg a.i. ha-1at 2 DAS + rice : dhaincha (1:1) + 2,4- D Na salt @ 0.8 kg a.i. ha-1 at 25 DAS recorded excellent performance and contributed grain, straw and biological yield of 3.98, 5.55 & 9.53 t ha-1, respectively. Weed dry weight was recorded at 55 DAS shows that application of pendimethalin @ 1.0 kg a.i. ha-1at 2 DAS + rice : dhaincha (1:1) + 2,4-D Na salt @ 0.8 kg a.i. ha-1 at 25 DAS recorded significantly lowest weed biomass as compared to other weed control treatments.", "Pendimethalin | Weed control | Weed | Agronomy | Straw | Yield (engineering) | Nitrogen | Field experiment | Grain yield | Productivity | Mathematics | Biology | Chemistry | Physics", "Rice Cultivation and Yield Improvement", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", n ", "article", "en", "2006-01-01", 2006, "Ross Broadfoot", "-", "Ross Broadfoot", null, null, "International sugar journal", "Agra Europe", "0020-8841", "109", "1302", "581–591", "THERE are numerous pan boiling schemes which can be used for producing high pol sugars, e.g. increased washup of A and B massecuites within the conventional three massecuite boiling scheme, dual production of high pol sugar and a lower pol sugar, the QHP process and boiling schemes such as the CBA scheme (or variations of it) where only A sugar is produced as shipment sugar. SRI’s models for pan stage and fugal station operations were employed to simulate production of high pol sugar using several different flowschemes. The simulations were conducted for typical early season and mid-season cane conditions. The equipment requirements, operating and capital costs for the different flowschemes were determined and compared against a base condition for Brand 1 sugar production. Other parameters which were assessed included the colour of the shipment sugar and the steam consumption on the pan stage. An economic assessment of high pol sugar production was undertaken for use of the different flowschemes. This paper provides the results of those simulations and explores the potential application of the CBA boiling scheme into Australian pan stages.", "Sugar | Boiling | Production (economics) | Pulp and paper industry | Environmental science | Waste management | Engineering | Chemistry | Food science | Economics", "Sugarcane Cultivation and Processing", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 2, 4, "https://openalex.org/W269218382 | https://openalex.org/W275103755 | https://openalex.org/W960995701 | https://openalex.org/W1524204074", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W309175368", null, "http://www.pjar.org.pk/Issues/Vol25_2012No_1/Vol25No_1Page83.pdf", null, "CROP INOCULANTS- AN UNDEREXPLORED POTENTI
