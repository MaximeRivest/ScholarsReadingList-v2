sic science has become an important aspect to deal with the challenges of digital world.  There are number of techniques and tools available for digital forensics investigation. In this paper, how Machine Learning algorithms and Security Information and Event Management framework can be used in digital forensics is discussed. Machine Learning can be used to analyse huge amount of data, in recognizing patterns. SIEM can be used for log collection, correlation of logs data, identifying the techniques and activities that are used by the criminal.  ML and SEIM both can be used to analyse previous historic data to predict the behaviour of the criminal.", "Digital forensics | Computer science | Network forensics | Event (particle physics) | The Internet | Computer forensics | Computer security | Data science | Digital evidence | World Wide Web", "Digital and Cyber Forensics", "Information Systems", "Computer Science", "Physical Sciences", null, false, "closed", null, null, null, 0, 16, "https://openalex.org/W1552127367 | https://openalex.org/W2000621030 | https://openalex.org/W2077121139 | https://openalex.org/W2398395545 | https://openalex.org/W2464746074 | https://openalex.org/W2583078290 | https://openalex.org/W2765947859 | https://openalex.org/W2770291346 | https://openalex.org/W2921976480 | https://openalex.org/W2942027462 | https://openalex.org/W2982298370 | https://openalex.org/W2991388817 | https://openalex.org/W2992846189 | https://openalex.org/W3036099181 | https://openalex.org/W3131070200 | https://openalex.org/W3194734433", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W1897226957", null, "https://www.ajouronline.com/index.php?journal=AJEEL&page=article&op=view&path%5B%5D=1648", null, "Project-Based Learning at the University of Bihać", "article", "en", "2014-10-15", 2014, "Senka Majetić", "-", "Senka Majetić", null, null, "Asian Journal of Education and e-Learning", null, "2321-2454", "2", "5", null, "According to Jeremy Harmer lack of connected speech might be result of language drills. It seems by the book, lack of connected speech manifested as lack of spoken fluency is obvious among 3rd year students at the Department of English Language and Literature. They need to pass demanding grammar test. Therefore, language drills are used frequently. They are used to this type of activities going through various sets of exercises during the session. However, we don't speak enough. Problem of lack of connected speech is manifested as lack of spoken fluency. This skill is usually developed by an ELF. However, some changes will be made. Therefore presentations and project-based learning will be introduced. I would like to prevent side effects of my work. Therefore, I plan to introduce PBL (Project-Based Learning). In this paper I will present Class issue or challenge to be resolved, Innovation(s), Plan of action, Timeline for making the change, Expected benefits of presented innovations, Challenges, Solution to challenges, Plan of assessing success of innovation(s). Project presented in this paper is made during the tuition scholarship from U. S. Department of State as part of the E-Teacher Scholarship Program organized at the University of Oregon.  The purpose of the paper is to analyse implementation of Project-Based Learning at the University of Bihac.", "Fluency | Timeline | Session (web analytics) | Plan (archaeology) | Grammar | Computer science | Scholarship | Schedule | Spoken language | Class (philosophy) | Test (biology) | Work (physics) | Mathematics education | Psychology | Linguistics | Artificial intelligence | World Wide Web | Engineering | Political science", "Higher Education Learning Practices", "Education", "Social Sciences", "Social Sciences", null, false, "closed", null, null, null, 0, 2, "https://openalex.org/W2075959218 | https://openalex.org/W2936230102", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W3142828659", null, "https://jurnal.untirta.ac.id/index.php/aiselt/article/download/10930/7006", null, "IMPROVING STUDENTS’ SPEAKING SKILL THROUGH CONTEXTUAL TEACHING AND LEARNING (CTL) (A CLASSROOM ACTION RESEARCH OF EIGHTH GRADE STUDENTS OF SMP NEGERI 2 ANGSANA PANDEGLANG IN 2017/2018 ACADEMIC YEAR)", "article", "en", "2018-09-17", 2018, "Aminudin Aminudin", "-", "Aminudin Aminudin", "Sultan Ageng Tirtayasa University", "ID", "PROCEEDING AISELT (Annual International Seminar on English Language Teaching)", null, null, "3", "3", null, "This reserach is written 1) to describe how the process of teaching speaking through CTL; 2) to identify the improvement of students’ speaking skill; and 3) to identify the effectiveness of CTL in teaching speaking. The method used in this research was a Classroom Action Research. The research was conducted in two cycles from March until May 2018 at the eighth grade students of SMPN 2 Angsana Pandeglang Banten. The research data were collected by some techniques: observation, interview, document and test (pre-test and post-test). The data were analyzed through qualitative data and descriptive statistics. The research findings reveal that the teaching and learning process using the components of CTL Method (Making meaningful connection, Doing significant work, Self-regulated meaning, Collaborating, Critical and creative thinking, Nurturing the individual, Reaching the high standard and Using authentic assessment) is effective enough to improving students’ speaking skill in transactional and interpersonal conversation. The improvement of students’ speaking skill can be seen from the mean score is improved from 60.50 for pre-test, 70.45 for first-post-test, to 75.03 for second post-test. Based on these findings, it was recommended that CTL can be used in teaching English speaking skill.", "Action research | Mathematics education | Test (biology) | Psychology | CTL* | Meaning (existential) | Academic year | Conversation | Action (physics) | Qualitative property | Descriptive statistics | Pedagogy | Computer science | Mathematics | Communication", "English Language Learning and Teaching", "Information Systems", "Computer Science", "Physical Sciences", null, false, "closed", null, null, null, 0, 6, "https://openalex.org/W426871535 | https://openalex.org/W1582575895 | https://openalex.org/W1585818825 | https://openalex.org/W1588466690 | https://openalex.org/W1985347360 | https://openalex.org/W2314483305", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2265688877", null, "http://www.dbpia.co.kr/Journal/ArticleDetail/NODE01622935", null, "IT-BASED TEACHING AND LEARNING SYSTEMS USED IN THE DEPARTMENT OF EDUCATION IN PAPUA NEW GUINEA", "article", "en", "2007-08-01", 2007, "Damien Rapese | Michael Tapo | John Volmer", "- | - | -", null, null, null, "한국멀티미디어학회 국제학술대회", null, null, null, null, "497–500", "Worldwide there is an increasing use of ICT based resources to promote and enhance teaching and learning experiences for both formal and non formal education and training activities for all sectors of society. The pace of global ICT developments continues to impact all sectors of society. Successive governments in Papua New Guinea have been trying to address the complex issues of the development of a national ICT policy and privatization/competition in the telecommunications marketplace. For the education sector in PNG where the vast majority of schools and students are in rural communities, the issues are more complex. Basic infrastructure requirements such affordable electricity supply, school buildings to accommodate ICT resources, and affordable communications bandwidth require resolution prior to the introduction of any ICT based resources. Ongoing technical support and the training of teachers in rural locations is an additional recurrent cost that must be serious addressed at the national and provincial levels for any program to succeed. This paper highlights the experiences to date of a number of initiatives to introduce teachers and students to ICT resources in selected vocational and secondary schools in Papua New Guinea.", "Information and Communications Technology | New guinea | Pace | Vocational education | Economic growth | Rural area | Business | Public relations | Political science | Sociology | Geography | Economics", "Education Systems and Policy", "Education", "Social Sciences", "Social Sciences", null, false, "closed", null, null, null, 0, 1, "https://openalex.org/W2206115805", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W1578598214", null, "https://periodicos.unifacef.com.br/index.php/rel/article/download/409/391", null, "The Use of L2 as A Tool in the Teaching-Learning Process: Uni- Facef – Pró-Criança Project", "article", "en", "2012-08-29", 2012, "Isabela Araújo Oliveira | Márcia Helena Venâncio Faleiros", "https://orcid.org/0000-0002-6428-0510 | -", null, "Centro Universitário de Franca", "BR", "Revista Eletrônica de Letras", null, null, "4", "1", null, "O objetivo deste estudo e verificar se o uso constante da lingua inglesa, pelo professor, ao ministrar suas aulas, realmente leva o aluno a um maior progresso na aprendizagem da mesma. De acordo com essa pratica, ha a crenca de que a aprendizagem e\r\ncomunicacao dos alunos na lingua-alvo podem desenvolver-se de uma forma mais natural e significativa do que se eles forem expostos a sua lingua materna durante a aprendizagem da\r\nlingua inglesa. Essa crenca e fundamentada em algumas teorias relacionadas ao processo de ensino-aprendizagem de lingua estrangeira, as quais argumentam que o uso da L2 por parte\r\ndos professores, juntamente com atividades comunicativas, e uma das caracteristicas que levam os alunos a uma aprendizagem mais eficaz. Assim, a ideia e tornar a sala de aula um ambiente mais proximo possivel ao ambiente de aquisicao, expondo os alunos a lingua-alvo e, se for necessario, para nao recorrer a lingua materna, podemos fazer uso de alguns recursos pedagogicos como figuras, realia etc. Estudamos essa pratica particularmente no contexto do projeto Pro-Crianca, que tem uma parceria com o Uni-FACEF Centro Universitario de Franca, com base em pesquisas quantitativas e qualitativas, para verificar a sua efetividade em relacao a aprendizagem da lingua inglesa por parte dos alunos. Os instrumentos utilizados para coleta de dados foram: prova oral; notas de observacao de um docente alheio ao projeto; notas de campo do professor-pesquisador; e por fim, um questionario para saber a opiniao dos alunos sobre a enfase no uso da Lingua Inglesa na sala de aula. Fundamentamo-nos em autores como Scrivener (2005), Harmer (2004, 2005), entre outros.", "Humanities | Philosophy | Lingua franca | Psychology", "EFL/ESL Teaching and Learning", "Language and Linguistics", "Arts and Humanities", "Social Sciences", null, false, "closed", null, null, null, 0, 6, "https://openalex.org/W560435002 | https://openalex.org/W586326620 | https://openalex.org/W1508078757 | https://openalex.org/W1518147929 | https://openalex.org/W1993401008 | https://openalex.org/W2023432679", false, "2025-10-10 17:16:08.811792"]], "total": 79}</script></div><script>
const root = document.currentScript.previousElementSibling;
const {cols, rows, total} = JSON.parse(root.querySelector('script[type="application/json"]').textContent);
const URL_RE = /(https?:\/\/[^\s<>"']+)/g, LONG = 300;
let page = 0, size = 25;
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const linkify = s => esc(s).replace(URL_RE, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
function cell(v) {
  if (v === null) return '<span class="na">null</span>';
  const nested = typeof v === 'object';
  const s = nested ? JSON.stringify(v) : String(v);
  const cls = nested ? ' class="nested"' : '';
  if (s.length <= LONG) return `<div${cls}>${linkify(s)}</div>`;
  return `<details${cls}><summary>${linkify(s.slice(0, LONG))}…</summary>${linkify(s)}</details>`;
}
function render() {
  const pages = Math.max(1, Math.ceil(rows.length / size));
  page = Math.min(page, pages - 1);
  const slice = rows.slice(page * size, page * size + size);
  root.querySelector('tbody').innerHTML = slice.map(r => '<tr>' + r.map(v => `<td>${cell(v)}</td>`).join('') + '</tr>').join('');
  const first = rows.length ? page * size + 1 : 0, last = page * size + slice.length;
  root.querySelector('.info').textContent =
    `rows ${first}–${last} of ${rows.length.toLocaleString()} loaded` + (total === null ? ' (total unknown)' : ` · ${total.toLocaleString()} in table`);
  root.querySelector('.pg').textContent = `page ${page + 1} / ${pages}`;
  root.querySelector('.prev').disabled = page === 0;
  root.querySelector('.next').disabled = page >= pages - 1;
  root.querySelector('.wrap').scrollTop = 0;
}
root.querySelector('thead tr').innerHTML = cols.map(([n, short, full]) =>
  `<th title="${esc(n + ': ' + full)}">${esc(n)}<div class="t">${esc(short)}</div></th>`).join('');
root.querySelector('.prev').onclick = () => { page--; render(); };
root.querySelector('.next').onclick = () => { page++; render(); };
root.querySelector('.size').onchange = e => { size = +e.target.value; page = 0; render(); };
render();
</script>
