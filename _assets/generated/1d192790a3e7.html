<script type="application/json">{"cols": [["id", "str", "Str"], ["doi", "str", "Str"], ["url", "str", "Str"], ["pdf_url", "str", "Str"], ["title", "str", "Str"], ["type", "str", "Str"], ["language", "str", "Str"], ["date", "date", "Date"], ["year", "int64", "Int64"], ["authors", "str", "Str"], ["author_orcids", "str", "Str"], ["corresponding_authors", "str", "Str"], ["institutions", "str", "Str"], ["countries", "str", "Str"], ["venue", "str", "Str"], ["publisher", "str", "Str"], ["issn", "str", "Str"], ["volume", "str", "Str"], ["issue", "str", "Str"], ["pages", "str", "Str"], ["abstract", "str", "Str"], ["keywords", "str", "Str"], ["topic", "str", "Str"], ["subfield", "str", "Str"], ["field", "str", "Str"], ["domain", "str", "Str"], ["mesh_terms", "str", "Str"], ["is_open_access", "bool", "Bool"], ["open_access_status", "str", "Str"], ["license", "str", "Str"], ["funders", "str", "Str"], ["grants", "str", "Str"], ["citations", "int64", "Int64"], ["references_count", "int64", "Int64"], ["references", "str", "Str"], ["is_retracted", "bool", "Bool"], ["updated_date", "datetime", "Datetime"]], "rows": [["https://openalex.org/W2112391481", null, "http://files.eric.ed.gov/fulltext/EJ1100363.pdf", null, "Re-Conceptualizing \"Scaffolding\" and the Zone of Proximal Development in the Context of Symmetrical Collaborative Learning.", "article", "en", "2015-01-01", 2015, "Manual Fernández | Rupert Wegerif | Neil Mercer | Sylvia Rojas‐Drummond", "- | https://orcid.org/0000-0003-2278-2245 | https://orcid.org/0000-0002-6829-8072 | https://orcid.org/0000-0002-8856-2053", null, null, null, "The Journal of classroom interaction", "University of Houston", "0749-4025", "50", "1", "54–72", "The linked concepts of ‘scaffolding’ and the Zone of Proximal Development (ZPD) were originally applied to the context of asymmetrical teaching and learning with a teacher or adult explicitly supporting a learner, usually a child, to achieve tasks beyond their ability when working alone. In this paper we investigate how these concepts need to be reconceptualised if they are to be applied to the different context of symmetrical learning amongst groups of peers. We present two separate studies. In the first one we analyse the type of talk used by a group of children from Mexico solving the Raven’s Standard Progressive Matrices (RSPM) test together both before and after an intervention programme teaching ‘exploratory talk’. Our analysis demonstrates a ZPD created by the way in which they talk together. In the second study we present the comparison of the talk of two groups of children, one from Mexico and the other from the UK, solving together a single matrix from the RSPM test. Our analysis shows how the concept of ‘scaffolding’ can be applied to understand how these groups of children use language to support shared thinking and learning. In both studies we found that applying ideas of ‘scaffolding’ and the ZPD to symmetrical learning required the re-conceptualisation of these concepts as characterisations of dynamic processes within dialogues.", "Zone of proximal development | Context (archaeology) | Mathematics education | Psychology | Scaffold | Collaborative learning | Test (biology) | Raven's Progressive Matrices | Pedagogy | Cognitive science | Computer science | Cognition", "Educational and Psychological Assessments", "Developmental and Educational Psychology", "Psychology", "Social Sciences", null, false, "closed", null, null, null, 197, 18, "https://openalex.org/W122607168 | https://openalex.org/W166898708 | https://openalex.org/W652986715 | https://openalex.org/W653899489 | https://openalex.org/W1487272748 | https://openalex.org/W1490842649 | https://openalex.org/W1501763955 | https://openalex.org/W1655850657 | https://openalex.org/W1970209023 | https://openalex.org/W2055924487 | https://openalex.org/W2104931515 | https://openalex.org/W2135943618 | https://openalex.org/W2154030277 | https://openalex.org/W2171935783 | https://openalex.org/W2397329997 | https://openalex.org/W2626249865 | https://openalex.org/W2969654360 | https://openalex.org/W2973522781", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2753433947", null, "https://papers.nips.cc/paper/7266-a-meta-learning-perspective-on-cold-start-recommendations-for-items.pdf", null, "A Meta-Learning Perspective on Cold-Start Recommendations for Items", "article", "en", "2017-01-01", 2017, "Manasi Vartak | Arvind Thiagarajan | Conrado Silva Miranda | Jeshua Bratman | Hugo Larochelle", "- | - | https://orcid.org/0000-0003-1885-3098 | - | -", null, "Massachusetts Institute of Technology | Université de Sherbrooke", "US | CA", "Neural Information Processing Systems", null, null, "30", null, "6904–6914", "Matrix factorization (MF) is one of the most popular techniques for product recommendation, but is known to suffer from serious cold-start problems. Item cold-start problems are particularly acute in settings such as Tweet recommendation where new items arrive continuously. In this paper, we present a meta-learning strategy to address item cold-start when new items arrive continuously. We propose two deep neural network architectures that implement our meta-learning strategy. The first architecture learns a linear classifier whose weights are determined by the item history while the second architecture learns a neural network whose biases are instead adjusted. We evaluate our techniques on the real-world problem of Tweet recommendation. On production data at Twitter, we demonstrate that our proposed techniques significantly beat the MF baseline and also outperform production models for Tweet recommendation.", "Computer science | Cold start (automotive) | Deep learning | Artificial intelligence | Machine learning | Artificial neural network | Matrix decomposition | Classifier (UML) | Perspective (graphical) | Recommender system | Architecture", "Recommender Systems and Techniques", "Information Systems", "Computer Science", "Physical Sciences", null, W3215093952", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2189531498", "https://doi.org/10.1177/174183051100900104", "https://doi.org/10.1177/174183051100900104", null, "Stress management through workplace coaching: The impact of learning experiences", "article", "en", "2011-02-01", 2011, "Gro Ladegård", "https://orcid.org/0000-0002-5124-5505", "Gro Ladegård", "Norwegian University of Life Sciences", "NO", "International journal of evidence based coaching and mentoring", null, "1741-8305", "9", "1", "29–43", "The purpose of the present study is to investigate how learning experiences acquired through workplace coaching may affect stress. I identify two main learning experiences in the coaching process, insight and planning skills, and propose that these affect stress directly and also indirectly through mediators’ job demand, job control, and social support. A within-subject, longitudinal design is applied, with 56 persons receiving coaching from professional, external coaches. Data was collected at three points in time: baseline (before coaching), after a three-month period of coaching, and a follow-up nine months later. The results show that planning skills acquired through coaching reduce stress in the short term, and that the effect is mediated through a decrease in job demand. The decrease in job demand is further shown to reduce stress in the long term. Insight as a coaching outcome is not directly related to stress; however, insight affects social support, which in turn is associated with reduced stress in the long term.", "Coaching | Affect (linguistics) | Psychology | Stress (linguistics) | Applied psychology | Social support | Job stress | Social psychology | Job satisfaction", "Job Satisfaction and Organizational Behavior", "Organizational Behavior and Human Resource Management", "Business, Management and Accounting", "Social Sciences", null, true, "diamond", "cc-by-nc-nd", null, null, 53, 40, "https://openalex.org/W123377273 | https://o ofessional development | Pharmacy | Psychology | Medical education | Curriculum | Lifelong learning | Accreditation | Commission | Medicine | Pedagogy | Nursing | Political science | Social psychology", "Innovations in Medical Education", "Public Health, Environmental and Occupational Health", "Medicine", "Health Sciences", null, false, "closed", null, null, null, 39, 21, "https://openalex.org/W41355701 | https://openalex.org/W97260341 | https://openalex.org/W107081423 | https://openalex.org/W228880058 | https://openalex.org/W229742130 | https://openalex.org/W1514606137 | https://openalex.org/W1527870351 | https://openalex.org/W1545793374 | https://openalex.org/W1580749063 | https://openalex.org/W1688035344 | https://openalex.org/W1983493181 | https://openalex.org/W2089615332 | https://openalex.org/W2098467395 | https://openalex.org/W2183263439 | https://openalex.org/W2291635300 | https://openalex.org/W2321474623 | https://openalex.org/W2326681085 | https://openalex.org/W2337456872 | https://openalex.org/W2402378191 | https://openalex.org/W2430271628 | https://openalex.org/W3146115948", false, "2025-07-28 00:00:00"], ["https://openalex.org/W1495041978", "https://doi.org/10.1016/s0002-9459(26)00915-0", "https://doi.org/10.1016/s0002-9459(26)00915-0", null, "Implementing Service-Learning in the Pharmacy Curriculum", "article", "en", "2000-01-01", 2000, "Jamie C. Barner", "https://orcid.org/0000-0002-6078-8093", "Jamie C. Barner", null, null, "American Journal of Pharmaceutical Education", "Elsevier BV", "0002-9459", "64", "3", "260–265", null, "Curriculum | Experiential learning | Agency (philosophy) | Pharmacy | Service (business) | Medical education | Service-learning | Psychology | Experiential education | Variety (cybernetics) | Pedagogy | Medicine | Nursing | Sociology | Computer science | Business | Marketing", "Service-Learning and Community Engagement", "Education", "Social Sciences", "Social Sciences", null, false, "closed", null, null, null, 24, 10, "https://openalex.org/W91873182 | https://openalex.org/W1562918623 | https://openalex.org/W1992286400 | https://openalex.org/W2001139988 | https://openalex.org/W2049327476 | https://openalex.org/W2055081643 | https://openalex.org/W2107342105 | https://openalex.org/W2146219406 | https://openalex.org/W2246311963 | https://openalex.org/W2417630232", false, "2025-07-28 00:00:00"], ["https://openalex.org/W2108430336", null, "https://papers.nips.cc/paper/3352-a-randomized-algorithm-for-large-scale-support-vector-learning.pdf", null, "A Randomized Algorithm for Large Scale Support Vector Learning", "article", "en", "2007-12-03", 2007, "K. A. Shiva Kumar | Chiru Bhattacharya | Ramesh Hariharan", "- | - | -", null, "Indian Institute of Science Bangalore | Strand Life Sciences (India) | Genomics (United Kingdom)", "IN | GB", "Neural Information Processing Systems", null, null, "20", null, "793–800", "This paper investigates the application of randomized algorithms for large scale SVM learning. The key contribution of the paper is to show that, by using ideas random projections, the minimal number of support vectors required to solve almost separable classification problems, such that the solution obtained is near optimal with a very high probability, is given by O(log n); if on removal of properly chosen O(log n) points the data becomes linearly separable then it is called almost separable. The second contribution is a sampling based algorithm, motivated from randomized algorithms, which solves a SVM problem by considering subsets of the dataset which are greater in size than the number of support vectors for the problem. These two ideas are combined to obtain an algorithm for SVM classification problems which performs the learning by considering only O(log n) points at a time. Experiments done on synthetic and real life datasets show that the algorithm does scale up state of the art SVM solvers in terms of memory required and execution time without loss in accuracy. It is to be noted that the algorithm presented here nicely complements existing large scale SVM learning approaches as it can be used to scale up any SVM solver.", "Support vector machine | Separable space | Algorithm | Randomized algorithm | Scale (ratio) | Computer science | Solver | Key (lock) | Artificial intelligence | Machine learning | Mathematics", "Machine Learning and Algorithms", "Artificial Intelligence", "Computer Science", "Physical Sciences", null, false, "closed", null, null, null, 21, 11, "https://openalex.org/W740415 | https://openalex.org/W1516726196 | https://openalex.org/W1569401919 | https://openalex.org/W1604585277 | https://openalex.org/W1705336121 | https://openalex.org/W1987752344 | https://openalex.org/W2035720976 | https://openalex.org/W2088012199 | https://openalex.org/W2156569740 | https://openalex.org/W2156909104 | https://openalex.org/W2158388787", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2049539838", null, "https://ieeexplore.ieee.org/document/5967259/", null, "E-learning environment compared to traditional classroom", "article", "en", "2011-05-23", 2011, "Snježana Babić", "https://orcid.org/0000-0002-8828-9405", "Snježana Babić", "Polytechnic of Rijeka", "HR", "International Convention on Information and Communication Technology, Electronics and Microelectronics", null, null, null, null, "1299–1304", "Throughout history, the educational process used different educational technologies which did not significantly alter the manner of learning in the classroom. By implementing e-learning technology to the educational process, new and completely different innovative learning scenarios are made possible, including more active student involvement outside the traditional classroom. The quality of the realization of the educational objective in any learning environment depends primarily on the teacher who creates the educational process, mentors and acts as a moderator in the communication within the educational process, but also relies on the student who acquires the educational content. The traditional classroom learning and e-learning environment enable different manners of adopting educational content, and this paper reveals their key characteristics with the purpose of better use of e-learning technology in the educational process.", "Process (computing) | Educational technology | Computer science | Moderation | Key (lock) | Learning environment | Mathematics education | Quality (philosophy) | Multimedia | Knowledge management | Psychology", "Online and Blended Learning", "Education", "Social Sciences", "Social Sciences", null, false, "closed", null, null, null, 15, 5, "https://openalex.org/W409322034 | https://openalex.org/W1534078311 | https://openalex.org/W2119450491 | https://openalex.org/W2135921556 | https://openalex.org/W2331279928", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2289253904", null, "http://journalarticle.ukm.my/4856/1/06%2520M.Leevanathi.pdf", null, "Common microorganisms causing onychomycosis in tropical climate", "article", "en", "2012-06-01", 2012, "Leelavathi Muthupalani | Tzar Mohd Nizam Khaithir | J. Adawiah", "- | https://orcid.org/0000-0002-6073-2815 | -", null, "National University of Malaysia", "MY", "Sains Malaysiana", "Penerbit Universiti Kebangsaan Malaysia", "0126-6039", "41", "6", "697–700", "Onychomycosis is the infection of nail apparatus by dermatophytes, yeasts or non-dermatophyte moulds and is responsible for 50% of all nail disorders. A five year retrospective study was conducted at Universiti Kebangsaan Malaysia to identify the common pathogens responsible for onychomycosis and to describe the epidemiology of the affected patients. A total of 278 abnormal nails were cultured, out of which 231 were positive for fungus. Females constituted 50.2% (n=116) while males 49.8% (n=115). The majority (51.9%, n=120) were between ages 50-69 years. The Malay ethnic group was most commonly affected (44.2%, n=102) followed by Chinese (33.8%, n=78), Indians (18.2%, n=42) and other ethnic groups (3.8%, n=9). The most common fungal element isolated was non-dermatophyte moulds (45.4%, n=105) followed by yeast (34.6%, n=80) and dermatophytes (1.3%, n=3). Aspergillus spp. was the commonest (59.8%,n=81) non-dermatophyte mould, while Candida spp. was the commonest yeast (74.3%, n=89) isolated. In this study, non-dermatophyte moulds are the most common microorganisms implicated to cause onychomysosis. Treatment for non-dermatophyte mould is challenging as the current available antifungal agents are more effective against dermatophytes and yeasts.", "Dermatophyte | Aspergillus | Trichophyton | Microbiology | Fungus | Antifungal | Biology | Medicine | Dermatology | Botany", "Nail Diseases and Treatments", "Epidemiology", "Medicine", "Health Sciences", null, false, "closed", null, null, null, 15, 7, "https://openalex.org/W90817836 | https://openalex.org/W2069686206 | https://openalex.org/W2073299470 | https://openalex.org/W2099979442 | https://openalex.org/W2103613642 | https://openalex.org/W2147753035 | https://openalex.org/W3129031591", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2188433962", "https://doi.org/10.1016/s0002-9459(26)01151-4", "https://doi.org/10.1016/s0002-9459(26)01151-4", null, "Service-Learning Projects in a Public Health in Pharmacy Course", "article", "en", "2002-01-01", 2002, "Jean T. Carter | Gayle A. Cochran", "- | -", null, null, null, "American Journal of Pharmaceutical Education", "Elsevier BV", "0002-9459", "66", "3", "312–318", null, "Pharmacy | Service-learning | Medical education | Service (business) | Plan (archaeology) | Public health | Community pharmacy | Psychology | Medicine | Pedagogy | Nursing | Business | Marketing", "Service-Learning and Community Engagement", "Education", "Social Sciences", "Social Sciences", null, false, "closed", null, null, null, 14, 1, "https://openalex.org/W2111357983", false, "2025-07-28 00:00:00"], ["https://openalex.org/W2155239007", null, "https://files.eric.ed.gov/fulltext/EJ819076.pdf", null, "Student Learning Styles/Strategies and Professors' Expectations: Do They Match?.", "article", "en", "2008-01-01", 2008, "Jennifer A. Mather | Angele Champagne", "https://orcid.org/0000-0001-7009-1639 | -", null, null, null, "The College Quarterly", null, null, "11", "2", "1–8", "University students may not always learn in ways that match those that professors use in their teaching. Third-year students at a small, mainly undergraduate, Canadian university showed a wide variety of approaches when tested with Kolb’s (1976) Learning Style Inventory. Students in the Humanities were the most varied, and those in Health Science and Science tended to the practical Active Experimentation (learning by doing) approach. Those in the Sciences often used the data analysis based Strategy of Convergers, especially males, who lived up to their stereotype and seldom used the affective approach of Divergers. Professors’ course outlines de-emphasized the Concrete Experience (sensing/feeling) Style and affective based Diverger Strategy far more than students, and often asked for the bottom-up objective evaluation of Reflective Observation, as exemplified by quantitative tests. For both genders and across four Faculties, the diversity of student approaches to learning was the most striking finding.", "Psychology | Variety (cybernetics) | Feeling | Learning styles | Style (visual arts) | Diversity (politics) | Stereotype (UML) | Cognitive style | Higher education | Mathematics education | Pedagogy | Social psychology | Cognition | Sociology | Computer science", "Learning Styles and Cognitive Differences", "Developmental and Educational Psychology", "Psychology", "Social Sciences", null, false, "closed", null, null, null, 14, 20, "https://openalex.org/W1530461 | https://openalex.org/W6322094 | https://openalex.org/W1607767634 | https://openalex.org/W1992808476 | https://openalex.org/W2008144594 | https://openalex.org/W202382122 eraction | Artificial intelligence", "Teaching and Learning Programming", "Computer Science Applications", "Computer Science", "Physical Sciences", null, false, "closed", null, null, null, 13, 21, "https://openalex.org/W194730999 | https://openalex.org/W1535484732 | https://openalex.org/W1546215871 | https://openalex.org/W1553801482 | https://openalex.org/W1598338937 | https://openalex.org/W1841698850 | https://openalex.org/W1964674052 | https://openalex.org/W1966130909 | https://openalex.org/W1971094374 | https://openalex.org/W1985282686 | https://openalex.org/W1986931792 | https://openalex.org/W1998128236 | https://openalex.org/W2003909323 | https://openalex.org/W2016625422 | https://openalex.org/W2028868392 | https://openalex.org/W2033086912 | https://openalex.org/W2040441451 | https://openalex.org/W2040945096 | https://openalex.org/W2122166962 | https://openalex.org/W2128628043 | https://openalex.org/W2140219884", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W3087187986", "https://doi.org/10.66392/003777218822353093", "https://doi.org/10.66392/003777218822353093", null, "Project-Based Learning in Social Studies", "article", "en", "2018-01-01", 2018, "John Larmer", "-", "John Larmer", null, null, "Social Education", null, "0037-7724", "82", "1", "20–23", "Project-Based Learning (PBL) is increasingly popular in K-12 schools, not just in the United States but around the world. It's not going to be one of those education fads that comes and goes; we at the Buck Institute for Education believe it will become a permanent feature of 21st century education. Why? For several reasons.", "Social learning | Computer science | Knowledge management", "Problem and Project Based Learning", "Education", "Social Sciences", "Social Sciences", null, false, "closed", null, null, null, 11, 5, "https://openalex.org/W564304069 | https://openalex.org/W1986527233 | https://openalex.org/W2001005524 | https://openalex.org/W2065427258 | https://openalex.org/W2108474849", false, "2025-07-29 00:00:00"], ["https://openalex.org/W42481148", null, "http://files.eric.ed.gov/fulltext/EJ902795.pdf", null, "Student Affairs and Service Learning: Promoting Student Engagement", "article", "en", "2006-04-01", 2006, "Robert Caruso | Glenn A. Bowen | Jane Adams‐Dunford", "- | https://orcid.org/0000-0003-3049-6900 | -", null, "Western Carolina University", "US", "College student affairs journal", null, "0888-210X", "25", "2", "186–198", "Why should service learning be placed within affairs? What special skills can affairs professionals bring to service-learning program implementation? How can administrators use this program to promote strong affairs-academic affairs collaboration? This article discusses a best practices model that is working well at a regional public institution. In a recent national conference presentation, Knott (2005) traced the evolution of affairs through several discrete stages. These stages are (a) a responsibility for and a preoccupation with discipline; (b) a focus on services; (c) emphasis on rising above the routine provision of services to address development; and (d) a new appreciation of the importance of learning and engagement. Knott's final stage sets the foundation for much of the affairs practice and research that has emerged in the area of learning and, more specifically, service learning. Learning Reconsidered: A Campus-Wide Focus on the Student Experience (American College Personnel Association/National Association of Student Personnel Administrators, 2004) and Greater Expectations (Association of American Colleges and Universities, 2002), two recent publications of national significance, affirm the importance of connecting the co-curriculum and the curriculum to help achieve the so-called seamless learning environment. In the purpose statement for Learning Reconsidered, the authors state that it is an argument for the integrated use of all of higher education's resources in the education and preparation of the whole student (ACPA/NASPA, 2004, p. 3). Service learning is a strong mechanism useful in this important integration. Service Learning Defined Most definitions of service learning refer to it as educational experience or a teaching method that links community service to credit-bearing course content (Brindle & Hatcher, 1995; Eyler & Giles, 1999; Jacoby, 1996). Further, definitions emphasize the importance of structured reflection as the primary means to ensure learning. According to Bowen (2005), service learning is a special form of experiential education that intertwines community service with classroom instruction, simultaneously engaging students in academic study and reflection. It has two complementary goals of service to the community and learning. He further indicated that through service learning, students enhance their intellectual, social, and ethical development as they pursue academic excellence, accept civic responsibility, and develop skills in leadership, moral decision making, and critical thinking. Service learning is congruent with the goals and foundations of affairs and, as a functional area, can provide extraordinary opportunities for professionals to help influence students' lives. What makes it unique is its capacity not only to contribute to development along a variety of learning outcome dimensions but also to encourage active engagement in academic life through the curriculum-community service continuum. There are a number of basic assumptions about learning that affairs professionals return to consistently. Each of these assumptions links in some meaningful way to service learning. 1. Learning consists of both cognitive and affective components. Both psychosocial and cognitive-structural theories of development can be specifically related to service learning. Several of Chickering and Reisser's (1993) vectors of development, which are purported to contribute to the development of identity, are directly applicable. Developing competence, developing purpose, and developing integrity are especially salient and useful in describing some of the affairs learning outcomes associated with service learning. Baxter Magolda's (2001) theory of epistemological reflection provided another context. …", "Student affairs | Curriculum | Service-learning | Service (business) | Higher education | Student engagement | Public relations | Political science | Pedagogy | Sociology | Psychology | Medical education | Medicine | Business | Law | Marketing", "Service-Learning and Community Engagement", "Education", "Social Sciences", "Social Sciences", null, false, "closed", null, null, null, 11, 9, "https://openalex.org/W36701943 | https://openalex.org/W1480666269 | https://openalex.org/W1562941381 | https://openalex.org/W1957514865 | https://openalex.org/W1968510447 | https://openalex.org/W1986815028 | https://openalex.org/W2080467464 | https://openalex.org/W2994846642 | https://openalex.org/W3013013628", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W3009348855", "https://doi.org/10.3741/jkwra.2020.53.2.97", "https://www.koreascience.or.kr:443/article/JAKO202012758284659.pdf", null, "Prediction of multipurpose dam inflow using deep learning", "article", "en", "2020-02-01", 2020, "Ji-Yoon Mok", "-", "Ji-Yoon Mok", null, null, "Journal of Korea Water Resources Association", "Korea Water Resources Association", "1226-6280", "53", "2", "97–105", null, "Inflow | Hydrology (agriculture) | Geology | Environmental science | Geotechnical engineering | Oceanography", "Hydrological Forecasting Using AI", "Environmental Engineering", "Environmental Science", "Physical Sciences", null, false, "closed", null, null, null, 8, 9, "https://openalex.org/W931395708 | https://openalex.org/W2027289922 | https://openalex.org/W2054987122 | https://openalex.org/W2471333248 | https://openalex.org/W2902870262 | https://openalex.org/W2918178295 | https://openalex.org/W2942673366 | https://openalex.org/W3021262079 | https://openalex.org/W3021441929", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2417056181", null, "http://files.eric.ed.gov/fulltext/EJ1034371.pdf", null, "Wiki Based Collaborative Learning in Interuniversity Scenarios.", "article", "en", "2014-01-01", 2014, "Elisabeth Katzlinger | Michael Herzog", "- | https://orcid.org/0000-0002-7597-2272", null, null, null, "The Electronic Journal of e-Learning", "Academic Conferences and Publishing International", "1479-4403", "12", "2", "149–160", null, "Collaborative learning | Computer science | Knowledge management", "Wikis in Education and Collaboration", "Communication", "Social Sciences", "Social Sciences", null, true, "green", null, null, null, 8, 12, "https://openalex.org/W105100130 | https://openalex.org/W1534456493 | https://openalex.org/W1967489368 | https://openalex.org/W1967560906 | https://openalex.org/W1968056517 | https://openalex.org/W1978072532 | https://openalex.org/W2009627830 | https://openalex.org/W2010033846 | https://openalex.org/W2016516551 | https://openalex.org/W2051665511 | https://openalex.org/W2076503582 | https://openalex.org/W2088487082", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2105830431", null, "https://profdoc.um.ac.ir/paper-abstract-1040304.html", null, "The Effect of Mental Imagery Focus of Attention on Performance and Learning of Children Dart Throwing Skill", "article", "en", "2014-02-12", 2014, "Amir Haghkhah | Mehdi Sohrabi | H. T. Torbati | H. H. Ghalehroudkhani | M. G. Tabar", "- | https://orcid.org/0000-0002-4820-3486 | - | - | -", null, null, null, "International journal of sport studies", null, null, "4", "2", "161–167", "Introduction and objective: Mental imagery- conscious experience by using all the sense- is to create or recreate an experience in mind .As sport psychologists have attended to different imagery techniques as a mental skill, the purpose of present research is the effect of mental imagery focus of attention and age on performance and learning of dart throwing skill. Methodology: Therefore 33 right handed male students of fourth and fifth level of primary school of Jahroom who got the best score of VMIQ-2 test were selected and divided randomly to three groups of attention of mental imagery, internal focus of attention of mental imagery, external focus of attention of mental imagery and control group. Firstly, throwing dart (dart throwing) was instructed to all participants equally and similarly, each participant of all groups did 5 throwing in 3 blocks to dart board in pretest. Then all participants of 3 groups (internal and external focus of attention) did their related imagery for 8 session and 5 minutes for each session. Post test was taken like pretest at the end of sixth session. Delayed retention test were taken after 48 hours of last session of last throwing. One way ANOVA and two ways ANOVA and LSD post hoc test were used for analyzing the data and excel software were used to draw graphs (Significant Level: P<0/05). Finding: The results showed that imagery of internal and external focus of attention improved the children performance. But it was not observed any significant difference between two experimental groups and control group in retention stage. Conclusion: As children performance were improved by mental imagery of internal and external focus of attention, therefore it is recommended to coaches and instructors that they use imagery focus of attention in cognitive skills training with stable environments such as dart for children.", "Throwing | Session (web analytics) | Mental image | Psychology | Test (biology) | Cognitive psychology | Cognition | Applied psychology | Focus (optics) | Developmental psychology | Computer science", "Sport Psychology and Performance", "Developmental and Educational Psychology", "Psychology", "Social Sciences", null, false, "closed", null, null, null, 8, 14, "https://openalex.org/W345884345 | https://openalex.org/W576483427 | https://openalex.org/W1570088265 | https:/ ull, 7, 2, "https://openalex.org/W2164788747 | https://openalex.org/W2171075083", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W1564219419", null, "http://www.absronline.org/journals/index.php/masr/article/download/50/63", null, "The Relationship between Organizational Learning and Organizational Commitment in Sport Organizations", "article", "en", "2013-11-19", 2013, "Somayeh Usefi | Rasool Nazari | Tayebeh Zargar", "- | https://orcid.org/0000-0002-1853-9712 | https://orcid.org/0000-0002-1595-9324", null, "Islamic Azad University, Science and Research Branch | Islamic Azad University, Isfahan | Islamic Azad University South Tehran Branch", "IR", "Management and administrative sciences review", null, "2308-1368", "2", "6", "682–688", "The Purpose of this paper is investigating the relationship between organizational learning and organizational commitment in sports organizations in Kurdistan Province. This study is a descriptive correlation survey. Statistical population involving in the present study were all the staff members of the Kurdistan sports organizations. Using the simple random sampling method and Kerjesy and Morgan table, 105 participants were selected as the sample of this study. Organizational learning and organizational commitment questionnaires were used to collect the related and necessary data. The Reliability coefficients of these questionnaires were 0.83 and 0.85 respectively. To do data analysis several tests including Pearson Correlated Coefficient and multiple regressions analysis were used. The results showed that there is a positive and significant relationship between organizational learning and organizational commitment of the sports organizations staff members in Kurdistan province(r = 0.33). The results of the multiple regressions analysis also indicated that among the different aspects of organizational learning, the knowledge sharing aspect has the most correlation with continuous organizational commitment of the staff n a window to a world of engagement, motivation, success and deeper understanding.", "Creativity | Learning environment | Mathematics education | Computer science | Window (computing) | 21st century skills | Psychology | Knowledge management | Social psychology", "Educational Games and Gamification", "Developmental and Educational Psychology", "Psychology", "Social Sciences", null, true, "green", null, null, null, 6, 9, "https://openalex.org/W8837572 | https://openalex.org/W124525764 | https://openalex.org/W1504190881 | https://openalex.org/W1966937508 | https://openalex.org/W1984159977 | https://openalex.org/W2043558955 | https://openalex.org/W2074002977 | https://openalex.org/W2123184471 | https://openalex.org/W2338982868", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2112481943", null, "https://www.iiste.org/Journals/index.php/RHSS/article/download/25143/25747", null, "The Impact of Climate Change on African Traditional Religious Practices", "article", "en", "2015-01-01", 2015, "U Fabian Nnandi | Nche George Chrıstıan", "- | -", null, null, null, "Research on humanities and social sciences", "IISTE", "2224-5766", "5", "15", "30–35", "Developing countries especially in the African continent are bearing the brunt of the impact of climate change. However, what have not been brought to the fore are the impacts of the phenomenon of climate change on African traditional religious practices. This paper, therefore attempts to critically evaluate the impact of climate change on African traditional religious practices. This study is based on two basic assumptions-first, the African traditional religion employs natural elements as mode of expression of its faith. Secondly, the African world is suffused with religion. Using a critical phenomenological method of analysis, it was found that African traditional religion has directly and indirectly been affected by the consequences of climate change in Africa. The paper, however, recommended among other things, Journal of Distance Education", "Anadolu University", "1302-6488", "14", "2", "150–164", "This paper arose from a two-year study of the KissanKerala, the e-learning project underway in Kerala, a small state in India. It is more conspicuous when we learn that the KissanKerala project is able to disseminate agricultural information also among digital immigrants. Since 2003, the KissanKerala has been providing advisory services to the farming community in Kerala using a combination of technologies. Salient features of the project are discussed. Noteworthy are its interactive web portal and the online agri-video channel that uses the video sharing platform of YouTube. In this paper, we look at the e-learning strategies adopted; virtual learning environments created and also discuss participative tools used for communication. We have also made an impact-study of the project with a large number of beneficiaries. We learn that the Kissan Kerala is one of the most successful learning projects undertaken in distance mode in India.", "Agriculture | Digital learning | Dissemination | Computer science | Salient | Immigration | Educational technology | Digital divide | Knowledge management | Multimedia | World Wide Web | The Internet | Political science | Sociology | Geography | Telecommunications | Pedagogy", "ICT in Developing Communities", "Information Systems", "Computer Science", "Physical Sciences", null, false, "closed", null, null, null, 5, 7, "https://openalex.org/W339954380 | https://openalex.org/W1489327262 | https://openalex.org/W1544610587 | https://openalex.org/W2078776411 | https://openalex.org/W2315149532 | https://openalex.org/W2484930060 | https://openalex.org/W3168638804", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2278806004", null, "http://files.eric.ed.gov/fulltext/ED560791.pdf", null, "A Transfer Learning Approach for Applying Matrix Factorization to Small ITS Datasets.", "article", "en", "2015-06-01", 2015, "Lydia Voß | Carlotta Schatten | Claudia Mazziotti | Lars Schmidt-Thieme", "- | - | - | https://orcid.org/0000-0001-5729-6023", null, "University of Hildesheim | Ruhr University Bochum", "DE", "Educational Data Mining", null, null, null, null, "372–375", "Machine Learning methods for Performance Prediction in Intelligent Tutoring Systems (ITS) have proven their efficacy; specific methods, e.g. Matrix Factorization (MF), however suffer from the lack of available information about new tasks or new students. In this paper we show how this problem could be solved by applying Transfer Learning (TL), i.e. combining similar but not equal datasets to train Machine Learning models. In our case we obtain promising results by combining data collected of German fractions’ tasks (517 interactions, 88 students, 20 tasks) with their nonexact translation of a previously American US version (140 interactions, 14 students, 16 tasks). In order to do so we also analyze the performance of MF based predictors on smaller ITS’ samples evaluating their usefulness.", "Computer science | Transfer of learning | Machine learning | Artificial intelligence | Matrix decomposition | German | Factorization | Machine translation | Training set | Algorithm", "Intelligent Tutoring Systems and Adaptive Learning", "Artificial Intelligence", "Computer Science", "Physical Sciences", null, false, "closed", null, null, null, 5, 10, "https://openalex.org/W54435281 | https://openalex.org/W123693119 | https://openalex.org/W1031693081 | https://openalex.org/W1986614398 | https://openalex.org/W1988139567 | https://openalex.org/W2026314833 | https://openalex.org/W2165698076 | https://openalex.org/W2211922800 | https://openalex.org/W2398156732 | https://openalex.org/W2579268008", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W1591227091", null, "https://globaljournals.org/GJSFR_Volume14/2-The-Effects-and-Linkages-of-Deforestation.pdf", null, "The Effects and Linkages of Deforestation and Temperature on Climate Change in Nigeria", "article", "en", "2015-01-19", 2015, "Ojekunle Olusheyi Zaccheaus", "-", "Ojekunle Olusheyi Zaccheaus", null, null, "Global Journal of Human Social Science", "Global Journals", "0975-5896", "14", "6", null, "Deforestation has a negative impact on the immediate environment and on the global scale, climate change. This paper is aimed at assessing the effect of deforestation to temperature and invariably on climate change in Nigeria. It discussed the rates of deforestation in Nigeria and globally; climate change in Nigeria; impact of extreme weather events in Nigeria; the effect of deforestation with respect to temperature change; the greenhouse gas (GHG) emissions attributed to deforestation in Nigeria; the obvious relationship between deforestation, temperature and climate change; and the mitigate measures to deforestation nationally and globally. The research considered an extended Eighty years period for this work because it capture the period when climate change signals were not an issue (1901-1938) and when they are stronger (1971-2012).", "Deforestation (computer science) | Climate change | Greenhouse gas | Environmental science | Global warming | Climatology | Natural resource economics | Land use, land-use change and forestry | Geography | Environmental protection | Agriculture | Economics | Ecology", "Energy and Environment Impacts", "Pollution", "Environmental Science", "Physical Sciences", null, true, "green", null, null, null, 5, 4, "https://openalex.org/W2184545814 | https://openalex.org/W2260948571 | https://openalex.org/W2338455010 | https://openalex.org/W2573699283", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2003558091", null, "https://dblp.uni-trier.de/db/conf/mipro/mipro2012.html#Vejacka12", null, "Introduction to electronic banking by eLearning methods", "article", "en", "2012-05-21", 2012, "Martin Vejačka", "https://orcid.org/0000-0002-9761-7597", "Martin Vejačka", "Technical University of Košice", "SK", "International Convention on Information and Communication Technology, Electronics and Microelectronics", null, null, null, null, "1220–1225", "With advances in the use of ICT in education, the education areas extend. With the introduction of electronic banking, there was a need to include theoretical knowledge and practical skills in this area into the educational process. At our faculty, obligatory course of Electronic Services in Banking is provided to our students. Students can try the operation of electronic banking on virtual Electronic Online Bank. This course is based on eLearning methods (using LMS, use of virtual bank by students, training videos etc.). Students have the opportunity to come into contact with various forms of electronic services in banking (from already technologically obsolete to new emerging ones). This course increases the awareness of electronic banking among the young generation, which usually just opens its first current accounts in banks. The emphasis is on safety and security of electronic banking services, including the principles of electronic signature. Our course also provides to students the experience of electronic signature usage in other areas, besides of banking services. This supports the use of e-Identity in the e-Government among the future users of these services. During the year 2011 was conducted electronic questionnaire survey on students' awareness of electronic banking services before and after the completion of course. The results serve as feedback, which provides important suggestions for changes in the educational process.", "Government (linguistics) | Electronic banking | Process (computing) | Business | Electronic signature | Information and Communications Technology | Computer science | The Internet | Knowledge management | Internet privacy | World Wide Web", "Web and Library Services", "Information Systems", "Computer Science", "Physical Sciences", null, false, "closed", null, null, null, 4, 2, "https://openalex.org/W2104083999 | ystems", null, null, "28", null, "3582–3590", "In past few years, several techniques have been proposed for training of linear Support Vector Machine (SVM) in limited-memory setting, where a dual block-coordinate descent (dual-BCD) method was used to balance cost spent on I/O and computation. In this paper, we consider the more general setting of regularized Empirical Risk Minimization (ERM) when data cannot fit into memory. In particular, we generalize the existing block minimization framework based on strong duality and Augmented Lagrangian technique to achieve global convergence for general convex ERM. The block minimization framework is flexible in the sense that, given a solver working under sufficient memory, one can integrate it with the framework to obtain a solver globally convergent under limited-memory condition. We conduct experiments on L1-regularized classification and regression problems to corroborate our convergence theory and compare the proposed framework to algorithms adopted from online and distributed settings, which shows superiority of the proposed approach on data of size ten times larger than the memory capacity.", "Solver | Computer science | Block (permutation group theory) | Coordinate descent | Empirical risk minimization | Mathematical optimization | Minification | Convergence (economics) | Dual (grammatical number) | Support vector machine | Augmented Lagrangian method | Computation | Strong duality | Algorithm | Theoretical computer science | Optimization problem | Artificial intelligence | Mathematics", "Sparse and Compressive Sensing Techniques", "Computational Mechanics", "Engineering", "Physical Sciences", null, false, "closed", null, null, null, 3, 28, "https://openalex.org/W56897548 | https://openalex.org/W1786935204 | https://openalex.org/W1842774583 | https://openalex.org/W1946315329 | https://openalex.org/W1962147060 | https://openalex.org/W1969048569 | https://openalex.org/W1970576786 | https://openalex.org/W2030188598 | ht science studies, statins inhibit cancer growth through various pathways. These observations raise the following question: Could statins lower cancer- mortality? Danish researchers used national databases to address this question.\n\nAmong nearly 300,000 people who received cancer diagnoses between 1995 and 2007, 6% …", "Medicine | Danish | Cancer | Anticancer drug | Cancer drugs | Statin | Drug | Pharmacology | Internal medicine", "Cancer, Lipids, and Metabolism", "Cancer Research", "Biochemistry, Genetics and Molecular Biology", "Life Sciences", null, false, "closed", null, null, null, 2, 2, "https://openalex.org/W2059563043 | https://openalex.org/W2157624452", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W1556237977", null, "https://www.gastrocol.com/file/Revista/v24n2a07.pdf", null, "Risk factors for gastric cancer in Colombian patients", "article", "en", "2009-06-01", 2009, "Martín Gómez Zuleta | William Otero Regino | Xiomara Ruiz Lobo", "- | https://orcid.org/0000-0002-6825-9014 | -", null, "Universidad Nacional de Colombia", "CO", "Revista Colombiana de Gastroenterología", null, "0120-9957", "24", "2", "134–143", "1 Profesor de Medicina, Unidad de Gastroenterologia, Universidad Nacional de Colombia, Gastroenterologo, Hospital El Tunal, Bogota, Colombia. 2 Profesor de Medicina, Unidad de Gastroenterologia, Universidad Nacional de Colombia, Gastroenterologo, Clinica Fundadores, Clinica Carlos Lleras Restrepo, Fundacion Hospital San Carlos, Bogota, Colombia. 3 Gastroenterologa, Hospital El Tunal, SaludCoop, Hospital Fundacion San Carlos, Bogota, Colombia.", "Medicine | Cancer | Gynecology | Demography | Internal medicine | Sociology", "Helicobacter pylori-related gastroenterology studies", "Surgery", "Medicine", "Health Sciences", null, true, "green", null, null, null, 2, 1, "https://openalex.org/W2397244273", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W1985009422", "https://doi.org/10.11634/232907811604305", "http://wscholars.com/index.php/ajhss/article/view/305", null, "Effective Science Learning through Restructuring and Reconstruction from the Knowledge Soup", "article", "en", "2013-05-30", 2013, "Kunle Oke Oloruntegbe", "-", "Kunle Oke Oloruntegbe", "Adekunle Ajasin University", "NG", "American Journal of Business and Management", null, "2167-9606", "1", "2", "63–66", "Authentic and meaningful science learning can be achieved when students are given the opportunity to organize, reorganize and restructure their learning from the knowledge soup. This is the focus of this paper that investigated how the performance of undergraduate science students could be enhanced when they construct and monitor their own learning individually and in team. It was a case study of 22 integrated science students’ learning of Organic Compounds I and II courses, facilitated and monitored in two semesters. The students were assigned specific tasks individually on the course outlines which they presented one after the other in two hours’ lectures a week that lasted for 12 weeks in the first semester. In the second semester, tasks were assigned on team (5 groups of 4 or 5) basis and were presented as projects and seminars on power points followed by discussion and interactive sessions two hours a week for another 12 weeks. Instruments for data collection included the moderated semester examination questions with marking schemes, class assignments and tests which assessed the depth of individual and team works, skills of presentation and quality of contributions to class discussions. The analysis of data revealed good performances in the two semesters but a better one during the second semester when the students worked in teams. Appropriate conclusion was drawn and recommendations made. This study calls for reawakening of learners’ initiated, student-centered pedagogy which is gradually fading away in our science classrooms. Normal 0 false false false EN-US X-NONE AR-SA /* Style Definitions */\r\n table.MsoNor //orcid.org/0000-0001-7096-5244", null, "University of Technology Malaysia", "MY", "RePEc: Research Papers in Economics", "Federal Reserve Bank of St. Louis", null, "2", "1", "30–38", "Teaching a language is a complicated process which requires considering and applying a method while performing it and is conducted through a method in a language class. A teaching methodology refers to the way or method in which a teacher teaches the learners. The methodology used by the teacher will determine the kinds of work and activities the students will do in class and how well or how poorly the student or learner will be able to learn and use the language. Thus it is imperative that the method or approach used in the classroom meet the needs of the learners. This paper aims to discuss the communicative language teaching method and its application in the EFL context.", "Class (philosophy) | Communicative language teaching | Context (archaeology) | Process (computing) | Computer science | Language education | Mathematics education | Teaching method | Language acquisition | Pedagogy | Psychology | Artificial intelligence", "EFL/ESL Teaching and Learning", "Language and Linguistics", "Arts and Humanities", "Social Sciences", null, true, "green", null, null, null, 2, 16, "https://openalex.org/W306019389 | https://openalex.org/W1589643853 | https://openalex.org/W1980475538 | https://openalex.org/W2039701228 | https://openalex.org/W2060765064 | https://openalex.org/W2089064175 | https://openalex.org/W2102275099 | https://openalex.org/W2139248229 | https://openalex.org/W2140927931 | https://openalex.org/W2145998149 | https://openalex.org/W2159083213 | https://openalex.org/W2163129382 | https://openalex.org/W2332879051 | https://openalex.org/W2906476564 | https://openalex.org/W2979167311 | https://openalex.org/W3024872663", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W1523314646", "https://doi.org/10.22110/jkums.v17i12.1301", "http://journals.kums.ac.ir/ojs/index.php/jkums/article/download/1301/3269", null, "Comparison of organizational learning capabilities of the personnel in public and private sector hospitals of Kermanshah", "article", "en", "2014-03-04", 2014, "Homayoun Abbasi | Hossien Eydi | Behzad Karami Matin", "- | - | https://orcid.org/0000-0002-8432-2079", null, "Razi University | Kermanshah University of Medical Sciences", "IR", "Majallah-i dānishgāh-i ̒ulūm-i pizishkī-i Kirmānshāh", "Kermanshah University of Medical Sciences and Health Services", "2251-9068", "17", "12", "797–803", "Background: Hospitals are among the most interactive organizations in which the rate of knowledge transfer and learning is considerably high. The investigation of the level of organizational learning between public and private sector hospitals can be useful for managers to select proper organizational learning strategies aiming at improving service delivery and organizational behaviour (1). This study was carried out to compare the organizational learning capabilities of the personnel in public and private sector hospitals of Kermanshah. Methods: This descriptive survey was performed on the personnel in public and private sector hospitals of Kermanshah. According to Krejcie and Morgan’s table, 175 employees were selected via stratified random sampling from 6 public and 2 private hospitals. The instrument for gathering data was Organizational Learning Capability Questionnaire (OLCQ) by Gomez et al. (2005) (2). Data were analysed by inferential statistics (K-S test, Levene’s test, t-test, one-way ANOVA using SPSS software (version 20.00).  Results: The level of organizational learning capabilities of personnel was higher in the private hospitals than in public hospitals, indicating a statistically significant difference between them (T (26) = 11.779, P 0.01، F (3, 68) = 1.859).   Conclusion: With regard to the higher average of knowledge transfer and integration than the other capabilities in public and private hospitals, it seems that the managers of hospitals should make use of this component to promote the organizational knowledge of the personnel and improve other organizational learning capabilities too.", "Organizational learning | Stratified sampling | Private sector | Public sector | Descriptive statistics | Business | Test (biology) | Knowledge management | Statistics | Computer science | Political science | Mathematics", "Organizational Learning and Leadership", "Organizational Behavior and Human Resource Management", "Business, Management and Accounting", "Social Sciences", null, false, "closed", null, null, null, 2, 19, "https://openalex.org/W595538466 | https://openalex.org/W1736209534 | https://openalex.org/W1981704787 | https://openalex.org/W1988711955 | https://openalex.org/W2022478588 | https://openalex.org/W2028320705 | https://openalex.org/W2054904029 | https://openalex.org/W2059600806 | https://openalex.org/W2084535393 | https://openalex.org/W2102128106 | https://openalex.org/W2103557323 | https://openalex.org/W2111523254 | https://openalex.org/W2169233382 | https://openalex.org/W2208533531 | https://openalex.org/W2279956806 | https://openalex.org/W2301552510 | https://openalex.org/W2642534790 | https://openalex.org/W3122794957 | https://openalex.org/W3149594025", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2156923179", null, "http://www.ijrr.com/article-1-38-en.pdf", null, "Logistic discriminant analysis of breast cancer using ultrasound measurements", "article", "en", "2004-06-15", 2004, "P Abd Almaleki | Manijhe Mokhtari‐Dizaji | M R Vahead | M Giti", "- | https://orcid.org/0000-0003-1598-2038 | - | -", null, "Tarbiat Modares University", "IR", "Iranian Journal of radiation research/Iranian journal of radiation research", null, "1728-4554", "2", "1", "27–34", "Background: Logistic discriminant method was applied to differentiate malignant from benign in a group of patients with proved breast lesions on the base of ultrasonic parameters. Materials and Methods: Our database include 273 patients' ultrasonographic pictures consist- ing of 14 quantitative variables. The measuered variables were ultrasound propagation velocity, acoustic impedence and attenuation coefficient at 10 MHz in breast lesions at 20, 25, 30 and 35 oC temperature, physicsl density and age. This database was randomly divided into the estima- tion of 201 and validation of 72 samples. The estimation samples were used to build the logistic discriminant model, and validation samples were used to validate the performance. Finally, im- portant criteria such as sensitivity, specificity, accuracy and area under the receiver operating characteristic curve (ROC) were evaluted. Results: Our results showed that the logistic discriminant method was able to classify correctly 67 out of 72 cases presented in the validation sample. The results indicate a remarkable diag- nostic accuracy of 93%. Conclusion: A logistic discriminantor approach enable to predict the probability of malignancy of breast cancer using features extracted from ultrasonic measurement on ultrasound imaging is established.", "Medicine | Receiver operating characteristic | Linear discriminant analysis | Logistic regression | Breast cancer | Ultrasound | Mammography | Radiology | Malignancy | Ultrasonic sensor | Discriminant | Statistics | Pattern recognition (psychology) | Cancer | Artificial intelligence | Mathematics | Pathology | Internal medicine | Computer science", "AI in cancer detection", "Artificial Intelligence", "Computer Science", "Physical Sciences", null, false, "closed", null, null, null, 1, 24, "https://openalex.org/W99479793 | https://openalex.org/W1887246402 | https://openalex.org/W1973948212 | https://openalex.org/W1977549745 | https://openalex.org/W1978828706 | https://openalex.org/W2001854524 | https://openalex.org/W2024450724 | https://openalex.org/W2024586000 | https://openalex.org/W2039408393 | https://openalex.org/W2047263310 | https://openalex.org/W2063400545 | https://openalex.org/W2069299713 | https://openalex.org/W2080291572 | https://openalex.org/W2085695360 | https://openalex.org/W2105967067 | https://openalex.org/W2107784689 | https://openalex.org/W2123162799 | https://openalex.org/W2130043895 | https://openalex.org/W2147132538 | https://openalex.org/W2163287977 | https://openalex.org/W2169753989 | https://openalex.org/W2409843805 | https://openalex.org/W2464069770 | https://openalex.org/W2727255814", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2278844793", null, "https://cyberleninka.ru/article/n/learning-in-the-field-of-problem-based-training.pdf", null, "Learning in the field of problem-based training", "article", "en", "2014-01-01", 2014, "Linkov Alexander Yordanov", "-", "Linkov Alexander Yordanov", null, null, "European Science Review", "Premier Publishing", "2310-5577", null, null, null, null, "Field (mathematics) | Training (meteorology) | Computer science | Psychology | Mathematics education | Artificial intelligence | Physics | Mathematics", "Learning Styles and Cognitive Differences", "Developmental and Educational Psychology", "Psychology", "Social Sciences", null, false, "closed", null, null, null, 1, 1, "https://openalex.org/W2041328937", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2767821402", null, "https://escholarship.org/uc/item/69m5249f.pdf", null, "Spatial Variability in Serial Response Learning and Performance by Pigeons ()", "article", "en", "2014-01-01", 2014, "Walter T. Herbranson | Patricia M. Xi | Yvan T. Trinh", "https://orcid.org/0000-0001-5858-0712 | https://orcid.org/0000-0003-4155-4440 | -", null, null, null, "International Journal of Comparative Psychology", "eScholarship Publishing, University of California", "0889-3667", "27", "2", null, "Pigeons can learn structured sequences of cued responses and perform them quickly, even when random variability is later introduced into the originally learned sequence, making some cue locations unpredictable. In order to determine if initial learning shows the same tolerance of spatial variability as steady-state performance, naive pigeons were trained on random distortions around a structured sequence without having seen the original sequence itself. Learning was possible, but accommodated less variability than did performance of the same sequence previously learned in an undistorted context. Analysis of results indicated that performance of a randomly distorted sequence is best when birds are initially trained with little or no variability, and randomness is later introduced in a gradual fashion.", "Sequence (biology) | Randomness | Sequence learning | Context (archaeology) | Cued speech | Random sequence | Psychology | Communication | Artificial intelligence | Cognitive psychology | Computer science | Biology | Statistics | Mathematics", "Animal Behavior and Reproduction", "Ecology, Evolution, Behavior and Systematics", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", "cc-by", null, null, 1, 22, "https://openalex.org/W1979455727 | https://openalex.org/W1984214648 | https://openalex.org/W1985454926 | https://openalex.org/W2009360125 | https://openalex.org/W2014992212 | https://openalex.org/W2021625970 | https://openalex.org/W2025539352 | https://openalex.org/W2029636294 | https://openalex.org/W2037578987 | https://openalex.org/W2041865272 | https://openalex.org/W2042567923 | https://openalex.org/W2047431989 | https://openalex.org/W2052779118 | https://openalex.org/W2056915253 | https://openalex.org/W2066752591 | https://openalex.org/W2067242602 | https://openalex.org/W2081965739 | https://openalex.org/W2114453142 | https://openalex.org/W2145070660 | https://openalex.org/W2159746264 | https://openalex.org/W2168371949 | https://openalex.org/W2280799025", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W1602791564", null, "https://www.questia.com/library/journal/1P3-1319925301/researching-language-aspects-preferences-of-english", null, "Researching Language Aspects' Preferences of English Department Students When Learning Culture", "article", "en", "2007-06-01", 2007, "Syaifur Rochman", "-", "Syaifur Rochman", null, null, "K@ta", "Petra Christian University", "1411-2639", "9", "1", "49", "(A Case Study of Students Taking a Course called Introductory to British Studies at Jenderal Soedirman University) Abstract: Communicating in English covers two aspects: 'system' referring to syntactic and semantics elements; and 'schemata' referring to appropriateness based on the social cultural contexts of native speakers. It is, therefore, very essential to teach cultural aspects when teaching English as a foreign language. This article describes a survey to investigate students' opinions on which cultural aspects that should be learned. Key words: culture, English as a Foreign Language (EFL) The teaching of EFL cannot ignore cultural elements, particularly those of the Anglo-Saxon countries where people speak English as their native language. The concept of target-language culture has been advocated for being taught to students in EFL settings, such as for English Department students in Indonesia. However, in Indonesia some people still think that learning EFL has to be separated from learning its culture (Rochman, 2002). This is due to the fact that some elements of English culture are not in accordance with - even contradict to - the local values (Alptekin & Alptekin, 1984). Meanwhile, language uses, as Prodomou (1992) states, actually reflect their culture so it is impossible to disassociate them in any real sense. Therefore, the cross-cultural matters in language teaching may become a potential conflict in EFL teaching. The harmony between the culture-specific aspects of English and the local values often undergoes a kind of conflict when one begins to learn EFL (Alptekin, 1993). A student of EFL who has never experienced in the target-language culture will most likely encounter problems in processing English systemic data of unfamiliar contexts, for instance 'pub' for Indonesian students. Pub is normally used in the mind of the native-speaker of English as a place for socializing. The natural tendency for the Indonesian students is to access the meaning of this word by respecting to their own cultural system. As a result, it is possible that students will react to the pub context with less than full comprehension; even it may contradict to the real meaning as they may think that pub is a bad place where people get drunk. Wallace (1988) attributes this problem as the lack of 'cultural competence', i.e. a very complex package of beliefs, knowledge, feelings, attitudes, and behaviours of the target culture. Naturally, students of EFL make use of culture-specific schemas in relating input to what they already know, and to construct the target language meaning (Alptekin, 1993). Hyde (1994) warns that students in an EFL situation might feel learning the target language to be hard and frustrating experience when the relevant cultural background assumptions are missing. Thus, culture plays a major role in the learning process, which in turn significantly affects comprehension and interpretation of the target language. Language has no function independently of the social contexts in which it is used (Askadou et.al., 1990). In the case of EFL, such contexts are various as there are numerous English-speaking countries in the world. Similarly, the schematic knowledge of the speakers of such contexts is quite diverse. Hence, to confine English to one of its native setting and to present that setting in a stereotypical manner is not possible. Consequently, EFL learners are likely to find themselves difficult in tackling unfamiliar information when coping with systemic data to an appropriate target language culture (Alptekin, 1993). To build conceptual comprehension between the culturally familiar aspects and the unfamiliar ones is essential (Fairclough, 1992). This can be built, through the use of comparisons as techniques of cross-cultural comprehension, or the exploitation of universal concepts of human experience as reference points for the interpretation of unfamiliar data. …", "Foreign language | Harmony (color) | Psychology | Target culture | First language | Linguistics | Pedagogy | Language education | Language transfer | Sociology | Comprehension approach", "EFL/ESL Teaching and Learning", "Language and Linguistics", "Arts and Humanities", "Social Sciences", null, true, "green", "cc-by", null, null, 1, 10, "https://openalex.org/W616008064 | https://openalex.org/W1561338230 | https://openalex.org/W1990338138 | https://openalex.org/W1993733394 | https://openalex.org/W2022552474 | https://openalex.org/W2039701228 | https://openalex.org/W2124408846 | https://openalex.org/W2136909566 | https://openalex.org/W2198068274 | https://openalex.org/W2987687634", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W3088180619", null, "https://www.aclweb.org/anthology/D14-2002/", null, "Spectral Learning Techniques for Weighted Automata, Transducers, and Grammars", "article", "en", "2014-10-01", 2014, "Borja Balle | Ariadna Quattoni | Xavier Carreras", "https://orcid.org/0009-0003-8726-2803 | - | https://orcid.org/0000-0001-7432-4540", null, "Universitat Politècnica de Catalunya | Xerox (France)", "ES | FR", "Empirical Methods in Natural Language Processing", null, null, null, null, null, "In recent years we have seen the development of efficient and provably correct algorithms for learning weighted automata and closely related function classes such as weighted transducers and weighted context-free grammars. The common denominator of all these algorithms is the so-called spectral method, which gives an efficient and robust way to estimate recursively defined functions from empirical estimations of observable statistics. These algorithms are appealing because of the existence of theoretical guarantees (e.g. they are not susceptible to local minima) and because of their efficiency. However, despite their simplicity and wide applicability to real problems, their impact in NLP applications is still moderate. One of the goals of this tutorial is to remedy this situation.The contents that will be presented in this tutorial will offer a complementary perspective with respect to previous tutorials on spectral methods presented at ICML-2012, ICML-2013 and NAACL-2013. Rather than using the language of graphical models and signal processing, we tell the story from the perspective of formal languages and automata theory (without assuming a background in formal algebraic methods). Our presentation highlights the common intuitions lying behind different spectral algorithms by presenting them in a unified framework based on the concepts of low-rank factorizations and completions of Hankel matrices. In addition, we provide an interpretation of the method in terms of forward and backward recursions for automata and grammars. This provides extra intuitions about the method and stresses the importance of matrix factorization for learning automata and grammars. We believe that this complementary perspective might be appealing for an NLP audience and serve to put spectral learning in a wider and, perhaps for some, more familiar context. Our hope is that this will broaden the understanding of these methods by the NLP community and empower many researchers to apply these techniques to novel problems.The content of the tutorial will be divided into four blocks of 45 minutes each, as follows. The first block will introduce the basic definitions of weighted automata and Hankel matrices, and present a key connection between the fundamental theorem of weighted automata and learning. In the second block we will discuss the case of probabilistic automata in detail, touching upon all aspects from the underlying theory to the tricks required to achieve accurate and scalable learning algorithms. The third block will present extensions to related models, including sequence tagging models, finite-state transducers and weighted context-free grammars. The last block will describe a general framework for using spectral techniques in more general situations where a matrix completion pre-processing step is required; several applications of this approach will be described.", "Computer science | Formal language | Automaton | Theoretical computer science | Context (archaeology) | Algebraic number | Rule-based machine translation | Rank (graph theory) | Algorithm | Perspective (graphical) | Artificial intelligence | Algebra over a field | Mathematics", "Machine Learning and Algorithms", "Artificial Intelligence", "Computer Science", "Physical Sciences", null, false, "closed", null, null, null, 1, 57, "https://openalex.org/W68810593 | https://openalex.org/W164910094 | https://openalex.org/W178507189 | https://openalex.org/W1167457763 | https://openalex.org/W1528086278 | https://openalex.org/W1540337045 | https://openalex.org/W1559990457 | https://openalex.org/W1560796813 | https://openalex.org/W1574851760 | https://openalex.org/W1604021599 | https://openalex.org/W1632114991 | https://openalex.org/W1641052337 | https://openalex.org/W1679405140 | https://openalex.org/W1825640910 | https://openalex.org/W1898359618 | https://openalex.org/W1918870341 | https://openalex.org/W2014565165 | https://openalex.org/W2049633694 | https://openalex.org/W2089951031 | https://openalex.org/W2097150846 | https://openalex.org/W2099565408 | https://openalex.org/W2103581346 | https://openalex.org/W2103972604 | https://openalex.org/W2105724942 | https://openalex.org/W2106005123 | https://openalex.org/W2117756735 | https://openalex.org/W2121142987 | https://openalex.org/W2125124498 | https://openalex.org/W2125838338 | https://openalex.org/W2135090412 | https://openalex.org/W2138153286 | https://openalex.org/W2140351241 | https://openalex.org/W2140756703 | https://openalex.org/W2142496058 | https://openalex.org/W2143995218 | https://o hey were introduced to the Morris water maze to locate on fixed hidden platform during 4 trials/day for 5 days. Probe test was applied to evaluate the memory retrieval. In the second phase the same procedure was repeated after 20 days. The measured parameters were the time elapsed and distance passed in during the maze searching. Results: Our findings indicated that in the first phase of experiment, the time elapsed and distance passed for the CO group were decreased compared to the ALZ group. In the second phase, however, significant variation was observable between the two tested groups. There was no significant difference between the performance of the CO and ALZ groups in probe trial testing. Conclusion: It seems that the behavioral training positively influenced the maze learning in the ALZ subjects so that however both groups behaved similarly in the second phase of the experiment.", "Saline | Morris water navigation task | Psychology | Water maze | Adult male | Medicine | Audiology | Developmental psychology | Anesthesia | Neuroscience | Internal medicine | Hippocampus", "Alzheimer's disease research and treatments", "Physiology", "Medicine", "Health Sciences", null, false, "closed", null, null, null, 1, 23, "https://openalex.org/W1554535382 | https://openalex.org/W1966640678 | https://openalex.org/W1967774489 | https://openalex.org/W1975433195 | https://openalex.org/W1979566978 | https://openalex.org/W1984996311 | https://openalex.org/W1997237275 | https://openalex.org/W2005170723 | https://openalex.org/W2013775559 | https://openalex.org/W2025322473 | https://openalex.org/W2032642557 | https://openalex.org/W2040367983 | https://openalex.org/W2052742260 | https://openalex.org/W2056648984 | https://openalex.org/W2068318042 | https://openalex.org/W2070503901 | https://openalex.org/W2075568717 | https://openalex.org/W2089828740 | https://openalex.org/W2122424729 | https://openalex.org/W2131819352 | https://openalex.org/W2143338978 | https://openalex.org/W2161932 ts (eighteen men and four women) were studied. In the pharyngeal group, before treatment, only ‘roughness’ component of GRBAS had strong positive correlations with VHI domains and total VHI scores (P .60). However, after treatment most parameters of GRBAS and VHI were strongly correlated (P .60). In the laryngeal group strong correlations were found between all the parameters of GRBAS and VHI both before and after treatment. All VHI and GRBAS scores were significantly different (P < .05) between the pharyngeal and laryngeal cohort before treatment, while after treatment only roughness, breathiness, asthenia, and strain were significantly different.\r\nConclusion: VHI and GRBAS are two common tools used for voice assessment. In laryngeal cancer even a small complaint should be treated with high index of suspicion indicating a thorough evaluation (strong positive correlation). However, in pharyngeal cancer any gross change in voice should be evaluated (positive correlation).", "Medicine | Breathy voice | Larynx | Cohort | Cancer | Cohort study | Correlation | Surgery | Audiology | Internal medicine | Phonation", "Voice and Speech Disorders", "Physiology", "Medicine", "Health Sciences", null, false, "closed", null, null, null, 0, 9, "https://openalex.org/W2002576393 | https://openalex.org/W2068260342 | https://openalex.org/W2071643313 | https://openalex.org/W2091593456 | https://openalex.org/W2142299338 | https://openalex.org/W2336794604 | https://openalex.org/W2418455358 | https://openalex.org/W2938565214 | https://openalex.org/W2973515423", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W3196488503", "https://doi.org/10.4025/dialogos.v25i2.145", "https://revista-uem.uno/index.php/Dialogos/article/download/145/141", null, "Developing a Learning Module with Multicultural Content: A Source of Learning in the Millennial Era", "article", "en", "2021-09-03", 2021, "Sifa | I Wayan Rasna | Ida Bagus Putrayasa | Gde Artawan", "- | - | - | -", null, "Universitas
