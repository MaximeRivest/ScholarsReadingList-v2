efaira. The key results of the study focus upon the indices and values of windows and shading devices, that helps in achieving the optimum balance between daylighting and energy consumption in an office building in warm and humid climate. This study will determine the most favorable combination of window and other associated factors towards optimum balance between daylighting and energy efficiency. The future studies can be based on dynamic fenestration system design to improve the energy efficiency while allowing daylighting."], ["https://openalex.org/W3164709274", "Terminology of Computational Linguistics in Terms of Indexing and Information Retrieval in the System \"iSybislaw\".", 2021, "article", 0, "Language and Culture", null], ["https://openalex.org/W3161109655", "Building the Post-Traumatic Nation: Mourning and Melancholia in Korean Films about the Gwangju Massacre", 2021, "article", 0, "Asian Culture and Media Studies", null], ["https://openalex.org/W3165108173", "FORUM INTEGRATED WITH REAL-TIME TRANSLATION", 2021, "article", 0, "Natural Language Processing Techniques", "Communication is a way to share information among people. People in the same area use verbal communication. People from different regions communicated among themselves using Digital communication. The First Digital Communication Service was the Telegraph. The Telegraph Service was started in 1851. At first, Telegraph used the Flag Semaphore methodology After that the methodology evolved to the use of Morse Code. As an important advancement, Telecommunication was started in 1881. It establishes a direct connection between two people from different regions at any time. It used different methodologies for transferring information such as Phase-Shift Keying (PSK), Frequency-Shift Keying (FSK), Amplitude-Shift Keying (ASK). To accommodate many users, it used different methodologies such as FrequencyDivision Multiplexing (FDM), Wavelength-Division Multiplexing (WDM), Time-Division Multiplexing (TDM). At last, a decade ago The Internet Service got more attention in communication. The emergence of the internet introduced Communication over the Internet using Text, Voice, and Video. Nowadays, Most people use text-based communication. But in this text-based communication methodology, the information shared must be in a common language in which both the users could understand the information. So, Forums are the best way to share thoughts, ideas, information, etc. Most of the people such as Russians, Chinese, Japanese speak only one language. So it is hard for the people who speak only one language to communicate with people speaking other languages. This restricts communication in the native language. So there is a need for intermediate Translation Services in between them for developing communication in the native language."], ["https://openalex.org/W3162618221", "The Quantitive Evaluation and Determination of Health, Safety and Environmental Criteria Priorities Based on HSE-MS OGP Pattern Using ANP and DEMATEL", 2020, "article", 1, "Multi-Criteria Decision Making", "Background and Objective: Health, safety and environment system which established in organizations to protect and safeguard skilled manpower, along with reducing the adverse effects of industry on the environment. Although this system has been studied in depth in various studies, but few tools to measure it have not been well developed. Method: The current study aims to present a quantitative evaluation of the criteria for health, safety, and the environment in oil refineries based on HSE-MS OGP pattern. The items and sub-items in the HSE-MS are considered as the criteria, and sub-criteria and taking a combined approach based on multi-variate decision making techniques such as network analysis, DEMATEL the study aims to weight and determine the priorities of HSE-MS. Findings: In this study, the criterion of leadership with a normalized weight of 0.450, the criterion of assessment and with a normalized weight of 0.200, the criterion of planning with a normalized weight of 0.101, the criterion of policy with a weight of Normalized 0.083, Organization criterion with normalized weight of 0.078, Execution and monitoring criterion with normalized weight of 0.056, Audit and review criterion with normalized weight of 0.032 in order of first priority to It was the seventh. Discussion and Conclusion: Changes in management commitment to health, safety and the environment and reform of the risk management system can improve this performance, and according to their ranking, more appropriate comparisons can be made to allocate sufficient facilities and budget to them."], ["https://openalex.org/W3167958098", "Facebook Addiction and Academic Achievement among Nursing Secondary School Adolescents at El-Sharkia Governorate", 2021, "article", 0, "Impact of Technology on Adolescents", "Background: Facebook is still the most popular and widely used platform among adolescents but misusing it leading to face-book addiction that affects academic achievement of adolescents. The objective of this study was to assess face-book addiction in relation with academic achievement among nursing secondary school adolescents. Methods: Cross –sectional descriptive design was used to conduct this study. The present study was conducted at 6 nursing secondary schools, EL-Sharkia governorate. Multi–stage stratified sample of 250 nursing students. The tools of the present study: socio-demographic data sheet, The Bergen face-book Addiction Scale & Students' academic achievement scale. Results: About three quarters of studied students were face book users (74.0%). More than half of studied students spend less than four hour daily on face-book (58.0 %). About two thirds of the students had no face-book addiction (67.2%). 86.15%of students of non-users of face-book had high level of academic achievement compared to 50% of users of face-book. Conclusion: Majority of the students had no face-book addiction. Face-book addiction had shown a statistical significant negative relation with students' academic achievement. Compared with male nursing students, the majority of female nursing students had high academic achievement. Increasing hours students spend on Face-book lead to a decreased in academic achievement. Recommendation: Screening for early diagnosis of face-book addiction, increase awareness about positive usage of face-book and identify the reasons of face-book addiction."], ["https://openalex.org/W3162245089", "Review of Experimental Investigation in Friction Welding Process", 2021, "article", 0, "Advanced Welding Techniques Analysis", "Industries are in huge demand of new materials essential for their requirements for different applications such as aerospace, automobile & chemical Industry. In this paper review of the friction welding process for the joining of various metals and thermoplastic and the effect of parameters (Burn off length, friction pressure, and Rotational Speed) on the welding process has been discussed."], ["https://openalex.org/W3158756348", "The Influence Of Using Typing Master Application Media on 10 Finger Typing Skills in Office Technology Subjects at SMK Muhammadiyah 2 Sumberrejo Bojonegoro", 2021, "article", 3, "STEM Education", "This research aims to analyze the effect of using typing master application media on 10 finger typing skill in Office Technology at SMK Muhammadiyah 2 Sumberrejo Bojonegoro. This research is a type of research with a quantitative approach. The population in this research is all students X grade of OTKP program which amounts 51 students. Data collection techniques in this research were closed questionnaires, interviews, and documentation. Instrument testing includes: instrument validity and instrument reliability. Data analyzed techniques used in this research include: classic assumption test includes normality test and heteroscedasticity test, and hypothesis test using simple linear regression test. The result of this research showed that the result of simple linear regression analysis for a significance value 0,000. Which the significance value is smaller or ttable or 7,707 > 2,009, can be concluded that the use of typing master application media has a significance effect on 10 finger typing skill."], ["https://openalex.org/W3165092071", "Effectiveness of Modern Text Recognition Solutions and Tools for Common Data Sources.", 2021, "article", 8, "Data Quality and Management", null], ["https://openalex.org/W3010979438", "Change of phytoalexins -stilbenoids of vine leave Tsitska variety ( Vitis vinifera L.) in condition Downy mildew", 2020, "article", 2, "Horticultural and Viticultural Research", "It is investigated change of phytoalexin-stilbenoids in the leaves of white grapevine Tsitska infected by Downy mildew. The Tsitska is cultivated in the west part of Georgia. Comparing the healthy and diseased grapevine leaves physiological concentrations of stilbenoids, in the infected grapevine leaves it is established following stress-metabolite stilbenoids: trans-resveratrol and e- viniferin. The stress-metabolite stilbenoids in the conditions of the disease with Downy mildew is a scientific novelty for the vine leave Tsutska variety. The results of the research are important for determination the correlation of the vine immunity with the phytoalexins-stilbenoids."], ["https://openalex.org/W3016969547", "Arboreal Camera Trapping Reveals Seasonal Behaviors of Peromyscus spp. in Pinus strobus Canopies", 2020, "article", 9, "Wildlife Ecology and Conservation", "Ecological understanding of many arboreal and semi-arboreal species is limited because of difficulties associated with studying wildlife in canopies. As part of a multi-faceted Pinus strobus canopy research project, we used camera traps located in canopies to examine diel, seasonal, and spatial patterns of Peromyscus spp.'s arboreal habitat use. From 2014 to 2018, we documented 201 events of Peromyscus spp. using the canopy over the course of 8491 camera trap nights, at three separate sites spanning a 57 km north-south transect. We detected Peromyscus spp. at heights up to 24 m, the highest above-ground observation on record, for Peromyscus leucopus (white-footed mouse) or Peromyscus maniculatus (deer mouse), the two species of Peromyscus present within our study area. To determine species-specific canopy use, we live-trapped Peromyscus at the base of each research tree and applied differential markings; right ear tags for P. leucopus and left ear tags for P. maniculatus. Camera trap images revealed both species of Peromyscus climbed with peak activity between 2000 h and 0400 h. We found ∼90% of the camera trap events occurred in Aug., Sept., and Oct. which coincides with the maturing of P. strobus cones, suggesting Peromyscus spp. may seasonally exploit arboreal habitats to forage. Daily and monthly detection probabilities for Peromyscus spp. ranged from 0.15–0.70 and from 0.14–0.91, respectively. The probability of all three cameras failing to detect an individual Peromyscus spp., given it was present in the tree, on any given day or month, ranged from 0.15–0.19 and 0.01–0.06, respectively; indicating our examination of activity patterns was robust. Our observations challenge previous ideas of the arboreal tendencies of Peromyscus spp. and further expand our understanding of the natural history of these species within the arboreal realm."], ["https://openalex.org/W3014384819", "Smart Vehicle Monitoring System Using Opencv", 2020, "article", 2, "Vehicle License Plate Recognition", null], ["https://openalex.org/W3009304135", "PERFORMANCE STUDY OF NEEM-KARANJA PETROL BLEND IN THREE CYLINDER FOUR STROKE SI ENGINE TEST RIG", 2020, "article", 0, "Biodiesel Production and Applications", null], ["https://openalex.org/W3181414334", "Water-Saving Irrigation Technology Uses", 2021, "article", 0, "Water resources management and optimization", null], ["https://openalex.org/W3178245949", "Motivation in Language Learning and Teaching.", 2020, "article", 58, "EFL/ESL Teaching and Learning", null], ["https://openalex.org/W3182778246", "Dermatology relates with cutaneous diseases", 2020, "article", 0, "Skin Diseases and Diabetes", "Dermatopathology is a combined dermatology and pathology, subspecialty that focuses on microscopic and molecular\r\n analysis of cutaneous diseases. It also provides basic-level analyses of the possible causes of skin diseases. It also\r\n provides basic-level analyses of the possible causes of skin diseases. Dermatopathology is an important method for the\r\n treatment of inflammatory and neoplastic lesions."], ["https://openalex.org/W3183655090", "Whole-Body Vibration Exercise as a Clinical Intervention to Counterbalance Effects of the Sedentary Behavior: Mini Review", 2021, "article", 0, "Effects of Vibration on Health", "Sedentary Behavior (SB) is defined as the time spent engaged in sitting or lying down activities that require an energy\r\n expenditure of 1.0 or Lower Basal Metabolic Rates (METS). SB is associated with deleterious health outcomes and\r\n along with the time it has been considered a strong risk factor for cardiometabolic diseases. SB is associated with\r\n increased body mass, blood pressure, metabolic dysfunction, and chronic disease in general. SB may exacerbate the\r\n loss of muscle mass and strength, found that among healthy adults or adults with chronic pain. SB is also linked with\r\n numerous adverse mental, poor body composition, and Quality of Life (QOL). Reducing SB may be feasible through\r\n interventions that target sedentary behavior and physical activity. Considering the effects of the Whole-Body\r\n Vibration (WBV) exercise, this type of physical exercise might be an intervention to counterbalance some\r\n consequences of the SB. Considering the biological effects of the WBV exercises, this mini review aims to present\r\n scientific shreds of evidence that this kind of exercise might counterbalance some negative effects of the SB related to\r\n the pain, muscle strength and function, mental conditions, body composition, and QOL. The results suggest that\r\n WBV exercise can be a feasible and efficient exercise intervention for the management of individuals with SB. In\r\n conclusion, there are findings that WBV exercise seems a clinical intervention to counterbalance the effects of SB,\r\n because have been demonstrated potential benefits of vibration stimulus on muscular endurance improvement and\r\n pain level reduction, improvements in muscle function, body composition, QOL, and neurological conditions for\r\n individuals living with the SB."], ["https://openalex.org/W3183382857", "A Detailed Report on the Birds Collected on the Chevert Expedition to New Guinea, in 1875", 2021, "article", 3, "Australian Indigenous Culture and History", "The birds collected on the Chevert Expedition in 1875 are reported and discussed on the basis of information published in the two seminal papers of George Masters, Edward Pierson Ramsay and unreported specimens found in the Macleay Museum. In addition, the private journals of Lawrence Hargrave and William Macleay, old newspaper articles and the literature emanating from the expedition were searched. The Chevert Expedition collected: at sea, on islands off the Queensland coast, on Torres Strait islands and New Guinea. A total of 877 individual birds, of 193 species are listed and discussed. This total number includes 84 specimens not previously reported plus 6 sight records of species that were not collected. The history of the imprudent and perfidious management of specimens held by the Macleay Museum, at The University of Sydney, is also reported. In particular, an account of the 36 type specimens, representing 10 species, is given. Most of the surviving types are currently held at The Australian Museum on permanent loan, 12 have been lost and misplaced with 4 of them found in this study. The birds obtained by the expedition from Kendall Broadbent, who was not an expedition member, are presented and discussed. A gazetteer is appended with place names, co-ordinates and the names of the Indigenous language groups where collecting took place. Indigenous communities generously assisted with the collection of birds on their lands."], ["https://openalex.org/W3173727811", "Impact Response Of Concretefilled Steel Tubular Members (CFST) Using Different Types Of Concrete Filling.", 2021, "article", 1, "Structural Load-Bearing Analysis", null], ["https://openalex.org/W3174641922", "Super Edge Anti Magic Graceful Labeling of some Tree Graphs", 2021, "article", 0, "Graph Labeling and Dimension Problems", "ABSTRACT:\r\nLet G(V,E) be a graph with p vertices and q edges. A Super Edge Anti Magic Graceful Labeling (SEAMGL) of a graph G(p ,q) is a one to one and onto function f:E→{ 1,2,3,…,q } with the property that for each u∈V , ∑_(e∈N(u))▒〖f(uv)=distinct〗 . Such a labeling is Super Edge Anti Magic Graceful (SEAMG) if |f(u)+f(v)-f(uv)|=distinct. A graph G is called Super Edge Anti Magic Graceful (SEAMG) if G admits Super Edge Anti Magic Graceful Labeling. In this paper we determine Bistar graph, Banana tree graph and Caterpillar graph, Star graph which are Super Edge Anti Magic Graceful. (SEAMG)."], ["https://openalex.org/W3170315786", "Hyers-Ulam types stability of nonlinear summation equations with delay", 2021, "article", 3, "Functional Equations Stability Results", "In this typescript, we study the existence and uniqueness for a class of nonlinear summation equation with delay. Furthermore, we present Hyers–Ulam stability(HUS), generalized Hyers–Ulam  stability(GHUS), Hyers–Ulam–Rassias stability(HURS) and generalized Hyers–Ulam–Rassias  stability(GHURS) of the mentioned equation by utilizing discrete Gr¨onwall lemma. We finalized our manuscript through examples to help our primary outcomes."], ["https://openalex.org/W3175820176", "GENDER EQUALITY AND NATIONAL DEVELOPMENT: A HISTORICAL VIEWPOINT", 2021, "article", 1, "Gender, Labor, and Family Dynamics", "Nigeria is a developing nation after almost a century of existence, bedeviled with ‘fantastic corruption’, terrorism and sliding economy.  From the amalgamation of 1914 to this present time, Nigeria has been ruled by the male gender leaving peripheral roles for female gender at the lower level. The male dominance has given room for unchecked flagrant abuse of office, corruption, nepotism, embezzlement which has hindered Nigeria from development. This paper x-rays the performance of women in key positions and on the call by the masses for change during the Jonathan Peoples’ Democratic Party (PDP) administration to buttress the fact that women can do well in leadership and administrative position if gender equality is made a policy to actualize national development. The allegations of flagrant abuse of office by few of these female appointees contributed to such clarion call for change that ousted the PDP’s sixteen years of administration and ushered in All Progressive Congress (APC) is on structured gender-biased and chauvinistic grounds.The aim of this paper therefore, is to show that gender equality is another means by which the Nigerian state can attain sustainable development by accepting, utilizing and maximizing the potentials of the women. Thus, this paper argues the thesis that gender equality must function as a formal notion rather than a substantive one, such that in the eyes of the law, difference must be shown to be relevant in order to be admissible. This is achieved using phenomenology, primary and secondary sources as the methodology of this research to capture the lived experiences of women (domination, disadvantage and disempowerment) which creates systematic inequality. Thus, part of the objectives of this paper is to unmask the conceptual paradox that revenges the notion of gender equality in order to bring out the notion that is functional and applicable to law, public and private spheres. This also substantiated the fact that the change of party and leadership in Nigeria was partly due to the involvement of the female gender in the administration that broke the complacency that hitherto has made the male dominance a source of Nigeria’s underdevelopment. The paper therefore advocated for legal framework to create room for more female participation on equal pedestal with the male gender in legislation, administration and judiciary to engender equal criticism that will eventually bring rapid development to Nigeria.This paper ended with discussion on the benefits of gender equality to sustainable national development in Nigeria."], ["https://openalex.org/W3174373938", "A Study on Environmental Micro-Dust Level Detection and Remote Monitoring of Outdoor Facilities", 2020, "article", 2, "Air Quality Monitoring and Forecasting", "The rapid development in modern industrialization pollutant the water and atmospheric air across the globe that have a major impact on the human and livings health. In worldwide, every country government increasing the importance to improve the outdoor air pollution monitoring and control to provide quality of life and prevent the citizens and livings life from hazard disease. We proposed the environmental dust level detection method for outdoor facilities using sensor fusion technology to measure precise micro-dust level and monitor in realtime. In this proposed approach use the camera sensor and commercial dust level sensor data to predict the micro-dust level with data fusion method. The camera sensor based dust level detection uses the optical flow based machine learning method to detect the dust level and then fused with commercial dust level sensor data to predict the precise micro-dust level of the outdoor facilities and send the dust level informations to the outdoor air pollution monitoring system. The proposed method implemented on raspberry pi based open-source hardware with Internet-of-Things (IoT) framework and evaluated the performance of the system in realtime. The experimental results confirm that the proposed micro-dust level detection is precise and reliable in sensing the air dust and pollution, which helps to indicate the change in the air pollution more precisely than the commercial sensor based method in some extent."], ["https://openalex.org/W3211494416", "\"But What Happened to Your Dog?\": Inquiry into Immigration in a First-Grade Texas Classroom.", 2020, "article", 0, "Diverse Education Studies and Reforms", null], ["https://openalex.org/W3212846604", "Effects of Low-Carbohydrate Diet in Individuals Medicated for Type 2 Diabetes on Long-Term Glycemic Control and Medication Usage in Context of Workplace-Sponsored Wellness Program", 2021, "article", 0, "Diet and metabolism studies", "Purpose Examine effectiveness of adding structured low-carbohydrate diet to low-intensity aerobic exercise on long\u0002term glycemic control in individuals medicated for type 2 diabetes within context of workplace-sponsored wellness program. Methods Forty-three individuals medicated for type 2 diabetes participated in workplace-sponsored wellness program. Participants analyzed according to group (exercise-only or diet plus exercise). Longitudinal data analysis conducted using multilevel growth modeling with 4 waves of data collected from baseline through 3-months. Primary outcome measure was changes in laboratory measured glycosylated hemoglobin (HbA1c) levels. Results Participants in diet plus exercise group (n = 30) had statistically significant and clinically meaningful reductions in HbA1c levels while reducing usage of anti-glycemic medication compared to exercise-only group at 3 months. Final multilevel growth model revealed reductions in HbA1c levels in participants in diet plus exercise group of -1.19 points (95 % CI -1.92 to -0.47; P = 0.002) compared to exercise-only group. Interaction between treatment group, medication effect score, and time revealed faster monthly reductions in HbA1c values while reducing usage of anti-glycemic medication for participants in diet plus exercise group of -0.13 points (95 % CI -0.19 to -0.07; P = 0.000) compared to exercise-only group. Participants in diet plus exercise group experienced significant reductions in body mass index, percentage of weight loss, body fat percentage, waist circumference, resting heart rate, and blood pressure compared to exercise-only group. Higher proportion of participants in diet plus exercise group achieved successful clinical outcome based on Global Rating of Change scores (Χ2 = 9.9; P = 0.000) compared to exercise-only group. Conclusions Combining structured low-carbohydrate diet with low-intensity aerobic exercise in individuals medicated for type 2 diabetes provides statistically significant and clinically meaningful improvements in long-term glycemic control while reducing need for anti-glycemic medication within context of workplace-sponsored wellness program."], ["https://openalex.org/W3214276141", "Doctor Patient Relationship as a Mediator Between Attachment Dimensions and Self-Management In Chronic Patients, Yangon, Myanmar", 2021, "article", 0, "Attachment and Relationship Dynamics", "This research studied the direct effect of attachment dimensions on self-management and the mediating effect of the doctor-patient relationship between attachment dimensions and self-management. A quantitative method with correlational research design via path analysis was utilized. The participants of the study consisted of 90 male and 90 female chronic patients. Burmese translated version of Revised Adult Attachment Scale (RAAS), Partners in Health (PIH) scale and Patient-Doctor Depth of Relationship (PDDR), and a researcher constructed demographic questionnaires were employed. The mediating role of doctor patient relationship is discussed in the context of self-management of chronic patients in Yangon, Myanmar. The results revealed the following major findings: (1) close attachment dimension had a significant direct positive effect on self-management, depend and anxiety attachment dimensions did not have a direct effect on self-management; (2) close attachment dimension had a significant indirect effect on self-management, being mediated by doctor-patient relationship (Standardized Indirect effect = .08, SE = .04, LLCI = .01, ULCI = .16), depend attachment dimension did not have a significant indirect effect on self-management, being mediated by doctor-patient relationship (Standardized Indirect Effect = .06, SE = .04, LLCI = -.01, ULCI = .14), anxiety attachment dimensions did not have a significant indirect effect on self-management, being mediated by doctor-patient relationship (Standardized Indirect Effect = .0361, SE = .03, LLCI = -.03, ULCI = .11); it is not uncommon for chronic patients in Myanmar to reach out to the quack doctors instead of consulting with doctors. Economic hardship requires chronic patients to make difficult decisions between healthcare and basic living expenses)."], ["https://openalex.org/W3211698023", "A Study of Digital Forensics with Machine Learning and Security Information and Event Management", 2021, "article", 0, "Digital and Cyber Forensics", "Digital World, where electronic devices like computers, smart phones, tablets are increasing on a regular basis. Cybercrimes are also increasing at the same rate as the use of internet. Digital forensic, a branch of traditional forensic science has become an important aspect to deal with the challenges of digital world.  There are number of techniques and tools available for digital forensics investigation. In this paper, how Machine Learning algorithms and Security Information and Event Management framework can be used in digital forensics is discussed. Machine Learning can be used to analyse huge amount of data, in recognizing patterns. SIEM can be used for log collection, correlation of logs data, identifying the techniques and activities that are used by the criminal.  ML and SEIM both can be used to analyse previous historic data to predict the behaviour of the criminal."], ["https://openalex.org/W3202422220", "GuillemGSubies at IberLEF-2021 DETOXIS task: Detecting Toxicity with Spanish BERT.", 2021, "article", 0, "Hate Speech and Cyberbullying Detection", null], ["https://openalex.org/W3208148965", "Segmenting out Generic Objects in Monocular Videos.", 2021, "article", 0, "Advanced Image and Video Retrieval Techniques", null], ["https://openalex.org/W3207505205", "The Mediation Effect of Social Connectedness Between Big Five Personality Traits and Social Interaction Anxiety Among Third Culture Kids in Bangkok", 2021, "article", 1, "Child and Adolescent Psychosocial and Emotional Development", "The study examined the association of social interaction anxiety (SIA), social connectedness (SC) and the big five personality traits in third culture kids in Bangkok. The purpose of the current study was to investigate the direct and indirect effect of the Big Five traits on SIA in TCKs, mediated by SC. The study employed Path Analysis via a set of multiple regressions for each of the five traits and Process Analysis to test the significance of mediation effect. A convenience sample of 123 TCKs, 78 girl and 45 boys of age 14-18 years, from the international school in Bangkok filled out questionnaire of Social Interaction Anxiety Scale (SIAS), Social Connectedness Scale-revised (SCS-R) and Big Five Inventory (BFI). Results showed that extroversion was a significant negative predictor with a direct and indirect effect on SIA, partially mediated by SC (β = -.19, 95% CI = -.33, -.09). Neuroticism was a significant positive predictor with a direct and indirect effect on SIA, partially mediated by SC (β = .21, 95% CI = .11, .32). Openness, conscientiousness and agreeableness showed no significant direct or indirect effect on SIA. Its shows that low sense of belonging and connection in introverted and neurotic adolescents exacerbates their concerns in social interactions, thus contributing towards making them socially anxious. Therefore, adolescent TCKs with low extroversion and high neuroticism can be protected against their natural vulnerabilities towards social interaction anxiety with the help of developing higher levels of social connectedness."], ["https://openalex.org/W3209972373", "FOOD IN TOURISM. RELEVANT RESEARCH ANGLES AND TOPICS", 2020, "article", 0, "Culinary Culture and Tourism", null], ["https://openalex.org/W3211098703", "Needs Analysis of Project Based Learning Learning Model Development in Translation as Profession Course", 2021, "article", 1, "Arabic Language Education Studies", "This study aims to analyze the need for developing a project based learning model for students of the Translation as Profession Course at the English Education Study Program, F This research is a qualitative descriptive research aimed at identifying the needs, opinions and suggestions of the respondents to be used as material for the development of learning models. The instruments used to collect data are questionnaires and interviews. The results of questionnaires and interviews with lecturers state that lecturers need a learning model that can maximize students' learning to translate, lecturers also stated that they needed a learning model guide with clear activity guidelines and accurate assessment guidelines. Students also stated that they needed a learning model that could maximize their translation skills, a learning model that could solve the translation problems they found and a learning model that could maximally motivate students to work in groups."], ["https://openalex.org/W3204702144", "Secondary DMEK after failed DSEK graft in complex eyes – retrospective case series", 2021, "article", 3, "Corneal surgery and disorders", "# Purpose\n\nSecondary endothelial keratoplasty (EK) represents an increasingly prominent indication for EK. In particular, Descemet membrane endothelial keratoplasty (DMEK) is emerging as a feasible technique in eyes with failed Descemet stripping endothelial keratoplasty (DSEK) grafts. Our aim was to analyse the anatomical and visual outcomes and safety of secondary DMEK in complex eyes with failed DSEK grafts.\n\n# Methods\n\nThis study was a retrospective case series of complex eyes undergoing secondary DMEK for failed previous DSEK grafts. Four eyes of four patients were analysed, with a mean patient age of 61.8 ± 20.1 years. Best-corrected visual acuity (BCVA, logMAR) before DMEK ranged from 1.30 logMAR to 1.85 logMAR. We analysed the indication of primary and secondary EK, BCVA before and at the final follow-up observation after secondary DMEK (logMAR), corneal thickness, endothelial cell loss rate (%ECL) and complications.\n\n# Results\n\nIn eyes with functioning DMEK grafts, BCVA improved from 1.60 logMAR (range 1.30-1.60 logMAR) to 0.12 logMAR (range 0.12-0.40 logMAR) at the last postoperative observation (median follow-up time = 33 months (range 18-78 months)). The final corneal thickness in successful grafts was 520.7 ± 40.4 µm. The mean %ECL was 46.6% ± 10.1%. One eye required rebubbling for graft detachment and ended in graft failure requiring tertiary keratoplasty, and no eyes experienced allograft rejection episodes.\n\n# Conclusion\n\nSecondary DMEK is surgically feasible and provides visual improvement after a previous failed DSEK, even in complex eyes with severe comorbidities."], ["https://openalex.org/W3204106681", "Experimental Study of Pressure Distribution of NACA4412 Airfoil with Square Dimbles", 2021, "article", 0, "Fluid Dynamics and Turbulent Flows", "A wind tunnel is an excellent tool used in aerodynamics analysis to investigate the flow over the solid body. The ultimate objectives of the work are to investigate the pressure distributions of the airfoil profile blade under various operating conditions with and without Square dimples. Pressure distributions are investigated on the NACA4412 airfoil blade in the Low-speed suction type subsonic wind tunnel. The 26 pressure port is made at different x/c locations on the upper and lower surface of the blade and the 2D effect is considered in this study. Pressure measurement is done using a multi-tube manometer and pitot-static tube. Dimples are formed throughout the wing which is located at 25% of the Chord from the leading edge of the blade. The main aim of the investigation primarily focuses on the pressure distribution of NACA 4412 airfoil at a low Reynolds number. In this research, the effect of pressure distribution was investigated on the blade concerning two different velocity 10 m/s and 12 m/s, various angles of attack(AOA), and Square dimples further it is found that pressure distribution drastically varies over blade due to dimples and also spanwise flow distribution."], ["https://openalex.org/W3203737917", "ADOP FERT-Automatic Detection of Occupations and Profession in Medical Texts using Flair and BERT.", 2021, "article", 2, "Topic Modeling", null]], "total": 233}</script></div><script>
const root = document.currentScript.previousElementSibling;
const {cols, rows, total} = JSON.parse(root.querySelector('script[type="application/json"]').textContent);
const URL_RE = /(https?:\/\/[^\s<>"']+)/g, LONG = 300;
let page = 0, size = 25;
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const linkify = s => esc(s).replace(URL_RE, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
function cell(v) {
  if (v === null) return '<span class="na">null</span>';
  const nested = typeof v === 'object';
  const s = nested ? JSON.stringify(v) : String(v);
  const cls = nested ? ' class="nested"' : '';
  if (s.length <= LONG) return `<div${cls}>${linkify(s)}</div>`;
  return `<details${cls}><summary>${linkify(s.slice(0, LONG))}…</summary>${linkify(s)}</details>`;
}
function render() {
  const pages = Math.max(1, Math.ceil(rows.length / size));
  page = Math.min(page, pages - 1);
  const slice = rows.slice(page * size, page * size + size);
  root.querySelector('tbody').innerHTML = slice.map(r => '<tr>' + r.map(v => `<td>${cell(v)}</td>`).join('') + '</tr>').join('');
  const first = rows.length ? page * size + 1 : 0, last = page * size + slice.length;
  root.querySelector('.info').textContent =
    `rows ${first}–${last} of ${rows.length.toLocaleString()} loaded` + (total === null ? ' (total unknown)' : ` · ${total.toLocaleString()} in table`);
  root.querySelector('.pg').textContent = `page ${page + 1} / ${pages}`;
  root.querySelector('.prev').disabled = page === 0;
  root.querySelector('.next').disabled = page >= pages - 1;
  root.querySelector('.wrap').scrollTop = 0;
}
root.querySelector('thead tr').innerHTML = cols.map(([n, short, full]) =>
  `<th title="${esc(n + ': ' + full)}">${esc(n)}<div class="t">${esc(short)}</div></th>`).join('');
root.querySelector('.prev').onclick = () => { page--; render(); };
root.querySelector('.next').onclick = () => { page++; render(); };
root.querySelector('.size').onchange = e => { size = +e.target.value; page = 0; render(); };
render();
</script>
</body></html>
