suffiency. Guided by SITI HAMIDAH and VANDRIAS DEWANTORO\r\nThe research purposes of this study was : (1) Analyze the level of tntensification to performed on each shoot. (2) Analyze the determine the level of intensification about the production of sugar cane. (3) Find out what are the obstacles and how to overcome these problems. The research carried out using a survey method. The analitical method used the method of linier regression analysis. Intake of respondents using purposive sampling with 75 people, who contribute the maximum to the sugar mill with the diffrent buds condition. The results showed level of intensification in the first shoots were in both shoots and the third and fourth in the high and low categories. The influence on the productivity level of intensification shows the first buds will productivity of 36, 615 qu/he without the influence of the intensification. The productivity of the second shoots as much as 91,324 qu/he and 11.934,684 qu/he without the influence of the intensification. The third and fourth shoots will be descreased by of variable degree\r\nKey words : The influence of the level of intensification, sugar cane production, ratoon cane, GondangBaru sugar mill.", "Cane | Shoot | Sugar | Sugar cane | Productivity | Baru | Horticulture | Mathematics | Agricultural science | Engineering | Biotechnology | Geography | Environmental science | Biology | Food science | Economics", "Agricultural Research and Practices", "General Agricultural and Biological Sciences", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", null, null, null, 0, 0, null, false, "2016-06-24 00:00:00"], ["https://openalex.org/W40110643", "https://doi.org/10.31315/jik.v9i2.3428", "http://jurnal.upnyk.ac.id/index.php/komunikasi/article/download/3428/2594", null, "Komunikasi Antarpribadi sebagai Strategi Sosialisasi Pelestarian Alam di Kepulauan Seribu", "article", "id", "2020-06-01", 2020, "Muharto Toha | Adityo Sudwi Nugroho", "- | -", null, "Universitas Persada Indonesia Yayasan Administrasi Indonesia", "ID", "Jurnal ilmu Komunikasi", null, null, "9", "2", "166–179", "Abstract\r\nCommunication is the first step in human interaction. This study aims to describe the\r\ninterpersonal communication strategies employees of Kepulauan seribu National Park Authority\r\nto provide information to the public, in this case the farmers and fishermen. The approach\r\nused is subjective with qualitative data, which can produce in-depth description of the sayings,\r\nwritings, and the observable behavior of a person, group, community, and certain organizations\r\nin certain contexts that were examined from the standpoint of a complete, comprehensive , and\r\na thorough or complete (holistic). The findings of this study is the interpersonal communication\r\nstrategies in the National Park Authority employees to use an intensive interpersonal communication\r\nthat is open communication, mutual honesty, support, and continuous. Each individual is\r\ndirectly related to this program are able to understand the problems they face, or facing other\r\npeople.\r\nAbstrak\r\nKomunikasi merupakan langkah awal dalam interaksi manusia. Penelitian ini bertujuan\r\nmendeskripsikan strategi komunikasi interpersonal para karyawan Balai Taman Nasional Kepulauan\r\nSeribu yang dapat memberikan informasi kepada publik, dalam hal ini para petani dan nelayan.\r\nPendekatan yang digunakan adalah subjektif dengan data kualitatif, yang dapat menghasilkan uraian\r\nmendalam tentang ucapan-ucapan, tulisan-tulisan, dan perilaku yang dapat diamati dari seseorang,\r\nkelompok, komunitas, dan organisasi tertentu dalam konteks tertentu yang dikaji dari sudut pandang\r\nyang lengkap, komprehensif, danmenyeluruh atau utuh (holistic). Temuan penelitian iniadalah strategi\r\nkomunikasi interpersonal pada karyawan Balai Taman Nasional menggunakan komunikasi antarpribadi\r\nyang intensif yaitu keterbukaan berkomunikasi, saling jujur,mendukung, dan berkesinambungan. Setiap\r\nindividu yang terkait langsung dengan program ini dapat saling mengerti masalah-masalah yang mereka\r\nhadapi, atau yang dihadapi orang lain.\r\nKata kunci: komunikasi antarpribadi dan pelestarian alam", "Interpersonal communication | Humanities | Sociology | Psychology | Social psychology | Philosophy", "Hermeneutics and Narrative Identity", "Philosophy", "Arts and Humanities", "Social Sciences", null, false, "closed", null, null, null, 2, 0, null, false, "2016-06-24 00:00:00"], ["https://openalex.org/W2474901826", "https://doi.org/10.48611/isbn.978-2-406-12407-8.p.0065", "https://classiques-garnier.com/la-revue-des-lettres-modernes-ecrire-reecrire-bilan-critique-de-l-oeuvre-de-marguerite-duras-reecrire-l-origine.html", null, "Réécrire l'origine - Duras dans le champ analytique", "article", "fr", "2021-01-01", 2021, "Philippe Spoljar", "-", "Philippe Spoljar", null, null, "La Revue des lettres modernes", null, null, null, null, "65–106", null, "Philosophy | Humanities | Art", "Hermeneutics and Narrative Identity", "Philosophy", "Arts and Humanities", "Social Sciences", null, false, "closed", null, null, null, 1, 0, null, false, "2016-07-22 00:00:00"], ["https://openalex.org/W2498707583", "https://doi.org/10.48611/isbn.978-2-406-12407-8.p.0107", "https://classiques-garnier.com/la-revue-des-lettres-modernes-ecrire-reecrire-bilan-critique-de-l-oeuvre-de-marguerite-duras-les-lectures-semiotiques-du-texte-durassien.html", null, "Les Lectures « sémiotiques » du texte durassien - Un barrage contre la fascination", "article", "fr", "2021-01-01", 2021, "Madeleine Borgomano", "-", "Madeleine Borgomano", null, null, "La Revue des lettres modernes", null, null, null, null, "107–135", null, "Humanities | Art", "Hermeneutics and Narrative Identity", "Philosophy", "Arts and Humanities", "Social Sciences", null, false, "closed", null, null, null, 1, 0, null, false, "2016-08-23 00:00:00"], ["https://openalex.org/W2519600027", "https://doi.org/10.48611/isbn.978 Humanities", "Social Sciences", null, false, "closed", null, null, null, 0, 0, null, false, "2016-10-28 00:00:00"], ["https://openalex.org/W2579976490", "https://doi.org/10.33363/bb.v10i02.566", "https://ejournal.iahntp.ac.id/index.php/belom-bahadat/article/download/566/386", null, "AKIBAT HUKUM PENGALIHAN FUNGSI TANAH PERTANIAN MENJADI KAWASAN PERUMAHAN", "article", "ms", "2020-12-30", 2020, "I Komang Darman", "-", "I Komang Darman", "University of Palangka Raya", "ID", "Belom Bahadat", null, "2089-7553", "10", "02", "1–15", "Kebijakan dalam peraturan Perundang-undangan yang berkaitan dengan masalah pengendalian alih fungsi tanah pertanian menjadi Kawasan Perumahaan sudah banyak dibuat, namum demikian implementasi pelaksanaan peraturan tersebut kurang efektif karena tidak didukung dengan data tanah pertanian pangan berkelanjutan yang dilindungi dan sikap proaktif sehingga alih fungsi tanah pertanian terus terjadi. Pola konversi tanah pertanian yang dilakukan oleh masyarakat dapat ditinjau oleh beberapa aspek, menurut Pelaku konversi dapat dibedakan menjadi dua. Pertama, alih fungsi secara langsung oleh pemilik tanah yang bersangkutan. Motif pada umumnya adalah untuk pemenuhan tempat tinggal, meningkatkan pendapatan melalui alih usaha, atau kombinasi keduanya. Kedua fungsi yang diawali oleh pengusaan yaitu pemilik menjual kepada pihak lain. Alih fungsi tanah pertanin merupakan fenomena yang tidak dapat dihindari dari pembangunan.\r\n\t\t\r\n\tAkibat hukum alih fungsi tanah pertanian pangan berkelanjuatan berdasarkan pasal 50 ayat (30) Undang-undang Nomor 41 tahun 2009 Tentang Perlindungan Lahan Pertanian Pangan Berkelanjutan, yang menjelaskan bagi setiap orang yang memiliki Lahan Pertanian Pangan Berkelanjutan dan kemudian menjual atau mengalihkan hak miliknya, maka fungsi dari pada tanah tersebut tidak boleh diubah. Jika mengubah dan menyebabkan saluran irigasi, infrastruktur serta mengurangi kesuburan tanah maka sesuai dengan pasal 51 ayat (2), orang tersebut berkewajiban untuk merehabilitasi lahan, dengan cara mpenyempurnaan sarana dan prasarana mencakup irigasi, jalan usaha tani, ketersedian alat pengolahan tanah mekanis dan membangun irigasi kembali agar tanah pertanian produktif.", "Physics | Humanities | Forestry | Horticulture | Art | Geography | Biology", "Aviation History and Innovations", "History and Philosophy of Science", "Arts and Humanities", "Social Sciences", null, true, "green", null, null, null, 0, 0, null, false, "2017-02-03 00:00:00"], ["https://openalex.org/W2795236730", "https://doi.org/10.48611/isbn.978-2-406-11988-3.p.0141", "https://classiques-garnier.com/index.php/politien-humaniste-aux-sources-de-la-modernite-poliziano-e-la-collazione-degli-scriptores-rei-rusticae.html", null, "Poliziano e la collazione degli Scriptores rei rusticae - Le note all’incunabolo parigino Rés. s. 439", "article", "fr", "2021-01-01", 2021, "Luca Ruggio", "-", "Luca Ruggio", null, null, "Rencontres", null, null, null, null, "141–154", null, "Humanities | Philosophy", "Hermeneutics and Narrative Identity", "Philosophy", "Arts and Humanities", "Social Sciences", null, false, "closed", null, null, null, 0, 0, null, false, "2018-04-06 00:00:00"], ["https://openalex.org/W2914428772", "https://doi.org/10.23960/jiia.v7i4.552", "http://jurnal.fp.unila.ac.id/index.php/JIA/article/download/3872/2840", null, "PERANAN PUSAT PELATIHAN PERTANIAN PEDESAAN SWADAYA (P4S) DALAM PEMBERDAYAAN PETANI DI KABUPATEN LAMPUNG TENGAH", "article", "id", "2020-04-16", 2020, "Rokhma Yeni | Dewangga Nikmatullah | Rio Tedi Prayitno", "- | - | -", "Rokhma Yeni", null, null, "Jurnal Ilmu Ilmu Agribisnis: Journal of Agribusiness Science", null, null, "7", "4", "552–559", "Penelitian ini bertujuan untuk menganalisis peranan Pusat Pelatihan Pertanian\r\nPedesaan Swadaya (P4S) dalam memberdayakan petani di Kabupaten Lampung\r\nTengah dan mengetahui faktor-faktor yang berhubungan dengan peranan P4S\r\ndalam memberdayakan petani di Kabupaten Lampung Tengah. Penelitian ini\r\ndilakukan pada empat P4S di Kabupaten Lampung Tengah yaitu P4S Mitra Tani\r\nMandiri, P4S Sama Maju, P4S Ras Andani, dan P4S Budidaya. Responden yang\r\nditeliti berjumlah 74 orang terdiri dari 23 fasilitator dan 51 petani. Pengumpulan\r\ndata dilakukan pada bulan Februari hingga Maret 2018. Peranan P4S dalam\r\nmemberdayakan petani dianalisis secara deskriptif dan hipotesis dianalisis dengan\r\nuji korelasi Rank Spearman. Hasil penelitian ini menunjukkan bahwa peranan P4S\r\ndalam memberdayakan petani di Kabupaten Lampung Tengah termasuk dalam\r\nklasifikasi sedang. Faktor internal yang meliputi sifat kekosmopolitan fasilitator\r\ndan motivasi kerja fasilitator, serta faktor eksternal yang berupa sistem\r\npenghargaan tidak berhubungan nyata dengan peranan P4S dalam\r\nmemberdayakan petani. Ketersediaan sarana prasarana dan jumlah petani binaan\r\nberhubungan nyata dengan peranan P4S dalam memberdayakan petani di\r\nKabupaten Lampung Tengah.\r\nKata kunci : pemberdayaan petani, P4S, peranan\r\n\r\nABSTRACT\r\n\r\nThis research aimed to analyze the role of rural agriculture training centre (P4S)\r\non empowering farmers and find out the factors related to the role. This research\r\nwas conducted in four P4S in Centre Lampung Regency, those are Mitra Tani\r\nMandiri, P4S Sama Maju, P4S Ras Andani, and P4S Budidaya. Respondents of\r\nthis research were 74 people that consist of 23 facilitators and 51 farmers. The\r\ndata were collected from February to March 2018. The role of P4S analyzed\r\ndescriptively and hypothesis was analyzed using Rank Spearman correlation. The\r\nresults of this research showed that the role of P4S on empowering farmers in\r\nCentre Lampung Regency is included in moderate classification. The internal\r\nfactors such as work motivation, cosmopolitan character, and the external factor\r\nthat is reward system don’t have significant relation to the role of P4S\r\nempowering farmers. Availability of facilities-infrastructure and the number of\r\nassisted farmers have significant relationship to the role of P4S on empowering\r\nfarmers in Centre Lampung Regency.\r\nKey words : empowering farmers, P4S, role", "Mathematics | Agricultural science | Humanities | Biology | Art", "Agricultural Development and Management", "General Agricultural and Biological Sciences", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 1, 0, null, false, "2019-02-21 00:00:00"], ["https://openalex.org/W2939012452", "https://doi.org/10.7433/s111.2020.12", "https://ojs.sijm.it/index.php/sinergie/article/download/779/310", null, "Investigating the links between the use of the internet, value co-creation, and customer satisfaction in the banking sector", "article", "en", "2020-04-30", 2020, "Vincenzo Formisano | Andrea Moretta Tartaglione | Maria Fedele | Ylenia Cavacece", "https://orcid.org/0000-0003-0040-7639 | https://orcid.org/0000-0002-1555-6146 | https://orcid.org/0000-0002-9829-6043 | https://orcid.org/0000-0001-5594-5106", null, null, null, "Sinergie Italian Journal of Management", null, "0393-5108", "38", "1", "209–230", null, "Business | Customer satisfaction | The Internet | Marketing | Value (mathematics) | Customer value | Value proposition | Commerce | Computer science | Economics | World Wide Web", "Hermeneutics and Narrative Identity", "Philosophy", "Arts and Humanities", "Social Sciences", null, true, "green", "cc-by", null, null, 3, 47, "https://openalex.org/W57381047 | https://openalex.org/W618002855 | https://openalex.org/W843798523 | https://openalex.org/W1496784679 | https://openalex.org/W1545223730 | https://openalex.org/W1557304572 | https://openalex.org/W1640942371 | https://openalex.org/W1689771227 | https://openalex.org/W1965574139 | https://openalex.org/W1972970784 | https://openalex.org/W1975224424 | https://openalex.org/W1978942994 | https://openalex.org/W1983532449 | https://openalex.org/W1986221133 | https://openalex.org/W2000329621 | https://openalex.org/W2027829670 | https://openalex.org/W2028809046 | https://openalex.org/W2037021691 | https://openalex.org/W2055132935 | https://openalex.org/W2059284263 | https://openalex.org/W2059702009 | https://openalex.org/W2062865373 | https://openalex.org/W2066780607 | https://openalex.org/W2070772575 | https://openalex.org/W2093505263 | https://openalex.org/W2093871192 | https://openalex.org/W2101456575 | https://openalex.org/W2106611382 | https://openalex.org/W2122149124 | https://openalex.org/W2126840412 | https://openalex.org/W2135526934 | https://openalex.org/W2147372132 | https://openalex.org/W2153991478 | https://openalex.org/W2162487635 | https://openalex.org/W2166589815 | https://openalex.org/W2166649938 | https://openalex.org/W2245649394 | https://openalex.org/W2339466188 | https://openalex.org/W2345285251 | https://openalex.org/W2402975938 | https://openalex.org/W2467024691 | https://openalex.org/W2519651160 | https://openalex.org/W2588776904 | https://openalex.org/W2784914332 | https://openalex.org/W2792501142 | https://openalex.org/W2797276613 | https://openalex.org/W3123429421", false, "2019-04-25 00:00:00"], ["https://openalex.org/W2982357401", "https://doi.org/10.24895/sng.2019.4-0.1102", "http://semnas.big.go.id/index.php/SN/article/view/1102/0", null, "STUDI PENENTUAN NILAI UNDULASI DARI EGM 2008 DENGAN DERAJAT HARMONIK 360, 720 DAN 2190 DI PULAU JAWA", "article", "id", "2020-12-21", 2020, "Nico Marcelino | Rustandi Poerawiardi | Diah Kirana Kresnawati | Dadan Ramdani | Dessy Apriyanti", "- | - | - | https://orcid.org/0000-0002-9710-3588 | -", "Nico Marcelino", "Pakuan University", "ID", "Seminar Nasional Geomatika", null, "2614-7211", "4", null, "133–142", "Negara Indonesia yang mempunyai luas daratan 1.910.931,32 Km² (kemendagri, 2010) mempunyai sebaran Jaring Kontrol Geodesi yang berjumlah 7000 titik, dengan sebaran setiap titik yaitu 5 Km dan belum tersebar merata diseluruh wilayah Indonesia. maka pengukuran referensi tinggi untuk keperluan praktis pemetaan masih memerlukan waktu yang cukup lama serta biaya besar, terutama untuk daerah yang jauh ataupun belum mempunyai sebaran Jaring Kontrol Geodesi (JKG). EGM 2008 adalah salah satu solusi dalam mendapatkan nilai tinggi orthometrik yang dikombinasikan dengan nilai tinggi yang didapat dari pengamatan GNSS. Dari hasil penelitian ini didapatkan bahwa Nilai Undulasi dari EGM 2008 dibagi menjadi derajat dan orde 360, 720 dan 2190. Mempunyai nilai Undulasi minimal dan maksimal masing -  masing yaitu 16.297 m sampai dengan 34.644m di derajat dan orde maksimal 360, 16.056m sampai dengan 34.802m di derajat dan orde maksimal 720 dan 16.057m sampai dengan 34.495m di derajat dan orde maksimal 2190. Nilai Undulasi EGM 2008 dibandingkan terhadap nilai Undulasi Geometrik dari Jaring Kontrol Geodesi (JKG) yang tersebar di Pulau Jawa yang berjumlah 99 titik dan mempunyai 3 titik yang error dan 2 titik tidak mempunyai tinggi orthometrik, sehingga 5 titik JKG tersebut tidak dimasukkan dalam proses perhitungan. Nilai Undulasi EGM2008 dengan derajat dan orde masing – masing 360,720 dan 2190 terhadap nilai Undulasi geometrik JKG mempunyai nilai penyimpangan yang dinyatakan dengan standar deviasi yaitu pada derajat dan orde 360 adalah  49,5 cm , derajat dan orde 720 adalah 38,9 cm dan derajat dan orde 2190 adalah 36,8 cm. Dapat disimpulkan bahwa nilai undulasi EGM 2008 dengan derajat harmonik 2190 yang paling baik digunakan dengan standar deviasi 36.8cm. Kata Kunci : EGM 2008, Jaring Kontrol Geodesi, Undulasi Geoid, Model Geopotensial Global", "Physics", "Geodetic Measurements and Engineering Structures", "Civil and Structural Engineering", "Engineering", "Physical Sciences", null, false, "closed", null, null, null, 0, 0, null, false, "2019-11-08 00:00:00"], ["https://openalex.org/W2999335251", "https://doi.org/10.26486/jramb.v6i2.1566", "http://ejurnal.mercubuana-yogya.ac.id/index.php/akuntansi/article/view/1566", null, "PENGARUH PENERAPAN GOOD CORPORATE GOVERNANCE TERHADAP FINANCIAL DISTRESS Pada Perusahaan Jasa Sektor Infrastruktur, Utilitas, dan Transportasi yang Terdaftar di Bursa Efek Indonesia Tahun 2016 – 2018", "article", "id", "2020-11-30", 2020, "Jelly Kurnia Telaumbanua | Martinus Budiantara", "- | -", "Jelly Kurnia Telaumbanua", "Universitas Mercu Buana Yogyakarta", "ID", "Jurnal Riset Akuntansi Mercu Buana", "Universitas Mercu Buana Yogyakarta", "2460-1233", "6", "2", null, "Penelitian ini bertujuan untuk mengetahui pengaruh penerapan good corporate governance terhadap financial distress. Good corporate governance diproksikan dengan dewan direksi, komisaris independen, komite audit, dan kepemilikan institusional. Financial distress diproksikan ke dalam Z-score model milik Altman. Populasi dalam penelitian ini yaitu seluruh perusahaan jasa sektor infrastruktur, uitilitas, dan transportasi yang di Bursa Efek Indonesia (BEI) sejak tahun 2016 sampai dengan 2018. Dari 78 perusahaan yang tercatat di Bursa Efek Indonesia (BEI), yang dapat digunakan untuk sampel penelitian sebanyak 26 perusahaan dengan menggunakan metode purposive sampling, artinya sampel dalam penelitian ini dipilih berdasarkan kriteria yang telah ditentukan. Hasil dari penelitian ini menunjukkan bahwa ukuran Komisaris Independen dan Kepemilikan Institusional memiliki pengaruh yang signifikan terhadap Financial Distress. Namun, Dewan Direksi dan Komite Audit memiliki pengaruh yang tidak signifikan terhadap Financial Distress.\r\n\r\nKata Kunci : Dewan Direksi, Komisaris Independen, Komite Audit, Kepemilikan Institusional dan Financial Distress", "Business administration | Business", "Corporate Social Responsibility Disclosure", "Gender Studies", "Social Sciences", "Social Sciences", null, true, "green", null, null, null, 2, 0, null, false, "2020-01-23 00:00:00"], ["https://openalex.org/W2999626704", "https://doi.org/10.12006/j.issn.1673-1719.2019.216", "http://www.climatechange.cn/CN/10.12006/j.issn.1673-1719.2019.216", null, "IPCC《气候变化与土地特别报告》对陆气相互作用的新认知", "article", "zh", "2020-01-15", 2020, "贾根锁", "-", "贾根锁", null, null, "气候变化研究进展", null, null, "16", "1", "9–16", null, "Environmental science", "Hermeneutics and Narrative Identity", "Philosophy", "Arts and Humanities", "Social Sciences", null, false, "closed", null, null, null, 0, 0, null, false, "2020-01-23 00:00:00"], ["https://openalex.org/W3047110501", "https://doi.org/10.22042/isecure.2020.212763.505", "http://www.isecure-journal.com/article_110236_726e9e11325c8ca9cbd606fa74034626.pdf", null, "A Fast Publicly Verifiable Secret Sharing Scheme using Non-homogeneous Linear Recursions", "article", "en", "2020-07-01", 2020, "Ali Zaghian | Bagher Bagherpour", "- | https://orcid.org/0000-0002-9992-4961", null, "Malek Ashtar University of Technology", "IR", "Isecure.", "Iranian Society of Criptology", "2008-2045", "12", "2", "91–99", null, "Verifiable secret sharing | Correctness | Scheme (mathematics) | Secret sharing | Computer science | Cryptography | Shamir's Secret Sharing | Homogeneous | Theoretical computer science | Homomorphic secret sharing | Computer security | Mathematics | Algorithm | Combinatorics | Programming language | Set (abstract data type)", "Hermeneutics and Narrative Identity", "Philosophy", "Arts and Humanities", "Social Sciences", null, false, "closed", null, null, null, 1, 0, null, false, "2020-08-10 00:00:00"], ["https://openalex.org/W3087141137", "https://doi.org/10.37421/2169-0022.2021.10.571", "https://www.hilarispublisher.com/open-access/role-of-materials-science-and-engineering-in-metal-additive-manufacturing.pdf", null, "Role of Materials Science and Engineering in Metal Additive Manufacturing", "article", "en", "2021-01-01", 2021, "Prabir K. Chaudhury", "-", "Prabir K. Chaudhury", null, null, "Journal of Material Science & Engineering", "OMICS Publishing Group", "2169-0022", "10", "4", "1–6", "Additive Manufacturing or Direct Manufacturing, popularly known as 3D Printing, has become the leading-edge manufacturing technology. Today Metal Additive Manufacturing (MAM) is a reality, not only for prototype fabrication, also for functional parts in all industrial sectors. Design freedom that the AM processes offer has led to design and engineering of new, complex, light-weight structures in all applications. However, in order to realize further and widespread use of metal AM for manufacturing critical components, it is necessary to explore the inherent material freedom in AM. While new metal AM materials are being developed, the role of Materials Science and Engineering (MSE) is becoming more apparent than ever before. This presentation will highlight the increasing role of Materials Science and Engineering in metal AM technologies. This presentation will show the essence of metallurgical principles in realizing full scope of material freedom in metal additive manufacturing. This presentation will demonstrate how fundamental MSE principles can be utilized to develop new materials, optimize metal AM and post processing, and their controls that cannot be achieved by conventional manufacturing methods. The examples with new AM alloys based on Al, Ti, and Ni will be presented, leading to a path of developing advanced and higher performance products for critical applications.", "Scope (computer science) | Manufacturing engineering | Presentation (obstetrics) | 3D printing | Computer science | Mechanical engineering | Engineering | Process engineering", "Additive Manufacturing Materials and Processes", "Mechanical Engineering", "Engineering", "Physical Sciences", null, false, "closed", null, null, null, 0, 0, null, false, "2020-09-25 00:00:00"], ["https://openalex.org/W3097197090", "https://doi.org/10.13140/rg.2.2.32859.18721/2", "https://doi.org/10.13140/rg.2.2.32859.18721/2", null, "Grassroot Innovations for Institute Flexibility: Leveraging Management of Technology to Improve Learner Health through Regular Practices", "article", "en", "2020-01-01", 2020, "Neha Tale | Chaitanya Johari | Rishabh Thapliyal | Padmanav Adhikari | Kirankumar S. Momaya", "- | - | - | https://orcid.org/0000-0002-4594-019X | https://orcid.org/0000-0002-7658-2006", null, null, null, null, null, null, null, null, null, "Indian Institute(s) of Technology (IITs in short) are public technology-based universities in India Declared to be 'institutions of national importance', they have been at the forefront of technical education Well-known for their all-rounded human-centric approach, IITs have encouraged sports In the past, IIT Bombay-one of the oldest among them-has revelled in sporting glory However, recent trends in Inter-IIT sports meets seem to indicate stagnation Some stakeholders of the institute feel that the time is ripe to implement innovative pilots at the grassroot level to alleviate this vexing problem We take participation in biathlon as a proxy for fitness needed for sporting activities and try to analyse the problem better by undertaking an observation-aided problem structuring exercise to reach at actor-clustered root causes for the slow uptake of practices Lack of motivation fuelled by valence deficit among students and lack of awareness about the synergistic impact of regular practices on other facets of life, emerge to be high-potential root causes This exercise is followed by the exploration of alternative group-level virtual distributed-practice ideas (given the context of COVID-19) to leverage management of technology (MoT) of emerging technologies to improve practices Our work adds to the extant body of knowledge along the methodological dimension by expounding in discreet details the steps involved in problem structuring Structured and sustainable initiatives of practices piloted as a part of this study can be implemented on a larger scale and can be communicated to the higher authorities through the Institute Sports Council for immediate implementation © 2020 Towards the Digital World and Industry X 0 - Proceedings of the 29th International Conference of the International Association for Management of Technology, IAMOT 2020 All rights reserved", "Public relations | Best practice | Leverage (statistics) | Context (archaeology) | Business | Knowledge management | Higher education | Marketing | Political science | Computer science", "Hermeneutics and Narrative Identity", "Philosophy", "Arts and Humanities", "Social Sciences", null, true, "gold", null, null, null, 0, 0, null, false, "2020-11-09 00:00:00"], ["https://openalex.org/W3112129221", "https://doi.org/10.65023/jherd.v5i1.170", "https://doi.org/10.65023/jherd.v5i1.170", null, "Dominant Culture Prevailing in Two Agricultural State Universities in Central Luzon", "article", null, "2020-12-09", 2020, "Sigrid Ann Villanueva Jao | Ambrosio M. De la Cruz", "- | -", null, "Centro Escolar University", "PH", "Journal of Higher Education Research Disciplines", null, "2546-0560", "5", "1", null, null, "State (computer science) | Agriculture | Political science | Sociology | Geography | Archaeology | Computer science", "Hermeneutics and Narrative Identity", "Philosophy", "Arts and Humanities", "Social Sciences", null, true, "diamond", null, null, null, 0, 0, null, false, "2020-12-21 00:00:00"], ["https://openalex.org/W3116230246", "https://doi.org/10.59689/incare.v1i4.108", "https://doi.org/10.59689/incare.v1i4.108", null, "THE USE ONLINE METACOGNITIVE STRATEGY ON READING STUDENTS' SKILLS", "article", null, "2020-12-31", 2020, "Mamluatul Ilmiyah", "-", "Mamluatul Ilmiyah", null, null, "INCARE International Journal of Educational Resources", null, "2723-2611", "1", "4", "350–355", "Metacognitive techniques are considered to be essential for developing reading skills. This research investigates whether there are major variations in student reading comprehension scores using metacognitive approaches techniques and investigates what metacognitive strategies are applied to students reading comprehension. Many of the participants in this study were high school eleventh-grade students. Data collection is carried out in the manner of the Reading Comprehension Test and Metacognitive Strategy Questionnaire. The findings showed that metacognitive strategies have a positive impact on student reading achievement. Based on the estimation of the eta-squared effect size of the paired sample, the t-test of the experimental community was 0.141. This indicates that there was a broad impact, with major changes in student grades before and after treatment. There are nine subcategories of metacognitive methods for student understanding. For example, Advance Organizer, Self-Management, Tracking Awareness, Output Monitoring, Self-Assessment Self-Assessment, and Self-Reflection. Although the applicability is strong Metacognitive techniques for reading comprehension fall into two subcategories: Selective treatment and organizational preparation. And the most significant use of the method is Selective focus, though self-reflection is the least technique. Keywords : online metacognitive, metacognotive strategy, reading skills", "Metacognition | Reading comprehension | Psychology | Reading (process) | Mathematics education | Comprehension | Test (biology) | Cognition | Computer science", "Hermeneutics and Narrative Identity", "Philosophy", "Arts and Humanities", "Social Sciences", null, true, "diamond", "cc-by-sa", null, null, 0, 0, null, false, "2021-01-05 00:00:00"], ["https://openalex.org/W3113927501", "https://doi.org/10.59689/incare.v1i4.141", "https://doi.org/10.59689/incare.v1i4.141", null, "EXPLORING ONLINE COLLABORATIVE WRITING WITH SOCIAL MEDIA", "article", null, "2020-12-31", 2020, "Habib Nur Afif | Muhammad Luthfi Abdillah", "- | -", null, null, null, "INCARE International Journal of Educational Resources", null, "2723-2611", "1", "4", "356–362", "Online interactive learning is an innovative approach intended to create a commitment to creating narrative text writing, comprehension, and creative client ideas. This assessment's inspiration is to evaluate the effect of online interactive learning on student grades and narrative texts' composition. Analysis has been performed at MTs. Miftahul Huda Tuban in the 7th grade. To determine does online collaborative learning through telegram is successful, researchers use a pre-experimental method when the information is measured using a t-test statistical formula. As a result of the exploration, the mean pre-test was 51,3333, and the mean post-test was 84,000. From the pre-test post-test study results, it can be shown that there is an impact on increasing student scores by using online interactive learning methods through telegram.", "Narrative | Test (biology) | Comprehension | Social media | Computer science | Mathematics education | Online learning | Psychology | Collaborative learning | Multimedia | World Wide Web | Linguistics", "Hermeneutics and Narrative Identity", "Philosophy", "Arts and Humanities", "Social Sciences", null, true, "diamond", "cc-by-sa", null, null, 0, 0, null, false, "2021-01-05 00:00:00"], ["https://openalex.org/W3117868201", "https://doi.org/10.59689/incare.v1i4.110", "https://doi.org/10.59689/incare.v1i4.110", null, "THE EFFECT OF ONLINE PROJECT-BASED LEARNING ON STUDENTS' WRITING DESCRIPTIVE TEXT IN COLLABORATIVE LEARNING AT SECOND GRADE OF SMK NU AL BAROKAH BABAT", "article", null, "2020-12-31", 2020, "Ahmad Sholichin | Muhammad Luthfi Abdillah", "- | -", null, null, null, "INCARE International Journal of Educational Resources", null, "2723-2611", "1", "4", "363–370", "Project-based learning is a type of learning that uses tasks as a basis for learning. It is a very innovative learning method for engaging in project work, in which students work individually on building up their learning and on real goods. The goal of this study was to determine the impact of using online project-based learning on student learning skills and writing descriptive texts. The study was conducted in class XI at SMK NU Al Barokah Babat. To determine whether or not online project based lear n city in Rupandehi district, Nepal were purposively selected as research participants. Out of three participants, two were males and one was female who had been practicing collaborative teaching in their classrooms for more than four years. The research participants were interviewed using a semi-structured interview technique to collect relevant information for the purpose. The study reveals that English teachers have positive views towards collaborative practices and undertaking different collaborative activities such as sharing lessons, exchanging answer sheets, team teaching and so on for improving their classroom pedagogy and professional development. The findings also expose the benefits that English teachers have from collaborative practices, and the challenges they have faced while adopting these practices inside the classroom and the beyond.", "Pedagogy | Mathematics education | Sociology | Psychology", "EFL/ESL Teaching and Learning", "Language and Linguistics", "Arts and Humanities", "Social Sciences", null, true, "hybrid", "cc-by", null, null, 0, 0, null, false, "2025-07-22 00:00:00"], ["https://openalex.org/W3203552846", "https://doi.org/10.13140/rg.2.2.24821.13285", "https://doi.org/10.13140/rg.2.2.24821.13285", null, "THE USE OF RESISTIVITY TESTING FOR QUALITY CONTROL OF CONCRETE MIXTURES", "article", "en", "2020-01-01", 2020, "Julie Ann Hartell", "-", "Julie Ann Hartell", null, null, null, null, null, null, null, null, null, "Quality (philosophy) | Electrical resistivity and conductivity | Control (management) | Forensic engineering | Environmental science | Engineering | Computer science | Artificial intelligence | Electrical engineering | Physics", "Geophysical Methods and Applications", "Ocean Engineering", "Engineering", "Physical Sciences", null, true, "gold", null, null, null, 0, 14, "https://openalex.org/W40008957 | https://openalex.org/W1482933853 | https://openalex.org/W1589994308 | https://openalex.org/W2001440747 | https://openalex.org/W20 nalex.org/W2124532504 | https://openalex.org/W2334259045", false, "2025-07-22 00:00:00"], ["https://openalex.org/W3177285596", "https://doi.org/10.13140/rg.2.2.33093.82404", "https://doi.org/10.13140/rg.2.2.33093.82404", null, "Alternative approach to controlling citrus black spot disease", "article", "en", "2020-01-01", 2020, "Jahman Thabo Thabede", "-", "Jahman Thabo Thabede", null, null, null, null, null, null, null, null, null, "Environmental science", "Phytoplasmas and Hemiptera pathogens", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, true, "gold", null, null, null, 0, 0, null, false, "2025-07-22 00:00:00"], ["https://openalex.org/W3215576690", "https://doi.org/10.30870/m.v1i1.12930", "https://doi.org/10.30870/m.v1i1.12930", null, "Pelatihan Tari Kreasi Banten Ing Tanah Jawara di Sanggar Seni Rajawali Pandeglang", "article", "jv", "2022-01-08", 2022, "Siti Nurasiah Jamil | Alis Triena Permanasari | Hadiyatno Hadiyatno", "- | - | -", "Siti Nurasiah Jamil", "Sultan Ageng Tirtayasa University", "ID", "Matra.", null, "2809-2775", "1", "1", null, "ABSTRACT The Banten Ing Tanah Jawara dance training is a dance training process created by Rajawali Pandeglang art studio for male dancers. The Rajawali Pandeglang art studio was one of the studios in Pandeglang Regency that is active in the dance training and has a fairly good dancing quality, especially for male dancers. This can be seen from the techniques and movements performed by male dancers. This study aims to find out the process of the Banten Ing Tanah Jawara dance training for male members, as well as what factors are supporting and inhibiting the training process. This study used a descriptive method using a qualitative approach and supported by other supporting theories by looking at the training process of the Banten Ing Tanah Jawara creation dance at Rajawali Pandeglang art studio. Data collected  by using observational studies, interviews, and documentation. Based on the results of the study, it was shown that the training process for the creation of Banten Ing Tanah Jawara dance at the Rajawali Pandeglang art studio was held four times gradually, scheduled and systematic, each meeting covering planning, implementation, observation and evaluation, and the supporting factors for the training are the dancers's basic abilities and the trainers's roles, whereas the inhibitin factors in the training process is the discipline of training time. Keywords: Creative Dance Training Process, Creative Dance, Banten Ing Tanah Jawara. ABSTRAK Proses pelatihan tari kreasi Banten Ing Tanah Jawara adalah proses pelatihan tari yang dilakukan di sanggar seni Rajawali Pandeglang dan diberikan kepada penari laki-laki. Sanggar seni Rajawali Pandeglang merupakan salahsatu sanggar yang ada di Kabupaten pandeglang yang aktif dalam proses pelatihan tari dan memiliki kualitas kepenarian yang cukup baik terutama bagi penari laki-laki. Hal ini dapat dilihat dari teknik dan pengolahan gerak yang dilakukan penari laki-laki. Penelitian ini bertujuan untuk mengetahui bagaimana proses pelatihan tari Banten Ing Tanah Jawara bagi anggota laki-laki, serta apa saja yang menjadi faktor pendukung dan penghambat dalam proses latihan tersebut. Metode dalam penelitian ini menggunakan metode deskriptif dengan menggunakan pendekatan kualitatif serta ditunjang dengan teori pendukung lainnya dengan melihat proses pelatihan tari kreasi Banten Ing Tanah Jawara di sanggar seni Rajawali Pandeglang. Teknik pengumpulan data dilakukan dengan studi observasi, wawancara, dan dokumentasi. Berdasarkan hasil penelitian menunjukan bahwa proses pelatihan tari kreasi Banten Ing Tanah Jawara di sanggar seni Rajawali Pandeglang dilakukan sebanyak empat kali pertemuan secara bertahap, terjadwal dan sistematis setiap pertemuan meliputi perencanaan,pelaksanaan, pengamatan dan evaluasi, dengan adanya faktor pendukung yakni kemampuan dasar penari dan peran pelatih, serta faktor yang menjadi penghambat dalam proses latihan adalah kedisiplinan waktu latihan. Kata Kunci : Proses Pelatihan, Tari kreasi,  Banten Ing Tanah Jawara", "Studio | Dance | Visual arts | Art", "Cultural and Artistic Studies", "Cultural Studies", "Social Sciences", "Social Sciences", null, true, "diamond", null, null, null, 0, 0, null, false, "2025-07-22 00:00:00"], ["https://openalex.org/W3186194392", "https://doi.org/10.24377/ejqrp.article3065", "https://doaj.org/article/e6ff7fa6fc7d46508d99ee9adb82a08b", null, "A roadmap to recovery and a life worth living", "article", "en", "2021-02-24", 2021, "Clodagh Ní Mhaoláin | Pádraig MacNeela", "- | https://orcid.org/0000-0002-5382-4113", null, "St John of God Hospital", "AU", "DOAJ (DOAJ: Directory of Open Access Journals)", null, null, "11", null, "87–102", "This research explores adolescents’ lived experience of 24 weeks of Dialectical Behaviour Therapy (DBT), designed to address severe mental health difficulties including suicidal and self-harming behaviour. There is a lack of published literature regarding adolescent lived experiences of 6 months comprehensive DBT. A qualitative design in the form of Interpretative Phenomenological Analysis (IPA) is an appropriate fit for research questions concerned with individual phenomenology. Six adolescent service users self-selected to take part in the research. One superordinate theme around recovery of mental health and wellbeing was characterised as ‘building a roadmap to recovery and a life worth living’. Three subordinate themes depict the steps on the road and describe how individuals travelled from ‘alienation to insight’, ‘isolation to connection’, and from ‘passive disempowered recipient of intervention to proactive engagement as empowered service users’. Novel links between DBT, identity process theory, attachment theory and critical psychology are made.", "Interpretative phenomenological analysis | Superordinate goals | Mental health | Psychology | Phenomenology (philosophy) | Psychotherapist | Qualitative research | Identity (music) | Dialectic | Social psychology | Developmental psychology | Sociology | Epistemology | Social science", "Psychotherapy Techniques and Applications", "Clinical Psychology", "Psychology", "Social Sciences", null, true, "green", null, null, null, 0, 0, null, false, "2025-07-22 00:00:00"], ["https://openalex.org/W3126955224", "https://doi.org/10.47310/iarjel.2020.v01i01.006", "https://doi.org/10.47310/iarjel.2020.v01i01.006", null, "Chimamanda Ngozi Adichie’s Purple Hibiscus as a Rewriting of Nathaniel Hawthorne's “Rappaccini's Daughter”", "article", "en", "2020-06-20", 2020, "Mona Khaled Alebrahim", "https://orcid.org/0000-0002-8562-8280", "Mona Khaled Alebrahim", null, null, "International Academic Journal of Education and Literature", null, "2708-5112", "01", "01", "1–6", "This paper focuses on the shared literary features between Nathaniel Hawthorne's “Rappaccini's Daughter” and Chimamanda Ngozi Adichie's Purple Hibiscus. It discusses Hawthorne's short story (1844) as a major work influencing Adichie's novel (2003). It investigates Adichie's approach of unraveling some of the primary issues of her time through referring to Hawthorne's views in “Rappaccini's Daughter”. The paper also examines the theme of Religion and character formation as two similar literary elements, and it examines how the symbolism of the experiment flower is used differently according to the authors' thematic views. By considering Adichie's Purple Hibiscus as a rewriting of Hawthorne's “Rappaccini's Daughter”, the researcher aims to depict the themes of religion and science, character formation, and symbolism as shared literary elements between the two works.", "Daughter | Rewriting | Art | Literature | Law | Computer science | Political science", "Postcolonial and Cultural Literary Studies", "Literature and Literary Theory", "Arts and Humanities", "Social Sciences", null, true, "hybrid", "cc-by", null, null, 0, 0, null, false, "2025-07-22 00:00:00"], ["https://openalex.org/W3211531726", "https://doi.org/10.58213/fc6y3a65", "https://doi.org/10.58213/fc6y3a65", null, "EXPLORING THE CONTRIBUTION OF MEDIA IN ADVANCING SUSTAINABLE DEVELOPMENT GOALS IN INDIA", "article", "en", "2021-06-30", 2021, "Azamat Ali", "https://orcid.org/0000-0003-2931-2166", "Azamat Ali", null, null, "Vidhyayana", null, "2454-8596", "6", "6", null, "Media is an important participant in regard to societies reaching the goals of development-both as a contributor and a beneficiary. News media can play an important role in floating awareness about the Sustainable Development Goals (SDGs). Media in all its forms has a crucial role to play in the development agenda to ensure that citizens are well informed. The media has important roles to play, to inform, to educate, and to provide a platform for public debate and discussion. It could serve as catalyst for citizens’ empowerment and help to hold government and authorities to account. Third world countries like India have been facing odd situations in terms of poverty, environment, health, politics, and education. There have been efforts by the government and non- government agencies to sensitize the citizens and to make them acknowledge the programs intended at improving their socio-economic welfare. Communication is a vital tool in mobilizing people in the direction of the participatory process which in turn makes development an achievable goal. The present paper is an attempt to provide comprehensive information and explore the significance of the role of media as a powerful tool towards achieving the Sustainable Development Goal in India. The qualitative approach is conducted to explore deeper insight of SDGs understanding from news media. This study found that not all SDGs are informed well. Only several SDGs are framed based on the concern of public policy.", "Public relations | Sustainable development | Government (linguistics) | Beneficiary | Empowerment | Citizen journalism | Political science | Poverty | Participatory development | Process (computing) | Economic growth | Business | Economics", "Climate Change Communication and Perception", "Sociology and Political Science", "Social Sciences", "Social Sciences", null, true, "diamond", "cc-by", null, null, 0, 4, "https://openalex.org/W1988574456 | https://openalex.org/W2100972910 | https://openalex.org/W2905217347 | https://openalex.org/W2991272886", false, "2025-07-22 00:00:00"], ["https://openalex.org/W3181622464", "https://doi.org/10.59689/incare.v1i4.103", "https://doi.org/10.59689/incare.v1i4.103", null, "PERAN TEMAN SEBAYA DALAM PEMBENTUKAN AKHLAK ANAK: STUDI DI MTs MUHAMMADIYAH CURUP", "article", "ms", "2020-12-31", 2020, "Nila Pratiwi | Sugiatni Sugiatni | Asri Karolina | Idi Warsah", "- | - | https://orcid.org/0000-0002-8496-4848 | -", null, "Institut Agama Islam Negeri Bengkulu", "ID", "INCARE International Journal of Educational Resources", null, "2723-2611", "1", "4", "280–297", "This study sought to investigate a depiction of students’ parallel social engagement pattern in MTS Muhammadiyah of Curup, Bengkulu. In so doing, it dealt with whether their peers played a role in the formation of students’ morality. The foregoing question was answered through field research using a qualitative approach. The subjects as well as informants of this study were the principal, teachers, and students at MTs Muhammadiyah of Curup. Data collection techniques were observation and interviews, and then the data were analyzed using Miles’ et al approach, namely data reduction, data presentation, and conclusion drawing. This study concluded that the role of peers for the formation of students’ morality was seen in students’ tendency to choose their playmates at school. If they preferred good friends, then they would follow those friends’ behavior, and vice versa. Efforts made by the school to overcome students who were not morally good were in a way that teachers consolidate with counseling teachers, class teachers, and parents in order to work together to overcome this problem.", "Psychology | Morality | Depiction | Data collection | Principal (computer security) | Presentation (obstetrics) | Class (philosophy) | Data presentation | Social psychology | Pedagogy | Mathematics education | Sociology | Social science", "Educational Methods and Impacts", "Education", "Social Sciences", "Social Sciences", null, true, "diamond", "cc-by-sa", null, null, 0, 0, null, false, "2025-07-22 00:00:00"], ["https://openalex.org/W3025988299", "https://doi.org/10.66392/003777220828526515", "https://doi.org/10.66392/003777220828526515", null, "Age and Sex Composition", "article", "en", "2020-01-01", 2020, "Nicholas I. Birnbaum", "-", "Nicholas I. Birnbaum", null, null, "Social Education", null, "0037-7724", "84", "1", "46–48", "Data on age and sex composition are some of the most basic statistics a nation can collect about its people. They are determined by births, deaths, and migration and, in turn, affect other demographic characteristics such as fertility rates and regional changes in population (increases or decreases). In fact, both of these are the two constants that have been questions on every single census since 1790.", "Composition (language) | Art", "Demographic Trends and Gender Preferences", "Gender Studies", "Social Sciences", "Social Sciences", null, false, "closed", null, null, null, 2, 0, null, false, "2025-07-22 00:00:00"], ["https://openalex.org/W3197132490", "https://doi.org/10.7146/ht.v121i1.127131", "https://doi.org/10.7146/ht.v121i1.127131", null, "Palle Ove Christiansen: Med skibet i kroppen. Mennesker og maritimt miljø i Det sydfynske øhav 1750-1950. Marstal Søfartsmuseum, 2020.", "article", "da", "2021-07-06", 2021, "Peter Henningsen", "https://orcid.org/0000-0003-2060-1279", "Peter Henningsen", null, null, "Historisk Tidsskrift", null, "0106-4991", null, null, null, null, "History", "Historical and Archaeological Studies", "History", "Arts and Humanities", "Social Sciences", null, false, "closed", null, null, null, 0, 0, null, false, "2025-07-23 00:00:00"], ["https://openalex.org/W3216914702", "https://doi.org/10.13140/rg.2.2.29510.74567", "https://doi.org/10.13140/rg.2.2.29510.74567", null, "Impact of nutritional factors and lifestyle in the etiology of micronutrients deficiency causing new world syndrome", "article", "en", "2021-01-01", 2021, "Pooja Yadav | Vinita Singh", "https://orcid.org/0000-0002-5419-8337 | -", null, null, null, null, null, null, null, null, null, "The present study was to assess the prevalence of New World Syndrome in office going person and their dietary habits. New World Syndrome is a set of non-communicable diseases brought on by consumption of junk food and a sedentary lifestyle, especially common to office going person. It is characterized by obesity, heart disease, diabetes, hypertension, and shortened life span. The data concerning dietary intake of the respondents were collected using 24 hour recall method, Data concerning lifestyle and Dietary habit was obtained from the respondents by ‘questionnaire-cum interview’ and purposive random sampling method. 2.11 mg of thiamine, 1.76 mg of riboflavin and 15.39 mg of niacin, were consumed by male respondents followed by 2.31 mg thiamine, 1.64 mg riboflavin and 15.81 mg niacin were consumed by female respondents. Sedentary lifestyle consists of excessive periods of sitting or lying down while engaging in activities such as reading, watching television or using a mobile phone or computer. Sitting at a desk for long periods of time, combined with environmental factor such as artificial light, and workplace stressors such as meeting deadlines can have a series of negative effects on employee physical and mental wellbeing.", "Riboflavin | Environmental health | Medicine | Niacin | Obesity | Sitting | Thiamine | Micronutrient | Gerontology | Overeating | Psychology | Food science | Internal medicine | Biology", "Diet and metabolism studies", "Physiology", "Medicine", "Health Sciences", null, true, "gold", null, null, null, 0, 0, null, false, "2025-07-23 00:00:00"], ["https://openalex.org/W3093519922", "https://doi.org/10.13140/rg.2.2.29971.13608", "https://doi.org/10.13140/rg.2.2.29971.13608", null, "ONLINE TRAINING OF UNIVERSITY STUDENTS AS TAEKWONDO REFEREES DURING A CORONAVIRUS PANDEMIC", "article", "en", "2020-01-01", 2020, "Iliya Dimitrov", "-", "Iliya Dimitrov", null, null, null, null, null, "92", "7", "106–116", "COVID-19 caused the suspension of most sports events and the dismissal of all athletes, coaches, sports specialists, officials (referees and judges) and other persons involved in the field In recent decades technological progress and digitalisation have undergone substantial development, thereby providing excellent opportunities for online training In times of social distancing, hardware and software solutions have gained prominence as appropriate and necessary means of remote attendance for participants in educational events Referees have become an integral part of modern sports as the officials upholding the proper application of the competition rules, fair play and the observance of the code of ethics during events Considering the pandemic situation, which renders the conducting of attended events impossible, as well as the key role of sports officials, we set out to organize the training of officials online The target group for the study consisted of students from the Taekwondo Coach specialty in the faculty of the Vassil Levski National Sports Academy, given their specific knowledge and involvement in the sport The implementation of the project showed that online training was a suitable method for the reinforcing, enriching and improving of the competencies of officials in Bulgaria during an ongoing pandemic In the field, distance training proved to be a promising practice for the conducting of all theoretical and some practical classes for the officials in the country The studies conducted allow us to conclude that during the COVID-19 pandemic it is possible to use modern technical means and methods successfully in order to involve athletes, coaches and officials with sports activities The results of this project provoke us to re-assess the policies and methods applicable to the training of officials at the national and the international level", "Attendance | Athletes | Social distance | Pandemic | Training (meteorology) | Public relations | Distancing | Medical education | Dismissal | Psychology | Political science | Coronavirus disease 2019 (COVID-19) | Medicine | Law", "Physical Education and Training Studies", "Physical Therapy, Sports Therapy and Rehabilitation", "Health Professions", "Health Sciences", null, true, "gold", null, null, null, 2, 1, "https://openalex.org/W3032648890", false, "2025-07-23 00:00:00"], ["https://openalex.org/W3190843759", "https://doi.org/10.61622/0100-7254492202106", "https://doi.org/10.61622/0100-7254492202106", null, "Endometrite crônica e infertilidade", "article", "en", "2021-01-01", 2021, "Leisa Beatriz Grando", "-", "Leisa Beatriz Grando", null, null, "Femina", null, "0100-7254", "49", "2", "109–114", null, "Computer science", "Ovarian function and disorders", "Reproductive Medicine", "Medicine", "Health Sciences", null, false, "closed", null, null, null, 0, 25, "https://openalex.org/W1558767898 | https://openalex.org/W1664347651 | https://openalex.org/W1992916096 | https://openalex.org/W1996280689 | https://openalex.org/W2011053096 | https://openalex.org/W2020727148 | https://openalex.org/W2089734665 | https://openalex.org/W2115249034 | https://openalex.org/W2117971677 | https://openalex.org/W2130222963 | https://openalex.org/W2164868903 | https://openalex.org/W2175923714 | https://openalex.org/W2416366096 | https://openalex.org/W2569771289 | https://openalex.org/W2625168222 | https://openalex.org/W2770689273 | https://openalex.org/W2794253029 | https://openalex.org/W2807755540 | https://openalex.org/W2811187674 | https://openalex.org/W2912370346 | https://openalex.org/W2921965973 | https://openalex.org/W2922277063 | https://openalex.org/W2945642012 | https://openalex.org/W3014950437 | https://openalex.org/W3017699339", false, "2025-07-23 00:00:00"], ["https://openalex.org/W3108663739", "https://doi.org/10.47310/iarjel.2020.v01i01.014", "https://doi.org/10.47310/iarjel.2020.v01i01.014", null, "Understanding Society through Fiction: an X-ray of the Remote Uganda from the Perspective of Nakibimbiri Omunjakko", "article", "en", "2020-08-12", 2020, "Uche Nnyagu | Onunkwor | Benedette Ngozi", "- | - | -", null, null, null, "International Academic Journal of Education and Literature", null, "2708-5112", "1", "1", "1–7", "The saying that literature is a mirror of society is well demonstrated in Nakibimbiri’s The Sobbing Sounds. The novel leaves the reader with a clear picture of how life was lived in the rural part of Uganda in the immediate past. People who grew up in rural areas read and enjoy the story as it shares similar experiences with them. Those who grew up in urban areas read the novel and see the episodes in the novel as bizarre and unthinkable. Nakibimbiri has through the novel, naturally shown the society the way it was in the recent past. The researchers discover that Nakibimiri has profusely blended historical facts in the novel so naturally in such a way that the reader is not left in doubt about the credibility of any episode of the novel. They have therefore, parsed the novel with a view to unraveling some societal facts about the rural part of Uganda so that contemporary audience would have an idea of many transformations that have taken place over the time. It is observed from the novel that only little or no disparities at all existed in the way life was lived in almost every rural parts of Africa as a whole.", "Perspective (graphical) | Art | Visual arts", "African history and culture studies", "Anthropology", "Social Sciences", "Social Sciences", null, true, "hybrid", "cc-by", null, null, 0, 0, null, false, "2025-07-23 00:00:00"], ["https://openalex.org/W3164836516", "https://doi.org/10.47310/iarjet.2021.v02i01.020", "https://doi.org/10.47310/iarjet.2021.v02i01.020", null, "The Review of Application of Drones for Smart Agriculture", "article", "en", "2021-03-13", 2021, "G Tamilselvan | J Niresh | D Dharun", "- | - | -", null, null, null, "IAR Journal of Engineering and Technology", null, "2708-5163", "02", "01", "1–11", "In recent years, due to environmental changes, the crop yield in the agriculture is widely affected and hence needs technological intervention. The most recent advancement is the expansion in the utilization of tiny, unmanned aerial vehicles (UAVs) normally known as drones for agrobusiness. Data gathered through drone forays genuinely necessary information to enact systematic models for horticulture. In supporting accuracy in cultivating, drones can do soil health examininations, screen crop health, help with arranging water system plans, apply manures, collects gauge yield information and gives important information regarding climate change. Data gathered through drone combined with other information sources and scientific arrangements give noteworthyinformation. This paper reviews the application of drones for e-Agriculture.", "Drone | Agriculture | Business | Computer security | Computer science | Geography", "Smart Agriculture and AI", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, true, "hybrid", "cc-by", null, null, 0, 0, null, false, "2025-07-23 14:35:01.976867"], ["https://openalex.org/W3120977812", "https://doi.org/10.67442/drc05e64", "https://doi.org/10.67442/drc05e64", null, "Dose dependent effects of O2/O3 therapy on PSA levels of patient with risk of prostate cancer", "article", "es", "2020-06-01", 2020, "David Pakula A.P", "-", "David Pakula A.P", null, null, "Ozone Therapy Global Journal", null, "2659-8647", "10", "1", "69–77", "Oxygen/Ozone (O2/O3) is a complementary therapy for prostate cancer, as with other types of cancer, i.e., it is used in support of conventional treatments such as radiation therapy or surgical removal of the prostate. However, some prostate cancer patients elect to manage prostate cancer by active surveillance rather than conventional therapies in accordance with treatment guidelines, or due to the uncertain prognostic value of testing and the side-effects of the treatments. The objective of this report is to demonstrate the potentially beneficial therapeutic value of O2/O3 treatment, applied in effective doses, for a prostate cancer patient electing disease management by active surveillance. The subject was a 64-year-old male diagnosed by needle biopsy with localized prostate cancer classified as being in the unfavorable intermediate risk group. He elected active surveillance to manage his cancer instead of recommended conventional therapies and received O2/O3 therapy for about a year. The treatment was divided roughly into four quarterly phases, with a PSA test performed at the end of each of the four phases. During phases 2 and 3 of the treatment, the patient’s PSA score increased from 9.7 ng/mL to 14.7 ng/mL. However, at the end of phase 4 his PSA score decreased to 11.7. During phase 4, the O2/O3 treatment was performed more regularly than during phases 2 and 3, and at lower concentrations and overall doses. This suggests that O2/O3 treatment at the correct doses and frequency of treatment may have beneficial therapeutic value for a prostate cancer patient electing disease management through active surveillance rather than conventional treatment. ..", "Prostate cancer | Medicine | Radiation therapy | Prostate | Cancer | Internal medicine | Oncology | Prostate-specific antigen | Urology | Surgery", "Medical and Biological Ozone Research", "Pharmacology", "Medicine", "Health Sciences", null, false, "closed", null, null, null, 0, 0, null, false, "2025-07-23 00:00:00"], ["https://openalex.org/
