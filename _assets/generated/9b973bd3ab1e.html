, "1993-8233", "4", "6", "820–830", "Export-led strategies are very crucial to achieving growth and goals of developing and transition economies such as Ghana. As a result, export strategies are being adopted in many developing countries. Although such export strategies might be in place, the deployment of public resources and funds warrant periodic programmatic evaluation. The objective of the study was to assess Ghana’s wood products export sector strategies and performance. Using a combined National Export Strategy Template (NEST) and Balanced Scorecard (BCS) framework, we surveyed the 250 largest wood products manufacturers in Ghana. Overall, respondents indicated there was no comprehensive and well documented export strategy in place. We suggest that public and private sector institutions in the wood export sector coordinate activities to create an enabling environment for Ghana wood products exporters to compete favorably in the international market. The application of a combined National Export Strategy Template (NEST) and Balanced Scorecard (BCS) framework can be used to evaluate wood product export strategies in any geographical or national setting. This approach is a valuable tool that pinpoints strategic strengths and weaknesses. Key words:", "Balanced scorecard | Business | Software deployment | Export performance | Product (mathematics) | Private sector | Public sector | Developing country | Strengths and weaknesses | Industrial organization | Marketing | Economic growth | Economics | Economy | Engineering", "Forest Management and Policy", "Global and Planetary Change", "Environmental Science", "Physical Sciences", null, true, "green", null, null, null, 1, 1, "https://openalex.org/W1583067148", false, "2016-06-24 00:00:00"], ["https://openalex.org/W2181630675", null, "https://pubmed.ncbi.nlm.nih.gov/3961635", null, "Endomyocardial biopsy technique in infants and small children.", "article", "en", "1986-03-29", 1986, "De Moor | Derek G. Human", "- | http  null, null, null, null, null, "This study investigates whether there exists a “University Prestige” effect in South Korea’s labor market by using the Korean Labor and Income Panel Data. To estimate the degree of this effect, this study employed the unique empirical strategy, the residual analysis. The findings indicate that a university prestige effect exists on earnings, with the wage premium for the “name” of Seoul National University worth more than twice those of Korea and Yonsei Universities. The prestige effect for Seoul National University results in wages that are, on average, 12% higher than that of other universities.", "Prestige | Earnings | Occupational prestige | Wage | Economics | Demographic economics | Labour economics | Panel data | Sociology | Demography | Accounting | Econometrics", "Hermeneutics and Narrative Identity", "Philosophy", "Arts and Humanities", "Social Sciences", null, true, "green", "cc-by-sa", null, null, 5, 10, "https://openalex.org/W1973420336 | https://openalex.org/W1998865302 | https://openalex.org/W2024692342 | https://openalex.org/W2032244091 | https://openalex.org/W2042306281 | https://openalex.org/W2055947654 | https://openalex.org/W2071122767 | https://openalex.org/W2166257424 | https://openalex.org/W2169177526 | https://openalex.org/W3023477630", false, "2016-06-24 00:00:00"], ["https://openalex.org/W2188200265", "https://doi.org/10.5897/ijps11.856", "https://academicjournals.org/journal/IJPS/article-abstract/ADBBB8825902", null, "Soft ordered Abel-Grassmans groupoid (AG-groupoid)", "article", "en", "2011-10-23", 2011, "Tariq Shah | İnayatur Rehman | Asima Razzaque", "https://orcid.org/0000-0002-0099-5859 | - | https://orcid.org/0000-0002-7579-8972", null, null, null, "International Journal of the Physical Sciences", "Academic Journals", "1992-1950", "6", "25", "6118–6126", null, "Double groupoid | Mathematics | Algebra over a field | Pure mathematics | Class (philosophy) | Epistemology | Philosophy", "Hermeneutics and Narrative Identity", "Philosophy", "Arts and Humanities", "Social Sciences", null, true, "green", null, null, null, 3, 18, "https://openalex.org/W1965388297 | https://openalex.org/W1974719612 | https://openalex.org/W1976915331 | https://openalex.org/W1978352585 | https://openalex.org/W1979152784 | https://openalex.org/W1980564456 | https://openalex.org/W1982907249 | https://openalex.org/W1992301326 | https://openalex.org/W2031209537 | https://openalex.org/W2036593034 | https://openalex.org/W2044496841 | https://openalex.org/W2069754181 | https://openalex.org/W2071796503 | https://openalex.org/W2083267403 | https://openalex.org/W2095209150 | https://openalex.org/W2155976821 | https://openalex.org/W2612805960 | https://openalex.org/W2912565176", false, "2016-06-24 00:00:00"], ["https://openalex.org/W2186718334", "https://doi.org/10.5897/jpp12.043", "https://academicjournals.org/journal/JPP/article-abstract/C906B8A5725", null, "Chemical composition of the methanolic leaf and stem bark extracts of Senna siamea Lam.", "article", "en", "2013-04-30", 2013, "Aminu Mohammed | Mubarak Labaran Liman | Atiku", "https://orcid.org/0000-0001-5592-1083 | https://orcid.org/0000-0001-6533-5395 | -", null, null, null, "Journal of Pharmacognosy and Phytotherapy", "Academic Journals", "2141-2502", "5", "5", "98–100", "The study was conducted to evaluate some chemical constituents of the leaf and stem bark of Senna siamea. Standard methods were used in all the analysis. Preliminary phytochemical screening indicated the presence of flavonoids, tannins, polyphenols, anthraquinones, saponins, and glycosides. Quantitative study of some phytoconstituents showed a significant difference of (p < 0.05) between the leaf contents and that of the stem bark with the exception of tannins. The results of elemental analysis revealed that the levels of potassium (K), sodium (Na), magnesium (Mg) and manganese (Mn) differed significantly (p < 0.05) when leaf contents were compared with that of the stem bark, while nickel (Ni), chromium (Cr), iron (Fe) and copper (Cu) contents were not statistically (p < 0.05) different. This result indicated that S. siamea has great potentials as it contains active pharmaceutical ingredients.", "Anthraquinones | Chemistry | Bark (sound) | Phytochemical | Potassium | Glycoside | Chemical composition | Polyphenol | Traditional medicine | Manganese | Sodium | Magnesium | Botany | Biology | Organic chemistry | Medicine | Biochemistry", "Phytochemistry and biological activity of medicinal plants", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", null, null, null, 6, 11, "https://openalex.org/W1518708747 | https://openalex.org/W1889893000 | https://openalex.org/W1998352470 | https://openalex.org/W2016750201 | https://openalex.org/W2124310814 | https://openalex.org/W2145250084 | https://openalex.org/W2149681111 | https://openalex.org/W2237169794 | https://openalex.org/W2289868092 | https://openalex.org/W2344912615 | https://openalex.org/W2505668947", false, "2016-06-24 00:00:00"], ["https://openalex.org/W90528024", "https://doi.org/10.2495/mic950371", "https://www.witpress.com/Secure/elibrary/papers/MIC95/MIC95037FU.pdf", null, "Modelling And Simulation Of An IntelligentMotion Surface In MEMS", "article", "en", "1970-01-01", 1970, "W. Liu | P. Will | Michael D. Pottenger", "- | - | -", null, null, null, "WIT transactions on the built environment", "WIT Press", "1743-3509", "13", null, null, "An Intelligent Motion Surface (IMS) consisting of an array of micro-electricalmechanical (MEM) manipulators has been designed and simulated for application in micro-assembly. The array imparts forces on objects being carried on its surface. The appropriate choice of force fields is shown to cause parts placed on the array to be moved in manners that are useful and appropriate to assembly operation. A simulator associated with a user interface was built to explore the practicability of programming a miniature assembly bench. A computational geometry approach was used for modeling and implementation of the simulator in order to model both the operation of the motion surface and to support the user in programming the surface to operate in a specific manner. Mathematical simplifications were applied to speed up the execution of the simulation. The paper describes the results of experiments on primitive assembly operations and some limitations of the approach.", "Surface (topology) | Computer science | Interface (matter) | Motion (physics) | Simulation | Artificial intelligence | Geometry | Parallel computing", "Advanced MEMS and NEMS Technologies", "Electrical and Electronic Engineering", "Engineering", "Physical Sciences", null, false, "closed", null, null, null, 0, 3, "https://openalex.org/W285738658 | https://openalex.org/W2086969205 | https://openalex.org/W2097033769", false, "2016-06-24 00:00:00"], ["https://openalex.org/W56903138", "https://doi.org/10.2495/ports000291", "https://www.witpress.com/elibrary/wit-transactions-on-the-built-environment/51/4654", null, "Experimental Investigation Of The SeismicReponse Of Rubble-mound Breakwaters", "article", "en", "2000-09-07", 2000, "Constantine D. Memos", "https://orcid.org/0000-0002-2385-7328", "Constantine D. Memos", null, null, "WIT transactions on the built environment", "WIT Press", "1743-3509", "51", null, null, "Rubble-mound breakwaters are subject not only to wave action but, also, to other types of environmental loading, such as earthquakes. High seismic activity combined with soft foundation soil can lead to large settlements and even to failures of these structures. This paper reports on the experimental investigation undertaken to study the behaviour of rubble-mound breakwaters under seismic loading. Two models were built: the first one was designed to sit on a rigid bed, and the second on a yielding base of loose sand. Input earthquakes were of horizontal acceleration with increasing magnitude at consecutive tests. Measurements of hydrodynamic pressures and accelerations were taken. It was found that in general rubble-mound breakwaters resting on rigid bed are quite seismic resistant structures. Careful placement of the armour units provides extra strength to the armour layer as well as to the whole mound. The hydrodynamic forces on the faces of the break water, although small compared to the inertia effect on the structure, should be taken into account since they tend to modify the fundamental period of oscillation of the rubble-mound. Extra care should be taken during the design phase whenever rubble-mound breakwaters are to be placed on soft soil in areas of high seismicity.", "Rubble | Breakwater | Geotechnical engineering | Armour | Geology | Foundation (evidence) | Berm | Induced seismicity | Seismology | Layer (electronics)", "Coastal and Marine Dynamics", "Earth-Surface Processes", "Earth and Planetary Sciences", "Physical Sciences", null, false, "closed", null, null, null, 0, 5, "https://openalex.org/W984156247 | https://openalex.org/W2005747345 | https://openalex.org/W2241500659 | https://openalex.org/W2280916691 | https://openalex.org/W2339295179", false, "2016-06-24 00:00:00"], ["https://openalex.org/W1525514410", "https://doi.org/10.12691/ajme-1-7-21", "http://pubs.sciepub.com/ajme/1/7/21/ajme-1-7-21.pdf", null, "Methodology and Application of Oneway ANOVA", "article", "en", "2013-01-23", 2013, "Eva Ostertagová | Oskar Ostertag", "- | -", null, "Technical University of Košice", "SK", "American journal of mechanical engineering", null, "2328-4102", "1", "7", "256–261", "This paper describes the powerful statistical technique one-way ANOVA that can be used in many engineering and manufacturing applications and presents its application. This technique is intended to analyze variability in data in order to infer the inequality among population means. The application data were analyzed using computer program MATLAB that performs these calculations.", "Computer science | MATLAB | Population | Statistical analysis | Statistics | Data mining | Mathematics | Programming language", "Statistical Methods and Applications", "Statistics and Probability", "Mathematics", "Physical Sciences", null, false, "closed", null, null, null, 78, 7, "https://openalex.org/W579015616 | https://openalex.org/W1591721577 | https://openalex.org/W2026760769 | https://openalex.org/W2048489440 | https://openalex.org/W2165741239 | https://openalex.org/W2500090533 | https://openalex.org/W2752128027", false, "2016-06-24 00:00:00"], ["https://openalex.org/W2139785897", "https://doi.org/10.5897/jma.9000007", "https://www.africaneditors.org/journal/JMA/full-text-pdf/51893-124721", null, "Antibacterial properties of the leaf extracts of Vernonia amygdalina, Ocimum gratissimum, Corchorous olitorius and Manihot palmate", "article", "en", "2011-04-30", 2011, "A. O. Ogundare", "-", "A. O. Ogundare", null, null, "Journal of Microbiology and Antimicrobials", "Academic Journals", "2141-2308", "3", "4", "77–86", "The antibacterial potency of ethanol, acetone and chloroform leaf extracts of Vernonia amygdalina, Ocimum gratissimum, Corchorous olitorius and Manihot palmata were screened against ten bacterial isolates using the agar-well diffusion method. The leaf extracts were screened for antibacterial activities at 25 mg/ml concentration. Antibacterial efficacy of extracts against the bacterial isolates was indicated by the appearance of clear zones of inhibition around the wells. The extracts (except that of Corchorous olitirious), showed inhibitory activities against Bacillus cereus, Salmonella typhi, Staphylococcus aureus, Shigella dysenteriae and Escherichia coil with zones of inhibition ranging between 2 and 20mm. Result of the antagonistic activity of the extracts compared favourably with the activity of standard antibiotics. The rate of killing by the extracts was carried out, using 50 mg/ml. It was observed that the number of bacterial cells was decreasing as the time of interaction between the extract and the bacteria increased until all cells were killed. Phytochemcial screening of the extracts revealed the presence of some bioactive components like alkaloids, saponins, tannins, anthraquinones, steroids, flavonoids and cardiac glycosides. These properties determine the antimicrobial potential of the leaf extracts.", "Vernonia amygdalina | Ocimum gratissimum | Phytochemical | Antibacterial activity | Traditional medicine | Antimicrobial | Bacillus cereus | Combretaceae | Chemistry | Glycoside | Biology | Microbiology | Bacteria | Botany | Medicine", "Natural Antidiabetic Agents Studies", "Endocrinology, Diabetes and Metabolism", "Medicine", "Health Sciences", null, true, "green", null, null, null, 5, 4, "https://openalex.org/W1573427298 | https://openalex.org/W2016750201 | https://openalex.org/W2114700247 | https://openalex.org/W2166366664", false, "2016-06-24 00:00:00"], ["https://openalex.org/W1917650751", "https://doi.org/10.5897/ijpds.9000029", "https://academicjournals.org/journal/IJPDS/article-abstract/F091BDF41182", null, "Political economy of the new slave trade in Africa", "article", "en", "2012-11-30", 2012, "Azeez Olaniyan | A. I. Aladegbola", "https://orcid.org/0000-0002-2084-5508 | -", null, null, null, "International Journal of Peace and Development Studies", "Academic Journals", "2141-6621", "3", "5", "92–97", "A macro analysis of various inquiry into the nature and causes of Africa’s crises may revealed a continent placed on perpetual slavery. From trans-Atlantic slave trade to colonialism; from colonialism to flag independence and Neo Colonialism; from trade imperialism to human trafficking; from the rampaging momentum of globalization to erosion of Africa culture and communal morality; from ‘Tokunbo’ Syndrome and currencies; Africa seems to be on a verge of internationallyinspired perpetual servitude. The costs of these old and modern vices are enormous and the task of salvaging them is not less so. While the paper exposes the two divides, it goes to argue that, the actualization of the New International Economic Order (NIEO) remain a must for Africa as a continent, if she must survive the present socio- economic and political disempowerment eating deep to her efforts at meeting aims and objectives of the millennium Development Goods(MDG).", "Colonialism | Politics | Independence (probability theory) | Globalization | Morality | Order (exchange) | Political economy | Political science | Economy | Development economics | Economics | Law", "Colonialism, slavery, and trade", "Anthropology", "Social Sciences", "Social Sciences", null, true, "green", null, null, null, 0, 7, "https://openalex.org/W569123130 | https://openalex.org/W626280087 | https://openalex.org/W1576278732 | https://openalex.org/W1995370210 | https://openalex.org/W2137993543 | https://openalex.org/W2139334999 | https://openalex.org/W2974648286", false, "2016-06-24 00:00:00"], ["https://openalex.org/W2132685610", "https://doi.org/10.7385/98922", "https://www.rivisteweb.it/doi/10.7385/98922", null, "Hot-Air Textuality: Literature after Jerome Mc- Gann (2005)", "article", "en", "2009-01-01", 2009, "David L. Hoover", "-", "David L. Hoover", null, null, "Ecdotica", null, null, null, "1", "410–425", "I argue that McGann’s Radiant Textuality (2001), shaped by postmodern literary theory and the nature of electronic texts, is wrong-headed–that McGann’s valorization of the instability of texts and interpretation leads to poor results. It concentrates on three examples: a scanner experiment that leads to the dictum that “no text is self-identical,” a “deformance” of Stevens’s “The Snowman” that results in the claim that the poem is noun-heavy, and a discussion of Joyce Kilmer’s “Trees” that suggests it is a good modernist poem about sex. I claim that, on the contrary, texts are remarkably stable, Stevens uses only an average number of nouns, and “Trees” can be better understood by focusing more closely upon and altering its language. In all three cases, McGann’s approach, because it so consistently points away from the text, provides little insight into the nature of text and interpretation, while a text-centered, language-centered approach is much more illuminating.", "Textuality | Interpretation (philosophy) | Noun | Philosophy | Postmodernism | Literature | Poetry | Linguistics | Art", "Poetry Analysis and Criticism", "Literature and Literary Theory", "Arts and Humanities", "Social Sciences", null, false, "closed", null, null, null, 1, 14, "https://openalex.org/W385681549 | https://openalex.org/W595652401 | https://openalex.org/W599377802 | https://openalex.org/W1499416845 | https://openalex.org/W1506026338 | https://openalex.org/W1516863711 | https://openalex.org/W1521016521 | https://openalex.org/W1599540658 | https://openalex.org/W1982697162 | https://openalex.org/W2017618558 | https://openalex.org/W2038014947 | https://openalex.org/W2089696272 | https://openalex.org/W2151835467 | https://openalex.org/W2496450221", false, "2016-06-24 00:00:00"], ["https://openalex.org/W168480141", "https://doi.org/10.1016/s0002-9459(26)01047-8", "https://doi.org/10.1016/s0002-9459(26)01047-8", null, "AIDS 101: From Abstinence to Zidovudine", "article", "en", "2001-01-01", 2001, "Frank Romanelli", "https://orcid.org/0000-0002-3792-7390", "Frank Romanelli", null, null, "American Journal of Pharmaceutical Education", "Elsevier BV", "0002-9459", "65", "2", "185–189", null, "Medicine | Disease | Human immunodeficiency virus (HIV) | Zidovudine | Intensive care medicine | Pandemic | Life expectancy | Immunology | Etiology | Psychiatry | Viral disease | Infectious disease (medical specialty) | Environmental health | Population | Coronavirus disease 2019 (COVID-19) | Pathology", "Hermeneutics and Narrative Identity", "Philosophy", "Arts and Humanities", "Social Sciences", null, false, "closed", null, null, null, 0, 21, "https://openalex.org/W34672287 | https://openalex.org/W197036761 | https:// polymer gratings on the solar cell", "article", "en", "2009-12-31", 2009, "Kao-Feng Yarn | Win‐Jet Luo | Owen-Chung Chang | W Chuang", "- | https://orcid.org/0000-0003-1894-8855 | - | https://orcid.org/0000-0001-8181-1099", null, null, null, "International Journal of the Physical Sciences", "Academic Journals", "1992-1950", "4", "12", "758–763", "Effects of the light-collecting solar cell with high polymer reflecting gratings and experimental accomplishment of periodical gratings on the solar cell surface are studied. It mainly discusses the way and advantage to enhance the solar cell efficiency by using holographic interference lithography to produce high polymer reflecting gratings on the solar cell. Based on the easy processing method, the theoretically calculated open-circuit voltage, Voc, can be raised from 2.62 - 3.618 V, and the maximum voltage, Vm, increases from 2.5 - 3.5 V for a standard commercial Si solar cell. From experiment, the power conversion efficiency for the solar cell is also enhanced from 27 - 35.67%, corresponding to the relative increase of efficiency up to 32.1%. The theoretical analyses are in good agreement with the experimental findings.", "Solar cell | Materials science | Energy conversion efficiency | Optoelectronics | Optics | Polymer | Solar cell efficiency | Open-circuit voltage | Polymer solar cell | Holography | Voltage | Interference (communication) | Theory of solar cells | Physics | Composite material | Computer science | Telecommunications", "solar cell performance optimization", "Electrical and Electronic Engineering", "Engineering", "Physical Sciences", null, true, "green", null, null, null, 0, 7, "https://openalex.org/W209634083 | https://openalex.org/W596438560 | https://openalex.org/W2072103390 | https://openalex.org/W2135027215 | https://openalex.org/W2137373115 | https://openalex.org/W2158979171 | https://openalex.org/W3147289055", false, "2016-06-24 00:00:00"], ["https://openalex.org/W2283374966", "https://doi.org/10.2495/str030361", "https://www.witpress.com/Secure/elibrary/papers/STR03/STR03036FU.pdf", null, "Structural analysis of the main apse vault of St. George of Greeks Cathedral built c.1390 at Famagusta, Cyprus", "article", "en", "2003-04-10", 2003, "Ata Atun", "-", "Ata Atun", null, null, "WIT transactions on the built environment", "WIT Press", "1743-3509", "66", null, "359–366", "The foundation date of the Cathedral Church of St. George of the Greeks [l] can be dated with a hgh degree of probability to the end of the XIV century. This magnificent building was built on the edge of the Greek quarter, which occupied almost the whole of the southern end of the city of Farnagusta. The history says that this building was abandoned after 157 1, as it had suffered severely from the fire of the battery established by the Turks on the rock to the south-east of the harbour and the marks of cannon-balls can be seen on the walls of the apse. The building was built so strong that it could stand any kind of battering and earthquakes to a certain extent. A detailed survey was done to find out the building techque and materials used, including the quarry where the stones were cut, the chemical composition and the strength of the stones and mortar used in between. A very sophisticated structural analysis [2] was done to find out the strength of the main vault, its behavior and reactions to external forces, especially to earthquake and cannon balls. 1. Location Cathedral Church of St. George of the Greeks is situated in the south east part of the town of Famagusta on the east cost of the Cyprus island, located at the eastern part of Mediterranean sea. Its exact position is 35'07.2' N, 33'56.7' E.", "Greeks | George (robot) | Vault (architecture) | Ancient history | Archaeology | Quarter (Canadian coin) | History | Art history", "Masonry and Concrete Structural Analysis", "Civil and Structural Engineering", "Engineering", "Physical Sciences", null, false, "closed", null, null, null, 0, 1, "https://openalex.org/W3004355548", false, "2016-06-24 00:00:00"], ["https://openalex.org/W144694350", "https://doi.org/10.2495/cp960021", "https://www.witpress.com/Secure/elibrary/papers/CP96/CP96002FU.pdf", null, "FRP Bolted Flanged Connections Subjected To Lon-Gitudinal Bending Moments", "article", "en", "1970-01-01", 1970, "A. E. Blach", "-", "A. E. Blach", null, null, "WIT transactions on engineering sciences", "WIT Press", "1743-3533", "10", null, null, "Bolted flanged connections for fiber reinforced plastic (FRP) pipes and pressure vessels are of great importance for any user of FRP material in fluid containment applications. At present, no dimensional standards or general design rules exist for FRP flanges. Most often, flanges are fabricated to dimensional standards for metallic flanges without questioning their applicability to FRP materials. Flanges in FRP piping systems are often subjected to external, longitudinal bending moments of considerable magnitude. In piping systems, such bending moments are usually caused by thermal expansion of the piping components themselves, or by thermal expansion of pressure vessels and other equipment to which the piping system is connected. Such bending moments are of utmost importance on FRP piping systems due to the relative stiffness of most FRP materials. None of the pertinent design codes, neither the ASME Code, Section X, Fiber-Reinforced Plastic Pressure Vessels, nor the ASME/ANSI B31.3 Code for Chemical Plant and Petroleum Refinery Piping, contain design rules for external bending moments on FRP flanges. In previous papers by the same author, the effect of such external bending moments on metallic flanges were investigated and compared with a design criterion listed in the ASME Code, Section III, Nuclear Power Plant Equipment, based on an equivalent internal pressure. An analysis of the stresses in the flange-bolt assembly due to external bending moments was proposed and results were compared with flange thicknesses using the equivalent internal pressure. Calculated stresses were als6 compared with results from strain gage measurements on a test pressure vessel. To verity stress values in FRP flanges under external bending, a test rig is being used to perform strain gage measurements on a test pipe with a bolted flanged connection, subjected to internal pressure and longitudinal bending.", "Piping | Flange | Fibre-reinforced plastic | Structural engineering | Pressure vessel | Bending | Bending moment | Internal pressure | Engineering | Expansion joint | Bending stiffness | Materials science | Composite material | Mechanical engineering", "Engineering Structural Analysis Methods", "Mechanical Engineering", "Engineering", "Physical Sciences", null, false, "closed", null, null, null, 2, 1, "https://openalex.org/W40440957", false, "2016-06-24 00:00:00"], ["https://openalex.org/W2235844055", "https://doi.org/10.2495/ce990551", "https://www.witpress.com/Secure/elibrary/papers/CE99/CE99055FU.pdf", null, "Vertical Wall Breakwater Stability", "article", "en", "1970-01-01", 1970, "Živko Vuković", "-", "Živko Vuković", null, null, "WIT transactions on the built environment", "WIT Press", "1743-3509", "43", null, null, "The calculation of the minimum required widths of a concrete vertical wall breakwater with respect to the stability criteria of overturning, sliding and settling is presented in the paper. It is assumed that the vertical wall breakwater is built on a foundation and located in the conditions for non-overtopping and overtopping by incident waves. In the analysis of wave forces on the vertical wall breakwater a distinction is made between the action of nonbreaking, breaking and broken waves. The disturbing nonbreaking wave forces are calculated using Sainflou's and Molitor's methods. The breaking wave forces are calculated according to the method developed by Minikin, and the broken wave forces according to the method proposed by the CERC (Coastal Engineering Research Center). Using the derived expressions and appropriate values of the safety factor for overturning and sliding, and allowable normal stress of the foundation for settling, and applying the assumed environmental conditions, it is possible to determine directly the minimum required width of a vertical wall breakwater. A numerical example in which the minimum required widths of a vertical wall breakwater in different wave load conditions are calculated according to the analyzed stability criteria is also given in the paper.", "Breakwater | Settling | Foundation (evidence) | Geotechnical engineering | Stability (learning theory) | Safety factor | Mechanics | Structural engineering | Engineering | Geology | Physics", "Coastal and Marine Dynamics", "Earth-Surface Processes", "Earth and Planetary Sciences", "Physical Sciences", null, false, "closed", null, null, null, 0, 1, "https://openalex.org/W196672812", false, "2016-06-24 00:00:00"], ["https://openalex.org/W566657909", "https://doi.org/10.13140/rg.2.2.29337.38245", "https://doi.org/10.13140/rg.2.2.29337.38245", null, "LEVEL OF ORGANOCHLORINE INSECTICIDE RESIDUES IN KEITT VARIETY OF MANGO (MANGIFERA INDICA) FRUITS FROM THE DANGME WEST DISTRICT OF GHANA", "article", "en", "2012-01-01", 2012, "Theresa Ansaa Anafi", "-", "Theresa Ansaa Anafi", null, null, null, null, null, null, null, null, "A thesis submitted to the College of Science, Kwame Nkrumah University of Science and Technology in partial fulfilment of the requirement for the award of Master of Science degree in Environmental Science, October-2012", "Mangifera | Kwame | Horticulture | Geography | Environmental science | Biology | Sociology", "Hermeneutics and Narrative Identity", "Philosophy", "Arts and Humanities", "Social Sciences", null, true, "gold", null, null, null, 0, 20, "https://openalex.org/W182717936 | https://openalex.org/W601581966 | https://openalex.org/W654422437 | https://openalex.org/W1525805528 | https://openalex.org/W1538578591 | https://openal ", "- | -", null, "National Jewish Health | University of Colorado Denver | University of Colorado Hospital | University of Colorado Health", "US", "Respiratory Care", "American Association for Respiratory Care", "0020-1324", "38", "1", "129–131", null, "Medicine | Airway | Surgery", "Hermeneutics and Narrative Identity", "Philosophy", "Arts and Humanities", "Social Sciences", null, false, "closed", null, null, null, 0, 7, "https://openalex.org/W1966584248 | https://openalex.org/W1983345578 | https://openalex.org/W1985866011 | https://openalex.org/W1988745935 | https://openalex.org/W1991690689 | https://openalex.org/W2342032479 | https://openalex.org/W4251570254", false, "2016-10-07 00:00:00"], ["https://openalex.org/W2551638790", "https://doi.org/10.36410/jcpr.2008.9.6.557", "https://www.kci.go.kr/kciportal/ci/sereArticleSearch/ciSereArtiView.kci?sereArticleSearchBean.artiId=ART001468082", null, "Optoelectrical properties for CuGaSe₂layers grown by hot wall epitaxy", "article", "en", "2008-01-01", 2008, "Sangyoul Lee | Junwoo Jeong | Jin-Ju Bang", "- | - | -", null, null, null, "Journal of Ceramic Processing Research", null, "1229-9162", "9", "6", "557–561", "CuGaSe2 (CGS) layers were grown by the hot wall epitaxy method. The optimum temperatures of the substrate and source for the growth turned out to be 450 and 610 o C, respectively. The CGS layers were epitaxially grown along the direction and retained the initial mole fraction during the layer growth. Based on an absorption measurement, the band-gap variation of CGS was well interpreted by Varshni's equation. But, the band-gap energies at low temperatures were large values unlike that of other CGS. From a low-temperature photoluminescence experiment, sharp and intensive free- and bound-exciton peaks were observed. By analyzing these emissions, a band diagram of the observed optical transitions was obtained. The I-III-VI2 compounds are known to be ternary analogues of the II-VI compounds. These compounds crystallize with the chalcopyrite structure, which is closely related to the zinc structure (1). These materials have received considerable attention in recent years because of their applications in photovoltaic devices (2, 3). They can be used as environmental-friendly materials for the Cd- free buffer layer as an absorbant of solar cells (4, 5). Among these compounds, copper gallium selenide (CuGaSe2, CGS) has an energy gap of 1.68 eV at room temperature and it is expected to be a promising material for red-light- emitting devices. Currently, solar cells based on CGS have achieved efficiencies of 9.5% and 9.7% as absorber of thin film and single crystal shapes, respectively (6, 7). Despite this technological progress, many of the fundamental properties of CGS are still not fully understood. But, the physical properties strongly relate to native defects due to deviations of the stoichiometry. Therefore, a reduction of the stoichiometry deviations during crystal growth is required. As such, CGS layers have been grown by many different techniques such as metalorganic chemical vapor deposition (MOCVD), metalorganic vapor phase epitaxy (MOVPE), physical vapor deposition (PVD), RF sputtering, and flash evaporation (8-12). In fact, hot wall epitaxy (HWE), which has been used to grow a high-purity ZnSe epitaxial layer at low temperatures (13), is one of the better methods for CGS growth. Thus, HWE has been especially designed to grow epilayers under the condition of near thermodynamic equilibrium (14). But, CGS growth by the HWE method has rarely been reported before now. In this paper, the CGS layers, which could be used as the absorbant of a solar cell, were grown on a GaAs substrate by the HWE method. The grown CGS layers were investigated for their structural and optical characterization by means of X-ray diffraction (XRD), photoluminescence (PL), and absorption spectroscopy. From these results, a discussion of the structural and optical properties of the CGS layers is given nalex.org/W2154490489 | https://openalex.org/W2169207206 | https://openalex.org/W2331258382 | https://openalex.org/W2568956907 | https://openalex.org/W2616958781 | https://openalex.org/W2949260781", false, "2025-07-22 00:00:00"], ["https://openalex.org/W3213122519", "https://doi.org/10.58213/7ysgym74", "https://doi.org/10.58213/7ysgym74", null, "A financial Health Analysis of Selected Companies from Nifty 50 using Altman Z-Score Model", "article", "en", "2021-07-11", 2021, "Kana Odedra", "-", "Kana Odedra", null, null, "Vidhyayana", null, "2454-8596", "6", "6", null, "India has become the world's fastest growing major economy and is expected to be one of the world's top three economic powers for the next 10 to 15 years, backed by its strong and largest democracy. In this paper Researcher has randomly selected five companies from Nifty 50 and period of study is four financial years. Objectives of the study is to check financial status of selected companies and compare Z-Score among randomly selected Nifty 50 Companies. Altman Z Score model has been used for analysis of study. In last Researcher has found that only one Britannia Industries Ltd. has come under safe zone, two companies’ vis Mahindra and Mahindra Ltd. and Shree Cement Ltd. have in Grey Zone and remaining two vis Tata Steel Ltd. and Bharti Airtel Ltd. have in Distress Zone. So, it can said that these two companies need to check their financial position and improve their sales and working capital position to come in good Z Score position.", "Working capital | Position (finance) | Financial distress | Financial analysis | Business | Finance | Financial ratio | Economics | Accounting | Financial system", "Financial Distress and Bankruptcy Prediction", "Accounting", "Business, Management and Accounting", "Social Sciences", null, true, "diamond", "cc-by", null, null, 0, 2, "https://openalex.org/W2124532504 | https://openalex.org/W2334259045", false, "2025-07-22 00:00:00"], ["https://openalex.org/W2748632487", "https://doi.org/10.1177/174183050300100104", "https://doi.org/10.1177/174183050300100104", null, "The Cognitive Models of Change Leaders", "article", "en", "2003-08-01", 2003, "Mike Travis", "-", "Mike Travis", "University of Greenwich", "GB", "International journal of evidence based coaching and mentoring", null, "1741-8305", "1", "1", "23–45", "The models, schemas, recipes and mantras, which leaders of change bring to the projects they manage, are relatively little understood. Here the nature of these structures is explored from the perspective of mental model theory. The positive potential of simplified representations of business problems is contrasted with the negative value of certain long-cherished and counterproductive recipes for action. It is suggested that many managers, when initially questioned about the nature of the cognitive structures they bring to their work, tend to make excessive claims for the stability and internal consistency of their personal repertoire of available material. The popular distinction between tacit models, as \"undiscussable and indescribable\" phenomena (Argyris and Schön 1996), is compared with a more dialogic view of managers as men and women subject to frequent changes of stance as they engage with significant colleagues. Simple links between personality types or cognitive style and mental models in use are challenged and it is suggested that a leader's repertoire of models and heuristics is often extended well beyond the zones of comfort that may be inferred from personality theory. Management and cognitive competences are advocated as potential limiters of models in use and facilitators of change. Classification of the mental models of leaders is attempted in order to illustrate the value that individual models may have as narrational, ego-defensive, processual and discursive material. The depth, superficiality and motivation behind certain models are discussed, as is the question of how easily leaders of change can adapt these different types of structure as a result of the feedback they get from the success or failure of their projects. This paper forms part of an ongoing study of senior managers who are leading organizational change in the public and private sectors.", "Cognition | Computer science | Psychology | Cognitive science | Neuroscience", "Organizational Learning and Leadership", "Organizational Behavior and Human Resource Management", "Business, Management and Accounting", "Social Sciences", null, true, "diamond", "cc-by-nc-nd", null, null, 2, 70, "https://openalex.org/W91246788 | https://openalex.org/W94913644 | https://openalex.org/W188320547 | https://openalex.org/W386349523 | https://openalex.org/W585404251 | https://openalex.org/W594220191 | https://openalex.org/W636823480 | https://openalex.org/W1143502552 | https://openalex.org/W1490941306 | https://openalex.org/W1495419098 | https://openalex.org/W1510707441 | https://openalex.org/W1514823166 | https://openalex.org/W1528946310 | https://openalex.org/W1531601252 | https://openalex.org/W1550128687 | https://openalex.org/W1606540910 | https://openalex.org/W1695943992 | https://openalex.org/W1697354366 | https://openalex.org/W1767680514 | https://openalex.org/W1964633509 | https://openalex.org/W1965835714 | https://openalex.org/W1971167516 | https://openalex.org/W1977129595 | https://openalex.org/W1978611805 | https://openalex.org/W1979156919 | https://openalex.org/W1980676196 | https://openalex.org/W1988809397 | https://openalex.org/W1991560199 | https://openalex.org/W1993319826 | https://openalex.org/W2011426870 | https://openalex.org/W2012968282 | https://openalex.org/W2019086958 | https://openalex.org/W2024281661 | https://openalex.org/W2027320617 | https://openalex.org/W2032458483 | https://openalex.org/W2036554576 | https://openalex.org/W2038143521 | https://openalex.org/W2039151696 | https://openalex.org/W2041085983 | https://openalex.org/W2061533139 | https://openalex.org/W2069187923 | https://openalex.org/W2072325689 | https://openalex.org/W2073102534 | https://openalex.org/W2075070115 | https://openalex.org/W2091820446 | https://openalex.org/W2092032279 | https://openalex.org/W2100826189 | https://openalex.org/W2101157755 | https://openalex.org/W2102195544 | https://openalex.org/W2103937309 | https://openalex.org/W2126186544 | https://openalex.org/W2130631454 | https://openalex.org/W2141651643 | https://openalex.org/W2147827570 | https://openalex.org/W2151483442 | https://openalex.org/W2166764674 | https://openalex.org/W2208047004 | https://openalex.org/W2273158380 | https://openalex.org/W2321373729 | https://openalex.org/W2336440943 | https://openalex.org/W2870834256 | https://openalex.org/W2966740168 | https://openalex.org/W2990023270 | https://openalex.org/W3121143303 | https://openalex.org/W3142154825 | https://openalex.org/W3149449289 | https://openalex.org/W3172743543 | https://openalex.org/W3197129907 | https://openalex.org/W4254272303 | https://openalex.org/W4285719527", false, "2025-07-22 00:00:00"], ["https://openalex.org/W284858966", "https://doi.org/10.1177/001312378101600413", "https://doi.org/10.1177/001312378101600413", null, "Paraprofessionals: A Focus on Interpersonal Skills", "article", "en", "1981-12-01", 1981, "Greg H. Frith", "-", "Greg H. Frith", "Jacksonville State University", "US", "Education and training of the mentally retarded", null, "0013-1237", "16", "4", "306–309", null, "Psychology | Interpersonal communication | Focus (optics) | Social skills | Interpersonal relationship | Pedagogy | Medical education | Developmental psychology | Applied psychology | Social psychology | Medicine", "Collaborative Teaching and Inclusion", "Education", "Social Sciences", "Social Sciences", null, false, "closed", null, null, null, 1, 6, "https://openalex.org/W287219908 | https://openalex.org/W1807963765 | https://openalex.org/W1998464491 | https://openalex.org/W2002051123 | https://openalex.org/W2111624597 | https://openalex.org/W2154031325", false, "2025-07-22 00:00:00"], ["https://openalex.org/W2740772911", "https://doi.org/10.13140/rg.2.2.28450.29123", "https://doi.org/10.13140/rg.2.2.28450.29123", null, "Designing social capital sensitive participation methodologies", "article", "en", "2004-01-01", 2004, "Tristan Claridge", "https://orcid.org/0000-0002-3744-4313", "Tristan Claridge", null, null, null, null, null, null, null, null, "Participation methodologies have been evolving and improving since first gaining international recognition in the 1960s. Despite these improvements there are still genuine concerns and criticisms of participation, particularly surrounding its application and effectiveness. The recent advent of social capital theory provides another lens for the analysis and ensuing improvement of participation methodologies. Social capital theory encompasses the notion that our social relationships are productive in nature; that is, ‘capital’. The theory describes the various dimensions of the complex social world that enable this capital. Both participation and social capital theories have many similarities; both are poorly defined, conceptualized and operationalized in both debate and application. The two concepts are highly context specific and highly complex. Individually, the concepts still require further analysis to answer key questions, particularly about appropriate application. Jointly, little work has been done to identify the impacts that they have on each other and particularly how social capital benefits can be maximized in participatory methodologies. This study explored the theories with extensive literature reviews of each concept before breaking new ground with an integration of the two theories. This synthesis was then applied to a case study; an IFAD funded project in Zimbabwe. The project’s participatory methodology was analysed through the lens of social capital theory. The participatory methods analysed included; focus groups, public meetings, information dissemination and questionnaires. The analysis highlighted the potential importance of social capital sensitive participatory methodologies. Despite the efforts of the project development team, there were numerous oversights or missed opportunities where the project and community could have benefited from variations to the methodology used. It was found that by providing opportunities for repeat interaction in the participatory methodologies, social capital benefits could be maximised. It was also stressed that any social capital sensitive participatory methodology is by definition local context specific and application of such methods require careful analysis of the local context in which it is being applied.", "Operationalization | Social capital | Citizen journalism | Context (archaeology) | Public relations | Sociology | Political science | Social science | Epistemology", "Social Capital and Networks", "Sociology and Political Science", "Social Sciences", "Social Sciences", null, true, "gold", null, null, null, 41, 256, "https://openalex.org/W5593054 | https://openalex.org/W21869571 | https://openalex.org/W37724296 | https://openalex.org/W64025254 | https://openalex.org/W72845327 | https://openalex.org/W114438012 | https://openalex.org/W121648651 | https://openalex.org/W133927714 | https://openalex.org/W138883750 | https://openalex.org/W169553012 | https://openalex.org/W174469502 | https://openalex.org/W183639082 | https://openalex.org/W193472209 | https://openalex.org/W250589216 | https://openalex.org/W274952229 | https://openalex.org/W373747631 | https://openalex.org/W565118919 | https://openalex.org/W598109134 | https://openalex.org/W650558801 | https://openalex.org/W1138880660 | https://openalex.org/W1479716397 | https://openalex.org/W1492523927 | https://openalex.org/W1498344232 | https://openalex.org/W1501258977 | https://openalex.org/W1517668676 | https://openalex.org/W1525258033 | https://openalex.org/W1529065856 | https://openalex.org/W1533558196 | https://openalex.org/W1544 //openalex.org/W2146826537 | https://openalex.org/W2147264455 | https://openalex.org/W2147696568 | https://openalex.org/W2147812689 | https://openalex.org/W2148900978 | https://openalex.org/W2149701769 | https://openalex.org/W2149967678 | https://openalex.org/W2152376160 | https://openalex.org/W2153943092 | https://openalex.org/W2154853270 | https://openalex.org/W2156938275 | https://openalex.org/W2157619495 | https://openalex.org/W2158295462 | https://openalex.org/W2158460690 | https://openalex.org/W2162076438 | https://openalex.org/W2162605625 | https://openalex.org/W2163308325 | https://openalex.org/W2164618107 | https://openalex.org/W2166949559 | https://openalex.org/W2166999581 | https://openalex.org/W2167033413 | https://openalex.org/W2168839771 | https://openalex.org/W2169401764 | https://openalex.org/W2170082337 | https://openalex.org/W2170472580 | https://openalex.org/W2259836731 | https://openalex.org/W2261450688 | https://openalex.org/W2280522127 | https://openalex.org/W2291685755 | https://openalex.org/W2477165617 | https://openalex.org/W2478433235 | https://openalex.org/W2483410016 | https://openalex.org/W2491226108 | https://openalex.org/W2502580151 | https://openalex.org/W2564839761 | https://openalex.org/W2567279626 | https://openalex.org/W2796004176 | https://openalex.org/W2797188549 | https://openalex.org/W2889950641 | https://openalex.org/W2898348513 | https://openalex.org/W2899294161 | https://openalex.org/W2907515539 | https://openalex.org/W2908641694 | https://openalex.org/W2998862192 | https://openalex.org/W3096229137 | https://openalex.org/W3121176624 | https://openalex.org/W3121584743 | https://openalex.org/W3122907545 | https://openalex.org/W3122914735 | https://openalex.org/W3123277183 | https://openalex.org/W3123527010 | https://openalex.org/W3124827885 | https://openalex.org/W3125055992 | https://openalex.org/W3146071030 | https://openalex.org/W3149953018 | https://openalex.org/W3173347913", false, "2025-07-22 00:00:00"], ["https://openalex.org/W2183446462", "https://doi.org/10.13140/rg.2.2.13122.13760", "https://doi.org/10.13140/rg.2.2.13122.13760", null, "Mobility Degradation and Total Series Resistance of Cylindrical Gate-All- Around Silicon Nanowire Field-Effect Transistor", "article", "en", "2012-01-01", 2012, "Lalit Singh | Mahesh Chandra | B. P. Tyagi", "https://orcid.org/0000-0002-3212-8485 | https://orcid.org/0000-0001-9892-5527 | -", null, null, null, null, null, null, null, null, null, "Multi gate Si-based devices such as tri-gate or gate-allaround (GAA) nanowire (NW) Metal Oxide Semiconductor Field Effect Transistors (MOSFETs) are promising candidates for aggressively scaled CMOS due to their excellent electrostatics control. However, the carrier velocity i.e. mobility of carriers in these devices is generally degraded due to quantum–mechanical confinement effects. In this paper, the mobility-degradation factor and the series resistance of cylindrical gate-all-around silicon nanowire field-effect transistor (SNWFET) is discussed using the same mobility degradation model as in the case of conventional MOSFET. The calculation is done by defining voltage as a function of the saturation drain current evaluated from devices with various dimensions. The calculated mobilitydegradation factor is an order of magnitude larger than those of other conventional MOSFET. This exhibit the more possibility of interfaces scattering in the strong inversion condition, while the gate of presented model turn off the electron channel. The calculated series resistance is mostly due to the crowding of the electron flow along the sidewall of the n+ contact.", "Equivalent series resistance | MOSFET | Materials science | Nanowire | Transistor | Optoelectronics | Electron mobility | Field-effect transistor | Current crowding | Saturation velocity | Gate oxide | Threshold voltage | Silicon | Velocity saturation | Electrical engineering | Voltage | Current (fluid) | Engineering", "Semiconductor materials and devices", "Electrical and Electronic Engineering", "Engineering", "Physical Sciences", null, true, "gold", null, null, null, 2, 11, "https://openalex.org/W1491885026 | https://openalex.org/W1661368752 | https://openalex.org/W2089242955 | https://openalex.org/W2095959223 | https://openalex.org/W2106998413 | https://openalex.org/W2132035903 | https://openalex.org/W2141856377 | https://openalex.org/W2159035578 | https://openalex.org/W2168374686 | https://openalex.org/W2421522856 | https://openalex.org/W2542085131", false, "2025-07-22 00:00:00"], ["https://openalex.org/W2988348505", "https://doi.org/10.66392/003777215815923587", "https://doi.org/10.66392/003777215815923587", null, "Formative Assessment Using Library of Congress Documents", "article", "en", "2015-09-01", 2015, "Joel Breakstone | Sam Wineburg | Mark Stephen Smith", "https://orcid.org/0000-0003-0468-6399 | https://orcid.org/0000-0002-4838-1522 | -", null, null, null, "Social Education", null, "0037-7724", "79", "4", "178–182", null, "Formative assessment | Computer science | Library science | Information retrieval | Political science | Mathematics education | Psychology", "Information Systems Education and Curriculum Development", "Information Systems", "Computer Science", "Physical Sciences", null, false, "closed", null, null, null, 3, 6, "https://openalex.org/W1967555382 | https://openalex.org/W2041844849 | https://openalex.org/W2055625886 | https://openalex.org/W2089339841 | https://openalex.org/W2126685412 | https://openalex.org/W2144924867", false, "2025-07-22 00:00:00"], ["https://openalex.org/W2947119780", "https://doi.org/10.13140/rg.2.2.18311.05287", "https://doi.org/10.13140/rg.2.2.18311.05287", null, "Leaders’ Adaptation to Adversity in a Volatile, Uncertain, Complex, and Ambiguous Business Environment - A Critical Realist View", "article", "en", "2018-01-01", 2018, "Joerg Krauter", "-", "Joerg Krauter", null, null, null, null, null, null, null, null, "Recent studies have shown that a significant number of leaders are not able to\r\nsuccessfully adapt to adversity within today’s increasingly volatile, uncertain, complex,\r\nand ambiguous business environment. Adversity is one of the most challenging\r\nleadership issues to date, but fragmented research results prevent researchers and\r\npractitioners from forming a comprehensive view of the factors that influence leaders’\r\nadaptation to it.\r\nThis study addresses three questions in respect of the above research gap, namely:\r\nWhat is the nature of adversity? How can leaders adapt to adversity? What are the\r\nmain factors influencing leaders’ task adaptive performance?\r\nThe study shows that burnout is increasingly recognised as adversity in leadership\r\ntriggered by volatile, uncertain, complex, and ambiguous conditions. Leaders affected\r\nby a high level of the impact of adversity (magnitude, probability and relevance) and a\r\nlow level of sense-making of adversity have increased burnout risks. Another\r\ncontribution of this study is that leaders knowing this explanation are better prepared\r\nto prevent, anticipate or deal with adversity in order to avoid negative effects, and to\r\nsee the positive side of adversity as a chance for learning and personal growth. There\r\nis also evidence that a higher level of burnout can decrease the leaders’ psychological\r\ncapital.\r\nThe main theoretical contribution of this study is that the mechanisms of psychological\r\ncapital and authentic leadership can improve leaders’ task adaptive performance.\r\nThese mechanisms are affected by the condition of burnout. Whereby a high level of\r\nthe mechanism of the impact of adversity can directly decrease task adaptive\r\nperformance.\r\nFurther conditions which affects these mechanisms are sense-making of adversity,\r\nself-reflection and conscientiousness. The limitations of these findings are also\r\ndiscussed and the possible directions for future research are outlined.", "Burnout | Psychology | Adaptation (eye) |  its forms has a crucial role to play in the development agenda to ensure that citizens are well informed. The media has important roles to play, to inform, to educate, and to provide a platform for public debate and discussion. It could serve as catalyst for citizens’ empowerment and help to hold government and authorities to account. Third world countries like India have been facing odd situations in terms of poverty, environment, health, politics, and education. There have been efforts by the government and non- government agencies to sensitize the citizens and to make them acknowledge the programs intended at improving their socio-economic welfare. Communication is a vital tool in mobilizing people in the direction of the participatory process which in turn makes development an achievable goal. The present paper is an attempt to provide comprehensive information and explore the significance of the role of media as a powerful tool towards achieving the Sustainable Development Goal in India. The qualitative approach is conducted to explore deeper insight of SDGs understanding from news media. This study found that not all SDGs are informed well. Only several SDGs are framed based on the concern of public policy.", "Public relations | Sustainable development | Government (linguistics) | Beneficiary | Empowerment | Citizen journalism | Political science | Poverty | Participatory development | Process (computing) | Economic growth | Business | Economics", "Climate Change Communication and Perception", "Sociology and Political Science", "Social Sciences", "Social Sciences", null, true, "diamond", "cc-by", null, null, 0, 4, "https://openalex.org/W1988574456 | https://openalex.org/W2100972910 | https://openalex.org/W2905217347 | https://openalex.org/W2991272886", false, "2025-07-22 00:00:00"], ["https://openalex.org/W2304138311", "https://doi.org/10.5802/jolt.411", "https://doi.org/10.5802/jolt.411", null, "Central Extensions of the Lie Algebra of Symplectic Vector Fiel ", "1", "1", "53–70", "Whatever Media Studies 2.0 involves, one thing is certain, there is a need to confront and deal with new technologies, most notably computers and computer networks. Despite the fact that the discipline has largely marginalized these innovations, there has been some effort to incorporate the computer into both the theories and practices of media studies. This has been accomplished, at least in the United States, through the development of what is now called computer-mediated communication (CMC). CMC, which effectively understands the computer as a medium of human communication, does not necessarily institute a significant paradigm shift in media studies but accommodates the new technologies to existing structures, methodologies, and models. This essay contests and critiques this approach. It reviews the development of CMC, identifies its structural limitations, and provides an alternative understanding of the computer that has the potential to reorient the discipline in a much more radical fashion.", "Mediation | Computer science | Computer-mediated communication | Engineering ethics | New media | Sociology | Computer technology | Epistemology | Multimedia | World Wide Web | The Internet | Engineering | Social science", "Public Relations and Crisis Communication", "Communication", "Social Sciences", "Social Sciences", null, false, "closed", null, null, null, 6, 66, "https://openalex.org/W121509021 | https://openalex.org/W150845342 | https://openalex.org/W168804529 | https://openalex.org/W568593803 | https://openalex.org/W624602003 | https://openalex.org/W1483583562 | https://openalex.org/W1489270652 | https://openalex.org/W1489670474 | https://openalex.org/W1495038747 | https://openalex.org/W1509819737 | https://openalex.org/W1524086313 | https://openalex.org/W1526901530 | https://openalex.org/W1538173188 | https://openalex.org/W1581907134 | https://openalex.org/W1588287419 | https://openalex.org/W1600463132 | https://openalex.org/W1605601589 | -01-01", 2020, "Iliya Dimitrov", "-", "Iliya Dimitrov", null, null, null, null, null, "92", "7", "106–116", "COVID-19 caused the suspension of most sports events and the dismissal of all athletes, coaches, sports specialists, officials (referees and judges) and other persons involved in the field In recent decades technological progress and digitalisation have undergone substantial development, thereby providing excellent opportunities for online training In times of social distancing, hardware and software solutions have gained prominence as appropriate and necessary means of remote attendance for participants in educational events Referees have become an integral part of modern sports as the officials upholding the proper application of the competition rules, fair play and the observance of the code of ethics during events Considering the pandemic situation, which renders the conducting of attended events impossible, as well as the key role of sports officials, we set out to organize the training of officials online The target group for the study consisted of students from the Taekwondo Coach specialty in the faculty of the Vassil Levski National Sports Academy, given their specific knowledge and involvement in the sport The implementation of the project showed that online training was a suitable method for the reinforcing, enriching and improving of the competencies of officials in Bulgaria during an ongoing pandemic In the field, distance training proved to be a promising practice for the conducting of all theoretical and some practical classes for the officials in the country The studies conducted allow us to conclude that during the COVID-19 pandemic it is possible to use modern technical means and methods successfully in order to involve athletes, coaches and officials with sports activities The results of this project provoke us to re-assess the policies and methods applicable to the training of officials at the national and the international level", "Attend he Method of Subspace Corrections", "article", "en", "2008-01-01", 2008, "Durkbin Cho | Jinchao Xu | Ludmil Zikatanov", "- | https://orcid.org/0009-0004-4132-0227 | https://orcid.org/0000-0002-5189-4230", null, null, null, "Numerical Mathematics Theory Methods and Applications", "Cambridge University Press", "1004-8979", "1", "1", "44–56", "We discuss estimates for the rate of convergence of the method of successive subspace corrections in terms of condition number estimate for the method of parallel subspace corrections. We provide upper bounds and in a special case, a lower bound for preconditioners defined via the method of successive subspace corrections. AMS subject classifications: 65F10, 65J05, 65N12, 65N55 The method of subspace corrections is a general iterative method for solving the linear system of equations arising from the variational formulation in a Hilbert space. The mod- ern theory of the subspace correction methods has showed that the multigrid method and the domain decomposition method are systematically equivalent. In this paper, we study the method of subspace corrections. We refer readers to von Neumann(7), Bramble(1), Bramble and Zhang(2), Hackbusch(4), Griebel and Oswald(3), Trottenberg, Oosterlee and Schuller(5), Xu(8,9) and Xu and Zikatanov(10) for the method of subspace correc- tions. One main focus in this paper is to provide an estimate for the rate of convergence of the method of successive subspace corrections (MSSC) in terms of the method of parallel subspace corrections (MPSC). This work can be considered as an extension and application of the convergence theory by Xu and Zikatanov(10). Based on this framework, we obtain a formula for the convergence rate, which can be employed to derive many other estimates related to the method of subspace corrections. We then show how the convergence rate of the MSSC can be estimated in terms of the MPSC. Similar results and other approaches on deriving estimates relating MSSC and MPSC are also found in earlier works(2,3,8,9).", "Subspace topology | Rate of convergence | Mathematics | Applied mathematics | Krylov subspace | Convergence (economics) | Linear subspace | Hilbert space | Iterative method | Algorithm | Mathematical analysis | Computer science | Pure mathematics", "Matrix Theory and Algorithms", "Computational Theory and Mathematics", "Computer Science", "Physical Sciences", null, false, "closed", null, null, null, 17, 7, "https://openalex.org/W1507506202 | https://openalex.org/W1530115438 | https://openalex.org/W1559891132 | https://openalex.org/W1992384979 | https://openalex.org/W2017085690 | https://openalex.org/W2062246266 | https://openalex.org/W2740099321", false, "2025-07-23 00:00:00"], ["https://openalex.org/W299422696", "https://doi.org/10.66392/003777209814736268", "https://doi.org/10.66392/003777209814736268", null, "Creating Biography Webs to Investigate Individuals’ Historical Contexts", "article", "en", "2009-09-01", 2009, "Gary Fertig | Rick Silverman", "- | -", null, null, null, "Social Education", null, "0037-7724", "73", "5", "244–246", "Biographies, which are popular among young people, can stimulate interest in the past when students investigate the historical contexts in which individuals lived. Creating biography webs offers students structured opportunities to investigate how other people and groups influenced the personal development of specific individuals (NC SS Strands II, III, IV, and V ). 1 Students work in pairs to complete five activities that require active problem solving and decision making. They work as partners to determine the most effective means for displaying their learning while also educating their peers.", "Biography | History | Sociology | Art history", "Data Analysis and Archiving", "Sociology and Political Science", "Social Sciences", "Social Sciences", null, false, "closed", null, null, null, 0, 1, "https://openalex.org/W2072699038", false, "2025-07-23 00:00:00"], ["https://openalex.org/W3121426576", "https://doi.org/10.1177/174183051401200107", "https://doi.org/10.1177/174183051401200107", null, "The Group Coaching Conundrum", "article", "en", "2014-02-01", 2014, "Manfred F. R. Kets de Vries", "-", "Manfred F. R. Kets de Vries", "INSEAD", "FR", "International journal of evidence based coaching and mentoring", null, "1741-8305", "12", "1", "79–91", "This article sheds light on the challenges facing coaches when undertaking the journey to becoming a group coach. It begins with observations on the state of the art of group and team coaching and continues with a description of the various conundrums faced by coaches interested in pursuing this kind of activity. Subsequently, it describes a coach's reflections on leadership group coaching and shares his inner journey toward becoming a group coach. The second part of the article reflects on what makes group coaching an effective intervention, discussing the dynamic processes applicable to individual participants and the ‘cloud issues’ or themes that the group-as-a-whole brings to the table. It describes seven premises that characterize the clinical paradigm, a psychodynamic lens that can be turned on our inner theatre. The article also highlights a number of other psychodynamic processes that take place during the group coaching process, creating tipping points for change.", "Group (periodic table) | Coaching | Psychology | Chemistry | Psychotherapist", "Psychotherapy Techniques and Applications", "Clinical Psychology", "Psychology", "Social Sciences", null, true, "diamond", "cc-by-nc-nd", null, null, 9, 10, "https://openalex.org/W192912545 | https://openalex.org/W204140944 | https://openalex.org/W593767124 | https://openalex.org/W1527968558 | https://openalex.org/W1531803554 | https://openalex.org/W1991042525 | https://openalex.org/W2070923649 | https://openalex.org/W2184601655 | https://openalex.org/W2281518483 | https://openalex.org/W2553955874", false, "2025-07-23 00:00:00"], ["https://openalex.org/W2346159329", ty College", "US", "Critical multilingualism studies", "Department of German Studies", "2325-2871", "3", "1", "112–134", "This hybrid piece, combining scholarly inquiry in several disciplines (from bilingualism and literary theory to visual art, cultural anthropology, and psychoanalysis) with the genre of personal essay, explores the concept of multilingual identity and creativity in visual art. Establishing the parallel with the phenomenon of 'literary translingualism' and exemplifying most salient identity features of several translingual writers, I coin the concept of 'artistic translingualism.' The essay is focused on multilingual life and art of an immigrant artist, Marc Chagall, and analyzes his several paintings within the framework of three translingual constructs: duality, ambivalence, and liminality. The complexity of translingual identity, and specifically Chagall's, is illuminated by my personal and my family's Jewish Russian roots and immigrant history, amplifying the historical and human context for understanding of exile, multilingualism, and creativity.", "Creativity | Identity (music) | Ambivalence | Multilingualism | Context (archaeology) | Art | Sociology | Aesthetics | Visual arts | History | Psychology | Psychoanalysis", "European Cultural and National Identity", "Sociology and Political Science", "Social Sciences", "Social Sciences", null, true, "diamond", "cc-by", null, null, 37, 17, "https://openalex.org/W57482528 | https://openalex.org/W605735341 | https://openalex.org/W645131159 | https://openalex.org/W1494189437 | https://openalex.org/W1537542164 | https://openalex.org/W1578999734 | https://openalex.org/W1592012657 | https://openalex.org/W1977851938 | https://openalex.org/W1994550124 | https://openalex.org/W1995592994 | https://openalex.org/W2018197786 | https://openalex.org/W2033392732 | https://openalex.org/W2036009932 | https://openalex.org/W2087690952 | https://openalex.org/W2092868923 | https://openalex.org/W2093478966 | https://opena ity of Life Sciences", "NO", "International journal of evidence based coaching and mentoring", null, "1741-8305", "9", "1", "29–43", "The purpose of the present study is to investigate how learning experiences acquired through workplace coaching may affect stress. I identify two main learning experiences in the coaching process, insight and planning skills, and propose that these affect stress directly and also indirectly through mediators’ job demand, job control, and social support. A within-subject, longitudinal design is applied, with 56 persons receiving coaching from professional, external coaches. Data was collected at three points in time: baseline (before coaching), after a three-month period of coaching, and a follow-up nine months later. The results show that planning skills acquired through coaching reduce stress in the short term, and that the effect is mediated through a decrease in job demand. The decrease in job demand is further shown to reduce stress in the long term. Insight as a coaching outcome is not directly related to stress; however, insight affects social support, which in turn is associated with reduced stress in the long term.", "Coaching | Affect (linguistics) | Psychology | Stress (linguistics) | Applied psychology | Social support | Job stress | Social psychology | Job satisfaction", "Job Satisfaction and Organizational Behavior", "Organizational Behavior and Human Resource Management", "Business, Management and Accounting", "Social Sciences", null, true, "diamond", "cc-by-nc-nd", null, null, 53, 40, "https://openalex.org/W123377273 | https://openalex.org/W639161789 | https://openalex.org/W1479917416 | https://openalex.org/W1530155851 | https://openalex.org/W1795044592 | https://openalex.org/W1971440513 | https://openalex.org/W1980006509 | https://openalex.org/W1982457737 | https://openalex.org/W1991059088 | https://openalex.org/W2005245205 | https://openalex.org/W2008419165 | https://openalex.org/W2009441266 | https://openalex.org/W20 earned to apply these skills in counting amounts of change. The results are interpreted as support for the view that instruction in basic academic skills can be an integral part of practical education.", "Psychology | Independence (probability theory) | Mathematics education | Teaching method | Statistics", "Financial Literacy, Pension, Retirement Analysis", "Accounting", "Business, Management and Accounting", "Social Sciences", null, false, "closed", null, null, null, 21, 1, "https://openalex.org/W244323159", false, "2025-07-24 00:00:00"], ["https://openalex.org/W3203460566", "https://doi.org/10.5958/2321-2136.2020.00010.7", "https://doi.org/10.5958/2321-2136.2020.00010.7", null, "Facilitating Empowerment of Women through Self Help Groups with Reference to NABARD in Punjab: An Analysis", "article", "en", "2020-01-01", 2020, "Navreet | Neha Sharma", "- | https://orcid.org/0000-0002-2798-4025", null, "Panjab University", "IN", "Public Affairs And Governance", null, "2321-2128", "8", "2", "182–205", "Women are an integral part of the social, economic and political system. women. The overall growth and development of a country is viable only when women are given equal opportunities in every sphere and access to various services. Microfinance is the first step towards bringing women within the purview of access to financial services for the economic empowerment of women which paved way for their sustainable livelihood. The financial services are a better way to access the banking facilities for the poor at an affordable cost. The sources of credit represent linkage between banks and Self Help Groups and provide credit funds for women to enhance livelihood opportunities. National Bank for Agriculture and Rural Development (NABARD) acts as facilitator and provider of microfinance. An attempt has been made in this paper to study the Role of NABARD as Facilitator for financial inclusion of women; to assess the impact of financial inclusion on sustainable livelihood of SHGs  Leadership Programme", "article", "en", "2007-08-01", 2007, "Hazel Mackenzie", "-", "Hazel Mackenzie", "Scottish Government", "GB", "International journal of evidence based coaching and mentoring", null, "1741-8305", "5", "2", "22–33", "This phenomenological study is set in the context of leadership development in the National Health Service (NHS). The aim of the study was to provide an in-depth understanding of the Royal College of Nursing Clinical Leadership Development Programme (RCN CLP) participants’ experience of the coaching component of the programme. In-depth interviews were undertaken with eight clinical leaders who had recently completed the RCN CLP. The overarching theme emerging from the data suggested that coaching was seen as an opportunity for ‘stepping off the treadmill’. This main theme is underpinned by a further eighteen theme clusters, organised into 6 categories: out and in the comfort zone; mirror mirror; unconditional positive regard; creative conversations; ripple effect; and I'm OK, you're OK. In this paper, the implications of the findings are discussed and recommendations for further research identified.", "Coaching | Psychology | Physical therapy | Medical education | Physical medicine and rehabilitation | Medicine | Psychotherapist", "Coaching Methods and Impact", "Applied Psychology", "Psychology", "Social Sciences", null, true, "diamond", "cc-by-nc-nd", null, null, 7, 34, "https://openalex.org/W169471448 | https://openalex.org/W605979545 | https://openalex.org/W616847997 | https://openalex.org/W1514800754 | https://openalex.org/W1531672478 | https://openalex.org/W1534297874 | https://openalex.org/W1549530188 | https://openalex.org/W1573931350 | https://openalex.org/W1998636548 | https://openalex.org/W1999709061 | https://openalex.org/W2024472920 | https://openalex.org/W2062864406 | https://openalex.org/W2071892877 | https://openalex.org/W2072474848 | https://openalex.org/W2096628357 | https://openalex.org/W2100047382 | https://openalex.org/W2106773159 | https://openalex.org/W2108646196 | https://openalex.org/W2111866025 | https://openalex.org/W2328634619 | https://openalex.org/W2415142061 | https://openalex.org/W2417730829 | https://openalex.org/W2418551038 | https://openalex.org/W2460239971 | https://openalex.org/W2463512328 | https://openalex.org/W2509638261 | https://openalex.org/W2573417827 | https://openalex.org/W2746269590 | https://openalex.org/W2748273745 | https://openalex.org/W2748334849 | https://openalex.org/W2761334117 | https://openalex.org/W2883794193 | https://openalex.org/W2932193690 | https://openalex.org/W2992505094", false, "2025-07-24 00:00:00"], ["https://openalex.org/W2750251897", "https://doi.org/10.1177/174183051401200203", "https://doi.org/10.1177/174183051401200203", null, "What coaches can learn from the history of jazz-based improvisation: A conceptual analysis", "article", "en", "2014-08-01", 2014, "Michael J.B. Read", "-", "Michael J.B. Read", "Vancouver Island University", "CA", "International journal of evidence based coaching and mentoring", null, "1741-8305", "12", "2", "10–23", "From early jazz to current sub-styles, the key component, improvisation, is thought to also be important to the coaching process. Improvisation in jazz can be conceptually linked to the dynamic, interactional relationships such as those found in coaching. Using jazz history, this conceptual paper investigates how jazz improvisation may inform coaches and coachees in individual, group, or organizational coaching programs. Several propositions are provided through the relationships between the number of coachees, decision-making speed, group size, level of pre-arrangement, and improvisation. Utilizing the information provided in this paper may prove fruitful for coaches seeking coachee performance through spontaneous creativity.", "Improvisation | Jazz | Coaching | Creativity | Psychology | Process (computing) | Conceptual model | Key (lock) | Social psychology | Applied psychology | Cognitive psychology | Cognitive science | Computer science | Visual arts | Art | Psychotherapist | Computer security", "Creativity in Education and Neuroscience", "Experimental and Cognitive Psychology", "Psychology", "Social Sciences", null, true, "diamond", "cc-by-nc-nd", null, null, 6, 33, "https://openalex.org/W570490353 | https://openalex.org/W651641166 | https://openalex.org/W1493008871 | https://openalex.org/W1589627786 | https://openalex.org/W1728275924 | https://openalex.org/W1981875144 | https://openalex.org/W1983984626 | https://openalex.org/W1994426438 | https://openalex.org/W2001702128 | https://openalex.org/W2011552505 | https://openalex.org/W2015112414 | https://openalex.org/W2016364797 | https://openalex.org/W2019012341 | https://openalex.org/W2040040964 | https://openalex.org/W2045132332 | https://openalex.org/W2051798959 | https://openalex.org/W2052705695 | https://openalex.org/W2052817658 | https://openalex.org/W2058394280 | https://openalex.org/W2073386438 | https://openalex.org/W2096652935 | https://openalex.org/W2098083369 | https://openalex.org/W2123285750 | https://openalex.org/W2128456336 | https://openalex.org/W2138086691 | https://openalex.org/W2153222072 | https://openalex.org/W2162533447 | https://openalex.org/W2335413098 | https://openalex.org/W2619476741 | https://openalex.org/W2750518230 | https://openalex.org/W2798376483 | https://openalex.org/W2952332451 | https://openalex.org/W3006532558", false, "2025-07-24 00:00:00"], ["https://openalex.org/W266449747", "https://doi.org/10.2352/j.imagingsci.technol.200650:2157", "http://swepub.kb.se/bib/swepub:oai:DiVA.org:liu-32248?language=en", null, "A Novel Hybrid AM/FM Halftoning Based on Multi-level Halftoning", "article", "en", "2006-01-01", 2006, "Sasan Gooran", "https://orcid.org/0000-0002-1049-6500", "Sasan Gooran", null, null, "Journal of Imaging Science and Technology", "Society for Imaging Science and Technology", "1062-3701", "50", "2", "157–167", "A digital gray scale image generally consists of 256 different gray tones. Printers and image setters normally generate much fewer levels and mostly only two levels. Therefore, in order to be able to display a digital cone-tone image by a multilevel device it has to be transformed into an image with fewer levels. The technique doing this transformation is called multi-level halftoning, and in the case of bilevel devices it is simply called halftoning. In this paper we propose a novel (bilevel) halftoning technique that is based on multilevel halftoning. The proposed method can also be categorized as belonging to hybrid amplitude modulated (AM)/ frequency modulated (FM) techniques. In this method the original digital image is firstly halftoned by a multilevel FM halftoning. Each level in the multilevel halftoned image is then replaced by a halftone table (microcell). An approach for extending any bilevel FM halftoning method to a multilevel method is also presented in this paper. The performance of the proposed method is examined by a number of illustrations where nonmodified error diffusion and our FM method are used. The problem with maze-like artifacts that occur when our FM halftoning, or similar methods such as DBS, are used as the macroscreen is discussed and a simple solution is introduced. An approach for extending the proposed method to be used in situations where the halftone dots cannot be produced smaller than a specific size is also proposed and examined. This modified version of the method can be useful for flexography, where the dots normally cannot be produced smaller than a critical size.", "Halftone | Computer science | Artificial intelligence | Grayscale | Computer vision | Image (mathematics) | Pattern recognition (psychology) | Computer graphics (images)", "Color Science and Applications", "Atomic and Molecular Physics, and Optics", "Physics and Astronomy", "Physical Sciences", null, false, "closed", null, null, null, 2, 9, "https://openalex.org/W6638387682 | https://openalex.org/
