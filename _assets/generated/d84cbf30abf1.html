ess. I identify two main learning experiences in the coaching process, insight and planning skills, and propose that these affect stress directly and also indirectly through mediators’ job demand, job control, and social support. A within-subject, longitudinal design is applied, with 56 persons receiving coaching from professional, external coaches. Data was collected at three points in time: baseline (before coaching), after a three-month period of coaching, and a follow-up nine months later. The results show that planning skills acquired through coaching reduce stress in the short term, and that the effect is mediated through a decrease in job demand. The decrease in job demand is further shown to reduce stress in the long term. Insight as a coaching outcome is not directly related to stress; however, insight affects social support, which in turn is associated with reduced stress in the long term."], ["https://openalex.org/W3197655665", "TECHNOLOGY INTERVENTION ON DIGITAL SUPPLY CHAIN", 2018, "article", 0, "Big Data and Business Intelligence", "Technology is no more a research labs thing and need to be applied to improve businesses and society. This means that when an invention makes relevance to society it need to be converted into innovation by absorbing into businesses. This paper focuses on technology disruptions that are relevant to supply chain across industries."], ["https://openalex.org/W65791556", "Larry P. and the Emr Child", 1981, "article", 1, "Academic Freedom and Politics", null], ["https://openalex.org/W97139018", "Teaching Trainable Level Retarded Students To Count Money: Toward Personal Independence Through Academic Instruction", 1975, "article", 21, "Financial Literacy, Pension, Retirement Analysis", "A program for teaching money counting skills was conducted with five trainable level retarded adolescents. The instructional materials, teaching methods and evaluation procedures are detailed. All students learned a sequence of rote counting skills and then learned to apply these skills in counting amounts of change. The results are interpreted as support for the view that instruction in basic academic skills can be an integral part of practical education."], ["https://openalex.org/W3203460566", "Facilitating Empowerment of Women through Self Help Groups with Reference to NABARD in Punjab: An Analysis", 2020, "article", 1, "Microfinance and Financial Inclusion", "Women are an integral part of the social, economic and political system. women. The overall growth and development of a country is viable only when women are given equal opportunities in every sphere and access to various services. Microfinance is the first step towards bringing women within the purview of access to financial services for the economic empowerment of women which paved way for their sustainable livelihood. The financial services are a better way to access the banking facilities for the poor at an affordable cost. The sources of credit represent linkage between banks and Self Help Groups and provide credit funds for women to enhance livelihood opportunities. National Bank for Agriculture and Rural Development (NABARD) acts as facilitator and provider of microfinance. An attempt has been made in this paper to study the Role of NABARD as Facilitator for financial inclusion of women; to assess the impact of financial inclusion on sustainable livelihood of SHGs of women. An attempt has been made to analyze the impact of working in SHG on women economic empowerment in Hoshiarpur and Mansa districts of Punjab. It has been found that there is a positive impact on women empowerment through self-help groups, in terms of increase in participation, awareness, credit accessibility, asset creation, entrepreneurship, repayment of other debts, and gained the decision making skills. Women are now more confident in Decision making. The self-help groups have enabled marginalized women to get social status as well as now they have access to various financial products and services at very low cost."], ["https://openalex.org/W115632047", "Perspectives: Should Mandatory Voting Laws be Implemented in the United States?", 2011, "article", 0, "Judicial and Constitutional Studies", "T he deterioration of the center in American politics is one of the most distressing signs of dysfunction in our political system. It has been obvious inside Congress, where lawmakers (especially those in the middle) who deign to work toward the middle and across party barriers are often ostracized or punished. The polarization is even more apparent outside Washington, in campaigns and elections."], ["https://openalex.org/W115612146", "The Spherical Transform for Homogeneous Vector Bundles over Riemannian Symmetric Spaces", 1997, "article", 33, "Advanced Algebra and Geometry", null], ["https://openalex.org/W1539675133", "Tillage and N Impact on Wheat Production and N Efficiency under Rice-Wheat Cropping System in Northwestern Pakistan", 2012, "article", 3, "Rice Cultivation and Yield Improvement", "We examined the effect of tillage (T) systems [zero (ZT), reduced (RT) and conventional tillage (CT)] and N rates (0, 80, 120, 160 and 200 kg ha-1) on wheat yield and N efficiency in northwestern Pakistan. Tillage systems produced similar grain yield and N efficiency indices (NEI) except nitrogen harvest index (NHI). Grain yield increased with increase in N, while grain to straw N ratio, N utilization efficiency (NUtE) and NHI decreased with N. Zero tillage having higher NHI may have the potential for higher yield compared with RT and CT if provided with optimum N. ZT with 160 kg N ha-1 may be a more efficient and sustainable strategy to enhance wheat yield and NEI."], ["https://openalex.org/W2973418703", "Just Google It?: Supporting Historical Reasoning and Engagement during Online Research", 2015, "article", 2, "Wikis in Education and Collaboration", null], ["https://openalex.org/W2426339023", "Stepping off the treadmill: A study of coaching on the RCN Clinical Leadership Programme", 2007, "article", 7, "Coaching Methods and Impact", "This phenomenological study is set in the context of leadership development in the National Health Service (NHS). The aim of the study was to provide an in-depth understanding of the Royal College of Nursing Clinical Leadership Development Programme (RCN CLP) participants’ experience of the coaching component of the programme. In-depth interviews were undertaken with eight clinical leaders who had recently completed the RCN CLP. The overarching theme emerging from the data suggested that coaching was seen as an opportunity for ‘stepping off the treadmill’. This main theme is underpinned by a further eighteen theme clusters, organised into 6 categories: out and in the comfort zone; mirror mirror; unconditional positive regard; creative conversations; ripple effect; and I'm OK, you're OK. In this paper, the implications of the findings are discussed and recommendations for further research identified."], ["https://openalex.org/W2750251897", "What coaches can learn from the history of jazz-based improvisation: A conceptual analysis", 2014, "article", 6, "Creativity in Education and Neuroscience", "From early jazz to current sub-styles, the key component, improvisation, is thought to also be important to the coaching process. Improvisation in jazz can be conceptually linked to the dynamic, interactional relationships such as those found in coaching. Using jazz history, this conceptual paper investigates how jazz improvisation may inform coaches and coachees in individual, group, or organizational coaching programs. Several propositions are provided through the relationships between the number of coachees, decision-making speed, group size, level of pre-arrangement, and improvisation. Utilizing the information provided in this paper may prove fruitful for coaches seeking coachee performance through spontaneous creativity."], ["https://openalex.org/W266449747", "A Novel Hybrid AM/FM Halftoning Based on Multi-level Halftoning", 2006, "article", 2, "Color Science and Applications", "A digital gray scale image generally consists of 256 different gray tones. Printers and image setters normally generate much fewer levels and mostly only two levels. Therefore, in order to be able to display a digital cone-tone image by a multilevel device it has to be transformed into an image with fewer levels. The technique doing this transformation is called multi-level halftoning, and in the case of bilevel devices it is simply called halftoning. In this paper we propose a novel (bilevel) halftoning technique that is based on multilevel halftoning. The proposed method can also be categorized as belonging to hybrid amplitude modulated (AM)/ frequency modulated (FM) techniques. In this method the original digital image is firstly halftoned by a multilevel FM halftoning. Each level in the multilevel halftoned image is then replaced by a halftone table (microcell). An approach for extending any bilevel FM halftoning method to a multilevel method is also presented in this paper. The performance of the proposed method is examined by a number of illustrations where nonmodified error diffusion and our FM method are used. The problem with maze-like artifacts that occur when our FM halftoning, or similar methods such as DBS, are used as the macroscreen is discussed and a simple solution is introduced. An approach for extending the proposed method to be used in situations where the halftone dots cannot be produced smaller than a specific size is also proposed and examined. This modified version of the method can be useful for flexography, where the dots normally cannot be produced smaller than a critical size."], ["https://openalex.org/W276995253", "The attitudes of Nonhandicapped Students toward the Mildly Retarded: A Consideration in Placement Decisions", 1981, "article", 10, "Disability Education and Employment", "sification in mental retardation (Special Publication No. 2). Washington, D.C.: American Associa tion on Mental Deficiency, 1977. Haywood, C. H. What happened to mild and moderate retardation? American Journal on Men tal Deficiency, 1979,83, 429-431. Rago, W. V., & Cleland, C. C. Future direction in education of the profoundly retarded. Education and Training of the Mentally Retarded, 1978, 13, 185-186."], ["https://openalex.org/W2562489091", "Characterization and Modeling of Superconducting Josephson Junction Arrays at Low Voltage and Liquid Helium Temperatures", 2016, "article", 0, "Advanced Electrical Measurement Techniques", "Abstract : This technical report demonstrates the capabilities to measure niobium-based Josephson junction arrays at liquid helium temperatures at less than 50 mV. We find current switching with voltage consistent with the transition from Cooper-pair to quasiparticle tunneling. The results agree with the industrial manufacturers specifications. We use a recently created empirical model applicable to Josephson junction devices and arrays and obtain excellent fits to the characteristics and extract the non-ideality. These capabilities and calibration results will assist in the characterization of advanced superconductor-ionic quantum memory and computation devices."], ["https://openalex.org/W3173296804", "EXPLORING SCIENCE TEACHERS' VIEWS ABOUT THE NATURE OF SCIENCE AND HOW THESE VIEWS INFLUENCE THEIR CLASSROOM PRACTICES", 2018, "article", 0, "Science Education and Pedagogy", null], ["https://openalex.org/W1667312207", "An improved RCSA for identifying the spindle-holder taper joint dynamics", 2014, "article", 2, "Advanced machining processes and optimization", "Spindle-holder taper joint is one of the most crucial joints of high speed spindle system (HSS). Dynamic behavior of this taper joint is critical for predicting tool point frequency response function (FRF) and evaluating the cutting process stability. To identify the spindle-holder taper joint dynamic behavior precisely and rapidly, a novel identification technology is presented in this paper. Firstly, receptance coupling substructure analysis (RCSA) is improved to save the computing time without sacrificing the calculation precision. Secondly, instead of extracting the joint coefficients by complex fitting methodology, a receptance matrix is identified to represent the spindle-holder taper joint dynamic characteristics. Finally, the joint receptance matrix is used, coupling with the analytical model of arbitrary holder with varying overhang length and diameter, to predict FRF at the free end of spindle-holder assembly. The results show good agreements between predictions and experimentations. And it is validated that the presented identification technology is feasible. Comparing to the previous literatures, the proposed approach is less time-consuming and more accurate to reflect the nonlinear characteristics of spindle-holder taper joint."], ["https://openalex.org/W1547774614", "Digital Photometric Method for Determining Degree of Harvest Maturity and Ripeness of ‘Sinta’ Papaya (Carica papaya L.) Fruits", 2012, "article", 5, "Postharvest Quality and Shelf Life Management", "The degree of ripeness of ‘Sinta’ papaya (Carica papaya L.) fruits was determined by taking digital pictures of fruits at varying stages of ripeness, followed by color analysis of the digital photographs based on the generated red (R), green (G) and blue (B) color values of the photographs using a computer software (RGB Analysis of Image Color). The stages of fruit ripeness were classified based on RGB values, visual characteristics, as well as total soluble solids, total carbohydrates, titratable acidity and firmness, of the fruits; these parameters were correlated with the stages of ripeness. There was a significant increase in total soluble solids and total carbohydrates of the fruits from ripening stage 1 (green) to stage 2 (with tinge of yellow) and a significant decrease in firmness as the fruits ripened. No significant change was observed in titratable acidity of the fruits during ripening. Firmness and total carbohydrates showed the strongest correlation with degree of ripeness among the four parameters studied. From the slopes in plots of RGB values versus firmness, binary and ternary color functions were formulated in order to measure the degree of fruit ripeness. The correlation coefficients were 0.9387 and 0.9497 for plots (versus fruit firmness) of the binary and ternary color functions, respectively. The results showed that the photometric method, using a digital camera combined with software for color analysis, can help to quantitatively determine the degree of maturity and ripeness of ‘Sinta’ papaya fruits."], ["https://openalex.org/W1820181334", "Comparison of Mathematical and Neural Network Models in the Estimation of Papaya Fruit Moisture Content", 2012, "article", 18, "Food Drying and Modeling", "The moisture content of papaya fruit during drying in a cabinet dryer was estimated using both mathematical and neural network models. The effect of air temperatures (40, 50 and 60 °C) and fruit slice thickness (3, 5, 7 mm) on moisture ratio were investigated. A three-layer perceptron neural network with different training algorithms was designed and used. To obtain better estimation of fruit moisture content, topologies were established based on different threshold functions. The results showed that the multi-layer perceptron network with 3-9-1 topology, the Levenberg-Marquardt training algorithm and the logarithmic sigmoid threshold function provided the least errors. Furthermore, eight well-known mathematical models were also used to simulate the drying process. Among the mathematical drying models, the Two-term model was found to be more suitable for predicting the drying of papaya fruit slices, with a coefficient of determination (R2) of 0.9974 and a root-mean-square error (RMSE) of 0.0123. However, these values were lower than those obtained for the designed neural network model (R2 = 0.9994; RMSE = 0.0070). Therefore, estimation of the moisture content of papaya fruit could be better modelled by a neural network than by the mathematical models."], ["https://openalex.org/W4289985918", "An Investigation of the Effects of Clinical Experience on Cognitive Gains", 1979, "article", 0, "Counseling Practices and Supervision", null], ["https://openalex.org/W2183485439", "Behavioral Pharmacy Research by Social and Administrative Science Faculty from 1989-1999", 2001, "article", 4, "Pharmaceutical Practices and Patient Outcomes", null], ["https://openalex.org/W6920948", "The Role of Benchmarking Data in the Software Development and Enhancement Projects Effort Planning", 2009, "article", 6, "Software Engineering Research", "One of the fundamental causes of low software development and enhancement projects success rate are improperly derived estimates for their costs and time. In the case of such projects the budget and time frame are determinated by the effort being spent on activities needed to deliver product, which would meet client's requirements. Objective and reliable effort estimation still appears to be a great challenge to the software engineering. In the author's opinion the main reason of that problem is effort estimation on the basis of resources, while such planning activity should ground on the required software product size, which determines work effort. But using suitable methods for software size estimation will not be sufficient as long as it does not take into account benchmarking data concerning similar projects having been completed in the past. This paper is aimed at indicating the important role of using reliable benchmarking data in order to obtain valuable effort estimates for software development and enhancement projects, including particularly the attempt to analyse usefulness of benchmarking data of general character."], ["https://openalex.org/W3213662909", "The Impact of Indian Independence Movement on the select Novels of Raja Rao", 2021, "article", 0, "Indian History and Philosophy", "Indian Writing in English is influenced by Gandhian ideology. Gandhi emphasized more on social, political, and religious problems of the oppressed and down trodden lower castes in Hindu society. His aim was to abolish poverty, caste system and untouchability from society. The present study reveals prominently the influence of Mahatma Gandhi on the village of Kanthapura. ‘Kanthapura’ is the microcosm of the Indian traditional society and what happened in Kanthapura was also happened in India during 1919-1930. It is not only a political novel, but also a novel which concerns with socio-religious and economic transformation during the struggle for independence. ‘Kanthapura’ follows Gandhi’s doctrine and ideology of non-violence, Satyagraha, their views on untouchability and casteism etc. The novel can be considered Gandhi-epic. Gandhi aroused national awakening in Indians with his non-violent struggle for freedom movement which was strengthened by noncooperation and civil disobedience movement in Kanthapura village. Gandhi’s influential personality and his ideology is felt everywhere in the novel. Indeed, Gandhi doesn’t appear in this novel personally, but the plot of the novel revolves around his ideology. This research article, ‘Gandhi’s Ideology: A Study of Raja Rao’s Kanthapura’ aims at how the Gandhi’s ideology influenced Raja Rao which resulted in the creation of the character of Moorthy. It also focuses on how Moorthy, under the influence of Gandhi, tries to inspire the people towards the freedom struggle."], ["https://openalex.org/W2227619978", "Historical Fiction, the Common Core, and Disciplinary Habits of Mind", 2014, "article", 9, "Educator Training and Historical Pedagogy", "Historical fiction draws students into the study of the past, enriches their understanding of events, and provides opportunities for cultivating historical analysis."], ["https://openalex.org/W284904402", "Effect of Goal Setting with Feedback on Productivity in A Sheltered Workshop", 1983, "article", 4, "Art Education and Development", "havior, 1973, 4, 247-252. Rubin, J. A. Art is for all human beings, especially the handicapped. Art Education, 1975, 28, 5-10. Schwartz, F. Art for the exceptional. Art Education, 1974,27,15-18. Smith, R. M. Creative thinking abilities of educa bly mentally handicapped children in the reg ular grades. American Journal of Mental Defi ciency, 1967, 71, 571-575. Talkington, L. W., & Briggs, N. C. An exploratory study of creativity in mentally retarded youth. Education and Training of the Mentally Retarded, 1978, 13, 55-59. Tilley, P. Art in the education of subnormal children. New York: Pitman Publishing Co., 1975. Trubowity, S., 8c Lewis, R. Art made me some body: The importance of arts for the handi capped. Principal, 1980, 60, 28—30."], ["https://openalex.org/W2590007971", "A Ten-Year Trend Analysis of Pharmacist Participation in the Workforce", 2002, "article", 15, "Pharmaceutical Practices and Patient Outcomes", null], ["https://openalex.org/W2569488858", "Dissecting Excellence", 2000, "article", 0, "Posthumanist Ethics and Activism", null], ["https://openalex.org/W233316168", "Generalization of Prevocational and Vocational Skills: Some Practical Tactics", 1979, "article", 5, "Psychology of Development and Education", "Fernald, G. M. Remedial techniques in basic school subjects. New York: McGraw-Hill, 1943. Gage, N. L. Paradigms for research on teaching. In N. L. Gage (Ed.), Handbook of research on teaching. Chicago: Rand McNalley, 1963. Gagne, R. M. The conditions of learning (2nd ed.). New York: Holt, Rinehart, & Winston, 1970. Ghent, L. Recognition by children of realistic figures presented in various orientations. Canadian Jounal of Psychology, 1960, 14, 249-256. Gibson, E. J. Principles of perceptual learning and development. New York: Appleton-Century Crofts, 1969. Glaser, R. Psychology and instructional technology. In R. Glaser (Ed.), Training research and education. Pittsburgh: University of Pittsburgh Press, 1962. Hilgard, E. R., & Bower, H. B. Theories of learning. New York: Appleton-Century-Crofts, 1966. Howard, I. P., & Templeton, W. B. Human spatial orientation. New York: Wiley, 1966. Klausmeier, H. J., Ghatala, E. S., 8c Frayer, D. A. Conceptual learning and development: A cognitive view. New York: Academic Press, 1974. Levine, M. Hypothesis behavior by humans during discrimination learning. Journal of Experimental Psychology, 1966, 71, 331-338. Luria, A. R. Psychological studies on mental deficiency in the Soviet Union. In N. R. Ellis (Ed.), Handbook of mental deficiency. New York: McGraw-Hill, 1963."], ["https://openalex.org/W247958319", "Art Education for Mildly Retarded Students: A Significant component of the Special Education Curriculum", 1983, "article", 0, "Art Education and Development", null], ["https://openalex.org/W3023501577", "The use of short speculative fiction in teaching about privacy", 2020, "article", 2, "Digital Games and Media", null], ["https://openalex.org/W204044176", "An Approach for Refactoring using ESC/Java2 — A Simple Case Study —", 2009, "article", 0, "Software Engineering Research", "Refactoring is a structural transformation technique for program code, which preserves their functional or behavioral aspects. Check whether the transformed program codes preserve such properties or not is a significant process. It carried out to support quality assurance. This paper introduces an alternative approach for the checking process via program verification. In this approach, ESC/Java2 tool is used for refactoring program codes in Java."], ["https://openalex.org/W65175468", "Theoretical and Experimental Analysis of Column Web in Compression", 2008, "article", 3, "Structural Load-Bearing Analysis", "Advanced analysis of steel structures requires an accurate modelling of beam-to-column joints to be used for complete non linear analyses including both mechanical non-linearity and geometrical non linearity. Therefore, the predic- tion of the rotational behaviour of beam-to-column joints is necessary. To this scope the component approach can be ap- plied. Within this framework, in this paper the attention is focused on the behaviour of the column web in compression, which represents an important joint component influencing significantly the rotational response of unstiffened connections where continuity plates are omitted. In particular, in order to analyse the whole force-displacement behaviour of this com- ponent, an experimental program has been planned and performed on twelve specimens represented by standard HEA and HEB series whose web has been subjected to transversal compression, under displacement control, allowing the investiga- tion of the post-buckling behaviour."], ["https://openalex.org/W2990040217", "TO STUDY THE EFFECT OF FRICTION STIR PROCESSING ON MECHANICAL PROPERTIES OF AL 5251 ALLOY", 2017, "article", 0, "Aluminum Alloys Composites Properties", "In the current study Al 5251 alloy based surface composite are produced by using SiC and Al2O3 reinforcements with the help of friction stir processing. Effect of different combinations of process parameters (tool speed, number of passes and reinforcements) on mechanical properties viz. tensile strength, hardness and impact strength is investigated. The optical images shown that the reinforcement uniformly distributed in the matrix. It is also observed that the mechanical properties of Al 5251 alloy surface composites are improved as compared to unreinforced alloy. The hardness of the processed alloy reached up to 44 HRB which is significant higher than the unprocessed alloy. The tensile strength of Al alloy increased up to 229 MPa by double pass of FSP without any reinforcement. Impact strength is improved by formation of surface composite on alloy. The overall properties of the Al 5251 alloy are improved by FSP."], ["https://openalex.org/W2188242832", "An open source implementation of a data acquisition system for a current pulse ERT system using an industry standard interface", 2013, "article", 1, "Electrical and Bioimpedance Tomography", "The design and applications of the Current Pulse Electrical Resistance Tomography (ERT) system developed at the University of Cape Town (UCT) has been described in several journal papers and at previous world congresses. Details of the electronic circuits were published at WCIPT6. This paper deals with the replacement of the USB DAQ and two microcontrollers with an industry standard IO system available from National Instruments and enables the transmission of data at 1000 fps over an TCP/IP network. The LabVIEW code will be placed in the public domain to coincide with WCIPT7. This will provide a complete open source design for an ERT system."], ["https://openalex.org/W2193847520", "Influences of planetary gear parameters on the dynamic characteristics – a review", 2015, "article", 6, "Gear and Bearing Dynamics Analysis", "Planetary gear trains (PGTs) are widely used in the field of mechanical transmission. PGTs significantly differ from fixed-axis gear trains and exhibit unique dynamic behavior. Dynamic characteristics of PGTs are popular research topic, particularly when attempting to solve the problem of vibration noise. Moreover, the effects of the planetary gear parameters on the dynamic characteristics are paramount important. And significant researches have been conducted in this field. However, few reviews regarding these studies have been published. In this paper, the effects of certain parameters, which include mesh phase difference, geometric errors (tooth profile error, eccentricity error and misalignment), tooth profile modification, mesh stiffness, and etc., on the dynamic characteristics of PGTs are summarized. Several conclusions obtained can be used for the PGTs design and dynamic characteristics analysis. Finally, the potential research trends are pointed out."], ["https://openalex.org/W2217007177", "Etching Characteristics of Fission Tracks in Minerals, and Fission Track Dating and Calibration of Zircon", 1987, "article", 1, "Radioactive element chemistry and processing", "Laboratory techniques for fission track dating of zircon, apatite and sphene were discussed in detail through the experiments based on sample selection, mineral separation, etching, irradiation and counting. Etching characteristics of spontaneous tracks on internal and external surfaces of zircons, apatites and sphenes, and induced tracks on an external detector were observed to discuss the variation of track densities during etching, and to measure the anisotropic etching efficiency. The zircons from the Fish Canyon Tuff, one of the universally studied age standards, were analyzed for their fission track ages and uranium concentrations using the external detector method. The combined fission track age of the zircon is 29.85±4.77 (1s) Ma which is well consistent with other fission track and K-Ar ages. The Zeta-values for standard glass dosimeters were preliminarily measured for age calibration using the Fish Canyon Tuff zircons. The values of ξ-factors are 348 for SRM 612, 360 for SRM 962a, 123 for CN 1 and 133 for CN 2."], ["https://openalex.org/W3197422920", "ENTREPRENEURIAL ATTITUDE OF ADDIS ABABA UNIVERSITY GRADUATING STUDENTS - THE CASE OF SCHOOL OF COMMERCE", 2019, "article", 1, "Entrepreneurship Studies and Influences", "The aim of the study or the research was to assess entrepreneurial attitude of Addis Ababa University School of commerce students and associated factors that can potentially influence the students’ attitude toward entrepreneurship. The research was conducted on Addis Ababa University School of commerce regular graduating students. The total population of the study was 924. In this study stratified random sampling techniques on the basis of the students’ year of study and field of study area are used. Totally 105 students were taken as a total sample size for the study. The study predominantly obtained the required data from primary source by using questionnaire. Descriptive analysis method was used in order to analyze the data collected through this method. The result of this study shows that most students, their families and close friends possess good entrepreneurial attitude. Generally, this study indicates the need to use this positive attitude productively by creating good environment for students to pursue their ideas."], ["https://openalex.org/W2471038318", "Quantitating Caregiver Work Load in the Icu: The Therapeutic Intervention Scoring System", 1999, "article", 7, "Intensive Care Unit Cognitive Disorders", null], ["https://openalex.org/W2923749906", "Observations of surficial talus movement", 1969, "article", 17, "Foot and Ankle Surgery", null], ["https://openalex.org/W3183415725", "Exploring paramedic health status and simulated occupational performance.", 2020, "article", 0, "Musculoskeletal pain and rehabilitation", null], ["https://openalex.org/W2616520833", "In-Hospital resuscitation: A Statement for Healthcare Professionals from the American Heart Association Emergency Cardiac Care Committee and the Advanced Cardiac Life Support, Basic Life Support, Pediatric Resuscitation, and Program Administration Subcommittees", 1998, "article", 1, "Cardiac Arrest and Resuscitation", null], ["https://openalex.org/W2398683674", "Nonlinear oscillations and chaotic dynamics of a supported FGM rectangular plate system under mixed excitations", 2014, "article", 4, "Vibration and Dynamic Analysis", "In this paper, we investigated the nonlinear oscillations, vibrations and chaotic dynamics of a simply supported rectangular plate made of functionally graded materials (FGMs) through a temperature field subjected to mixed excitations. The rectangular FGM plate system described by a coupled of nonlinear differential equations (two degree of freedom) including the quadratic and cubic nonlinear terms. The mathematical solutions of the governing equations of motion for the FGM plate derived using the perturbation method based on the power series expansion up to and including the second order approximation. The numerical simulations investigated using Runge-Kutta of fourth order using MATLAB and MAPLE programs. All different resonance cases reported and studied numerically. We applied both frequency response equations and phase-plane technique and also Lyapunov’s first method near the worst resonance cases to analyze the stability of the steady state solution of vibrating system. The effects of the different parameters of the rectangular plate system studied numerically. Results compared to previously published work. In the future work, we can deal with the same system subjected multi-external and tuned and parametric excitation forces. Also, the system can be studied at another worst different resonance cases, active and passive controller."], ["https://openalex.org/W69797637", "A Note on the Linear Cycle Space for Groups of Hermitian Type", 2003, "article", 7, "Advanced Algebra and Geometry", "Let G0 be a simple Lie group of hermitian type and let B denote the corresponding hermitian symmetric space. The linear cycle space for any nonholomorphic type ag domain of G0 is biholomorphic to B B. When G0 is a classical group this was proved by the authors in a paper published several years ago. Here we show that the result follows for arbitrary groups of hermitian type. This is done without case by case arguments by combining results from that paper with recent results of A. T. Huckleberry and the rst author."], ["https://openalex.org/W4289971593", "CONSUMER SURVEY: An Approach to Teaching Consumer Participation in Community Health", 1977, "article", 0, "Primary Care and Health Outcomes", "This consumer survey conducted by senior baccalaureate students in a family and community nursing course developed as a result of student recognition of the need for direct consumer input in identification of community health needs. The format was developed, pretested and revised by faculty. The door-to-door survey was carried out by pairs of students during clinical time over a six-week period. Through a written summary of the experience and class discussion students indicated an increased awareness of the community as a dynamic reality and a heightened awareness of their caseload families' relationships to the community. Students also demonstrated an appreciation for consumer representation in health planning and for some of the strengths and weaknesses of surveying as a method for consumer involvement."], ["https://openalex.org/W3025436729", "Let's Talk! Teaching Race in the Classroom", 2017, "article", 6, "Diverse Educational Innovations Studies", "Even before the Smithsonian's National Museum of African American History and Culture (NMAAHC) opened its doors on September 24, 2016, educators at the museum were committed to fostering open, honest, and productive dialogues on race. Various programs have been designed to prepare educators to bring conversations of race, identity, and racism into the educational setting with the goals of developing positive self-identities, reducing prejudice, and increasing racial understanding to the classroom."], ["https://openalex.org/W2277115265", "Vector Addition Theorem and Its Diagonalization", 2008, "article", 13, "Electromagnetic Scattering and Analysis", "The conventional vector addition theorem is written in a compact notation. Then a new and succinct derivation of the vector addition theorem is presented that is as close to the derivation of the scalar addition theorem. Newly derived expressions in this new derivation are used to diagonalize the vector addition theorem. The diagonal form of the vector addition theorem is important in the design of fast algorithms for computational wave physics such as computational electromagnetics and computational acoustics."], ["https://openalex.org/W2144291669", "The Atiyah Extension of a Lie Algebra Deformation", 2005, "article", 0, "Algebraic structures and combinatorial models", "We construct an analogue of the 'Atiyah class', or 'Atiyah ex- tension' in the context of deformation theory of sheaves of Lie algebras. Given a (suitable) sheaf g of Lie algebras on a space X, and a g-deformation over a formally smooth base, our Atiyah extension is a Lie algebra ex- tension of the algebra of base vector fields by the -twist of g. It comes equipped with a representation of the -twist on any (admissible) g-module. Mathematics Subject Index: Primary 32G99, secondary 17B55, 14D14."], ["https://openalex.org/W1273445523", "Establishing A Fare Elasticity Regime for Urban Passenger Transport", 1998, "article", 83, "Consumer Market Behavior and Pricing", "This paper uses a model to obtain empirically realistic results. A data set collected in Sydney in 1995 is used to obtain a matrix of direct- and cross-elasticities, which reflects the market environment in which commuters make choices. This results in a richer understanding of how travellers respond to fare profiles that are not always observed in real markets, but which may be of interest as potential alternatives to those offered in current markets."], ["https://openalex.org/W2606093204", "H4(BK, Z) and Operator Algebras", 2004, "article", 1, "Algebraic structures and combinatorial models", null], ["https://openalex.org/W2973954643", "Jamestown and Power Lines: Teaching Controversy in an Inter-Disciplinary Manner", 2016, "article", 3, "Educator Training and Historical Pedagogy", "Jamestown is at the heart of any teaching and learning of colonial American history. Stories of John Smith and Pocahontas are learned by elementary and secondary students across the United States. In Virginia, Jamestown is first taught in third grade and revisited five more times from historical, political, economic, and geographic perspectives. However, the history of Jamestown is taught principally as a place, a series of events, and people from long ago with little consideration of its place in the world today. The reality is that Jamestown Island, the location of the first permanent English settlement in the Americas, is today part of a thriving metropolitan area of approximately 1.7 million people."], ["https://openalex.org/W214541454", "Evaluation of Peer Teaching in a Pharmaceutical Care Laboratory", 2000, "article", 15, "Problem and Project Based Learning", null], ["https://openalex.org/W3148170884", "Software Business Models", 2020, "article", 0, "Business Process Modeling and Analysis", null], ["https://openalex.org/W1600939012", "Health-Promoting Lipids from Purslane (Portulaca oleracea L.): Isolation, Characterization, Quantification and In Vivo Assay of Angiogenic Activity", 2012, "article", 7, "Fatty Acid Research and Health", "Phytosterols, α-tocopherol and squalene were isolated from purslane (Portulaca oleracea L.) using a combination of solvent extraction, saponification and thin layer chromatography, and were characterized using standard chemical tests and ultraviolet and Fourier transform infrared spectroscopy. The levels of these lipids per 100 g fresh weight were quantified as follows: 6.52 ± 0.44 mg phytosterols, 9.05 ± 0.04 mg α-tocopherol and 115.0 ± 2.0 μg squalene. Argentation thin layer chromatography further resolved the phytosterol isolate into β-sitosterol, stigmasterol and campesterol, the identities of which were established through melting point determination coupled with ultraviolet and Fourier transform infrared spectroscopy. Furthermore, gas chromatographic analysis of purslane oil revealed the presence of the omega-3 fatty acids α-linolenic acid and docosahexaenoic acid at 17.00 ± 0.33% and 5.08 ± 0.49%, respectively, of purslane oil. A new semi-quantitative in vivo duck embryo chorioallantoic membrane (CAM) assay for angiogenesis was described in this study including a scoring system with a scale of -3 to +3, with -3 as the score for complete loss of blood capillaries. Purslane oil and its saponifiable and unsaponifiable fractions exhibited scores of -1 to -2.7 when applied to CAM at 150–300 μg. Their anti-angiogenic activity can be attributed to the presence of phytosterols, α-tocopherol, squalene and omega-3 fatty acids. This study revealed the potential use of purslane in modulating angiogenesis."], ["https://openalex.org/W2259244211", "Outcomes-Based Integrated Hybrid PBL Curriculum", 2002, "article", 13, "Problem and Project Based Learning", null], ["https://openalex.org/W2185323291", "8. Conservation of Native Biodiversity in the City: An Assessment of MRCA Projects in the Upper Los Angeles River Watershed", 2006, "article", 0, "Wildlife-Road Interactions and Conservation", null], ["https://openalex.org/W2734957240", "Standardization and development of different types of energy bars", 2017, "article", 8, "Smart Agriculture and AI", "The objective of present investigation wasrnStandardization and development of different types of Energy Bars. Developmentrnof different type of energy bars i.e. oats banana energy bar and coconut energyrnbar. The organoleptic evaluation of products was done by using score cardrnmethod (9-Point Hedonic Scale). The result of oats Banana energy bar, andrncoconut energy bar (T1) were best in all treatments in case of all sensoryrnattributes. The overall acceptability of experimental (T1) Oats Banana energyrnbar and Coconut energy bar were 9.0, 9.0 respectably."], ["https://openalex.org/W3197411299", "A STUDY ON STRATEGIC SOURCING AND SUPPLY CHAIN RISK MANAGEMENT IN AVTEC LIMITED", 2018, "article", 0, "Supply Chain Resilience and Risk Management", "Supply Chain Risk Management is the process of forecasting the risks that may happen in future and managing them effectively. In other words, SCRM is to apply risk management process tools, with partners in a supply chain or on your own, to deal with risks and uncertainties caused by, or affecting, logistics- related activities or resources in the supply chain. In order to be more efficient, firms have adopted strategies such as outsourcing, global partnerships and lean practices but resulted in lot of supply chain risks. Hence strategic sourcing and supply chain team combined together to minimize the supply chain risks. The study has been taken to gain an in-depth knowledge about strategic sourcing and the level of risk management in AVTEC Limited. This project is a study on AVTEC concern about supply chain risks and how good is the supply chain team in managing all the risks like Natural disaster risks, Geo-Political risks, Infrastructure outage risks, Supplier business policies and practices etc. A structured questionnaire has been used to collect the data. Appropriate statistical tools have been used to draw conclusions. The statistical tools such as Percentage analysis, Correlation and ANOVA were used. The conclusion and suggestions are provided to the company based on the data collected from them. The data collected are fed in the SPS software (SPSS). The data are analysed using the SPSS. The data are analysed using descriptive statistics, chi-square analysis and factor analysis-test."], ["https://openalex.org/W3215571155", "On the Reducibility Points beyond the Ends of Complementary Series of p-adic General Linear Groups", 2015, "article", 6, "Advanced Algebra and Geometry", null], ["https://openalex.org/W1555212126", "Does Supervisory Coaching Behaviour Reduce Salespeople's Lies?", 2011, "article", 4, "Coaching Methods and Impact", "Lying is pervading organizations and has a high economic and social toll. Lying among salespeople can be particularly dangerous, as they are at the boundaries of the organization and can affect many organizational outcomes. Traditionally, control systems have been used to reduce information asymmetry and the possibility of opportunistic behaviour (such as lying), and lately it was suggested that managers’ attitudes and role modeling could further reduce them. Building on the social exchange framework, we analyse relational exchanges between managers and subordinates, and we propose that managerial coaching can reduce subordinates’ lies. We present empirical evidence supporting our hypothesis and discuss significant theoretical and managerial implications."], ["https://openalex.org/W3025428250", "Why Do We Focus on Firsts? Problems and Possibilities for Black History Teaching", 2017, "article", 2, "Race, History, and American Society", "In the United States, there's a national infatuation with those who have broken barriers—racial, religious, gendered, and so on—and have presumably changed the rules of the game for others. News outlets and history textbooks seem unable to resist a good story of firstness . Researchers have speculated why this is the case: What better way to demonstrate those quintessential American qualities like the pioneer spirit and \"rugged individualism\" than to be the first person to break into a new frontier? Others suggest that firsts serve a tokenism purpose: a handful of high-achieving women and people of color allow Whites to tell themselves that the nation has progressed beyond its prejudicial past."], ["https://openalex.org/W4289952855", "CREDIT for consciousness raising", 1977, "article", 0, "Educational and Psychological Assessments", null], ["https://openalex.org/W4289974854", "Influencing Sex Role Opinions of Undergraduate Nursing Students", 1979, "article", 0, "Gender Roles and Identity Studies", null], ["https://openalex.org/W4289986238", "THE TERM PAPER REVISITED", 1978, "article", 0, "History and Developments in Astronomy", null], ["https://openalex.org/W275532211", "The role of the Paraprofessional in Educational Programs for the Severely Handicapped", 1981, "article", 5, "Collaborative Teaching and Inclusion", "In 1965, as a result of Title I of the Elemenable jobs. Now that severely handicapped in tary and Secondary Education Act, salaried dividuals are receiving educational h triangular grids and cavities with tetrahedral grids, this new formulation can be easily used for modeling structures with arbitrary shape. The formulation is validated by comparing the results obtained from uEFEM 0 with those from statistical energy analysis and literature. Good correlations are observed, and the advantages of the uEFEM 0 formulation are identified."], ["https://openalex.org/W3187330918", "GlobePort faces a Knowledge Gap in its Business Process Outsourcing", 2021, "article", 0, "Service-Oriented Architecture and Web Services", null], ["https://openalex.org/W2909469261", "MEASUREMENT METRICS FOR MEASURING SUCCESS OF BUSINESS INTELLIGENCE SYSTEM", 2014, "article", 1, "Big Data and Business Intelligence", "Currently, Business Intelligence Systems (BIS) have been widely utilized in organizations. Although BIS have been well accepted as value creator by organizations, justification of BIS value is not always been clear in order to justify BIS investment. Therefore, to understand BIS value, organizations need to measure their BIS. In addition, reviewing other researches shows that BIS measurement was used for managing BIS process as well as understanding BIS value. Prior researchers applied objective and subjective methods for BIS measurement which are suitable for Competitive Intelligence System (CIS) but not for BIS. Literatures also suggested that Information Systems (IS) success measurement models could be used for BIS success measurement in order to understand BIS value and manage BIS process. Therefore, this research applied DeLone & McLean (D&M) updated IS success model to identify BIS success dimensions. Furthermore, based on the model, previous researches focused more on user satisfaction, system use and net benefits dimensions of BIS success rather than BIS service, system, and information quality dimensions which this research aimed to address. To do so, the interpretive paradigm was chosen. Qualitative data collection methods, which include interviews, focus group and organizational document review were applied for collecting data in the largest car manufacturing company of Middle-East as a case study. During this study, 25 participants include senior and technical level managers were selected as interviewees and focused group members. Collected data was analyzed using qualitative data analysis methods, and the findings were validated by 10 BIS experts. In addition, researcher performed a Walk-Through test on BIS in Case Study Company. The main contribution of this research is the measurement metrics for BIS quality and the BIS success measurement model, which are applicable to understand success of BIS in organizations."], ["https://openalex.org/W4289974156", "Development of a Taxonomy for the Nursing Process", 1978, "article", 1, "Nursing Diagnosis and Documentation", null], ["https://openalex.org/W3170550339", "Teaching About the 2020 Presidential Election", 2020, "article", 3, "Educator Training and Historical Pedagogy", "Covid-19 has made classroom teaching this fall more challenging than normal. Masks, social distancing, and remote learning make instruction both difficult and unpredictable for all educators. Social studies teachers, though, are navigating an additional source of tension: the 2020 presidential election. The contest between President Donald Trump and former Vice President Joe Biden has been divisive, vicious, and has certainly captured the attention of students."], ["https://openalex.org/W3198231670", "IMPACT OF DPS ON MPS: A STUDY ON LEADING INDIAN CEMENT COMPANIES", 2018, "article", 0, "Financial Reporting and Valuation Research", "Risks and uncertainties are inherent in every organisation. Different class of investors in do not shoulder the same degree of risk. An investor in bonds earns return in from interest while shareholders depend on dividends, stock price appreciation. Dividend refers to the distribution of profit among the shareholders. Profit earned by a company can be retained for future usage, or distributed in form of dividend or both. Dividend decision is one of the important decisions, since it determines the amount of profit to be distributed among shareholders and the amount to be retained earnings for future investment purpose. This is known as Dividend Policy. The main objective of every company is to maximize shareholders wealth rather than profit. Shareholders gain both from Dividend as well as Capital Appreciation. Moreover, dividend policy of a company has an impact on its market price. Market price increases only if a company provides stable return to its shareholders. This paper focuses on the impact of dividend on Market Price of a company."], ["https://openalex.org/W1534570772", "Comparative Performance of Two Different Planters Modified for No-Till Planting of Wheat on Ridge", 2012, "article", 1, "Soil Management and Crop Yield", "No-till planting of wheat (Triticum durum L.) on ridge after cotton (Gossypium hirsutum L.) harvest may offer potential benefits in terms of lower production costs, improved soil structure and efficient irrigation. Sowing of wheat on ridge is possible with the devolopment of a suitable planter. A study was conducted to compare the effect of two different planters modified to plant wheat without tillage on ridge after cotton harvest in terms of vertical seed distribution, seeding depth, seedling emergence rate, working speed, field capacity and fuel consumption of planters. The commercial planters used for modification in the study were Ozdoken no-till planter (MORP) and Hassia conventional till planter (MHRP). The experimental results showed that the MORP planter placed 60% of the seeds at the targeted depth of about 4 cm, whereas more than 50% of the seeds were on the soil surface or near the surface and remained uncovered with soil with use of the MHRP planter. Use of the MORP resulted in a more uniform vertical seed distribution, higher emergence rate and higher working speed, field capacity and lower fuel consumption compared with use of the MHRP. The results suggest that the MORP planter may be successfully used to plant wheat on ridge without tillage after cotton."], ["https://openalex.org/W1520044237", "Rash Decisions—Reply", 1998, "article", 0, "Healthcare Systems and Challenges", null], ["https://openalex.org/W2992977501", "Prediction of Monthly Rainfall of Nainital Region using Artificial Neural Network (ANN) and Support Vector Machine (SVM)", 2015, "article", 5, "Hydrological Forecasting Using AI", "Artificial Neural Network (ANN) and Support Vector Machine (SVM) are the most widely used supervised techniques for data analysis and modeling. In this chapter we used the back propagation neural network model for predicting the average monthly rainfall of Nainital town based on wet bulb, dry bulb, minimum temperature, maximum temperature and wind speed in Nainital town. Our results show that the ANN techniques extremely well with the actual data values as compared to the SVM techniques. From these results we can predict the rainfall for the future."], ["https://openalex.org/W2002723459", "Extended theatre composition in telematized environments", 2007, "article", 0, "Theatre and Performance Studies", "In the pursuit of a dramaturgy of telematics as a compositional practice, the author builds a position on technology as externalized technique, develops a dramaturgic strategy with notions of an extended theatre practice and reports on a realized telematized performance where a practical implementation was explored. The theatrical site is viewed as a construct of attention, generated by the performers through the performance composition. The composition determines the audience experience, orchestrated by how the construction of the site manages their perspectives, and how the performers are situated in the consciousness site of the audience. In the performed event the performers articulate as a collective extended entity, incorporating the transformation of the performance site via the articulation strategies implemented in the staging. Telematics is argued to be a technology facilitating specific modes of thinking, generating specific modes of actions and presence, which enable new performance sites and new modes of situating performance."], ["https://openalex.org/W4290015113", "The Relationship Between Patterns of Massed and Distributive Clinical Practicum and Student Achievement", 1979, "article", 1, "Innovations in Medical Education", null], ["https://openalex.org/W4289997646", "On \"PROBLEMS\" with integrated curricula in nursing", 1978, "article", 0, "Organizational Learning and Leadership", "Curriculum development is many things; it is the study of impact on students, a process through which faculty are moving. It usually does not represent a final decision- like all issues in higher education it is altered as different people and issues arise. The integrated curriculum movement in nursing, while a seminal change, has in a way been like a shadow- incompletely described with lack of clarity about base for comparison. It seems to have become the mode for many schools to develop their own conceptual frameworks and curricular plans. While adaptation to the local setting is expected, one must question how much of the total development effort is necessary and due in part to lack of fully developed curriculum models and dissemination and not building systematically toward improvement in the field. In such a situation we all may be making the same mistakes. If these identified \"problems\" are indeed just that, they all are amenable to correction. Each solution will require hard conceptual work."], ["https://openalex.org/W4289950994", "PERSONAL GROWTH AND LEARNING OF STUDENTS IN AN OPEN-ENDED CLINICAL EXPERIENCE: A MOTIVATIONAL PHILOSOPHY", 1977, "article", 0, "Innovations in Medical Education", null], ["https://openalex.org/W4289995996", "the multiple assignment: An Effective Alternative For Laboratory Experiences", 1976, "article", 0, "Problem and Project Based Learning", "The purpose of the study was to test out the efficacy of both the Traditional and the Multiple Assignment approaches to the laboratory experiences of students of nursing. The subjects were 22 students enrolled in the first quarter of an Associate Degree Nursing Program and placed in either the multiple or the traditional laboratory assignment. Results showed the students in the peer experience to be superior in overall performance on tests of Nursing Knowledge, Concept Usage and Self-Esteem. It was concluded that the Multiple Assignment approach to laboratory experiences is a viable and useful method for the education of student nurses."], ["https://openalex.org/W4289970929", "STRATEGIES FOR DEALING WITH CONFLICT: USING CONFRONTATION", 1978, "article", 0, "Global Peace and Security Dynamics", null], ["https://openalex.org/W4289969501", "EVALUATING THE NONVERBAL COMMUNICATION SKILLS OF NURSING STUDENTS", 1977, "article", 3, "Communication in Education and Healthcare", "This study examined the accuracy rate of judging nonverbal skills used by nursing students in communicating with patients. Self-ratings of the students were compared with composite instructor ratings to find areas of disagreement regarding the quality of the nonverbal skills. Students who rated their nonverbal acuity higher than the instructors and students who rated their nonverbal acuity lower than the instructors were parceled out of the total sample of 92 senior nursing students enrolled in a baccalaureate program. Nonverbal acuity was measured by asking subjects to identify nonverbal information about emotional states from pictures. A November Picture Test consisting of 120 pictorial items was utilized as the dependent variable. Results showed that almost one half of the sample disagreed with the instructor rating applied to their nonverbal skills with patients. The differences between the groups was significant at the 0.05 level and the students were accurate in designating the direction of difference. Results are discussed in relation to clinical evaluation by both faculty and students in appraising communication skills. Implications such as grade inflation are discussed and recommendations for further study are covered."], ["https://openalex.org/W4289985850", "THE DIPLOMA SCHOOL OF NURSING: an option in post secondary education", 1977, "article", 0, "Interprofessional Education and Collaboration", null], ["https://openalex.org/W4290010872", "MANIFEST AND LATENT CONTENT IN COMMUNICATION: genesis of an instructional module in psychiatric nursing", 1978, "article", 0, "Health Education and Validation", null], ["https://openalex.org/W4289961403", "TEACHING STRATEGY AND LEARNER PERFORMANCE", 1979, "article", 0, "Organizational Learning and Leadership", null], ["https://openalex.org/W4289959768", "THE PROCESS OF DEVELOPING A NURSING INTERVENTION MODEL", 1979, "article", 1, "Health and Well-being Studies", null], ["https://openalex.org/W4289974231", "Introducing ethnic-cultural factors in models of nursing: some mental health care applications", 1976, "article", 0, "Cultural Competency in Health Care", null], ["https://openalex.org/W2899543086", "CITATION ANALYSIS ON THE EMERGING TECHNOLOGIES IN THE FIELDS OF INFORMATION SYSTEMS", 2018, "article", 0, "Big Data and Business Intelligence", "Even though information technology is an acceptable innovation for improvement of performance in all sectors, citation studies on associated literature seem to be missing. Furthermore, analysis of citations related to emerging technologies in these fields as cloud computing, virtual reality, mobile computing, e-learning, data mining and internet of things (IOT) seem to have received narrow attention. Citation analysis was carried out with objectives of determining authorship patterns, age distribution as well as keywords co-occurrence of the cited articles. A total of 3,123 citations appended to the reference section of 72 articles covering emerging ICT including cloud computing (10 articles), virtual reality 12 articles), mobile computing (13 articles), e-learning (12 articles), data mining (15 articles), and internet of things (10 articles) were analysed. Collaborative research among ICT scientists was revealed as two or more authors authored 60% of the articles followed by single authors (30%). Most cited sources in ICT systems are between 2010 and 2017 (58.5%). Customer behavior leads keywords in data mining: academic performance in e-learning; energy efficiency in IoT; computing infrastructure in mobile computing; data visualization in virtual reality and data integration in cloud computing."]], "total": 3401}</script></div><script>
const root = document.currentScript.previousElementSibling;
const {cols, rows, total} = JSON.parse(root.querySelector('script[type="application/json"]').textContent);
const URL_RE = /(https?:\/\/[^\s<>"']+)/g, LONG = 300;
let page = 0, size = 25;
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const linkify = s => esc(s).replace(URL_RE, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
function cell(v) {
  if (v === null) return '<span class="na">null</span>';
  const nested = typeof v === 'object';
  const s = nested ? JSON.stringify(v) : String(v);
  const cls = nested ? ' class="nested"' : '';
  if (s.length <= LONG) return `<div${cls}>${linkify(s)}</div>`;
  return `<details${cls}><summary>${linkify(s.slice(0, LONG))}…</summary>${linkify(s)}</details>`;
}
function render() {
  const pages = Math.max(1, Math.ceil(rows.length / size));
  page = Math.min(page, pages - 1);
  const slice = rows.slice(page * size, page * size + size);
  root.querySelector('tbody').innerHTML = slice.map(r => '<tr>' + r.map(v => `<td>${cell(v)}</td>`).join('') + '</tr>').join('');
  const first = rows.length ? page * size + 1 : 0, last = page * size + slice.length;
  root.querySelector('.info').textContent =
    `rows ${first}–${last} of ${rows.length.toLocaleString()} loaded` + (total === null ? ' (total unknown)' : ` · ${total.toLocaleString()} in table`);
  root.querySelector('.pg').textContent = `page ${page + 1} / ${pages}`;
  root.querySelector('.prev').disabled = page === 0;
  root.querySelector('.next').disabled = page >= pages - 1;
  root.querySelector('.wrap').scrollTop = 0;
}
root.querySelector('thead tr').innerHTML = cols.map(([n, short, full]) =>
  `<th title="${esc(n + ': ' + full)}">${esc(n)}<div class="t">${esc(short)}</div></th>`).join('');
root.querySelector('.prev').onclick = () => { page--; render(); };
root.querySelector('.next').onclick = () => { page++; render(); };
root.querySelector('.size').onchange = e => { size = +e.target.value; page = 0; render(); };
render();
</script>
