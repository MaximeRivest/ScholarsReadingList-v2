<script type="application/json">{"cols": [["id", "str", "Str"], ["doi", "str", "Str"], ["url", "str", "Str"], ["pdf_url", "str", "Str"], ["title", "str", "Str"], ["type", "str", "Str"], ["language", "str", "Str"], ["date", "date", "Date"], ["year", "int64", "Int64"], ["authors", "str", "Str"], ["author_orcids", "str", "Str"], ["corresponding_authors", "str", "Str"], ["institutions", "str", "Str"], ["countries", "str", "Str"], ["venue", "str", "Str"], ["publisher", "str", "Str"], ["issn", "str", "Str"], ["volume", "str", "Str"], ["issue", "str", "Str"], ["pages", "str", "Str"], ["abstract", "str", "Str"], ["keywords", "str", "Str"], ["topic", "str", "Str"], ["subfield", "str", "Str"], ["field", "str", "Str"], ["domain", "str", "Str"], ["mesh_terms", "str", "Str"], ["is_open_access", "bool", "Bool"], ["open_access_status", "str", "Str"], ["license", "str", "Str"], ["funders", "str", "Str"], ["grants", "str", "Str"], ["citations", "int64", "Int64"], ["references_count", "int64", "Int64"], ["references", "str", "Str"], ["is_retracted", "bool", "Bool"], ["updated_date", "datetime", "Datetime"]], "rows": [["https://openalex.org/W242331634", null, "https://www.aasv.org/shap/issues/v8n4/v8n4p169.pdf", null, "Evaluating the efficacy of boot baths in biosecurity protocols", "article", "en", "2000-07-01", 2000, "Sandra F. Amass | Bryan D. Vyverberg | Darryl Ragland | Carol A. Dowell | Cheryl D. Anderson | Jason H. Stover | Dwight J. Beaudry", "- | - | - | - | - | - | -", null, "Purdue University West Lafayette", "US", "Swine health and production", null, "1066-4963", "8", "4", "169–173", "Methods: Boots were contaminated using pig manure, then disinfected according to individual protocols. Five repetitions were performed for each treatment. A 75-mm2 (0.12-sq in) area was sampled from the bottom (sole) of each boot before and after treatment. Samples were diluted and cultured. Total bacterial counts per 75-mm2 sampling area were calculated. Mean bacterial counts before and after treatments were compared.", "Biosecurity | Boot camp | Manure | Sampling (signal processing) | Veterinary medicine | Animal science | Toxicology | Environmental science | Biology | Medicine | Agronomy | Computer science | Ecology", "Animal Disease Management and Epidemiology", "Agronomy and Crop Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 62, 1, "https://openalex.org/W2299200291", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W806595068", null, "http://yadda.icm.edu.pl/yadda/element/bwmeta1.element.agro-3b3566bd-f85e-40a6-8fc6-e5546527cee5", null, "Geographic variation in the echolocation calls of the hoary bat ( Lasiurus cinereus)", "article", "en", "2000-01-01", 2000, "Michael J. O’Farrell | Chris Corben | William L. Gannon", "- | - | -", null, null, null, "Acta Chiropterologica", "Museum and Institute of Zoology", "1508-1109", "02", "2", "185–195", "Use of bat detectors to perform inventories, determine activity, and assess differential use of habitats has become a generally accepted method. However, there has been vigorous disagreement as to the level of efficacy, primarily relating to the ability to distinguish certain species and groups of species. The primary explanation suggested for the inability to identify certain species is due to the magnitude of intraspecific variation resulting in overlap among species, presumably compounded by geographic variation. Lasiurus cinereus has been identified as exhibiting the greatest degree of geographic variation including recent findings of distinct variation between populations in Hawaii and Manitoba. We find that claims of geographic variation have not been proven because of small sample size and lack of adequate description of method, including the behavior of the bat and the context during which bats were recorded. Previous geographical comparisons of species have relied on standard statistical methods that do not allow a comprehensive examination of the range in variation of diagnostic call parameters. We present data from a broad range of sites throughout mainland United States and Hawaii, and compare a multivariate statistical approach with repertoire plots of characteristic frequency versus call duration. Although we demonstrated a statistical finding of geographic variation in L. cinereus, small sample size, context, and behavior could not be discounted as the proximal cause of observed variation. The perceived variation across the geographic range that we sampled did not affect our ability to identify the species by call structure. We suggest methods for future studies of geographic variation.", "Geographic variation | Human echolocation | Variation (astronomy) | Intraspecific competition | Range (aeronautics) | Context (archaeology) | Ecology | Habitat | Biology | Geography | Population | Demography", "Bat Biology and Ecology Studies", "Ecology, Evolution, Behavior and Systematics", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 58, 15, "https://openalex.org/W318666700 | https://openalex.org/W1196952822 | https://openalex.org/W1982416769 | https://openalex.org/W2008158484 | https://openalex.org/W2014659006 | https://openalex.org/W2020849006 | https://openalex.org/W2032756493 | https://openalex.org/W2041870919 | https://openalex.org/W2044275931 | https://openalex.org/W2052705660 | https://openalex.org/W2054401387 | https://openalex.org/W2092956609 | https://openalex.org/W2097543394 | https://openalex.org/W2163244483 | https://openalex.org/W2313273258", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2141579658", null, "https://krishi.icar.gov.in/jspui/handle/123456789/48913", null, "Breeding for drought tolerance in vegetables", "article", "en", "2012-06-01", 2012, "Rajesh Kumar | Shashank Shekhar Solankey | Major Singh", "https://orcid.org/0009-0009-6489-1715 | https://orcid.org/0000-0003-1398-1760 | https://orcid.org/0000-0002-0247-861X", null, null, null, "Vegetable Science", "Indian Society of Vegetable Science", "0970-6585", "39", "1", "1–15", "Drought or moisture stress is one of the most significant environmental stresses causing huge loss to the agriculture worldwide. Vegetables are more sensitive to drought as compare to many other crops. Improving yield under drought is a major goal of plant breeding. An understanding of genetic basis of drought tolerance is a pre-requisite for plant breeders to evolve superior genotype through conventional breeding methodology. Drought is often accompanied by relatively high temperatures, which promote evapotranspiration and affects photosynthetic kinetics, thus intensifying the effects of drought and further reducing crop yields. Traditionally, plant breeders have addressed the problem of environmental stress by selecting for suitability of performance over a series of environmental conditions using extensive testing and biometrical approaches. Progress requires the introduction of traits that reduce the gap between yield potential and actual yield in drought-prone environments. An attempt has been made in this review to compile the scattered information on concepts, genetics, and traditional breeding approaches of drought tolerance with suitable illustrations. A comprehensive list of genes responsible for drought and examples of species and genotypes of vegetables with drought tolerance has also been provided.", "Drought tolerance | Agriculture | Biology | Crop | Drought stress | Agronomy | Biotechnology | Plant breeding | Yield (engineering) | Environmental science | Ecology", "Genetics and Plant Breeding", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", null, null, null, 49, 121, "https://openalex.org/W80525436 | https://openalex.org/W142146521 | https://openalex.org/W145523877 | https://openalex.org/W154207515 | https://openalex.org/W234453341 | https://openalex.org/W290096613 | https://openal 77182", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2397183686", null, "https://www.cabdirect.org/cabdirect/abstract/20103289961", null, "Natural biological control of Ascia monuste by the social wasp Polybia ignobilis (Hymenoptera: Vespidae).", "article", "en", "2010-01-01", 2010, "Marcelo Coutinho Picanço | I. R. de Oliveira | Jander Fagundes Rosado | F. M. da Silva | Pablo da Costa Gontijo | Ricardo Siqueira da Silva", "https://orcid.org/0000-0002-1294-6210 | - | https://orcid.org/0000-0002-2052-9222 | - | https://orcid.org/0000-0001-8173-0539 | https://orcid.org/0000-0003-1837-1339", null, null, null, "Sociobiology", "State University of Feira de Santana", "0361-6525", "56", "1", "67–76", null, "Vespidae | Biology | Hymenoptera | Natural enemies | Biological pest control | Ecology | Zoology", "Plant and animal studies", "Ecology, Evolution, Behavior and Systematics", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", null, null, null, 41, 10, "https://openalex.org/W1551963447 | https://openalex.org/W1979242269 | https://openalex.org/W1990787366 | https://openalex.org/W1995682667 | https://openalex.org/W1998262184 | https://openalex.org/W2007736895 | https://openalex.org/W2030728854 | https://openalex.org/W2111045397 | https://openalex.org/W2329140158 | https://openalex.org/W2460408149", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2355518253", null, "https://en.cnki.com.cn/Article_en/CJFDTOTAL-HBNY201303004.htm", null, "Advances in Pharmacological Research of Eugenol", "article", "en", "2013-01-01", 2013, "Xiaojun Kong | Xiwang Liu | Jianyong Li | Yajun Yang", "- | https://orcid.org/0000-0002-6634-7184 | https://orcid.org/0000-0002-3245-6534 | https://orcid.org/0000-0001-9651-8549", null, "Lanzhou Institute of Husbandry and Pharmaceutical Sciences", "CN", "Hubei nongye kexue", "Chinese National Science and Technology", "0439-8114", null, null, null, "Summarya main constituent of clove oil, is an organic phenol with antipyretic, analgesic, anti-in!ammatory, and anesthetic eects. Pharmacological studies showed that eugenol also has antibacterial, antifungal, antioxidant, anticancer, and insect repellent activities. Given its minimal side eects, low toxicity, and non-metabolized residue, eugenol is widely accepted in many #elds such as pharmaceuticals and cosmetics. Further elucidation of the functional groups, action sites, and action model of eugenol, along with the establishment of related database, is expected to widen the applications of eugenol. This paper brie!y reviews the pharmacological eects of eugenol. Curr Opin Complement Alternat Med 2014; 1:8-11", "Eugenol | Antifungal | Chemistry | Antipyretic | Traditional medicine | Pharmacology | Analgesic | Toxicology | Biology | Medicine | Organic chemistry | Microbiology", "Essential Oils and Antimicrobial Activity", "Food Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 40, 20, "https://openalex.org/W54444533 | https://openalex.org/W72557861 | https://openalex.org/W1532778463 | https://openalex.org/W1975665688 | https://openalex.org/W1986147076 | https://openalex.org/W2000048292 | https://openalex.org/W2011492956 | https://openalex.org/W2017814854 | https://openalex.org/W2020570379 | https://openalex.org/W2035492025 | https://openalex.org/W2044927604 | https://openalex.org/W2066676302 | https://openalex.org/W2091831269 | https://openalex.org/W2092516681 | https://openalex.org/W2139635418 | https://openalex.org/W2158921004 | https://openalex.org/W2162621586 | https://openalex.org/W2165975639 | https://openalex.org/W2264032748 | https://openalex.org/W2400990495", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W857205807", null, "http://dergipark.gov.tr/tbtkbiology/issue/11741/140137", null, "In Vitro Inhibition of the Mycelial Growth of Some Root Rot Fungi by Rhizobium leguminosarum Biovar phaseoli Isolates", "article", "en", "2001-04-01", 2001, "İbrahim Özkoç | Muhammet Hanifi Deliveli", "https://orcid.org/0000-0001-8179-0961 | -", null, null, null, "DergiPark (Istanbul University)", "Istanbul University", null, "25", "4", "435–445", "In solid medium, the effects of twenty-three Rhizobium leguminosarum biovar phaseoli isolates on the mycelium development of the phytopathogenic fungi of three different genera (Fusarium oxysporum, Pythium ultimum and Rhizoctonia solani) were tested in vitro. The experiments were achieved by applying the superimpose dual culture technique. Most of the rhizobia tested inhibited the fungal development. The inhibition rates displayed differences in accordance with the bacteria and fungi isolates utilized. However, the inhibitory effect of the rhizobia occurred most on the isolates of Fusarium and Pythium species (up to 30.35% and 29.75% respectively) and least on those of Rhizoctonia species (16.03%). The most effective Rhizobium isolate on the three fungal species was Rhizobium leguminosarum Çar 9.3.2 isolate and percent inhibitions were 14.65-16.03 for R. solani isolates and 14.62-30.35 for P. ultimum isolates and also 14.58-29.75 for F. oxsporum isolates.", "Biology | Rhizoctonia solani | Pythium ultimum | Rhizoctonia | Biovar | Rhizobia | Fusarium solani | Rhizobium leguminosarum | Mycelium | Fusarium oxysporum | Rhizobium | Pythium | Microbiology | Pythium aphanidermatum | Botany | Rhizobiaceae | Bacteria | Horticulture | Biological pest control | Symbiosis | Inoculation", "Legume Nitrogen Fixing Symbiosis", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 38, 17, "https://openalex.org/W268722099 | https://openalex.org/W1554900651 | https://openalex.org/W1964979413 | https://openalex.org/W1974119162 | https://openalex.org/W1980901314 | https://openalex.org/W1993027883 | https://openalex.org/W2001344301 | https://openalex.org/W2014430381 | https://openalex.org/W2032978172 | https://openalex.org/W2034964865 | https://openalex.org/W2054219048 | https://openalex.org/W2063935010 | https://openalex.org/W2068874524 | https://openalex.org/W2104578344 | https://openalex.org/W2151482239 | https://openalex.org/W2276207078 | https://openalex.org/W2314234771", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2102059637", "https://doi.org/10.5897/ajmr10.607", "https://academicjournals.org/journal/AJMR/article-abstract/66445FE16743", null, "Isolation and characterization of antagonistic bacteria against fusarium wilt and induction of defense related enzymes in banana", "article", "en", "2011-03-04", 2011, "Jingguo Sun | Meng-Tzu Peng | Y. G. Wang | Pengwei Zhao | Qingbao Xia", "https://orcid.org/0009-0007-9837-6178 | - | - | https://orcid.org/0000-0001-7694-0494 | -", null, null, null, "African Journal of Microbiology Research", "Academic Journals", "1996-0808", "5", "5", "509–515", "Fusarium wilt caused by Fusarium oxysporum is considered a fatal disease to bananas.Chemical control of Fusarium wilt in bananas has received little efficiency. Alternatively, biological control is a viable strategy against soil-borne diseases. The objectives of this research were to isolate antagonistic bacteria and investigate the possible mechanisms against Fusarium wilt. An antagonistic Bacillus strain, termed KY-21 against F. oxysporumf. sp. Cubense was isolated from the soil of banana’s rhizosphere by dual culture. The strain was identified as Bacillus subtilis according to the characteristics of its morphology and by homology analysis of its 16S rDNA sequence. Mycelium growth of the pathogen was seriously inhibited after treatment with the fermentation filtrate of KY-21. Observation revealed that the tips of the hypha were deformed into spherical structures that were remarkably constricted. The strain KY-21 displayed a good ability to colonize and can transfer into banana tissues. The activities of polyphenol oxidase (PPO) and peroxidase (POD) in bananas showed an increase after inoculated with KY-21, compared to control.In vivo biocontrol assays showed a significant reduction in wilt index and vascular discoloration. These results indicated that the antagonistic mechanisms against Fusariumwilt were involved in the inhibition of mycelial growth and the improvement in activity of defense related enzymes.\r\n\r\n\t \r\n\r\n\tKey words: Fusarium oxysporum f. sp. Cubense, antagonistic bacteria, screen,colonization, enzyme activity.", "Fusarium wilt | Fusarium oxysporum | Mycelium | Biology | Rhizosphere | Bacteria | Fusarium oxysporum f.sp. cubense | Bacillus subtilis | Hypha | Microbiology | Fusarium | Biological pest control | Horticulture | Antagonism | Botany | Biochemistry", "Plant-Microbe Interactions and Immunity", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", null, null, null, 38, 17, "https://openalex.org/W1591377499 | https://openalex.org/W1969782560 | https://openalex.org/W1981598684 | https://openalex.org/W1986480471 | https://openalex.org/W1999412779 | https://openalex.org/W2019550835 | https://openalex.org/W2026632161 | https://openalex.org/W2032117787 | https://openalex.org/W2043695672 | https://openalex.org/W2049284261 | https://openalex.org/W2051745231 | https://openalex.org/W2053849422 | https://openalex.org/W2059993529 | https://openalex.org/W2082600375 | https://openalex.org/W2147221860 | https://openalex.org/W2163552585 | https://openalex.org/W2169230064", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2121329290", "https://doi.org/10.1043/0363-6445-28.2.452", "http://www.bioone.org/doi/10.1043/0363-6445-28.2.452", null, "Phylogenetics of the Antillean Goetzeoideae (Solanaceae) and Their Relationships within the Solanaceae based on Chloroplast and ITS DNA Sequence Data", "article", "en", "2009-01-24", 2009, "Eugenio Santiago‐Valentín | Richard G. Olmstead", "https://orcid.org/0000-0002-0713-3370 | https://orcid.org/0000-0001-7660-4159", null, "University of Puerto Rico System | University of Washington", "PR | US", "BioOne Complete (BioOne)", "BioOne", null, "28", "2", "452–460", "Abstract Coeloneurum, Espadaea, Henoonia, and Goetzea are shrubs and trees that are endemic to the islands of Cuba, Hispaniola, and Puerto Rico in the Greater Antilles. A phylogenetic analysis was conducted to elucidate the evolutionary relationships among them and with other major lineages of the Solanaceae. DNA sequences of the chloroplast genes ndhF, rbcL, and trnL-trnF intron and intergenic spacer were obtained for twenty two taxa and sequences of the nuclear rDNA ITS region were obtained for eight taxa comprising a data set of over 5,000 bp. The inferred phylogeny groups the Antillean genera together with the South American Metternichia and Duckeodendron in a clade within the Solanaceae, pointing to a broader circumscription of the Goetzeoideae. Both chloroplast and nuclear datasets find the following relationships among the Antillean taxa: (Coeloneurum (Henoonia (Espadaea, Goetzea))). The South American genera Metternichia and Duckeodendron are the first and second sister groups, respectively, to the Antillean genera. The close relationship of Metternichia to the Antillean genera also is supported by pollen morphology. Phylogenetic inference suggests that the Antillean taxa first occuppied xeric environments and evolved into more mesic habitats. Floral characteristics indicate evolution of pollination systems from nocturnal, insect-pollination in Duckeodendron and Metternichia to diurnal, bird-pollination in the Antillean genera. Duckeodendron and the Antillean genera produce drupes, but their contrasting morphology and anatomy suggest that these fruit types originated from separate evolutionary events.", "Biology | NdhF | Chloroplast DNA | Phylogenetics | Taxon | Botany | Phylogenetic tree | Character evolution | Pollination | Clade | Intergenic region | Zoology | Evolutionary biology | Pollen | Genome | Genetics", "Plant Diversity and Evolution", "Ecology, Evolution, Behavior and Systematics", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 37, 29, "https://openalex.org/W206550708 | https://openalex.org/W653360771 | https://openalex.org/W1968441571 | https://openalex.org/W1984836595 | https://openalex.org/W2023239949 | https://openalex.org/W2026182599 | https://openalex.org/W2057771577 | https://openalex.org/W2062924635 | https://openalex.org/W2071539591 | https://openalex.org/W2074517922 | https://openalex.org/W2077276679 | https://openalex.org/W2084182045 | https://openalex.org/W2097409539 | https://openalex.org/W2101321933 | https://openalex.org/W2106882534 | https://openalex.org/W2111445984 | https://openalex.org/W2120644786 | https://openalex.org/W2122766746 | https://openalex.org/W2129192242 | https://openalex.org/W2137986908 | https://openalex.org/W2138213161 | https://openalex.org/W2177605519 | https://openalex.org/W2187861658 | https://openalex.org/W2232562960 | https://openalex.org/W2345634004 | https://openalex.org/W2522536973 | https://openalex.org/W2594954214 | https://openalex.org/W2748384280 | https://openalex.org/W3213474547", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2105507089", "https://doi.org/10.5897/jmpr.9000981", "https://africaneditors.org/journal/JMPR/full-text-pdf/47555-129740", null, "Phytochemical analysis and antibacterial evaluation of the leaf stem bark and root of the African locust bean (Parkia biglobosa)", "article", "en", "2009-05-31", 2009, "Chinweizu Ejikeme Udobi | J. A. Onaolapo", "https://orcid.org/0000-0002-4076-8810 | -", null, null, null, "Journal of Medicinal Plants Research", "Academic Journals", "1996-0875", "3", "5", "338–344", "Antibacterial evaluation of the methanolic extract and aqueous fractions of the Leaf, Stem Bark and root of the African locust bean tree, Parkia biglobosa was carried out using the agar- well diffusion method. The extracts and their fractions were tested against two gram positive organisms – Staphylococcus aureus ATCC 25923 and Bacillus subtilis NCTC 8326B76 and two gram negative organisms–Escherichia coli ATCC 25922 and Pseudomonas aeruginosa ATCC-27853.  Results obtained confirmed a broad spectrum of activity as all the organisms used were inhibited by the extracts and their aqueous fractions at concentrations between 2.5 – 20 mg. Zones of clearing observed against S.aureus were more pronounced, distinct and wider than those against other organisms tested. It was closely followed by P. aeruginosa. Results of the Minimum Inhibitory Concentrations (MIC) test using the aqueous fractions showed that the MIC ranged from 1.562 - 25mg/ml. This confirms the high activity of the aqueous fraction of the methanolic extract of the stem bark (WS) against S.aureus ATCC 25923 and P. aeruginosa ATCC 27853. The WS showed higher activity than the aqueous fraction of the methanolic extract of the leaf (WL) and the aqueous fraction of the methanolic extract of the root (WR). When the extracts were screened for secondary metabolites, tannins, flavonoids and saponins were detected among others. This was further confirmed by the aqueous fractions. These secondary metabolites are most likely responsible for the observed activity of the plant parts. Results obtained in this work justify the medicinal uses to whichP. biglobosa parts have been employed traditionally in recipes for infection.\r\n\r\n\t \r\n\r\n\tKey words:  Antibacterial evaluation, parkia biglobosa, aqueous fraction, minimum inhibitory concentration, secondary metabolite.", "Parkia biglobosa | Phytochemical | Antibacterial activity | Chemistry | Bark (sound) | Traditional medicine | Minimum inhibitory concentration | Food science | Botany | Biology | Locust | Bacteria | Antimicrobial | Biochemistry | Organic chemistry", "African Botany and Ecology Studies", "Forestry", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", null, null, null, 36, 11, "https://openalex.org/W1518708747 | https://openalex.org/W1843092503 | https://openalex.org/W1966623398 | https://openalex.org/W1970947068 | https://openalex.org/W2000370101 | https://openalex.org/W2002192739 | https://openalex.org/W2021115230 | https://openalex.org/W2057225006 | https://openalex.org/W2105064539 | https://openalex.org/W2110837175 | https://openalex.org/W2313860644", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2099007928", "https://doi.org/10.5897/ajar12.2123", "http://eprints.icrisat.ac.in/12232/", null, "Sorghum production for food security: A socio-economic analysis of sorghum production in Nakuru County, Kenya", "article", "en", "2013-12-03", 2013, "Robert Moracha Ogeto | Erick K. Cheruiyot | Patience Mshenga | Charles Nyambane Onyari", "- | https://orcid.org/0000-0003-2868-5972 | - | https://orcid.org/0000-0002-2004-9579", null, null, null, "African Journal of Agricultural Research", "Academic Journals", "1991-637X", "8", "47", "6055–6067", "Kenya’s Vision 2030 identifies agriculture as one of the key sectors to deliver sustainable economic growth and improved livelihoods for the poor in the rural areas. However, the sector continues to face several endemic and emerging constraints that require special attention. During the first two decades after independence, Kenya’s economy grew at an average rate of 6 percent per year and this was substantially driven by a robust agriculture sector. However, until about five years ago, the overall economy barely grew, partly as a result of a decline in agricultural activities. The agriculture sector continues to face challenges in production due to frequent and prolonged drought hence the need for drought resistant crops like sorghum. The utility of sorghum is in its climatic adaptability and household as well as industrial use. However, there is a remarkably low production as well as consumption among Kenyan communities against the food security challenges. This paper provides insights into the socio-economic characteristics of farmers and the factors that influence their participation in its production. Simple random and snowball sampling methods were applied in collecting data from 207 farmers using a questionnaire. Data collected was analyzed using the double hurdle model. Of the factors under study, only land tenure, gender, farm size and educational level were significantly influencing sorghum production in the study area. It was recommended that more women should be encouraged to participate in sorghum production as it was found that they participated in sorghum production more than men.\r\n\r\n\t \r\n\r\n\tKey words: Sorghum production, development, food security, Nakuru County.", "Food security | Sorghum | Agriculture | Snowball sampling | Livelihood | Business | Production (economics) | Agricultural productivity | Geography | Agricultural economics | Consumption (sociology) | Agricultural science | Socioeconomics | Economics | Forestry | Environmental science", "Agriculture and Rural Development Research", "Ecology, Evolution, Behavior and Systematics", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", null, null, null, 33, 11, "https://openalex.org/W47641486 | https://openalex.org/W1512375367 | https://openalex.org/W1831713570 | https://openalex.org/W2114268039 | https://openalex.org/W2116928493 | https://openalex.org/W2131274311 | https://openalex.org/W2153807830 | https://openalex.org/W2231700719 | https://openalex.org/W2263886266 | https://openalex.org/W2725898430 | https://openalex.org/W2734052717", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2982221125", "https://doi.org/10.5897/jmpr.9000149", "https://academicjournals.org/journal/JMPR/article-abstract/2154DE519790", null, "Antifungal properties of Allium ursinum L. ethanol extract", "article", "en", "2011-05-18", 2011, "Marcel Pacirc | rvu | Alina E. Pacirc | Laurian Vlase | Oana Roca-Casian | Ovidiu Pacirc", "- | - | - | https://orcid.org/0000-0002-0664-3387 | - | -", null, null, null, "Journal of Medicinal Plants Research", "Academic Journals", "1996-0875", "5", "10", "2041–2046", "Allicin analysis of Allium ursinum L. flower and leaf ethanol extracts by LC/MS and in vitrogermination and growth inhibition effects on Aspergillus niger, Botrytis cinerea, Botrytis paeoniae, Fusarium oxysporum f.sp. tulipae, Penicillium gladioli, and Sclerotinia sclerotiorum were performed. The antifungal activity of the flower extract was stronger than that of the leaf extract, and this was correlated with a higher allicin content.\r\n\r\n\t \r\n\r\n\tKey words: Allium ursinum, allicin, antifungal, flower extract, leaf extract.", "Allicin | Botrytis cinerea | Fusarium oxysporum | Sclerotinia sclerotiorum | Allium | Antifungal | Botany | Aspergillus niger | Biology | Chemistry | Traditional medicine | Horticulture | Food science | Microbiology | Medicine", "Garlic and Onion Studies", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", null, null, null, 32, 11, "https://openalex.org/W60082815 | https://openalex.org/W1774180207 | https://openalex.org/W1969740484 | https://openalex.org/W1977817793 | https://openalex.org/W1984459459 | https://openalex.org/W2024432046 | https://openalex.org/W2035751089 | https://openalex.org/W2037926033 | https://openalex.org/W2073625204 | https://openalex.org/W2100811652 | https://openalex.org/W2112142733", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W855216702", null, "http://journals.tubitak.gov.tr/agriculture/issues/tar-05-29-2/tar-29-2-2-0404-1.pdf", null, "Role of Conventional Plant Breeding and Biotechnology in Future Wheat Production", "article", "en", "2005-02-01", 2005, "Sanjaya Rajaram", "-", "Sanjaya Rajaram", null, null, "TURKISH JOURNAL OF AGRICULTURE AND FORESTRY", "Scientific and Technological Research Council of Turkey (TUBITAK)", "1300-011X", "29", "2", "105–111", "The global wheat production by year 2020 could be increased by 40% provided there is a good integrated multidisciplinary wheat research program optimally funded by either public or private sectors. More emphasis needs to be placed on: 1) Improving yield potential; 2) Durable disease resistance; 3) Increasing abiotic stress tolerance; 4) Adopting better conservation systems. There are roles for both conventional plant breeding and biotechnology supported by other disciplines to achieve this goal.", "Biotechnology | Abiotic stress | Production (economics) | Multidisciplinary approach | Plant production | Abiotic component | Plant breeding | Agronomy | Biology | Plant disease resistance | Yield (engineering) | Business | Agroforestry | Political science | Ecology | Economics", "Wheat and Barley Genetics and Pathology", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 30, 14, "https://openalex.org/W182128310 | https://openalex.org/W1531889198 | https://openalex.org/W1555124973 | https://openalex.org/W1564063889 | https://openalex.org/W1980178017 | https://openalex.org/W1996875712 | https://openalex.org/W2022279741 | https://openalex.org/W2038869176 | https://openalex.org/W2086670366 | https://openalex.org/W2144105170 | https://openalex.org/W2164798329 | https://openalex.org/W2259133480 | https://openalex.org/W2761242905 | https://openalex.org/W3138717593", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W828663085", null, "https://journals.tubitak.gov.tr/agriculture/issues/tar-03-27-6/tar-27-6-4-0305-13.pdf", null, "Comparison of the Performance of Autumn and Spring Sowing of Chickpeas in a Temperate Region", "article", "en", "2003-06-01", 2003, "Saim Özdemir", "https://orcid.org/0000-0002-0549-0577", "Saim Özdemir", null, null, "TURKISH JOURNAL OF AGRICULTURE AND FORESTRY", "Scientific and Technological Research Council of Turkey (TUBITAK)", "1300-011X", "27", "6", "345–352", "The effects of autumn and spring sowing on chickpea yield were investigated by examining yield components in a 2-year (2000-2001 and 2001-2002 growing seasons) field experiment in a temperate region, in north-west Turkey. Twenty-one chickpea genotypes (2 registered varieties of winter type for the Mediterranean region and 19 breeding lines) were evaluated in 2 sowing seasons (autumn and spring). Autumn-sown crops were subjected to -2.1 °C and snow cover twice (2 and 4 days) in the first year and -7.6 °C and snow cover 3 times (8, 14 and 6 days) in the second year. All genotypes were resistant to cold at the seedling stage, but 2 lines (FLIP 98-33C and FLIP 98-86C) were affected by a late cold spell at the late vegetative stage and their yields were reduced in the 2000-2001 season. Environmental conditions were favourable for Ascochyta blight infestation, but there was no incidence of blight in either year or at any sowing time. The longer growing period of autumn-sown chickpeas affected positively characters contributing to yield such as plant height, branches per plant, pods per plant, pod bearing shoot length and 100-seed weight, which in turn contributed to increased seed yield. Averaged over the 2 years, the autumn-sown crop produced 102% (1642 kg ha-1) more seed yield than the spring-sown crop. Stepwise regression of seed yield with characters contributing to yield were not consistent and estimated less than half of the whole effects. However, days to maturity, 100 seed weight and days to flowering were important for autumn sowing and days to flowering, 100-seed weight, plant height and days to maturity were important for the spring-sown crops.", "Sowing | Biology | Agronomy | Seedling | Blight | Crop | Temperate climate | Infestation | Growing season | Shoot | Yield (engineering) | Mediterranean climate | Horticulture | Botany", "Genetic and Environmental Crop Studies", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 29, 14, "https://openalex.org/W48613389 | https://openalex.org/W1781283682 | https://openalex.org/W1975826905 | https://openalex.org/W1981624709 | https://openalex.org/W1985826106 | https://openalex.org/W1996678820 | https://openalex.org/W2029259912 | https://openalex.org/W2092870480 | https://openalex.org/W2105330695 | https://openalex.org/W2124590820 | https://openalex.org/W2137081714 | https://openalex.org/W2151994484 | https://openalex.org/W2158390655 | https://openalex.org/W2189328735", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W135135726", null, "http://www.aup.edu.pk/sj_pdf/004%20article%2058-2011%20-%20(IDENTIFICATION%20OF%20DROUGHT).pdf", null, "Identification of drought tolerant wheat genotypes based on seedling traits.", "article", "en", "2013-01-01", 2013, "Mushtaq Ahmad | Ghulam Shabbir | Nasir Mehmood Minhas | Muhammad Kausar Nawaz Shah", "- | https://orcid.org/0000-0002-5495-8850 | https://orcid.org/0000-0001-8177-4355 | -", null, null, null, "Sarhad Journal of Agriculture", "ResearchersLinks Ltd", "1016-4383", "29", "1", "21–27", "Drought significantly reduces yield of many crop plants including wheat in the world. Identification of wheat genotypes that can thrive on limited water is vital to boost the wheat production of rainfed areas. Forty wheat genotypes were screened for drought tolerance using 0, 7.5, 15 and 22.5% Polyethylene Ethylene Glycol 6000 solutions at PMAS Arid Agriculture University, Rawalpindi, Pakistan during 2009-10. Data were recorded on various seedling parameters like germination percentage, germination rate index, root length, shoot length, coleoptile length and seedling vigor. The seedling traits showed a decreasing trend in response to increased concentrations of PEG 6000. Wheat genotype Lyalpur-73 was found the best for germination percentage (87.5). The genotypes C-591 had maximum germination rate index (2.4). Wheat genotypes Pasban 90 and WC-18 possessed maximum root length (9.9) and seedling vigor (7.4) respectively. The genotype Auqab-2000 showed maximum shoot length (8.3). Wheat genotypes Pak-81 along with CB 335 had maximum coleoptile length (1.9). Germination percentage and germination rate index showed positive correlation with all other traits. Root length showed positive association with shoot length and coleoptile length. While shoot length had positive correlation with coleoptile length and seedling vigour.", "Coleoptile | Seedling | Germination | Shoot | Biology | Agronomy | Drought tolerance | Horticulture | Crop | Botany", "Genetics and Plant Breeding", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 27, 17, "https://openalex.org/W53742379 | https://openalex.org/W194979830 | https://openalex.org/W1528295077 | https://openalex.org/W2007980669 | https://openalex.org/W2014134050 | https://openalex.org/W2015363917 | https://openalex.org/W2032208981 | https://openalex.org/W2050997219 | https://openalex.org/W2051040054 | https://openalex.org/W2054797258 | https://openalex.org/W2059400099 | https://openalex.org/W2148416453 | https://openalex.org/W2151071154 | https://openalex.org/W2156031781 | https://openalex.org/W2186350550 | https://openalex.org/W2340525097 | https://openalex.org/W2460051920", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2478279927", null, "https://www.ijpbs.net/details.php?article=2021", null, "ENCAPSULATION OF INDONESIAN PROPOLIS BY CASEIN MICELLE", "article", "en", "2013-01-01", 2013, "Muhamad Sahlan", "https://orcid.org/0000-0001-6360-3691", "Muhamad Sahlan", null, null, "International Journal of Pharma and Bio Sciences", "Ubitech Solutions", "0975-6299", null, null, null, "Propolis is strong adhesive material with one of most valuable bees product and has wide range of biological activities such as antibacterials, antiviruses, antifungals, anti� inflammation, photoprotector and so on. Propolis has been aplied as antimicrobials agent in food and healtcare products. To improve handling properties, Indonesian propolis were encapsulated by casein micelle with a homogenizer followed a sonication,", "Propolis | Chemistry | Sonication | Micelle | Food science | Casein | Traditional medicine | Business | Chromatography | Organic chemistry | Medicine", "Bee Products Chemical Analysis", "Insect Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 26, 19, "https://openalex.org/W1928975417 | https://openalex.org/W1971895399 | https://openalex.org/W1975916943 | https://openalex.org/W1978396261 | https://openalex.org/W1984228207 | https://openalex.org/W1998712545 | https://openalex.org/W2004818305 | https://openalex.org/W2008319673 | https://openalex.org/W2013274394 | https://openalex.org/W2063854853 | https://openalex.org/W2064377543 | https://openalex.org/W2065116304 | https://openalex.org/W2067720827 | https://openalex.org/W2079789582 | https://openalex.org/W2087785176 | https://openalex.org/W2100127662 | https://openalex.org/W2106049963 | https://openalex.org/W2137137814 | https://openalex.org/W2423750299", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2132584644", "https://doi.org/10.5897/jene.9000002", "https://academicjournals.org/journal/JENE/article-abstract/0BA55AA9620", null, "Threats and conservation strategies for the African cherry (Prunus africana) in its natural range - a review.", "article", "en", "2011-04-30", 2011, "Luke Jimu", "https://orcid.org/0000-0002-4651-001X", "Luke Jimu", null, null, "Journal of Ecology and the Natural Environment", "Academic Journals", "2006-9847", "3", "4", "118–130", "The world’s Prunus africana bark demand used to be satisfied by exports, approximately 4000 tonnes per year from a few African countries, led by Cameroon exporting 62%, Madagascar, 20% and Uganda and Equatorial Guinea, 7% each. This coupled with unsustainable bark harvesting methods created pressure on the natural resource which suffered population decline and resulted in the species listing in Appendix II of CITES and EU’s bark export ban. In other range countries where no commercial harvesting has taken place, the species is under threat from other anthropogenic threats which include local use, deforestation and habitat fragmentation which is affecting populations in Ethiopia, Madagascar, Zimbabwe and South Africa as well as Cameroon, Uganda and Equatorial Guinea. Wildfires burn P. africana seedlings, saplings and mature trees throughout the species’ range every year. Invasive alien species have mainly affected P. africanapopulations in Zimbabwe and South Africa. Climate change is projected to affect populations in southern Africa and Madagascar than those in East and West Africa. The fact that the threats vary or are common among countries calls for different or similar P. africana conservation strategies respectively. Strategies may vary from country to country or region to region depending on the type and magnitude of threats. These strategies include in situ, circa situ and ex situ conservation. In this paper, the various threats to P. africana populations across the species’ natural range are investigated together with the conservation strategies which can be put in place to ensure sustainability.\r\n\r\n\t \r\n\r\n\tKey words: Threat, climate change, habitat fragmentation, endangered species, conservation strategies, commercial harvesting, forest management, international regulation.", "CITES | Geography | Deforestation (computer science) | Endangered species | Agroforestry | Habitat destruction | Habitat fragmentation | Climate change | Population | Range (aeronautics) | Habitat | In situ conservation | Natural resource | Endemism | Ecology | Biology", "African Botany and Ecology Studies", "Forestry", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 26, 29, "https://openalex.org/W33638128 | https://openalex.org/W290191524 | https://openalex.org/W575092410 | https://openalex.org/W1525888264 | https://openalex.org/W1551067432 | https://openalex.org/W1560511508 | https://openalex.org/W1782844326 | https://openalex.org/W1972444442 | https://openalex.org/W1987347652 | https://openalex.org/W2020088870 | https://openalex.org/W2035634175 | https://openalex.org/W2040611338 | https://openalex.org/W2046404401 | https://openalex.org/W2048444291 | https://openalex.org/W2068641397 | https://openalex.org/W2096684096 | https://openalex.org/W2113564400 | https://openalex.org/W2118291315 | https://openalex.org/W2120441014 | https://openalex.org/W2144344137 | https://openalex.org/W2148440298 | https://openalex.org/W2158943106 | https://openalex.org/W2164816034 | https://openalex.org/W2181616336 | https://openalex.org/W2256806903 | https://openalex.org/W2487711965 | https://openalex.org/W2566259135 | https://openalex.org/W2886718005 | https://openalex.org/W3204146976", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2107529171", null, "http://www.world-food.net/download/journals/2010-issue_2/a71.pdf", null, "Growth and yield of grafted cucumber (Cucumis sativus L.) on different soilless substrates", "article", "en", "2010-01-01", 2010, "Nina Kacjan Maršić | Marijana Jakše", "https://orcid.org/0000-0001-7400-4897 | -", null, null, null, "Journal of Food Agriculture & Environment", "WFL Publisher", null, "8", "2", "654–658", "Grafting of cucurbits has a role to play, especially in controlled environment vegetable production and many rootstocks have been selected to improve resistance to different stressed conditions, such as low soil temperature, lacking of minerals, as well as soil salinity and flooding. In greenhouse soilless culture is the most intensive and effective form of cultivation, which offers significant advantages, such as elimination of soil-borne diseases and enabling the successful cultivation of vegetables on unproductive degraded soil. The objective of this study was to assess the effects of different soilless substrates (perlite and expanded clay pellets) on yield and development of grafted and ungrafted cucumber (Cucumis sativus L.) in summer 2006, and in summer 2007, to evaluate the effect of 3 rootstocks on growth and yield of cucumber, grown in perlite. Both years hybrid cultivar of salad cucumber Edona was used as a scion and 3 interspecific hybrids (Cucurbita maxima Duchesne ex Lam. × Cucurbita moschata Duchesne ex Poir.): RS 841 (both years), Cirrus and Nimbus (in 2007), were used as rootstocks. In the first experiment, growth of cucumbers was significantly better in perlite than in expanded clay pellets, where the marketable yield was in average for 30% higher (7.9 kg plant -1 in perlite; 6.1 kg plant -1 in clay pellets). Grafted plants had a larger stem diameter, bigger root system and higher yield than ungrafted plants. In the second experiment, marketable yield of grafted cucumber plants was significantly higher only with rootstock RS 841 F1 (5.72 kg plant -1 ), while yields of plants grafted onto Cirrus F1 (5.00 kg plant-1) and Nimbus F1 (5.15 kg plant-1) were higher than the control (ungrafted plants), but the differences were not significant. Grafting did not affect fruit weight neither in the first nor in the second experiment.", "Perlite | Rootstock | Cucumis | Cucurbita moschata | Horticulture | Agronomy | Hydroponics | Cultivar | Biology", "Plant Disease Management Techniques", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 26, 23, "https://openalex.org/W1030079647 | https://openalex.org/W1505867985 | https://openalex.org/W1519719917 | https://openalex.org/W1859145917 | https://openalex.org/W1971691385 | https://openalex.org/W1982560194 | https://openalex.org/W1985968098 | https://openalex.org/W2038154666 | https://openalex.org/W2040579288 | https://openalex.org/W2095334263 | https://openalex.org/W2112377494 | https://openalex.org/W2146103508 | https://openalex.org/W2157012478 | https://openalex.org/W2167601326 | https://openalex.org/W2171281599 | https://openalex.org/W2186129372 | https://openalex.org/W2277365422 | https://openalex.org/W2320681002 | https://openalex.org/W2590128776 | https://openalex.org/W2590418489 | https://openalex.org/W2590476585 | https://openalex.org/W2796217544 | https://openalex.org/W2904315173", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2120894774", null, "http://www.thejaps.org.pk/docs/v-23-2/32.pdf", null, "Efficiency analysis of Boro rice production in north-central region of Bangladesh.", "article", "en", "2013-01-01", 2013, "Farhana Nargis | Sunbae Lee", "- | -", null, "Sunchon National University", "KR", "The Journal of Animal and Plant Sciences", "ELEWA BIOSCIENCES, F.a.C.T.LTD", "1018-7081", "23", "2", "527–533", "Data envelopment analysis (DEA) has been widely used in agricultural production efficiency analysis in recent years. Based on the existing state of DEA technology, this paper estimates technical, allocative, economic , and scale efficiency using field-level survey data from a sample of 199 Boro rice farmers in north-central part of Bangladesh for the year of 2010. The results of the study reveal ed that on average, the farms technical, allocative, economic , and scale efficiencies were 0.93, 0.82, 0.69, and 0.90 respectively. Their existing technical, allocative, economic and scale inefficiencies were 7%, 18%, 31%, and 10%, respectively. In addition, a second stage Tobit regression show ed that the variation was also related to farm-specific attributes such as education, family size, seed type, land tenancy, extension services, irrigation machine type, and sources of energy. Although tremendous development has been achieved in crop production in Bangladesh, the evidence suggests that farmers in Bangladesh fail to exploit the full potential of technology, and that input uses might be reduced through the adaptation and spread of improved agricultural mechanization. Farmers in Bangladesh would also benefit from making sure that a better supply of elect ricity is delivered to them, and being exposed to new varieties of rice which would be more efficient to grow in their particular conditions .", "Allocative efficiency | Agricultural science | Data envelopment analysis | Agricultural economics | Production (economics) | Tobit model | Agriculture | Mechanization | Scale (ratio) | Business | Economics | Geography | Mathematics | Environmental science | Statistics | Econometrics", "Agricultural Economics and Practices", "General Agricultural and Biological Sciences", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 25, 23, "https://openalex.org/W30213349 | https://openalex.org/W1534361917 | https://openalex.org/W1971053919 | https://openalex.org/W1975619363 | https://openalex.org/W1979081320 | https://openalex.org/W2036800816 | https://openalex.org/W2043425503 | https://openalex.org/W2044024227 | https://openalex.org/W2075396557 | https://openalex.org/W2076452041 | https://openalex.org/W2089941848 | https://openalex.org/W2129763896 | https://openalex.org/W2139726326 | https://openalex.org/W2140176110 | https://openalex.org/W2169930419 | https://openalex.org/W2171700343 | https://openalex.org/W2172139313 | https://openalex.org/W2286413386 | https://openalex.org/W2290949208 | https://openalex.org/W2336342008 | https://openalex.org/W2609069893 | https://openalex.org/W2921360559 | https://openalex.org/W3200006645", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W231361736", null, "https://www.researchgate.net/profile/Krzysztof_Polewski/publication/26552235_Synthesis_and_properties_of_model_humic_substances_derived_from_gallic_acid/links/0deec529c6988386ba000000.pdf", null, "Synthesis and properties of model humic substances derived from gallic acid", "article", "en", "2007-01-01", 2007, "Danuta Sławińska | Krzysztof Polewski | P. Rolewski | J. Slawidski", "- | https://orcid.org/0000-0003-0445-7721 | - | -", null, null, null, "International Agrophysics", "De Gruyter Open", "0236-8722", "21", "2", "199–208", "A b s t r a c t. A model humic acid (HA) was synthesized from a strong natural antioxidant, 3,4,5-trihydroxybenzoic acid (gallic acid-GA), in a slow oxidative polymerization/condensation reaction catalysed by OH- at pH ca. 8. The resulting dark-brown product (HAG), acidified to pH ca. 2, did not precipitate from the reaction solution and it was isolated and purified by dialysis. Its physicochemical and spectroscopic properties, as determined by means of elemental analysis, high performance liquid chromatography (HPLC), Fourier transform infra red (FTIR), ultraviolet-visible (UV-VIS), fluorescence and electron paramagnetic resonance (EPR) spectroscopy, showed a close resemblance to natural humic substances. The antioxidative activity of HAG was assayed by quenching of chemiluminescence of lucigenin and compared to that of standard antioxidants. The similarity and differences between HAG and natural humic substances and the role of the HAG antioxidative activity are discussed.", "Chemistry | Gallic acid | Humic acid | High-performance liquid chromatography | Nuclear chemistry | Fourier transform infrared spectroscopy | Antioxidant | Electron paramagnetic resonance | Polymerization | Elemental analysis | Chromatography | Organic chemistry", "Lichen and fungal ecology", "Ecology, Evolution, Behavior and Systematics", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 25, 12, "https://openalex.org/W160517887 | https://openalex.org/W241260329 | https://openalex.org/W1718729465 | https://openalex.org/W1983336384 | https://openalex.org/W1990766298 | https://openalex.org/W1991186740 | https://openalex.org/W2001304215 | https://openalex.org/W2035535801 | https://openalex.org/W2051719418 | https://openalex.org/W2090635913 | https://openalex.org/W2092060731 | https://openalex.org/W2149283213", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2161724221", "https://doi.org/10.5897/ajar.9000551", "http://hdl.handle.net/2078.1/36337", null, "Potential of Anisopteromalus calandrae (Hymenoptera: Pteromalidae) as biocontrol agent of Callosobruchus maculatus (F.) (Coleopetera: Bruchidae)", "article", "en", "2007-04-30", 2007, "T. S. L. Ngamo | H. Kouninki | Y. D. Ladang | Martin Benoît Ngassoum | P. M. Mapongmestsem | Thierry Hance", "- | - | - | - | - | https://orcid.org/0000-0001-5569-5020", null, null, null, "DIAL (Catholic University of Leuven)", "KU Leuven", null, "2", "4", "168–172", "The bruchid Callosobruchus maculatus (F.) (Coleopetera: Bruchidae) is a major pest of stored cowpea Vigna unguiculata (Walp.) in Africa and particularly in northern Cameroon. Anisopteromalus calandrae (Hymenoptera: Pteromalidae) parasitoid of its larval stages, could be used in the biological control of this grain pest. In field conditions, 5 months samples in small holder granaries established the phenological relationship between this parasitoid and its host. Large amount of A. calandrae may efficiently control C. maculatus infestations. Laboratory assays made an evidence of the preference of A. calandrae to parasitise 4th instar larvae of C. maculatus. To estimate the suitable density of the infesting population of parasitoid, other experiments pointed out that one mated female induced reduction of 4.97% of emergence of C. maculatus while 4 females performed more. The reduction of emergence observed was 42.34%. In suitable density, A. calandrae may play an important role in the biological control of C. maculatus on cowpea during storage.", "Pteromalidae | Callosobruchus maculatus | Parasitoid | Biology | Hymenoptera | Biological pest control | PEST analysis | Callosobruchus chinensis | Vigna | Toxicology | Horticulture | Ecology | Zoology", "Insect Pest Control Strategies", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", "other-oa", null, null, 23, 9, "https://openalex.or ibility Pattern Of Salmonella Isolates From Chennai, India", "article", "en", "2011-01-01", 2011, "Muthu Gopal | Arumugam Suresh | Gnadesikan Sumathy And Ramesh Srivani", "https://orcid.org/0000-0001-5460-6575 | https://orcid.org/0000-0001-6247-1156 | -", null, null, null, "International Journal of Pharma and Bio Sciences", "Ubitech Solutions", "0975-6299", "2", "2", "435–442", "Typhoid fever is a major health problem as the causative agent Salmonella enterica serovar typhi and paratyphi A has developed resistance to many antimicrobial agents. The study was undertaken to find out the antimicrobial susceptibility pattern of Salmonella isolates. We have studied 176 Salmonella isolates - 172 blood isolates, 3 stools isolates and one isolate from bone marrow. Antimicrobial susceptibility testing was done by disc diffusion method and MIC by agar dilution method. Out of 176 Salmonella isolates, 133 were S. typhi, 41 were S.paratyphi A and 2 were S.typhimurium.  98.5% of S.typhi and 92.7% of S.paratyphi A were resistant to nalidixic acid by MIC studies. 95.5% S.typhi and 97.6% of S.paratyphi A were found to have reduced susceptibility (0.125-0.5µg/ml) by MIC studies as reported earlier. As per CLSI standard MIC value of ≤ 1µg/ml is taken as sensitive, ≥ 4µg/ml is taken as resistance for Salmonella isolates.", "Salmonella typhi | Nalidixic acid | Salmonella | Microbiology | Antimicrobial | Typhoid fever | Biology | Agar dilution | Salmonella enterica | Serotype | Agar | Virology | Antibiotic resistance | Minimum inhibitory concentration | Antibiotics | Bacteria | Escherichia coli", "Salmonella and Campylobacter epidemiology", "Food Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 23, 15, "https://openalex.org/W1498804420 | https://openalex.org/W1501433016 | https://openalex.org/W1833207062 | https://openalex.org/W1965863367 | https://openalex.org/W1976842500 | https://openalex.org/W1982492505 | https://openalex.org/ triglyceride, total cholesterol, high-density lipoprotein (HDL) and low-density lipoprotein (LDL) of cholesterol were determined. The results show that supplementing 5 g/kg savory improved body weight of broilers at days 14, 28 and 42 but differences did not show statistical significance. Feed intake and feed conversion ratio (FCR) index were not markedly affected by dietary treatments. Internal organ weights and carcass characteristics were not significantly influenced by the dietary treatments at day 42. The use of 5 g/kg savory powder led to the highest antibody titers against SRBC as compared to other groups (P<0.05). The serum biochemical parameters were not affected by dietary treatments. The results suggest that dietary inclusion of 5 g/kg savory can be applied as alternatives to in-feed antibiotics for broiler diets.\r\n\r\n\t \r\n\r\n\tKey words: Broiler, growth performance, immunity, Satureja hortensis L., biochemical parameters.", "Broiler | Biology | Triglyceride | Animal science | Antibody titer | Cholesterol | High-density lipoprotein | Immune system | Titer | Food science | Antibody | Endocrinology | Immunology", "Animal Nutrition and Physiology", "Animal Science and Zoology", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", null, null, null, 22, 21, "https://openalex.org/W184240314 | https://openalex.org/W284486779 | https://openalex.org/W1440367609 | https://openalex.org/W1964018079 | https://openalex.org/W1966129015 | https://openalex.org/W1991838157 | https://openalex.org/W2023442814 | https://openalex.org/W2030156827 | https://openalex.org/W2033089939 | https://openalex.org/W2051869756 | https://openalex.org/W2058688824 | https://openalex.org/W2078066104 | https://openalex.org/W2085646661 | https://openalex.org/W2095079282 | https://openalex.org/W2122900297 | https://openalex.org/W2123900333 | https://openalex.org/W2126027079 | https://openalex.org/W2131670325 | https://openalex.org/W2147759190 | https://openalex.org/ "Polish Academy of Sciences", "1505-2249", "53", "3", "451–458", null, "Pinus brutia | Homoptera | PEST analysis | Biology | Botany | Woody plant | Horticulture | Pinus <genus>", "Research on scale insects", "Insect Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 21, 2, "https://openalex.org/W2036660342 | https://openalex.org/W2052287710", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2190604568", null, "https://www.cabi.org/GARA/FullTextPDF/2014/20143294452.pdf", null, "Impact of fertilizer use on weed management in conservation agriculture - a review.", "article", "en", "2014-01-01", 2014, "Ali Ahsan Bajwa | Shakeel Ahmad Anjum | Mohsin Tanveer | Hafiz Salman Saeed", "https://orcid.org/0000-0002-7171-3118 | - | https://orcid.org/0000-0003-4560-6439 | -", null, null, null, "Pakistan Journal of Agricultural Research", "Pakistan Agricultural Research Council", "0251-0480", "27", "1", "69–78", "Intensive farming has been adopted to produce large amounts of food grains and cash crops but environment is being deteriorated at alarming rate also. Increased use of fertilizers, pesticides, chemical growth regulators, machinery and poor management practices are accelerating environmental pollution, soil degradation, global warming, climatic change and food deterioration. Conservation agriculture offers a sustainable solution for all these problems most often. This review focuses the use of fertilizers in conservation agriculture and their impact on weed management. Weeds are major constraint in the productivity of agro-ecosystems. Fertilizer use can influence weed emergence, weed persistence, weed dormancy, weed dynamics, weed growth and weed dispersion attributes. The rate, timing, type and method of fertilizer application affect biological trends of weeds. In conservation tillage systems, the interaction between fertilizers and weeds is very complex, and there are reports of positive as well as negative correlations with weed establishment. Altered physical and chemical properties of reduced-tillage soils result in different weed growth and weed-crop competition periods and thus have indirect impacts on weed control strategies and management options in conservation crop production.", "Weed control | Weed | Tillage | Environmental science | Conservation agriculture | Agriculture | Agronomy | Cash crop | Fertilizer | Agroforestry | Productivity | Biology | Ecology | Economics", "Weed Control and Herbicide Applications", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 21, 31, "https://openalex.org/W19160378 | https://openalex.org/W41014593 | https://openalex.org/W1244290453 | https://openalex.org/W1964151943 | https://openalex.org/W2005252686 | https://openalex.org/W2007065087 | https://openalex.org/W2020057809 | https://openalex.org/W2039947372 | https://openalex.org/W2047476767 | https://openalex.org/W2080035529 | https://openalex.org/W2100673053 | https://openalex.org/W2106265481 | https://openalex.org/W2109674622 | https://openalex.org/W2118223843 | https://openalex.org/W2124224616 | https://openalex.org/W2124331162 | https://openalex.org/W2125568009 | https://openalex.org/W2132498364 | https://openalex.org/W2137671798 | https://openalex.org/W2144495949 | https://openalex.org/W2153161740 | https://openalex.org/W2153242585 | https://openalex.org/W2154303173 | https://openalex.org/W2162987811 | https://openalex.org/W2169058952 | https://openalex.org/W2173830271 | https://openalex.org/W2175492906 | https://openalex.org/W2256499115 | https://openalex.org/W2527631537 | https://openalex.org/W2585478545 | https://openalex.org/W2741788658", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2125490077", "https://doi.org/10.5897/jmpr.9000007", "https://academicjournals.org/journal/JMPR/article-abstract/C0EC72618594", null, "A COMPARISON OF VOLATILE COMPONENTS OF FLOWER OF PAGE MANDARIN OBTAINED BY ULTRASOUND-ASSISTED EXTRACTION AND HYDRODISTILLATION", "article", "en", "2011-07-04", 2011, "Behzad Babazadeh Darjazi", "https://orcid.org/0000-0001-5703-4592", "Behzad Babazadeh Darjazi", null, null, "Journal of Medicinal Plants Research", "Academic Journals", "1996-0875", "5", "13", "2840–2847", "Traditional hydrodistillation (HD) and ultrasound-assisted extraction method (UAE) have been compared and evaluated for their quantitative and qualitative compositions of the isolated essential oil from fresh page mandarin flowers. Thirty-eight flower components and twenty-nine flower components in the UAE and HD method, respectively including: aldehydes, alcohols, ketons, monoterpenes, sesquiterpenes and other components were indentified and quantified. The major flavor components of oil obtained by UAE were β-sinensal, α-sinensal, linalool, limonene, sabinene, ocimene, (z)-β-farnesene and E,E-α-farnesene. The major flavor components of oil obtained by HD were β-sinensal, α-sinensal, linalool, limonene, sabinene, ocimene and terpinene-4-ol. The UAE method offers important advantages over HD method, namely: provides a higher amount of oxygenated compounds. It offers also the possibility for a better reproduction of natural aroma of the essential oil from page mandarin flowers than the HD method. UAE method showed the highest content of aldehydes and alcohols. Since the aldehydes and alcohols content of citrus oil is considered as one of the more important indicators of high quality, method apparently has a profound influence on Page Mandarin oil quality.\r\n\r\n\t \r\n\r\n\tKey words: Page mandarin flower, ultrasound-assisted extraction, hydrodistillation, oxygenated components.", "Linalool | Limonene | Sabinene | Chemistry | Flavor | Essential oil | Extraction (chemistry) | Aroma | Horticulture | Chromatography | Botany | Food science | Biology", "Essential Oils and Antimicrobial Activity", "Food Science", "Agricultural and Biological Sciences", "Life Sciences", m and the logarithmic sigmoid threshold function provided the least errors. Furthermore, eight well-known mathematical models were also used to simulate the drying process. Among the mathematical drying models, the Two-term model was found to be more suitable for predicting the drying of papaya fruit slices, with a coefficient of determination (R2) of 0.9974 and a root-mean-square error (RMSE) of 0.0123. However, these values were lower than those obtained for the designed neural network model (R2 = 0.9994; RMSE = 0.0070). Therefore, estimation of the moisture content of papaya fruit could be better modelled by a neural network than by the mathematical models.", "Water content | Mean squared error | Artificial neural network | Mathematics | Perceptron | Moisture | Sigmoid function | Empirical modelling | Biological system | Soil science | Algorithm | Computer science | Machine learning | Environmental science | Statistics | Materials science | Simulation | Engineering | Composite material", "Food Drying and Modeling", "Food Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 18, 19, "https://openalex.org/W1575772124 | https://openalex.org/W1966917490 | https://openalex.org/W1970903351 | https://openalex.org/W1973897666 | https://openalex.org/W1977862302 | https://openalex.org/W1981029206 | https://openalex.org/W2001670254 | https://openalex.org/W2005819938 | https://openalex.org/W2015007087 | https://openalex.org/W2015092853 | https://openalex.org/W2020670086 | https://openalex.org/W2027455373 | https://openalex.org/W2037389717 | https://openalex.org/W2047442292 | https://openalex.org/W2059332680 | https://openalex.org/W2068376293 | https://openalex.org/W2076728456 | https://openalex.org/W2079576936 | https://openalex.org/W2084585838", false, "2025-07-24 00:00:00"], ["https://openalex.org/W1273832402", null, "https://agris.fao.org/agris-search/search.do?recordID=PK2011001265", null, "Antimicrobial activity of C
