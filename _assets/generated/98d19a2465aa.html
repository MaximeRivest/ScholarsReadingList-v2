que in place of the nylon bag method to estimate protein degradability of alfalfa hay in ruminants. In the in situ experiment dacron bags were filled with 3 g alfalfa hay. This was incubated in the rumen of three ruminally cannulated Ghezel rams for the periods of 0, 2, 4, 8, 12, 16, 24, 36 and 48 h. At the end of the experiment, dry matter, organic matter and crude protein degradability (CPD) were calculated. In the in vitro experiment, buffered rumen fluid was prepared in a solution of 19:1 artificial saliva to rumen fluid, which was pre-incubated by rapidly fermentable carbohydrates for 4 h. After pre-incubation, 30 mL of the buffered rumen fluid were added to 100 mL syringes, containing the alfalfa sample, with 7.5 mg N. The samples were incubated for 2, 4, 6, 8, 12, 16, 24, 36, 48, 60 and 72 hours, after which net gas production was computed. In the third experiment, 25 grams of faeces were mixed with 50 mL of artificial saliva, which was then made up to 1 liter by adding more artificial saliva and filtered. Then, the suspension was pre-incubated for 4 h. After pre-incubation, the same steps used to measure gas production were conducted. Results showed that there were significant differences between gas production with rumen liquor and faeces suspension at 2, 4, 24, 36 and 48 h of incubation, while no significant differences were found at other incubation times. There was a close relationship between crude protein degradation at different times and amount of gas production using rumen liquor [CPD= 58.93 + 0.32 gas (r2=0.76, n=18)] and fecal suspension [CPD= 58.38 + 0.27 gas (r2=0.60, n=18)]. The results indicated that faeces suspension can be used instead of rumen liquor as the medium in the gas production method. Development of the gas production technique could result in reducing the need to use fistulated animals in feed evaluation studies.", "Rumen | Incubation | Hay | Saliva | Dry matter | Animal science | Chemistry | Food science | Chromatography | Biolog eneration can vary in appearance depending on the degree of inflammation, necrosis, and mineralization in the resulting lesion bovine cysticercosis can inflict serious economic losses to the cattle industry. These are mainly due to condemnation, refrigeration and downgrading of infected carcasses. histological evaluation of T. saginata cysticerci suspect lesions is still considered the only laboratory diagnostic tool suitable for routine confirmation of undiagnosed lesions during inspection procedures at slaughterhouse. There have been many studies to characterize the histopathology of cysticercosis, however none of them gave a practical and unbiased set of criteria in order to come to a sound based diagnosis. Materials and methods 117 specimens of bovine ventricular myocardium positive for chronic lesions, presumptive of T. saginata metacestodes at visual inspection at the abattoir, have been analyzed by histological examination and molecular methods. Results and discussion All the samples resulted positive for the presence of T.saginata Dna. Lymphocytes, granulocytes and necrosis were the elements observed with higher frequency. In our study, histological observations of 9 out of 117 chronic lesions found in bovine myocardium did not show typical cellularity of a parasitic granuloma. Statistical analysis demonstrate that the presence of lymphocytes and granulocytes is the most significant evidence of a chronic lesion left by the degeneration of the larval stage of the parasite, while a fibrotic capsule, though often present, shows a lower significance. Conclusions The aim of this study was to demonstrate the practical use of a set of histological criteria for the identification of chronic lesions caused by T. saginata metacestodes with the support of highly specific molecular methods.", "Taenia | Cysticercosis | Histopathology | Lesion | Biology | Pathology | Cestoda | Veterinary medicine | Granuloma | Helminths | Medicine | Immunology", "Parasitic infections in h const root = document.currentScript.previousElementSibling;
const {cols, rows, total} = JSON.parse(root.querySelector('script[type="application/json"]').textContent);
const URL_RE = /(https?:\/\/[^\s<>"']+)/g, LONG = 300;
let page = 0, size = 25;
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const linkify = s => esc(s).replace(URL_RE, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
function cell(v) {
  if (v === null) return '<span class="na">null</span>';
  const nested = typeof v === 'object';
  const s = nested ? JSON.stringify(v) : String(v);
  const cls = nested ? ' class="nested"' : '';
  if (s.length <= LONG) return `<div${cls}>${linkify(s)}</div>`;
  return `<details${cls}><summary>${linkify(s.slice(0, LONG))}…</summary>${linkify(s)}</details>`;
}
function render() {
  const pages = Math.max(1, Math.ceil(rows.length / size));
  page = Math.min(page, pages - 1);
  const slice = rows.slice(page * size, page * size + size);
  root.querySelector('tbody').innerHTML = slice.map(r => '<tr>' + r.map(v => `<td>${cell(v)}</td>`).join('') + '</tr>').join('');
  const first = rows.length ? page * size + 1 : 0, last = page * size + slice.length;
  root.querySelector('.info').textContent =
    `rows ${first}–${last} of ${rows.length.toLocaleString()} loaded` + (total === null ? ' (total unknown)' : ` · ${total.toLocaleString()} in table`);
  root.querySelector('.pg').textContent = `page ${page + 1} / ${pages}`;
  root.querySelector('.prev').disabled = page === 0;
  root.querySelector('.next').disabled = page >= pages - 1;
  root.querySelector('.wrap').scrollTop = 0;
}
root.querySelector('thead tr').innerHTML = cols.map(([n, short, full]) =>
  `<th title="${esc(n + ': ' + full)}">${esc(n)}<div class="t">${esc(short)}</div></th>`).join('');
root.querySelector('.prev').onclick = () => { page--; render(); };
root.querySelector('.next').onclick = () => { page++; render(); };
root.querySelector('.size').onchange = e => { size = +e.target.value; page = 0; render(); };
render();
</script>
