ducting Josephson Junction Arrays at Low Voltage and Liquid Helium Temperatures", "article", "en", "2016-01-01", 2016, "Osama M. Nayfeh | Lance Lerum | Romero, Hector | Mohammed Fahem | K J Rothenhaus | C A Keeney", "https://orcid.org/0000-0001-9919-0147 | - | - | - | - | -", null, null, null, null, null, null, null, null, null, "Abstract : This technical report demonstrates the capabilities to measure niobium-based Josephson junction arrays at liquid helium temperatures at less than 50 mV. We find current switching with voltage consistent with the transition from Cooper-pair to quasiparticle tunneling. The results agree with the industrial manufacturers specifications. We use a recently created empirical model applicable to Josephson junction devices and arrays and obtain excellent fits to the characteristics and extract the non-ideality. These capabilities and calibration results will assist in the characterization of advanced superconductor-ionic quantum memory and computation devices.", "Josephson effect | Superconductivity | Liquid helium | Quantum tunnelling | Quasiparticle | Characterization (materials science) | Condensed matter physics | Niobium | Superconducting tunnel junction | Voltage | Pi Josephson junction | Materials science | Physics | Optoelectronics | Helium | Nanotechnology | Atomic physics | Quantum mechanics", "Advanced Electrical Measurement Techniques", "Electrical and Electronic Engineering", "Engineering", "Physical Sciences", null, true, "gold", null, null, null, 0, 3, "https://openalex.org/W2028194301 | https://openalex.org/W2113672761 | https://openalex.org/W2151508803", false, "2025-07-24 00:00:00"], ["https://openalex.org/W3173296804", "https://doi.org/10.13140/rg.2.2.17671.15521", "https://doi.org/10.13140/rg.2.2.17671.15521", null, "EXPLORING SCIENCE TEACHERS' VIEWS ABOUT THE NATURE OF SCIENCE AND HOW THESE VIEWS INFLUENCE THEIR CLASSROOM PRACTICES", "article", "en", "2018-01-01", 2018, "Karabo Justice Chuene", "https://orcid.org/000 g/0000-0002-0445-024X | - | https://orcid.org/0000-0003-2629-1742", null, null, null, "Journal of Vibroengineering", "JVE International", "1392-8716", "16", "7", "3302–3316", "Spindle-holder taper joint is one of the most crucial joints of high speed spindle system (HSS). Dynamic behavior of this taper joint is critical for predicting tool point frequency response function (FRF) and evaluating the cutting process stability. To identify the spindle-holder taper joint dynamic behavior precisely and rapidly, a novel identification technology is presented in this paper. Firstly, receptance coupling substructure analysis (RCSA) is improved to save the computing time without sacrificing the calculation precision. Secondly, instead of extracting the joint coefficients by complex fitting methodology, a receptance matrix is identified to represent the spindle-holder taper joint dynamic characteristics. Finally, the joint receptance matrix is used, coupling with the analytical model of arbitrary holder with varying overhang length and diameter, to predict FRF at the free end of spindle-holder assembly. The results show good agreements between predictions and experimentations. And it is validated that the presented identification technology is feasible. Comparing to the previous literatures, the proposed approach is less time-consuming and more accurate to reflect the nonlinear characteristics of spindle-holder taper joint.", "Joint (building) | Computer science | Point (geometry) | Nonlinear system | Coupling (piping) | Process (computing) | Substructure | Frequency response | Control theory (sociology) | Matrix (chemical analysis) | Structural engineering | Mechanical engineering | Engineering | Physics | Materials science | Mathematics | Geometry | Artificial intelligence", "Advanced machining processes and optimization", "Mechanical Engineering", "Engineering", "Physical Sciences", null, true, "hybrid", "cc-by", null, null, 2, 25, "https://openalex.org/W1964278030 | https: ere was a significant increase in total soluble solids and total carbohydrates of the fruits from ripening stage 1 (green) to stage 2 (with tinge of yellow) and a significant decrease in firmness as the fruits ripened. No significant change was observed in titratable acidity of the fruits during ripening. Firmness and total carbohydrates showed the strongest correlation with degree of ripeness among the four parameters studied. From the slopes in plots of RGB values versus firmness, binary and ternary color functions were formulated in order to measure the degree of fruit ripeness. The correlation coefficients were 0.9387 and 0.9497 for plots (versus fruit firmness) of the binary and ternary color functions, respectively. The results showed that the photometric method, using a digital camera combined with software for color analysis, can help to quantitatively determine the degree of maturity and ripeness of ‘Sinta’ papaya fruits.", "Ripeness | Ripening | Carica | Titratable acid | Mathematics | Horticulture | RGB color model | Food science | Chemistry | Biology | Artificial intelligence | Computer science", "Postharvest Quality and Shelf Life Management", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 5, 23, "https://openalex.org/W43063311 | https://openalex.org/W1491830190 | https://openalex.org/W1536211993 | https://openalex.org/W1942191010 | https://openalex.org/W1968834637 | https://openalex.org/W2001227064 | https://openalex.org/W2010560725 | https://openalex.org/W2013785102 | https://openalex.org/W2028754140 | https://openalex.org/W2036085530 | https://openalex.org/W2055892944 | https://openalex.org/W2069593752 | https://openalex.org/W2077926016 | https://openalex.org/W2080500092 | https://openalex.org/W2080594068 | https://openalex.org/W2097427512 | https://openalex.org/W2111807294 | https://openalex.org/W2153214972 | https://openalex.org/W2163748203 | https://openalex.org/W2164341408 | https://openalex.org/W2186588418 | https://openalex.org/W2333427535 | https://openalex.org/W2757955198", false, "2025-07-24 00:00:00"], ["https://openalex.org/W1820181334", "https://doi.org/10.62550/ay246251", "https://doi.org/10.62550/ay246251", null, "Comparison of Mathematical and Neural Network Models in the Estimation of Papaya Fruit Moisture Content", "article", "en", "2012-09-01", 2012, "Alireza Yousefi | Vahid R. Asadi | Seyed Mehdi Nassiri | Mehrdad Niakousari | Shahla Khodabakhsh Aghdam", "https://orcid.org/0000-0003-0148-9015 | https://orcid.org/0000-0001-8354-7463 | https://orcid.org/0000-0001-6059-8911 | https://orcid.org/0000-0002-4557-9031 | -", null, "Ferdowsi University of Mashhad | Shiraz University", "IR", "The Philippine Agricultural Scientist", null, "0031-7454", "95", "3", "246–251", "The moisture content of papaya fruit during drying in a cabinet dryer was estimated using both mathematical and neural network models. The effect of air temperatures (40, 50 and 60 °C) and fruit slice thickness (3, 5, 7 mm) on moisture ratio were investigated. A three-layer perceptron neural network with different training algorithms was designed and used. To obtain better estimation of fruit moisture content, topologies were established based on different threshold functions. The results showed that the multi-layer perceptron network with 3-9-1 topology, the Levenberg-Marquardt training algorithm and the logarithmic sigmoid threshold function provided the least errors. Furthermore, eight well-known mathematical models were also used to simulate the drying process. Among the mathematical drying models, the Two-term model was found to be more suitable for predicting the drying of papaya fruit slices, with a coefficient of determination (R2) of 0.9974 and a root-mean-square error (RMSE) of 0.0123. However, these values were lower than those obtained for the designed neural network model (R2 = 0.9994; RMSE = 0.0070). Therefore, estimation of the moisture content of papaya fruit could be better modelled by a neural network than by the mathematical models.", "Water content | Mean squared error | Artificial neural network | Mathematics | Perceptron | Moisture | Sigmoid function | Empirical modelling | Biological system | Soil science | Algorithm | Computer science | Machine learning | Environmental science | Statistics | Materials science | Simulation | Engineering | Composite material", "Food Drying and Modeling", "Food Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 18, 19, "https://openalex.org/W1575772124 | https://openalex.org/W1966917490 | https://openalex.org/W1970903351 | https://openalex.org/W1973897666 | https://openalex.org/W1977862302 | https://openalex.org/W1981029206 | https://openalex.org/W2001670254 | https://openalex.org/W2005819938 | https://openalex.org/W2015007087 | https://openalex.org/W2015092853 | https://openalex.org/W2020670086 | https://openalex.org/W2027455373 | https://openalex.org/W2037389717 | https://openalex.org/W2047442292 | https://openalex.org/W2059332680 | https://openalex.org/W2068376293 | https://openalex.org/W2076728456 | https://openalex.org/W2079576936 | https://openalex.org/W2084585838", false, "2025-07-24 00:00:00"], ["https://openalex.org/W4289985918", "https://doi.org/10.3928/0148-4834-19790901-08", "https://doi.org/10.3928/0148-4834-19790901-08", null, "An Investigation of the Effects of Clinical Experience on Cognitive Gains", "article", "en", "1979-09-01", 1979, "Lettie A Lee", "-", "Lettie A Lee", "Howard College", "US", "Journal of Nursing Education", "Slack Incorporated (United States)", "0148-4834", "18", "7", "27–37", null, "Psychology | Cognition | Cognitive psychology | Psychiatry", "Counseling Practices and Supervision", "Social Psychology", "Psychology", "Social Sciences", null, false, "closed", null, null, null, 0, 9, "https://openalex.org/W1968221850 | https://openalex.org/W1987436483 | https://openalex.org/W201833559 uch projects the budget and time frame are determinated by the effort being spent on activities needed to deliver product, which would meet client's requirements. Objective and reliable effort estimation still appears to be a great challenge to the software engineering. In the author's opinion the main reason of that problem is effort estimation on the basis of resources, while such planning activity should ground on the required software product size, which determines work effort. But using suitable methods for software size estimation will not be sufficient as long as it does not take into account benchmarking data concerning similar projects having been completed in the past. This paper is aimed at indicating the important role of using reliable benchmarking data in order to obtain valuable effort estimates for software development and enhancement projects, including particularly the attempt to analyse usefulness of benchmarking data of general character.", "Benchmarking | Computer science | Software | Software development | Estimation | Work (physics) | Team software process | Risk analysis (engineering) | Software development process | Systems engineering | Software engineering | Process management | Engineering | Business", "Software Engineering Research", "Information Systems", "Computer Science", "Physical Sciences", null, false, "closed", null, null, null, 6, 5, "https://openalex.org/W113279783 | https://openalex.org/W157373053 | https://openalex.org/W1656815318 | https://openalex.org/W2099377401 | https://openalex.org/W3213422946", false, "2025-07-24 23:04:31.954817"], ["https://openalex.org/W3213662909", "https://doi.org/10.58213/x5acg443", "https://doi.org/10.58213/x5acg443", null, "The Impact of Indian Independence Movement on the select Novels of Raja Rao", "article", "en", "2021-07-11", 2021, "S Rashmi.", "-", "S Rashmi.", null, null, "Vidhyayana", null, "2454-8596", "6", "6", null, "Indian Writing in English is influenced by Gandhian ideology. Gandhi emphasized more on social, political, and religious problems of the oppressed and down trodden lower castes in Hindu society. His aim was to abolish poverty, caste system and untouchability from society. The present study reveals prominently the influence of Mahatma Gandhi on the village of Kanthapura. ‘Kanthapura’ is the microcosm of the Indian traditional society and what happened in Kanthapura was also happened in India during 1919-1930. It is not only a political novel, but also a novel which concerns with socio-religious and economic transformation during the struggle for independence. ‘Kanthapura’ follows Gandhi’s doctrine and ideology of non-violence, Satyagraha, their views on untouchability and casteism etc. The novel can be considered Gandhi-epic. Gandhi aroused national awakening in Indians with his non-violent struggle for freedom movement which was strengthened by noncooperation and civil disobedience movement in Kanthapura village. Gandhi’s influential personality and his ideology is felt everywhere in the novel. Indeed, Gandhi doesn’t appear in this novel personally, but the plot of the novel revolves around his ideology. This research article, ‘Gandhi’s Ideology: A Study of Raja Rao’s Kanthapura’ aims at how the Gandhi’s ideology influenced Raja Rao which resulted in the creation of the character of Moorthy. It also focuses on how Moorthy, under the influence of Gandhi, tries to inspire the people towards the freedom struggle.", "Ideology | Hinduism | Politics | Caste | Sociology | Gender studies | Independence (probability theory) | Raja | Civil disobedience | Religious studies | Political science | Law | Philosophy", "Indian History and Philosophy", "Philosophy", "Arts and Humanities", "Social Sciences", null, true, "diamond", "cc-by", null, null, 0, 1, "https://openalex.org/W1577393785", false, "2025-07-24 00:00:00"], ["https://openalex.org/W2227619978", "https://doi.org/10.66392/003777214814716561", "https://doi.org/10.66392/003777214814716561", m codes in Java.", "Code refactoring | Computer science | Programming language | Program transformation | Process (computing) | Java | Code (set theory) | Software engineering | Transformation (genetics) | Simple (philosophy) | Software", "Software Engineering Research", "Information Systems", "Computer Science", "Physical Sciences", null, false, "closed", null, null, null, 0, 9, "https://openalex.org/W196359096 | https://openalex.org/W1511110335 | https://openalex.org/W1512563586 | https://openalex.org/W1580328473 | https://openalex.org/W1993836075 | https://openalex.org/W2052363833 | https://openalex.org/W2055477538 | https://openalex.org/W2153887189 | https://openalex.org/W2166985644", false, "2025-07-24 03:59:36.897491"], ["https://openalex.org/W65175468", "https://doi.org/10.1080/13632460609350616,", "https://benthamopen.com/ABSTRACT/TOBCTJ-2-313", null, "Theoretical and Experimental Analysis of Column Web in Compression", "article", "en", "2008-12-31", 2008, "L. De Mita | Vincenzo Piluso | Gianvittorio Rizzano", "- | https://orcid.org/0000-0002-4630-5614 | https://orcid.org/0000-0002-9408-0712", null, "University of Salerno", "IT", "The Open Construction and Building Technology Journal", "Bentham Science Publishers", "1874-8368", "2", "1", "313–322", "Advanced analysis of steel structures requires an accurate modelling of beam-to-column joints to be used for complete non linear analyses including both mechanical non-linearity and geometrical non linearity. Therefore, the predic- tion of the rotational behaviour of beam-to-column joints is necessary. To this scope the component approach can be ap- plied. Within this framework, in this paper the attention is focused on the behaviour of the column web in compression, which represents an important joint component influencing significantly the rotational response of unstiffened connections where continuity plates are omitted. In particular, in order to analyse the whole force-displacement behaviour of this com- ponent, an experimental program has been planned and performed on twelve specimens represented by standard HEA and HEB series whose web has been subjected to transversal compression, under displacement control, allowing the investiga- tion of the post-buckling behaviour.", "Structural engineering | Column (typography) | Compression (physics) | Displacement (psychology) | Joint (building) | Beam (structure) | Linearity | Buckling | Engineering | Materials science | Connection (principal bundle) | Composite material", "Structural Load-Bearing Analysis", "Civil and Structural Engineering", "Engineering", "Physical Sciences", null, false, "closed", null, null, null, 3, 18, "https://openalex.org/W649242165 | https://openalex.org/W1974491902 | https://openalex.org/W1975191738 | https://openalex.org/W1979482462 | https://openalex.org/W1988103498 | https://openalex.org/W1998090560 | https://openalex.org/W2025857007 | https://openalex.org/W2031023808 | https://openalex.org/W2035644061 | https://openalex.org/W2039688932 | https://openalex.org/W2039744947 | https://openalex.org/W2073224051 | https://openalex.org/W2080526394 | https://openalex.org/W2082179468 | https://openalex.org/W2087779485 | https://openalex.org/W2123544876 | https://openalex.org/W2524397372 | https://openalex.org/W4299723068", false, "2025-07-24 15:47:10.497052"], ["https://openalex.org/W2990040217", "https://doi.org/10.56975/jetir.v4i6.224556", "https://doi.org/10.56975/jetir.v4i6.224556", null, "TO STUDY THE EFFECT OF FRICTION STIR PROCESSING ON MECHANICAL PROPERTIES OF AL 5251 ALLOY", "article", "en", "2017-01-01", 2017, "Onkar Singh | Baljinder Ram", "https://orcid.org/0000-0002-6338-5871 | https://orcid.org/0000-0002-5699-2665", null, null, null, "Journal of Emerging Technologies and Innovative Research", "Journal of Emerging Technologies and Innovative Research (JETIR)", "2349-5162", "4", "6", "341-346", "In the current study Al 5251 alloy based surface composite are produced by using SiC and Al2O3 reinforcements with the help of friction stir processing. Effect of different combinations of process parameters (tool speed, number of passes and reinforcements) on mechanical properties viz. tensile strength, hardness and impact strength is investigated. The optical images shown that the reinforcement uniformly distributed in the matrix. It is also observed that the mechanical properties of Al 5251 alloy surface composites are improved as compared to unreinforced alloy. The hardness of the processed alloy reached up to 44 HRB which is significant higher than the unprocessed alloy. The tensile strength of Al alloy increased up to 229 MPa by double pass of FSP without any reinforcement. Impact strength is improved by formation of surface composite on alloy. The overall properties of the Al 5251 alloy are improved by FSP.", "Alloy | Ultimate tensile strength | Friction stir processing | Materials science | Composite number | Reinforcement | Composite material | Metallurgy", "Aluminum Alloys Composites Properties", "Mechanical Engineering", "Engineering", "Physical Sciences", null, true, "gold", null, null, null, 0, 10, "https://openalex.org/W1978261351 | https://openalex.org/W1993708068 | https://openalex.org/W2006069353 | https://openalex.org/W2006612401 | https://openalex.org/W2059633717 | https://openalex.org/W2079965532 | https://openalex.org/W2080849071 | https://openalex.org/W2084079747 | https://openalex.org/W2123815515 | https://openalex.org/W2157219816", false, "2025-07-24 00:00:00"], ["https://openalex.org/W2188242832", "https://doi.org/10.13140/rg.2.2.32571.99361", "https://doi.org/10.13140/rg.2.2.32571.99361", null, "An open source implementation of a data acquisition system for a current pulse ERT system using an industry standard interface", "article", "en", "2013-01-01", 2013, "K. H. Hauslaib | E.W. Randall", "- | -", null, null, null, null, null, null, null, null, null, "The design and applications of the Current Pulse Electrical Resistance Tomography (ERT) system developed at the University of Cape Town (UCT) has been described in several journal papers and at previous world congresses. Details of the electronic circuits were published at WCIPT6. This paper deals with the replacement of the USB DAQ and two microcontrollers with an industry standard IO system available from National Instruments and enables the transmission of data at 1000 fps over an TCP/IP network. The LabVIEW code will be placed in the public domain to coincide with WCIPT7. This will provide a complete open source design for an ERT system.", "USB | Data acquisition | Microcontroller | Interface (matter) | Engineering | Embedded system | Computer hardware | Electrical engineering | Computer science | Operating system | Software", "Electrical and Bioimpedance Tomography", "Electrical and Electronic Engineering", "Engineering", "Physical Sciences", null, true, "gold", null, null, null, 1, 2, "https://openalex.org/W1559148206 | https://openalex.org/W2005719978", false, "2025-07-25 00:00:00"], ["https://openalex.org/W2193847520", "https://doi.org/10.21595/jve.2014.15307", "https://doi.org/10.21595/jve.2014.15307", null, "Influences of planetary gear parameters on the dynamic characteristics – a review", "article", "en", "2015-03-31", 2015, "Feng Li | Yumo Qin | Linshan Ge | Zhao Pang | Shaokang Liu | Donglong Lin", "https://orcid.org/0000-0003-0620-0639 | - | - | - | https://orcid.org/0000-0002-3801-8690 | -", null, null, null, "Journal of Vibroengineering", "JVE International", "1392-8716", "17", "2", "574–586", "Planetary gear trains (PGTs) are widely used in the field of mechanical transmission. PGTs significantly differ from fixed-axis gear trains and exhibit unique dynamic behavior. Dynamic characteristics of PGTs are popular research topic, particularly when attempting to solve the problem of vibration noise. Moreover, the effects of the planetary gear parameters on the dynamic characteristics are paramount important. And significant researches have been conducted in this field. However, few reviews regarding these studies have been published. In this paper, the effects of certain parameters, which include mesh phase difference, geometric errors (tooth profile error, eccentricity error and misalignment), tooth profile modification, mesh stiffness, and etc., on the dynamic characteristics of PGTs are summarized. Several conclusions obtained can be used for the PGTs design and dynamic characteristics analysis. Finally, the potential research trends are pointed out.", "Eccentricity (behavior) | Vibration | Computer science | Stiffness | Noise (video) | Train | Field (mathematics) | Structural engineering | Acoustics | Physics | Engineering | Mathematics | Artificial intelligence", "Gear and Bearing Dynamics Analysis", "Mechanical Engineering", "Engineering", "Physical Sciences", null, true, "hybrid", "cc-by", null, null, 6, 56, "https://openalex.org/W1514686083 | https://openalex.org/W1562097548 | https://openalex.org/W1599605039 | https://openalex.org/W1964702573 | https://openalex.org/W1972333311 | https://openalex.org/W1972833467 | https://openalex.org/W1976024516 | https://openalex.org/W1981154859 | https://openalex.org/W1986200832 | https://openalex.org/W1988793178 | https://openalex.org/W1992131495 | https://openalex.org/W1992213313 | https://openalex.org/W1994189394 | https://openalex.org/W2001570361 | https://openalex.org/W2002798762 | https://openalex.org/W2007525054 | https://openalex.org/W2008382573 | https://openalex.org/W2008650156 | https://openalex.org/W2008844699 | https://openalex.org/W2010449232 | https://openalex.org/W2012127589 | https://openalex.org/W2018699943 | https://openalex.org/W2018708061 | https://openalex.org/W2039456257 | https://openalex.org/W2042883571 | https://openalex.org/W2044739180 | https://openalex.org/W2044874155 | https://openalex.org/W2048855848 | https://openalex.org/W2050910402 | https://openalex.org/W2052800408 | https://openalex.org/W2054091077 | https://openalex.  "https://doi.org/10.66392/003777216817821820", "https://doi.org/10.66392/003777216817821820", null, "Jamestown and Power Lines: Teaching Controversy in an Inter-Disciplinary Manner", "article", "en", "2016-01-01", 2016, "Brandon M. Butler | Stephen R. Burgin", "https://orcid.org/0000-0002-8794-5183 | https://orcid.org/0000-0002-1064-2141", null, null, null, "Social Education", null, "0037-7724", "80", "1", "46–51", "Jamestown is at the heart of any teaching and learning of colonial American history. Stories of John Smith and Pocahontas are learned by elementary and secondary students across the United States. In Virginia, Jamestown is first taught in third grade and revisited five more times from historical, political, economic, and geographic perspectives. However, the history of Jamestown is taught principally as a place, a series of events, and people from long ago with little consideration of its place in the world today. The reality is that Jamestown Island, the location of the first permanent English settlement in the Americas, is today part of a thriving metropolitan area of approximately 1.7 million people.", "Discipline | Engineering ethics | Power (physics) | Epistemology | Sociology | Political science | Social science | Philosophy | Engineering", "Educator Training and Historical Pedagogy", "Sociology and Political Science", "Social Sciences", "Social Sciences", null, false, "closed", null, null, null, 3, 2, "https://openalex.org/W2059727242 | https://openalex.org/W2063846087", false, "2025-07-25 00:00:00"], ["https://openalex.org/W214541454", "https://doi.org/10.1016/s0002-9459(26)00919-8", "https://doi.org/10.1016/s0002-9459(26)00919-8", null, "Evaluation of Peer Teaching in a Pharmaceutical Care Laboratory", "article", "en", "2000-01-01", 2000, "Shelley L. Chambers | Janet Schmittgen | Carolyn R. Allan", "- | - | -", null, null, null, "American Journal of Pharmaceutical Education", "Elsevier BV", "0002-9459", "64", "3", "283–288", null, "Pharmaceutical care | Medical education | Peer evaluation | Higher education | Medicine | Pharmacy | Nursing | Political science", "Problem and Project Based Learning", "Education", "Social Sciences", "Social Sciences", null, false, "closed", null, null, null, 15, 6, "https://openalex.org/W319954686 | https://openalex.org/W1964132326 | https://openalex.org/W1968293102 | https://openalex.org/W1989528006 | https://openalex.org/W2009569957 | https://openalex.org/W2147816769", false, "2025-07-25 00:00:00"], ["https://openalex.org/W3148170884", "https://doi.org/10.62273/ipkw6101", "https://doi.org/10.62273/ipkw6101", null, "Software Business Models", "article", "en", "2020-01-01", 2020, "Clif Kussmaul", "https://orcid.org/0000-0003-1660-7117", "Clif Kussmaul", null, null, "Information Systems Education Journal", null, "1545-679X", "18", "2", "22–40", null, "Computer science | Software | Knowledge management | Computer software | Software engineering | Process management | Data science | Business | Programming language", "Business Process Modeling and Analysis", "Management Information Systems", "Business, Management and Accounting", "Social Sciences", null, false, "closed", null, null, null, 0, 12, "https://openalex.org/W379622356 | https://openalex.org/W1965843297 | https://openalex.org/W1985261208 | https://openalex.org/W2037254711 | https://openalex.org/W2064913536 | https://openalex.org/W2096547436 | https://openalex.org/W2108617939 | https://openalex.org/W2119349395 | https://openalex.org/W2123270021 | https://openalex.org/W2134165069 | https://openalex.org/W2465968327 | https://openalex.org/W2797724468", false, "2025-07-25 00:00:00"], ["https://openalex.org/W1600939012", "https://doi.org/10.62550/jza327334", "https://doi.org/10.62550/jza327334", null, "Health-Promoting Lipids from Purslane (Portulaca oleracea L.): Isolation, Characterization, Quantification and In Vivo Assay of Angiogenic Activity", "article", "en", "2012-12-01", 2012, "Jeella Z. Acedo | Charisse T. Reyes | Evelyn B. Rodriguez", "https://orcid.org/0000-0002-6648-770X | https://orcid.org/0000-0001-5367-3653 | -", null, "University of the Philippines Los Baños", "PH", "The Philippine Agricultural Scientist", null, "0031-7454", "95", "4", "327–334", "Phytosterols, α-tocopherol and squalene were isolated from purslane (Portulaca oleracea L.) using a combination of solvent extraction, saponification and thin layer chromatography, and were characterized using standard chemical tests and ultraviolet and Fourier transform infrared spectroscopy. The levels of these lipids per 100 g fresh weight were quantified as follows: 6.52 ± 0.44 mg phytosterols, 9.05 ± 0.04 mg α-tocopherol and 115.0 ± 2.0 μg squalene. Argentation thin layer chromatography further resolved the phytosterol isolate into β-sitosterol, stigmasterol and campesterol, the identities of which were established through melting point determination coupled with ultraviolet and Fourier transform infrared spectroscopy. Furthermore, gas chromatographic analysis of purslane oil revealed the presence of the omega-3 fatty acids α-linolenic acid and docosahexaenoic acid at 17.00 ± 0.33% and 5.08 ± 0.49%, respectively, of purslane oil. A new semi-quantitative in vivo duck embryo chorioallantoic membrane (CAM) assay for angiogenesis was described in this study including a scoring system with a scale of -3 to +3, with -3 as the score for complete loss of blood capillaries. Purslane oil and its saponifiable and unsaponifiable fractions exhibited scores of -1 to -2.7 when applied to CAM at 150–300 μg. Their anti-angiogenic activity can be attributed to the presence of phytosterols, α-tocopherol, squalene and omega-3 fatty acids. This study revealed the potential use of purslane in modulating angiogenesis.", "Squalene | Unsaponifiable | Chromatography | Saponification | Chemistry | Chorioallantoic membrane | Portulaca | Tocopherol | Biochemistry | Biology | Botany | Vitamin E | Antioxidant", "Fatty Acid Research and Health", "Nutriti in all treatments in case of all sensoryrnattributes. The overall acceptability of experimental (T1) Oats Banana energyrnbar and Coconut energy bar were 9.0, 9.0 respectably.", "Bar (unit) | Standardization | Energy (signal processing) | Organoleptic | Scale (ratio) | Mathematics | Agricultural science | Environmental science | Computer science | Biology | Statistics | Food science | Physics | Geography | Cartography", "Smart Agriculture and AI", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, true, "gold", null, null, null, 8, 2, "https://openalex.org/W1825104184 | https://openalex.org/W2497772680", false, "2025-07-26 00:00:00"], ["https://openalex.org/W3197411299", "https://doi.org/10.21917/ijms.2018.0098", "https://doi.org/10.21917/ijms.2018.0098", null, "A STUDY ON STRATEGIC SOURCING AND SUPPLY CHAIN RISK MANAGEMENT IN AVTEC LIMITED", "article", "en", "2018-05-01", 2018, "K. Selvavinayagam", "-", "K. Selvavinayagam", "Periyar University", "IN", "ICTACT Journal on Management Studies", "ICT Academy", "2395-1656", "4", "2", "723–727", "Supply Chain Risk Management is the process of forecasting the risks that may happen in future and managing them effectively. In other words, SCRM is to apply risk management process tools, with partners in a supply chain or on your own, to deal with risks and uncertainties caused by, or affecting, logistics- related activities or resources in the supply chain. In order to be more efficient, firms have adopted strategies such as outsourcing, global partnerships and lean practices but resulted in lot of supply chain risks. Hence strategic sourcing and supply chain team combined together to minimize the supply chain risks. The study has been taken to gain an in-depth knowledge about strategic sourcing and the level of risk management in AVTEC Limited. This project is a study on AVTEC concern about supply chain risks and how good is the supply chain team in managing all the risks like Natural disaster risks, Geo-Political risks, Infrastructure outage risks, Supplier business policies and practices etc. A structured questionnaire has been used to collect the data. Appropriate statistical tools have been used to draw conclusions. The statistical tools such as Percentage analysis, Correlation and ANOVA were used. The conclusion and suggestions are provided to the company based on the data collected from them. The data collected are fed in the SPS software (SPSS). The data are analysed using the SPSS. The data are analysed using descriptive statistics, chi-square analysis and factor analysis-test.", "Supply chain | Supply chain risk management | Business | Strategic sourcing | Outsourcing | Supply chain management | Risk management | Descriptive statistics | Operations management | Risk analysis (engineering) | Strategic planning | Process management | Marketing | Service management | Finance | Engineering", "Supply Chain Resilience and Risk Management", "Strategy and Management", "Business, Management and Accounting", "Social Sciences", null, true, "diamond", "cc-by-nc-sa", null, null, 0, 8, "https://openalex.org/W1535700698 | https://openalex.org/W2011503091 | https://openalex.org/W2053682567 | https://openalex.org/W2055793145 | https://openalex.org/W2061740878 | https://openalex.org/W2100572924 | https://openalex.org/W2124098697 | https://openalex.org/W2131223556", false, "2025-07-26 00:00:00"], ["https://openalex.org/W3215571155", "https://doi.org/10.5802/jolt.832", "https://doi.org/10.5802/jolt.832", null, "On the Reducibility Points beyond the Ends of Complementary Series of p-adic General Linear Groups", "article", "en", "2015-01-01", 2015, "Marko Tadić", "https://orcid.org/0000-0002-6087-3765", "Marko Tadić", null, null, "Journal of Lie Theory", "Heldermann Verlag", "0949-5932", "25", "1", "147–183", null, "Mathematics | Series (stratigraphy) | Pure mathematics | Algebra over a field | Group (periodic table) | General linear group | Symmetric group", "Advanced A alism | Linguistics | Slavic languages | Articulation (sociology) | Sociology | Philosophy | Epistemology | Political science", "Multilingual Education and Policy", "Linguistics and Language", "Social Sciences", "Social Sciences", null, true, "diamond", "cc-by", null, null, 8, 5, "https://openalex.org/W652518244 | https://openalex.org/W1527208110 | https://openalex.org/W2074525598 | https://openalex.org/W2165545766 | https://openalex.org/W2315366077", false, "2025-07-26 00:00:00"], ["https://openalex.org/W1809080048", "https://doi.org/10.21595/jve.2015.15782", "https://doi.org/10.21595/jve.2015.15782", null, "High-frequency structural-acoustic analysis using an unstructured zero-order energy FEM formulation", "article", "en", "2015-06-30", 2015, "Hongwei Zhou | Haibo Chen | Yongyan Wang", "https://orcid.org/0000-0002-7518-9464 | https://orcid.org/0000-0003-0832-7713 | https://orcid.org/0000-0003-4753-3448", null, null, null, "Journal of Vibroengineering", "JVE International", "1392-8716", "17", "4", "1645–1659", "Based on the governing equations of energy flow analysis in plate and acoustic domain, an unstructured zero-order energy finite element method (uEFEM 0 ) formulation is presented to simulate the high-frequency behavior of plate structures in contact with acoustic cavities. The new formulation is derived using EFEM 0 , in which the energy primary variable is conserved in each element. The bending, longitudinal, and shear wave fields in the plates are all included. By meshing plates with triangular grids and cavities with tetrahedral grids, this new formulation can be easily used for modeling structures with arbitrary shape. The formulation is validated by comparing the results obtained from uEFEM 0 with those from statistical energy analysis and literature. Good correlations are observed, and the advantages of the uEFEM 0 formulation are identified.", "Finite element method | Energy (signal processing) | Statistical energy analysis | Bending | Frequency doma d payout ratio | Business | Profit (economics) | Earnings | Dividend yield | Share price | Stock market | Financial economics | Monetary economics | Economics | Finance | Microeconomics | Stock exchange | Corporate governance", "Financial Reporting and Valuation Research", "Strategy and Management", "Business, Management and Accounting", "Social Sciences", null, true, "diamond", "cc-by-nc-sa", null, null, 0, 4, "https://openalex.org/W1501269936 | https://openalex.org/W1503820430 | https://openalex.org/W2223768511 | https://openalex.org/W2979179699", false, "2025-07-26 00:00:00"], ["https://openalex.org/W1534570772", "https://doi.org/10.62550/sg400405", "https://doi.org/10.62550/sg400405", null, "Comparative Performance of Two Different Planters Modified for No-Till Planting of Wheat on Ridge", "article", "en", "2012-12-01", 2012, "Songül Gürsoy", "https://orcid.org/0000-0002-6145-0684", "Songül Gürsoy", "Dicle University", "TR", "The Philippine Agricultural Scientist", null, "0031-7454", "95", "4", "400–405", "No-till planting of wheat (Triticum durum L.) on ridge after cotton (Gossypium hirsutum L.) harvest may offer potential benefits in terms of lower production costs, improved soil structure and efficient irrigation. Sowing of wheat on ridge is possible with the devolopment of a suitable planter. A study was conducted to compare the effect of two different planters modified to plant wheat without tillage on ridge after cotton harvest in terms of vertical seed distribution, seeding depth, seedling emergence rate, working speed, field capacity and fuel consumption of planters. The commercial planters used for modification in the study were Ozdoken no-till planter (MORP) and Hassia conventional till planter (MHRP). The experimental results showed that the MORP planter placed 60% of the seeds at the targeted depth of about 4 cm, whereas more than 50% of the seeds were on the soil surface or near the surface and remained uncovered with soil with use of the MHRP planter. Use of the MORP resulted in a more uniform vertical seed distribution, higher emergence rate and higher working speed, field capacity and lower fuel consumption compared with use of the MHRP. The results suggest that the MORP planter may be successfully used to plant wheat on ridge without tillage after cotton.", "Sowing | Tillage | Agronomy | Ridge | No-till farming | Irrigation | Environmental science | Seeding | Seedling | Fuel efficiency | Biomass (ecology) | Mathematics | Soil water | Biology | Engineering | Soil science | Soil fertility", "Soil Management and Crop Yield", "Soil Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 1, 7, "https://openalex.org/W595656155 | https://openalex.org/W1988681204 | https://openalex.org/W2003531006 | https://openalex.org/W2156780707 | https://openalex.org/W2279962699 | https://openalex.org/W2725974085 | https://openalex.org/W2781523591", false, "2025-07-26 00:00:00"], ["https://openalex.org/W1520044237", "https://doi.org/10.1001/archinte.158.2.191-c", "https://doi.org/10.1001/archinte.158.2.191-c", null, "Rash Decisions—Reply", "article", "en", "1998-01-26", 1998, "Nirmal Joshi | Debra Q. Miller", "https://orcid.org/0000-0001-9617-5937 | -", null, null, null, "Archives of Internal Medicine", "American Medical Association", "0003-9926", "158", "2", "191", null, "Medicine | Rash | Dermatology | Intensive care medicine", "Healthcare Systems and Challenges", "General Health Professions", "Health Professions", "Health Sciences", null, false, "closed", null, null, null, 0, 1, "https://openalex.org/W2444051970", false, "2025-07-26 00:00:00"], ["https://openalex.org/W2992977501", "https://doi.org/10.13140/rg.2.2.31029.95205", "https://doi.org/10.13140/rg.2.2.31029.95205", null, "Prediction of Monthly Rainfall of Nainital Region using Artificial Neural Network (ANN) and Support Vector Machine (SVM)", "article", "en", "2015-01-01", 2015, "Deepa Bisht | Mahesh C. Joshi | Ashish Mehta", "https://orcid.org/0000-0001-5599-0775 | https://orcid.org/0000-0002-5879-4080 | https://orcid.org/0009-0007-2954-8335", null, "Kumaun University", "IN", null, null, null, "1", "3", "400–406", "Artificial Neural Network (ANN) and Support Vector Machine (SVM) are the most widely used supervised techniques for data analysis and modeling. In this chapter we used the back propagation neural network model for predicting the average monthly rainfall of Nainital town based on wet bulb, dry bulb, minimum temperature, maximum temperature and wind speed in Nainital town. Our results show that the ANN techniques extremely well with the actual data values as compared to the SVM techniques. From these results we can predict the rainfall for the future.", "Support vector machine | Artificial neural network | Wind speed | Backpropagation | Artificial intelligence | Bulb | Data mining | Computer science | Machine learning | Pattern recognition (psychology) | Meteorology | Geography", "Hydrological Forecasting Using AI", "Environmental Engineering", "Environmental Science", "Physical Sciences", null, true, "gold", null, null, null, 5, 6, "https://openalex.org/W657287764 | https://openalex.org/W1995390392 | https://openalex.org/W2011412119 | https://openalex.org/W2049387654 | https://openalex.org/W2062177351 | https://openalex.org/W2094978308", false, "2025-07-26 00:00:00"], ["https://openalex.org/W2002723459", "https://doi.org/10.1386/tear.5.3.151/1", "https://doi.org/10.1386/tear.5.3.151/1", null, "Extended theatre composition in telematized environments", "article", "en", "2007-09-18", 2007, "Kjell Yngve Petersen", "-", "Kjell Yngve Petersen", "University West | Brunel University of London", "GB | SE", "Technoetic Arts", "Intellect", "1477-965X", "5", "3", "151–170", "In the pursuit of a dramaturgy of telematics as a compositional practice, the author builds a position on technology as externalized technique, develops a dramaturgic strategy with notions of an extended const root = document.currentScript.previousElementSibling;
const {cols, rows, total} = JSON.parse(root.querySelector('script[type="application/json"]').textContent);
const URL_RE = /(https?:\/\/[^\s<>"']+)/g, LONG = 300;
let page = 0, size = 25;
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const linkify = s => esc(s).replace(URL_RE, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
function cell(v) {
  if (v === null) return '<span class="na">null</span>';
  const nested = typeof v === 'object';
  const s = nested ? JSON.stringify(v) : String(v);
  const cls = nested ? ' class="nested"' : '';
  if (s.length <= LONG) return `<div${cls}>${linkify(s)}</div>`;
  return `<details${cls}><summary>${linkify(s.slice(0, LONG))}…</summary>${linkify(s)}</details>`;
}
function render() {
  const pages = Math.max(1, Math.ceil(rows.length / size));
  page = Math.min(page, pages - 1);
  const slice = rows.slice(page * size, page * size + size);
  root.querySelector('tbody').innerHTML = slice.map(r => '<tr>' + r.map(v => `<td>${cell(v)}</td>`).join('') + '</tr>').join('');
  const first = rows.length ? page * size + 1 : 0, last = page * size + slice.length;
  root.querySelector('.info').textContent =
    `rows ${first}–${last} of ${rows.length.toLocaleString()} loaded` + (total === null ? ' (total unknown)' : ` · ${total.toLocaleString()} in table`);
  root.querySelector('.pg').textContent = `page ${page + 1} / ${pages}`;
  root.querySelector('.prev').disabled = page === 0;
  root.querySelector('.next').disabled = page >= pages - 1;
  root.querySelector('.wrap').scrollTop = 0;
}
root.querySelector('thead tr').innerHTML = cols.map(([n, short, full]) =>
  `<th title="${esc(n + ': ' + full)}">${esc(n)}<div class="t">${esc(short)}</div></th>`).join('');
root.querySelector('.prev').onclick = () => { page--; render(); };
root.querySelector('.next').onclick = () => { page++; render(); };
root.querySelector('.size').onchange = e => { size = +e.target.value; page = 0; render(); };
render();
</script>
