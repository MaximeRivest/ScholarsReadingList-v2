<script type="application/json">{"cols": [["id", "str", "Str"], ["title", "str", "Str"], ["year", "int64", "Int64"], ["type", "str", "Str"], ["citations", "int64", "Int64"], ["topic", "str", "Str"], ["abstract", "str", "Str"]], "rows": [["https://openalex.org/W2336646365", "A System to Ass ess the Achievement of Doctor of Pharmacy Students", 2001, "article", 12, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W2189481690", "CONTACT STRESSDISTRIBUTION OF DEEP GROOVE BALL BEARING USING ABAQUS", 2015, "article", 4, "Hermeneutics and Narrative Identity", "This paper examines the contact stress distribution of deep groove ball bearings through analytical and numerical methods. The contact pressure distribution between the ball and the raceway of the bearing 6004 is performed by finite element software ABAQUS. To validate the finite element model, an analytical method using Hertzian contact theory is derived by MATLAB software. Influence of shaft misalignment with different angles namely; 0.20, 0.40, 0.60, 0.80 and 10 is investigated. It is found that finite element analysis can be evaluated the contact stress at any point around the contact surface. It is also concluded that the shaft misalignment lead to decrease the maximum contact stress and increase the contact area between the ball and the raceway of the bearing."], ["https://openalex.org/W2189448675", "X, Liquid E, and Special K - The Abuse of Drugs at Clubs and Raves", 2002, "article", 3, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W2183621551", "Zimbabwes agricultural industry", 2010, "article", 2, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W2426311741", "A Three-Component Extraction Using Biological Molecules: An Undergraduate Organic Experiment for Prepharmacy Students", 2004, "article", 1, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W747058138", "Assessment of convergence between current – voltage characteristics of photovoltaic modules from mathematical calculations and measurements in real conditions", 2014, "article", 1, "Photovoltaic System Optimization Techniques", "Based on equivalent two diode solar cell circuit an algorithm for determining the current voltage characteristics was developed and computer simulation was performed for selected silicon modules. The impact of electrical and thermal parameters of solar cells, area of the module, quality factors, number of cells connected series and parallel and impact of external conditions, especially density of solar radiation and the temperature was included. Measuring verification of current – voltage characteristics of selected PV modules was carried out in real conditions. The measurements of radiation power density on the surface of PV module were included. Obtained results confirmed the results of the calculations. (Assessment of convergence between current – voltage characteristics of photovoltaic modules from mathematical calculations and measurements in real conditions) Streszczenie. Opracowano algorytm wyznaczania charakterystyk prądowo napieciowych na podstawie dwudiodowego schematu zastepczego ogniwa i przeprowadzono symulacje komputerową dla wybranych modulow krzemowych. W rozwazaniach uwzgledniono parametry elektryczne i cieplne ogniw, skladających sie na modul, powierzchnie roboczą modulu, wspolczynniki jakości, liczbe ogniw polączonych szeregowo, jak i liczbe szeregow ogniw oraz wplyw warunkow zewnetrznych, w szczegolności naslonecznienia i temperatury na prace modulow. Przeprowadzono rowniez weryfikacje pomiarową charakterystyk prądowo napieciowych wybranych modulow w warunkach rzeczywistych. Badania uzupelniono o pomiary gestości mocy promieniowania na powierzchni modulu. Uzyskane wyniki pomiarow potwierdzily te otrzymane z obliczen. (Ocena zgodności pomiedzy charakterystykami prądowo – napieciowymi modulow PV na podstawie obliczen matematycznych i pomiarow w warunkach rzeczywistych) Slowa kluczowe: charakterystyki prądowo napieciowe, model dwudiodowy, gestośc mocy promieniowania, parametry elektryczne."], ["https://openalex.org/W2183071848", "Applying the ARCS Model of Motivational Design to Pharmaceutical Education", 2000, "article", 44, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W2184476335", "Performance Analysis of Image EncryptionUsing Block Based Technique", 2015, "article", 1, "Chaos-based Image/Signal Encryption", "In digital communication and multimedia application, security is must for communication and storage of images. Image Encryption is one of the best methods to ensure high security images which are generally used in medical science, military applications. In this paper, an efficient technique is proposed with the help of cipher block chaining (CBC) operation, which is used for image encryption. We test our proposed technique using MATLAB R2013a, it can achieve various image quality parameters such as the mean square error(MSE), peak signal to noise ratio (PSNR) and the overall time taken by the algorithm to perform the process is also computed."], ["https://openalex.org/W2187521559", "Are We Delivering on Our Promise to Society to Assure the Safe Use of Medications? Educating Pharmacists to Continue Adding Value to Health Care. Report of the 2000-2001 Argus Commission", 2001, "article", 2, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W2183738186", "Authenticating Location Based NearestNeighbour Search with Keywords", 2015, "article", 0, "Privacy-Preserving Technologies in Data", "The boom of smart phones brings prosperity to location primarily based services (LBSs) in most social and business sectors, like geo-social networks, merchandizing, marketing and supply. While these LBSs drive new business opportunities, there is a rising necessity from the mobile users to verify the genuineness of service results, such as a list of recommended local restaurants sorted by location and user rating. This issue is even a lot of vital in associate outsourced model where businesses (or data owners) publish their data to a third-party service provider (SP), who handles LBS queries based on these data. As the SP is alleged to manipulate query results in favor of their ―sponsors‖, to sustain growth amid fierce competition, it will provide users not only the results, but also the proof of correctness. We proposed privacy-preserving authentication for location-based range queries. Being the primary work to deal with location privacy in authentication, the techniques can't be applied to alternative queries. As location based publicity and recommendation square measure usually recognized together of the foremost profitable LBS businesses and so provoke the best difference of opinion with their ranking results."], ["https://openalex.org/W2185356433", "Feminist discourses in Chenjerai Hoves and Yvonne Veras selected nationalist narratives", 2013, "article", 0, "African studies and sociopolitical issues", "This paper demonstrated how Yvonne Vera and Chenjerai Hove’s selected works challenge the masculinized dominant nationalist version of history of the Zimbabwean liberation struggle against colonialism by foregrounding the black Zimbabwean woman’s ‘other’ struggles. Such a response to the biased nationalist narration has been to illuminate the other struggles that are women specific. The selected works were aimed at bringing women back in the study of nationalism and national politics. Selected works included but were not limited to the following: Yvonne Vera’s selected short stories such as Why Don’t You Carve Other Animals , Without a Name and Under the Tongue and Chenjerai Hove’s Ancestors and Bones ."], ["https://openalex.org/W2188378280", "Mechanochemical route to synthesize Co3O4/CuO composite nanopowders", 2006, "article", 1, "Copper-based nanomaterials and applications", "/CuO composite nanopowders have been successfully synthesized by heating the precursor obtained via a mechanochemical reaction. The precursor and the nanopowders were characterized using thermogravimetric (TG), X-ray diffraction (XRD) and transmission electron spectroscopy (TEM). Subsequent thermal treatment of the precursor at 550-700 °C in air for 2 h resulted in the formation of Co"], ["https://openalex.org/W2184237524", "Strategic positioning analysis of Ghanas national wood export sector", 2010, "article", 1, "Forest Management and Policy", "Export-led strategies are very crucial to achieving growth and goals of developing and transition economies such as Ghana. As a result, export strategies are being adopted in many developing countries. Although such export strategies might be in place, the deployment of public resources and funds warrant periodic programmatic evaluation. The objective of the study was to assess Ghana’s wood products export sector strategies and performance. Using a combined National Export Strategy Template (NEST) and Balanced Scorecard (BCS) framework, we surveyed the 250 largest wood products manufacturers in Ghana. Overall, respondents indicated there was no comprehensive and well documented export strategy in place. We suggest that public and private sector institutions in the wood export sector coordinate activities to create an enabling environment for Ghana wood products exporters to compete favorably in the international market. The application of a combined National Export Strategy Template (NEST) and Balanced Scorecard (BCS) framework can be used to evaluate wood product export strategies in any geographical or national setting. This approach is a valuable tool that pinpoints strategic strengths and weaknesses. Key words:"], ["https://openalex.org/W2181630675", "Endomyocardial biopsy technique in infants and small children.", 1986, "article", 1, "Transplantation: Methods and Outcomes", "•'. Summary Endomyocardial biopsy is performed when a histolo­ gical diagnosis is required, e.g. in patients with car­ diac failure due to unknown causes, in anthracycline toxicity, and to evaluate cardiac transplant rejection. Right ventricular endomyocardial biopsy has been carried out in 10 infants and small children (average age 14 months); the technical aspects of the pro­ cedure are discussed. Performed by a paediatric cardiologist endomyocardial biopsy in infancy is as safe as a routine cardiac catheterization. S AfTliedJ 1986; &9: 439-440. Transvascular endomyocardial biopsy is used increasingly in adult cardiology. The management of acute rejection episodes in cardiac transplantation is the most imponant indication for this procedure but it has also been used for the evaluation of patients with unexplained heart failure and in the assessment of patients receiving anthracycline cardiotoxic drugs. When done by an experienced cardiologist, endomyocardial biopsy is as safe as routine cardiac catheterization.! Rare complications in adults have induded ventricular tachycardia requiring electroconversion, cerebral embolus, right-sided pneumothorax and haemopericardium from ventricular per­ foration. 2 Less serious side-effeers have included unpleasant sensations, chest discomfon and shon runs of ventricular or supraventricular arrhythmia. Transvascular endomyocardial biopsy has recently been described in children 3 ,4 and we are now investigating children with unexplained cardiac failure using this technique. The technical aspects of the procedure are discussed; the full results of the research projeer will be reponed in due course."], ["https://openalex.org/W2188140499", "The extent of individual responsibility for an independent old age.", 1984, "article", 0, "Aging and Gerontology Research", "Summary Encouragementofa degreeofpersonal responsibility for the maintenance of health by individuals and communities is being increasingly advocated by planners of health care. With the increasing numbers of people reaching old age it is particularly desirable that individuals be madeaware of potential measures that may ensure a reasonably independentold age. In the course of a study to identify the defining charac­ teristics of referred geriatric patients in a teaching hospital, a number of recurring factors emerged that seemed to favour the retention of independence among the subjects studied as controls. These were adequate retirement planning, the timely development of satisfying interests, the prior adoption of a healthy lifestyle, the sensible use of health services and the presence of adequate family and community support systems. Six cases aredescribedto illustratethe presence or absence of such factors, and these are discussed against the background of the respective degrees of responsibility to beex~ted of the individual and of society in securing and maintaining independence in oIa age. S AIr MedJ 1984; 15: 657-659."], ["https://openalex.org/W2188091557", "Balancing Leadership and Management", 2001, "article", 4, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W2185919783", "A palynological study of the genus Smyrnium (Umbelliferae) from Turkey", 2011, "article", 4, "Plant chemical constituents analysis", "In this study, the pollen morphology and exine structure of six taxa of the genus Smyrnium L. (Umbelliferae) were investigated using light microscopy and scanning electron microscopy (SEM). Eight micromorphological characters (pollen shape, apocolpium, mesocolpium, polar length, equatorial width, exine thickness, colpus length and colpus width) of pollen grains of Smyrnium have been identified. The palynological observations revealed that pollen grains of all studied taxa of Smyrnium were prolate in shape and posses tricolporate aperture. Tectal surface sculpture was not a good criterion to identify particular taxa from Smyrnium . The pollen of which is characterized by rugulate, the pollen ornamentation was similar in all studied taxa. In addition the taxa could be included in subrectangular pollen type as classified by Cerceau – Larrival."], ["https://openalex.org/W2185526124", "Changes in Career and Practice of Pharmacy after Obtaining a Degree through an External Doctor of Pharmacy Program", 2002, "article", 2, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W2182655891", "How to develop Taiwans tourism nation brand", 2011, "article", 0, "Diverse Aspects of Tourism Research", "Globalization and the intensification of economic competition are increasing demand for nation brands. Tourism has a significant association with nation brand for the rapidly growing tourism industry in the future. A good nation brand will help a country's economic growth by promoting the tourism industry. In this study, Decision Making Trial and Evaluation Laboratory (DEMATEL) and Maximum Mean De-Entropy (MMDE) are adopted to analyze the factors of tourism as they relate to branding Taiwan. The results show that the ‘festival’ is the most important fact for Taiwan nation brand in perspective of tourism."], ["https://openalex.org/W2186092647", "Estimating the university prestige effect in South Korea’s labor market", 2012, "article", 5, "Hermeneutics and Narrative Identity", "This study investigates whether there exists a “University Prestige” effect in South Korea’s labor market by using the Korean Labor and Income Panel Data. To estimate the degree of this effect, this study employed the unique empirical strategy, the residual analysis. The findings indicate that a university prestige effect exists on earnings, with the wage premium for the “name” of Seoul National University worth more than twice those of Korea and Yonsei Universities. The prestige effect for Seoul National University results in wages that are, on average, 12% higher than that of other universities."], ["https://openalex.org/W2188200265", "Soft ordered Abel-Grassmans groupoid (AG-groupoid)", 2011, "article", 3, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W2186718334", "Chemical composition of the methanolic leaf and stem bark extracts of Senna siamea Lam.", 2013, "article", 6, "Phytochemistry and biological activity of medicinal plants", "The study was conducted to evaluate some chemical constituents of the leaf and stem bark of Senna siamea. Standard methods were used in all the analysis. Preliminary phytochemical screening indicated the presence of flavonoids, tannins, polyphenols, anthraquinones, saponins, and glycosides. Quantitative study of some phytoconstituents showed a significant difference of (p < 0.05) between the leaf contents and that of the stem bark with the exception of tannins. The results of elemental analysis revealed that the levels of potassium (K), sodium (Na), magnesium (Mg) and manganese (Mn) differed significantly (p < 0.05) when leaf contents were compared with that of the stem bark, while nickel (Ni), chromium (Cr), iron (Fe) and copper (Cu) contents were not statistically (p < 0.05) different. This result indicated that S. siamea has great potentials as it contains active pharmaceutical ingredients."], ["https://openalex.org/W90528024", "Modelling And Simulation Of An IntelligentMotion Surface In MEMS", 1970, "article", 0, "Advanced MEMS and NEMS Technologies", "An Intelligent Motion Surface (IMS) consisting of an array of micro-electricalmechanical (MEM) manipulators has been designed and simulated for application in micro-assembly. The array imparts forces on objects being carried on its surface. The appropriate choice of force fields is shown to cause parts placed on the array to be moved in manners that are useful and appropriate to assembly operation. A simulator associated with a user interface was built to explore the practicability of programming a miniature assembly bench. A computational geometry approach was used for modeling and implementation of the simulator in order to model both the operation of the motion surface and to support the user in programming the surface to operate in a specific manner. Mathematical simplifications were applied to speed up the execution of the simulation. The paper describes the results of experiments on primitive assembly operations and some limitations of the approach."], ["https://openalex.org/W56903138", "Experimental Investigation Of The SeismicReponse Of Rubble-mound Breakwaters", 2000, "article", 0, "Coastal and Marine Dynamics", "Rubble-mound breakwaters are subject not only to wave action but, also, to other types of environmental loading, such as earthquakes. High seismic activity combined with soft foundation soil can lead to large settlements and even to failures of these structures. This paper reports on the experimental investigation undertaken to study the behaviour of rubble-mound breakwaters under seismic loading. Two models were built: the first one was designed to sit on a rigid bed, and the second on a yielding base of loose sand. Input earthquakes were of horizontal acceleration with increasing magnitude at consecutive tests. Measurements of hydrodynamic pressures and accelerations were taken. It was found that in general rubble-mound breakwaters resting on rigid bed are quite seismic resistant structures. Careful placement of the armour units provides extra strength to the armour layer as well as to the whole mound. The hydrodynamic forces on the faces of the break water, although small compared to the inertia effect on the structure, should be taken into account since they tend to modify the fundamental period of oscillation of the rubble-mound. Extra care should be taken during the design phase whenever rubble-mound breakwaters are to be placed on soft soil in areas of high seismicity."], ["https://openalex.org/W1525514410", "Methodology and Application of Oneway ANOVA", 2013, "article", 78, "Statistical Methods and Applications", "This paper describes the powerful statistical technique one-way ANOVA that can be used in many engineering and manufacturing applications and presents its application. This technique is intended to analyze variability in data in order to infer the inequality among population means. The application data were analyzed using computer program MATLAB that performs these calculations."], ["https://openalex.org/W2139785897", "Antibacterial properties of the leaf extracts of Vernonia amygdalina, Ocimum gratissimum, Corchorous olitorius and Manihot palmate", 2011, "article", 5, "Natural Antidiabetic Agents Studies", "The antibacterial potency of ethanol, acetone and chloroform leaf extracts of Vernonia amygdalina, Ocimum gratissimum, Corchorous olitorius and Manihot palmata were screened against ten bacterial isolates using the agar-well diffusion method. The leaf extracts were screened for antibacterial activities at 25 mg/ml concentration. Antibacterial efficacy of extracts against the bacterial isolates was indicated by the appearance of clear zones of inhibition around the wells. The extracts (except that of Corchorous olitirious), showed inhibitory activities against Bacillus cereus, Salmonella typhi, Staphylococcus aureus, Shigella dysenteriae and Escherichia coil with zones of inhibition ranging between 2 and 20mm. Result of the antagonistic activity of the extracts compared favourably with the activity of standard antibiotics. The rate of killing by the extracts was carried out, using 50 mg/ml. It was observed that the number of bacterial cells was decreasing as the time of interaction between the extract and the bacteria increased until all cells were killed. Phytochemcial screening of the extracts revealed the presence of some bioactive components like alkaloids, saponins, tannins, anthraquinones, steroids, flavonoids and cardiac glycosides. These properties determine the antimicrobial potential of the leaf extracts."], ["https://openalex.org/W1917650751", "Political economy of the new slave trade in Africa", 2012, "article", 0, "Colonialism, slavery, and trade", "A macro analysis of various inquiry into the nature and causes of Africa’s crises may revealed a continent placed on perpetual slavery. From trans-Atlantic slave trade to colonialism; from colonialism to flag independence and Neo Colonialism; from trade imperialism to human trafficking; from the rampaging momentum of globalization to erosion of Africa culture and communal morality; from ‘Tokunbo’ Syndrome and currencies; Africa seems to be on a verge of internationallyinspired perpetual servitude. The costs of these old and modern vices are enormous and the task of salvaging them is not less so. While the paper exposes the two divides, it goes to argue that, the actualization of the New International Economic Order (NIEO) remain a must for Africa as a continent, if she must survive the present socio- economic and political disempowerment eating deep to her efforts at meeting aims and objectives of the millennium Development Goods(MDG)."], ["https://openalex.org/W2132685610", "Hot-Air Textuality: Literature after Jerome Mc- Gann (2005)", 2009, "article", 1, "Poetry Analysis and Criticism", "I argue that McGann’s Radiant Textuality (2001), shaped by postmodern literary theory and the nature of electronic texts, is wrong-headed–that McGann’s valorization of the instability of texts and interpretation leads to poor results. It concentrates on three examples: a scanner experiment that leads to the dictum that “no text is self-identical,” a “deformance” of Stevens’s “The Snowman” that results in the claim that the poem is noun-heavy, and a discussion of Joyce Kilmer’s “Trees” that suggests it is a good modernist poem about sex. I claim that, on the contrary, texts are remarkably stable, Stevens uses only an average number of nouns, and “Trees” can be better understood by focusing more closely upon and altering its language. In all three cases, McGann’s approach, because it so consistently points away from the text, provides little insight into the nature of text and interpretation, while a text-centered, language-centered approach is much more illuminating."], ["https://openalex.org/W168480141", "AIDS 101: From Abstinence to Zidovudine", 2001, "article", 0, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W2141364260", "A Comparison of Pharmacoeconomics Topics in Journals and Entry-Level Pharmacy Degree Curricula1", 2001, "article", 2, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W2167918159", "Effects of introducing periodical polymer gratings on the solar cell", 2009, "article", 0, "solar cell performance optimization", "Effects of the light-collecting solar cell with high polymer reflecting gratings and experimental accomplishment of periodical gratings on the solar cell surface are studied. It mainly discusses the way and advantage to enhance the solar cell efficiency by using holographic interference lithography to produce high polymer reflecting gratings on the solar cell. Based on the easy processing method, the theoretically calculated open-circuit voltage, Voc, can be raised from 2.62 - 3.618 V, and the maximum voltage, Vm, increases from 2.5 - 3.5 V for a standard commercial Si solar cell. From experiment, the power conversion efficiency for the solar cell is also enhanced from 27 - 35.67%, corresponding to the relative increase of efficiency up to 32.1%. The theoretical analyses are in good agreement with the experimental findings."], ["https://openalex.org/W2283374966", "Structural analysis of the main apse vault of St. George of Greeks Cathedral built c.1390 at Famagusta, Cyprus", 2003, "article", 0, "Masonry and Concrete Structural Analysis", "The foundation date of the Cathedral Church of St. George of the Greeks [l] can be dated with a hgh degree of probability to the end of the XIV century. This magnificent building was built on the edge of the Greek quarter, which occupied almost the whole of the southern end of the city of Farnagusta. The history says that this building was abandoned after 157 1, as it had suffered severely from the fire of the battery established by the Turks on the rock to the south-east of the harbour and the marks of cannon-balls can be seen on the walls of the apse. The building was built so strong that it could stand any kind of battering and earthquakes to a certain extent. A detailed survey was done to find out the building techque and materials used, including the quarry where the stones were cut, the chemical composition and the strength of the stones and mortar used in between. A very sophisticated structural analysis [2] was done to find out the strength of the main vault, its behavior and reactions to external forces, especially to earthquake and cannon balls. 1. Location Cathedral Church of St. George of the Greeks is situated in the south east part of the town of Famagusta on the east cost of the Cyprus island, located at the eastern part of Mediterranean sea. Its exact position is 35'07.2' N, 33'56.7' E."], ["https://openalex.org/W144694350", "FRP Bolted Flanged Connections Subjected To Lon-Gitudinal Bending Moments", 1970, "article", 2, "Engineering Structural Analysis Methods", "Bolted flanged connections for fiber reinforced plastic (FRP) pipes and pressure vessels are of great importance for any user of FRP material in fluid containment applications. At present, no dimensional standards or general design rules exist for FRP flanges. Most often, flanges are fabricated to dimensional standards for metallic flanges without questioning their applicability to FRP materials. Flanges in FRP piping systems are often subjected to external, longitudinal bending moments of considerable magnitude. In piping systems, such bending moments are usually caused by thermal expansion of the piping components themselves, or by thermal expansion of pressure vessels and other equipment to which the piping system is connected. Such bending moments are of utmost importance on FRP piping systems due to the relative stiffness of most FRP materials. None of the pertinent design codes, neither the ASME Code, Section X, Fiber-Reinforced Plastic Pressure Vessels, nor the ASME/ANSI B31.3 Code for Chemical Plant and Petroleum Refinery Piping, contain design rules for external bending moments on FRP flanges. In previous papers by the same author, the effect of such external bending moments on metallic flanges were investigated and compared with a design criterion listed in the ASME Code, Section III, Nuclear Power Plant Equipment, based on an equivalent internal pressure. An analysis of the stresses in the flange-bolt assembly due to external bending moments was proposed and results were compared with flange thicknesses using the equivalent internal pressure. Calculated stresses were als6 compared with results from strain gage measurements on a test pressure vessel. To verity stress values in FRP flanges under external bending, a test rig is being used to perform strain gage measurements on a test pipe with a bolted flanged connection, subjected to internal pressure and longitudinal bending."], ["https://openalex.org/W2235844055", "Vertical Wall Breakwater Stability", 1970, "article", 0, "Coastal and Marine Dynamics", "The calculation of the minimum required widths of a concrete vertical wall breakwater with respect to the stability criteria of overturning, sliding and settling is presented in the paper. It is assumed that the vertical wall breakwater is built on a foundation and located in the conditions for non-overtopping and overtopping by incident waves. In the analysis of wave forces on the vertical wall breakwater a distinction is made between the action of nonbreaking, breaking and broken waves. The disturbing nonbreaking wave forces are calculated using Sainflou's and Molitor's methods. The breaking wave forces are calculated according to the method developed by Minikin, and the broken wave forces according to the method proposed by the CERC (Coastal Engineering Research Center). Using the derived expressions and appropriate values of the safety factor for overturning and sliding, and allowable normal stress of the foundation for settling, and applying the assumed environmental conditions, it is possible to determine directly the minimum required width of a vertical wall breakwater. A numerical example in which the minimum required widths of a vertical wall breakwater in different wave load conditions are calculated according to the analyzed stability criteria is also given in the paper."], ["https://openalex.org/W566657909", "LEVEL OF ORGANOCHLORINE INSECTICIDE RESIDUES IN KEITT VARIETY OF MANGO (MANGIFERA INDICA) FRUITS FROM THE DANGME WEST DISTRICT OF GHANA", 2012, "article", 0, "Hermeneutics and Narrative Identity", "A thesis submitted to the College of Science, Kwame Nkrumah University of Science and Technology in partial fulfilment of the requirement for the award of Master of Science degree in Environmental Science, October-2012"], ["https://openalex.org/W2474534358", "An Introduction to Meta-Analysis", 1994, "article", 2, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W2462703475", "Inhaled Anti-Inflammatory Agents in Childhood Asthma: Theory and Practice", 1995, "article", 0, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W2467567928", "Noninvasive Ventilatory Support in Pediatric Respiratory Failure", 1995, "article", 7, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W2472540463", "Implementing A Respiratory Care Protocol Service: Steps and Impediments", 1999, "article", 1, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W2473388966", "The Rationale for Respiratory Care Protocols: An Update", 1998, "article", 12, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W2472272059", "PFT Corner #51—Can't or Won't?", 1994, "article", 0, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W2502337074", "The history of Intubation, Tracheotomy, and Airway Appliances", 1999, "article", 6, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W2484642387", "Inspiratory Flow Patterns: The 'Shape' of Ventilation", 1993, "article", 4, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W2484175042", "A 47-Year-Old Woman with Cirrhosis and Hypoxemia", 1996, "article", 0, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W2482298654", "Airway Complications of Instrumentation: A Physiologic Approach", 1995, "article", 0, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W2514921546", "Abnormal Chest Radiograph after Central Line Placement", 1993, "article", 4, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W2515048016", "Medical Direction of Respiratory Care: Past and Present", 1998, "article", 0, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W2516543563", "A 56-Year-Old Smoker with Dyspnea", 1999, "article", 0, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W2525695044", "Stewart'S Strong Ion Difference Approach to Acid-Base Analysis", 1999, "article", 3, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W2524241643", "PFT Corner #48- An Uncommon Variant of an Upper-Airway Disorder", 1993, "article", 0, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W2551638790", "Optoelectrical properties for CuGaSe₂layers grown by hot wall epitaxy", 2008, "article", 0, "Chalcogenide Semiconductor Thin Films", "CuGaSe2 (CGS) layers were grown by the hot wall epitaxy method. The optimum temperatures of the substrate and source for the growth turned out to be 450 and 610 o C, respectively. The CGS layers were epitaxially grown along the direction and retained the initial mole fraction during the layer growth. Based on an absorption measurement, the band-gap variation of CGS was well interpreted by Varshni's equation. But, the band-gap energies at low temperatures were large values unlike that of other CGS. From a low-temperature photoluminescence experiment, sharp and intensive free- and bound-exciton peaks were observed. By analyzing these emissions, a band diagram of the observed optical transitions was obtained. The I-III-VI2 compounds are known to be ternary analogues of the II-VI compounds. These compounds crystallize with the chalcopyrite structure, which is closely related to the zinc structure (1). These materials have received considerable attention in recent years because of their applications in photovoltaic devices (2, 3). They can be used as environmental-friendly materials for the Cd- free buffer layer as an absorbant of solar cells (4, 5). Among these compounds, copper gallium selenide (CuGaSe2, CGS) has an energy gap of 1.68 eV at room temperature and it is expected to be a promising material for red-light- emitting devices. Currently, solar cells based on CGS have achieved efficiencies of 9.5% and 9.7% as absorber of thin film and single crystal shapes, respectively (6, 7). Despite this technological progress, many of the fundamental properties of CGS are still not fully understood. But, the physical properties strongly relate to native defects due to deviations of the stoichiometry. Therefore, a reduction of the stoichiometry deviations during crystal growth is required. As such, CGS layers have been grown by many different techniques such as metalorganic chemical vapor deposition (MOCVD), metalorganic vapor phase epitaxy (MOVPE), physical vapor deposition (PVD), RF sputtering, and flash evaporation (8-12). In fact, hot wall epitaxy (HWE), which has been used to grow a high-purity ZnSe epitaxial layer at low temperatures (13), is one of the better methods for CGS growth. Thus, HWE has been especially designed to grow epilayers under the condition of near thermodynamic equilibrium (14). But, CGS growth by the HWE method has rarely been reported before now. In this paper, the CGS layers, which could be used as the absorbant of a solar cell, were grown on a GaAs substrate by the HWE method. The grown CGS layers were investigated for their structural and optical characterization by means of X-ray diffraction (XRD), photoluminescence (PL), and absorption spectroscopy. From these results, a discussion of the structural and optical properties of the CGS layers is given."], ["https://openalex.org/W2557924586", "Using First-Year Students as Standardized Patients for an Objective Structured Clinical Exam for Third-Year Pharmacy Students", 2001, "article", 7, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W2602265975", "Respiratory Care in the Adult Non-ICU Setting", 1997, "article", 1, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W2742396719", "CARBON ISOTOPE OSCILLATIONS THROUGH THE MARWAR SUPERGROUP, WESTERN RAJASTHAN", 2001, "article", 0, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W2765994287", "Acute Respiratory Distress Syndrome in Pediatric Patients: Redirecting Therapy to Reduce Iatrogenic Lung Injury", 1995, "article", 8, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W2765717740", "Flexible Endoscopy in the Diagnosis and Management of Neonatal and Pediatric Airway and Pulmonary Disorders", 1995, "article", 4, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W2766220555", "Extracorporeal Life Support and High-Frequency Oscillatory Ventilation: Alternatives for the Neonate in Severe Respiratory Failure", 1995, "article", 1, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W2939012452", "Investigating the links between the use of the internet, value co-creation, and customer satisfaction in the banking sector", 2020, "article", 3, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W2167243688", "Physiographic Mapping of Siwani Area, Bhiwani District, (Haryana) Using Remote Sensing and GIS Techniques", 2013, "article", 1, "Hermeneutics and Narrative Identity", "Physical geography (also known as geosystems or physiography) is one of the two major subfields of geography. Physical geography is that branch of natural science which deals with the study of processes and patterns in the natural environment like the atmosphere, hydrosphere, biosphere, and geosphere, as opposed to the cultural or built environment, the domain of human geography. Within the body of physical geography, the Earth is often split either into several spheres or environments, the main spheres being the atmosphere, biosphere, cryosphere,geosphere, hydrosphere, lithosphere and pedosphere. Research in physical geography is often interdisciplinary and uses the systems approach."], ["https://openalex.org/W3197206107", "IMPACTS OF INFORMATION AND COMMUNICATION TECHNOLOGIES ON MEDICAL CARE - AN OVERVIEW OF ICT ASSOCIATION WITH MEDICAL DOCTORS", 2018, "article", 0, "Hermeneutics and Narrative Identity", "This study aims to investigate the association of ICT tools with medical doctors for their professionals. A total of 427 respondents from Tamil Nadu state were surveyed using questionnaire method. The aim of this research is to examine the adoption of ICT by medical doctors in the field of medicine to enhance their profession. Since, India is one of the fastest developing nations in the world; India has understood the potential of diffusion of ICTs in the e-health for its rapid growth. This study also found that age, gender, education and occupation has statistically significant association among the adoption of Information and Communication Technology"], ["https://openalex.org/W207810702", "The Social Rights of Citizenship and the Australian Welfare State: Changes in Income Support for People with Disabilities 1945-2004", 2005, "article", 1, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W2103026437", "Water resources management and sustainabledevelopment in Sudan", 2010, "article", 6, "Hermeneutics and Narrative Identity", null], ["https://openalex.org/W2468639303", "Physico-Chemical Analysis of Ash of Some Medicinal Plants Growing in Uttarakhand, India", 2010, "article", 22, "Hermeneutics and Narrative Identity", "Physio-chemical analysis of ash of Quercus infectoria, Cassia fistula, Tinospora cordifolia, Butea monosperma and Cedrela toona trees parts were carried out for present study. Atomic Absorption Spectroscopy (AAS) was used for quantitative estimation while chemical methods applied for qualitative estimation of minerals in plants ash. It is found that C. fistula, T. cordifolia, Q. infectoria and C. toona showed maximum concentration of potassium while, B. monosperma showed maximum results with magnesium. (Nature and Science 2010;8(6):88-91). (ISSN: 1545-0740)."], ["https://openalex.org/W4289964355", "NURSING PRACTICE DECISIONS IN EMERGENCIES: a course and how it was designed", 1978, "article", 1, "Disaster Response and Management", null], ["https://openalex.org/W101818770", "Quality Assurance in Competitively Tendered Contracts", 2000, "article", 22, "Auction Theory and Applications", "Three contractual forms used in the competitive tendering of public transport services are compared. The conclusions are: (i) Under the full cost contract the operator must make strictly positive profit in order to maintain quality. (ii) With the net cost contract the desired level of quality can be achieved with a lower transfer to the operator, if the revenue risk is not too high. (iii) Incentive contracts with measured quality included as a variable must include risk compensation for imprecise performance measurements. It is argued that the predictions of the model explain some features of actual tendering contracts."], ["https://openalex.org/W2187828369", "Pharmacist Perceptions of Situated Learning in an Internet-Based Continuing Education Program", 2000, "article", 7, "Problem and Project Based Learning", null], ["https://openalex.org/W1584897963", "The Need for a Broadened Definition of Faculty Scholarship and Creativity", 2002, "article", 29, "Health and Medical Research Impacts", null], ["https://openalex.org/W3203552846", "THE USE OF RESISTIVITY TESTING FOR QUALITY CONTROL OF CONCRETE MIXTURES", 2020, "article", 0, "Geophysical Methods and Applications", null], ["https://openalex.org/W3213122519", "A financial Health Analysis of Selected Companies from Nifty 50 using Altman Z-Score Model", 2021, "article", 0, "Financial Distress and Bankruptcy Prediction", "India has become the world's fastest growing major economy and is expected to be one of the world's top three economic powers for the next 10 to 15 years, backed by its strong and largest democracy. In this paper Researcher has randomly selected five companies from Nifty 50 and period of study is four financial years. Objectives of the study is to check financial status of selected companies and compare Z-Score among randomly selected Nifty 50 Companies. Altman Z Score model has been used for analysis of study. In last Researcher has found that only one Britannia Industries Ltd. has come under safe zone, two companies’ vis Mahindra and Mahindra Ltd. and Shree Cement Ltd. have in Grey Zone and remaining two vis Tata Steel Ltd. and Bharti Airtel Ltd. have in Distress Zone. So, it can said that these two companies need to check their financial position and improve their sales and working capital position to come in good Z Score position."], ["https://openalex.org/W2748632487", "The Cognitive Models of Change Leaders", 2003, "article", 2, "Organizational Learning and Leadership", "The models, schemas, recipes and mantras, which leaders of change bring to the projects they manage, are relatively little understood. Here the nature of these structures is explored from the perspective of mental model theory. The positive potential of simplified representations of business problems is contrasted with the negative value of certain long-cherished and counterproductive recipes for action. It is suggested that many managers, when initially questioned about the nature of the cognitive structures they bring to their work, tend to make excessive claims for the stability and internal consistency of their personal repertoire of available material. The popular distinction between tacit models, as \"undiscussable and indescribable\" phenomena (Argyris and Schön 1996), is compared with a more dialogic view of managers as men and women subject to frequent changes of stance as they engage with significant colleagues. Simple links between personality types or cognitive style and mental models in use are challenged and it is suggested that a leader's repertoire of models and heuristics is often extended well beyond the zones of comfort that may be inferred from personality theory. Management and cognitive competences are advocated as potential limiters of models in use and facilitators of change. Classification of the mental models of leaders is attempted in order to illustrate the value that individual models may have as narrational, ego-defensive, processual and discursive material. The depth, superficiality and motivation behind certain models are discussed, as is the question of how easily leaders of change can adapt these different types of structure as a result of the feedback they get from the success or failure of their projects. This paper forms part of an ongoing study of senior managers who are leading organizational change in the public and private sectors."], ["https://openalex.org/W284858966", "Paraprofessionals: A Focus on Interpersonal Skills", 1981, "article", 1, "Collaborative Teaching and Inclusion", null], ["https://openalex.org/W2740772911", "Designing social capital sensitive participation methodologies", 2004, "article", 41, "Social Capital and Networks", "Participation methodologies have been evolving and improving since first gaining international recognition in the 1960s. Despite these improvements there are still genuine concerns and criticisms of participation, particularly surrounding its application and effectiveness. The recent advent of social capital theory provides another lens for the analysis and ensuing improvement of participation methodologies. Social capital theory encompasses the notion that our social relationships are productive in nature; that is, ‘capital’. The theory describes the various dimensions of the complex social world that enable this capital. Both participation and social capital theories have many similarities; both are poorly defined, conceptualized and operationalized in both debate and application. The two concepts are highly context specific and highly complex. Individually, the concepts still require further analysis to answer key questions, particularly about appropriate application. Jointly, little work has been done to identify the impacts that they have on each other and particularly how social capital benefits can be maximized in participatory methodologies. This study explored the theories with extensive literature reviews of each concept before breaking new ground with an integration of the two theories. This synthesis was then applied to a case study; an IFAD funded project in Zimbabwe. The project’s participatory methodology was analysed through the lens of social capital theory. The participatory methods analysed included; focus groups, public meetings, information dissemination and questionnaires. The analysis highlighted the potential importance of social capital sensitive participatory methodologies. Despite the efforts of the project development team, there were numerous oversights or missed opportunities where the project and community could have benefited from variations to the methodology used. It was found that by providing opportunities for repeat interaction in the participatory methodologies, social capital benefits could be maximised. It was also stressed that any social capital sensitive participatory methodology is by definition local context specific and application of such methods require careful analysis of the local context in which it is being applied."], ["https://openalex.org/W2183446462", "Mobility Degradation and Total Series Resistance of Cylindrical Gate-All- Around Silicon Nanowire Field-Effect Transistor", 2012, "article", 2, "Semiconductor materials and devices", "Multi gate Si-based devices such as tri-gate or gate-allaround (GAA) nanowire (NW) Metal Oxide Semiconductor Field Effect Transistors (MOSFETs) are promising candidates for aggressively scaled CMOS due to their excellent electrostatics control. However, the carrier velocity i.e. mobility of carriers in these devices is generally degraded due to quantum–mechanical confinement effects. In this paper, the mobility-degradation factor and the series resistance of cylindrical gate-all-around silicon nanowire field-effect transistor (SNWFET) is discussed using the same mobility degradation model as in the case of conventional MOSFET. The calculation is done by defining voltage as a function of the saturation drain current evaluated from devices with various dimensions. The calculated mobilitydegradation factor is an order of magnitude larger than those of other conventional MOSFET. This exhibit the more possibility of interfaces scattering in the strong inversion condition, while the gate of presented model turn off the electron channel. The calculated series resistance is mostly due to the crowding of the electron flow along the sidewall of the n+ contact."], ["https://openalex.org/W2988348505", "Formative Assessment Using Library of Congress Documents", 2015, "article", 3, "Information Systems Education and Curriculum Development", null], ["https://openalex.org/W2947119780", "Leaders’ Adaptation to Adversity in a Volatile, Uncertain, Complex, and Ambiguous Business Environment - A Critical Realist View", 2018, "article", 3, "Leadership, Courage, and Heroism Studies", "Recent studies have shown that a significant number of leaders are not able to\r\nsuccessfully adapt to adversity within today’s increasingly volatile, uncertain, complex,\r\nand ambiguous business environment. Adversity is one of the most challenging\r\nleadership issues to date, but fragmented research results prevent researchers and\r\npractitioners from forming a comprehensive view of the factors that influence leaders’\r\nadaptation to it.\r\nThis study addresses three questions in respect of the above research gap, namely:\r\nWhat is the nature of adversity? How can leaders adapt to adversity? What are the\r\nmain factors influencing leaders’ task adaptive performance?\r\nThe study shows that burnout is increasingly recognised as adversity in leadership\r\ntriggered by volatile, uncertain, complex, and ambiguous conditions. Leaders affected\r\nby a high level of the impact of adversity (magnitude, probability and relevance) and a\r\nlow level of sense-making of adversity have increased burnout risks. Another\r\ncontribution of this study is that leaders knowing this explanation are better prepared\r\nto prevent, anticipate or deal with adversity in order to avoid negative effects, and to\r\nsee the positive side of adversity as a chance for learning and personal growth. There\r\nis also evidence that a higher level of burnout can decrease the leaders’ psychological\r\ncapital.\r\nThe main theoretical contribution of this study is that the mechanisms of psychological\r\ncapital and authentic leadership can improve leaders’ task adaptive performance.\r\nThese mechanisms are affected by the condition of burnout. Whereby a high level of\r\nthe mechanism of the impact of adversity can directly decrease task adaptive\r\nperformance.\r\nFurther conditions which affects these mechanisms are sense-making of adversity,\r\nself-reflection and conscientiousness. The limitations of these findings are also\r\ndiscussed and the possible directions for future research are outlined."], ["https://openalex.org/W655299894", "Environmental Externalities of Motor-Vehicle Use in the US", 2000, "article", 128, "Energy, Environment, and Transportation Policies", "This paper reviews the methods, data, results, uses, and limitations of several recent studies of the external environmental damage costs of motor-vehicle use in the US. Although there remains considerable uncertainty in all stages of the damage-cost modeLling approach, the results can nevertheless enrich cost-benefit and pricing analyses. Towards these ends, estimates of external costs have been used in comparisons of the social costs of different transport technologies or modes, in evaluations of the trade-offs between different kinds of environmental impacts, and in analyses of motor-vehicle pricing and land-use policies."], ["https://openalex.org/W2111949076", "Enhancing Metacognitive Skills Using Written Narratives: An Analysis of Pharmacy Student's Negative Health Behaviors in a Behavioral Pharmacy Class", 2002, "article", 7, "Education and Critical Thinking Development", null], ["https://openalex.org/W3211531726", "EXPLORING THE CONTRIBUTION OF MEDIA IN ADVANCING SUSTAINABLE DEVELOPMENT GOALS IN INDIA", 2021, "article", 0, "Climate Change Communication and Perception", "Media is an important participant in regard to societies reaching the goals of development-both as a contributor and a beneficiary. News media can play an important role in floating awareness about the Sustainable Development Goals (SDGs). Media in all its forms has a crucial role to play in the development agenda to ensure that citizens are well informed. The media has important roles to play, to inform, to educate, and to provide a platform for public debate and discussion. It could serve as catalyst for citizens’ empowerment and help to hold government and authorities to account. Third world countries like India have been facing odd situations in terms of poverty, environment, health, politics, and education. There have been efforts by the government and non- government agencies to sensitize the citizens and to make them acknowledge the programs intended at improving their socio-economic welfare. Communication is a vital tool in mobilizing people in the direction of the participatory process which in turn makes development an achievable goal. The present paper is an attempt to provide comprehensive information and explore the significance of the role of media as a powerful tool towards achieving the Sustainable Development Goal in India. The qualitative approach is conducted to explore deeper insight of SDGs understanding from news media. This study found that not all SDGs are informed well. Only several SDGs are framed based on the concern of public policy."], ["https://openalex.org/W2304138311", "Central Extensions of the Lie Algebra of Symplectic Vector Fields", 2006, "article", 4, "Algebraic structures and combinatorial models", "For a perfect ideal h of the Lie algebra g, the extendibility of continuous 2-cocycles from h to g is studied, especially for 2-cocycles of the form h(X,·),·i on h with X 2 g, when a g-invariant symmetric bilinear form h·,·i on h is available. The results are then applied to extend continuous 2- cocycles from the Lie algebra of Hamiltonian vector fields to the Lie algebra of symplectic vector fields on a compact symplectic manifold."], ["https://openalex.org/W2090880326", "Do Androids Pulverize Tiger Bones To Use As Aphrodisiacs?", 1995, "article", 1, "Plant and animal studies", "On Uncompahgre and Red Cloud Peaks in the San Juan mountains of Colorado, the Uncompahgre fritillary butterfly is becoming extinct. The Uncompahgre fritillary never should have been there in the first place. The climate was perfectly habitable 10,000 years ago during the Ice Age, but the butterfly failed to retreat with the glaciers and ended up trapped in the mountains, thousands of miles from its proper arctic climate. Facing several consecutive years of warm weather, the butterfly has steadily climbed the mountain in search of cooler climes. Now it has reached the"], ["https://openalex.org/W119289964", "Maximal Degenerate Representations of SL(n+1,H)", 1999, "article", 8, "Advanced Algebra and Geometry", "The innitesimal method is applied to study some maximal degenerate representations of SL(n + 1;H). The irreducibility and unitariz- ability of these representations are determined and the composition series is given in the reducible case. The existence of intertwining operators is established for the dieren tiated Lie algebra representations. On the group level, the intertwining operators are given by an explicit integral formula."], ["https://openalex.org/W2608273952", "Sustainable Communities: Through the Lens of Cherokee Youth", 2016, "article", 2, "Indigenous Health, Education, and Rights", null], ["https://openalex.org/W2569662151", "The Effectiveness of Center High Mounted Stop Lamps - A Preliminary Evaluation", 1987, "article", 12, "Advanced DC-DC Converters", null], ["https://openalex.org/W2577602180", "An Evaluation of Center High Mounted Stop Lamps Based on 1987 Data", 1989, "article", 21, "Seismic Performance and Analysis", null], ["https://openalex.org/W220271723", "Implications of Inservice Training Requests from Sheltered Workshop Paraprofessionals", 1981, "article", 2, "Collaborative Teaching and Inclusion", "In recent years, increased attention has fodegree, with the direct line staff, that is, cused on the vocational training programs those personnel functioning in paraprofes for mentally retarded adolescents and sional roles having maximum daily contact adults. This interest was accentuated by legwith the clients. Third, the perceived train islation providing for increased vocational ing needs of direct line staff would provide rehabilitation of the mentally retarded. The an indirect measure of the needs and issues Rehabilitation Act of 1973, the Education confronting sheltered workshop facilities in for All Handicapped Children Act of 1975, general. and the Vocational Education Amendments Cobb, Reid, and Whorton (1977) corrob of 1976 hav aining needs and service needs. Inherent in the study's intent roles belies the importance of their current were three biases. First, the existence of a and potential contribution, network of sheltered workshops indicated that efforts should be directed toward the"], ["https://openalex.org/W211308452", "In Defense of Memorization: The Role of Periodization in Historical Inquiry", 2011, "article", 5, "Educator Training and Historical Pedagogy", "I 'm a master packer. At least my wife tells me I am, and I'm happy to believe her. Last summer, anticipating the thousand-mile drive from southern California to Colorado, I packed our Sienna so that everything had its logical place, from the DVDs to the audio books, from the beef jerky to the bottled Starbucks mocha. Of course, at first I had to explain to everyone else where things were, since what seems logical to me isn't intuitive to my family. But once they understood my system, everything was easy to find and, after being used, went back to its well—defined home. While it was a relatively modest element of the journey—certainly not as important as a detailed map or good brakes—it required advance planning and made the journey easier and more enjoyable."], ["https://openalex.org/W51091193", "L{sub p}-estimates of the solution of the Dirichlet problem for second-order elliptic equations", 1998, "article", 0, "Differential Equations and Boundary Problems", "The Dirichlet problem for second-order divergence-form elliptic equations with coefficients continuous in a closed domain is considered. A necessary and sufficient condition on the boundary of a compact domain ensuring the unique L{sub p}-solubility of the problem in question and also a corresponding coercive L{sub p}-estimate for all p>1 are obtained."], ["https://openalex.org/W2112900714", "Beyond mediation: thinking the computer otherwise", 2009, "article", 6, "Public Relations and Crisis Communication", "Whatever Media Studies 2.0 involves, one thing is certain, there is a need to confront and deal with new technologies, most notably computers and computer networks. Despite the fact that the discipline has largely marginalized these innovations, there has been some effort to incorporate the computer into both the theories and practices of media studies. This has been accomplished, at least in the United States, through the development of what is now called computer-mediated communication (CMC). CMC, which effectively understands the computer as a medium of human communication, does not necessarily institute a significant paradigm shift in media studies but accommodates the new technologies to existing structures, methodologies, and models. This essay contests and critiques this approach. It reviews the development of CMC, identifies its structural limitations, and provides an alternative understanding of the computer that has the potential to reorient the discipline in a much more radical fashion."], ["https://openalex.org/W3093519922", "ONLINE TRAINING OF UNIVERSITY STUDENTS AS TAEKWONDO REFEREES DURING A CORONAVIRUS PANDEMIC", 2020, "article", 2, "Physical Education and Training Studies", "COVID-19 caused the suspension of most sports events and the dismissal of all athletes, coaches, sports specialists, officials (referees and judges) and other persons involved in the field In recent decades technological progress and digitalisation have undergone substantial development, thereby providing excellent opportunities for online training In times of social distancing, hardware and software solutions have gained prominence as appropriate and necessary means of remote attendance for participants in educational events Referees have become an integral part of modern sports as the officials upholding the proper application of the competition rules, fair play and the observance of the code of ethics during events Considering the pandemic situation, which renders the conducting of attended events impossible, as well as the key role of sports officials, we set out to organize the training of officials online The target group for the study consisted of students from the Taekwondo Coach specialty in the faculty of the Vassil Levski National Sports Academy, given their specific knowledge and involvement in the sport The implementation of the project showed that online training was a suitable method for the reinforcing, enriching and improving of the competencies of officials in Bulgaria during an ongoing pandemic In the field, distance training proved to be a promising practice for the conducting of all theoretical and some practical classes for the officials in the country The studies conducted allow us to conclude that during the COVID-19 pandemic it is possible to use modern technical means and methods successfully in order to involve athletes, coaches and officials with sports activities The results of this project provoke us to re-assess the policies and methods applicable to the training of officials at the national and the international level"], ["https://openalex.org/W245549209", "Professional Dilemmas for teachers of Mentally Retarded Children", 1983, "article", 1, "Collaborative Teaching and Inclusion", null], ["https://openalex.org/W3190843759", "Endometrite crônica e infertilidade", 2021, "article", 0, "Ovarian function and disorders", null], ["https://openalex.org/W229406245", "Selecting, Training, and Using Surrogate Parents: A Preliminary Discussion", 1981, "article", 0, "Child Welfare and Adoption", "Federal regulations (P.L. 94-142, §121a.514) limited periods of time, the former group require that local education agencies assign usually has more direct involvement with surrogate parents to those handicapped chilnonhandicapped children than with handi dren for whom actual parents or legal capped ones. They also normally interact guardians cannot be identified. The responwith the children for longer periods of time sibility of the surrogate parent is to ensure and are charged with tot ald(3), Trottenberg, Oosterlee and Schuller(5), Xu(8,9) and Xu and Zikatanov(10) for the method of subspace correc- tions. One main focus in this paper is to provide an estimate for the rate of convergence of the method of successive subspace corrections (MSSC) in terms of the method of parallel subspace corrections (MPSC). This work can be considered as an extension and application of the convergence theory by Xu and Zikatanov(10). Based on this framework, we obtain a formula for the convergence rate, which can be employed to derive many other estimates related to the method of subspace corrections. We then show how the convergence rate of the MSSC can be estimated in terms of the MPSC. Similar results and other approaches on deriving estimates relating MSSC and MPSC are also found in earlier works(2,3,8,9)."], ["https://openalex.org/W299422696", "Creating Biography Webs to Investigate Individuals’ Historical Contexts", 2009, "article", 0, "Data Analysis and Archiving", "Biographies, which are popular among young people, can stimulate interest in the past when students investigate the historical contexts in which individuals lived. Creating biography webs offers students structured opportunities to investigate how other people and groups influenced the personal development of specific individuals (NC SS Strands II, III, IV, and V ). 1 Students work in pairs to complete five activities that require active problem solving and decision making. They work as partners to determine the most effective means for displaying their learning while also educating their peers."], ["https://openalex.org/W3121426576", "The Group Coaching Conundrum", 2014, "article", 9, "Psychotherapy Techniques and Applications", "This article sheds light on the challenges facing coaches when undertaking the journey to becoming a group coach. It begins with observations on the state of the art of group and team coaching and continues with a description of the various conundrums faced by coaches interested in pursuing this kind of activity. Subsequently, it describes a coach's reflections on leadership group coaching and shares his inner journey toward becoming a group coach. The second part of the article reflects on what makes group coaching an effective intervention, discussing the dynamic processes applicable to individual participants and the ‘cloud issues’ or themes that the group-as-a-whole brings to the table. It describes seven premises that characterize the clinical paradigm, a psychodynamic lens that can be turned on our inner theatre. The article also highlights a number of other psychodynamic processes that take place during the group coaching process, creating tipping points for change."], ["https://openalex.org/W2346159329", "Coaching employees with chronic illness: Supporting professional identities through biographical work", 2016, "article", 4, "Coaching Methods and Impact", "Chronic illness is a growing issue in the workplace, and can prompt employees to reconsider their professional and personal goals due to potential future physical limitations. Coaching can provide support to keep employees in the workforce. In this study, 34 employed people with chronic illnesses participated in a chronic illness career coaching intervention to help develop personal resources to stay in the workforce. An analysis of data from exit interviews suggests that coaching supports coachees’ identity work and behavioral strategies for integrating illness and work, increasing their confidence and improving their expectations for continuing to work."], ["https://openalex.org/W187419730", "Dynamic AspectC++: Generic Advice at Any Time", 2009, "article", 3, "Advanced Software Engineering Methodologies", "In theory, the expressive power of an aspect language should be independent of the aspect deployment approach, whether it is static or dynamic weaving. However, in the area of strictly statically typed and compiled languages, such as C or C++, there seems to be a feedback from the weaver implementation to the language level: dynamic aspect languages offer noticeable fewer features than their static counterparts. Especially means for generic aspect implementations are missing, as they are very difficult to implement in dynamic weavers. This hinders reusability of aspects and the application of AOP to scenarios where both, runtime and compile-time adaptation is required. Our solution to overcome these limitations is based on a novel combination of static and dynamic weaving techniques, which facilitates the support of typical static language features, such as generic advice, in dynamic weavers for compiled languages. In our implementation, the same AspectC++ aspect code can now be woven statically or dynamically into the Squid web proxy, providing flexibility and best of bread for many AOP-based adaptation scenarios."], ["https://openalex.org/W2125795717", "On the Group of Isometries on a Locally Compact Metric Space", 2003, "article", 11, "Geometric Analysis and Curvature Flows", "In the present paper we study conditions under which the group of isometries on a locally compact metric space is locally compact, or acts properly."], ["https://openalex.org/W2613524838", "On Exceptional Completions of Symmetric Varieties", 2006, "article", 8, "Nonlinear Waves and Solitons", null], ["https://openalex.org/W52189853", "Means, Ends, and the principle of Normalization: A Closer Look", 1982, "article", 3, "Child and Animal Learning Development", null], ["https://openalex.org/W39448545", "Perceptions of Mainstreaming by Regular Classroom Teachers who Teach Mainstreamed Educable Mentally Retarded Students in the Public Schools", 1981, "article", 16, "Collaborative Teaching and Inclusion", null], ["https://openalex.org/W1567699706", "An Aspect-Oriented Approach for Software Security Hardening: from Design to Implementation", 2009, "article", 5, "Advanced Software Engineering Methodologies", "Security is a very challenging task in software engineering. Enforcing security policies should be taken care of during the early phases of the software development life cycle to prevent security breaches in the final product. Since security is a crosscutting concern that pervades the entire software, integrating security solutions at the software design level may result in scattering and tangling security features throughout the entire design. To address this issue, we propose in this paper an aspect-oriented approach for specifying and enforcing security hardening solutions. This approach provides software designers with UML-based capabilities to perform security hardening in a clear and organized way, at the UML design level, without the need to be security experts. We also present the SHP profile, a UML-based security hardening language to describe and specify security hardening solutions at the UML design level. Finally, we explore the efficiency and the relevance of our approach by applying it to a real world case study and present the experimental results."], ["https://openalex.org/W2520233516", "Visually Understanding School Grounds: Schooling At Its Intersections With Community And Social Status", 2014, "article", 0, "Educational Environments and Student Outcomes", null], ["https://openalex.org/W320234774", "Competitive Employment Training for Moderately Retarded Adolescents", 1982, "article", 2, "Disability Education and Employment", null], ["https://openalex.org/W3093243567", "Synthesis And Characterization Of Some New Pyrazoline Derivatives", 2019, "article", 1, "Eicosanoids and Hypertension Pharmacology", "Chalcones (3a-f) were synthesized by treating acetophenonewith substituted benzaldehyde (2a-f) using ethanolic alkali as solvent. The synthesis of pyrazoline derivative (5a-f) were carried out by cyclization of the chalcones(3a-f) with hydrazine hydrate in the presence of the formic acid. To synthesize these new pyrazoline derivatives the prediction of activity spectra for substances (PASS) were used. "https://openalex.org/W3081291241", "Hidden Biases and Fake News: Finding a Balance between Critical Thinking and Cynicism", 2018, "article", 4, "Education and Critical Thinking Development", "The term \"biases\" often comes up in classroom discussions about fake news. We warn our students: some sources of information are less trustworthy than others because their creators are biased—in other words, prejudiced, subjective, guided by unreasoned opinions. We divide media texts into those that deserve our students' attention because they present facts and truth, and those that should be dismissed."], ["https://openalex.org/W2749617794", "The Impact of Experience on Student Mentors’ Conceptualisations of Mentoring", 2008, "article", 16, "Mentoring and Academic Development", "This paper examines the findings of a qualitative research study conducted in the context of Australian preservice teacher education. The study looks at impact of mentoring experience on student mentors’ conceptualisations of mentoring. It draws on data from entry and exit surveys and interviews with student mentors. The paper has first positions the research within the literature, examines the research context and the research methodology. It then presents the research findings as three case studies of student mentors’ experiences of mentoring and concludes with a discussion of findings that relate to student mentors perceptions of mentoring and teaching practice."], ["https://openalex.org/W1652284290", "Translingual Identity and Art: Marc Chagall's Stride Through the Gates of Janus", 2015, "article", 37, "European Cultural and National Identity", "This hybrid piece, combining scholarly inquiry in several disciplines (from bilingualism and literary theory to visual art, cultural anthropology, and psychoanalysis) with the genre of personal essay, explores the concept of multilingual identity and creativity in visual art. Establishing the parallel with the phenomenon of 'literary translingualism' and exemplifying most salient identity features of several translingual writers, I coin the concept of 'artistic translingualism.' The essay is focused on multilingual life and art of an immigrant artist, Marc Chagall, and analyzes his several paintings within the framework of three translingual constructs: duality, ambivalence, and liminality. The complexity of translingual identity, and specifically Chagall's, is illuminated by my personal and my family's Jewish Russian roots and immigrant history, amplifying the historical and human context for understanding of exile, multilingualism, and creativity."], ["https://openalex.org/W190265653", "Use Of Structured Teaching For Treatment Of Children With Autism And Severe And Profound Mental Retardation", 1998, "article", 38, "Family and Disability Support Research", "Multidimensional assessment procedure was used to evaluate effects of the TEACCH (Treatment and Education of Autistic and Communication Handicapped Children) program principles and strategies (i.g. individualization, structured learning, environmental adaptation) after 12 and 18 months of structured intervention. The sample was composed of 18 children and adolescents with autism, with a mean chronological age of 13 years and a mean mental age of 16 months (severe and profound mental retardation). The instruments used were: Childhood Autism Rating Scale, Vineland Adaptation Behavioral Scale, PsychoEducational Profile - Revised, Echelle d'Evaluation Fonctionnelle des Comportements of Lelord. Structured observations of maladap- tive behaviors and spontaneous communication were made. Results showed an increase in working skills and functional communication abilities. In addition, the structured teaching seemed to reduce disadaptive behaviors allowing an easier management of behavioral problems."], ["https://openalex.org/W169411607", "Income Inequality and U.S. Tax Policy", 2011, "article", 1, "Income, Poverty, and Inequality", "Many social scientists have recently commented on the high levels of income inequality in the United States. Indeed, the last time income inequality was as great as it is today was 1928, the year before the stock market crash ushered in the Great Depression. In this article, we offer a historical look at income inequality and taxation in the United States"], ["https://openalex.org/W291924553", "Parent Involvement: A Consumer Perspective—In the Clinic", 1978, "article", 1, "Healthcare Systems and Technology", "Educational assessment clinics around the (a) parent involvement is stereotyped by country have been readdressing the role of certain assumptions about clinics, (b) clinical parents in their procedures. These clinics assessment and remediation procedures can may be private or public; they may be be changed to accomodate parental needs attached to a university or medical facility. and involvement, and (c) recent changes in Their general purpose is to diagnose and assessment and remediation open new doors assess the academic learning problems of for parents, children, with the intent of giving direction for needed educational services. Parents Peculiarities of Clinics have generally had some role in the procedures. Parental involvement is often stereotyped by For a number of reasons, however, clinics the pecularities of clinics. Traditional clinical of this genre are re-examining their propractices and past experiences with clinics cedures in order to maximize parent inoften shape a certain level of parent be volvement. First of all, parents are generally havior. A clinic is a place to go when ^involved in a child's problem and should other things have failed. Parents expect be involved in the intervention process. labels, cures, and reasons. They may be Parents also have a right to be involved in shopping for another answer after getting different phases of the assessment and useless, unacceptable, or unsatisfactory help remedial process. In fact, there is a law, from others (Gorham, 1975). P.L. 9
