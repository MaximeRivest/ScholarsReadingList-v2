we_v30_n3_p149-154.pdf", null, "Light response by Frankliniella occidentalis to white fluorescent light filtered through color films and ultraviolet- and blue light-emmiting diodes.", "article", "en", "2005-09-01", 2005, "Chengcai Chu | Chen Ty | Natwick Et | Glenn J. Fitzgerald | Sarah A. Tuck | Patrick J. Alexander | Henneberry Tj", "https://orcid.org/0000-0001-8097-6115 | - | - | https://orcid.org/0000-0001-6972-4443 | - | https://orcid.org/0000-0001-5555-0972 | -", null, null, null, "Southwestern Entomologist", "Society of Southwestern Entomologists", "0147-1724", "30", "3", "149–154", "Western flo pests worldwide. monitoring WFT were determined lwer thrips (WFT), Frankliniella occidentalis (Pergande), are economic A study was conducted to obtain efficacy data to help develop traps for population variations in the field and greenhouses. Spectral responses using blue sticky card (BC) traps equipped with light-emitting diodes (LEDs) in the field and a parti-colored light array (PLA) system in the laboratory under darkroom conditions. BC traps equipped with ultraviolet (UV) LEDs were more attractive to this thrips as compared with blue LEDs. Distances from the point of thrips release to the PLA affected the number of thrips caught independently of trap color.", "Western flower thrips | Light-emitting diode | Thrips | Biology | Population | Optoelectronics | Ultraviolet | Optics | Thripidae | Horticulture | Materials science | Physics", "Insect-Plant Interactions and Control", "Insect Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 10, 12, "https://openalex.org/W156920083 | https://openalex.org/W322167281 | https://openalex.org/W2011130378 | https://openalex.org/W2083805563 | https://openalex.org/W2132576321 | https://openalex.org/W2173213728 | https://openalex.org/W2224252036 | https://openalex.org/W2253081659 | https://openalex.org/W2325006634 | https://openalex.org/W2504489184 | https://openalex.org/W3033891744 | https://openalex.org/W3124265724", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2099075916", "https://doi.org/10.5897/jene.9000030", "https://africaneditors.org/journal/JENE/full-text-pdf/30998-122339", null, "Contribution to the knowledge of non wood forest products of the far north region of Cameroon: Medicinal plants sold in the Koussri market", "article", "en", "2011-07-31", 2011, "Jean Lagarde Betti | Serge Rost | Mebere YEMEFArsquo | Francis Nchembitarla", "https://orcid.org/0000-0002-2665-8367 | - | - | -", null, null, null, "Journal of Ecology and the Natural Environment", "Academic Journals", "2006-9847", "3", "7", "241–254", "An ethnobotanical survey was conducted in June 2005 among sellers of non wood forest products settled at the Kousseri market, Kousseri sub-division, Logone et Chari division, far north region of Cameroon. A total of 29 medicinal plants were recorded comprising 26 genera and 21 families. Malaria, diarrhoea, jaundice, fever, and hernia were the major ailments in terms of the number of references made by these sellers. There are considerable differences among different sellers in the prices per gram of the same plant species used for the same ailment. Hence, it is not meaningful to link the relative importance of plants to their selling price. An index of performance (Ip) is proposed for each plant species, based on its number of references and according to an arbitrary scale which ranges from 0 to 3. Some plants significantly used (Ip > 0) for treating certain ailments are widely used in other African countries in a similar way. There are also plants of which their effectiveness is confirmed in the literature to possess biological activity related to the ailments indicated. Data recorded at the Kousseri market were compared to those gathered on medicinal plants used by people living around the Kalamaloue national park, located in the same sub-division, 10 km from Kousseri.\r\n\r\n\t \r\n\r\n\tKey words: Non wood forest products, medicinal plants, performance index (Ip), sellers, Kousseri market.", "Ethnobotany | Division (mathematics) | Medicinal plants | Index (typography) | Geography | Agroforestry | Traditional medicine | Biology | Mathematics | Medicine | Computer science", "African Botany and Ecology Studies", "Forestry", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 10, 7, "https://openalex.org/W27760505 | https://openalex.org/W1535207151 | https://openalex.org/W1547461689 | https://openalex.org/W2042531274 | https://openalex.org/W2182090069 | https://openalex.org/W2548946395 | https://openalex.org/W3094244487", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W291919316", null, "http://article.sapub.org/pdf/10.5923.j.ijaf.20140403.16.pdf", null, "End-use Quality of Upland NERICA Rice (Oryza sativa L) as Affected by the Addition of Sweet Cassava (Low cyanide, Manihotesculenta) Flour", "article", "en", "2014-01-01", 2014, "Nahemiah Danbaba | M. N. Ukwungwu | A. T. Maji | Sali Atanga Ndindeng | A.G Jiya | S Danfulani | Esther-Ben Onyeneke", "https://orcid.org/0000-0001-9468-5490 | - | - | https://orcid.org/0000-0002-2403-8076 | - | - | -", null, null, null, "International Journal of Agriculture and Forestry", null, "2165-882X", "4", "3", "237–245", "End-use quality of upland NERICA 1 (WAB-450-1-B-P38-HB) rice flour as affected by the addition of 5 to 20% sweet cassava flour were evaluated. Functional characteristics, viscosity profile, proximate composition and consumer acceptability test of 'Tuwonlaushi' prepared from the blends were determined. Results indicated that WAI varies between 28.77 and 63.54%, while OAI were significantly (p=5%) lowered when cassava flour was added and ranged between 4.96 at 20% cassava flour to 9.21% in 100% rice flour. GI significantly (p= 0.5) ranges from 0.11 in 10% cassava flour formulations to 0.86 in 5% cassava flour formulations. PT for 100% cassava flour and rice flour were 54.38 and 56.33 o C respectively. The PV value increase with increase cassava flour substitution between 116.75 and 134.75 RVU for 5% and 20%. FV ranged between 182.08 RVU (5% cassava flour) and 199.33 RVU (20% cassava flour). Moisture content of the different formulations were not significantly different (p=0.05) ranging from 0.16% to 0.28% with an average of 0.23%. The protein content of the rice-cassava blends were significantly (p=5%) lower than the whole rice flour, ranging from 10.90% in 100% rice flour to 5.49% in 20% substitution. Consumer ratings indicated high ranking for 10, 15 and 20% formulation in this order indicating detectable effect of cassava flour addition in 'tuwonlaushi' production. Correlation studies indicated a significant (p=5%) negative correlation between moisture content and emulsion capacity (-0.96**) and bulk density (-0.97**) of the blends and positive correlation (0.96**) between protein and caloric value, indicating positive contribution of protein to overall metabolizible energy value of the formulations. The variation in functional and pasting properties and nutritional properties is an indication of possible multi-dimensional end-use which rice flour mixed with cassava flour could be subjected to at different ratios that could be of benefit for both domestic and industrial applications.", "Food science | Rice flour | Wheat flour | Oryza sativa | Chemistry | Proximate | Mathematics", "Cassava research and cyanide", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", null, null, null, 9, 22, "https://openalex.org/W264850853 | https://openalex.org/W1965179363 | https://openalex.org/W1975301708 | https://openalex.org/W1978083513 | https://openalex.org/W1993013612 | https://openalex.org/W1993299317 | https://openalex.org/W2000830603 | https://openalex.org/W2006578022 | https://openalex.org/W2027151018 | https://openalex.org/W2027466470 | https://openalex.org/W2038300136 | https://openalex.org/W2078923894 | https://openalex.org/W2093020389 | https://openalex.org/W2094796602 | https://openalex.org/W2156014796 | https://openalex.org/W2167196882 | https://openalex.org/W2184696222 | https://openalex.org/W2224601664 | https://openalex.org/W2319410825 | https://openalex.org/W2372199354 | https://openalex.org/W2396268485 | https://openalex.org/W3205389204", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W1577554742", null, "http://researchinbiotechnology.com/article/view/67", null, "Laccase Production by Phellinus noxius hp F17: Optimization of Submerged Culture Conditions by Response Surface Methodology", "article", "en", "2012-03-02", 2012, "Harisha Poojary | Gopal Mugeraya", "- | -", null, "National Institute of Technology Karnataka", "IN", "Research in Biotechnology", null, "2229-791X", "3", "1", null, "In the present study, a laccase producing fungus, Phellinus noxius hpF17 was isolated and studied for its laccase production in submerged culture conditions. The fungus showed laccase activity of 545.50±6.7U/l in the defined liquid medium. Initial screening of production parameters was performed using Plackett–Burman design and the variables with  statistically significant effects on laccase production were identified. Variables such as glucose, ammonium tartarate and tween 80 were found to influence the laccase production significantly. These variables were selected for further optimization using Response Surface Methodology. Optimum values of tested variables for maximum laccase production are glucose (20g/l), ammonium tartarate (2.25g/l) and tween 80 (2.08ml/l).  By using this optimal fermentation medium, the laccase yield was increased up to 780U/l, an approximate 1.4 fold improvement as compared to the previous yield with un-optimized medium.", "Laccase | Response surface methodology | Plackett–Burman design | Fermentation | Yield (engineering) | Ammonium sulfate | Chemistry | Ammonium | Food science | Fungus | Chromatography | Biochemistry | Botany | Enzyme | Biology | Organic chemistry | Materials science", "Enzyme-mediated dye degradation", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 9, 26, "https://openalex.org/W334850957 | https://openalex.org/W1579808730 | https://openalex.org/W1968950011 | https://openalex.org/W1973666793 | https://openalex.org/W1990259563 | https://openalex.org/W2008532143 | https://openalex.org/W2015808350 | https://openalex.org/W2023384357 | https://openalex.org/W2041622498 | https://openalex.org/W2044917858 | https://openalex.org/W2049421223 | https://openalex.org/W2052883454 | https://openalex.org/W2055891827 | https://openalex.org/W2064475953 | https://openalex.org/W2080524622 | https://openalex.org/W2127499091 | https://openalex.org/W2147764174 | https://openalex.org/W2156578053 | https://openalex.org/W2157158685 | https://openalex.org/W2159149614 | https://openalex.org/W2160829388 | https://openalex.org/W2161208191 | https://openalex.org/W2335077289 | https://openalex.org/W2351799983 | https://openalex.org/W2470415938 | https://openalex.org/W2993848302", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W1850836623", null, "https://eujournal.org/index.php/esj/article/download/6279/6051", null, "YIELD PERFORMANCE AND ECONOMIC RETURN OF MAIZE AS AFFECTED BY NUTRIENT MANAGEMENT STRATEGIES ON FERRALSOLS IN COASTAL WESTERN AFRICA", "article", "en", "2015-09-29", 2015, "Kodjovi Sotomè Detchinli | Jean Mianikpo Sogbedji", "- | -", null, "University of Lomé", "TG", "European Scientific Journal ESJ", "European Scientific Institute", "1857-7431", "11", "27", null, "We assessed maize (Zea mays L.) grain yield and associated economic returns of four soil fertility management strategies in a 2-yr study (four growing seasons). The Ikenne maize cultivar was used and the fertilization treatments included: no fertilizer application (control, T1), application of farmyard manure (FYM) at the rate of 6 Mg ha-1 (T2), the agricultural services recommended maize-based fertilization consisting of 200 kg N15P15K15 plus 100 kg urea (46% N) ha-1 (T3) and application of 3 Mg of FYM plus 100 kg N15P15K15 plus 50 kg urea (46% N) ha-1 (T4). On the 2-yr period basis, four-season cumulative grain yields under T4, T3 and T2 were 40, 25 and 22% higher as compared with T1, respectively, those under T4 and T3 were 15 and 3% higher as compared with T2, respectively, while the yield under T4 was 12% higher than that under T3. For the 2-yr period, on a per hectare basis, economic profits under T4, T3 and T2 were 69 and 31% higher and 10% lower as compared with T1, respectively, profits under T4 and T3 were 87 and 46% higher as compared with T2, respectively, while profit under T4 was 28% higher than that under T3. In the current context of degraded soils in coastal western Africa, T4 reflecting a combined application of mineral fertilizer at the rate of N38P15K15 ha-1 plus organic amendment as FYM at the rate of 3 Mg ha-1 should be advised towards sustaining enhanced maize crop productivity and profitability.", "Hectare | Nutrient management | Fertilizer | Agronomy | Manure | Nutrient | Urea | Mathematics | Human fertilization | Soil fertility | Animal science | Context (archaeology) | Soil water | Agriculture | Biology | Ecology", "Cassava research and cyanide", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", null, null, null, 9, 19, "https://openalex.org/W56051157 | https://openalex.org/W56295408 | https://openalex.org/W154259281 | https://openalex.org/W270247829 | https://openalex.org/W922175063 | https://openalex.org/W1550731294 | https://openalex.org/W1974954582 | https://openalex.org/W1991222722 | https://openalex.org/W2002467160 | https://openalex.org/W2041416825 | https://openalex.org/W2082542718 | https://openalex.org/W2093418578 | https://openalex.org/W2097133913 | https://openalex.org/W2116816626 | https://openalex.org/W2126320505 | https://openalex.org/W2165872721 | https://openalex.org/W2231140637 | https://openalex.org/W2317060366 | https://openalex.org/W2565101655", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2734957240", "https://doi.org/10.13140/rg.2.2.25808.37120", "https://doi.org/10.13140/rg.2.2.25808.37120", null, "Standardization and development of different types of energy bars", "article", "en", "2017-01-01", 2017, "Priyanka Tiwari | Kiran Agrahari", "- | https://orcid.org/0009-0008-2981-280X", null, null, null, null, null, null, "3", "1", "370–372", "The objective of present investigation wasrnStandardization and development of different types of Energy Bars. Developmentrnof different type of energy bars i.e. oats banana energy bar and coconut energyrnbar. The organoleptic evaluation of products was done by using score cardrnmethod (9-Point Hedonic Scale). The result of oats Banana energy bar, andrncoconut energy bar (T1) were best in all treatments in case of all sensoryrnattributes. The overall acceptability of experimental (T1) Oats Banana energyrnbar and Coconut energy bar were 9.0, 9.0 respectably.", "Bar (unit) | Standardization | Energy (signal processing) | Organoleptic | Scale (ratio) | Mathematics | Agricultural science | Environmental science | Computer science | Biology | Statistics | Food science | Physics | Geography | Cartography", "Smart Agriculture and AI", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, true, "gold", null, null, null, 8, 2, "https://openalex.org/W1825104184 | https://openalex.org/W2497772680", false, "2025-07-26 00:00:00"], ["https://openalex.org/W3139161926", null, "https://elearning.kau.edu.sa/Show_Res.aspx?Site_ID=130&LNG=EN&RN=68957", null, "Evaluation of the IGRs Alsystin and Pyriproxyfen as Well as the Plant Extract Jojoba Oil against the Mosquito Aedes aegypti", "article", "en", "2013-01-01", 2013, "Jazem A. Mahyoub", "https://orcid.org/0000-0002-6778-4255", "Jazem A. Mahyoub", null, null, "Journal of Pure and Applied Microbiology", "Dr. M.N. Khan", "0973-7510", "7", "4", null, "The biological activity of two insect growth regulators alsystin and pyriproxyfen as well as the plant extract jojoba oil on larval stages and pupae until adult emergence of Aedes aegypti was evaluated. According to IC50 values obtained (concentration which to inhibit the emergence of 50% of mosquito adults), alsystin (0.00048ppm) proved to be highly effective against A. aegypti than pyriproxyfen (0.005 ppm) and jojoba oil (85 ppm). On the other hand, larval treatments with the present compounds led to a decrease in egg production and hatchability of eggs produced by mosquito adults which survived from larval treatments.", "Pyriproxyfen | Aedes aegypti | Larva | Biology | Pupa | Toxicology | Botany", "Insect Pest Control Strategies", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 8, 5, "https://openalex.org/W75156346 | https://openalex.org/W1973600102 | https://openalex.org/W2090863979 | https://openalex.org/W2107562780 | https://openalex.org/W2176118528", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W1801756419", null, "http://yadda.icm.edu.pl/baztech/element/bwmeta1.element.baztech-article-BAR8-0003-0083/c/httpwww_pimr_poznan_plbiul20093gb.pdf", null, "Nutritional value of green fodder and hay from ecological meadows.", "article", "en", "2009-01-01", 2009, "M. Grzelak | T. Bocian", "https://orcid.org/0000-0002-7579-6117 | -", null, null, null, "Journal of Research and Applications in Agricultural Engineering", "Łukasiewicz Research Network - Industrial Institute of Agricultural Machinery", "1642-686X", "54", "3", "86–89", null, "Fodder | Hay | Value (mathematics) | Ecology | Agronomy | Biology | Agroforestry | Geography | Mathematics", "Botany and Plant Ecology Studies", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 8, 9, "https://openalex.org/W119204646 | https://openalex.org/W774655771 | https://openalex.org/W783983787 | https://openalex.org/W844230833 | https://openalex.org/W844712863 | https://openalex.org/W942370911 | https://openalex.org/W1604475085 | https://openalex.org/W1972809775 | https://openalex.org/W2003933844", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W179040320", null, "https://www.cabdirect.org/abstracts/20123113814.html", null, "Development of crystallized palm-syrup sugar as a natural sweetener", "article", "en", "2009-01-01", 2009, "S. Suwansri | Puntarika Ratanatriwong | Parita Thanasukarn", "- | https://orcid.org/0000-0001-5781-7490 | -", null, null, null, "Asian Journal of Food and Agro-Industry", null, "1906-3040", "2", null, null, "The palm syrup is from naturally grown palm trees. Owing to its unique odor and taste, the syrup has high potential to be a new sweetener which is natural and chemical-free. Thus, this research was to develop the crystallized sugar formulation and processes. Besides palm syrup, brown sugar was added in the production steps. Mixture ratios of syrup and brown sugar were varied to get the final solution concentration prior to crystallization occurred. The crystallization temperature was controlled throughout the experiment. The result showed that 83±1 °Brix of 60% syrup and 40% brown sugar mix achieved high yield of 3-4 mm crystal size. As crystallization period increased, the CIE color values (L*, a* and b*) increased which indicated the brighter color of mixture solution. Focus group result showed a favor of natural brown color and taste of the crystals despite its slow dissolving in the beverage. The sweetness was perceived even with a small amount of crystals was added. Since it is natural and chemical free, the crystallized sugar produced by this process had good color, unique taste and a possibility to be a new form of natural sweetener in the market.", "Sugar | Sweetness | Food science | Chemistry | Crystallization | Glucose syrup | Taste | Odor | Brix | Organic chemistry", "Food Chemistry and Fat Analysis", "Food Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 8, 7, "https://openalex.org/W624320680 | https://openalex.org/W1608524873 | https://openalex.org/W1943565245 | https://openalex.org/W2020782502 | https://openalex.org/W2094843290 | https://openalex.org/W2462859021 | https://openalex.org/W3208350611", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W3211698808", null, "https://www.indianjournals.com/ijor.aspx?target=ijor:jcmsd&volume=10&issue=2&article=015", null, "Development of Scale to Measure Attitude of Farmers towards Rapeseed Mustard Crop", "article", "en", "2015-01-01", 2015, "Rakesh Kumar | P. S. Slathia | Rajinder Peshin | Manjeet Singh Nain", "https://orcid.org/0000-0002-4561-7907 | - | https://orcid.org/0000-0002-1384-1402 | https://orcid.org/0000-0002-7526-1091", null, null, null, "Journal of Community Mobilization and Sustainable Development", null, "2230-9047", "10", "2", "221–224", "This paper dealt with the steps involved in developing and standarizing a scale for assessing the attitude of farmers towards rapeseed mustard crop based on Rensis Likert's summative rating technique (1932) in Jammu division of Jammu & Kashmir. The scale consisted of final 16 items out of the initially selected 40 items in which positive and negative statements were arranged on five point continuum. These five points were strongly agree, agree, undecided, disagree and strongly disagree comprising score 5, 4, 3, 2, 1, for positive statements and 1, 2, 3, 4, 5 for negative statements. The reliability and validity of the scale indicates its consistency and precision of the results. Reliability of the scale was tested using split half method and reliability coefficient was 0.96. This scale can be used to measure farmers’ attitude beyond the study area with suitable modifications.", "Scale (ratio) | Rapeseed | Likert scale | Reliability (semiconductor) | Mathematics | Rating scale | Summative assessment | Cronbach's alpha | Statistics | Measure (data warehouse) | Psychology | Computer science | Geography | Biology | Agronomy | Psychometrics | Formative assessment | Data mining | Physics | Cartography", "Agricultural Economics and Practices", "General Agricultural and Biological Sciences", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 8, 4, "https://openalex.org/W1982890111 | https://openalex.org/W1985453879 | https://openalex.org/W2322584079 | https://openalex.org/W2905339401", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2286279165", null, "https://www.agriculturaits.czu.cz/pdf_files/vol_43_1_pdf/AMARTEIFIO.pdf", null, "THE NUTRIENT COMPOSITION OF BAMBARA GROUNDNUT LANDRACES (VIGNA SUBTERREANEA, (L.) VERDC.) CULTIVATED IN SOUTHERN AFRICA", "article", "en", "2010-01-01", 2010, "J.O. Amarteifio | Olekile Tibe | RM Njogu", "- | - | -", null, null, null, "Agricultura tropica et subtropica", "Mendel University in Brno", "0231-5742", "43", "1", "1–5", "Bambara groundnut has been classifi ed as an underutilized crop, and described as a complete food. In this study the dry matter, ash, crude protein, crude fat, neutral detergent fi bre (NDF), acid detergent fi bre (ADF) and acid detergent lignin (ADL) were determined for nine landraces cultivated in Botswana, Namibia and Swaziland respectively. The Association of Offi cial Analytical Chemists methods were used for the analysis. The results (g/100 g) obtained were: dry matter 92.17–94.00, ash 3.57–4.85, crude protein 17.10– 22.94, crude fat 4.90–7.24, ADF 6.53–10.65, NDF 14.10–25.82, and ADL 0.19–3.44. The landraces grown in Botswana had more protein (20.66–22.94) compared with those grown in Namibia (19.28–20.53) and Swaziland (17.10–19.91) respectively. In contrast, the landraces grown in Swaziland had higher values for NDF (16.33–25.82) compared with those grown in Namibia (15.80–21.19) and Botswana (14.10–21.71) respectively. The fat content was overall low which is in line with good nutritional requirements. There were intra and inter country composition similarities and differences amongst the landraces. The results show that the crop is a good source of protein and fi bre. Its enhanced utilization can positively contribute towards food security.", "Dry matter | Crop | Nutrient | Composition (language) | Agronomy | Vigna | Biology | Animal science", "Agricultural pest management studies", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 8, 4, "https://openalex.org/W336931199 | https://openalex.org/W561362076 | https://openalex.org/W2049192705 | https://openalex.org/W2466591971", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2185251030", null, "http://www.iasj.net/iasj?func=fulltext&aId=65894", null, "Antibacterial effect of date palm (Phoenix dactylifera L.) pit aqueous extract on some bacteria cause urinary tract infection", "article", "en", "2012-01-01", 2012, "Najla'a Nabhan Yassein", "-", "Najla'a Nabhan Yassein", null, null, "Diyala Journal for Pure Science", null, "2222-8373", "8", null, null, "The present work was carried out to study the impact of date palm pit aqueous extract as an antibacterial on four species of pathogenic bacteria (Escherichia coli, Klebsiella pneumoniae, Proteus vulgaris and Pseudomonas aeruginosa). Four concentrations of date palm pit aqueous extract were prepared by using normal saline: 200,100,50 and 25(mg/ml).200 and 100(mg/ml) were the most effective concentrations on the tested bacteria except K. pneumoniae which showed full resistance to all extract concentrations. Date palm pit extract was somewhat more effective in inhibiting growth of bacteria as compared with antibiotics includes trimethoprime, gentamycin and rifampin.", "Phoenix dactylifera | Klebsiella pneumoniae | Bacteria | Proteus vulgaris | Pathogenic bacteria | Microbiology | Palm | Antibiotics | Pseudomonas aeruginosa | Aqueous extract | Antibacterial activity | Proteus mirabilis | Escherichia coli | Chemistry | Biology | Food science | Traditional medicine | Medicine | Biochemistry", "Date Palm Research Studies", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", "cc-by", null, null, 8, 15, "https://openalex.org/W1580188375 | https://openalex.org/W1963480650 | https://openalex.org/W2026087371 | https://openalex.org/W2052055148 | https://openalex.org/W2065883537 | https://openalex.org/W2066724274 | https://openalex.org/W2072155737 | https://openalex.org/W2082353455 | https://openalex.org/W2088812233 | https://openalex.org/W2108916366 | https://openalex.org/W2186668588 | https://openalex.org/W2410020759 | https://openalex.org/W2564729129 | https://openalex.org/W2739976322 | https://openalex.org/W2781197796", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2100224773", null, "https://reabic.net/publ/janas_2005.pdf", null, "Distribution and individual characteristics of the prawn Palaemon elegans [Crustacea, Decapoda] from the Gulf of Gdansk and the dead Vistula River", "article", "en", "2005-01-01", 2005, "Urszula Janas", "https://orcid.org/0000-0001-5496-6618", "Urszula Janas", "University of Gdańsk", "PL", "Oceanological and Hydrobiological Studies", "De Gruyter", "1730-413X", "34", null, null, "The aim of this study was to determine the distribution of a prawn species new to the Gulf of Gdask - Palaemon elegans - as well as to undertake an initial characterization of the length and mass of individuals of this species with respect to sex and site of occurrence. The investigation was carried out in late June and early July 2004 at four stations situated on the shores of the Gulf of Gdask and the Dead Vistula River. The total lengths of males ranged from 23 to 40 mm and those of females from 27 to 50 mm. The relationship between total length and wet weight for males and non-ovigerous females was Ww=10 -6 ·Lt 3.15 , R=0.97, and that between the total length and the carapace length of males and females was Lk=0.42·Lt-0.19, R=0.91. These relationships for P. elegans may be of use in assessing the size and mass of prawns consumed by predators.", "Carapace | Decapoda | Prawn | Biology | Crustacean | Palaemonidae | Fishery | Caridea | Zoology | Ecology", "Fish Biology and Ecology Studies", "Aquatic Science", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", null, null, null, 8, 9, "https://openalex.org/W611891451 | https://openalex.org/W1479768887 | https://openalex.org/W2023994037 | https://openalex.org/W2037207352 | https://openalex.org/W2048897516 | https://openalex.org/W2151303999 | https://openalex.org/W2346874342 | https://openalex.org/W2504964626 | https://openalex.org/W2605984361", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2145805561", null, "https://www.academicjournals.org/article/article1380627507_Riaz et al.pdf", null, "Screening of Gladiolus germplasm for agronomic performance and resistance against corm rot disease", "article", "en", "2010-10-04", 2010, "Tariq Riaz | Salik Nawaz Khan | Arshad Javaid", "- | https://orcid.org/0000-0002-8099-7319 | https://orcid.org/0000-0002-6243-4678", null, null, null, "AFRICAN JOURNAL OF BIOTECHNOLOGY", "Academic Journals", "1684-5315", "9", "40", "6701–6707", "A field experiment was conducted to evaluate the agronomic performance and resistance of Gladiolus germplasm against corm rot disease caused by Fusarium oxysporum Schlecht. f. sp. gladioli (L. Masey) W.C. Snyder & H.N. Hans. Among the 23 Gladiolus varieties tested, Glad Red exhibited the highest spike length of 55 cm followed by Advanced Red (50.2 cm) and White Prosperity (49.5 cm). Highest number of flowers (13 per spike) was recorded in Rose Supreme, Jester Ruffled Yellow, Princess Margaret Rose and Chinon. Glad Red depicted highest field life of flowers (42.5 days), followed by Friendship (42.5 days), Peter Pears (38.7 days) and Chinon (37.3 days). Different varieties showed 6.6 – 56.6% disease incidence and 0 – 33.3% mortality. Advanced Red, White Prosperity, Violetta, San Remo and Yellow Glad were found comparatively more resistant to corm rot disease with disease incidence of 0 – 10%. Indian variety Aarti was found to be the most susceptible to corm rot disease with disease incidence of 56.6%. Disease incidence was significantly and positively correlated with corm size. The present study concludes that Advanced Red and White Prosperity are the most suitable Gladiolus varieties for cultivation under agro-climatic conditions of Pakistan, having best floral characteristics and resistance against corm rot disease. Key words: Corm rot disease, disease resistance, Fusarium oxysporum f. sp. gladioli, germplasm screening, Gladiolus.", "Gladiolus | Corm | Germplasm | Fusarium oxysporum | Biology | Horticulture | Fusarium wilt | Plant disease resistance | Botany", "Flowering Plant Growth and Cultivation", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", null, null, null, 7, 19, "https://openalex.org/W197251654 | https://openalex.org/W1162653123 | https://openalex.org/W1966966459 | https://openalex.org/W1970896175 | https://openalex.org/W1980770035 | https://openalex.org/W1992897439 | https://openalex.org/W2000802155 | https://openalex.org/W2019768037 | https://openalex.org/W2030225962 | https://openalex.org/W2046499497 | https://openalex.org/W2054838579 | https://openalex.org/W2068597887 | https://openalex.org/W2081722971 | https://openalex.org/W2087923184 | https://openalex.org/W2109228066 | https://openalex.org/W2127892341 | https://openalex.org/W2181900844 | https://openalex.org/W2201782401 | https://openalex.org/W2342123592", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2413420860", null, "http://hdl.handle.net/11449/172148", null, "Tractor performance and corn crop development as a function of furrow opener and working depth in a Red Latosol", "article", "en", "2015-01-01", 2015, "Rafael Scabello Bertonha | Carlos Eduardo Angeli Furlani | Victoria Filho | D. L. Wright", "https://orcid.org/0000-0002-8971-8451 | https://orcid.org/0000-0002-1508-5372 | - | -", null, null, null, "UNESP Institutional Repository (São Paulo State University)", "Universidade Estadual Paulista (Unesp)", null, "9", "9", "812–818", "To use a no-tillage system, the producer must know the ideal tool for each condition encountered in the soil. In seeding, the function of the furrow opener is loosening and disturbing the soil, but if the opener lacks the specific geometry for a specific soil condition, the furrow opening angle could be incorrect, leading to compaction due to mirror formation on the walls of the furrow. The aim of this study was to analyze three hoe-type furrow openers of planters at different working depths, evaluating the area of disturbed soil, tractor performance, and corn crop yield. The experiment was conducted in areas of the UNESP/FCAV, Brazil on a soil classified as a Eutroferric Red Latosol. A randomized block design with factorial scheme 3 × 5 (three shanks: FO1, FO2, and FO3, and five depths: WD1, 6.0; WD2, 9.5; WD3, 10.5; WD4, 12.0; and WD5, 13.5 cm), with four replications was used. The results showed that the soil disturbance was highest at working depths of WD3, WD4, and WD5. With WD1 and WD2, the emerged seedlings began the crop cycle in fewer quantities (72839 and 73380 plants ha-1, respectively). The final stand of the crop, corn-grain yield, and biomass were not affected by the treatments. The opener with greatest tip angle (29°) showed a lower traction power demand and fuel consumption than openers with 27° and 17° at working depth WD5, and in general, incurred higher fuel consumption per volume of soil disturbance. Opener geometry and soil type directly affect soil disturbance, machine performance, and crop development. However, in this study, we suggest the opener with a rake angle of 27°, working at greater depth, because this combination provided better fuel consumption per volume of disturbed soil and no reduction of crop productivity.", "Latosol | Randomized block design | Tillage | Tractor | Mathematics | Crop | Crop yield | Agronomy | Environmental science | Soil water | Soil science | Engineering | Biology", "Soil Management and Crop Yield", "Soil Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 7, 27, "https://openalex.org/W1747388711 | https://openalex.org/W1981315222 | https://openalex.org/W1982015415 | https://openalex.org/W1987318223 | https://openalex.org/W1998750842 | https://openalex.org/W1999730707 | https://openalex.org/W2000218113 | https://openalex.org/W2006005980 | https://openalex.org/W2017301385 | https://openalex.org/W2023578818 | https://openalex.org/W2024500829 | https://openalex.org/W2024776200 | https://openalex.org/W2031978241 | https://openalex.org/W2037724801 | https://openalex.org/W2039139813 | https://openalex.org/W2045337338 | https://openalex.org/W2048505926 | https://openalex.org/W2049721034 | https://openalex.org/W2065693851 | https://openalex.org/W2068965858 | https://openalex.org/W2073589300 | https://openalex.org/W2077963220 | https://openalex.org/W2082798737 | https://openalex.org/W2123638302 | https://openalex.org/W2130530078 | https://openalex.org/W2161530009 | https://openalex.org/W2513549532", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2119594654", null, "http://yadda.icm.edu.pl/yadda/element/bwmeta1.element.agro-article-f516e2b9-8f79-4888-8be1-fb0e46d7f82a/c/09_rozdzial_451-455.pdf", null, "INFLUENCE OF TRANS UNSATURATED FATTY ACIDS CONTENT ON CHEMICAL CHANGES IN THE SHORTENING DURING BAKING AND STORAGE OF CAKES", "article", "en", "2007-01-01", 2007, "Anna Żbikowska | Matgorzata Kowalska", "https://orcid.org/0000-0001-7013-4520 | -", null, "Warsaw University of Life Sciences", "PL", "Polish Journal of Food and Nutrition Sciences", "De Gruyter Open", "1230-0322", "57", "4", "451–455", "The fats containing different fatty acids (trans isomers from 4.1 to 53.2%) were used to bake the cakes. The cakes were baked at 180oC for 20 min and next stored for 6 weeks. Fat was extracted with the Kates’ method and the composition of fatty acids was determined with gas chromatography. It was found that trans isomers content in fats had no statistically significant effect on the oxidation and hydrolytic changes occurring in fats during baking of shortcakes. In all fats, irrespective of the content of trans isomers, the primary and secondary oxidation products appeared in small quantities. Temperature during baking had no influence on the content of saturated fatty acids. Considering trans isomers and polyunsaturated fatty acids in the product in comparison with initial fats, small changes appeared, but the changes were significant from the statistical point of view. Fats with a high content of trans fatty acids – although they do not cause hydrolytic and oxidation changes during baking and storage - should not be used for baking cakes, especially shortcakes with a high content of fat.", "Chemistry | Food science | Polyunsaturated fatty acid | Hydrolysis | Cis–trans isomerism | Composition (language) | Gas chromatography | Chemical composition | Organic chemistry | Fatty acid | Chromatography", "Meat and Animal Product Quality", "Animal Science and Zoology", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", "cc-by", null, null, 7, 16, "https://openalex.org/W105499823 | https://openalex.org/W584693173 | https://openalex.org/W608142792 | https://openalex.org/W850132667 | https://openalex.org/W1734933589 | https://openalex.org/W1966756549 | https://openalex.org/W1974809841 | https://openalex.org/W1977533782 | https://openalex.org/W2014871212 | https://openalex.org/W2030183324 | https://openalex.org/W2082853788 | https://openalex.org/W2088895425 | https://openalex.org/W2098364690 | https://openalex.org/W2114289412 | https://openalex.org/W2134054292 | https://openalex.org/W2916687743", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2189467995", null, "http://www.cvzv.sk/slju/15_2/4_wittayaku.pdf", null, "Supplement of sodium bicarbonate, calcium carbonate and rice straw in lactating dairy cows fed pineapple peel as main roughage.", "article", "en", "2015-01-01", 2015, "Suntorn Wittayakun | S. Innaree | Weera Innaree | Worawut Chainetr", "https://orcid.org/0000-0001-7520-7928 | - | - | -", null, null, null, "Slovak Journal of Animal Science", null, "1337-9984", "48", "2", "71–78", "The aim of this study was to evaluate the effect of buffering agents on performance of lactating cows fed pineapple peel as main roughage. Four mid-lactation primiparous crossbred Holstein dairy cows averaging 443.5 ± 10.6 kg BW were assigned in a 4 x 4 Latin square design. Each cow was fed one of four experimental diets including: T1) control, pineapple peel (PP) to commercial pellet (CL) ratio of 70:30 without added buffer; T2) PP to CL ratio of 70:30 with 1.2 % sodium bicarbonate (NaHCO 3 ); T3) PP to CL ratio of 52.5: 30 with mixture of 17.5 % rice bran and 1.2 % calcium carbonate (CaCO 3 ); and T4) PP to CL ratio of 50:30 with 20 % rice straw (RS). The results revealed that feed intake, digestion coefficient, digestible nutrient intake were unaffected by supplementation of NaHCO 3 , CaCO 3 , and RS in diets (P > 0.05). The daily quantities of ME and NEL intake were not altered by treatments (P > 0.05), but PDIE and PDIN were increased by supplementing CaCO 3 in the diet (P 0.05). Acetate to propionate ratio ranged between 2.18 to 2.96 (P > 0.05) with the highest (2.96) in the RS supplement group. The NaHCO 3 , CaCO 3 , and RS supplement did not influence blood metabolites, blood electrolytes, milk yield and milk composition (P > 0.05). No sign of acidosis was observed. Therefore, it could be concluded that NaHCO 3 , CaCO 3 , or RS supplementation had no significant impact on performance of lactating cows fed PP as main roughage. Further research should be conducted to test the influence of such diets on milk production with larger number of animals in longer period of time.", "Sodium bicarbonate | Chemistry | Latin square | Animal science | Propionate | Straw | Food science | Bran | Sodium | Rumen | Biochemistry | Biology | Fermentation", "Ruminant Nutrition and Digestive Physiology", "Agronomy and Crop Science", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", null, null, null, 7, 28, "https://openalex.org/W197527236 | https://openalex.org/W352909305 | https://openalex.org/W629591641 | https://openalex.org/W781118819 | https://openalex.org/W1598329924 | https://openalex.org/W1822425348 | https://openalex.org/W1975684527 | https://openalex.org/W1980812705 | https://openalex.org/W1992897439 | https://openalex.org/W2017662902 | https://openalex.org/W2031297793 | https://openalex.org/W2034552404 | https://openalex.org/W2042089312 | https://openalex.org/W2043652283 | https://openalex.org/W2048076035 | https://openalex.org/W2059393181 | https://openalex.org/W2077046138 | https://openalex.org/W2077138175 | https://openalex.org/W2085901669 | https://openalex.org/W2101625161 | https://openalex.org/W2116372873 | https://openalex.org/W2141364352 | https://openalex.org/W2157914497 | https://openalex.org/W2190475976 | https://openalex.org/W2242734069 | https://openalex.org/W2281826643 | https://openalex.org/W2292147645 | https://openalex.org/W2298230951", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2186867453", null, "https://www.cabdirect.org/abstracts/20103359581.html", null, "Influence of Compost and Rock Amendments on Growth and Active Ingredients of Safflower (Carthamus tinctorius L.).", "article", "en", "2010-01-01", 2010, "A. E. Rabie Kawthar | Hossam H. Manaf | A. H. G. Hasnaa | I. M. Shahat", "- | https://orcid.org/0000-0001-9437-713X | - | -", null, null, null, "AUSTRALIAN JOURNAL OF BASIC AND APPLIED SCIENCES", "International Network for Scientific Information Publication", "1991-8178", "4", "7", "1626–1631", "The effect of compost (0, 5, 10 and 20 ton/fed), rock amendments (0, 500, and 1000 kg/fed) and their combinations on some morphological parameters, yield and active ingredients of safflower (Carthamus tinctorius L.) was carried out in the field during 2006/2007 & 2007/2008 seasons. Two samples were taken after 150 and 190 day from planting. The obtained results indicated that all treatments achieved an increament in morphological parametres, carthamin of petals yield and oil content of seeds comparing with the control. As for the effect of single treatments on growth parameters and active ingredients, the compost 20 ton/fed and rock 1000 kg/fed revealed significant values than the control, except height with R1000 in both seasons. The combination of high concentration of compost (20 ton/fed) and rock phosphate (1000 kg/fed) recorded the highest values in this concern (except plant height and fatty acids charachters). Meanwhile, C20 led to obtain good quality of safflower oil by increasing unsaturated/saturated fatty acids ratio.", "Carthamus | Compost | Sowing | Phosphorite | Agronomy | Horticulture | Biology | Yield (engineering) | Chemistry | Animal science | Botany | Materials science | Fertilizer", "Sunflower and Safflower Cultivation", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 7, 17, "https://openalex.org/W1601799770 | https://openalex.org/W1865636442 | https://openalex.org/W1972597064 | https://openalex.org/W1975564953 | https://openalex.org/W1985657453 | https://openalex.org/W1988572867 | https://openalex.org/W1990910766 | https://openalex.org/W2001032228 | https://openalex.org/W2035179978 | https://openalex.org/W2047320410 | https://openalex.org/W2057547226 | https://openalex.org/W2065939772 | https://openalex.org/W2126309603 | https://openalex.org/W2137184816 | https://openalex.org/W2187804125 | https://openalex.org/W2278439994 | https://openalex.org/W2279990642", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W1589741452", null, "https://africaneditors.org/journal/RJ/abstract/55274-97242", null, "Effects of mineral and organic fertilizers on crop productivity and nutrient use efficiency in smallholder farms of Southern Rwanda", "article", "en", "2013-01-01", 2013, "Charles Bucagu | Jjm Mbonigaba | B. Uwumukiza", "https://orcid.org/0000-0001-8625-931X | - | -", null, "University of Rwanda", "RW", "Rwanda Journal", "African Journals OnLine", "2305-2678", "1", "1", "15–34", "Smallholder farms in southern Rwanda are characterized by soil fertility depletion due to continuous cultivation without nutrient replacement, leading to poor crop productivity and threatening food security. Fertilizer application is therefore a pre-requisite to improve productivity in these soils. A study was conducted to determine the effects of combined mineral and organic fertilizers on maize ( Zea mays L.) and beans ( Phaseolus vulgaris L.) and nutrient use efficiency in farms selected from southern part of Rwanda. Simbi and Maraba were selected as representative sectors, and Umurera and Gasharu as representative villages in the two sectors, respectively. Farms were selected based on key socio-economic status (land size, livestock ownership, type of house, and labour availability). Two fields under either maize or bean crop were demarcated on each farm and one of them received fertilizer application comprising manure (1600 kg/ha) and mineral fertilizer (NPK 17-17-17) at a rate of 200 kg/ha. Maize plots were top-dressed with additional urea fertilizer at a rate of 50 kg/ha at flowering. Other two fields grown with the same crops without fertilizer application served as control treatment. In addition, a greenhouse experiment was run to assess crop response in semi-controlled environment. Soils were the most fertile in Simbi and in wealthier farms. Maize plants were significantly (P = 0.03) shorter in Simbi (1.7 m) than in Maraba (1.8 m). Grain yield was higher in Simbi (3.2 t ha -1 ) than in Maraba (1.9 t ha -1 ) and increased up to 3.4 t ha -1 in fields with fertilizer application. Similar trend was observed in the greenhouse. In beans, fertilizer application significantly (P<0.001) increased the number of pods per plant, the number of grains per pod and bean yield of 1.4 t ha -1 . Agronomic efficiency (AE) was higher in Simbi than in Maraba and was the highest in wealthier farms. It was concluded that biophysical factors (field location and initial soil fertility status) greatly influenced crop yield and fertilizer. Keywords : Bean, maize, fertilizer response, farm type, Rwanda", "Agronomy | Fertilizer | Crop | Nutrient | Manure | Productivity | Soil fertility | Crop yield | Environmental science | Soil water | Food security | Biology | Agriculture | Ecology | Economics", "Agronomic Practices and Intercropping Systems", "Agronomy and Crop Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 7, 17, "https://openalex.org/W9411391 | https://openalex.org/W1488574179 | https://openalex.org/W1965858453 | https://openalex.org/W1970690424 | https://openalex.org/W1972838518 | https://openalex.org/W1975611550 | https://openalex.org/W2053111971 | https://openalex.org/W2067442263 | https://openalex.org/W2104226344 | https://openalex.org/W2113462605 | https://openalex.org/W2151650022 | https://openalex.org/W2151923395 | https://openalex.org/W2168921100 | https://openalex.org/W2292222893 | https://openalex.org/W2303261695 | https://openalex.org/W2566448363 | https://openalex.org/W4285719527", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2186718334", "https://doi.org/10.5897/jpp12.043", "https://academicjournals.org/journal/JPP/article-abstract/C906B8A5725", null, "Chemical composition of the methanolic leaf and stem bark extracts of Senna siamea Lam.", "article", "en", "2013-04-30", 2013, "Aminu Mohammed | Mubarak Labaran Liman | Atiku", "https://orcid.org/0000-0001-5592-1083 | https://orcid.org/0000-0001-6533-5395 | -", null, null, null, "Journal of Pharmacognosy and Phytotherapy", "Academic Journals", "2141-2502", "5", "5", "98–100", "The study was conducted to evaluate some chemical constituents of the leaf and stem bark of Senna siamea. Standard methods were used in all the analysis. Preliminary phytochemical screening indicated the presence of flavonoids, tannins, polyphenols, anthraquinones, saponins, and glycosides. Quantitative study of some phytoconstituents showed a significant difference of (p < 0.05) between the leaf contents and that of the stem bark with the exception of tannins. The results of elemental analysis revealed that the levels of potassium (K), sodium (Na), magnesium (Mg) and manganese (Mn) differed significantly (p < 0.05) when leaf contents were compared with that of the stem bark, while nickel (Ni), chromium (Cr), iron (Fe) and copper (Cu) contents were not statistically (p < 0.05) different. This result indicated that S. siamea has great potentials as it contains active pharmaceutical ingredients.", "Anthraquinones | Chemistry | Bark (sound) | Phytochemical | Potassium | Glycoside | Chemical composition | Polyphenol | Traditional medicine | Manganese | Sodium | Magnesium | Botany | Biology | Organic chemistry | Medicine | Biochemistry", "Phytochemistry and biological activity of medicinal plants", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", null, null, null, 6, 11, "https://openalex.org/W1518708747 | https://openalex.org/W1889893000 | https://openalex.org/W1998352470 | https://openalex.org/W2016750201 | https://openalex.org/W2124310814 | https://openalex.org/W2145250084 | https://openalex.org/W2149681111 | https://openalex.org/W2237169794 | https://openalex.org/W2289868092 | https://openalex.org/W2344912615 | https://openalex.org/W2505668947", false, "2016-06-24 00:00:00"], ["https://openalex.org/W3025436729", "https://doi.org/10.66392/003777217820653985", "https://doi.org/10.66392/003777217820653985", null, "Let's Talk! Teaching Race in the Classroom", "article", "en", "2017-01-01", 2017, "Candra Flanagan | Anna Hindley", "- | -", null, null, null, "Social Education", null, "0037-7724", "81", "1", "62–66", "Even before the Smithsonian's National Museum of African American History and Culture (NMAAHC) opened its doors on September 24, 2016, educators at the museum were committed to fostering open, honest, and productive dialogues on race. Various programs have been designed to prepare educators to bring conversations of race, identity, and racism into the educational setting with the goals of developing positive self-identities, reducing prejudice, and increasing racial understanding to the classroom.", "Race (biology) | Mathematics education | Pedagogy | Sociology | Computer science | Psychology | Gender studies", "Diverse Educational Innovations Studies", "General Agricultural and Biological Sciences", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 6, 1, "https://openalex.org/W136766181", false, "2025-07-25 00:00:00"], ["https://openalex.org/W3009587973", null, "http://ejhs.ju.edu.et/index.php/ejast/article/view/823", null, "Estimation of critical period for weed control in sesame (Sesamum indicum L.) in northern Ethiopia", "article", "en", "2011-06-07", 2011, "Mizan Amare", "-", "Mizan Amare", null, null, "Ethiopian Journal of Applied  Science and Technology", null, null, "2", "1", "59–66", "A field experiment was conducted for three consecutive cropping seasons (2006, 2007 and2008) to estimate the critical period of weed control and yield loss in sesame at HumeraAgricultural Research Center, Northwestern Ethiopia. Quantitative series of both increasingduration of weedy and weed free periods were compared with complete weed free andweedy check. The experimental design used was RCBD with three replications. The resultsindicated that the experimental field was infested both with broadleaved (90.1%) and grassy(9.9%) weeds. Three years pooled data revealed that, Ocimum basilicum, Corchorus trilocularis,Corchorus orinocensis and Hibiscus trionum were among the dominant broadleaved weedswhere as Digitaria abyssinica and Digitaria ternata, were the dominant grassy weeds. Significantdifference in dry weed biomass was observed both under early and late competition periodsin all the three years. Uninterrupted weed growth caused a reduction of 82.9%, 82.5% and86.3% in 2006, 2007 and 2008 respectively, in yield as compared to complete weed free. On theother hand, the yield loss from weedy up to 14 and weed free up to 28 or more days after cropemergence were less than 10% and hence, the critical period of weed control in sesame atHumera area was found to be between 14 and 28 days after crop emergence with duration of14 days.", "Weed | Sesamum | Weed control | Digitaria sanguinalis | Ocimum | Agronomy | Biology | Basilicum | Crop | Digitaria | Horticulture", "Weed Control and Herbicide Applications", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 6, 14, "https://openalex.org/W1159705437 | https://openalex.org/W1498475232 | https://openalex.org/W1543825875 | https://openalex.org/W2018250838 | https://openalex.org/W2110429085 | https://openalex.org/W2118223843 | https://openalex.org/W2129775545 | https://openalex.org/W2152265458 | https://openalex.org/W2175025212 | https://openalex.org/W2244055863 | https://openalex.org/W2267011475 | https://openalex.org/W2289185142 | https://openalex.org/W2507530219 | https://openalex.org/W2791017910", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2578554148", null, "https://www.entomoljournal.com/vol3Issue3/pdf/3-3-48.1.pdf", null, "Study on the biology of blowfly and the food consumption of blowfly maggots", "article", "en", "2015-06-01", 2015, "Bismillah Shah | Imtiaz Ali Khan | Nazeer Ahmed", "https://orcid.org/0000-0002-8407-8627 | https://orcid.org/0000-0002-7088-8215 | https://orcid.org/0000-0002-1442-5902", null, null, null, "Journal of Entomology and Zoology Studies", "AkiNik Publications", "2320-7078", "3", "3", "321–323", "To study the biology of blowfly and the food consumption of blowfly maggots, the present research work was carried out at Entomology research laboratory, The University of Agriculture, Peshawar during 2013. The blowfly (green bottles, blue bottles or carrion flies), is a well known scavenger insects and primary insects commonly utilized to indicate a post-mortem interval. Due to its importance as a death indicator in forensic entomology, a considerable amount of data on its growth and development has been generated. This experiment was conducted in two steps. In step 1, fresh meat was exposed to collect the eggs which were reared and used to study the biology of blowfly. Calculating the age of different life stages of blowfly, hourly developmental data is presented i-e eggs hatched in 16 hours while all the three instars of larvae took 92 hours followed by the pupal stage which was 336 hours. Adult’s life was recorded 192 hours. In this way the total duration was recorded 636 hours. In step 2, to study the food consumption of blowfly maggots, three plastic jars provided each with known amount of meat and 10 active feeding 1 st instar larvae were placed in an incubator at a constant temperature and relative humidity. The average meat consumed by 10 larvae was 19.3 gm and the average meat consumed per larvae was recorded 1.93 gm. This report recommends the study of biology of blowflies on different feeding sources plus growth rates and food consumption rate of blowfly maggots on different body tissues or food sources.", "Maggot | Forensic entomology | Instar | Pupa | Biology | Larva | Carrion | Calliphoridae | Toxicology | Zoology | Veterinary medicine | Animal science | Ecology", "Forensic Entomology and Diptera Studies", "Insect Science", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", null, null, null, 6, 7, "https://openalex.org/W2004472120 | https://openalex.org/W2022209420 | https://openalex.org/W2038487384 | https://openalex.org/W2081648591 | https://openalex.org/W2091972454 | https://openalex.org/W2206959335 | https://openalex.org/W3204452676", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2265187030", null, "http://www.dbpia.co.kr/Journal/ArticleDetail/NODE01801104?q=%5Bproduct%20sound%C2%A7coldb%C2%A72%C2%A751%C2%A73%5D&Multimedia=0&isFullText=0&specificParam=0&SearchMethod=0", null, "Himasthla kusasigi (Trematoda, Echinostomatidae) recovered from the Intestine of the Dunlin, Calidris alpina sakhalina, in Korea", "article", "en", "2000-04-01", 2000, "Jong Phil Chu | Yoo Jung Cho | Jeong Yoo | Sung Gyun Park", "- | - | https://orcid.org/0000-0002-4269-6953 | -", null, null, null, "Animal Systematics Evolution and Diversity", "Korean Society of Systematic Zoology", "2234-6953", "16", "1", "125–131", null, "Calidris | Biology | Trematoda | Zoology | Fishery | Ecology | Helminths", "Invertebrate Taxonomy and Ecology", "Ecology, Evolution, Behavior and Systematics", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", "cc-by-nc", null, null, 6, 1, "https://openalex.org/W1917742536", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W262574679", "https://doi.org/10.14249/eia.2012.21.2.279", "http://journal.kci.go.kr/kseia/archive/articleView?artiId=ART001657518", null, "Characteristics of phytoncide production at the recreation forest in the Chungbuk area", "article", "en", "2012-04-01", 2012, "이상우 | 박덕규 | Kim Kwang Yul", "- | - | -", null, "Chungbuk National University", "KR", "Journal of Environmental Impact Assessment", null, "1225-7184", "21", "2", "279–287", "Abstract Phytoncide, which is emitted from plant against the insect species and bacterium, has beenknown as a health builder for human. Monoterpenes are major components of phytoncide. Thisstudy was conducted to investigate the distribution characteristics of phytoncide(monoterpene)depending on main species of tree, season, and meteorological factors in the 5 recreation forests,Chungbuk area.From the result of the study. it was shown that the annual concentrations of monoterpene areranged in 236.0pptv - 698.3pptv depending on main species of tree. The variation of seasonalconcentration was summer > spring > fall. The monoterpene concentration of coniferous forestwas founded to be higher than broad leaved forest. In general, concentration of majorcomponents is a-pinene > b-pinene > camphene > d-limonene. The concentration of terpenewas founded to be greatly influenced by the meteological factors such as insolation andtemperature.Keywords : forest lodge, phytoncide, monoterpenes, coniferous forest, broad leaved forest", "Monoterpene | Recreation | Forestry | Environmental science | Camphene | Geography | Ecology | Biology | Botany | Essential oil", "Plant and animal studies", "Ecology, Evolution, Behavior and Systematics", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 6, 6, "https://openalex.org/W1990612427 | https://openalex.org/W1991579177 | https://openalex.org/W2039228750 | https://openalex.org/W2089015853 | https://openalex.org/W2111017263 | https://openalex.org/W2135911221", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2962697245", null, "https://www.phytojournal.com/archives/2018/vol7issue3S/PartB/SP-7-3-11-763.pdf", null, "Effect of seasonal variation on growth and oil yield in Ocimumafricanum Lour", "article", "en", "2018-05-01", 2018, "Jnanesha Ac | Ashish Kumar | Vijaya Kumar M", "- | https://orcid.org/0000-0002-2711-7917 | -", null, null, null, "Journal of Pharmacognosy and Phytochemistry", "AkiNik Publications", "2278-4136", "7", null, "73–77", "Essential oil extracted from different parts of the Ocimumafricanum Lour. and its chemical constituents affected by two seasons namely summer and winter growing variation were investigated. The hydro distilled essential oil content from different parts of the plant obtained from summer and winter season ranges from 0.2% to 0.6%. However, the highest essential oil content (0.3% to 0.6%) was recorded in summer and lowest oil content (0.2% to 0.3%) was recorded in winter season. The essential oil consists of Citral II is the most abundant component followed by Citral I. The highest amount of Citral I obtained from different parts of O.africanumviz., whole herb (42.5%), leaf (43.5%), stem (44.8 %) and inflorescence (39.9%) collected during summer was observed and Citral II was followed by Citral I (33.7%, 36.2%, 36.2% and 34.6% respectively). Whereas other essential oil components viz., Citronellol, Linalool and geraniol content was higher in different parts of plant obtained during winter season compared to summer season and rest of the essential oil content were higher in summer season compared to winter season. Similarly, growth parameter viz., plant height (65.8 cm), number of branches (23), number of leaves (435 no.) and leaf area (14.68 m2) were also higher in summer season compared to winter season.", "Citral | Inflorescence | Citronellol | Essential oil | Geraniol | Linalool | Seasonality | Growing season | Summer season | Horticulture | Winter season | Herb | Botany | Biology | Geography | Ecology | Medicinal herbs | Traditional medicine", "Essential Oils and Antimicrobial Activity", "Food Science", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", null, null, null, 6, 5, "https://openalex.org/W2012394448 | https://openalex.org/W2042154297 | https://openalex.org/W2087333481 | https://openalex.org/W2119818276 | https://openalex.org/W2151393496", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2588842408", null, "https://hgpu.org/?p=7054", null, "A NPR System for Generating Floral Patterns based on L-System", "article", "en", "2012-01-09", 2012, "Yu‐Sheng Chen | Jie Shie | Lieu-Hen Chen", "https://orcid.org/0000-0002-5990-0455 | - | -", null, "National Chi Nan University", "TW", "Bulletin of Networking, Computing, Systems, and Software", null, null, "1", "1", "38–41", "In history, the decorative pattern represents the design of art. The styles of decorative patterns are unique according to different countries and cultures. Because of the decorative floral pattern giving human an elegant and abundance impression, it is applied to many fields including product packaging, advertising or multimedia materials design. In this paper, we simulate the plant growth to create the decorative floral patterns. One of plant growth simulation approach is L-System (Lindenmayer System). Due to plant growth information can be stored in the L-system grammar formats, the styles of decorative patterns can be controlled by production rules which users define. However , defining a complex L-system grammar structure by non-professional users is clearly a very difficult task. It requires expert with both botanic and programming knowledge to manipulate. Therefore, we propose a user-friendly CAD system for generating L- grammar based on a sketch-based interface. Users can draw arbitrary lines or curves on the canvas for automatically creating decorative floral patterns. In addition, we integrate the Simeco system with CUDA (Compute Unified Device Architecture) for improving the inefficiency of modeling and simulating plants.", "Sketch | Computer science | Task (project management) | Grammar | Inefficiency | Engineering drawing | Engineering | Algorithm", "Greenhouse Technology and Climate Control", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 6, 3, "https://openalex.org/W2047595260 | https://openalex.org/W2078283817 | https://openalex.org/W2172081191", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W1552477935", null, "http://ijas.iaurasht.ac.ir/article_513320_ea5c5170bab82dbce79f13399e6fbf36.pdf", null, "DEVELOPING A MODIFIED IN VITRO GAS PRODUCTION TECHNIQUE TO REPLACE THE NYLON BAG METHOD OF EVALUATING PROTEIN DEGRADATION OF ALFALFA HAY IN RUMINANTS", "article", "en", "2015-06-01", 2015, "Abolfazl Aghajanzadeh-Golshani | Naser Maheri‐Sis | R. Salamat Doust-Nobar | Yahya Ebrahimnezhad | Ardavan Ghorbani", "https://orcid.org/0000-0002-3867-3118 | https://orcid.org/0000-0001-6261-3273 | - | https://orcid.org/0000-0001-6195-9520 | https://orcid.org/0000-0001-7201-1225", null, "Islamic Azad University Shabestar", "IR", "Iranian journal of applied animal science", "Islamic Azad University of Rasht", "2251-628X", "5", "2", "339–345", "The present study was conducted to investigate the possibility of using a modified in vitro gas production technique in place of the nylon bag method to estimate protein degradability of alfalfa hay in ruminants. In the in situ experiment dacron bags were filled with 3 g alfalfa hay. This was incubated in the rumen of three ruminally cannulated Ghezel rams for the periods of 0, 2, 4, 8, 12, 16, 24, 36 and 48 h. At the end of the experiment, dry matter, organic matter and crude protein degradability (CPD) were calculated. In the in vitro experiment, buffered rumen fluid was prepared in a solution of 19:1 artificial saliva to rumen fluid, which was pre-incubated by rapidly fermentable carbohydrates for 4 h. After pre-incubation, 30 mL of the buffered rumen fluid were added to 100 mL syringes, containing the alfalfa sample, with 7.5 mg N. The samples were incubated for 2, 4, 6, 8, 12, 16, 24, 36, 48, 60 and 72 hours, after which net gas production was computed. In the third experiment, 25 grams of faeces were mixed with 50 mL of artificial saliva, which was then made up to 1 liter by adding more artificial saliva and filtered. Then, the suspension was pre-incubated for 4 h. After pre-incubation, the same steps used to measure gas production were conducted. Results showed that there were significant differences between gas production with rumen liquor and faeces suspension at 2, 4, 24, 36 and 48 h of incubation, while no significant differences were found at other incubation times. There was a close relationship between crude protein degradation at different times and amount of gas production using rumen liquor [CPD= 58.93 + 0.32 gas (r2=0.76, n=18)] and fecal suspension [CPD= 58.38 + 0.27 gas (r2=0.60, n=18)]. The results indicated that faeces suspension can be used instead of rumen liquor as the medium in the gas production method. Development of the gas production technique could result in reducing the need to use fistulated animals in feed evaluation studies.", "Rumen | Incubation | Hay | Saliva | Dry matter | Animal science | Chemistry | Food science | Chromatography | Biology | Agronomy | Biochemistry | Fermentation", "Ruminant Nutrition and Digestive Physiology", "Agronomy and Crop Science", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", "cc-by", null, null, 6, 27, "https://openalex.org/W1542232724 | https://openalex.org/W1590588666 | https://openalex.org/W1714708447 | https://openalex.org/W1838264965 | https://openalex.org/W1975330590 | https://openalex.org/W1980492271 | https://openalex.org/W1981343062 | https://openalex.org/W1982453110 | https://openalex.org/W1989278414 | https://openalex.org/W1995709947 | https://openalex.org/W1997087247 | https://openalex.org/W2000343753 | https://openalex.org/W2051233098 | https://openalex.org/W2093071853 | https://openalex.org/W2104067151 | https://openalex.org/W2105464362 | https://openalex.org/W2113783133 | https://openalex.org/W2113986175 | https://openalex.org/W2143444973 | https://openalex.org/W2154169361 | https://openalex.org/W2164366449 | https://openalex.org/W2170140186 | https://openalex.org/W2297777620 | https://openalex.org/W2410534650 | https://openalex.org/W2423552556 | https://openalex.org/W2461532696 | https://openalex.org/W2498654811", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2186921169", null, "https://www.ajofai.info/Abstract/Risk%20evaluation%20of%20popular%20ready-to-eat%20food%20sold%20in%20bangkok.pdf", null, "Risk evaluation of popular ready-to-eat food sold in Bangkok", "article", "en", "2010-01-01", 2010, "Warapa Mahakarnchanakul | W. Ontoum | Siriporn Stonsaovapak | N. Pirapatrungsuriya | P. Choo-in | T. Borisuit", "https://orcid.org/0000-0001-6089-9714 | - | - | - | - | -", null, "Kasetsart University", "TH", "Asian Journal of Food and Agro-Industry", null, "1906-3040", "3", "1", "75–81", "Risk evaluation of ready to eat food sold in fresh-markets and by street vendors in Bangkok was conducted. The purpose of this study was to evaluate the food safety situation of ready to eat food and prioritize the significant risks in order to provide preventive measures in ready to eat food preparation. Samples were collected from 5 types of the most favoured foods which are Khanomgeen-namya, Khanomgeen-namprik, Namprik-kapi, Namprikplaraa and Yum. 24 samples were taken from each type and then analyzed for microbiological quality and heavy metals contamination. Most of food items were contaminated with Escherichia coli (48.3%) which had the highest amount of 7 x 10 4 CFU/g. In addition, Bacillus cereus (61.67%) with the highest amount 1.4 x 10 4 CFU/g, Staphylococcus aureus (5.00%) with the highest amount 2 x 10 3 CFU/g and Clostridium perfringens (25.83%) with the highest amount 4 x 10 3 CFU/g were observed. Among 120 samples there were 7 samples contaminated with Salmonella. Total microbiological count were found at <10 3 - 3.6 x 10 8 CFU/g which indicated that 85% of the food sold was under the ready to eat food standards set by  | https://openalex.org/W612246358 | https://openalex.org/W1996081325 | https://openalex.org/W2037343815 | https://openalex.org/W2168750598", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2098633655", "https://doi.org/10.5897/ajar11.418", "https://academicjournals.org/journal/AJAR/article-abstract/913B83531444", null, "Evaluation of integrated KW-GIUH and MUSLE models to predict sediment yield using geographic information system (GIS) (Case study: Kengir watershed, Iran)", "article", "en", "2011-09-12", 2011, "Saleh Arekhi | Afshin Alizadeh Shabani | Seyed Kazem Alavipanah", "- | https://orcid.org/0000-0002-6930-9503 | https://orcid.org/0000-0002-3554-111X", null, null, null, "African Journal of Agricultural Research", "Academic Journals", "1991-637X", "6", "18", "4185–4198", "In this study, the Kinematic Wave-Geomorphologic Instantaneous Unit Hydrograph-Modified Universal Soil Loss Equation (KW-GIUH-MUSLE) model was tested for its sediment yield estimation potential on the Kengir watershed in Iyvan city of Ilam Province, Iran. The runoff factor was calculated for six storms during 2000. The spatial distribution of soil erodibility factor was taken from the attribute data pertaining to the soils of the study area. The topographic factor (LS) was calculated by multiplying the length (L) and slope (S) factor from the created maps. On the other hand, cropping management and erosion control practice factors, for different land use, were taken from the satellite based land use/land cover attribute data and geographic information system (GIS), respectively. Subsequently, all the parameters were substituted in the KW-GIUH-MUSLE in order to derive event-wise sediment yields. Sediment yield at the outlet of the study watershed was simulated for 6 storm events spread over the year 2000 and validated with the measured values. The percent deviations between the sediment yield measurements and observations vary in the range of -22.50 to 5.83%. The high coefficien //openalex.org/W2090796885 | https://openalex.org/W2100855757 | https://openalex.org/W2103711482 | https://openalex.org/W2124282235 | https://openalex.org/W2127876446 | https://openalex.org/W2133460506 | https://openalex.org/W2134318985 | https://openalex.org/W2169992061 | https://openalex.org/W2186647437 | https://openalex.org/W2187582315 | https://openalex.org/W2260497040 | https://openalex.org/W2263772555 | https://openalex.org/W2285619913 | https://openalex.org/W2485746917 | https://openalex.org/W2971047910 | https://openalex.org/W3021464732 | https://openalex.org/W3217236453", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W1547774614", "https://doi.org/10.62550/dld252259", "https://doi.org/10.62550/dld252259", null, "Digital Photometric Method for Determining Degree of Harvest Maturity and Ripeness of ‘Sinta’ Papaya (Carica papaya L.) Fruits", "article", "en", "2012-09-01", 2012, "Dulce Leonardo Domingo | Banyuhay P. Serrano | Edralina P. Serrano | E. J. del Rosario", "- | - | - | -", null, "University of the Philippines Los Baños", "PH", "The Philippine Agricultural Scientist", null, "0031-7454", "95", "3", "252–259", "The degree of ripeness of ‘Sinta’ papaya (Carica papaya L.) fruits was determined by taking digital pictures of fruits at varying stages of ripeness, followed by color analysis of the digital photographs based on the generated red (R), green (G) and blue (B) color values of the photographs using a computer software (RGB Analysis of Image Color). The stages of fruit ripeness were classified based on RGB values, visual characteristics, as well as total soluble solids, total carbohydrates, titratable acidity and firmness, of the fruits; these parameters were correlated with the stages of ripeness. There was a significant increase in total soluble solids and total carbohydrates of the fruits from ripening stage 1 (green) to stage 2 (with tinge of yellow) and a significant decrease in firmness as the fruits ripened. No significant change was observed in titratable acidity of the fruits during ripening. Firmness and total carbohydrates showed the strongest correlation with degree of ripeness among the four parameters studied. From the slopes in plots of RGB values versus firmness, binary and ternary color functions were formulated in order to measure the degree of fruit ripeness. The correlation coefficients were 0.9387 and 0.9497 for plots (versus fruit firmness) of the binary and ternary color functions, respectively. The results showed that the photometric method, using a digital camera combined with software for color analysis, can help to quantitatively determine the degree of maturity and ripeness of ‘Sinta’ papaya fruits.", "Ripeness | Ripening | Carica | Titratable acid | Mathematics | Horticulture | RGB color model | Food science | Chemistry | Biology | Artificial intelligence | Computer science", "Postharvest Quality and Shelf Life Management", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 5, 23, "https://openalex.org/W43063311 | https://openalex.org/W1491830190 | https://openalex.org/W1536211993 | https://openalex.org/W1942191010 | https://openalex.org/W1968834637 | https://openalex.org/W2001227064 | https://openalex.org/W2010560725 | https://openalex.org/W2013785102 | https://openalex.org/W2028754140 | https://openalex.org/W2036085530 | https://openalex.org/W2055892944 | https://openalex.org/W2069593752 | https://openalex.org/W2077926016 | https://openalex.org/W2080500092 | https://openalex.org/W2080594068 | https://openalex.org/W2097427512 | https://openalex.org/W2111807294 | https://openalex.org/W2153214972 | https://openalex.org/W2163748203 | https://openalex.org/W2164341408 | https://openalex.org/W2186588418 | https://openalex.org/W2333427535 | https://openalex.org/W2757955198", false, "2025-07-24 00:00:00"], ["https://openalex.org/W2174780419", null, "https://app.trdizin.gov.tr/makale/TVRZMU16UTJOZz09/the-efficacy-of-thymol-and-oxalic-acid-in-bee-cake-against-bee-mite-varroa-destructor-anderson-trueman-in-honey-bee-apis-mellifera-l-cclonies", null, "The efficacy of thymol and oxalic acid in bee cake against bee mite (Varroa destructor Anderson & Trueman) in honey bee (Apis mellifera L.) colonies.", "article", "en", "2015-01-01", 2015, "Berna Emsen | Ahmet Dodoloğlu", "https://orcid.org/0000-0001-5377-9597 | https://orcid.org/0000-0002-9424-4887", null, null, null, "Kafkas Universitesi Veteriner Fakultesi Dergisi", "University of Kafkas", "1300-6045", "21", "1", "45–48", null, "Varroa destructor | Honey bee | Varroa | Thymol | Biology | Oxalic acid | Mite | Honey Bees | Botany | Toxicology | Food science | Biochemistry", "Insect and Pesticide Research", "Insect Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 5, 13, "https://openalex.org/W1465926747 | https://openalex.org/W1577594667 | https://openalex.org/W1964237181 | https://openalex.org/W1994523345 | https://openalex.org/W2039651774 | https://openalex.org/W2092290471 | https://openalex.org/W2125411514 | https://openalex.org/W2174813247 | https://openalex.org/W2176168738 | https://openalex.org/W2185531774 | https://openalex.org/W2189162121 | https://openalex.org/W2281724698 | https://openalex.org/W2466854347", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W134052670", null, "http://www.koreascience.or.kr/article/ArticleFullRecord.jsp?cn=E1IEAM_2007_v15n1_1", null, "Egg Diapause Induction in Multivoltine Silkworm Bombyx mori for Long-term Germplasm Preservation", "article", "en", "2007-09-01", 2007, "Rupendra Kumar | Kangayam M. Ponnuvel", "https://orcid.org/0000-0001-8682-8869 | https://orcid.org/0000-0002-2303-716X", null, null, null, "International Journal of Industrial Entomology", null, "1598-3579", "15", "1", "1–7", "At present, multivoltine silkworm races reared five times per year involving huge manpower and rearing expenditure. Egg diapausing behavior is facultative in multivoltine and egg diapause was induced in selected multivoltine races by regulating temperature at , relative humidity 80% and photoperiod (6L:18D) in the late stage silkworm rearing. The maximum percentage of egg diapause induction was recorded in Rong Diazo, Diazo and MW13 showed 94%, 93% and 92% respectively, whereas the races A14DY and OS-616 showed minimum diapause induction 15% and 18% respectively. The diapause induced multivoltine eggs were preserved up to six months by cold preservation schedule normally adopted for bivoltine. After three and six months egg preservation, the diapause induced layings were released and observed for hatching percentage, all races showed above 82 % of hatching except the race AP12, which showed only 78 % of hatching. This methods reduce the crop cycle, gives strong safety backup and preventing the genetic erosion. This study helps formulating a new conservation method for multivoltine silkworm germplasm.", "Voltinism | Diapause | Biology | Hatching | Bombyx mori | Germplasm | Horticulture | photoperiodism | Animal science | Pupa | Botany | Larva | Genetics", "Silkworms and Sericulture Research", "Insect Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 5, 8, "https://openalex.org/W96035421 | https://openalex.org/W276835355 | https://openalex.org/W571769411 | https://openalex.org/W612707412 | https://openalex.org/W628484094 | https://openalex.org/W2507983923 | https://openalex.org/W2954713071 | https://openalex.org/W3209008522", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2810064038", null, "https://agris.fao.org/agris-search/search.do?recordID=TH2005000401", null, "Yield losses assessment due to pests on cotton in LAO PDR", "article", "en", "2001-01-01", 2001, "Vientiane", "-", "Vientiane", null, null, "Witthayasan Kasetsart (Sakha Witthayasat)", null, null, null, null, null, null, "Yield (engineering) | Agronomy | Agrofo
