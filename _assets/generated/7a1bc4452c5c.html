"Korean Society of Food Science and Technology", "0367-6293", "42", "4", "377–382", "This study was conducted to establish a method to analyze biurea decomposed from azodicarbonamide in processed foods such as wheat flour and bread. New method was developed using high performance liquid chromatography mass/mass spectrometry to determine biurea in wheat flour and bakery products. The recovery rate was 94.3-112.5%. The limit of detection for biurea was 0.003 mg/kg, and the limit of quantification was 0.01 mg/kg. The monitoring results for biurea content using established methods showed that biurea was detected at 2.76 mg/kg in the azodicarbonamide-detected flour (detection rate, 2%). The detection rate in processed foods such as baked goods was 27% (16/59). The detection range was 0.19-18.01 mg/kg (average, 3.79 mg/kg). However, it was thought that the detection level was safe due to much lower values than the standard (45 mg/kg). As a result, the newly established biurea analytical method will contribute to the management of azodicarbonamide in processed foods such as wheat flour and bakery products.", "Detection limit | Chemistry | Chromatography | Wheat flour | Mass spectrometry | High-performance liquid chromatography | Recovery rate | Food science", "Pesticide Residue Analysis and Safety", "Food Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 2, 15, "https://openalex.org/W1987633766 | https://openalex.org/W1998322423 | https://openalex.org/W2013812537 | https://openalex.org/W2018982214 | https://openalex.org/W2028543972 | https://openalex.org/W2030540461 | https://openalex.org/W2032788073 | https://openalex.org/W2040795079 | https://openalex.org/W2045391156 | https://openalex.org/W2062100399 | https://openalex.org/W2063837683 | https://openalex.org/W2091186014 | https://openalex.org/W2156251072 | https://openalex.org/W2322223330 | https://openalex.org/W2519075290", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W3086297094", null, "https://www.iasj.net/iasj?func=fulltext&aId=41000", null, "Detection of Bovine Viral Diarrhea Virus by Conventional RT-PCR: A comparative Study", "article", "en", "2011-01-01", 2011, "Karim Sadun Al-Ajeeli", "https://orcid.org/0000-0003-4379-8764", "Karim Sadun Al-Ajeeli", null, null, "Al-Anbar Journal of Veterinary Sciences", null, "1999-6527", "4", "2", null, null, "Virology | Virus | Diarrhea | Biology | Medicine | Internal medicine", "Animal Disease Management and Epidemiology", "Agronomy and Crop Science", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", "cc-by", null, null, 2, 18, "https://openalex.org/W170123386 | https://openalex.org/W1844346411 | https://openalex.org/W1982228373 | https://openalex.org/W1984050418 | https://openalex.org/W2004539279 | https://openalex.org/W2017777915 | https://openalex.org/W2025487718 | https://openalex.org/W2057104917 | https://openalex.org/W2110464083 | https://openalex.org/W2115009741 | https://openalex.org/W2136066921 | https://openalex.org/W2140672574 | https://openalex.org/W2142768648 | https://openalex.org/W2143910957 | https://openalex.org/W2153695862 | https://openalex.org/W2157992353 | https://openalex.org/W2168693854 | https://openalex.org/W2298200704", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2602573666", "https://doi.org/10.53332/uofkjas.v20i1.2290", "https://onlinejournals.uofk.edu/index.php/uofkjas/article/view/2290", null, "Genotypic Variability in Faba Bean (Vicia faba L.) for Seed Yield and Protein Content under Drought Stress during Vegetative and Reproductive Stages", "article", "en", "2016-04-18", 2016, "Awadalla Abdalla Abdelmula | Wolfgang Link | Amel Adam Mohamed | Sief Eldin Mudawi Gasim | Jamal Elkhair Khalifa", "- | https://orcid.org/0000-0003-0684-6296 | - | - | -", null, "University of Khartoum | University of Göttingen | Agricultural Research Corporation", "SD | DE", "University of Khartoum Journal of Agricultural Sciences", null, "1560-2141", "20", "1", null, "Faba bean ( Viciafaba L.) is subjected to drought stress during different growth stages. In this study, variability in seed yield and protein content was investigated when drought occurred during the vegetative and reproductive stages. Twenty-two genotypes of faba bean were fieldevaluated under three levels of drought stress at two locations in the Sudan. The three levels of drought were normal watering (non-stress), drought during the vegetative stage and drought during the reproductive stage. Data were collected on yield and vegetative traits and protein content. The results showed that yield, as well as other traits, were reduced by drought. The genotypes exhibited significant differences for 100-seed weight, plant height and protein content. The interaction between the genotypes and drought was significant for yield/plant. Some genotypes were more sensitive when drought occurred during the vegetative stage, some when drought occurred at the reproductive stage, and others were more stable under the three levels of drought. Yield/plant showed significant covariance with pods/plant and plant height. The association between different characters varied according to the trait and the time of drought incidence. The correlation of yield/plant with protein content was negative under all drought levels, and the average correlation coefficient was - 0.32. It could be concluded that the specific adaptation and the wide adaptation have great implication for improving faba bean under drought. To select for high seed yield under drought, secondary characters, such as pods/plant and plant height could be of great importance. Drought could reduce protein content and affect its association with yield/plant", "Vicia faba | Biology | Drought stress | Agronomy | Drought tolerance | Yield (engineering) | Vegetative reproduction | Horticulture", "Genetic and Environmental Crop Studies", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 2, 8, "https://openalex.org/W1146796816 | https://openalex.org/W1996783605 | https://openalex.org/W2024761309 | https://openalex.org/W2067170271 | https://openalex.org/W2073398478 | https://openalex.org/W2075045769 | https://openalex.org/W2128407234 | https://openalex.org/W2172586464", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2609329232", null, "http://ijmcr.com/wp-content/uploads/2015/11/Paper141185-1188.pdf", null, "Salinity effect on wheat Triticum aestivum L. callus growth and development", "article", "en", "2015-11-21", 2015, "Zahra N. Al Hattab | Majid Sh. Hamdalla | Mohammed A. Mohammed", "- | https://orcid.org/0000-0003-1531-411X | -", null, null, null, "International Journal of Multidisciplinary and Current Research", null, "2321-3124", "3", null, null, "This research was conducted to study the effect of salinity on callus induction and development of two local wheat cultivars Tamoz2 and Iraq. Four different methods were used to sterilize the mature seeds. Sterilizing the seeds before and after soaking them in water with absolute Ethanol for 1 min. followed by 6% NaOCl for 10 min. showed 0% contamination and didn't affect embryos viability. However, there was no significant difference in the percentage of contamination between this method and the method in which 70% Ethanol for 1 min. followed by 4.2% NaOCl for 10 min. before and after soaking them in water. Calli were induced from mature embryos and subjected to sodium chloride of (6, 8, 12, or 14 dSm-1). The results showed that there was significant difference between the cultivars in the calli fresh and dry weights. Tamoz2 showed higher callus induction ability than Iraq. The highest weight was recorded for the control of both cultivars which was reduced significantly as the salinity level increased. However, there was no significant difference between the salinity levels 12 and 14 ds.m-1 in the effect on calli fresh weight. Also Tamoz2 showed significantly higher dry weight than Iraq cultivar. Moreover, significant effect on the dry weight was recorded for the salt levels. The highest dry weight was for 8 ds.m-1 treatment followed by the control. Interaction analysis showed that the highest dry weight was for Tamoz2 grown on 8 dS.m-1 whereas the lowest was for Iraq grown on 12 ds.m1 salinity level. In conclusion Tamoz2 was more salt tolerant than Iraq at the callus level under the condition of this experiment.", "Salinity | Cultivar | Dry weight | Callus | Horticulture | Significant difference | Chemistry | Animal science | Biology | Botany | Mathematics | Ecology", "Seed Germination and Physiology", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 2, 12, "https://openalex.org/W770060894 | https://openalex.org/W1605574105 | https://openalex.org/W1970508830 | https://openalex.org/W2003505448 | https://openalex.org/W2009432571 | https://openalex.org/W2017160804 | https://openalex.org/W2024556021 | https://openalex.org/W2067518280 | https://openalex.org/W2077070258 | https://openalex.org/W2079410119 | https://openalex.org/W2089060021 | https://openalex.org/W2094170309", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W3010979438", null, "http://www.ejobios.org/download/change-of-phytoalexins-stilbenoids-of-vine-leave-tsitska-variety-vitis-vinifera-l-in-condition-7469.pdf", null, "Change of phytoalexins -stilbenoids of vine leave Tsitska variety ( Vitis vinifera L.) in condition Downy mildew", "article", "en", "2020-02-29", 2020, "Marine Bezhuashvili | L. Tskhvedadze | M. Surguladze | Giorgi Shoshiashvili | Lali Elanidze | Paata Vashakidze", "- | - | - | - | https://orcid.org/0000-0001-7937-677X | -", null, null, null, "Eurasian Journal of Biosciences", "Foundation for Enviromental Protection and Research", "1307-9867", "14", "1", "167–171", "It is investigated change of phytoalexin-stilbenoids in the leaves of white grapevine Tsitska infected by Downy mildew. The Tsitska is cultivated in the west part of Georgia. Comparing the healthy and diseased grapevine leaves physiological concentrations of stilbenoids, in the infected grapevine leaves it is established following stress-metabolite stilbenoids: trans-resveratrol and e- viniferin. The stress-metabolite stilbenoids in the conditions of the disease with Downy mildew is a scientific novelty for the vine leave Tsutska variety. The results of the research are important for determination the correlation of the vine immunity with the phytoalexins-stilbenoids.", "Downy mildew | Vine | Phytoalexin | Biology | Plasmopara viticola | Vitis vinifera | Botany | Resveratrol | Horticulture", "Horticultural and Viticultural Research", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 2, 17, "https://openalex.org/W21618322 | https://openalex.org/W1220199659 | https://openalex.org/W1732125059 | https://openalex.org/W1746565110 | https://openalex.org/W1999373749 | https://openalex.org/W2003678009 | https://openalex.org/W2011850946 | https://openalex.org/W2022716238 | https://openalex.org/W2030192273 | https://openalex.org/W2045363495 | https://openalex.org/W2101702198 | https://openalex.org/W2106787650 | https://openalex.org/W2114219292 | https://openalex.org/W2167030258 | https://openalex.org/W2602098918 | https://openalex.org/W2791715623 | https://openalex.org/W3210243393", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W224744488", null, "https://www.cabdirect.org/abstracts/20143112077.html", null, "Identification of QTLs associated with cold tolerance in wheat (Triticum aestivum L.).", "article", "en", "2014-01-01", 2014, "A H Gorji | Ramin Hajianfar | B. Rostamforody", "- | - | -", null, null, null, "International Journal of Agriculture and Biosciences", null, "2305-6622", "3", "1", "45–48", null, "Biology | Agronomy | Identification (biology) | Cold tolerance | Quantitative trait locus | Horticulture | Botany | Gene | Genetics", "Wheat and Barley Genetics and Pathology", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 2, 19, "https://openalex.org/W1239517042 | https://openalex.org/W1965303443 | https://openalex.org/W1969485234 | https://openalex.org/W1987342501 | https://openalex.org/W1988939767 | https://openalex.org/W2006807779 | https://openalex.org/W2008962983 | https://openalex.org/W2020886778 | https://openalex.org/W2039032200 | https://openalex.org/W2042849624 | https://openalex.org/W2060777652 | https://openalex.org/W2061744749 | https://openalex.org/W2073780302 | https://openalex.org/W2101001179 | https://openalex.org/W2102222071 | https://openalex.org/W2111646009 | https://openalex.org/W2121260834 | https://openalex.org/W2130025125 | https://openalex.org/W2295770016", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2186444111", null, "https://www.academicjournals.org/article/article1379771444_Fakir and Özçelik.pdf", null, "Mandragora officinarum L. (Solanaceae): a new record for the flora of Turkey.", "article", "en", "2009-01-01", 2009, "Hüseyin Fakir | Hasan Özçelik", "https://orcid.org/0000-0002-6606-8011 | https://orcid.org/0000-0002-0207-0921", null, null, null, "AFRICAN JOURNAL OF BIOTECHNOLOGY", "Academic Journals", "1684-5315", "8", "15", "3560–3564", "Mandragora officinarum L. (Solanaceae ) was collected from western area of the Mediterranean region of Turkey. Mandragora autumnalis Bertol. is widespread in the Mediterranean area at rock slopes, ruins, under Pinus brutia , olive trees and edges of fields in Turkey but M. officinarum L. has not been reported previously. In this study, the detailed morphological characteristics are discussed and compared with the mediterranean M. autumnalis Berthol. Line drawing, diagnostic characters and a distribution map of M. officinarum L. species of Turkey are presented.", "Mediterranean climate | Flora (microbiology) | Mediterranean Basin | Solanaceae | Geography | Biology | Botany | Mediterranean area | Forestry | Archaeology | Paleontology", "Plant Ecology and Taxonomy Studies", "Ecology, Evolution, Behavior and Systematics", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", null, null, null, 2, 3, "https://openalex.org/W1547167699 | https://openalex.org/W2127304706 | https://openalex.org/W3163144169", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2185032629", null, "http://biotech-asia.org/pdf/vol10no2/BBRAV010I02P961-971.pdf", null, "Protective Role of Black Berry Juice Against Hepatotoxcity and Reproductive Toxicity of Chlorpyrifos in Male Rats", "article", "en", "2013-12-28", 2013, "Reham Z. Hamza", "https://orcid.org/0000-0001-7083-9467", "Reham Z. Hamza", null, null, "Biosciences Biotechnology Research Asia", "Oriental Scientific Publishing Company", "0973-1245", "10", "2", null, "Chlorpyrifos (CPF) is causing different sorts of toxicity and black berry juice is a new species of Black berry juice and it is the first time to study its effect against the toxicity of CPF. Therefore, the present study is aimed to elucidate the possible protective effects of Black berry juice in alleviating the toxicity of chlorpyrifos on reproductive performance, testosterone levels, enzyme activities and lipids profile in serum of male rats. Animals were divided into four groups; one orally administered (o.d.) CPF at a dose of 9 µg/kg b.w. for consecutive 80days, Black berry juice group (50 mg/kg b.w.), Black berry juice and chlorpyrifos group and a control group. Results showed that there was a correlation between CPF administration and significant decrease of the sperm counts, spermatozoon survival and testosterone level as well as increase of sperm aberrations. CPF increased significantly the lipid profile and the levels of various serum liver marker enzymes. In contrast, co-administration of Black berry juice to CPF-treated rats restored almost most of these biochemical parameters to normal levels. On the other hand, CPF resulted in histopathological alterations in testes of male rats. However, pre-administration of Black berry juice to CPF-treated animals improved the testicular damage and alleviates the toxic effects of CPF on reproductive functions and neural functions in male rats", "Berry | Chlorpyrifos | Toxicity | Reproductive toxicity | Testosterone (patch) | Sperm | Biology | Pharmacology | Chemistry | Medicine | Endocrinology | Internal medicine | Pesticide | Botany", "Pesticide Exposure and Toxicity", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 2, 33, "https://openalex.org/W46832102 | https://openalex.org/W254453692 | https://openalex.org/W567231620 | https://openalex.org/W1920772314 | https://openalex.org/W1964456676 | https://openalex.org/W1972504209 | https://openalex.org/W1973984331 | https://openalex.org/W1975004242 | https://openalex.org/W1984315343 | https://openalex.org/W1986988638 | https://openalex.org/W1987492742 | https://openalex.org/W1987827293 | https://openalex.org/W1999536790 | https://openalex.org/W2004391012 | https://openalex.org/W2006734701 | https://openalex.org/W2020585797 | https://openalex.org/W2020883281 | https://openalex.org/W2027951676 | https://openalex.org/W2033721784 | https://openalex.org/W2044792915 | https://openalex.org/W2062568429 | https://openalex.org/W2064580091 | https://openalex.org/W2067961654 | https://openalex.org/W2070682612 | https://openalex.org/W2080911773 | https://openalex.org/W2096618734 | https://openalex.org/W2114354408 | https://openalex.org/W2116404316 | https://openalex.org/W2123764771 | https://openalex.org/W2132223856 | https://openalex.org/W2181840390 | https://openalex.org/W2239371163 | https://openalex.org/W2913100282", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W1984221271", null, "http://ibot.sav.sk/usr/Richard/docs/PolJEcol_2007_Prislopy.pdf", null, "Soil properties and microbial activity changes along spruce forest succession in an abandoned grassland", "article", "en", "2007-01-01", 2007, "Erika Gömöryová | Karol Ujházy | Richard Hrivnák | Katarína Střelcová | Dušan Gömöry", "https://orcid.org/0000-0002-0374-1168 | https://orcid.org/0000-0002-0228-1737 | https://orcid.org/0000-0003-0716-4553 | https://orcid.org/0000-0001-7284-8244 | https://orcid.org/0000-0002-9426-4247", null, "Technická univerzita vo Zvolene", "SK", "Polish Journal of Ecology", "Polish Academy of Sciences", "1505-2249", "55", "3", "457–467", "The effects of the coloniza- tion of an abandoned grassland by forest trees and the associated microenvironmental changes on soil properties and the microbial activity of soil were studied along a 170 m transect estab- lished on a former pasture colonized by Norway spruce (Picea abies Karst.) in Central Slovakia. The transect with a 5×5 m grid of sampling points crosses all successional stages from a closed forest to an open grassland, representing 50 years of secondary succession. Changes of basal soil respiration, substrate-induced respira- tion and soil catalase activity in association with tree density, light and temperature regime were examined, and their relationships with chemi- cal soil properties were documented. Generally, light conditions, tree influence and soil temper- atures were highly significantly correlated with the distance from the lower transect edge, but the correlation coefficients were not very high (|r| ranged between 0.37 and 0.70), indicating that the microsite conditions within the transect are strongly heterogeneous. With the advance of colonization, the amount of soil organic mat- ter was found to increase, probably in associa- tion with a higher amount and a lower quality of litter. Catalase activity exhibits a linear trend along the transect, which is explained by a lower direct insolation of soils (r = 0.28***) and de- creasing temperatures (r = 0.36***) in the up- per part. Basal respiration is the lowest in the middle of the transect, where colonizing spruces form a dense closed stand with soil covered by a thick layer of raw litter. Both in the lower part covered by species-rich grassland communities and in the upper part, where forest herb species begin to establish, basal respiration is higher, probably due to higher amounts of easily de- composable plant material. In addition to these transect-wide trends, stationary spatial patterns were observed for most soil variables. Generally, microbial activity rates as well as chemical soil properties exhibited spatial continuity up to the distance of approx. 40 to 60 m.", "Transect | Microsite | Litter | Ecological succession | Environmental science | Grassland | Soil respiration | Soil water | Basal area | Ecology | Picea abies | Secondary succession | Pasture | Agronomy | Biology | Soil science", "Soil Carbon and Nitrogen Dynamics", "Soil Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 2, 31, "https://openalex.org/W1491368715 | https://openalex.org/W1597831314 | https://openalex.org/W1685406372 | https://openalex.org/W1973342825 | https://openalex.org/W1975275356 | https://openalex.org/W1991407415 | https://openalex.org/W1991965509 | https://openalex.org/W2014036183 | https://openalex.org/W2020886974 | https://openalex.org/W2026307199 | https://openalex.org/W2027987335 | https://openalex.org/W2042845797 | https://openalex.org/W2051362195 | https://openalex.org/W2054670595 | https://openalex.org/W2062482781 | https://openalex.org/W2066098405 | https://openalex.org/W2082807376 | https://openalex.org/W2091857879 | https://openalex.org/W2093335880 | https://openalex.org/W2097385742 | https://openalex.org/W2112145718 | https://openalex.org/W2112339461 | https://openalex.org/W2140341891 | https://openalex.org/W2145775188 | https://openalex.org/W2147294605 | https://openalex.org/W2163527291 | https://openalex.org/W2169917233 | https://openalex.org/W2291094812 | https://openalex.org/W2469225955 | https://openalex.org/W2780388887 | https://openalex.org/W4285719527", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2258274288", null, "https://www.scholarsresearchlibrary.com/articles/exploring-factors-affecting-application-of-soil-conservation-practices-scps-by-iranian-farmers.pdf", null, "EXPLORING FACTORS AFFECTING APPLICATION OF SOIL CONSERVATION PRACTICES BY IRANIAN FARMERS", "article", "en", "2012-01-01", 2012, "Ahmad Rezvanfar | Nematollah Shiri | M Mohammadi Kanigolzar", "https://orcid.org/0000-0001-8320-791X | https://orcid.org/0000-0002-7797-3076 | -", null, null, null, "Annals of biological research", "Scholars Research Library", "0976-1233", "3", "5", "2383–2389", "This study aimed at exploring factors affecting application of soil conservation practices (SCPs) among Iranian farmers. Statistical population of this study consisted of all farmers in the Ilam province of Iran. Using Cochran's sampling formula, 137 farmers were selected as a sample. Respondents were selected by using Stratified random sampling method. For increasing reliability of the findings, 250 questionnaires distributed among farmers, ultimately 228 questionnaires completed and analyzed in SPSS software. The instrument of the study was a questionnaire which its validity was confirmed by a panel of experts and its reliability was established by calculating Chronbach's Alpha Coefficient (α>0.7). Results of the study showed that majority (67.1%) of the farmers applied the SCPs in moderate and low level. Results of means comparison showed that there is significant difference between application of SCPs by farmers in the terms of variables of membership or non membership in the rural organizations and receiving or not receiving loans for implementing SCPs. Also, results of correlation analysis showed that application of SCPs by farmers significantly correlated with the size of farming land, amount of annual income, level of farmers' education, number of participation in extension- education courses, amount of using communication channels and information sources, knowledge and attitude toward SCPs (P<0.01). Finally, results of the stepwise multiple regression analysis showed that three variables consisting attitude toward SCPs, number of participation in extension- education courses, and size of farming land account for 56.2 percent of dependent variable (SCPs) variances among farmers in the study area.", "Stratified sampling | Agriculture | Regression analysis | Statistical population | Population | Variables | Stepwise regression | Agricultural science | Mathematics | Socioeconomics | Psychology | Statistics | Geography | Demography | Economics | Sociology | Biology", "Agricultural Science and Fertilization", "Soil Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 2, 1, "https://openalex.org/W1966473298", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2258032685", null, "https://www.africaneditors.org/journal/GJAS/abstract/9AEA819D128", null, "Genetic variability and interrelationships of grain yield and its components of irrigated rice in Gezira", "article", "en", "2007-01-01", 2007, "Khalid A. Osman | Ahmed M. Mustafa | Abu Elhassan S. Ibrahim", "- | https://orcid.org/0000-0002-1533-1553 | -", null, "Agricultural Research Corporation | University of Gezira", "SD", "Gezira journal of agricultural science", null, "1728-9556", "5", "2", null, "800x600 Nineteen genotypes of irrigated rice were evaluated at the Gezira Research Station Farm, Wad Medani, Sudan, for two consecutive seasons (2004 and 2005) in a randomized complete block design with three replicates. This study was conducted to estimate the genotypic and phenotypic variability, broad sense heritability and traits correlation with grain yield. The highest genotypic coefficient of variation and genetic advance were recorded for plant height and number of panicles/m 2 , and the lowest for number of tillers/plant, days to 50% flowering, days to 50% maturity and panicle length, in both seasons. High heritability estimates (>80%) were recorded for plant height, days to 50% flowering, days to 50% maturity and 1000-grain weight. The highest estimate of heritability combined with the highest genetic advance as percentage of the mean was shown by plant height and 1000-grain weight, in both seasons. The high yielding genotypes were WITA5 (TOX 3255-82-1-3-2), IRI 3240-108-2-2-3(SAHEL.108)(FKR44) and TOX 3081-36-2-2-3-1. Their grain yields were 4.9, 4.9 and 4.6 t/ha, respectively. Grain yield/ha was significantly and negatively correlated with the percentage of unfilled grains/panicle, plant height and days to 50% flowering. How-ever, it was significantly and positively correlated with number of tillers/ plant, number of panicles/m 2 , number of filled grains/panicle and 1000-grain weight, in both seasons. Path coefficient analysis indicated that number of filled grains/panicle, 1000-grain weight and number of panicles / m 2 were the most directly related traits to grain yield/ha. Normal 0 false false false EN-US X-NONE AR-SA MicrosoftInternetExplorer4", "Panicle | Heritability | Randomized block design | Path coefficient | Biology | Agronomy | Genetic variability | Grain yield | Animal science | Coefficient of variation | Horticulture | Genotype | Path analysis (statistics) | Mathematics", "Rice Cultivation and Yield Improvement", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 2, 10, "https://openalex.org/W1435853582 | https://openalex.org/W1538911148 | https://openalex.org/W1969434493 | https://openalex.org/W2034079979 | https://openalex.org/W2046195108 | https://openalex.org/W2056150983 | https://openalex.org/W2076136700 | https://openalex.org/W2083204888 | https://openalex.org/W2084081266 | https://openalex.org/W2549442499", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W1534570772", "https://doi.org/10.62550/sg400405", "https://doi.org/10.62550/sg400405", null, "Comparative Performance of Two Different Planters Modified for No-Till Planting of Wheat on Ridge", "article", "en", "2012-12-01", 2012, "Songül Gürsoy", "https://orcid.org/0000-0002-6145-0684", "Songül Gürsoy", "Dicle University", "TR", "The Philippine Agricultural Scientist", null, "0031-7454", "95", "4", "400–405", "No-till planting of wheat (Triticum durum L.) on ridge after cotton (Gossypium hirsutum L.) harvest may offer potential benefits in terms of lower production costs, improved soil structure and efficient irrigation. Sowing of wheat on ridge is possible with the devolopment of a suitable planter. A study was conducted to compare the effect of two different planters modified to plant wheat without tillage on ridge after cotton harvest in terms of vertical seed distribution, seeding depth, seedling emergence rate, working speed, field capacity and fuel consumption of planters. The commercial planters used for modification in the study were Ozdoken no-till planter (MORP) and Hassia conventional till planter (MHRP). The experimental results showed that the MORP planter placed 60% of the seeds at the targeted depth of about 4 cm, whereas more than 50% of the seeds were on the soil surface or near the surface and remained uncovered with soil with use of the MHRP planter. Use of the MORP resulted in a more uniform vertical seed distribution, higher emergence rate and higher working speed, field capacity and lower fuel consumption compared with use of the MHRP. The results suggest that the MORP planter may be successfully used to plant wheat on ridge without tillage after cotton.", "Sowing | Tillage | Agronomy | Ridge | No-till farming | Irrigation | Environmental science | Seeding | Seedling | Fuel efficiency | Biomass (ecology) | Mathematics | Soil water | Biology | Engineering | Soil science | Soil fertility", "Soil Management and Crop Yield", "Soil Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 1, 7, "https://openalex.org/W595656155 | https://openalex.org/W1988681204 | https://openalex.org/W2003531006 | https://openalex.org/W2156780707 | https://openalex.org/W2279962699 | https://openalex.org/W2725974085 | https://openalex.org/W2781523591", false, "2025-07-26 00:00:00"], ["https://openalex.org/W2173841373", null, "https://www.ajol.info/index.php/ijhpr/article/download/124938/114458", null, "Effects of crude ethanol extract of Tapinanthus globiferus a. Rich on functional and structural integrity of the rats kidney", "article", "en", "2015-01-01", 2015, "MH Abdullahi | NM Danjuma | Muhammad Sani Aliyu | S Abubakar", "- | - | https://orcid.org/0000-0003-3750-9954 | -", null, null, null, "International Journal of Herbs and Pharmacological Research", "African Journals OnLine", "2315-537X", "4", "3", "33–39", "The present study was carried out to investigate the effects of crude ethanol extract of Tapinanthus globiferuson rat kidney. The toxic effects of the extract on rats kidney after 28 days of oral administration were evaluated on serum levels of urea, creatinine, sodium (Na + ), potassium (K + ), chloride (Cl - ) and bicarbonate (HCO 3 - ) while histopathology was evaluated on sections of the kidney. Results from the acute toxicity studies on the extract were found to be greater than 5,000 mg/kg body weight in rats after oral administration. The biochemical analysis of the extract showed significant (p<0.05) decrease in serum urea, creatinine and sodium levels, and significant (p<0.05) increase in serum potassium and chloride levels at doses of 175 and 350 mg/kg, while serum bicarbonate remained insignificant at tested doses. However, histological observations showed no significant structural changes in the kidney architecture at doses of 87.5 and 175 mg/kg extract compared to control, but at 350 mg/kg dose of extract showed areas of degeneration of Bowman’s capsule.The present work has revealed the non-toxicity of the ethanol extracts of Tapinanthus globiferus at low dose but suggests that its prolonged usage at higher dose should be monitored. Keywords: Tapinanthus globiferus , Creatinine, Electrolytes, nephrotoxic, Bowman’s capsule", "Creatinine | Nephrotoxicity | Urea | Chemistry | Kidney | Toxicity | Sodium | Histopathology | Ethanol | Capsule | Sodium bicarbonate | Potassium | Oral administration | Acute toxicity | Pharmacology | Endocrinology | Internal medicine | Medicine | Biochemistry | Biology | Pathology | Botany", "Ethnobotanical and Medicinal Plants Studies", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 1, 3, "https://openalex.org/W1551849342 | https://openalex.org/W2042464457 | https://openalex.org/W2159942149", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2346946554", null, "https://www.cabdirect.org/abstracts/20153299689.html", null, "Nutritive value of Sal seed (Shorea robusta).", "article", "en", "2015-01-01", 2015, "Md. Emran Hossain | Md. Hossain Kabir | Sabuj Manohar Sarma | H. P. Sikder", "https://orcid.org/0000-0002-1750-7284 | - | - | -", null, null, null, "Online Journal of Animal and Feed Research", null, "2228-7701", "5", "1", "28–32", "The study was undertaken to find out the chemical composition and nutritive value of Sal seed (Shorea robusta) available in Bangladesh. Shorea robusta seeds were collected from different remote places of study areas. Chemical analyses of the samples were carried out in triplicate for dry matter (DM), crude protein (CP), crude fiber (CF), nitrogen free extracts (NFE), ether extracts (EE) and total ash (TA) in the animal nutrition and poultry research and training centre (PRTC) laboratory, Chittagong Veterinary and Animal Sciences University, Chittagong, Bangladesh. Results indicated that, air dried corticated Shorea robusta seed contained 91.6% DM, 7.7% CP, 17.8% CF, 8.1% EE, 54.3% NFE and 3.7% TA. Similarly, air dried decorticated seed contained 88.7% DM, 8.8% CP, 7.3% CF, 10.0% EE, 58.6% NFE and 4.0% TA. Air dried seed shell contained 88.5% DM, 5.8% CP, 39.3% CF, 3.7% EE, 34.8% NFE and 4.9% TA. Metabolizable energy (ME) was 2614.2 Kcal/kg, 2933.0 Kcal/kg and 1582.9 Kcal/kg in corticated seed, decorticated seed and seed shell respectively. It could therefore be inferred that, the Shorea robusta seed seems nutritionally sound enough to be utilized as unconventional feed for ruminant especially during scarcity period.", "Shorea robusta | Biology | Veterinary medicine | Ruminant | Dry matter | Horticulture | Animal science | Botany | Crop | Agronomy | Medicine", "Ruminant Nutrition and Digestive Physiology", "Agronomy and Crop Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 1, 18, "https://openalex.org/W185964360 | https://openalex.org/W1502695808 | https://openalex.org/W1532080041 | https://openalex.org/W1573496604 | https://openalex.org/W1964469085 | https://openalex.org/W1979900732 | https://openalex.org/W2025961093 | https://openalex.org/W2115602666 | https://openalex.org/W2146557258 | https://openalex.org/W2161758580 | https://openalex.org/W2252281030 | https://openalex.org/W2274290288 | https://openalex.org/W2298531484 | https://openalex.org/W2312526675 | https://openalex.org/W2419535612 | https://openalex.org/W2494161309 | https://openalex.org/W2726277084 | https://openalex.org/W2971067524", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2767821402", null, "https://escholarship.org/uc/item/69m5249f.pdf", null, "Spatial Variability in Serial Response Learning and Performance by Pigeons ()", "article", "en", "2014-01-01", 2014, "Walter T. Herbranson | Patricia M. Xi | Yvan T. Trinh", "https://orcid.org/0000-0001-5858-0712 | https://orcid.org/0000-0003-4155-4440 | -", null, null, null, "International Journal of Comparative Psychology", "eScholarship Publishing, University of California", "0889-3667", "27", "2", null, "Pigeons can learn structured sequences of cued responses and perform them quickly, even when random variability is later introduced into the originally learned sequence, making some cue locations unpredictable. In order to determine if initial learning shows the same tolerance of spatial variability as steady-state performance, naive pigeons were trained on random distortions around a structured sequence without having seen the original sequence itself. Learning was possible, but accommodated less variability than did performance of the same sequence previously learned in an undistorted context. Analysis of results indicated that performance of a randomly distorted sequence is best when birds are initially trained with little or no variability, and randomness is later introduced in a gradual fashion.", "Sequence (biology) | Randomness | Sequence learning | Context (archaeology) | Cued speech | Random sequence | Psychology | Communication | Artificial intelligence | Cognitive psychology | Computer science | Biology | Statistics | Mathematics", "Animal Behavior and Reproduction", "Ecology, Evolution, Behavior and Systematics", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", "cc-by", null, null, 1, 22, "https://openalex.org/W1979455727 | https://openalex.org/W1984214648 | https://openalex.org/W1985454926 | https://openalex.org/W2009360125 | https://openalex.org/W2014992212 | https://openalex.org/W2021625970 | https://openalex.org/W2025539352 | https://openalex.org/W2029636294 | https://openalex.org/W2037578987 | https://openalex.org/W2041865272 | https://openalex.org/W2042567923 | https://openalex.org/W2047431989 | https://openalex.org/W2052779118 | https://openalex.org/W2056915253 | https://openalex.org/W2066752591 | https://openalex.org/W2067242602 | https://openalex.org/W2081965739 | https://openalex.org/W2114453142 | https://openalex.org/W2145070660 | https://openalex.org/W2159746264 | https://openalex.org/W2168371949 | https://openalex.org/W2280799025", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W933846657", null, "http://yadda.icm.edu.pl/yadda/element/bwmeta1.element.agro-article-150c7f56-7ffc-4bba-8fe1-e6ea3e07bd76", null, "Popularisation of soil science: its necessity and possibilities", "article", "en", "2001-01-01", 2001, "S. Brożek", "-", "S. Brożek", "University of Agriculture in Krakow", "PL", "Acta Agrophysica", null, "1234-4125", "50", null, null, null, "Engineering ethics | Business | Environmental science | Engineering", "Soil and Environmental Studies", "Soil Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 1, 2, "https://openalex.org/W2067973927 | https://openalex.org/W2182266234", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2969456763", "https://doi.org/10.5897/joda.9000016", "https://academicjournals.org/journal/JODA/article-stat/92F348858334", null, "Response of Tomato (Solanum lycopersicon L.) to Antitranspirants and Moisture Stress in Kano, Sudan Savanna of Nigeria", "article", "en", "2017-12-01", 2017, "Halima Isa | A.A. Manga | M. A. Hussaini", "https://orcid.org/0000-0003-0994-3673 | https://orcid.org/0000-0001-6233-5867 | https://orcid.org/0000-0002-9725-620X", null, null, null, "Journal of Dryland Agriculture", "Academic Journals", "2476-8650", "3", "1", "48–58", "The study was conducted to determine the effect of antitranspirants and moisture stress on productivity of tomato. The treatments consisted of two antitranspirants (Benzoic and Salicylic acids) at (0, 200, 400 and 600 ppm) concentration and three moisture stress stages (vegetative, flowering and fruit setting). These were arranged in a split-plot design and replicated three times. Antitranspirant and moisture stress constituted the main plots while concentrations were assigned to the sub-plots. Data were collected and analysed for plant height, leaf area index (LAI), plant fresh weight, fruits diameter, number of fruits and marketable fruit yield. Data generated were analysed using SAS. The results of the study revealed that although application of either of the antitranspirant significantly enhanced number of fruits, leaf area index, and marketable fruit yield per hectare, higher results were recorded at the fruit setting stage and similar results were observed from the plants treated with either Benzoic acid or Salicylic acid. However, fruiting growth stage was found to be the critical growth stage for moisture stress of tomato and applying 400 ppm of Salicylic acid recorded higher growth and yield characters of tomato.\r\n\r\n\t \r\n\r\n\tKey words: Antitranspirants; Growth stages (Vegetative, Flowering and fruiting).", "Hectare | Moisture stress | Horticulture | Salicylic acid | Solanum | Yield (engineering) | Moisture | Lycopersicon | Agronomy | Biology | Chemistry | Agriculture", "Leaf Properties and Growth Measurement", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", null, null, null, 1, 15, "https://openalex.org/W658733433 | https://openalex.org/W1511613305 | https://openalex.org/W1994213378 | https://openalex.org/W2004732551 | https://openalex.org/W2052489525 | https://openalex.org/W2054142450 | https://openalex.org/W2071746292 | https://openalex.org/W2091249513 | https://openalex.org/W2160427190 | https://openalex.org/W2188048530 | https://openalex.org/W2294053293 | https://openalex.org/W2577919687 | https://openalex.org/W2589597219 | https://openalex.org/W2590448245 | https://openalex.org/W2739585276", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2955395163", null, "https://journal.iugaza.edu.ps/index.php/JERT/article/download/5473/2681", null, "Development of a Device for Measuring Parameters of the Sea Wave", "article", "en", "2019-06-24", 2019, "Ahmhd Mohammed Alqataa | Eskender Bekirov | Ennan R. Murta", "- | https://orcid.org/0000-0002-0219-668X | -", null, null, null, "Journal of Engineering Research and Technology", "Islamic University of Gaza", "2312-2307", "6", "2", null, "In this work we study the developed measuring instrument of parameters of sea waves. The given theoretical studies of wave parameters determines wave speed, height, period and frequency in a digital form. The measured parameters from the microcontroller are transmitted through system GSM/GPRS - RS485/232 to the base station.", "GSM | General Packet Radio Service | Microcontroller | Acoustics | Electrical engineering | Base station | Work (physics) | Base (topology) | Electronic engineering | Computer science | Remote sensing | Engineering | Telecommunications | Geology | Physics | Mechanical engineering | Mathematics", "Advanced Scientific Research Methods", "Food Science", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", "cc-by", null, null, 1, 1, "https://openalex.org/W1663011894", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2966479197", null, "https://www.sci.nu.ac.th/sciencejournal/index.php/journal/article/download/ID358/pdf", null, "Phytochemicals and antioxidant activity in seed and pulp of wild grape (Ampelocissus martinii Planch.) extracts", "article", "en", "2019-06-24", 2019, "Ansaya Thonpho | Chuleerat Wongnarat | Wilaiwan Simcheur | Prasong Srihanam", "https://orcid.org/0000-0001-7389-7814 | - | - | https://orcid.org/0000-0003-4098-7148", null, "Mahasarakham University", "TH", "Warasan Witthayasat Mahawitthayalai Naresuan", null, "1686-5561", "16", "1", "1–11", "In this work, the phytochemical content and antioxidant activity of methanolic extract of the wild grape seed and pulp were examined at three different stages, namely, immature, mature and ripe. The results showed that the seed extracts produce higher phytochemical content and antioxidant activity than the pulp extracts. For both seed and pulp extracts, polyphenols decrease at the ripening period. The immature wild grape seed extract (GWGS) showed the highest amount of phytochemicals and potent antioxidant activity. The content of phytochemical results are found to have a significant correlation with the antioxidant activities ( p < 0.01). In conclusion, GWGS from the extract of wild grape seed is a source of phenolic compounds that might be potentially used as good supplement for health benefits.", "Phytochemical | Antioxidant | Pulp (tooth) | Polyphenol | Ripening | Grape seed extract | Grape seed | Food science | Traditional medicine | Biology | Botany | Chemistry | Horticulture | Biochemistry | Medicine", "Bee Products Chemical Analysis", "Insect Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 1, 29, "https://openalex.org/W406868852 | https://openalex.org/W1199194059 | https://openalex.org/W1422879560 | https://openalex.org/W1515187433 | https://openalex.org/W1965351947 | https://openalex.org/W1984196078 | https://openalex.org/W1991189992 | https://openalex.org/W1994250107 | https://openalex.org/W1998936301 | https://openalex.org/W2000962924 | https://openalex.org/W2007753331 | https://openalex.org/W2007898075 | https://openalex.org/W2012991711 | https://openalex.org/W2021522143 | https://openalex.org/W2021628824 | https://openalex.org/W2023219581 | https://openalex.org/W2048470053 | https://openalex.org/W2059047751 | https://openalex.org/W2074512118 | https://openalex.org/W2074872665 | https://openalex.org/W2078424158 | https://openalex.org/W2095133259 | https://openalex.org/W2096308808 | https://openalex.org/W2122910156 | https://openalex.org/W2126849502 | https://openalex.org/W2165060441 | https://openalex.org/W2190865314 | https://openalex.org/W2315201315 | https://openalex.org/W2319853825", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2404723057", null, "http://ceur-ws.org/Vol-1498/HAICTA_2015_paper72.pdf", null, "Multi-species Cover Crop Biomass Evaluation Using a Hand-held Normalized Difference Vegetation Index (NDVI) Sensor and Photosynthetically Active Radiation (PAR) Sensor.", "article", "en", "2015-01-01", 2015, "Christos Vasilikiotis | Athanasios Gertsis | Konstantinos Zoukidis | Ali Nasrallah", "https://orcid.org/0000-0001-7537-9228 | - | - | https://orcid.org/0000-0002-4990-3652", null, null, null, "HAICTA", null, null, null, null, "644–650", "Cover crops are essential in agricultural management and especially in organic farming for protecting the soil from erosion, competing with weeds, preventing evaporative losses and improving soil quality and fertility. The choice of cover crop species is crucial in achieving the highest level of weed suppression and soil fertility enhancement. Cover crop systems with rye or mixtures of legumes and grasses were set up in a randomized complete block design in Northern Greece. A hand held sensor was used to measure Normalized Difference Vegetation Index (NDVI) of the cover crop plots with parallel measurements of light interception with a PAR sensor, and destructive biomass determination. Weed biomass was also determined for each cover crop mixture. Multi-species cover crops produced higher total biomass than single-species cover crop systems. All cover crop systems evaluated were able to suppress weeds. Remote sensing results showed that NDVI could be used to estimate the total biomass of single cover crops but not cover crop mixtures.", "Cover crop | Environmental science | Normalized Difference Vegetation Index | Agronomy | Biomass (ecology) | Weed | Photosynthetically active radiation | Crop | Interception | Row crop | Vegetation (pathology) | Agriculture | Leaf area index | Remote sensing | Agroforestry | Geography | Biology | Ecology", "Soil Carbon and Nitrogen Dynamics", "Soil Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 1, 5, "https://openalex.org/W2040704437 | https://openalex.org/W2057041872 | https://openalex.org/W2070559755 | https://openalex.org/W2166693883 | https://openalex.org/W2505942554", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W869737786", null, "https://www.koreascience.or.kr:443/article/JAKO200835054213921.pdf", null, "A Legal Improvement to Reduce a Disposal of Livestock Sludge at Sea", "article", "en", "2008-01-01", 2008, "Chang Soo Chung | Young Il Kim", "- | https://orcid.org/0000-0003-3888-9530", null, null, null, "Journal of the Korean Society for Marine Environment & Energy", null, "2288-0089", "11", "3", "132–137", "The average concentrations of COD and copper in the livestock sludge are 930,726±380.801 mg/kg and 679±341 mg/kg, respectively. Due to the high concentrations, dumping to the sea of the sludge could pose potential adverse effects to the marine environment. On the contrary, it could have economic advantages on land as the energy of biogas generated by decomposition of organisms and the compost in case of the sludge of good quality with the abundant nitrogen and phosphorus. Nevertheless, the amount of livestock sludge dumped to the sea in Korea increased sharply from 51,000 m in 1997 to 2,745,000 m in 2005. And also it had the high pro- portion of 27% in total amount of waste dumped into the sea (7,451,000 m ) in 2007. It might cost between 20,000 won and 33,000 won to dump to the sea of the sludge. In comparison, it might cost 20,000 won to com- post the sludge. And its purification treatment even might cost just 10,000 won. It means that the disposal of the sludge at sea is the most expensive method to deal with the sludge, but ranchers, who engage in the livestock industry, still prefer the disposal at sea to the other methods on land such as the compost and purification treatment. In this article, therefore, we would analyze various factors in the ranchers' preference for the disposal of the sludge at sea, and then we could suggest some legal improvements to prevent and reduce pollution of the sea.", "Environmental science | Compost | Livestock | Waste management | Biogas | Sewage sludge | Environmental engineering | Sewage treatment | Engineering | Ecology | Biology", "Agriculture, Soil, Plant Science", "Ecology, Evolution, Behavior and Systematics", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 1, 2, "https://openalex.org/W2017344693 | https://openalex.org/W2081324474", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W3135311862", null, "https://ovcre.uplb.edu.ph/journals-uplb/index.php/JHE/article/download/403/375", null, "Promotion of Organic Agriculture through Community-based Organizations in Quezon Province, Philippines", "article", "en", "2016-01-01", 2016, "Rowena De Guzman | Gloria Luz M. Nelson | Girlie Nora A. Abrigo | Rowena Baconguis", "- | - | https://orcid.org/0000-0002-1429-640X | https://orcid.org/0000-0002-3300-1208", null, null, null, "Journal of Human Ecology", "Kamla Raj Enterprises", "0970-9274", "5", "1", null, "The National Organic Agriculture Program aims to promote organic agriculture (OA) to enhance soil fertility in the Philippines. The success in the promotion of OA is partly dependent on the farmers’ organizations (FOs) practicing OA. Using semi-structured interviews, this study describes how five community- based FOs in Quezon Province facilitate the promotion of OA. The system- structural perspective and contingency theory, structural and contextualfactors were used in analysing the interview data collected. Results showed that since the five FOs are community-based, they are able to address the problems in their respective communities. The successful facilitation of OA can be credited to the formal and centralized set up of the organization, which helped sustain farmer engagement. Moreover, the size of the organizations and the existence of institutional linkages greatly influence the conduct of promotion of s | Pedagogy | Political science | Medicine | Psychotherapist | Engineering", "Agriculture and Farm Safety", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 1, 2, "https://openalex.org/W2349343820 | https://openalex.org/W2913552620", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2375190893", null, "http://en.cnki.com.cn/Article_en/CJFDTOTAL-ZNYK201123007.htm", null, "The Complete Genome Sequence of the Gram-Positive Bacterium Bacillus subtils Bs-916", "article", "en", "2011-01-01", 2011, "Xiaoyu Wang | Luo Chu-ping | Zhiyi Chen | Yongfeng Liu | Youzhou Liu | Nie Ya-feng | YU Jun-jie | Xiaole Yin", "https://orcid.org/0000-0001-6548-3793 | - | https://orcid.org/0000-0002-5498-5349 | https://orcid.org/0000-0003-3583-8092 | https://orcid.org/0000-0003-1925-8573 | - | - | -", null, "Jiangsu Academy of Agricultural Sciences", "CN", "Zhongguo nongye Kexue", null, "0578-1752", null, null, null, "Objective)The objective of this study is to sequence the whole genome of Bacillus subtils Bs-916 and provide more information about molecular biology for future mining and utilizing the potential of this strain. (Method) Application of comparative genomics softwares, the whole genome sequence analysis was carried out with Bs168 strains. (Result) Bs-916 strains genome is 3 925 958 base pairs comprises 4 056 protein-coding genes. The average GC ratio is 46.4%, the highest compared with other whole-genome sequencing of Bacillus spp.. It contains 152 tandem repeat region, 103 transposons, 37 IS (Insert sequence), 46 tRNA, 39 rRNA. Through comparative genomics analysis, Bs-916 harbors eight giant gene clusters directing synthesis of bioactive peptides and polyketides by modularly organized mega-enzymes named non-ribosomal peptide synthetases, NRPS and polyketide synthases, PKS. Macrolactin, difficidin, and bacillomycin L are absent in Bs168 strains. Bs-916 also contains phytase gene, comAPQX and sfp related with biocontrol mechanism.(Conclusion)Bs-916 strain genome contains many gene cluster encoding a variety of antimicrobial substances, it can be considered a paradigm for an own group of plant-associated gram-positive bacteria with a huge potential for biocontrol and plant growth promotion. The complete genome sequence along with its amenability to genetic manipulation, should facilitate exploitation of the hitherto unappreciated potential of strain Bs-916 to produce secondary metabolites for developing agrobiological engineering preparations.", "Biology | Genome | Whole genome sequencing | Gene | Genetics | Comparative genomics | Ribosomal RNA | Genomics", "Phytase and its Applications", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 1, 31, "https://openalex.org/W152707177 | https://openalex.org/W235563243 | https://openalex.org/W881402133 | https://openalex.org/W1658692324 | https://openalex.org/W1963481724 | https://openalex.org/W1978164115 | https://openalex.org/W1985723784 | https://openalex.org/W2000981059 | https://openalex.org/W2003144438 | https://openalex.org/W2005830939 | https://openalex.org/W2038299797 | https://openalex.org/W2042881722 | https://openalex.org/W2055829483 | https://openalex.org/W2072148144 | https://openalex.org/W2096234478 | https://openalex.org/W2100882223 | https://openalex.org/W2101881683 | https://openalex.org/W2105199251 | https://openalex.org/W2119046460 | https://openalex.org/W2123153443 | https://openalex.org/W2158714788 | https://openalex.org/W2158763887 | https://openalex.org/W2168999294 | https://openalex.org/W2169068902 | https://openalex.org/W2314117833 | https://openalex.org/W2359132509 | https://openalex.org/W2380924640 | https://openalex.org/W2389277100 | https://openalex.org/W2399267941 | https://openalex.org/W2432382086 | https://openalex.org/W2471648285", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2524592924", "https://doi.org/10.5897/jsppr.9000032", "https://africaneditors.org/journal/JSPPR/full-text-pdf/21944-130432", null, "Physical properties of honey products in Algeria", "article", "en", "2011-10-16", 2011, "Badis Bendeddouche | Kheira Dahmani", "- | https://orcid.org/0000-0002-8896-3703", null, null, null, "Journal of Parasitology and Vector Biology", "Academic Journals", "2141-6567", "2", "12", "237–244", "Honey is considered as the sweetened natural substance produced by mellifluous bees from the flowers nectar, plants parts or the insects excretions generally left on the same parts. Although Algeria possesses floral and climatic potentialities; it remains a small honey producer. Among analyzed samples,74% correspond to codex standards. This latter may increase if certain measures such as a national regulation including standards for Algerian honey, a referential beekeeping and hive products laboratory are implemented. A labeling system followed by a guide for a good practice of beekeeping and production should be implemented as well.\r\n\r\n\t \r\n\r\n\tKey words: Honey, physicochemical analysis, quality, Algeria.", "Beekeeping | Nectar | Honey Bees | Honey bee | Apiary | Geography | Toxicology | Biology | Agricultural science | Botany | Pollen", "Bee Products Chemical Analysis", "Insect Science", "Agricultural and Biological Sciences", "Life Sciences", null, true, "green", null, null, null, 1, 1, "https://openalex.org/W2808871148", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2606877145", "https://doi.org/10.31357/ijms.v2i2.2834", "http://dr.lib.sjp.ac.lk/bitstream/123456789/3355/1/Nutritional%20and%20Sensory%20Characteristics%20of%20Star%20Fruit%20and%20Sweet%20Orange%20Juices%20Blend%20Fruit%20Cordial.pdf", null, "Nutritional and Sensory Characteristics of Star Fruit and Sweet Orange Juices Blend Fruit Cordial", "article", "en", "2015-12-15", 2015, "J. Kesavanath | K. Premakumar | Y. Inthujaa", "- | - | -", null, "South Eastern University of Sri Lanka | Eastern University, Sri Lanka", "LK", "International Journal of Multidisciplinary Studies", null, "2362-079X", "2", "2", "42", "Star fruit is one of the tropical fruit that has received less attention from the food industry. A large number of ripened star fruits are wasted during the fruiting-season. Therefore, a study was conducted to develop mixed cordial from star fruit and sweet orange. Star fruit juice, in the amounts of 80, 70 and 60 ml were mixed with sweet orange juice for the formulation of 100 ml of cordial. The cordials were subjected to nutritional, microbial and sensory analysis after formulation and during storage. The nutritional analysis of the developed cordials revealed that, titrable acidity, ascorbic acid and total sugar increased with an increase in the level of sweet orange juice, with the 30% sweet orange juice level, having the values of 0.42%, 23.72 mg/100 ml, and 10.34% respectively and pH 3.46. Sensory analysis showed significant difference between treatments. The cordials were subjected to storage studies at 30°C and RH of 80% for 11 weeks. The storage studies revealed that, the declining trends in ascorbic acid, pH and total sugar and increasing trend in titrable acidity. After 11 weeks storage, the mixed cordial of 70% star fruit juice with 30% sweet orange juice contained 0.95% titrable acidity (as citric acid), 16.8 mg/100g ascorbic acid, 7.2% total sugar and 3.1 pH. No harmful total plate count was observed in cordials after formulation and during storage. No remarkable changes in sensory characters were observed during storage period. Based on the results of the assessment, the mixed cordial of 70% star fruit juice with 30% sweet orange juice was selected as best mixed cordial.  KEYWORDS: Cordial, star fruit juice, storage, sweet orange juice", "Ascorbic acid | Orange (colour) | Citric acid | Sugar | Chemistry | Orange juice | Food science | Fruit juice | Reducing sugar | Vitamin C | Horticulture | Biology", "Food and Agricultural Sciences", imum was analyzed by GC and GC/MS. This analysis revealed the presence of monoterpene hydrocarbons, oxygenated monoterpenes and sesquiterpenes. All tested extracts exhibited high biological activities. In addition, our results underline the potential of T. ramosissimum to avoid mutation, genotoxicity and also its antioxidant, Anti-inflammatory, antiulcerogenic and antiproliferative effect.", "Teucrium | Genotoxicity | Chemistry | Monoterpene | Botany | Essential oil | Antioxidant | Traditional medicine | Biology | Lamiaceae | Organic chemistry | Toxicity", "Phytochemistry and Biological Activities", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 0, 8, "https://openalex.org/W1982909140 | https://openalex.org/W2008656644 | https://openalex.org/W2018930346 | https://openalex.org/W2030665012 | https://openalex.org/W2032590936 | https://openalex.org/W2054915060 | https://openalex.org/W2078105066 | https://openalex.org/W2278552956", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2959934412", null, "http://dergipark.gov.tr/ekinjournal/issue/22784/243172", null, "“BATEM Göral”; New mandarin cultivar", "article", "en", "2015-01-01", 2015, "Şenay KURT | Ertuğrul TURGUTOĞLU | Gülay DEMİR", "https://orcid.org/0000-0002-2921-063X | https://orcid.org/0000-0002-8354-8578 | https://orcid.org/0000-0002-8260-4507", null, null, null, "DergiPark (Istanbul University)", "Istanbul University", null, "1", "1", "33–35", "Citrus is the most widely produced fruit group in the world. Approximately 3 million tons of citrus fruit are produced in Turkey. With total export of one million tons, our country is ranking as the 4th Citrus exporter in the world and ranking as the 2nd among the Mediterranean countries. Mandarin production is 874.832 tons in Turkey and 8,72% of total mandarin production was Clementine mandarin in 2012. From different citrus ecological regions top selection of qualified individuals at “Citrus Budwood Selection-Certification and Variety Development Project” 7 promising types were selected from the Clementine mandarin types and BATEM Göral has been registered as new mandarin cultivar in 2011. BATEM Göral have been compared with Clementine mandarin in distinctness, uniformity and stability tests (DUS). In study results showed that ‘BATEM Göral’ has larger fruit weight and diameter", "Clementine (nuclear reactor) | Mandarin Chinese | Cultivar | Horticulture | Ranking (information retrieval) | Biology | Geography | Computer science", "Plant Physiology and Cultivation Studies", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 0, 3, "https://openalex.org/W564387555 | https://openalex.org/W1604078461 | https://openalex.org/W2061534085", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W2563980859", null, "https://www.scitechnol.com/abstract/field-performance-of-tractor-attached-with-winch-on-tea-farms-innortheast-india-3087.html", null, "Field performance of tractor attached with winch on tea farms innorth-east India", "article", "en", "2014-01-01", 2014, "L. S. Yadav", "https://orcid.org/0009-0003-2652-0215", "L. S. Yadav", null, null, "Crop Research", "Gaurav Publications", "0970-4884", "2014", "3", "98–104", "A study was carried out to evaluate field performance of tractors attached with winch during 2011-13, on tea plantations, located in Lakhimpur and Sonitpur districts of Assam. It was found during study that average number of uprooted tea bushes by two years’ old tractors was on higher side (19.14%) than that of 9 to 10 years’ old tractors. While average hourly fuel consumption and average unit cost of uprooting tea bushes of 9 to 10 years’ old tractors were more (26.19 and 19.17%, respectively) as compared with two years’ old tractors. It revealed that higher size tractors (45 hp) were suitable for carrying out low load operations after eight years of their purchase and use for uprooting tea bushes. Abrupt engaging and disengaging power from power take off shaft to reel of winch adversely affected life of tractors. Fan belt of tractor and chain and sprocket of winch were found critical wearing spare parts to be kept in reserve with tractor. The major cause of bend in power take off shaft was abrupt transmission of power from this shaft to reel of winch. While breakage of wire rope was due to rusting and corrosion caused by lack of care and maintenance. The major cause of injuries and swellings of fingers of workers was use of ropes possessing rusted and broken wires. It was found essential to carry extra fuel, lubricants, tools, wooden blocks, rope, jack, spade, etc. and 3-4 hand gloves for safety of hands of workers, while proceeding to tea plantation for uprooting old tea bushes. Evening maintenance after completion of work and checks in next morning were found increasing utilization hours of tractors and winches during day time.", "Winch | Tractor | Sprocket | Engineering | Agricultural engineering | Automotive engineering | Structural engineering | Mechanical engineering", "Agriculture and Farm Safety", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 0, 3, "https://openalex.org/W122437452 | https://openalex.org/W811624531 | https://openalex.org/W2624945263", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W121988341", null, "https://library.iated.org/view/RIUSALONSO2011ACT", null, "ACTIVATED CARBON FROM AVOCADO STONE, TO ELIMINATE CADMIUM AND MERCURY FROM CONTAMINATED WATER", "article", "en", "2011-01-01", 2011, "C. Rius-Alonso | B. Duran-Martinez | D.A. Flores-Peña | V. Ruiz-Vasconcellos | L.M. Mena-Santos | Y. Quezada-Gonzalez", "- | - | - | - | - | -", null, null, null, "ICERI2011 Proceedings", "International Academy of Technology, Education and Development", null, null, null, "1552–1560", "Abstract A team of 4 undergraduate students were involved in the project with the aim of bringing a cheap solution to a real problem. The problem to solve was the purification of water contaminated with cadmium and mercury in a simple way. In our present work avocado stones (Persea americana) were used. Mexico produces more than 55% of the world avocado, with an average of 1,000,000 tons per year; this is a plentiful natural resource. So far there is no use for the avocado stones. The avocado stones were dried and treated in an oven at 375°C in order to produce activated carbon. The water effluents with several pollutants were filtered though the activated carbon from avocado stones, and the result was a very good decontamination of those pollutants. This is a very simple and useful way of cleaning polluted water streams with widely available products. A constant supervision was given during the entire project; it took one semester to accomplish. Several temperatures and times at the oven were performed, and also different concentrations of activated carbon were used in order to obtain the best conditions of operation. The aim of this project was to develop awareness between young students of the big problems the civilization is facing and a way in which they can contribute to solve them. Keywords: Water purification, activated carbon, avocado stone, water decontamination.", "Mercury (programming language) | Human decontamination | Activated carbon | Effluent | Contamination | Environmental science | Waste management | Pollutant | Pulp and paper industry | Environmental chemistry | Chemistry | Environmental engineering | Engineering | Computer science | Ecology | Biology", "Agriculture and Social Issues", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 0, 2, "https://openalex.org/W1987930869 | https://openalex.org/W2111427531", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W907312633", null, "https://www.agri.ruh.ac.lk/tare/pdf/V_7/AG.7.18.pdf" /1599", null, "Different levels and methods of NPS application impact on yield and yield components of Faba bean (Vicia faba L.) in Bale highlands, South eastern Ethiopia", "article", "en", "2020-11-20", 2020, "Reta Dargie | Tamiru Meleta | Kissi Wakweya", "- | - | -", null, "Ethiopian Institute of Agricultural Research", "ET", "Agricultural Advances", null, "2251-7820", "9", "11", "576–579", "A field experiment was conducted at two locations in Bale, South eastern Ethiopia (Selka and Agarfa) for two consecutive years (2018-2019) to study the responses of improved Faba bean to rates and methods of NPS application and assessing the economic feasibility. The treatments were six levels of NPS (25, 50, 75, 100, and 125 kg ha-1) and two methods of application (Broadcasting and Band application) laid in randomized complete block design (RCBD) with three replications. Faba bean variety ‘Alloshe’ was used as a test crop. The analysis showed that almost all parameters studied were not significantly (P<0.05) affected by the main effect of blended NPS fertilizer and methods of application at both locations over years. This could be due to relatively medium to high accumulation of studied nutrients in the soil and conducive environmental conditions in the specific area. Therefore, based on this findings future research should focus on prior soil test based fertilizers recommendations.", "Vicia faba | Randomized block design | Fertilizer | Yield (engineering) | Crop | Agronomy | Field experiment | Mathematics | Geography | Environmental science | Biology", "Genetic and Environmental Crop Studies", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 0, 2, "https://openalex.org/W1538715226 | https://openalex.org/W1554766891", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W3133935531", null, "https://www.saap.org.in/journals/index.php/herbsanddrugs/article/download/53/46", null, "An arbitrary survey for diversity of medicinal plants from regions of Hoshangabad, M.P. India", "article", "en", "2017-08-31", 2017, "Neelam Singh | Madhulika Singh Madhulika Singh", "https://orcid.org/0000-0002-3029-9053 | -", null, null, null, "International Journal of Indigenous Herbs and Drugs", null, "2456-7345", null, null, "9–12", "Objective: For the study of biodiversity of medicinal plants in Hoshangabad district, the classical method of floristic survey was used.\r\nMethods: Biodiversity makes opportunity when integrated with technology, thus imparting various meanings among various communities; so, a random floristic survey has been executed in the regions of Hoshangabad District in present work.\r\nResults: The existence of various life forms including plants, animals and microorganisms with their genetic variability & ecosystem residing in a region is regarded as the biodiversity. In terms of diversity of plants, out of the 12 mega biodiversity centers, India is the one with 47513 plant species. About 28% of plants that occur in India are endemic to the country. There are about 1,500 medicinal plants in India. An abundance of 27 plant species of medicinal values has been reported in present survey from Hoshangabad region which belongs to various plant families\r\nConclusion: The diversity of medicinal plant species in the region also needs attention for conservation and their use in ethical ways.", "Biodiversity | Floristics | Geography | Plant diversity | Agroforestry | Abundance (ecology) | Diversity (politics) | Medicinal plants | Plant species | Ecology | Biology | Species richness | Sociology", "Ethnobotanical and Medicinal Plants Studies", "Plant Science", "Agricultural and Biological Sciences", "Life Sciences", null, false, "closed", null, null, null, 0, 4, "https://openalex.org/W1980585474 | https://openalex.org/W1987027652 | https://openalex.org/W2105389955 | https://openalex.org/W2327726575", false, "2025-10-10 17:16:08.811792"], ["https://openalex.org/W3159541885", n const root = document.currentScript.previousElementSibling;
const {cols, rows, total} = JSON.parse(root.querySelector('script[type="application/json"]').textContent);
const URL_RE = /(https?:\/\/[^\s<>"']+)/g, LONG = 300;
let page = 0, size = 25;
const esc = s => s.replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const linkify = s => esc(s).replace(URL_RE, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
function cell(v) {
  if (v === null) return '<span class="na">null</span>';
  const nested = typeof v === 'object';
  const s = nested ? JSON.stringify(v) : String(v);
  const cls = nested ? ' class="nested"' : '';
  if (s.length <= LONG) return `<div${cls}>${linkify(s)}</div>`;
  return `<details${cls}><summary>${linkify(s.slice(0, LONG))}…</summary>${linkify(s)}</details>`;
}
function render() {
  const pages = Math.max(1, Math.ceil(rows.length / size));
  page = Math.min(page, pages - 1);
  const slice = rows.slice(page * size, page * size + size);
  root.querySelector('tbody').innerHTML = slice.map(r => '<tr>' + r.map(v => `<td>${cell(v)}</td>`).join('') + '</tr>').join('');
  const first = rows.length ? page * size + 1 : 0, last = page * size + slice.length;
  root.querySelector('.info').textContent =
    `rows ${first}–${last} of ${rows.length.toLocaleString()} loaded` + (total === null ? ' (total unknown)' : ` · ${total.toLocaleString()} in table`);
  root.querySelector('.pg').textContent = `page ${page + 1} / ${pages}`;
  root.querySelector('.prev').disabled = page === 0;
  root.querySelector('.next').disabled = page >= pages - 1;
  root.querySelector('.wrap').scrollTop = 0;
}
root.querySelector('thead tr').innerHTML = cols.map(([n, short, full]) =>
  `<th title="${esc(n + ': ' + full)}">${esc(n)}<div class="t">${esc(short)}</div></th>`).join('');
root.querySelector('.prev').onclick = () => { page--; render(); };
root.querySelector('.next').onclick = () => { page++; render(); };
root.querySelector('.size').onchange = e => { size = +e.target.value; page = 0; render(); };
render();
</script>
