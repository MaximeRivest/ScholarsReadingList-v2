 the relationships between aging anxiety, social support, self-esteem, life satisfaction, and successful aging were all statistically significant. In other words, the lower the aging anxiety, the higher the social support, the higher the self-esteem, the higher the satisfaction of life, and the higher the level of successful aging. Second, social support, self-esteem and satisfaction with life were found to have a full mediating effect in the relationship between aging anxiety and the successful aging of middle-aged individuals.\r\nImprovements/Applications: In order to increase the successful aging of middle-aged people, various policies should be implemented in order to focus on increasing social support, self-esteem, and life satisfaction, rather than on the reduction of aging anxiety."], ["https://openalex.org/W3191169120", "On the Relationship between Iranian EFL Teachers’ Burnout, Self-Efficacy and Job Satisfaction", 2021, "article", 3, "Teacher Professional Development and Motivation", "Teachers occupy crucial role in the process of educating an individual and a nation. In foreign language setting, there are some social psychological variables that can highly influence on the teachers' performance and efficiency; three of these important variables in language pedagogy are burnout, self-efficacy and job satisfaction. This study, which utilized quantitative methodology, aimed at measuring the relationship between the teacher burnout, self-efficacy and job satisfaction of Iranian English teachers. The data were gathered through the application of the three questionnaires: Maslach Burnout Inventory-Educators Survey, developed by Maslach and Jackson (1986), (Bandura, 1997) Instrument Teacher Self-efficacy Scale for measuring teachers‟ self-efficacy and Minnesota Satisfaction Questionnaire (job satisfaction). Statistical analysis showed low level of burnout in Iranian EFL teachers, after doing correlation analysis; negative relationship was presented between burnout and self-efficacy. Also, the role of self-efficacy and its subscales as a burnout predictor for teachers was about 38%. In the next step, Iranian EFL teacher job satisfaction was analyzed, Statistical analysis showed low level of job satisfaction in Iranian EFL teachers, too, after doing correlation analysis; negative relationship was presented between job satisfaction and burnout, also it was revealed that job satisfaction and its components 21% could predict teachers’ burnout."], ["https://openalex.org/W3195254850", "The Influence of Transformational Leadership, Organizational Culture, and Rewards through an Commitment to Integrated Goal to the Performance of Private Higher Education Lecturers in the Central Java Region", 2021, "article", 1, "School Leadership and Teacher Performance", "Introduction: Lecturer performance is an important factor in an effort to ensure the quality management of higher education institutions, because the lecturers’ performance is a measure of the abilities and skills of personnel in carrying out their duties and responsibilities.\r\nObjective: The purpose of this study was to analyze the influence of transformational leadership, organizational culture, and rewards toward commitment to integrated goal and commitment to lecturer performance.\r\nMethods: This research applied a quantitative research with a research step (design) of a structural equation model through a Second Order Confirmatory Factor Analysis model approach. The research object was the lecturers of a private university in the coordination scope of LL Higher Education of Region VI Central Java who has a minimum functional position of Expert Assistant. This research was conducted from November to December 2020. The research samples were 365 lecturers chosen using the Krejcie and Morgan formulas and purposive sampling technique. Research variables consisted of transformational leadership, organizational culture, rewards, commitment to integrated goals and lecturer's research performance with 20 indicators.\r\nResults and Conclusions: Transformational Leadership had an effect on Commitment to Integrated Goal (2.89 > 1.96) and Commitment to Integrated Goal had an effect on Lecturer Research Performance (t value 5.99 > 1.96). Organizational Culture has an effect on Commitment to Integrated Goal (t value 3.68 > 1.96) and Commitment to Integrated Goal has an effect on Lecturer Research Performance (t value 5.99 > 1.96). Rewards had no effect on Commitment to Integrated Goal (t value 0.83 1.96)."], ["https://openalex.org/W3133822662", "MARKET ENTRY STRATEGIES AND PERFORMANCE OF MULTINATIONAL CORPORATIONS IN KENYA", 2020, "article", 0, "International Business and FDI", "The purpose of the study was to examine the relationship between market entry strategies andorganisational performance of multinational corporations in Kenya. The specific objective is toestablish the relationship between market entry strategies and organisational performance ofmultinational companies in Kenya. The study employed descriptive cross-sectional researchdesign. The study established that market entry strategies explained 43.1% of the variance inorganizational performance of multinational companies measured using financial performanceparameters and 52.5% of the variance in organizational performance measured using nonfinancialparameters. The hypothesis that there is a significant relationship between market entrystrategies and organisational performance was therefore supported. The study recommends thatmultinational corporations should carry out research on the market entry strategies beforeventuring into international market. This will ensure that they use the appropriate market entrystrategy to enhance their performance. The study also recommended that the management evaluatethe factors influencing the choice of market entry modes in order to choose the best alternative.The results makes a contribution to theory development, policy and marketing practice in relationto the effect of market entry strategy and organisation performance The limitation of the study isthat it used top management as the respondents, may be if other cadre of employees were studiedthey could have contributed to more exhaustive results for generalization, this however did notcompromise on study results. Therefore, the study suggests that there is room for further researchincorporating a large population approach, using longitudinal designs and using group discussionto get more information from the respondents."], ["https://openalex.org/W3124603370", "The Study on Feasibility of the Beamforming based Acoustic Camera to Detect Air Infiltration of an Apartment Building", 2020, "article", 0, "Acoustic Wave Phenomena Research", null], ["https://openalex.org/W3138337565", "Comparing the Efficacy of Esmolol and Lignocaine for Attenuating the Pressor Response during Laryngoscopy and Endotracheal Intubation", 2021, "article", 1, "Cardiac, Anesthesia and Surgical Outcomes", "Introduction: The Pressor response characterized by tachycardia and hypertension following laryngoscopy and intubation is well-recognized, which can be hazardous in patients with cardiovascular disease as it may precipitate arrhythmias, myocardial ischemia and cerebrovascular accidents. Various techniques are currently employed to attenuate this response but so far, none have been proven to be superior .This study was conducted to compare the efficacy of Esmolol and Lignocaine in attenuating the Pressor Response to laryngoscopy and intubation.\r\nMaterial and Methods: A cross sectional analytical study was conducted on 52 patients aged between 20-50 years belonging to ASA I and II scheduled for surgery under general anaesthesia after obtaining clearance from hospital ethical committee and informed consent from patients. Group (E) received 2mg.kg-1 of esmolol IV 2 minutes before intubation and Group (L) received 2 mg kg-1 of lignocaine 2 minutes before intubation. Haemodynamic parameters such as Heart rate, Systolic BP, Diastolic BP and MAP was compared between the two groups at induction and 1, 3, 5 minutes post induction.\r\nResults: The demographic data was comparable between both the groups. There was a significant increase in mean HR in lignocaine group during laryngoscopy and intubation, which did not come back to baseline level even after 5 min (p value of 0). In the esmolol group, there was a significant attenuation of HR during intubation and 1, 3, 5 minutes following intubation. MAP was better controlled in esmolol group compared to lignocaine.\r\nConclusion: Esmolol was proven to be more effective in controlling the pressor response during laryngoscopy and intubation when compared to lignocaine."], ["https://openalex.org/W3134931142", "The use of home language: Quality way for students advancement in education", 2021, "article", 0, "Second Language Learning and Teaching", "This paper examined the advancement of quality education in line with Home Language (HL). The study confirmed that using Home language as a medium of instruction is one of the mechanisms of quality education. The investigation was conducted with five hundred (500) pupils from the basic schools in Atebubu Municipality. A purposive sampling approached was used to elicit significant information for the investigation. The results showed that Home Language bridge the gap between the home culture and the school culture. It therefore, boost the pupil's confidence in participating in the teaching and learning process. The investigation has also drawn attention to how students feel uncomfortable when a foreign language is used in the lesson delivery. One other formidable point the study established was that advanced and developed countries have used only the mother tongue (OMT) medium of instruction in their education. It was realized among other things that any quality education beholds the use of Home Language as a medium of instruction."], ["https://openalex.org/W3133158610", "Image Restoration Using a Novel Model Combining the Perona-Malik Equation and the Heat Equation", 2021, "article", 2, "Numerical methods in inverse problems", "This article is devoted to the mathematical study of a new proposed model based on a Perona-Malik equation combined with a heat equation. This study shows how system of partial differential equations can be used to restore a digital image. By using compactness method and the monotonicity arguments, with suitable assumptions on the nonlinearities, we prove the existence of the weak solution for the proposed model which its consistency is given in our work."], ["https://openalex.org/W3140805898", "Case Studies on Characterization of Brake Pad Surfaces Using Scanning Electron Microscope", 2021, "article", 2, "Brake Systems and Friction Analysis", "Scanning electron microscope (SEM) is the most important tool used for characterizing brake pad surfaces. Case studies on characterizing five different friction composite formulations are presented in this paper. Different features of SEM are related to explain the increase or decrease of friction and wear values. Different wear mechanisms operating at different temperatures are discussed. Special features in SEM results are highlighted for better understanding. Surface morphology, loose particles, friction films, primary and secondary plateaus are identified on worn surfaces.  The case studies presented in this paper are expected to impart knowledge and skills to practicing R & D Engineers to characterize brake pad surfaces."], ["https://openalex.org/W3126899430", "The Effect of Job Satisfaction on Organizational Commitments and Organizational Citizenship Behavior", 2021, "article", 11, "Employee Performance and Management", "Human resources have an important role due to organizational effectiveness and success rate with highly dependent on the quality and performance of human resources. In this study aims to analyse the effect of job satisfaction on organizational commitment and organizational citizenship behaviour. This research was conducted in a mobile shop with 40 respondents. Here, the data was collected by distributing questionnaires to respondents using a list of statements related to the variables used. The collected data were analysed using Warp PLS software. The results showed that job satisfaction has a positive and significant effect on organizational commitment and organizational citizenship behaviour with value of highest coefficient path around 0.307 from testing result. This study also indicated that job satisfaction did not have a significant effect on organizational citizenship behaviour. The research implication informs that increasing organizational citizenship behaviour can be done by creating job satisfaction for employees through appropriate rewards and providing guarantees for employees to get justice in the workplace. Finally, the job satisfaction effect has been studied also applied as a mechanism to assess workplace over Gianyar, Bali, Indonesia in near future."], ["https://openalex.org/W3119786757", "The protective effects of quercetin and sucrose on cold preservation injury in vitro and in vivo", 2020, "article", 3, "Biochemical effects in animals", null], ["https://openalex.org/W3113804051", "Melody Similarity and Tempo Diversity as Evolutionary Factors for Music Variations by Genetic Algorithms.", 2020, "article", 0, "Music and Audio Processing", null], ["https://openalex.org/W3114557985", "Fabrication of Perforated Strings for Transparent Silicon Shingled Photovoltaic Modules", 2020, "article", 0, "Advanced Materials and Mechanics", null], ["https://openalex.org/W3116364338", "A 58-Year-Old Male with Nasopharyngeal Papillary Adenocarcinoma: A Case Report", 2020, "article", 1, "Salivary Gland Tumors Diagnosis and Treatment", null], ["https://openalex.org/W3115542895", "Analysis of the External Environment of a Vertical Dried Herbs Business and the Role of E-Commerce Tools.", 2020, "article", 1, "Innovation Diffusion and Forecasting", null], ["https://openalex.org/W3117063105", "Study of English Learning Motivation of College Students", 2020, "article", 3, "EFL/ESL Teaching and Learning", "Motivation is a crucial element to second or foreign language learning. Research shows a positive correlation between motivation and achievement. Hence knowledge of the factors that facilitate motivation to learn and achieve is critical for a teacher to be truly effective or for a student to achieve. This study mainly focuses on the college students’ motivations of the English learning. First of all, the paper introduces the importance of motivation in the second language learning. Then, this thesis introduces the theoretical basis of the motivation, its definition, three kinds of motivation theories, motivation factors. Then a study is conducted to analyze the motivations that influence English learning of the college students. Then this thesis summarizes some implications of the study."], ["https://openalex.org/W3120247902", "Study of DNA Separation in Aqueous-Salt Two-Phase System", 2020, "article", 0, "Chemical and Physical Properties in Aqueous Solutions", "Plasmid DNA (pDNA) based gene therapy belongs to the category of non-viral systems. Generally, their production is considered more scalable, the process is easier to control, monitor and quality control testing is considered easier than that for viral vectors. Since downstream processing techniques for the recovery of nanobioparticles face to problems other than those encountered during the recovery of biomolecules such as peptides and proteins, thus downstream process routes that are currently in use for bioparticles have to be re-designed for such nanoparticles. Aqueous two phase system (ATPS) is one of the processes that are used for this purpose. Partitioning of plasmid DNA in ATPS has been shown to provide a powerful method for separation and purification mixture of nanobioparticles. In this paper, Polymer-salt system have been studying and the partition behavior of pDNA in aqueous two phase systems of polyethylene glycol 300 – potassium phosphate at different temperatures and lysate concentrations were investigated. The volume ratio and recovery of pDNA in top, bottom and interface were measured. The results showed that lysate concentration from 10 to 50 mg/ml as well as temperature from 5 to 45 C have a significant effect on pDNA recovery."], ["https://openalex.org/W3113613431", ": books: : arrow_right: : slight_smile: An Approach for Text-to-Emoji Translation.", 2020, "article", 0, "Digital Communication and Language", null], ["https://openalex.org/W3114642423", "The Impact Of Smart Classrooms On The Academic Success Of Sri Lankan Government School Students", 2020, "article", 3, "Educational Environments and Student Outcomes", null], ["https://openalex.org/W2996995224", "Early Childhood Care and Education in Water-Scarcity Villages in Tanzania: The Case of Ng’hong’onha Village, Dodoma", 2020, "article", 1, "Poverty, Education, and Child Welfare", "This article presents findings from a study that adopted a concept of the best interests of the child to investigate stakeholders’ experiences in different water-scarcity contexts in relation to the care and education of children by using the case of one village in Dodoma region. Three objectives guided the study: (a) establishing the extent of water scarcity and its causes in relation to early childhood service delivery; (b) documenting the effects of water scarcity on Early Childhood Care and Education (ECCE); and (c) examining efforts made by village members to curb water scarcity. The study gathered data from a sample of 37 informants obtained purposively through the deployment of a case study design and a qualitative research approach. Focus group discussions (FGDs), interviews and documentary reviews were used as data collection methods. The results showed that the failure to rectify water scarcity created contexts that paralyzed almost every life affair of the inhabitants in general, and the quality of ECCE in particular. There were multiple negative effects associated with water scarcity on the provision of ECCE, including: less joyful learning, disruptions of study time, eye diseases, skin diseases and diarrhoea. Overall, the experiences of stakeholders indicated that the provision of care and education in water-scarcity contexts hardly realized best interests of the child in most significant ways. By implication, water signified one of the most important resources worth considering in the planning and implementation of ECCE programmes."], ["https://openalex.org/W3110640857", "Weaning age/time based model influencing performance in goats and sheep meat production", 2020, "article", 3, "Effects of Environmental Stressors on Livestock", "Weaning is an essential animal husbandry intervention which has been associated with nutritional stress that interferes with both animal’s behavioral and physiological responses consequently influencing post weaning growth performance in goats and sheep production. The timing of weaning and/or weaning age of kids/lambs becomes critical in determination of flock performance with the intention of maximizing meat productivity and improving profitability. There are two possibilities that exist in deciding on weaning age of kids/lambs, thus early and late weaning, however, the decision on when to wean is dependent mainly on the production environment and purpose, as well as the dam welfare.   Age at weaning differ greatly in sheep and goats, therefrom 14 days to natural weaning, and exceeding four months of age. In sheep production effective early weaning has been practiced untimely at 14 days; in goats’ kids have been weaned early successfully at 28 days. Early weaning is considered traditionally weaning ahead of the 90 days of age; 60 days is most widely used; age thereafter qualifies for late weaning. The age at weaning greatly influences post weaning animal performance, however if not timed properly it would impact negatively also on weaner survival rates. Weaning itself is a very stressful procedure and subjecting kids/lambs to further stress which directly impinge on the kid/lamb’s immunity consequently increasing their susceptibility to diseases and reduced weight gain. There is need for age of weaning to balance the potential positive impacts on the ewes/does to rebreed, with potential negative impacts on the kid/lamb growth performance and survivability. Early weaning has become an effective husbandry practice especially in advanced goat and sheep production systems, which focuses on shortened female breeding reproductive cycle, while enhancing meat productivity through increased frequency of kidding/lambing. It is important to consider weaning age in relation to nutritional strategies which provide adequate time for diet transition which is intended not to compromise feed utilization and feed conversion efficiency in kids/lambs consequently reducing growth performance. The effectiveness of weaning age and anticipated live weight gains post-weaning is dependent on nutritional management especially concentrate supplementation which may promote performance and productivity in pastured based systems. Late weaning is probably convenient for less prolific goat and sheep breeds and genotypes not selected for their growth potential. It should be acknowledged that there is interaction between weaning age with other factors such as nutrition, sex and weight of animal. Some of the goat and sheep producers worldwide have shifted to use of weight based weaning model, similar age but with different weights, heavier lambs have superior development efficiency during lactation. The present review gives an insight on the consequences of early and late weaning on animal’s post weaning performance in small ruminants."], ["https://openalex.org/W3110064838", "INNOVATIVE TRIZ-BASED APPROACH TO PREVENT CLDE SYMPTOMS IN SILICONE-HYDROGEL EYE CONTACT LENSES", 2020, "article", 0, "Ocular Surface and Contact Lens", "Since the invention of a very first eye contact lens in 1887, as an alternative to conventional glasses, drastic changes has been implied into the material, structure, shape and other parameters of eye contact lenses. Nowadays eye contact lenses are used by over 150 million people worldwide for corrective, cosmetic and therapeutic purposes. The most popular modern eye contact lenses are made from silicon and hydrogel. Silicon makes up the channels inside the lens through which oxygen, water and nutrients are going to the cornea, while hydrogel as a highly hydrophilic gel adsorbs water and maintains soft structure of the lens which is necessary for normal functioning of the eye. Although both components are necessary in the eye contact lens, they cause negative effects such as increased evaporation due to porous structure and water adsorption from tear film, that is critical for maintaining moisture on the eye surface. Combination of these effects ultimately lead to the occurrence of contact lens-related dry eye syndrome (CLDE), that is experienced by about 50% of contact lens wearers. Our goal is to apply TRIZ-based approaches to develop an innovative structure of eye contact lenses that will prevent the occurrence of CLDE. After thorough study of the mechanisms triggering CLDE the technical contradiction and physical contradiction of the core problem were identified. Cause-effect chain Analysis (CECA) and function diagram played the key role in transitioning from the problem to the possible solutions. Various ideas of improvement were suggested through the specifics of application of different TRIZ tools in accordance with ARIZ85C. Conclusively, TRIZ can be a potential breakthrough if incorporated as a solving method for medical, biological, biochemical and other related areas."], ["https://openalex.org/W3112058695", "Vocal Hygiene Program for Information Technology Enabled Service Professionals", 2020, "article", 0, "Voice and Speech Disorders", "Vocal hygiene program is a behavioral approach to treat voice disorders. It focuses on various vocal and non-vocal habits which, by following appropriately would reduce the symptoms of the voice disorder and also prevent developing a voice disorder. Information Technology Enabled Service (ITES) professionals are inclined to use their voice extensively to earn their living. Hence, this study focuses on developing a vocal hygiene program exclusively for voice users belonging to Information Technology Enabled Services. The results were compared using Voice Handicap Index, Vocal Fatigue Index before and after the implementation of vocal hygiene program on 31 professional voice users belonging to ITES which showed the improvements achieved were statistically significant. Hence, Vocal hygiene program for ITES professionals is a necessity and shall yield reliable realistic improvements."], ["https://openalex.org/W3111701246", "Fabrication of Dye Sensitized Solar Cell Based on Natural Photosensitizers", 2020, "article", 8, "TiO2 Photocatalysis and Solar Cells", null], ["https://openalex.org/W2963222162", "Numerical Solutions of Nonlinear Wave-Like Equations by Reduced Differential Transform Method", 2020, "article", 0, "Fractional Differential Equations Solutions", "This paper is presented to give numerical solutions of nonlinear wave-like equations with variable coefficients by using Reduced Differential Transform Method (RDTM). RDTM can be applied most of the physical, engineering, biological and etc. models as an alternative to obtain reliable and fastest converge, efficient approximations. Hence, our obtained results showed that RDTM is a very simple method and has a quite accuracy."], ["https://openalex.org/W3042009482", "A SURVEY OF CURRENT SOURCE INVERTER TOPOLOGIES AND CONTROL SCHEMES FOR GRID CONNECTED PHOTOVOLTAIC SYSTEMS", 2020, "article", 1, "Photovoltaic System Optimization Techniques", null], ["https://openalex.org/W3034883358", "Prevalence of autoimmune thyroiditis in patients with Diabetes Mellitus Type 2 (DMT2) in Wasit Province, Iraq", 2020, "article", 1, "Biomarkers in Disease Mechanisms", "This study aims for estimate the association between diabetes mellitus type 2 (DMT2) and thyroid dysfunction (TD). For this purpose, a total of 161 diabetic patients [mellitus-type 2 (diabetic group)] and 40 healthy adults (control group), attended to the Al-Zahra Teaching Hospital (Al-Kut, Wasit, Iraq) during January to March 2020, were subjected for data collection and blood draining. Concerning to demographic data (sex, age, familial history, hypertension, residence, and time since diagnosis) respectively, there a higher significance (P 50 years than groups of 30-40 and 40-50 years, families having a history to diabetes than families without, non-hypertension group hypertension group, diabetic urban than rural patients, and moderately diagnosed diabetic patients than newly and elderly diabetic patients. To estimate the parameters of blood glucose and thyroid gland in newly diagnosed diabetic patients, significant increases (P 0.05) T3, T4, TSH, and Tg-Ab. In moderately diabetic patients, there significant elevation (P 0.05) were detected in T3 and TSH. For elderly patients, diabetic significant increases (P 0.05) in T3, T4, and TSH. Among the diabetic groups, FBS value of newly diabetic patients was appeared more significance (P 0.05) was detected between the values of HbA1c, T3, and TSH parameters of newly, moderately, and elderly diabetic patients."], ["https://openalex.org/W3033887155", "Presidential Elections and Stock Market: A Comparative Study", 2020, "article", 10, "Financial Markets and Investment Strategies", "Purpose- This paper is an event study that aims to find empirical evidence on the significance of the impact of presidential election outcome announcements on stock market return volatility in emerging markets versus developed markets; an application on the Egyptian and the US markets. Design/Methodology/ Approach- A mixed methods approach, combining qualitative data to guide sample selection and quantitative analysis to predominately conduct the empirical test was employed. The study used the mean-adjusted return model on secondary data collected for the EGX100 and S&P500 indices, for a single comparable election from each country. Findings- The empirical results show that presidential elections have no significant impact on stock market volatility in both markets, although the data suggests an increase in abnormal returns and a volatility decrease after each relevant election announcements. It is concluded that both markets efficiently absorb the news and reflect it into stock prices, as no statistically significant shifts in volatility can be detected. Originality/ Value- This study is unique as no existing studies addressed the issue of comparing different markets’ behaviour to presidential outcome announcements, and whether markets at different economic development stages may present similar efficiency in reacting to presidential elections. This can provide insight on emerging market behaviour, compared to developed markets, contributing to the comprehension of investors, academics and policymakers."], ["https://openalex.org/W3039395923", "Design and Development of Smart Belt for Blind", 2020, "article", 1, "Tactile and Sensory Interactions", "This work proposes a technique to help the special visually challenged people in their everyday life. The main agenda of this device is to provide a convenient and safe method for visually challenged people to overcome their difficulties. Flexibility, low cost, portability, simple design and practical to user is the goal of this project. The system proposed uses ultrasonic sensors to detect the obstacle in front of the user and identifies it by image processing and alerts the user by the Bluetooth enabled audio output device, so that the person can navigate through the obstacle with ease."], ["https://openalex.org/W3081775773", "Privacy-aware design for E-Health Information Systems", 2020, "article", 0, "Business Process Modeling and Analysis", null], ["https://openalex.org/W3082982938", "THE INFLUENCE OF E-SERVICE QUALITY AND PERCEIVED QUALITY ON CONSUMER LOYALTY OF ONLINE SHOP TOKOPEDIA USERS IN MALANG CITY", 2020, "article", 0, "Consumer Behavior and Marketing Influence", "The purpose of this study is to determine the effect of e-service quality and perceived quality on consumer loyalty of online shop users (research on Tokopedia) in Malang. This research is a research study with quantitative analysis using path analysis or commonly referred to as descriptive analysis. Data was collected through an online survey using a questionnaire instrument with responses that can be used from 100 respondents who use Tokopedia's online shop. The results of this study service quality and perceived quality in this study provide significant results on consumer loyalty. Future studies are expected to develop this research variable by adding independent variables namely Behavioral Intentions or directly to the Word of Mouth, Site Revisit, and Purchase Intention indicators. Keywords: E-service quality, perceived quality, consumer loyalty"], ["https://openalex.org/W3082303113", "An ESP Approach to Analyze the Current Teaching Practices and Curriculum of Political Science in University of Karachi", 2020, "article", 0, "EFL/ESL Teaching and Learning", "The paper tends to present an in-depth view of current practices to teach English in department of political science in one of the public sector universities of Sindh. It specifically narrows down its vision to teach specific English course to students of Political science in University of Karachi, Pakistan. The data has been collected with the help of three important methods. It was to find the appropriate curriculum of English that could have meet with the needs of students in specialty. The study even analyses the teaching strategies that have been adopted to teach English to students of political science. This step followed to decipher the learning lacks in students. The results have suggested for the design of specific English curriculum to the students of political science. The curriculum that could bring clarity in practices of teaching methodologies adopted to teach English in connection to particular norm of ESP practice and analysis of students’ wants. This has overall forwarded suggestions to incorporate teaching of ESP in department of political science that could result beneficial for learning of students."], ["https://openalex.org/W3047629292", "Electrically and Electrochemically Active Composite Based on Polyester/Reduced Graphene Oxide/Polypyrrole with Remarkable Washing Durability", 2020, "article", 0, "Conducting polymers and applications", null], ["https://openalex.org/W3080928534", "The robustness of the anchoring effect in valuation tasks", 2020, "article", 0, "Economic and Environmental Valuation", "I examined the robustness of the anchoring effect with respect to the method of valuation, type of anchor and the availability of information about the presented product. In four different laboratory experiments, I elicited consumer willingness to pay (WTP) for cosmetic product manipulating anchoring conditions (low vs. high anchor or no anchor vs. high anchor). I observed that only the market anchor (the real price of a similar product) had an impact on WTP. I also found that the strength of the anchoring effect is lower in incentivised valuation tasks compared to hypothetical anchoring questions (I observed a significant anchoring effect only in experiment with declarative valuations). My findings suggest that the robustness of the anchoring effect is limited."], ["https://openalex.org/W3044280841", "A Study to Assess the Sexual Knowledge and Attitude among Adolescents in Selected Colleges of Sri Ganganagar", 2020, "article", 0, "Adolescent Sexual and Reproductive Health", "Amanullah. S said that, the conventional and orthodox, who form the bulk of educated Indian society, sex is a dirty three letter word. The subject is regarded as something unsavoury not to be discussed casually. “Sexuality” is a complex phenomenon and refers to the awareness of, and reaction to, the biological characterization of the male and the female; in essence, it’s our relation to sex1."], ["https://openalex.org/W3046743168", "SURVEY ON FLY ASH BASED GEOPOLYMER CONCRETE", 2020, "article", 0, "Concrete and Cement Materials Research", "A comprehensive summary of the extensive studies conducted on fly ash-based geopolymer concrete is presented. Test data are used to identify the effects of salient factors that influence the properties of the geopolymer concrete in the fresh and hardened states. These results are utilized to propose a simple method for the design of geopolymer concrete mixtures. The economic merits of the geopolymer concrete are also mentioned. The behaviour of in filled stub column and hollow stub column is studied experimentally by applying gradual load along with analytical integrated the engineering behaviour of fly ash and GGBS synthesized binder at different mix proportions as well as at dissimilar curing environments and these properties are compared with conventional concrete. In addition, another local waste material, manufactured sand (M-sand), was used as a replacement for conventional sand by many researchers in the development of green geopolymer concrete, the finding of this review is we can use Fly Ash ,MK, GGBS, as binders to wholly replace conventional ordinary concrete would lead to alternate eco-friendly geopolymer matrix."], ["https://openalex.org/W3085770820", "THE EFFECTS OF ISLAMIC ETHICAL IDENTITY INDEX ON FINANCIAL PEPRFORMANCE", 2020, "article", 1, "Islamic Finance and Banking Studies", "This study examines,firstly, the influence of Islamic Ethical Identity disclosure on Return on Asset, Return on Equity, and Economic Value Added of Islamic Bank in Indonesia, Malaysia, and Gulf Cooperation Council (GCC) Countries, and secondly,this study also examines the differences of Islamic Ethical Identity disclosure and Financial Performance between Islamic Bank in Indonesia-Malaysia and GCC Countries.  This study uses panel data from 2008-2013 which published in website of each Islamic Bank selected as a sample in this study.The result of regression shows that the disclosure of Islamic Ethical Identity hasa signifficant effect on ROA, ROE, and EVA. Meanwhile, the result of independent T-test shows that there is no differences on Islamic Ethical Identity Disclosure and Financial Performance between Islamic Bank in Indonesia-Malaysia and GCC Countries."], ["https://openalex.org/W3045632171", "Technical Challenges & Countermeasures of Blockchain Technology Application in Lifelong Education", 2020, "article", 0, "Blockchain Technology Applications and Security", "The Ministry of Education of China released the Action Plan of Education Informatization 2.0 which put forward the blueprint and prospect of the application of information technology including blockchain in the open lifelong education. For the existing blockchain technology, there are still limitations and challenges in solving the problems of large amount of educational resources data and huge scale of learning groups which are unique to the open lifelong education. In this paper, five aspects are analyzed and corresponding countermeasures are put forward."], ["https://openalex.org/W3081386054", "The Effect of Anti-Money Laundering Regulations on Making Financial Decisions at Jordanian Commercial Banks", 2020, "article", 0, "Crime, Illicit Activities, and Governance", "This study aimed to measure the effect of Anti-money laundering on making financial decisions at Jordanian commercial banks. The study adopted the descriptive analytical method as the population of the study comprised all the 13 Jordanian commercial banks. The Statistical Package for Social Sciences was used to perform the required statistical tests such as descriptive statistics multiple linear regression to test the validity of the study model and the significance of the of independent variables on the dependent variable. The sampling unit included branch managers, their deputies and heads of departments in Jordanian commercial banks, at all administrative level summed to 198 individuals. The questionnaire that the study instrument was distributed to all of them. The study concluded many important results such as there is a statistically significant effect of Anti-Money Laundering Regulations on making financial decisions at Jordanian commercial banks. As well as, the study demonstrated that there is a statistically significant effect of the dimensions of money transfers risks and transaction risks on making financial decisions. In addition, there a virtual and insignificant effect of Bulk cash smuggling on making financial decisions. The study recommended that it is necessary to develop methods of limiting the risks of Money Laundering done by adding legal and Sharia character to illegal-obtained money so as to cover the original of this money or its real source."], ["https://openalex.org/W3106128481", "Breaking the 80% Barrier for Colorectal Cancer Screening Uptake", 2020, "article", 0, "Colorectal Cancer Screening and Detection", "Programmatic, or organized, screening for colorectal cancer (CRC) is associated with uptake rates exceeding 80%, but there are few data regarding the"], ["https://openalex.org/W3093848069", "Exploration on Diversification Path of Higher Education Investment", 2020, "article", 4, "Intellectual Capital and Performance Analysis", "In recent years, with the continuous development and progress of China's higher education, more and more attention is paid to the cultivation of talents. However, in the process of higher education development, there will be problems such as insufficient educational funds and unreasonable educational investment structure. Therefore, this paper mainly analyzes the development of China's colleges and universities, so as to establish a sound investment management system in colleges and universities, and realize the diversification of educational investment in colleges and universities. In order to better solve the problem of higher education funding, by expanding the sources of funding channels, so as to alleviate the problem of higher education funding, promote the rapid development of China's higher education cause, for the country to train high-quality talents."], ["https://openalex.org/W3091070207", "Efficient and Scalable Aggregate Computation on Temporal Graphs.", 2020, "article", 0, "Graph Theory and Algorithms", null], ["https://openalex.org/W3091452898", "Visual Speech Recognition of Lips Images Using Convolutional Neural Network in VGG-M Model.", 2020, "article", 9, "Speech and Audio Processing", null], ["https://openalex.org/W3095518132", "TIET at CLEF CheckThat! 2020: Verified Claim Retrieval.", 2020, "article", 1, "Topic Modeling", null], ["https://openalex.org/W3091392734", "The Relationship between a Patient and Clinician Reported Voice Tool in Pharyngeal and Laryngeal Cancer Post Organ Preservation", 2020, "article", 0, "Voice and Speech Disorders", "Background: Patients with pharyngeal and laryngeal cancers have voice problems either secondary to the tumour, treatment or both.\r\nAim: To study the relationship between a patient and a clinician reported voice tool in pharyngeal and laryngeal cancer undergoing organ preservation.\r\nMethodology: This was a prospective, cohort study conducted over 2 years at a single tertiary care center. The relationships between the voice handicap index (VHI) and GRBAS scale were studied in pharyngeal and laryngeal cancers before and after organ preservation. Mann Whitney U and Spearmans correlation were used for the statistical analysis. \r\nResults: Twenty-two patients (eighteen men and four women) were studied. In the pharyngeal group, before treatment, only ‘roughness’ component of GRBAS had strong positive correlations with VHI domains and total VHI scores (P .60). However, after treatment most parameters of GRBAS and VHI were strongly correlated (P .60). In the laryngeal group strong correlations were found between all the parameters of GRBAS and VHI both before and after treatment. All VHI and GRBAS scores were significantly different (P < .05) between the pharyngeal and laryngeal cohort before treatment, while after treatment only roughness, breathiness, asthenia, and strain were significantly different.\r\nConclusion: VHI and GRBAS are two common tools used for voice assessment. In laryngeal cancer even a small complaint should be treated with high index of suspicion indicating a thorough evaluation (strong positive correlation). However, in pharyngeal cancer any gross change in voice should be evaluated (positive correlation)."], ["https://openalex.org/W3097443224", "METHODS TO BUILD, DEVELOP MATHEMATICAL CONCEPTS AND SKILLS IN THE EARLY CHILDHOOD MATHEMATICS IN NIGERIA : 10.24250/JPE/2/2020/OO", 2020, "article", 0, "Mathematics Education and Pedagogy", "Effective teaching and learning of early childhood mathematics are of great importance to every countryâ€™s educational system, most especially in Nigeria. Early childhood mathematics is the first contact of young children with mathematics in the formal school setting. Therefore, this early stage must be well taken care of to foster and build a proper solid foundation in their mathematics education and other subjects. This stage of life is where mathematics concepts and skills can be developed in them for future use and success in school. Mathematics assist young children to think and make sense of the world around them. The paper looked at Nigeria education policy briefly, some of the ways effective teaching and learning of early childhood mathematics can be achieved and developing mathematical counting skills in early childhood mathematics. Some methods of teaching mathematics at the early childhood were also discussed."], ["https://openalex.org/W3103171242", "Palatal augmentation prosthesis for a patient with partial glossectomy: a case report", 2020, "article", 0, "Reconstructive Surgery and Microvascular Techniques", "Cancers of the tongue are generally treated with primary surgical resection, partial glossectomy being one of option. Treatment for oral cancer may optimize survival, decrements in speech and swallowing function and quality of life often result and moreover it affects communicative function, swallowing ability, and quality of life after primary surgery.This case report describes the fabrication of a palatal augmentation prosthesis for a patient who underwent partial glossectomy due to squamous cell carcinoma of the right lateral border of the tongue. In this case, anterior palatal augmentation was attempted."], ["https://openalex.org/W3093403214", "Decomposition of Response Time to Give Better Prediction of Children's Reading Comprehension.", 2020, "article", 4, "Intelligent Tutoring Systems and Adaptive Learning", null], ["https://openalex.org/W3093575288", "Developing and Studying the Effectiveness of Bioenergy Economy Program in Body Self-concept and Weight Loss of Women with Obesity", 2020, "article", 5, "Eating Disorders and Behaviors", "Background:Unusual accumulation of fat in the body is called overweight or obesity, which can affect health. This study tends to develop and investigate the effectiveness of bioenergy economy program  in body self-concept  and weight loss of women with obesity.\r\nMethods:The methodology used was a quasi-experimental design with pre-test, post-test, and control groups. The statistical population included obese people referred to psychological counselling centres and nutrition clinics in Tehran during 2019. Fifty obese women were selected by the convenience sampling method and randomly assigned to two experimental and control groups. Data were collected using Cash's Multidimensional Body Self Relations Questionnaire Then, weight and body mass index were calculated in the participants. According to guidelines for the bio economics protocol developed at the Energy Medicine University of California, a specific training package was developed for obesity and the intervention group was trained in eight sessions of 120 min for 8 weeks. Data were analysed by the analysis of covariance using SPSS software version 24.\r\nResults:The results showed that the effect of bioenergy economics was significant on the attitude towards body image (P < 0.01).\r\nConclusion:To conclude, a bioenergy economy program  can be an effective program in the body self-concept body self-concept . Considering the effect of this therapeutic approach on the body self-concept  and assuming the effects that may occur as a result of changes in this perception, it seems that this new intervention will have a positive effect on the weight control process over time. It is possible that the effect of this treatment on weight loss can also be seen by following this variable in the future."], ["https://openalex.org/W3199822751", "The effects of physically effective neutral detergent fibre content on growth performance and digestibility in beef cattle fed with total mixed ration.", 2020, "article", 1, "Ruminant Nutrition and Digestive Physiology", null], ["https://openalex.org/W3199946405", "Comparative Energy of Group Nodes of Sensor Based on Different Topology", 2021, "article", 0, "Energy Efficient Wireless Sensor Networks", "A variety of constraints, such as limited energy, latency, computer resource shortages, and poor communication quality, may be eased by employing alternative topologies in Wireless Enabled Sensor Networks (WESNs). The cost of receiving a packet is defined by its size, but the cost of energy transmission is determined by the distance between nodes. Topology, which defines the fundamental type of routing routes, determines the size, type of packets, and other overheads regardless of whether you use broadcast or unicast, so selecting the appropriate topology can help reduce the amount of communication required for a specific issue while also conserving energy. When the design is efficient and ensures that neighbors are not too far apart, the risk of a communication failure between sensors is lowered. It is also possible to use a topology to reduce radio interference and, as a result, the time it takes data transmission sensors to communicate their data. Aside from that, topology allows for data aggregation, which reduces processing cycles and energy consumption, allowing the network to operate for a longer period of time. It is important to create and test a completely new method of selecting community members for surrounding homogeneous Wireless Enabled Sensor Networks, which is now under consideration. To enhance efficiency, sites are uniformly distributed around the network. The parameters are studied and tested in this study utilizing the suggested approach of Comparative energy of sensor group nodes based on various topologies, which is detailed below. A recommended path that considers the power and variables that influence the flow of energy via the WESN. This is aware of the information and enables them to extend these types of algorithms, establish the validity, and construct larger algorithms of this phase, as the algebraic and graphical styles of such variants are frequently found, as they are aware of the information. The paper also includes a number of easily accessible algorithms that employ algorithms to manage these objects and notify them of available resources."], ["https://openalex.org/W3196488503", "Developing a Learning Module with Multicultural Content: A Source of Learning in the Millennial Era", 2021, "article", 0, "Educational Curriculum and Learning Methods", "Multi culture-based learning is learning that integrates multi culture in the learning materials and the learning process. Integrating multi culture in learning activities makes students aware of the different culture around them and increase students' appreciation towards other culture. This study aims to develop a multicultural-based short training module for Indonesian language teachers. This research is a development research that refers to the model of developing teaching materials with designs carried out in stages: analysis, design, development, implementation and evaluation. The subjects of this study were Indonesian language teachers as experienced practitioners in teaching Indonesian from different teaching places. The instruments used to measure the quality of the developed modules include the expert questionnaire, and module trial tests. The expert questionnaire was used to measure the validity of the module while the tryout of the module and multicultural attitude questionnaires were used to see the effectiveness of the module. The results of the development research that have been carried out showed that the short training module developed was categorized as an effective module and suitable to be used for the training. This study implies that an effective and well-developed learning module should be continually designed to improve the quality of learning process."], ["https://openalex.org/W3200611287", "Polycystic Kidney Disorder: Inheritance, Pathophysiology, Prognosis and Therapy", 2021, "article", 0, "Genetic and Kidney Cyst Diseases", "Both autosomal predominant and latent polycystic kidney sickness are conditions with extreme related bleakness and mortality. Late advances in the comprehension of the hereditary and atomic pathogenesis of both ADPKD and ARPKD have brought about new, designated treatments intended to upset cell flagging pathways liable for the unusual cell multiplication, dedifferentiation, apoptosis, and liquid emission normal for the infection. Thus we audit the ebb and flow comprehension of the pathophysiology of these conditions, just as the momentum medicines got from our comprehension of the systems of these infections."], ["https://openalex.org/W3196911548", "CAT gene polymorphism and some antioxidant levels after exercise in athletes of Babylon Gym Sport", 2020, "article", 0, "Exercise and Physiological Responses", "The multi-phenotype species has been recognized as several essential genetic different factors attributed to oxidative performance and stress in endurance events. Antioxidants like peroxidase of glutathione (GPX1), peroxide of dimethoxy (SOD) and catalase (CAT), decrease the organism’s oxidation levels. Catalase has a significant function in the reduction of hydrogen peroxide in cells of red blood, and the CAT gene determines its activity. This study concluded the role of free radicals in leading to stress of oxidative throughout practice, the current investigation was conducted in Hilla City to perform demographics, several blood variables and Catalase (CAT) gene polymorphism in athletes, the outcomes demonstrate that there are substantial variances in some demographic heterogeneity between control and athletes and all blood variables Superoxide Dismutase (SOD), Malondialdehyde, (MDA) were very high value for athletes, by using (PCR-SSCP) technique, (CAT) gene polymorphism no substantial connotation with athletes in four alleles."], ["https://openalex.org/W3198481979", "Combining B-spline least-square schemes with different weight functions to solve the generalized regularized long wave equation", 2022, "article", 1, "Advanced Numerical Analysis Techniques", "For solving differential equations, a variety of numerical methods are available, accuracy, performance, and application are all different. In this article, we proposed new numerical techniques for solving the generalized regularized long wave equation(GRLWE) that are based on types M and M-1 of B-splines-least-square method (BSLSM) and weight function of B-splines respectively, which were proposed previously for solving integro-differential equations [2] where $Min {N}$.  We investigated linear stability using a Fourier method."], ["https://openalex.org/W3197924002", "Does online instruction in discourse conventions of literary analysis affect L2 students’ critical stance in academic writing? A longitudinal study: A longitudinal study", 2021, "article", 1, "Discourse Analysis in Language Studies", "The purpose of this study is to explore L2 students’ longitudinal development of critical stance patterns in academic writing as a result of their exposure to online instruction in the discourse conventions of literary criticism. The data consisted of a 75661-word longitudinal corpus of 63 essay assignments, collected over 7 weeks’ instruction via pre-, during- and post-instruction google classroom submissions. Applying Martin & White’s (2005) appraisal taxonomy, the data was analyzed for frequency and wording differences using manual coding of attitude, graduation, and engagement markers through UAM Corpus Tool. The results show a significant longitudinal decrease in the use of linguistic resources which express personal feelings and make the construed evaluative meanings forceful and compelling. This shows that the teaching and the learning methods employed in the online instruction may have impacted L2 students’ ability to develop a formal style of academic writing; the results also indicate a less significant longitudinal increase in the use of linguistic resources that construe a register-appropriate critical stance, such as the use of attitude sub-types of judgment and appreciation. This shows that the teaching and learning methods employed in the online instruction may not have impacted L2 students’ ability to develop a register-appropriate critical stance. These findings have far-reaching implications for the use of online mode to make explicit the discourse conventions of literary criticism to L2 students. They show the extent to which the integration of certain teaching and learning methods in online instruction has an impact on L2 students' academic writing."], ["https://openalex.org/W3202287104", "GEOMETRY AS ASSEMBLY IN ARCHITECTURE. SEMI-REGULAR POLYHEDRA", 2020, "article", 2, "Modular Robots and Swarm Intelligence", "When the principle of modular assembly of semi-regulated polyhedra is applied in architectural design, we obtain functional and structural autonomous architectural structures, based on a common matrix system. This system is subdivided into modules that allow independent changes or adjustments and offers great adaptability to the environment. The development of computer technology and 3D printing enables tessellation of more spectacular geometric modules. The studied surface is much easier to control both in terms of shape and structure. Therefore, research on the applications of modular assembly in the design of architectural geometry it is a great necessity for architectural studies. This paper aims to present several buildings that use the three-dimensional assembly of semi-regular polyhedra, explore the feasibility and significance of application of modular assembly in architectural geometry design and can be considered the beginning of a much more detailed ongoing research."], ["https://openalex.org/W3201673895", "Characterizing CNAME Cloaking-based Tracking on the Web.", 2020, "article", 13, "Speech and dialogue systems", null], ["https://openalex.org/W3197054799", "Whole Body Vibration Training Impact on Pulse Wave Velocity in Obese Postmenopausal Women with Arterial Stiffness", 2021, "article", 0, "Cardiovascular Health and Disease Prevention", "Background: Menopause boosts the age-related increment in blood vessel firmness during the early postmenopausal stage and that this increase is likely related, to estrogen lack.\r\nAim of the study: is to determine the effect of whole body vibration training (WBVT) on pulse wave velocity in obese postmenopausal women with arterial stiffness. \r\nMaterials and Methods: Forty obese postmenopausal women with arterial stiffness participated in this study. They were selected from the vascular department, Kasr El Einy hospital. Their ages were ranged from 60 - 70 years and Body mass index (BMI)>35 kg/m2. They were randomly divided in two groups, Group (A) included 20 patients who received WBVT for 12 weeks, 40 minutes/session, in addition to their regular medications prescribed by their physician. Group (B) only received their regular medications prescribed by their physician. Brachial-ankle PWV, femoral-ankle PWV (legPWV) were measured before and after 12 weeks.\r\nResults: Both brachial-ankle PWV and leg PWV showed statistically significant decrease in group A, while there was no significant reduction in group B.\r\nConclusions: Whole body vibration is a useful tool in decreasing arterial stiffness in obese postmenopausal women."], ["https://openalex.org/W3011828716", "Delegation and Collaboration Practices to Embrace Innovative Ideas for Business Growth in Small to Medium Enterprises", 2020, "article", 2, "Innovation and Knowledge Management", "With increasing global competitiveness and sustainability challenges, Small to Mediums Enterprises (SMEs) are under on-going pressure to innovate and develop effective strategies to engage their employees for enhanced productivity and growth. Further, the local decision makers in a country-wide environment consider SMEs as critical success factors for future economic growth and job creation. This study presents analysis of the SEMs reaction to these external and internal factors, in particular, how to promote new business ideas through enhancement of employees’ engagement by increased delegation of authorities to subordinates and by encouraging employees to share information within the firm. Delegation for decision making helps to increases employees’ commitment and the internal competitiveness between rivals to drive business growth. While internal collaboration enhances communications between employees to share ideas which in turns provide tangible additives to the business processes that further enhances growth. The study starts by developing a conceptual model that associate the internal delegation and collaboration with new business ideas and with business growth. The relevant hypotheses are developed, and the models are analysed and tested using standardized mediation procedures via SPSS statistical package. The mediation effect of delegation and collaboration on the relationship between SMEs’ strategies to embrace new business ideas and the business growth are studied. The results showed that delegation has more positive impact on the business growth compared with only ideas sharing and internal collaboration. However, although to different extents, both the delegation of authorities and the encouragement of employees to collaborate by sharing new ideas participate in enhancing business growth. These findings are discussed considering required support for policy makers to develop awareness channels for SMEs to incorporate delegation and internal collaboration as integral components of their strategic planning."], ["https://openalex.org/W3013182881", "Dance College Students Major in Perfectionism and Self-concept Compared to Dance Performance Satisfaction", 2020, "article", 0, "Perfectionism, Procrastination, Anxiety Studies", null], ["https://openalex.org/W3009895779", "Estimation of Dynamic PCU values at Signalized Intersection in Ahmedabad city", 2020, "article", 0, "Traffic control and management", null], ["https://openalex.org/W3016528681", "Middle Cerebral Artery Stroke", 2020, "article", 29, "Acute Ischemic Stroke Management", "The middle cerebral artery (MCA) is the most common artery involved in acute stroke. It branches directly from the internal carotid artery and consists of four main branches, M1, M2, M3, and M4. These vessels provide blood supply to parts of the frontal, temporal, and parietal lobes of the brain, as well as deeper structures, including the caudate, internal capsule, and thalamus. Its vast supply means that strokes involving the MCA territory can have a multitude of presenting symptoms, depending on which branches and structures are affected."], ["https://openalex.org/W3013825341", "Technology Embracing by 3PL Service Providers in India: Tuticorin Port Trust – A Case Study", 2020, "article", 7, "Maritime Ports and Logistics", null], ["https://openalex.org/W3011875814", "The role of businesses in a thriving society", 2020, "article", 1, "Global Peace and Security Dynamics", "espanolEste articulo argumenta que las sociedades humanas pueden prosperar si logran promover un circulo virtuoso entre el respeto de los derechos humanos, el desarrollo humano, y la paz. Estos objetivos son interdependientes. Por lo tanto, ninguno de ellos puede ser alcanzado sin los otros dos. Las empresas juegan un rol crucial en este proceso a traves de su actividad economica, que puede contribuir o impedir el logro de cada uno de los componentes del circulo virtuoso. En este orden de ideas, los estados deben requerir legalmente a las empresas que respeten los derechos humanos e implementar mecanismos legales para remediar los abusos corporativos; (2) disenar normas de proteccion de la inversion extranjera y del comercio que garanticen suficiente libertad a los estados para perseguir intereses sociales, aunque estos vayan en detrimento de los inversores extranjeros; y (3) promover un sistema de incentivos para que las empresas actuen solidariamente. EnglishThis article argues that human societies can thrive if they are able to promote a virtuous circle of human rights, respect, human development, and peace. These goals are interdependent. Therefore, neither of them can be achieved without the other two. Businesses play a crucial role in this process through their economic activity, which contributes or impedes the achievement of each of the components of the virtuous circle. Accordingly, governments should legally require businesses to respect human rights and implement legal mechanisms to remedy corporate abuses; (2) design foreign investment protection and trade regulations that allow governments to have enough freedom to pursue social interests even in detriment of foreign investors; and; (3) promote a system of incentives for businesses to act severally."], ["https://openalex.org/W3017048862", "A Southeastern North America River Community Forty-Thousand Years Ago", 2020, "article", 0, "Archaeology and Natural History", null], ["https://openalex.org/W3011897311", "Numerical Simulation and Parametric Reduced Order Modeling of the Natural Convection of Water-Copper Nanofluid", 2020, "article", 0, "Model Reduction and Neural Networks", "In this article, a coupled computational framework is presented for the numerical simulation of mass transfer under the effects of natural convection phenomena in a field contains water-copper Nano-fluid. This CFD model is build up based on accurate algorithms for spatial derivatives and time integration. The spatial derivatives have been calculated using first order upwind and second order central differencing approaches. Also, time integration is performed using the fourth order Runge-Kutta method. A parametric reduced order model is developed to compute the whole flow field under the effects of some important parameters. This model is constructed using POD-snapshots method based on Karhunen-Loeve decomposition. The POD modes have been calculated based on the solution of an eigenvalues problem. The obtained eigenfunctions are POD modes which are arranged using energy-based criteria based on total kinetic energy of the flow field. This approach leads to the model order reduction procedure, and the outcome model can be used as a surrogate model of CFD high order model. The results obtained from the reduced order model show close agreements to the benchmark DNS data and proving high accuracy of the proposed model."], ["https://openalex.org/W3083389088", "The Study of CSR Spent in Indian Banking Industry", 2020, "article", 4, "Innovations and Analysis in Business and Education", null], ["https://openalex.org/W3045070639", "MOTOR ENTROPY INFLUENCE ON SPORT RESULTS: USAIN BOLT'S RECORD-BREAKING RACE EXAMPLE", 2020, "article", 0, "Diverse Interdisciplinary Research Studies", null], ["https://openalex.org/W3162098541", "SCRUTINIZATION OF MOVIE SUCCESS USING MACHINE LEARNING TECHNIQUE", 2021, "article", 0, "Neural Networks and Applications", "The classical factors include producer, production house, director, cast, runtime of the movie, the genre, the script, time of release etc.,. All these factors play a very vital role in determining whether a film will be successful.Polynomial regression means plotting up a graph and it shows the relationship between dependent variable y and independent variables x. This project helps to analyse the success of the film using the machine learning algorithm. Data Science paves a way to extract useful information and to gain insight on it."], ["https://openalex.org/W3163638889", "UNDERGROUND CABLE FAULT DETECTION SYSTEM", 2021, "article", 2, "Power Quality and Harmonics", "The main objective of this project is to detect the faults and abnormalities occurring in underground cables using an Arduino. The basic idea behind the working of this project is ohms’s law .At the feeder end ,when a DC voltage is applied, based on the location of fault in the cable ,the value of current also changes.\r\nSo in case of a short circuit fault like L-G or L-L fault the change in voltage value measured across the resistor is then fed to the in-built ADC of the Arduino. This value is processed by the Arduino and the fault is calculated in terms of distance from the base station. This value is sent to the LCD interfaced to the Arduino board and it displays exact location of the fault from the base station in kilometers for all the three phases. This project is arranged with a set of resistors which represent the length of the cable. At every known kilometer fault switches are placed to induce faults manually. Finally the fault distance can be determined."], ["https://openalex.org/W3165067424", "Social Networks as Tools to Promote the Majors of Higher Education Institutions During the Pandemic.", 2021, "article", 0, "Mobile Learning in Education", null], ["https://openalex.org/W3159939129", "EDUCATION THROUGH CULTURE AND CULTURAL CONSUMPTION IN FORMAL EDUCATION, IN PRIMARY EDUCATION: doi>10.24250/jpe/1/2021/DRC", 2021, "article", 0, "Healthcare during COVID-19 Pandemic", "This study aims to determine the extent to which online cultural activities can develop interest in authentic values, well-being, knowledge and creative expression of culture in the instructional-educational process. Knowing that cultural activities are a complement to curricular actions, these being actions exercised by adults on the young generation in the form of an interpersonal relationship in order to form the good skills necessary for a harmonious social life, I believe that the rope of cultural activities can intertwine with the obtained intellectual results, with the formation of the adult with an educational potential involved in the instructive-educational process, thus resulting the development of the psychosocial competencies of those involved, facilitating at the same time their social integration and assuming the role of belonging to the community group."], ["https://openalex.org/W3046480436", "Social media as a communicative platform to promote indigenous African Languages by youth students at a Rural Based University, South Africa", 2020, "article", 2, "Digital Communication and Language", "This article sought to investigate the role played by social media in promoting indigenous African languages by students at a rural based university in South Africa. Globally, language(s) could be acquired and promoted through various platforms of social interaction, such as family, schools and social media. This paper is qualitative in nature and descriptive research design had been used to answer the research problem and objectives. Ten (10) youth students were purposively selected to participate in this study and data solicited through semi-structured interview were analysed through Thematic Content Analysis technique. Furthermore, the article established that even though English is still a dominant language of communication; youth are playing a significant role in promoting indigenous African languages through social media as communicative platforms. The findings further provide a significant insight into youth’ usage of social media like WhatsApp as a communicative platform to promote previously disadvantaged and marginalised African languages.\r\nKeywords: Indigenous African languages, Promotion, Rural University, Social media, WhatsApp and Youth students."], ["https://openalex.org/W3084598953", "ANAESTHETIC MANAGEMENT IN A LOW GRADE GLIOMA TUMOUR INVOLVING THE LEFT PARIETAL REGION POSTED FOR AWAKE CRANIOTOMY-A CASE REPORT", 2020, "article", 0, "Anesthesia and Sedative Agents", "INTRODUCTION: Awake craniotomy means the craniotomy where a patient remains awake during whole or part of the surgery.It is performed for intraoperative functional cortical mapping and intraoperative electrocorticography for localisation of epileptic foci. CASE REPORT: A 14 years old male patient weighing 35kgs having low grade left parietal lobe glioma posted for awake craniotomy.Patient was managed with propofol and dexmedetomidine infusion and scalp block.Goals of anaesthesia are to provide optimal psychological care and ensuring minimal discomfort to the patient without using drugs or techniques which make functional monitoring possible. Appropriate selection of patients and titrated use of sedatives,analgesic and anaesthetic agents are key CONCLUSION: to success. RESULTS: Patient was hemodynamically stable and cooperative throughout the surgery.Perioperative period was uneventful."], ["https://openalex.org/W3048424607", "Teaching Global Health in the Time of Covid-19: Key Concepts for Social Studies Classrooms", 2020, "article", 1, "Viral Infections and Outbreaks Research", "This article highlights the promise of global health approaches for social studies curricula, especially urgent in the time of the Covid-19 pandemic. Focusing on six facets that inform a global health perspective, the authors offer social studies educators an approach from this applied field of study to support lessons and curriculum on Covid-19 across sociology, geography, and other disciplines within social studies education. The authors provide select digital resources for teachers and students to use in learning and teaching about the Covid-19 pandemic through a global health perspective aligned with the National Council for the Social Studies’ Thematic Standards."], ["https://openalex.org/W3085146695", "Deducing the digital evaporation loss model of high dam reservoir", 2020, "article", 0, "Plant Water Relations and Carbon Dynamics", "Evaporation is the most negative phenomenon, causing huge losses in the water capacities of reservoirs. For example, evaporation at the High Dam (HD) reservoir (the water resources bank of Egypt that supplies Egypt with about 97% of its freshwater needs) which is characterized by its large water surface area (about 6000 km2 at water level 178 A.M.S.L). This reservoir, due its geographical location, is exposed to a range of climatic factors which increase evaporation rate annually, and consequently, increase the total loss of its capacity (about 10 Billion m3 of the HD reservoir capacity is lost annually due to evaporation phenomenon). Many organizations rely on an evaporation chart that gives the value of evaporation loss according to some climate variables. With respect to the problem of malfunctions of some stations, or in case of lack of data for any reason, it is important to have a digital evaporation loss model that gives the missed evaporation loss in the High Dam reservoir directly, according to two factors; the given month and the average monthly water level. This paper will explain how to get benefit from the available data of hydro-meteorological stations distributed within the High Dam reservoir, to predict the digital evaporation loss surface using the GIS prediction and conversion tools."], ["https://openalex.org/W3083958632", "RIGGING LESS FINGER PRINT BASED VOTING MACHINE USING IOT", 2020, "article", 0, "Biometric Identification and Security", null], ["https://openalex.org/W3080992014", "Ct-Scan inspection Lower Abdomen on suspicion of cervical carcinoma at Dr Haji Adam Malik: Ct-Scan inspection Lower Abdomen on suspicion of cervical carcinoma at Dr Haji Adam Malik", 2020, "article", 0, "Computer Science and Engineering", "The abdomen is the largest cavity in the body that is oval shaped and extends from the pelvic diaphragm at the top to the bottom. Cervical carcinoma is a malignant tumor in the lower part of the uterus. For Carsinoma by disclosing cervicks uteri using aircraft CT Scan 4 (four) with a slice helical techniques that produce 4 slides per one rotation tehadap tube detector. Aircraft used CT scans of the Toshiba brand, generation III / Helicle Capabilities. The test results showed suspicion Ca cervix."], ["https://openalex.org/W3023136043", "Disease Modifying Anti Rheumatic Drugs in Sudanese Patients with Rheumatoid Arthritis", 2020, "article", 0, "Rheumatoid Arthritis Research and Therapies", "Objectives: To know about DMARDs (Disease modifying anti rheumatic drugs) used by Sudanese rheumatoid arthritis patients, the type mostly used, single or combined and to assess functional disability by health assessment questionnaire (HAQ) and disease activity by clinical disease activity index (CDAI) with each type used and the time of initiation of DMARDs therapy from the diagnosis, also to see the effect of combined therapy on functional disability and disease activity. Materials and Methods: This was descriptive cross sectional study hospital based of 100 patients diagnosed as RA by the American College of Rheumatology (ACR-EURAL 2010) criteria attending different rheumatology referred clinics from Nov 2014to Jan 2015 patients were interviewed and asked about their DMARDs which type is used and when it started from the time of diagnosis then HAQ is filled and CDAI is calculated. Results: We had analyzed 100 patients the type of their DMARD, HAQ, CDAI the time of initiation of DMARDs with the diagnosis effect on HAQ and CDAI, also the effect of combined therapy on HAQ and CDAI. We found that the age between 36-45 were mostly affected and that 95% was female. 71% were using Hydroxychloroqine (HCQ), 49% Methotrexate (MTX), 6% Leflounimide (LEFLU), 2% Sulphasalzine and 3% Azathioprine (AZA). Most patients showed minimal HAQ (69.0%) score, 64% of the study population start DMARD at the time of diagnosis. About 36% used combined MTX and HCQ. Low CDAI was the most common in patients taking MTX and HCQ, also the most common score of HAQ in them was minimal score. There is no significant difference (P value 0.23) between early initiation of DMARDs and disease activity, also the difference was not significant between the time of initiation of DMARDs and HAQ score (P 0.036). There is significant difference between the use of combined DMARDs and CDAI and HAQ score (P 0.001, P 0.004) respectively. Conclusion: The most commonly used DMARDs are HCQ and MTX, Combination therapy is not widely used in the study patient, Most of the study patients show minimal functional disability assessed by HAQ. MTX and HCQ affect disease activity and functional disability almost in the same manner, patients in the study using MTX and HCQ show minimal score using HAQ, small percentage show remission and no remission with other type of DMARDs. Early initiation of DMARDs doesn’t affect functional disability and disease activity. While combination therapy of DMARDs affect both disease activity assessed by CDAI and functional disability assed by HAQ score."], ["https://openalex.org/W3148869023", "ComMA@FIRE 2020: Exploring Multilingual Joint Training across different Classification Tasks.", 2020, "article", 2, "Topic Modeling", null], ["https://openalex.org/W3156458817", "Polypoidal Choroidal Vasculopathy", 2021, "article", 0, "Retinal Diseases and Treatments", "Polypoidal choroidal vasculopathy (PCV) is an exudative maculopathy characterized by multiple recurrent serosanguineous retinal pigment epithelial detachments (PED). It is similar to neovascular age-related macular degeneration in morphological characteristics. It was first described by Yannuzzi et al. at an annual meeting of the American Academy of Ophthalmology in 1982 and termed as idiopathic polypoidal choroidal vasculopathy (IPCV). in 1984, Kleiner et al. described a similar presentation in middle-aged black women and named it posterior uveal bleeding syndrome (PUBS). Later, Yannuzzi et al. described PCV in detail and established its existence across both genders, various age groups, and races."], ["https://openalex.org/W3153954925", "Assessment of Fenestration Design Towards Energy Conservation for an Office Building", 2021, "article", 0, "Building Energy and Comfort Optimization", "The aim of this paper is to investigate the influence of fenestration design towards achievability of energy conservation and optimum daylighting in office buildings. Energy and daylighting simulation will be carried out by using climate data. Data regarding several parameters of building envelope (wall, roof, window, shading etc.) will be required to carry out the simulations. ECBC recommended values will be used to check the achievability of desired results in warm and humid climate. Analytical tools to be used to process the data are eQUEST (DOE-2.2), Microsoft Excel and S
